<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GENUS — German noun gender trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAF7; --grid:#E4E9ED; --ink:#16181B; --muted:#63696F;
  --line:#DCDED8; --card:#FFFFFF;
  --der:#1D4E89; --die:#B5323C; --das:#2C7A55;
  --der-bg:#E8EEF6; --die-bg:#F8EAEB; --das-bg:#E7F1EC;
  --serif:'Newsreader',Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--ink);background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px 24px);
  display:flex;flex-direction:column;
  font-size:16px;line-height:1.5;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:14px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:1px solid var(--line);background:rgba(250,250,247,.94);
  backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;
}
.brand{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.22em;line-height:1}
.brand em{font-style:normal;color:var(--die)}
.meter{flex:1;min-width:0}
.meter-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
.bar{height:6px;background:#EAEBE6;border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m-der{background:var(--der)} .bar .m-die{background:var(--die)} .bar .m-das{background:var(--das)}
.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:#EFF0EC;color:var(--ink)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- layout ---------- */
main{flex:1;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{width:100%;max-width:660px;margin:0 auto;padding:0 16px 24px;flex:1;display:flex;flex-direction:column}
.view{display:none;flex:1;flex-direction:column}
.view.on{display:flex}

/* ---------- drill card ---------- */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0 8px;min-height:230px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:14px}
.eyebrow b{color:var(--ink);font-weight:500}
.prompt{
  font-family:var(--serif);font-weight:500;text-align:center;
  font-size:clamp(2rem,8.5vw,3.5rem);line-height:1.12;letter-spacing:-.015em;
  overflow-wrap:anywhere;
}
.prompt.small{font-size:clamp(1.25rem,4.6vw,1.75rem);line-height:1.32;font-weight:400}
.subprompt{text-align:center;color:var(--muted);font-size:14px;margin-top:12px;line-height:1.45}
.blank{color:var(--muted);letter-spacing:.06em}

/* ---------- gender bar (signature) ---------- */
.genus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.g{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 4px 14px;font-family:var(--serif);font-size:24px;font-weight:500;
  transition:transform .1s,background .12s,border-color .12s;
}
.g::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.g .kbd{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:5px;letter-spacing:.08em}
.g[data-g=der]{color:var(--der)} .g[data-g=der]::before{background:var(--der)}
.g[data-g=die]{color:var(--die)} .g[data-g=die]::before{background:var(--die)}
.g[data-g=das]{color:var(--das)} .g[data-g=das]::before{background:var(--das)}
.g:not(:disabled):hover[data-g=der]{background:var(--der-bg);border-color:var(--der)}
.g:not(:disabled):hover[data-g=die]{background:var(--die-bg);border-color:var(--die)}
.g:not(:disabled):hover[data-g=das]{background:var(--das-bg);border-color:var(--das)}
.g:not(:disabled):active{transform:translateY(1px)}
.g.right[data-g=der]{background:var(--der);color:#fff;border-color:var(--der)}
.g.right[data-g=die]{background:var(--die);color:#fff;border-color:var(--die)}
.g.right[data-g=das]{background:var(--das);color:#fff;border-color:var(--das)}
.g.right .kbd{color:rgba(255,255,255,.7)}
.g.wrong{background:#F3F3F0;color:var(--muted)!important;border-color:var(--line);text-decoration:line-through}
.g.wrong::before{background:var(--line)}
.g.dim{opacity:.42}
.g:disabled{cursor:default}

/* ---------- multiple choice ---------- */
.mc{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;font-size:15.5px;line-height:1.4;transition:background .12s,border-color .12s;
}
.opt .n{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:3px;flex:none;width:12px}
.opt:not(:disabled):hover{border-color:var(--ink);background:#FCFCFA}
.opt.right{border-color:var(--das);background:var(--das-bg)}
.opt.right .n{color:var(--das)}
.opt.wrong{border-color:var(--die);background:var(--die-bg)}
.opt.wrong .n{color:var(--die)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}

/* ---------- typed input ---------- */
.type-row{display:flex;gap:8px;margin-top:6px}
.type-row input{
  flex:1;min-width:0;font-family:var(--serif);font-size:22px;padding:13px 15px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);
}
.type-row input::placeholder{color:#B9BDC2;font-size:17px;font-family:var(--sans)}
.type-row input.right{border-color:var(--das);background:var(--das-bg)}
.type-row input.wrong{border-color:var(--die);background:var(--die-bg)}
.btn{
  background:var(--ink);color:var(--paper);border-radius:var(--r);padding:0 20px;
  font-size:15px;font-weight:500;flex:none;
}
.btn:hover{background:#33373C}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{background:#F1F2EE;color:var(--ink)}
.umlauts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.umlauts button{
  font-family:var(--serif);font-size:17px;width:40px;height:36px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--muted)
}
.umlauts button:hover{color:var(--ink);border-color:var(--ink)}

/* ---------- feedback ---------- */
.fb{margin-top:14px;border-left:3px solid var(--line);padding:2px 0 2px 14px;animation:rise .18s ease-out;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.fb.ok{border-color:var(--das)} .fb.no{border-color:var(--die)}
.fb-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.verdict{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.fb.ok .verdict{color:var(--das)} .fb.no .verdict{color:var(--die)}
.rule-name{font-size:13.5px;font-weight:600}
.fb p{margin:0;font-size:14.5px;line-height:1.55;color:#3A3E44}
.fb p + p{margin-top:6px}
.fb .tip{color:var(--muted);font-size:13.5px}
.fb .de{font-family:var(--serif);font-size:15.5px}

.footbar{display:flex;align-items:center;gap:12px;padding-top:14px;margin-top:auto;border-top:1px solid var(--line)}
.pill{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em}
.pill b{color:var(--ink);font-weight:500}
.spacer{flex:1}
.hintline{font-family:var(--mono);font-size:10.5px;color:#7B8087;text-align:center;padding-top:9px}

/* ---------- session end ---------- */
.done{text-align:center;padding:34px 0}
.done h2{font-family:var(--serif);font-size:30px;font-weight:500;margin:0 0 6px}
.done .score{font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:22px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:500}
.stat .k{font-size:11px;color:var(--muted);margin-top:2px}

/* ---------- Regelkarte ---------- */
.sec-title{font-family:var(--serif);font-size:25px;font-weight:500;margin:22px 0 3px}
.sec-sub{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.5}
.fam{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:22px 0 9px;display:flex;align-items:center;gap:10px}
.fam::after{content:'';flex:1;height:1px;background:var(--line)}
.rules{display:flex;flex-direction:column;gap:6px}
.rule-row{
  display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 13px;text-align:left;width:100%;
}
.rule-row:hover{border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:99px;flex:none}
.dot.der{background:var(--der)} .dot.die{background:var(--die)} .dot.das{background:var(--das)} .dot.mix{background:var(--muted)}
.rule-row .nm{font-family:var(--serif);font-size:16px;flex:1;min-width:0}
.rule-row .ct{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none}
.mini{width:56px;height:5px;background:#EAEBE6;border-radius:99px;overflow:hidden;flex:none}
.mini i{display:block;height:100%;background:var(--ink)}
.mini i.full{background:var(--das)}

/* ---------- detail panel ---------- */
.detail{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:10px}
.detail h3{font-family:var(--serif);font-size:20px;font-weight:500;margin:0 0 6px}
.detail .tip{font-size:14.5px;color:#3A3E44;line-height:1.55;margin:0 0 14px}
.words{display:flex;flex-wrap:wrap;gap:5px}
.w{font-family:var(--serif);font-size:14.5px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--paper)}
.w.der{color:var(--der);border-color:#C6D5E7} .w.die{color:var(--die);border-color:#EBCFD1} .w.das{color:var(--das);border-color:#C7DFD3}
.w.exc{font-style:italic}
.w.done{box-shadow:inset 0 0 0 1px currentColor}
.legend{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:12px 0 0;line-height:1.6}

/* ---------- stats ---------- */
.bias{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.bias-row{display:flex;align-items:center;gap:11px}
.bias-lab{font-family:var(--serif);font-size:17px;width:44px;flex:none}
.bias-lab.der{color:var(--der)} .bias-lab.die{color:var(--die)} .bias-lab.das{color:var(--das)}
.bias-track{flex:1;height:22px;background:#EFF0EC;border-radius:5px;position:relative;overflow:hidden}
.bias-track i{position:absolute;left:0;top:0;bottom:0;opacity:.3}
.bias-track u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);text-decoration:none}
.bias-track i.der{background:var(--der)} .bias-track i.die{background:var(--die)} .bias-track i.das{background:var(--das)}
.bias-num{font-family:var(--mono);font-size:11px;color:var(--muted);width:74px;flex:none;text-align:right}

/* ---------- settings ---------- */
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{
  border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:13.5px;
}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field{margin-top:22px}
.field h4{font-size:13px;font-weight:600;margin:0 0 2px}
.field p{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
.danger{color:var(--die);border-color:#EBCFD1}
.danger:hover{background:var(--die);color:#fff;border-color:var(--die)}
.saved{font-family:var(--mono);font-size:10.5px;color:var(--muted)}

/* ---------- nav ---------- */
nav{
  display:flex;border-top:1px solid var(--line);background:rgba(250,250,247,.95);
  backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom);position:sticky;bottom:0;z-index:20;
}
nav button{
  flex:1;padding:11px 4px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);border-top:2px solid transparent;margin-top:-1px;
}
nav button[aria-current=page]{color:var(--ink);border-top-color:var(--ink)}

.empty{text-align:center;color:var(--muted);padding:46px 16px;font-size:15px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:620px){ .g{font-size:27px;padding:19px 4px 16px} }
</style>
</head>
<body>
<header>
  <div class="brand">G<em>E</em>NUS</div>
  <div class="meter">
    <div class="meter-top"><span id="mLabel">—</span><span id="mPct">0%</span></div>
    <div class="bar"><i class="m-der" id="bDer"></i><i class="m-die" id="bDie"></i><i class="m-das" id="bDas"></i></div>
  </div>
  <button class="icon-btn" id="toSettings" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main>
  <div class="wrap">
    <section class="view on" id="v-drill"></section>
    <section class="view" id="v-rules"></section>
    <section class="view" id="v-stats"></section>
    <section class="view" id="v-set"></section>
  </div>
</main>

<nav>
  <button data-view="drill" aria-current="page">Drill</button>
  <button data-view="rules">Rules</button>
  <button data-view="stats">Stats</button>
</nav>

<script>
/* ============================================================
   RULES — each rule declares the gender it predicts.
   family: 'ending' | 'meaning' | 'formation'
   ============================================================ */
const RULES = {
  /* --- Masculine endings --- */
  e_ismus:   {g:'der', name:'-ismus', family:'ending', tip:'Always masculine. der Kapitalismus, der Tourismus.'},
  e_ling:    {g:'der', name:'-ling', family:'ending', tip:'Always masculine. der Lehrling, der Frühling.'},
  e_ist:     {g:'der', name:'-ist', family:'ending', tip:'Masculine (a male person). The female form takes -in: die Polizistin.'},
  e_igich:   {g:'der', name:'-ig / -ich', family:'ending', tip:'Masculine. der Honig, der Teppich. Watch out: das Reisig, das Reich.'},
  e_antent:  {g:'der', name:'-ant / -ent', family:'ending', tip:'Reliable for people: der Student, der Praktikant. Non-persons are often neuter: das Talent, das Prozent.'},
  e_oreur:   {g:'der', name:'-or / -eur / -är', family:'ending', tip:'Masculine. der Motor, der Ingenieur, der Sekretär. Exceptions: das Labor, das Tor, das Moor, das Chlor, das Militär.'},
  e_er:      {g:'der', name:'-er', family:'ending', tip:'Only reliable as an agent suffix on a verb: fahren → der Fahrer. Plain nouns ending in -er go every which way: die Mutter, das Fenster.'},
  e_stem:    {g:'der', name:'Verb stem, no suffix', family:'ending', tip:'fliegen → der Flug, springen → der Sprung. Exceptions: das Spiel, das Bad, das Grab.'},

  /* --- Feminine endings --- */
  e_heit:    {g:'die', name:'-heit / -keit', family:'ending', tip:'Always feminine. die Freiheit, die Möglichkeit.'},
  e_schaft:  {g:'die', name:'-schaft', family:'ending', tip:'Always feminine. die Freundschaft, die Wissenschaft.'},
  e_ung:     {g:'die', name:'-ung', family:'ending', tip:'Feminine when it is the suffix on a verb: wohnen → die Wohnung. A stem that merely ends in those letters is masculine: der Sprung, der Schwung.'},
  e_ei:      {g:'die', name:'-ei', family:'ending', tip:'Feminine as a suffix. die Bäckerei, die Polizei. Not the same as a stem ending in -ei: das Ei, der Brei.'},
  e_in:      {g:'die', name:'-in (female person)', family:'ending', tip:'Always feminine when it makes a female form: die Lehrerin. Loanwords that merely end in -in are unrelated: der Termin, das Benzin.'},
  e_iontaet: {g:'die', name:'-ion / -tät / -ik / -ur', family:'ending', tip:'Feminine. die Nation, die Universität, die Musik, die Natur. Exceptions: das Ion, das Stadion, das Abitur, das Futur, das Mosaik, der Atlantik, der Pazifik.'},
  e_anzenz:  {g:'die', name:'-anz / -enz / -age / -ie', family:'ending', tip:'Feminine. die Distanz, die Konferenz, die Garage, die Energie. Exceptions: das Genie, das Knie, das Image.'},
  e_e:       {g:'die', name:'-e', family:'ending', tip:'~90% feminine. Most masculine exceptions are n-declension nouns for male people and animals: der Junge, der Kollege, der Löwe.'},

  /* --- Neuter endings --- */
  e_chen:    {g:'das', name:'-chen / -lein', family:'ending', tip:'Always neuter, whatever the base noun was. die Stadt → das Städtchen. But der Kuchen and der Knochen are not diminutives.'},
  e_inf:     {g:'das', name:'Nominalised infinitive', family:'ending', tip:'Always neuter. essen → das Essen, leben → das Leben.'},
  e_um:      {g:'das', name:'-um', family:'ending', tip:'Neuter. das Zentrum, das Museum. Exceptions: der Konsum, der Irrtum, der Reichtum. Not the same as a stem in -aum: der Baum, der Traum.'},
  e_ment:    {g:'das', name:'-ment', family:'ending', tip:'Neuter. das Dokument, das Experiment. Exceptions: der Moment (point in time), der Zement.'},
  e_ma:      {g:'das', name:'-ma', family:'ending', tip:'Neuter for Greek-derived nouns. das Thema, das Klima. Exception: die Firma.'},
  e_tum:     {g:'das', name:'-tum', family:'ending', tip:'Neuter. das Eigentum, das Wachstum. Exceptions: der Reichtum, der Irrtum.'},
  e_ge:      {g:'das', name:'Ge- prefix', family:'ending', tip:'Usually neuter. das Gebäude, das Gemüse. Plenty of exceptions: der Gedanke, der Geruch, die Geduld, die Geschichte.'},
  e_nis:     {g:'das', name:'-nis', family:'ending', tip:'Usually neuter. das Ergebnis, das Erlebnis. Exceptions: die Erlaubnis, die Kenntnis, die Erkenntnis, die Finsternis.'},

  /* --- Meaning categories --- */
  c_day:     {g:'der', name:'Days', family:'meaning', tip:'der Montag, der Freitag. (Short for "der Tag".)'},
  c_month:   {g:'der', name:'Months', family:'meaning', tip:'der Januar, der Mai.'},
  c_season:  {g:'der', name:'Seasons', family:'meaning', tip:'der Frühling, der Sommer, der Herbst, der Winter.'},
  c_compass: {g:'der', name:'Compass points', family:'meaning', tip:'der Norden, der Süden, der Osten, der Westen.'},
  c_weather: {g:'der', name:'Weather that falls or blows', family:'meaning', tip:'der Regen, der Wind, der Schnee. But die Sonne, die Wolke, das Gewitter.'},
  c_booze:   {g:'der', name:'Alcoholic drinks', family:'meaning', tip:'der Wein, der Schnaps. Beer is the odd one out: das Bier.'},
  c_car:     {g:'der', name:'Car makes', family:'meaning', tip:'der VW, der BMW — short for "der Wagen".'},

/* ============================================================
   STORAGE — window.storage in the Claude artifact sandbox,
   localStorage everywhere else. Whichever is available wins.
   ============================================================ */
const KEY = 'genus.v1';
const Store = {
  mode: 'memory',
  async load(){
    if (window.storage && window.storage.get){
      try { const r = await window.storage.get(KEY); this.mode='synced';
            if (r && r.value) return JSON.parse(r.value); } catch(e){ this.mode='synced'; }
    }
    try { const v = localStorage.getItem(KEY); if (this.mode==='memory') this.mode='local';
          if (v) return JSON.parse(v); } catch(e){}
    return null;
  },
  async save(o){
    const s = JSON.stringify(o);
    if (window.storage && window.storage.set){ try { await window.storage.set(KEY, s); } catch(e){} }
    try { localStorage.setItem(KEY, s); } catch(e){}
  }
};

function buildItems(){
  const out = [];
  const long = t => t.length > 20 || t.includes('+') || t.includes(' ');

  NOUNS.forEach(([w,g,r,x,note]) => out.push({
    id:'n:'+w, rule:r, kind:'gender', head:'Article', prompt:w, small:long(w),
    sub:DISAMB[w] || '', answer:g, exc:!!x, note
  }));

  WRITTEN.forEach((it,i) => {
    if (it.t === 'gender') out.push({
      id:'w:'+i, rule:it.r, kind:'gender', head: it.r==='f_comp'?'Compound':'Article',
      prompt:it.q, small:long(it.q), sub:it.s||'', answer:it.a, explain:it.e
    });
    else if (it.t === 'mc') out.push({
      id:'w:'+i, rule:it.r, kind:'mc', head:'Rule', prompt:it.q, small:true,
      sub:it.s||'', opts:it.o, answer:it.a, explain:it.e
    });
    else out.push({
      id:'w:'+i, rule:it.r, kind:'input', head:'Form', prompt:it.q, small:true,
      sub:it.s||'', answer:it.a, alt:it.alt||[], explain:it.e
    });
    if (it.r === 'f_comp' && it.w) out.push({
      id:'c:'+i, rule:'f_comp', kind:'gender', head:'Article', prompt:it.w, small:long(it.w),
      sub:'A compound — what is its last element?', answer:it.a, explain:it.e
    });
  });

  Object.keys(RULES).forEach(r => { if (RULES[r].g) out.push({
    id:'r:'+r, rule:r, kind:'gender', head:'Rule', prompt:RULES[r].name, small:true,
    sub:'Which gender does this rule predict?', answer:RULES[r].g, explain:RULES[r].tip
  });});

  Object.keys(RULES).forEach(r => {
    const R = RULES[r];
    if (!R.g || R.family === 'formation') return;
    const reg = NOUNS.filter(n => n[2]===r && !n[3]).map(n => n[0]);
    if (reg.length < 3) return;
    NOUNS.filter(n => n[2]===r && n[3]).forEach(n => out.push({
      id:'x:'+r+':'+n[0], rule:r, kind:'odd', head:'Exception',
      prompt:'Which one breaks the rule?', small:true,
      sub:R.name + ' \u2192 ' + R.g, pool:reg, answer:n[0],
      explain:(n[4] ? n[4]+' ' : '') + 'The others all follow the rule.'
    }));
  });

  return out;
}

/* ============================================================
   SCOPE + SCHEDULING
   ============================================================ */
const inScope = it => !S.scope.length || S.scope.includes(RULES[it.rule].family);
const scoped  = () => ITEMS.filter(inScope);
const rec     = id => S.p[id] || [0,0,0,0];
const boxOf   = id => rec(id)[0];
const isMaster= id => boxOf(id) >= MASTER;

function buildQueue(){
  const now = Date.now(), pool = scoped();
  const due = [], fresh = [], early = [];
  pool.forEach(it => {
    const r = S.p[it.id];
    if (!r) fresh.push(it);
    else if (r[1] <= now) due.push(it);
    else early.push(it);
  });
  due.sort((a,b) => S.p[a.id][1] - S.p[b.id][1]);
  shuffle(fresh);
  early.sort((a,b) => (S.p[a.id][0] - S.p[b.id][0]) || (S.p[a.id][1] - S.p[b.id][1]));

  const want = S.len || 9999;
  let q = due.concat(fresh).slice(0, want);
  if (q.length < want) q = q.concat(early.slice(0, want - q.length));
  return shuffle(q);
}

function grade(it, ok){
  const r = rec(it.id).slice();
  const was = r[0];
  if (ok) r[0] = Math.min(MASTER, r[0]+1);
  else { r[0] = 0; r[3]++; }
  r[1] = Date.now() + IVL[r[0]];
  r[2]++;
  S.p[it.id] = r;
  if (ok && r[0] >= MASTER && was < MASTER) sess.mastered++;

  S.tot++; if (ok) { S.right++; S.streak++; S.best = Math.max(S.best, S.streak); } else S.streak = 0;
  sess.n++; if (ok) sess.right++;
  S.days[today()] = (S.days[today()]||0) + 1;
  Store.save(S);
}

/* ============================================================
   ANSWER CHECKING
   ============================================================ */
const norm = s => String(s).trim().toLowerCase()
  .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
  .replace(/[^a-z]/g,'');

function checkInput(it, raw){
  if (!raw.trim()) return false;
  const v = norm(raw);
  return v === norm(it.answer) || (it.alt||[]).some(a => norm(a) === v);
}

/* ============================================================
   DRILL VIEW
   ============================================================ */
function nextCard(){
  if (qi >= queue.length) return renderDone();
  cur = queue[qi]; locked = false;
  if (cur.kind === 'odd'){
    cur.opts = shuffle(shuffle(cur.pool.slice()).slice(0,3).concat([cur.answer]));
  }
  renderCard();
}

function renderCard(){
  const it = cur, v = $('#v-drill');
  v.innerHTML = '';

  const stage = el('div','stage');
  const eb = el('div','eyebrow');
  eb.innerHTML = '<b>'+esc(it.head)+'</b> &nbsp;·&nbsp; ' + esc(RULES[it.rule].name);
  stage.appendChild(eb);

  const p = el('div','prompt' + (it.small?' small':''));
  p.innerHTML = esc(it.prompt).replace(/_{2,}/g,'<span class="blank">___</span>');
  stage.appendChild(p);
  if (it.sub) stage.appendChild(el('div','subprompt', it.sub));
  v.appendChild(stage);

  const holder = el('div');
  holder.id = 'answers';
  v.appendChild(holder);

  if (it.kind === 'gender')      buildGenderBar(holder);
  else if (it.kind === 'input')  buildInput(holder);
  else                           buildChoices(holder, it.opts, it.kind==='odd');

  const foot = el('div','footbar');
  const left = el('div','pill');
  left.innerHTML = 'Card <b>'+(qi+1)+'</b> / '+queue.length;
  const mid = el('div','pill');
  mid.innerHTML = 'Session <b>'+sess.right+'/'+sess.n+'</b>';
  const skip = el('button','btn ghost','Skip');
  skip.id = 'nextBtn';
  skip.style.padding = '7px 13px'; skip.style.fontSize = '13px';
  skip.onclick = () => { if(!locked){ qi++; nextCard(); } else advance(); };
  foot.append(left, el('div','spacer'), mid, skip);
  v.appendChild(foot);
  v.appendChild(el('div','hintline', it.kind==='input' ? 'Type your answer, then press Enter' : 'Keys 1 – ' + (it.kind==='gender'?'3':String(it.opts.length))));
  updateMeter();
}

function buildGenderBar(holder){
  const bar = el('div','genus');
  GEN.forEach((g,i) => {
    const b = el('button','g'); b.dataset.g = g;
    b.innerHTML = esc(g) + '<span class="kbd">'+(i+1)+'</span>';
    b.onclick = () => answerGender(g);
    bar.appendChild(b);
  });
  holder.appendChild(bar);
}

function buildChoices(holder, opts, isOdd){
  const box = el('div','mc');
  opts.forEach((o,i) => {
    const b = el('button','opt');
    b.appendChild(el('span','n', String(i+1)));
    const t = el('span','', o);
    if (isOdd) t.style.fontFamily = 'var(--serif)', t.style.fontSize = '17px';
    b.appendChild(t);
    b.onclick = () => answerChoice(i);
    box.appendChild(b);
  });
  holder.appendChild(box);
}

function buildInput(holder){
  const row = el('div','type-row');
  const inp = document.createElement('input');
  inp.type='text'; inp.id='typed'; inp.autocomplete='off'; inp.autocapitalize='off';
  inp.spellcheck=false; inp.placeholder='your answer';
  inp.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); locked ? advance() : answerTyped(); } };
  const go = el('button','btn','Check');
  go.onclick = () => locked ? advance() : answerTyped();
  row.append(inp, go);
  holder.appendChild(row);
  const um = el('div','umlauts');
  ['ä','ö','ü','ß'].forEach(ch => {
    const b = el('button','',ch);
    b.type='button';
    b.onclick = () => { inp.value += ch; inp.focus(); };
    um.appendChild(b);
  });
  holder.appendChild(um);
  setTimeout(()=>inp.focus(),40);
}

/* ---------- answering ---------- */
function answerGender(g){
  if (locked) return; locked = true;
  const it = cur, ok = g === it.answer;
  S.ans[g]++; S.cor[it.answer]++; if (ok) S.hit[g]++;
  document.querySelectorAll('.g').forEach(b => {
    b.disabled = true;
    const bg = b.dataset.g;
    if (bg === it.answer) b.classList.add('right');
    else if (bg === g)    b.classList.add('wrong');
    else                  b.classList.add('dim');
  });
  finish(ok, it.answer);
}

function answerChoice(i){
  if (locked) return; locked = true;
  const it = cur;
  const correctIdx = it.kind==='odd' ? it.opts.indexOf(it.answer) : it.answer;
  const ok = i === correctIdx;
  document.querySelectorAll('.opt').forEach((b,k) => {
    b.disabled = true;
    if (k === correctIdx) b.classList.add('right');
    else if (k === i)     b.classList.add('wrong');
    else                  b.classList.add('dim');
  });
  finish(ok, it.opts[correctIdx]);
}

function answerTyped(){
  if (locked) return;
  const inp = $('#typed');
  if (!inp.value.trim()) return;
  locked = true;
  const ok = checkInput(cur, inp.value);
  inp.classList.add(ok?'right':'wrong'); inp.blur();
  finish(ok, cur.answer);
}

function finish(ok, correctText){
  const it = cur;
  grade(it, ok);
  if (!ok) queue.splice(Math.min(qi+4, queue.length), 0, it);

  const fb = el('div','fb ' + (ok?'ok':'no'));
  const head = el('div','fb-head');
  const v = el('span','verdict', ok ? 'Correct' : 'Not this time');
  head.appendChild(v);
  head.appendChild(el('span','rule-name', RULES[it.rule].name + (it.exc ? '  ·  exception' : '')));
  fb.appendChild(head);

  if (!ok){
    const p = el('p');
    p.innerHTML = 'Answer: <span class="de"><b>'+esc(correctText)+'</b></span>';
    fb.appendChild(p);
  }
  const detail = it.explain || it.note;
  if (detail) fb.appendChild(el('p','', detail));
  const tip = RULES[it.rule].tip;
  if (tip && tip !== detail) fb.appendChild(el('p','tip', tip));

  const b = boxOf(it.id);
  const prog = el('p','tip');
  prog.textContent = b >= MASTER ? 'Mastered — next review in about three weeks.'
                                 : 'Step ' + b + ' of ' + MASTER + ' toward mastery.';
  fb.appendChild(prog);

  fb.onclick = advance;
  $('#answers').after(fb);
  const nb = $('#nextBtn');
  if (nb){ nb.className = 'btn'; nb.textContent = 'Continue'; }
  const hint = $('#v-drill .hintline');
  if (hint) hint.textContent = 'Tap Continue, or press Enter';
  updateMeter();
}

function advance(){ if(!locked) return; qi++; nextCard(); }

function renderDone(){
  const v = $('#v-drill'); v.innerHTML = '';
  const acc = sess.n ? Math.round(sess.right/sess.n*100) : 0;
  const d = el('div','done');
  d.appendChild(el('h2','', sess.n ? 'Session complete' : 'Nothing due right now'));
  d.appendChild(el('div','score', sess.n
    ? sess.right + ' of ' + sess.n + ' correct'
    : 'Everything in scope is scheduled for later. Widen the scope in Settings, or come back after the next interval.'));
  if (sess.n){
    const row = el('div','stat-row');
    [[acc+'%','accuracy'],[sess.mastered,'newly mastered'],[S.streak,'current streak']].forEach(([a,b])=>{
      const s = el('div','stat'); s.appendChild(el('div','v',String(a))); s.appendChild(el('div','k',b)); row.appendChild(s);
    });
    d.appendChild(row);
  }
  const again = el('button','btn','Start another session');
  again.onclick = startSession;
  d.appendChild(again);
  const rl = el('button','btn ghost','See the rules');
  rl.style.marginLeft='8px'; rl.onclick = () => go('rules');
  d.appendChild(rl);
  v.appendChild(d);
  updateMeter();
}

function startSession(rules){
  const only = Array.isArray(rules) ? rules : null;
  queue = only
    ? shuffle(ITEMS.filter(i => only.includes(i.rule))).slice(0, S.len || 9999)
    : buildQueue();
  qi = 0; sess = {n:0, right:0, mastered:0};
  go('drill');
  if (!queue.length) renderDone(); else nextCard();
}

/* ============================================================
   RULES VIEW
   ============================================================ */
const FAMS = [['ending','Rules by ending'],['meaning','Rules by meaning'],['formation','Word formation']];

function ruleItems(r){ return ITEMS.filter(i => i.rule === r); }

function renderRules(){
  const v = $('#v-rules'); v.innerHTML = '';
  v.appendChild(el('h2','sec-title','Regelkarte'));
  v.appendChild(el('p','sec-sub','Every rule in your notes, with how far along you are. Tap one to see its words and drill it on its own.'));

  FAMS.forEach(([fam,label]) => {
    v.appendChild(el('div','fam',label));
    const list = el('div','rules');
    Object.keys(RULES).filter(r => RULES[r].family === fam).forEach(r => {
      const R = RULES[r], items = ruleItems(r);
      const done = items.filter(i => isMaster(i.id)).length;
      const pct = items.length ? done/items.length : 0;

      const row = el('button','rule-row');
      row.appendChild(el('span','dot ' + (R.g || 'mix')));
      row.appendChild(el('span','nm', R.name));
      const mini = el('span','mini');
      const fill = el('i'); fill.style.width = Math.round(pct*100)+'%';
      if (pct === 1) fill.classList.add('full');
      mini.appendChild(fill); row.appendChild(mini);
      row.appendChild(el('span','ct', done + '/' + items.length));
      row.onclick = () => { openRule = (openRule === r ? null : r); renderRules(); };
      list.appendChild(row);

      if (openRule === r){
        const d = el('div','detail');
        d.appendChild(el('h3','', R.name + (R.g ? '  \u2192  ' + R.g : '')));
        d.appendChild(el('p','tip', R.tip));
        const nouns = NOUNS.filter(n => n[2] === r);
        if (nouns.length){
          const words = el('div','words');
          nouns.forEach(([w,g,rr,x]) => {
            const c = el('span','w ' + g + (x?' exc':'') + (isMaster('n:'+w)?' done':''), g + ' ' + w);
            words.appendChild(c);
          });
          d.appendChild(words);
          d.appendChild(el('p','legend','italic = exception to this rule  ·  outlined = mastered'));
        }
        const btn = el('button','btn','Drill this rule');
        btn.style.marginTop = '14px';
        btn.onclick = e => { e.stopPropagation(); startSession([r]); };
        d.appendChild(btn);
        list.appendChild(d);
      }
    });
    v.appendChild(list);
  });
}

/* ============================================================
   STATS VIEW
   ============================================================ */
function renderStats(){
  const v = $('#v-stats'); v.innerHTML = '';
  const pool = scoped();
  const done = pool.filter(i => isMaster(i.id)).length;
  const seen = pool.filter(i => S.p[i.id]).length;
  const acc  = S.tot ? Math.round(S.right/S.tot*100) : 0;

  v.appendChild(el('h2','sec-title','Where you stand'));
  v.appendChild(el('p','sec-sub','Mastery means five correct answers on a card, spread over at least two weeks. Guessing your way there is close to impossible.'));

  const row = el('div','stat-row');
  [[done+' / '+pool.length,'mastered'],[seen-done,'in progress'],[pool.length-seen,'not started']].forEach(([a,b])=>{
    const s = el('div','stat'); s.appendChild(el('div','v',String(a))); s.appendChild(el('div','k',b)); row.appendChild(s);
  });
  v.appendChild(row);

  const row2 = el('div','stat-row');
  [[acc+'%','lifetime accuracy'],[S.tot,'answers given'],[S.best,'best streak']].forEach(([a,b])=>{
    const s = el('div','stat'); s.appendChild(el('div','v',String(a))); s.appendChild(el('div','k',b)); row2.appendChild(s);
  });
  v.appendChild(row2);

  /* --- gender bias --- */
  const totAns = GEN.reduce((a,g)=>a+S.ans[g],0);
  v.appendChild(el('div','fam','Your gender bias'));
  if (!totAns){
    v.appendChild(el('p','sec-sub','Answer some article questions and this fills in.'));
  } else {
    v.appendChild(el('p','sec-sub','Bar = how often you reach for that article. Line = how often it is actually the answer. A bar sitting well past its line is a habit to break.'));
    const wrap = el('div','bias');
    GEN.forEach(g => {
      const mine = S.ans[g]/totAns, real = S.cor[g]/Math.max(1,totAns);
      const recall = S.cor[g] ? Math.round(S.hit[g]/S.cor[g]*100) : 0;
      const r = el('div','bias-row');
      r.appendChild(el('span','bias-lab '+g, g));
      const t = el('span','bias-track');
      const f = el('i',g); f.style.width = (mine*100)+'%';
      const m = el('u'); m.style.left = 'calc('+(real*100)+'% - 1px)';
      t.append(f,m); r.appendChild(t);
      r.appendChild(el('span','bias-num', recall+'% recall'));
      wrap.appendChild(r);
    });
    v.appendChild(wrap);
  }

  /* --- forecast --- */
  const now = Date.now(), D = 864e5;
  const dueNow = pool.filter(i => S.p[i.id] && S.p[i.id][1] <= now).length;
  const d7 = pool.filter(i => S.p[i.id] && S.p[i.id][1] > now && S.p[i.id][1] <= now+7*D).length;
  v.appendChild(el('div','fam','Review queue'));
  const row3 = el('div','stat-row');
  [[dueNow,'due now'],[d7,'due within 7 days'],[S.days[today()]||0,'answered today']].forEach(([a,b])=>{
    const s = el('div','stat'); s.appendChild(el('div','v',String(a))); s.appendChild(el('div','k',b)); row3.appendChild(s);
  });
  v.appendChild(row3);

  /* --- weakest cards --- */
  const weak = pool.filter(i => rec(i.id)[3] > 0)
    .sort((a,b) => rec(b.id)[3] - rec(a.id)[3]).slice(0,14);
  if (weak.length){
    v.appendChild(el('div','fam','Cards you keep losing'));
    const words = el('div','words');
    weak.forEach(i => {
      const label = i.kind==='gender' && !i.prompt.includes('+') && GEN.includes(i.answer)
        ? i.answer + ' ' + i.prompt : RULES[i.rule].name;
      const c = el('span','w ' + (GEN.includes(i.answer)?i.answer:''), label + '  ×' + rec(i.id)[3]);
      words.appendChild(c);
    });
    v.appendChild(words);
    const b = el('button','btn','Drill only these');
    b.style.marginTop='14px';
    b.onclick = () => { queue = shuffle(weak.slice()); qi=0; sess={n:0,right:0,mastered:0}; go('drill'); nextCard(); };
    v.appendChild(b);
  }
}

/* ============================================================
   SETTINGS
   ============================================================ */
function renderSet(){
  const v = $('#v-set'); v.innerHTML = '';
  v.appendChild(el('h2','sec-title','Settings'));
  v.appendChild(el('p','sec-sub','Progress saves automatically. Storage in use: ' + Store.mode + '.'));

  const f1 = el('div','field');
  f1.appendChild(el('h4','','What to drill'));
  f1.appendChild(el('p','','Narrowing the scope is how you get a rule to 100% instead of grinding all 1,000 cards at once.'));
  const o1 = el('div','opts');
  const mk = (label, val) => {
    const c = el('button','chip',label);
    const on = val === null ? !S.scope.length : S.scope.includes(val);
    c.setAttribute('aria-pressed', on);
    c.onclick = () => {
      if (val === null) S.scope = [];
      else { const i = S.scope.indexOf(val); i<0 ? S.scope.push(val) : S.scope.splice(i,1); }
      Store.save(S); renderSet(); updateMeter();
    };
    o1.appendChild(c);
  };
  mk('Everything', null);
  FAMS.forEach(([f,l]) => mk(l.replace('Rules by ','').replace(/^\w/,c=>c.toUpperCase()), f));
  f1.appendChild(o1);
  v.appendChild(f1);

  const f2 = el('div','field');
  f2.appendChild(el('h4','','Session length'));
  f2.appendChild(el('p','','Cards per session. Wrong answers come back within the same session regardless.'));
  const o2 = el('div','opts');
  [[10,'10'],[25,'25'],[50,'50'],[0,'No limit']].forEach(([n,l]) => {
    const c = el('button','chip',l);
    c.setAttribute('aria-pressed', S.len === n);
    c.onclick = () => { S.len = n; Store.save(S); renderSet(); };
    o2.appendChild(c);
  });
  f2.appendChild(o2); v.appendChild(f2);

  const f3 = el('div','field');
  f3.appendChild(el('h4','','Start over'));
  f3.appendChild(el('p','','Clears every box, streak and statistic. There is no undo.'));
  const o3 = el('div','opts');
  const rst = el('button','chip danger','Reset all progress');
  let armed = false;
  rst.onclick = () => {
    if (!armed){ armed = true; rst.textContent = 'Tap again to erase everything'; setTimeout(()=>{armed=false;rst.textContent='Reset all progress';},4000); return; }
    S = {p:{},scope:[],len:25,ans:{der:0,die:0,das:0},cor:{der:0,die:0,das:0},hit:{der:0,die:0,das:0},tot:0,right:0,streak:0,best:0,days:{}};
    Store.save(S); renderSet(); updateMeter(); startSession();
  };
  o3.appendChild(rst); f3.appendChild(o3); v.appendChild(f3);

  const f4 = el('div','field');
  f4.appendChild(el('h4','','Bank'));
  f4.appendChild(el('p','', ITEMS.length + ' cards across ' + Object.keys(RULES).length + ' rules: ' + NOUNS.length + ' nouns to gender, plus compounds, diminutives, nominalisations, adjectival endings and exception spotting.'));
  v.appendChild(f4);
}

/* ============================================================
   CHROME
   ============================================================ */
function updateMeter(){
  const pool = scoped();
  const m = {der:0,die:0,das:0};
  let done = 0;
  pool.forEach(i => { if (isMaster(i.id)){ done++; if (m[i.answer]!=null) m[i.answer]++; } });
  const tot = Math.max(1, pool.length);
  $('#bDer').style.width = (m.der/tot*100)+'%';
  $('#bDie').style.width = (m.die/tot*100)+'%';
  $('#bDas').style.width = (m.das/tot*100)+'%';
  $('#mPct').textContent = Math.round(done/tot*100)+'%';
  $('#mLabel').textContent = done + ' of ' + pool.length + ' mastered';
}

function go(name){
  view = name;
  ['drill','rules','stats','set'].forEach(n => $('#v-'+n).classList.toggle('on', n===name));
  document.querySelectorAll('nav button').forEach(b => {
    if (b.dataset.view === name) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  if (name === 'rules') renderRules();
  if (name === 'stats') renderStats();
  if (name === 'set')   renderSet();
  document.querySelector('main').scrollTop = 0;
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  if (b.dataset.view === 'drill' && (!queue.length || qi >= queue.length)) return startSession();
  go(b.dataset.view);
});
$('#toSettings').onclick = () => go('set');

document.addEventListener('keydown', e => {
  if (view !== 'drill' || !cur) return;
  const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if ((e.key === 'Enter' || e.key === ' ') && locked){ e.preventDefault(); return advance(); }
  if (typing) return;
  if (/^[1-9]$/.test(e.key)){
    const n = +e.key - 1;
    if (locked) return;
    if (cur.kind === 'gender'){ if (n < 3) answerGender(GEN[n]); }
    else if (cur.kind !== 'input'){ if (n < cur.opts.length) answerChoice(n); }
  }
});

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  ITEMS = buildItems();
  ITEMS.forEach(i => BYID[i.id] = i);
  const saved = await Store.load();
  if (saved) S = Object.assign(S, saved);
  ['ans','cor','hit'].forEach(k => S[k] = Object.assign({der:0,die:0,das:0}, S[k]||{}));
  S.p = S.p || {}; S.days = S.days || {};
  updateMeter();
  startSession();
})();
</script>
