<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imperativ — Drill</title>
<style>
  
  :root{color-scheme:light}
  :root{
    --ink:#121A24; --grau:#5C6675; --linie:#D6DAE0;
    --blatt:#E9ECEF; --platte:#FFFFFF;
    --blau:#0B4A9B; --blau-tief:#08376F; --blau-hell:#E7EEF8;
    --gruen:#14795A; --gruen-hell:#E4F1EB;
    --rot:#AF2A1B; --rot-hell:#FBE9E6;
    --gelb:#E8B317;
    --r:6px;
    --sans:"Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--blatt); color:var(--ink); font-family:var(--sans);
    font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
    padding:0 16px 64px; overflow-y:scroll;
  }
  .wrap{max-width:660px;margin:0 auto}

  /* ---------- header ---------- */
  header{padding:26px 0 18px}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
  h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0}
  h1 span{font-weight:400;color:var(--grau)}
  .mastery{font-size:14px;color:var(--grau);white-space:nowrap}
  .mastery b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
  nav{display:flex;gap:2px;margin-top:16px;border-bottom:1px solid var(--linie)}
  nav button{
    appearance:none;background:none;border:0;border-bottom:3px solid transparent;
    font:inherit;font-size:15px;color:var(--grau);padding:8px 12px;margin-bottom:-1px;
    cursor:pointer;border-radius:3px 3px 0 0;
  }
  nav button:hover{color:var(--ink);background:#fff8}
  nav button[aria-selected="true"]{color:var(--blau);border-bottom-color:var(--blau);font-weight:650}
  nav button:focus-visible,.plate button:focus-visible,input:focus-visible{
    outline:2px solid var(--blau);outline-offset:2px}

  /* ---------- the sign plate ---------- */
  .plate{
    position:relative;background:var(--platte);border:1px solid var(--linie);
    border-radius:var(--r);padding:26px 26px 24px 34px;margin-top:22px;
    box-shadow:0 1px 0 rgba(18,26,36,.04);
  }
  .plate::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--blau);
    border-radius:var(--r) 0 0 var(--r);transition:background .18s ease;
  }
  .plate.ok::before{background:var(--gruen)}
  .plate.no::before{background:var(--rot)}
  @media (prefers-reduced-motion:reduce){.plate::before{transition:none}}

  .meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--grau);
        margin-bottom:14px;align-items:center}
  .tag{background:var(--blau-hell);color:var(--blau-tief);padding:2px 9px;border-radius:20px;
       font-size:12.5px;font-weight:600}
  .q{font-size:22px;line-height:1.35;font-weight:600;letter-spacing:-.01em;margin:0}
  .q b{font-weight:800}
  .sub{color:var(--grau);font-size:15.5px;margin-top:6px;font-style:italic}

  /* ---------- answering ---------- */
  .answer{margin-top:20px}
  input[type=text]{
    width:100%;font:inherit;font-size:21px;font-weight:600;padding:12px 14px;
    border:1px solid var(--linie);border-radius:var(--r);background:#fff;color:var(--ink);
  }
  input[type=text]::placeholder{font-weight:400;color:#A9B1BA}
  .opts{display:grid;gap:8px}
  .opt{
    display:flex;align-items:center;gap:12px;text-align:left;width:100%;
    font:inherit;font-size:18px;padding:12px 14px;background:#fff;cursor:pointer;
    border:1px solid var(--linie);border-radius:var(--r);color:var(--ink);
  }
  .opt:hover:not(:disabled){border-color:var(--blau);background:var(--blau-hell)}
  .opt .k{
    flex:none;width:24px;height:24px;border-radius:4px;background:var(--blatt);
    color:var(--grau);font-size:13px;font-weight:700;display:grid;place-items:center;
  }
  .opt.pick{border-color:var(--blau);background:var(--blau-hell)}
  .opt.right{border-color:var(--gruen);background:var(--gruen-hell)}
  .opt.right .k{background:var(--gruen);color:#fff}
  .opt.wrong{border-color:var(--rot);background:var(--rot-hell)}
  .opt.wrong .k{background:var(--rot);color:#fff}
  .opt:disabled{cursor:default}

  .slot{
    min-height:56px;border:1px dashed var(--linie);border-radius:var(--r);background:#fff;
    padding:9px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;
  }
  .slot:empty::after{content:"Tippe die Wörter der Reihe nach an";color:#A9B1BA;font-size:15px;padding:6px 4px}
  .bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .tile{
    font:inherit;font-size:17px;font-weight:600;padding:7px 13px;background:#fff;cursor:pointer;
    border:1px solid var(--linie);border-radius:5px;color:var(--ink);
  }
  .tile:hover{border-color:var(--blau);background:var(--blau-hell)}
  .tile.used{visibility:hidden}
  .slot .tile{background:var(--blau-hell);border-color:#BBD0EA}

  .row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
  .btn{
    font:inherit;font-size:16px;font-weight:650;padding:11px 20px;border-radius:var(--r);
    border:1px solid var(--blau);background:var(--blau);color:#fff;cursor:pointer;
  }
  .btn:hover{background:var(--blau-tief);border-color:var(--blau-tief)}
  .btn.ghost{background:#fff;color:var(--blau)}
  .btn.ghost:hover{background:var(--blau-hell)}
  .btn.quiet{background:#fff;color:var(--grau);border-color:var(--linie)}
  .btn.quiet:hover{color:var(--ink);border-color:var(--grau)}
  .hintline{font-size:14px;color:var(--grau)}
  kbd{font-family:inherit;font-size:12px;background:var(--blatt);border:1px solid var(--linie);
      border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--grau)}

  /* ---------- verdict ---------- */
  .verdict{margin-top:18px;padding-top:16px;border-top:1px solid var(--linie)}
  .call{font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .call.ok{color:var(--gruen)} .call.no{color:var(--rot)}
  .call .sol{color:var(--ink);font-weight:800}
  .diag{margin-top:7px;font-size:16px;color:var(--rot);font-weight:600}
  .why{margin-top:9px;font-size:16px;color:#2A3543;line-height:1.55}

  /* ---------- panels ---------- */
  .panel{background:var(--platte);border:1px solid var(--linie);border-radius:var(--r);
         padding:22px 24px;margin-top:22px}
  .panel h2{font-size:17px;margin:0 0 4px;font-weight:750}
  .panel p.lead{margin:0 0 18px;color:var(--grau);font-size:15px}
  .cat{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;
       padding:9px 0;border-top:1px solid #EDF0F3}
  .cat:first-of-type{border-top:0}
  .cat .name{font-size:16px;font-weight:600}
  .cat .name em{font-style:normal;color:var(--grau);font-weight:400;font-size:14px}
  .cat .num{font-size:14px;color:var(--grau);font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{grid-column:1/-1;height:7px;background:var(--blatt);border-radius:4px;overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .bar .m{background:var(--gruen)} .bar .p{background:var(--blau)} .bar .w{background:var(--gelb)}
  .catbtn{grid-column:1/-1;justify-self:start;margin-top:6px}

  table{border-collapse:collapse;width:100%;font-size:15.5px;margin:10px 0 18px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid #EDF0F3;vertical-align:top}
  th{font-weight:700;font-size:13.5px;color:var(--grau)}
  .rules h3{font-size:16px;margin:24px 0 6px;font-weight:750}
  .rules h3:first-child{margin-top:4px}
  .rules p,.rules li{font-size:15.5px;line-height:1.6}
  .rules ul{margin:8px 0;padding-left:20px}
  .de{font-weight:700}
  .note{background:var(--blau-hell);border-radius:var(--r);padding:12px 14px;font-size:15px;margin:14px 0}

  .done{text-align:center;padding:14px 0 6px}
  .done .big{font-size:40px;font-weight:800;letter-spacing:-.03em}
  .scorelist{margin-top:14px;font-size:15.5px}
  .scorelist div{padding:7px 0;border-top:1px solid #EDF0F3}
  .foot{margin-top:26px;font-size:13.5px;color:var(--grau);display:flex;
        justify-content:space-between;gap:12px;flex-wrap:wrap}
  .foot button{font:inherit;font-size:13.5px;color:var(--grau);background:none;border:0;
               cursor:pointer;text-decoration:underline;padding:0}
  .hide{display:none !important}
  @media (max-width:560px){
    body{font-size:16px;padding:0 12px 48px}
    .plate{padding:20px 18px 20px 26px}
    .q{font-size:20px} h1{font-size:20px}
    nav button{padding:8px 9px;font-size:14px}
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <h1>Imperativ <span>· the German imperative · telc B1</span></h1>
    <div class="mastery" id="mastery"></div>
  </div>
  <nav role="tablist">
    <button role="tab" id="t-drill" aria-controls="v-drill" aria-selected="true">Practice</button>
    <button role="tab" id="t-stats" aria-controls="v-stats" aria-selected="false">Progress</button>
    <button role="tab" id="t-exam" aria-controls="v-exam" aria-selected="false">Test</button>
    <button role="tab" id="t-rules" aria-controls="v-rules" aria-selected="false">Rules</button>
  </nav>
</header>

<main>
  <section id="v-drill" role="tabpanel" aria-labelledby="t-drill"></section>
  <section id="v-stats" role="tabpanel" aria-labelledby="t-stats" class="hide"></section>
  <section id="v-exam" role="tabpanel" aria-labelledby="t-exam" class="hide"></section>
  <section id="v-rules" role="tabpanel" aria-labelledby="t-rules" class="hide"></section>
</main>

<div class="foot">
  <span id="footinfo"></span>
  <span><button id="reset">Clear progress</button></span>
</div>
</div>

hout the pronoun.","tag":"ihr = present tense, no pronoun"},{"id":"ihr-unterschreiben","cat":"ihr","type":"type","q":"<b>unterschreiben</b> — imperative, ihr-form","sub":"du unterschreibst · sign","a":"Unterschreibt!","why":"ihr unterschreibt → Unterschreibt! Just the present-tense form without the pronoun.","tag":"ihr = present tense, no pronoun"},{"id":"sie-geben","cat":"formal","type":"type","q":"<b>geben</b> — imperative, Sie-form","sub":"du gibst · give","a":"Geben Sie!","why":"Infinitive + Sie, in that order: Geben Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-vergessen","cat":"formal","type":"type","q":"<b>vergessen</b> — imperative, Sie-form","sub":"du vergisst · forget","a":"Vergessen Sie!","why":"Infinitive + Sie, in that order: Vergessen Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-treten","cat":"formal","type":"type","q":"<b>treten</b> — imperative, Sie-form","sub":"du trittst · step","a":"Treten Sie!","why":"Infinitive + Sie, in that order: Treten Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-halten","cat":"formal","type":"type","q":"<b>halten</b> — imperative, Sie-form","sub":"du hältst · stop, hold","a":"Halten Sie!","why":"Infinitive + Sie, in that order: Halten Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-raten","cat":"formal","type":"type","q":"<b>raten</b> — imperative, Sie-form","sub":"du rätst · guess, advise","a":"Raten Sie!","why":"Infinitive + Sie, in that order: Raten Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-baden","cat":"formal","type":"type","q":"<b>baden</b> — imperative, Sie-form","sub":"du badest · bathe","a":"Baden Sie!","why":"Infinitive + Sie, in that order: Baden Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-retten","cat":"formal","type":"type","q":"<b>retten</b> — imperative, Sie-form","sub":"du rettest · rescue","a":"Retten Sie!","why":"Infinitive + Sie, in that order: Retten Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-zeichnen","cat":"formal","type":"type","q":"<b>zeichnen</b> — imperative, Sie-form","sub":"du zeichnest · draw","a":"Zeichnen Sie!","why":"Infinitive + Sie, in that order: Zeichnen Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-beschäftigen","cat":"formal","type":"type","q":"<b>beschäftigen</b> — imperative, Sie-form","sub":"du beschäftigst · occupy","a":"Beschäftigen Sie!","why":"Infinitive + Sie, in that order: Beschäftigen Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-bügeln","cat":"formal","type":"type","q":"<b>bügeln</b> — imperative, Sie-form","sub":"du bügelst · iron","a":"Bügeln Sie!","why":"Infinitive + Sie, in that order: Bügeln Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-füttern","cat":"formal","type":"type","q":"<b>füttern</b> — imperative, Sie-form","sub":"du fütterst · feed","a":"Füttern Sie!","why":"Infinitive + Sie, in that order: Füttern Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-kaufen","cat":"formal","type":"type","q":"<b>kaufen</b> — imperative, Sie-form","sub":"du kaufst · buy","a":"Kaufen Sie!","why":"Infinitive + Sie, in that order: Kaufen Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-denken","cat":"formal","type":"type","q":"<b>denken</b> — imperative, Sie-form","sub":"du denkst · think","a":"Denken Sie!","why":"Infinitive + Sie, in that order: Denken Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-legen","cat":"formal","type":"type","q":"<b>legen</b> — imperative, Sie-form","sub":"du legst · lay, put","a":"Legen Sie!","why":"Infinitive + Sie, in that order: Legen Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-putzen","cat":"formal","type":"type","q":"<b>putzen</b> — imperative, Sie-form","sub":"du putzt · clean","a":"Putzen Sie!","why":"Infinitive + Sie, in that order: Putzen Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-turnen","cat":"formal","type":"type","q":"<b>turnen</b> — imperative, Sie-form","sub":"du turnst · do gymnastics","a":"Turnen Sie!","why":"Infinitive + Sie, in that order: Turnen Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"sie-versuchen","cat":"formal","type":"type","q":"<b>versuchen</b> — imperative, Sie-form","sub":"du versuchst · try","a":"Versuchen Sie!","why":"Infinitive + Sie, in that order: Versuchen Sie! No stem change, no ending — only sein is different (Seien Sie!).","tag":"Sie = infinitive + Sie"},{"id":"wir-geben","cat":"formal","type":"type","q":"<b>geben</b> — imperative, wir-form","sub":"“let's …” · give","a":"Geben wir!","why":"Infinitive + wir = the let's-form: Geben wir!","tag":"wir = infinitive + wir"},{"id":"wir-fallen","cat":"formal","type":"type","q":"<b>fallen</b> — imperative, wir-form","sub":"“let's …” · fall","a":"Fallen wir!","why":"Infinitive + wir = the let's-form: Fallen wir!","tag":"wir = infinitive + wir"},{"id":"wir-atmen","cat":"formal","type":"type","q":"<b>atmen</b> — imperative, wir-form","sub":"“let's …” · breathe","a":"Atmen wir!","why":"Infinitive + wir = the let's-form: Atmen wir!","tag":"wir = infinitive + wir"},{"id":"wir-erinnern","cat":"formal","type":"type","q":"<b>erinnern</b> — imperative, wir-form","sub":"“let's …” · remind","a":"Erinnern wir!","why":"Infinitive + wir = the let's-form: Erinnern wir!","tag":"wir = infinitive + wir"},{"id":"wir-üben","cat":"formal","type":"type","q":"<b>üben</b> — imperative, wir-form","sub":"“let's …” · practise","a":"Üben wir!","why":"Infinitive + wir = the let's-form: Üben wir!","tag":"wir = infinitive + wir"},{"id":"wir-wiederholen","cat":"formal","type":"type","q":"<b>wiederholen</b> — imperative, wir-form","sub":"“let's …” · repeat","a":"Wiederholen wir!","why":"Infinitive + wir = the let's-form: Wiederholen wir!","tag":"wir = infinitive + wir"},{"id":"ir-sein-du","cat":"irreg","type":"type","q":"sein — imperative, du-form","a":"Sei!","why":"sein is irregular in every form. du: Sei! — not the stem of the du-form (bist).","sub":"du bist …","tag":"4 irregulars"},{"id":"ir-sein-ihr","cat":"irreg","type":"type","q":"sein — imperative, ihr-form","a":"Seid!","why":"ihr seid → Seid! The ihr imperative is always the plain present-tense ihr form, even here.","sub":"ihr seid …","tag":"4 irregulars"},{"id":"ir-sein-sie","cat":"irreg","type":"type","q":"sein — imperative, Sie-form","a":"Seien Sie!","why":"sein is the one verb where the Sie form is not the infinitive: Seien Sie, not Sein Sie.","tag":"4 irregulars"},{"id":"ir-sein-wir","cat":"irreg","type":"type","q":"sein — imperative, wir-form","a":"Seien wir!","why":"Same stem as the Sie form: Seien wir ehrlich — let's be honest.","tag":"4 irregulars"},{"id":"ir-haben-du","cat":"irreg","type":"type","q":"haben — imperative, du-form","a":"Hab!","why":"Hab! (Habe! also exists but sounds heavier). Hab keine Angst!","alts":["Habe!"],"tag":"4 irregulars"},{"id":"ir-haben-ihr","cat":"irreg","type":"type","q":"haben — imperative, ihr-form","a":"Habt!","why":"ihr habt → Habt! Habt keine Angst!","tag":"4 irregulars"},{"id":"ir-haben-sie","cat":"irreg","type":"type","q":"haben — imperative, Sie-form","a":"Haben Sie!","why":"Regular pattern: infinitive + Sie. Haben Sie bitte etwas Geduld.","tag":"4 irregulars"},{"id":"ir-werden-du","cat":"irreg","type":"type","q":"werden — imperative, du-form","a":"Werde!","why":"Werde! keeps the -e — the du-form wirst does not feed the imperative here.","tag":"4 irregulars"},{"id":"ir-werden-ihr","cat":"irreg","type":"type","q":"werden — imperative, ihr-form","a":"Werdet!","why":"ihr werdet → Werdet!","tag":"4 irregulars"},{"id":"ir-werden-sie","cat":"irreg","type":"type","q":"werden — imperative, Sie-form","a":"Werden Sie!","why":"Infinitive + Sie: Werden Sie bitte nicht laut.","tag":"4 irregulars"},{"id":"ir-wissen-ihr","cat":"irreg","type":"type","q":"wissen — imperative, ihr-form","a":"Wisst!","why":"ihr wisst → Wisst! The du form Wisse! is literary and you will not need it in speech.","tag":"4 irregulars"},{"id":"ir-wissen-sie","cat":"irreg","type":"type","q":"wissen — imperative, Sie-form","a":"Wissen Sie!","why":"Infinitive + Sie. In practice you meet it as the filler Wissen Sie, …","tag":"4 irregulars"},{"id":"ir-mc-sein-sie","cat":"irreg","type":"mc","q":"You are speaking to an official: ___ Sie bitte so nett.","opts":["Seien","Sein","Sind","Seid"],"ans":0,"why":"sein breaks the infinitive+Sie pattern: Seien Sie. Every other verb would use the infinitive.","tag":"4 irregulars"},{"id":"ir-mc-sein-du","cat":"irreg","type":"mc","q":"To a friend: ___ bitte pünktlich!","opts":["Sei","Bist","Sein","Seist"],"ans":0,"why":"du-Imperativ of sein is Sei! — an irregular form you simply learn.","tag":"4 irregulars"},{"id":"ir-cl-angst","cat":"irreg","type":"type","q":"Fill the gap: ___ keine Angst! (haben, du)","a":"Hab","why":"haben + kein: Hab keine Angst! Angst is feminine, accusative → keine.","alts":["Habe"],"tag":"4 irregulars"},{"id":"ir-cl-ehrlich","cat":"irreg","type":"type","q":"Fill the gap: ___ ___ ehrlich — das war zu teuer. (sein, wir)","a":"Seien wir","why":"The wir-imperative makes a suggestion: Seien wir ehrlich = let's be honest.","tag":"4 irregulars"},{"id":"ir-mc-why","cat":"irreg","type":"mc","q":"Why is it Seien Sie! and not Sein Sie!?","opts":["sein is the only verb whose Sie-imperative is not the infinitive","Because Sie is plural here","Because the sentence is a request, not an order","Because sein has no imperative at all"],"ans":0,"why":"Every other verb: infinitive + Sie. sein alone uses the subjunctive stem seien.","tag":"4 irregulars"},{"id":"sep-b-aufstehen","cat":"sep","type":"build","q":"aufstehen — say it to a friend, politely","a":"Steh bitte auf!","why":"Prefix to the very end. bitte sits between verb and prefix.","tag":"prefix goes last"},{"id":"sep-b-anrufen","cat":"sep","type":"build","q":"anrufen — bitte deinen Freund, dich heute Abend anzurufen","a":"Ruf mich heute Abend an!","why":"Verb first, then the pronoun, then the time phrase, and an at the end.","tag":"prefix goes last"},{"id":"sep-b-zumachen","cat":"sep","type":"build","q":"zumachen — sag es zu mehreren Personen (ihr)","a":"Macht die Tür zu!","why":"ihr-Imperativ Macht + object + prefix zu.","tag":"prefix goes last"},{"id":"sep-b-mitkommen","cat":"sep","type":"build","q":"mitkommen — lade jemanden formell ein (Sie)","a":"Kommen Sie doch mit!","why":"Sie-form: infinitive + Sie, and mit still goes last.","tag":"prefix goes last"},{"id":"sep-b-aufhoeren","cat":"sep","type":"build","q":"aufhören — say it to a friend, exasperated","a":"Hör endlich auf!","why":"endlich sits before the prefix, like every other element.","tag":"prefix goes last"},{"id":"sep-b-einsteigen","cat":"sep","type":"build","q":"einsteigen — Durchsage im Zug (Sie)","a":"Steigen Sie bitte ein!","why":"Infinitive + Sie + bitte + prefix.","tag":"prefix goes last"},{"id":"sep-t-anfangen","cat":"sep","type":"type","q":"anfangen — imperative, du-form","a":"Fang an!","why":"du fängst an: umlaut is dropped (rule ii), prefix goes last → Fang an!","sub":"du fängst an","alts":["Fange an!"],"tag":"prefix goes last"},{"id":"sep-t-mitnehmen","cat":"sep","type":"type","q":"mitnehmen — imperative, du-form","a":"Nimm mit!","why":"du nimmst mit: the e→i change survives (rule i), prefix goes last → Nimm mit!","sub":"du nimmst mit","tag":"prefix goes last"},{"id":"sep-t-vorlesen","cat":"sep","type":"type","q":"vorlesen — imperative, du-form","a":"Lies vor!","why":"du liest vor → Lies vor! Stem in -s, so the du-ending is only -t.","sub":"du liest vor","tag":"prefix goes last"},{"id":"sep-t-fernsehen","cat":"sep","type":"type","q":"fernsehen — imperative, du-form","a":"Sieh fern!","why":"du siehst fern → Sieh fern! e→ie kept, no -e.","sub":"du siehst fern","tag":"prefix goes last"},{"id":"sep-t-einschalten","cat":"sep","type":"type","q":"einschalten — imperative, du-form","a":"Schalte ein!","why":"Stem schalt- ends in -t, so the -e is obligatory even with a prefix: Schalte ein!","sub":"du schaltest ein","tag":"prefix goes last"},{"id":"sep-t-einladen","cat":"sep","type":"type","q":"einladen — imperative, du-form","a":"Lade ein!","why":"Drop the umlaut AND obey rule iii: stem lad- ends in -d, so Lade ein! (Duden lad[e]!, so the short Lad ein! is also correct.)","sub":"du lädst ein","alts":["Lad ein!"],"tag":"prefix goes last"},{"id":"sep-t-aufraeumen","cat":"sep","type":"type","q":"aufräumen — imperative, du-form","a":"Räum auf!","why":"Stem räum- ends in -m after a vowel, so no -e: Räum auf!","sub":"du räumst auf","alts":["Räume auf!"],"tag":"prefix goes last"},{"id":"sep-t-wegwerfen","cat":"sep","type":"type","q":"wegwerfen — imperative, du-form","a":"Wirf weg!","why":"du wirfst weg → Wirf weg! e→i kept.","sub":"du wirfst weg","tag":"prefix goes last"},{"id":"sep-t-nachschlagen","cat":"sep","type":"type","q":"nachschlagen — imperative, du-form","a":"Schlag nach!","why":"du schlägst nach: umlaut dropped → Schlag nach!","sub":"du schlägst nach","alts":["Schlage nach!"],"tag":"prefix goes last"},{"id":"sep-t-aufpassen","cat":"sep","type":"type","q":"aufpassen — imperative, du-form","a":"Pass auf!","why":"Stem pass- ends in -ss, so the du-form is passt; strip the -t → Pass auf!","sub":"du passt auf","alts":["Passe auf!"],"tag":"prefix goes last"},{"id":"sep-b-abholen","cat":"sep","type":"build","q":"abholen — bitte jemanden, dich um acht abzuholen","a":"Hol mich um acht ab!","why":"Pronoun, then time, then prefix.","tag":"prefix goes last"},{"id":"sep-b-mitbringen","cat":"sep","type":"build","q":"mitbringen — bitte einen Freund, Kuchen mitzubringen","a":"Bring bitte Kuchen mit!","why":"bitte early, object next, prefix last.","alts":["Bring Kuchen bitte mit!"],"tag":"prefix goes last"},{"id":"sep-b-anziehen","cat":"sep","type":"build","q":"anziehen — sag es zu einem Kind","a":"Zieh die Jacke an!","why":"Object between verb and prefix.","tag":"prefix goes last"},{"id":"sep-b-ausmachen","cat":"sep","type":"build","q":"ausmachen — bitte jemanden, das Licht auszumachen","a":"Mach das Licht aus!","why":"Object between verb and prefix.","tag":"prefix goes last"},{"id":"sep-b-ausfuellen","cat":"sep","type":"build","q":"ausfüllen — at a government office, formal (Sie)","a":"Füllen Sie das Formular aus!","why":"Infinitive + Sie + object + prefix.","tag":"prefix goes last"},{"id":"sep-b-zurueckkommen","cat":"sep","type":"build","q":"zurückkommen — say it to several friends (ihr)","a":"Kommt bitte pünktlich zurück!","why":"ihr-form Kommt, prefix zurück at the end.","tag":"prefix goes last"},{"id":"sep-b-nachdenken","cat":"sep","type":"build","q":"nachdenken — advise someone to think it over calmly","a":"Denk in Ruhe darüber nach!","why":"Everything else first, prefix nach last.","alts":["Denk darüber in Ruhe nach!"],"tag":"prefix goes last"},{"id":"sep-b-zuhoeren","cat":"sep","type":"build","q":"zuhören — ask someone to listen to you","a":"Hör mir bitte zu!","why":"zuhören takes the dative: Hör mir zu.","tag":"prefix goes last"},{"id":"sep-mc-order","cat":"sep","type":"mc","q":"Which sentence is correct?","opts":["Ruf mich morgen an!","Ruf an mich morgen!","Anruf mich morgen!","Ruf morgen an mich!"],"ans":0,"why":"The prefix leaves the verb and parks at the end of the clause. Nothing may follow it.","tag":"prefix goes last"},{"id":"sep-mc-wiederholen","cat":"sep","type":"mc","q":"wiederholen (inseparable) — which sentence is correct?","opts":["Wiederhol den Satz bitte!","Hol den Satz bitte wieder!","Wiederhole den Satz bitte wieder!","Wieder hol den Satz bitte!"],"ans":0,"why":"wiederholen is inseparable (stress on -ho-), so nothing splits off: Wiederhol den Satz!","tag":"separable vs inseparable"},{"id":"sep-mc-uebersetzen","cat":"sep","type":"mc","q":"übersetzen (inseparable, 'translate') — which sentence is correct?","opts":["Übersetz den Text ins Deutsche!","Setz den Text ins Deutsche über!","Übersetze den Text ins Deutsche über!","Über setz den Text ins Deutsche!"],"ans":0,"why":"Inseparable übersetzen keeps its prefix. (The separable homograph übersetzen means to ferry someone across.)","tag":"separable vs inseparable"},{"id":"sep-mc-unterschreiben","cat":"sep","type":"mc","q":"unterschreiben (inseparable) — which sentence is correct?","opts":["Unterschreib bitte hier!","Schreib bitte hier unter!","Unter schreib bitte hier!","Unterschreibe hier bitte unter!"],"ans":0,"why":"Inseparable: the prefix stays put. Unterschreiben Sie bitte hier is the formal version.","tag":"separable vs inseparable"},{"id":"sep-mc-verstehen","cat":"sep","type":"mc","q":"verstehen (inseparable) — which sentence is correct?","opts":["Versteh mich nicht falsch!","Steh mich nicht falsch ver!","Verstehe mich nicht falsch ver!","Ver versteh mich nicht falsch!"],"ans":0,"why":"ver- is never separable. Compare trennbar aufstehen → Steh auf!","tag":"separable vs inseparable"},{"id":"sep-mc-negprefix","cat":"sep","type":"mc","q":"Where does nicht go with separable verbs?","opts":["Before the prefix: Mach die Tür nicht zu!","Nach dem Verb: Mach nicht die Tür zu!","Ganz am Ende: Mach die Tür zu nicht!","Before the verb: Nicht mach die Tür zu!"],"ans":0,"why":"nicht lands late but still before the prefix — the prefix is always the last word.","tag":"negation + prefix"},{"id":"sep-t-cl-aufstehen","cat":"sep","type":"type","q":"Write the whole sentence (ihr): aufstehen, bitte","a":"Steht bitte auf!","why":"ihr steht auf → Steht bitte auf! Prefix at the end.","tag":"prefix goes last"},{"id":"sep-t-cl-umsteigen","cat":"sep","type":"type","q":"Write the whole sentence (Sie): umsteigen, bitte, am Hauptbahnhof","a":"Steigen Sie bitte am Hauptbahnhof um!","why":"Infinitive + Sie, then bitte, then the place, prefix um at the very end.","alts":["Steigen Sie am Hauptbahnhof bitte um!"],"tag":"prefix goes last"},{"id":"sep-b-absagen","cat":"sep","type":"build","q":"absagen — bitte jemanden, den Termin abzusagen","a":"Sag den Termin bitte ab!","why":"Object, bitte, prefix.","alts":["Sag bitte den Termin ab!"],"tag":"prefix goes last"},{"id":"sep-b-aufschreiben","cat":"sep","type":"build","q":"aufschreiben — rate jemandem, sich die Adresse aufzuschreiben","a":"Schreib dir die Adresse auf!","why":"Dative pronoun dir, then object, then prefix.","tag":"prefix goes last"},{"id":"sep-b-mitmachen","cat":"sep","type":"build","q":"mitmachen — sag es zu einer Gruppe von Freunden (ihr)","a":"Macht alle mit!","why":"ihr-form + alle + prefix.","tag":"prefix goes last"},{"id":"sep-b-weitermachen","cat":"sep","type":"build","q":"weitermachen — sag es formell (Sie)","a":"Machen Sie bitte weiter!","why":"Infinitive + Sie + bitte + prefix.","tag":"prefix goes last"},{"id":"neg-b-nicht1","cat":"neg","type":"build","q":"Tell a friend not to: das nicht machen","a":"Mach das nicht!","why":"nicht comes after the object pronoun das.","tag":"negation"},{"id":"neg-b-nicht2","cat":"neg","type":"build","q":"Remind a friend about his key (vergessen + nicht)","a":"Vergiss deinen Schlüssel nicht!","why":"nicht lands late — after the object.","tag":"negation"},{"id":"neg-b-nicht3","cat":"neg","type":"build","q":"Say: die Tür nicht zumachen","a":"Mach die Tür nicht zu!","why":"nicht goes before the prefix, never after it.","tag":"negation"},{"id":"neg-b-kein1","cat":"neg","type":"build","q":"Beruhige jemanden (haben + Angst)","a":"Hab keine Angst!","why":"Nouns are negated with kein-, not nicht. Angst → keine Angst.","tag":"kein vs nicht"},{"id":"neg-b-kein2","cat":"neg","type":"build","q":"Ask for quiet (machen + Lärm)","a":"Mach keinen Lärm!","why":"der Lärm, accusative → keinen Lärm.","tag":"kein vs nicht"},{"id":"neg-b-nie","cat":"neg","type":"build","q":"Say: das nie wieder sagen","a":"Sag das nie wieder!","why":"nie wieder replaces nicht entirely — never say nicht nie.","tag":"negation"},{"id":"neg-t-schnell","cat":"neg","type":"type","q":"Fill the gap: Fahr ___ so schnell!","a":"nicht","why":"An adverb like schnell is negated with nicht, not kein.","tag":"kein vs nicht"},{"id":"neg-t-sorgen","cat":"neg","type":"type","q":"Fill the gap (Sie): Machen Sie sich ___ Sorgen!","a":"neither","why":"die Sorgen is a plural noun → keine Sorgen.","tag":"kein vs nicht"},{"id":"neg-mc-place1","cat":"neg","type":"mc","q":"Which sentence is correct?","opts":["Ruf ihn nicht mehr an!","Ruf nicht ihn mehr an!","Ruf ihn an nicht mehr!","Nicht ruf ihn mehr an!"],"ans":0,"why":"Pronoun straight after the verb, then nicht mehr, then the prefix.","tag":"negation"},{"id":"neg-mc-place2","cat":"neg","type":"mc","q":"Which sentence is correct?","opts":["Sprich nicht so laut!","Sprich so laut nicht!","Nicht sprich so laut!","Sprich nicht so laut nicht!"],"ans":0,"why":"nicht sits in front of the phrase it negates (so laut).","tag":"negation"},{"id":"neg-mc-keinnicht","cat":"neg","type":"mc","q":"___ Zeit verlieren! What fits?","opts":["Verlier keine","Verlier nicht","Verliere nicht keine","Nicht verlier"],"ans":0,"why":"die Zeit is a noun without an article → kein-. Verlier keine Zeit!","tag":"kein vs nicht"},{"id":"neg-b-ihr","cat":"neg","type":"build","q":"Say to two children: nicht so laut sein","a":"Seid nicht so laut!","why":"ihr-Imperativ of sein is Seid, then nicht.","tag":"negation"},{"id":"neg-b-ernst","cat":"neg","type":"build","q":"Reassure someone: das nicht so ernst nehmen","a":"Nimm das nicht so ernst!","why":"e→i in Nimm, then object, then nicht.","tag":"negation"},{"id":"neg-b-warten","cat":"neg","type":"build","q":"Say: nicht auf mich warten","a":"Warte nicht auf mich!","why":"Stem wart- ends in -t → Warte. nicht before the prepositional phrase.","tag":"negation"},{"id":"neg-inf-rauchen","cat":"inf","type":"type","q":"Sign at a station: Bitte nicht ___. (rauchen)","a":"rauchen","why":"Signs use the bare infinitive, addressed to nobody in particular — no personal ending.","tag":"bare infinitive"},{"id":"neg-inf-schuetteln","cat":"inf","type":"type","q":"On a bottle: Vor Gebrauch ___. (schütteln)","a":"schütteln","why":"Instructions on packaging: infinitive, verb at the very end.","tag":"bare infinitive"},{"id":"neg-inf-abstand","cat":"inf","type":"type","q":"Sign: Bitte Abstand ___. (halten)","a":"halten","why":"Bare infinitive on signage. As a personal command it would be Halt Abstand!","tag":"bare infinitive"},{"id":"neg-b-rezept","cat":"inf","type":"build","q":"Recipe step: dice the onions and fry them (infinitive form)","a":"Zwiebeln klein schneiden und anbraten.","why":"Recipes stay in the infinitive; the separable prefix stays attached (anbraten, not brat an).","tag":"bare infinitive"},{"id":"neg-b-zug","cat":"inf","type":"build","q":"Sign on a train door: do not open before the train stops","a":"Nicht öffnen, bevor der Zug hält.","why":"nicht precedes the infinitive on signs.","tag":"bare infinitive"},{"id":"neg-mc-inf1","cat":"inf","type":"mc","q":"A sign on an escalator. Which form is typical?","opts":["Rechts stehen, links gehen.","Steh rechts, geh links!","Stehen Sie rechts, gehen Sie links!","Rechts stehst du, links gehst du."],"ans":0,"why":"Impersonal signage takes the bare infinitive. The other forms are correct German but address someone.","tag":"bare infinitive"},{"id":"neg-mc-inf2","cat":"inf","type":"mc","q":"U-Bahn announcement in Berlin:","opts":["Zurückbleiben, bitte!","Bleib zurück, bitte!","Zurück bleiben Sie, bitte!","Bleiben zurück, bitte!"],"ans":0,"why":"Announcements use the infinitive with the prefix still attached: zurückbleiben.","tag":"bare infinitive"},{"id":"neg-mc-inf3","cat":"inf","type":"mc","q":"What is different about the infinitive on signs?","opts":["The separable prefix stays attached to the verb","The verb always comes first","You always need bitte","You need a pronoun"],"ans":0,"why":"Nicht rauchen / Zurückbleiben keep the prefix; the imperative splits it off: Rauch nicht!","tag":"bare infinitive"},{"id":"neg-t-lehnen","cat":"inf","type":"type","q":"Sign on a train: Nicht aus dem Fenster ___. (lehnen)","a":"lehnen","why":"Bare infinitive, verb last.","tag":"bare infinitive"},{"id":"neg-t-rasen","cat":"inf","type":"type","q":"Sign in a park: Den Rasen nicht ___. (betreten)","a":"betreten","why":"Bare infinitive; betreten is inseparable so nothing splits.","tag":"bare infinitive"},{"id":"neg-mc-kein1","cat":"neg","type":"mc","q":"kein or nicht? — ___ Fotos machen!","opts":["Mach keine Fotos!","Mach nicht Fotos!","Mach kein Fotos!","Mach nichts Fotos!"],"ans":0,"why":"A noun without an article is negated with kein-, and it agrees: Fotos is plural → keine.","tag":"nicht or kein"},{"id":"neg-mc-kein2","cat":"neg","type":"mc","q":"kein or nicht? — Komm ___ zu spät!","opts":["nicht","kein","neither","nichts"],"ans":0,"why":"There is no noun to negate here — zu spät is an adverbial, so it takes nicht.","tag":"nicht or kein"},{"id":"neg-mc-trenn","cat":"neg","type":"mc","q":"Where does nicht go with a separable verb?","opts":["Before the prefix: Mach das Licht nicht aus!","After the prefix: Mach das Licht aus nicht!","Before the verb: Nicht mach das Licht aus!","At the start: Nicht mach aus das Licht!"],"ans":0,"why":"nicht comes late in the sentence but still in front of the separated prefix, because the prefix is glued to the very end: Mach das Licht nicht aus!","tag":"where nicht goes"},{"id":"neg-b-fenster","cat":"neg","type":"build","q":"Say to a friend: das Fenster nicht öffnen","a":"Öffne das Fenster nicht!","why":"Stem öffn- ends in a cluster + n, so the -e is obligatory; a definite object comes before nicht: Öffne das Fenster nicht!","tag":"where nicht goes"},{"id":"neg-b-wartet","cat":"neg","type":"build","q":"Say to two friends: nicht auf mich warten","a":"Wartet nicht auf mich!","why":"Plural of people you duz → ihr-form Wartet, and nicht goes in front of the prepositional phrase: Wartet nicht auf mich!","tag":"ihr and nicht"},{"id":"neg-t-rauch","cat":"neg","type":"type","q":"Politely ask a friend not to smoke (rauchen + bitte)","a":"Rauch bitte nicht!","why":"bitte sits right after the verb, nicht at the end: Rauch bitte nicht! (Rauch nicht, bitte! works too.)","alts":["Rauche bitte nicht!","Rauch nicht, bitte!"],"tag":"softened negation"},{"id":"inf-t-druecken","cat":"inf","type":"type","q":"Instruction manual: Den Knopf 3 Sekunden ___. (drücken)","a":"drücken","why":"Instructions use the plain infinitive, at the very end of the sentence.","tag":"infinitive on signs"},{"id":"inf-t-lagern","cat":"inf","type":"type","q":"On the packaging: Kühl und trocken ___. (lagern)","a":"lagern","why":"Standard packaging German: no person is addressed, so the infinitive stands alone.","tag":"infinitive on signs"},{"id":"inf-mc-warum","cat":"inf","type":"mc","q":"Why do signs so often use the infinitive?","opts":["It addresses everyone and sounds neutral","It is politer than the Sie-form","It is the ihr-form","It is the only form without a verb"],"ans":0,"why":"A sign has no particular addressee, so it avoids choosing between du, ihr and Sie.","tag":"infinitive on signs"},{"id":"inf-b-notfall","cat":"inf","type":"build","q":"Sign by an emergency exit: in an emergency, break the pane (infinitive form)","a":"Im Notfall die Scheibe einschlagen.","why":"Infinitive at the end and the prefix stays attached: einschlagen, not schlag ein.","tag":"infinitive on signs"},{"id":"inf-mc-praefix","cat":"inf","type":"mc","q":"Which line is the infinitive form for a sign?","opts":["Bitte die Türen freihalten.","Bitte halt die Türen frei.","Bitte haltet die Türen frei.","Bitte die Türen frei halten Sie."],"ans":0,"why":"The infinitive keeps the prefix on the verb (freihalten) and puts it last.","tag":"infinitive on signs"},{"id":"par-t-bitte","cat":"part","type":"type","q":"Fill the gap: Komm ___ um acht. (the plain softener)","a":"bitte","why":"bitte is the neutral politeness marker and fits every register.","tag":"particles"},{"id":"par-t-mal","cat":"part","type":"type","q":"Fill the gap: Guck ___! (casual, 'just have a look')","a":"mal","why":"mal makes a command small and casual — the single most common softener in speech.","tag":"particles"},{"id":"par-t-doch","cat":"part","type":"type","q":"Fill the gap: Komm ___ mit! (friendly nudge, 'go on')","a":"doch","why":"doch pushes in a friendly way: come on, join us.","tag":"particles"},{"id":"par-t-einfach","cat":"part","type":"type","q":"Fill the gap: Ruf mich ___ an. ('just — no fuss')","a":"einfach","why":"einfach removes the fuss: just call me, it's no trouble.","tag":"particles"},{"id":"par-t-ruhig","cat":"part","type":"type","q":"Fill the gap: Nimm dir ___ noch etwas. (reassuring, 'feel free')","a":"ruhig","why":"ruhig here means feel free, go ahead — not quietly.","tag":"particles"},{"id":"par-t-dochmal","cat":"part","type":"type","q":"Fill the gap: Probier das ___ ___. (the everyday pairing)","a":"doch mal","why":"doch mal is the everyday pairing: friendly urging plus casualness.","tag":"particles"},{"id":"par-mc-ruhig","cat":"part","type":"mc","q":"Nimm dir ruhig noch etwas. What does ruhig mean here?","opts":["Feel free / go ahead","Quietly","Slowly","Seriously"],"ans":0,"why":"As a modal particle ruhig reassures. The adverb ruhig (quietly) is a different use: Sitz ruhig!","tag":"particles"},{"id":"par-mc-mal","cat":"part","type":"mc","q":"Warte mal. What does mal do here?","opts":["It makes the request small and casual","It makes it more formal","It negates the request","It makes it more urgent"],"ans":0,"why":"mal shrinks a command to a small favour: hang on a second.","tag":"particles"},{"id":"par-mc-doch","cat":"part","type":"mc","q":"Frag ihn doch. What does doch do here?","opts":["A friendly nudge — go on","A prohibition","A question","Formal politeness"],"ans":0,"why":"doch nudges: go on, ask him.","tag":"particles"},{"id":"par-mc-place","cat":"part","type":"mc","q":"Where do the particles go in an imperative?","opts":["Right after the verb and any pronouns","Always at the end","Before the verb","Right before the separable prefix"],"ans":0,"why":"Verb — pronoun — particle — rest — prefix: Ruf mich doch mal an!","tag":"particles"},{"id":"par-b-dochmal","cat":"part","type":"build","q":"Casually ask a friend to call you (anrufen + doch mal)","a":"Ruf mich doch mal an!","why":"Pronoun first, then the particles, prefix last.","tag":"particles"},{"id":"par-b-ruhig","cat":"part","type":"build","q":"Offer someone another slice of cake (nehmen + ruhig)","a":"Nimm dir ruhig noch ein Stück!","why":"Dative dir, then ruhig, then the object.","tag":"particles"},{"id":"par-b-einfach","cat":"part","type":"build","q":"Say: einfach anrufen, wenn etwas ist","a":"Ruf mich einfach an!","why":"einfach between pronoun and prefix.","tag":"particles"},{"id":"par-b-bitte-sie","cat":"part","type":"build","q":"Formal: einen Moment warten (Sie + bitte)","a":"Warten Sie bitte einen Moment!","why":"Infinitive + Sie, then bitte.","alts":["Warten Sie einen Moment, bitte!"],"tag":"particles"},{"id":"par-mc-harsh","cat":"part","type":"mc","q":"Which version sounds least brusque?","opts":["Komm doch mal mit!","Komm mit!","Du kommst mit!","Mitkommen!"],"ans":0,"why":"Particles are the main tool for taking the edge off an imperative.","tag":"particles"},{"id":"par-mc-einfach","cat":"part","type":"mc","q":"Which particle fits: 'no fuss, just do it'?","opts":["einfach","ruhig","bitte","mal"],"ans":0,"why":"einfach = just, without making a thing of it.","tag":"particles"},{"id":"par-mc-context","cat":"part","type":"mc","q":"A friend hesitates before jumping into the water. What do you say?","opts":["Spring doch!","Spring bitte!","Spring einfach nicht!","Springen Sie!"],"ans":0,"why":"doch is the encouraging nudge in exactly this situation.","tag":"particles"},{"id":"par-t-sagmal","cat":"part","type":"type","q":"Fill the gap: ___ ___, hast du kurz Zeit? (sagen + particle)","a":"Sag mal","why":"Sag mal … opens a casual question — a fixed everyday phrase.","tag":"particles"},{"id":"par-t-hoermal","cat":"part","type":"type","q":"Fill the gap: ___ ___ zu! (hören, du + particle, 'listen a sec')","a":"Hör mal","why":"Hör mal zu! — verb, particle, prefix.","tag":"particles"},{"id":"par-mc-two","cat":"part","type":"mc","q":"Which word order is correct?","opts":["Probier das doch mal!","Probier das mal doch!","Doch mal probier das!","Probier doch das mal!"],"ans":0,"why":"doch mal is a fixed pair in that order, and it follows the object pronoun das here.","tag":"particles"},{"id":"who-mc-chef","cat":"who","type":"mc","q":"You are talking to your boss. How do you ask for a moment?","opts":["Warten Sie bitte einen Moment.","Warte bitte einen Moment.","Wartet bitte einen Moment.","Warten wir bitte einen Moment."],"ans":0,"why":"Formal, one person → Sie-form: infinitive + Sie.","tag":"choosing the form"},{"id":"who-mc-kinder","cat":"who","type":"mc","q":"You are talking to two children you address with du.","opts":["Seid leise!","Sei leise!","Seien Sie leise!","Seien wir leise!"],"ans":0,"why":"Several people, informal → ihr-form Seid.","tag":"choosing the form"},{"id":"who-mc-kolleg","cat":"who","type":"mc","q":"Three colleagues you address with du should come along.","opts":["Kommt doch mit!","Komm doch mit!","Kommen Sie doch mit!","Kommen wir doch mit!"],"ans":0,"why":"Informal plural is the ihr-form, whatever the setting.","tag":"choosing the form"},{"id":"who-mc-plural-sie","cat":"who","type":"mc","q":"Two customers should take a seat (formal).","opts":["Nehmen Sie bitte Platz.","Nehmt bitte Platz.","Nimm bitte Platz.","Nehmen wir bitte Platz."],"ans":0,"why":"Sie covers formal singular and plural — there is no separate formal plural.","tag":"choosing the form"},{"id":"who-mc-wir","cat":"who","type":"mc","q":"You suggest something to your group: ins Kino gehen.","opts":["Gehen wir ins Kino!","Geht ins Kino!","Geh ins Kino!","Gehen Sie ins Kino!"],"ans":0,"why":"The wir-form is the let's-form: infinitive + wir.","tag":"choosing the form"},{"id":"who-t-freund","cat":"who","type":"type","q":"To your best friend (mitkommen): ___ ___!","a":"Komm mit","why":"One person, informal → du-form without pronoun.","tag":"choosing the form"},{"id":"who-t-amt","cat":"who","type":"type","q":"In an email to a company (schicken): ___ ___ mir bitte die Rechnung.","a":"Schicken Sie","why":"Written formal register → Sie-form.","tag":"choosing the form"},{"id":"who-t-gruppe","cat":"who","type":"type","q":"Write the whole sentence to your two flatmates: die Küche aufräumen, bitte","a":"Räumt bitte die Küche auf!","why":"Informal plural → ihr räumt auf → Räumt bitte die Küche auf!","alts":["Räumt die Küche bitte auf!"],"tag":"choosing the form"},{"id":"who-mc-pronoun","cat":"who","type":"mc","q":"The du-imperative of mitkommen is Komm mit! — why no du?","opts":["The imperative drops the pronoun du","du always comes before the verb","You have to use the Sie-form","The sentence needs a question mark"],"ans":0,"why":"du and ihr disappear in the imperative. Only Sie and wir stay: Kommen Sie mit! (A stressed du is possible for contrast — Geh du voran! — but the plain imperative, and the exam answer, is the form without a pronoun.)","tag":"choosing the form"},{"id":"who-mc-sieform","cat":"who","type":"mc","q":"Which forms always keep their pronoun?","opts":["Sie and wir","du and ihr","only Sie","neither"],"ans":0,"why":"Kommen Sie! / Kommen wir! keep the pronoun; Komm! / Kommt! drop it.","tag":"choosing the form"},{"id":"who-mc-mix","cat":"who","type":"mc","q":"A waiter to a guest:","opts":["Kommen Sie bitte mit, Ihr Tisch ist frei.","Komm bitte mit, dein Tisch ist frei.","Kommt bitte mit, euer Tisch ist frei.","Kommen wir mit, unser Tisch ist frei."],"ans":0,"why":"Service situations are Sie by default, and the possessive follows: Ihr Tisch.","tag":"choosing the form"},{"id":"who-t-wir-pause","cat":"who","type":"type","q":"Suggestion to the team (machen): ___ ___ eine Pause!","a":"Machen wir","why":"Infinitive + wir = let's make a break.","tag":"choosing the form"},{"id":"who-mc-shop","cat":"who","type":"mc","q":"You ask a shop assistant for help.","opts":["Helfen Sie mir bitte kurz.","Hilf mir bitte kurz.","Helft mir bitte kurz.","Helfen wir mir bitte kurz."],"ans":0,"why":"Sie-form. Turning it into a question — Können Sie mir kurz helfen? — is politer still.","tag":"choosing the form"},{"id":"who-mc-family","cat":"who","type":"mc","q":"To your sister on the phone (anrufen, später):","opts":["Ruf mich später an!","Rufen Sie mich später an!","Ruft mich später an!","Rufen wir mich später an!"],"ans":0,"why":"Family and friends: du-form.","tag":"choosing the form"},{"id":"who-t-doctor","cat":"who","type":"type","q":"Write the whole sentence: doctor to a patient — einatmen, tief, bitte","a":"Atmen Sie bitte tief ein!","why":"Sie-form of einatmen: infinitive + Sie, then bitte and tief, prefix ein last.","alts":["Atmen Sie tief ein, bitte!","Atmen Sie bitte tief ein."],"tag":"choosing the form"},{"id":"who-mc-two-in-one","cat":"who","type":"mc","q":"One sentence to a colleague you address with Sie, and her colleague:","opts":["Kommen Sie beide bitte kurz her.","Kommt beide bitte kurz her.","Komm beide bitte kurz her.","Kommen wir beide bitte kurz her."],"ans":0,"why":"Two people you address formally are still Sie.","tag":"choosing the form"},{"id":"who-mc-sign","cat":"who","type":"mc","q":"A public sign addresses nobody in particular. Which form?","opts":["Infinitive: Bitte nicht rauchen.","du-form: Rauch bitte nicht.","ihr-form: Raucht bitte nicht.","wir-form: Rauchen wir bitte nicht."],"ans":0,"why":"Impersonal instructions default to the infinitive.","tag":"choosing the form"},{"id":"who-t-sie-plural","cat":"who","type":"type","q":"To two neighbours you address with Sie (sein, leise): ___ ___ bitte leise.","a":"Seien Sie","why":"Formal plural is identical to formal singular: Seien Sie.","tag":"choosing the form"},{"id":"who-mc-teacher","cat":"who","type":"mc","q":"A teacher to her class (whom she addresses with du):","opts":["Öffnet bitte eure Bücher.","Öffne bitte deine Bücher.","Öffnen Sie bitte Ihre Bücher.","Öffnen wir bitte unsere Bücher."],"ans":0,"why":"A class the teacher duzt is ihr — and the possessive agrees: eure.","tag":"choosing the form"},{"id":"ref-t-setzen-du","cat":"refl","type":"type","q":"sich setzen — imperative, du-form","a":"Setz dich!","why":"Reflexive pronoun follows the verb: du → dich.","alts":["Setze dich!"],"tag":"reflexive"},{"id":"ref-t-setzen-ihr","cat":"refl","type":"type","q":"sich setzen — imperative, ihr-form","a":"Setzt euch!","why":"ihr setzt euch → Setzt euch!","tag":"reflexive"},{"id":"ref-t-setzen-sie","cat":"refl","type":"type","q":"sich setzen — imperative, Sie-form","a":"Setzen Sie sich!","why":"Formal keeps sich: Setzen Sie sich, bitte.","tag":"reflexive"},{"id":"ref-t-beeilen-du","cat":"refl","type":"type","q":"sich beeilen — imperative, du-form","a":"Beeil dich!","why":"Stem beeil- needs no -e. Beeil dich!","alts":["Beeile dich!"],"tag":"reflexive"},{"id":"ref-t-beeilen-ihr","cat":"refl","type":"type","q":"sich beeilen — imperative, ihr-form","a":"Beeilt euch!","why":"ihr beeilt euch → Beeilt euch!","tag":"reflexive"},{"id":"ref-t-beruhigen","cat":"refl","type":"type","q":"sich beruhigen — imperative, du-form","a":"Beruhige dich!","why":"Stem beruhig- ends in the suffix -ig, so the -e is obligatory: Beruhige dich!","tag":"reflexive"},{"id":"ref-t-anmelden","cat":"refl","type":"type","q":"sich anmelden — imperative, du-form","a":"Melde dich an!","why":"Stem meld- ends in -d → -e obligatory; reflexive pronoun after the verb; prefix last.","tag":"reflexive"},{"id":"ref-t-ausruhen","cat":"refl","type":"type","q":"sich ausruhen — imperative, du-form","a":"Ruh dich aus!","why":"Verb, pronoun, prefix: Ruh dich aus!","alts":["Ruhe dich aus!"],"tag":"reflexive"},{"id":"ref-b-aerger","cat":"refl","type":"build","q":"Reassure someone (sich ärgern, nicht)","a":"Ärgere dich nicht!","why":"-ern verb: keep the stem -e and add -e → Ärgere. nicht at the end.","tag":"reflexive"},{"id":"ref-b-anziehen","cat":"refl","type":"build","q":"Say to a child: sich warm anziehen","a":"Zieh dich warm an!","why":"Pronoun straight after the verb, prefix last.","tag":"reflexive"},{"id":"ref-b-sorgen","cat":"refl","type":"build","q":"Beruhige eine Kundin formell (sich Sorgen machen)","a":"Machen Sie sich keine Sorgen!","why":"Sie-form + sich + kein-.","tag":"reflexive"},{"id":"ref-b-haende","cat":"refl","type":"build","q":"Say to a child: sich die Hände waschen","a":"Wasch dir die Hände!","why":"With a body part and an object the pronoun is dative: dir.","tag":"reflexive"},{"id":"ref-mc-pronoun","cat":"refl","type":"mc","q":"Which reflexive pronoun goes with the ihr-form?","opts":["euch","dich","sich","uns"],"ans":0,"why":"du → dich, ihr → euch, Sie → sich, wir → uns.","tag":"reflexive"},{"id":"ref-mc-order","cat":"refl","type":"mc","q":"Which sentence is correct?","opts":["Setz dich doch bitte hin!","Setz doch dich bitte hin!","Dich setz doch bitte hin!","Setz dich hin doch bitte!"],"ans":0,"why":"The reflexive pronoun comes first, right after the verb; the prefix stays last.","tag":"reflexive"},{"id":"ref-t-entschuldigen","cat":"refl","type":"type","q":"sich entschuldigen — imperative, du-form (bei ihr)","a":"Entschuldige dich bei ihr!","why":"Stem entschuldig- takes the obligatory -e, then the pronoun.","tag":"reflexive"},{"id":"ref-mc-sie","cat":"refl","type":"mc","q":"Formal: which form is correct?","opts":["Beeilen Sie sich bitte!","Beeilen Sie euch bitte!","Beeilen Sie dich bitte!","Beeil Sie sich bitte!"],"ans":0,"why":"The Sie-form takes sich.","tag":"reflexive"},{"id":"due-mc-which1","cat":"due","type":"mc","q":"Which verb needs the -e in the imperative?","opts":["atmen → Atme!","filmen → Film!","lernen → Lern!","kommen → Komm!"],"ans":0,"why":"atm- is consonant + m. In lern- and film- the m/n follows l or r, and komm- is m after m — no -e in those.","tag":"rule iii — obligatory -e"},{"id":"due-mc-which2","cat":"due","type":"mc","q":"Which verb does NOT need the -e?","opts":["wohnen → Wohn!","rechnen → Rechne!","öffnen → Öffne!","zeichnen → Zeichne!"],"ans":0,"why":"wohn- has n after h, which behaves like l and r. The other three have a real consonant cluster before the n.","tag":"rule iii — obligatory -e"},{"id":"due-mc-why","cat":"due","type":"mc","q":"Why is it Atme! but Lern!?","opts":["After consonant + m/n you need -e, but not after l, r, m, n, h","Because atmen is irregular","Because lernen is a weak verb","Because atmen has two syllables"],"ans":0,"why":"Your notes say consonant + m/n but not l/r; h, m and n behave the same way as l and r: wohn-, komm-, lern-, film- all take the bare stem.","tag":"rule iii — obligatory -e"},{"id":"due-mc-ig","cat":"due","type":"mc","q":"Which form is correct?","opts":["Entschuldige dich!","Entschuldig dich!","Entschuldigst dich!","Entschuldiget dich!"],"ans":0,"why":"Stems in the suffix -ig always take the -e in the imperative.","tag":"rule iii — obligatory -e"},{"id":"ihr-mc-ig","cat":"ihr","type":"mc","q":"Entschuldige! is the du-form. What is the ihr-form?","opts":["Entschuldigt!","Entschuldiget!","Entschuldige!","Entschuldigen!"],"ans":0,"why":"The -e of the imperative and the -et of the present tense are different rules. -ig triggers only the first: Entschuldige! but ihr entschuldigt.","tag":"ihr = present tense, no pronoun"},{"id":"ihr-mc-stem","cat":"ihr","type":"mc","q":"du nimmst → Nimm! What is the ihr-form of nehmen?","opts":["Nehmt!","Nimmt!","Nimmt ihr!","Nehmet!"],"ans":0,"why":"Stem changes live only in the du-form. The ihr imperative is the plain present-tense form.","tag":"ihr = present tense, no pronoun"},{"id":"ihr-mc-umlaut","cat":"ihr","type":"mc","q":"du fährst → Fahr! What is the ihr-form of fahren?","opts":["Fahrt!","Fährt!","Fahret!","Fährst!"],"ans":0,"why":"No umlaut in the ihr form to begin with: ihr fahrt.","tag":"ihr = present tense, no pronoun"},{"id":"due-mc-eln","cat":"due","type":"mc","q":"Which form is correct? — du-imperative of klingeln","opts":["Klingle!","Klingel!","Klingelst!","Klinglest!"],"ans":0,"why":"-eln verbs add the -e and drop the stem -e: klingel- → klingle.","tag":"verbs in -eln"},{"id":"due-mc-ern","cat":"due","type":"mc","q":"Which form is correct? — du-imperative of wandern","opts":["Wandere!","Wander!","Wanderst!","Wandret!"],"ans":0,"why":"-ern verbs add the -e and keep the stem -e: wander- → wandere.","tag":"verbs in -ern"},{"id":"du-mc-dated","cat":"du","type":"mc","q":"Komm! oder Komme! — was gilt heute?","opts":["Komm! — das -e ist hier optional und klingt altmodisch","Komme! — das -e ist Pflicht","Beide sind gleich häufig","Komme! ist die ihr-form"],"ans":0,"why":"Outside the obligatory cases the -e survives only in older or very formal writing.","tag":"rule iii — no -e needed"}];

const CATS = {
  du:    ["du-form: plain stems",       "kommen → Komm!"],
  due:   ["du-form: the obligatory -e", "arbeiten → Arbeite!"],

  sep:   ["Separable verbs",            "anrufen → Ruf an!"],
  neg:   ["Negation",                   "Mach das nicht! · Hab keine Angst!"],
  inf:   ["The infinitive on signs",    "Nicht rauchen · Zurückbleiben, bitte!"],
  part:  ["Modal particles",            "doch, mal, ruhig, einfach"],
  who:   ["Which form for whom?",       "du, ihr, Sie or wir"],
  refl:  ["Reflexive verbs",            "Setz dich! · Beeil dich!"],
};
const CATKEYS = Object.keys(CATS);

const MIN=60000, HOUR=60*MIN, DAY=24*HOUR;
const INTERVALS=[0, 12*MIN, DAY, 3*DAY, 7*DAY, 21*DAY];
const MASTER_BOX=4;

function norm(s){
  return (s||"").toString().toLowerCase()
    .replace(/[„“”"'‚‘’]/g,"")
    .replace(/[!?.,;:…]/g," ")
    .replace(/ß/g,"ss")
    .replace(/\s+/g," ").trim();
}
function hasUmlaut(s){ return /[äöü]/.test(s); }
function expandAe(s){ return s.replace(/ae/g,"ä").replace(/oe/g,"ö").replace(/ue/g,"ü"); }

function accepted(item){
  return [item.a].concat(item.alts||[]);
}
function isCorrect(item, given){
  const g = norm(given);
  if(!g) return false;
  for(const a of accepted(item)){
    const n = norm(a);
    if(g === n) return true;
    if(hasUmlaut(n) && expandAe(g) === n) return true;
  }
  return false;
}

/* Tell the learner what kind of mistake they made, not just that they made one. */
function diagnose(item, given){
  const g = norm(given), a = norm(item.a);
  if(!g) return "";
  if(g === a + "e") return "You added an -e that this verb does not take.";
  if(g + "e" === a) return "The obligatory -e is missing.";
  if(/\b(du|ihr)\b/.test(g) && !/\b(du|ihr)\b/.test(a))
    return "The du- and ihr-imperative drop the pronoun.";
  if(/(st|est)$/.test(g.split(" ")[0]) && !/(st|est)$/.test(a.split(" ")[0]))
    return "That is the present-tense du-form — the ending has to go.";
  if(hasUmlaut(g.split(" ")[0]) && !hasUmlaut(a.split(" ")[0]))
    return "The umlaut is dropped in the imperative.";
  if(!hasUmlaut(g.split(" ")[0]) && hasUmlaut(a.split(" ")[0]))
    return "This stem needs an umlaut.";
  const gw = g.split(" "), aw = a.split(" ");
  if(gw.length === aw.length && gw.slice().sort().join() === aw.slice().sort().join())
    return "Right words, wrong order.";
  if(aw.length > 1 && gw.length === 1) return "The whole sentence was asked for.";
  return "";
}

function tilesOf(ans){ return ans.split(/\s+/).map(w=>w.replace(/[!?.,;:„“”"']/g,"")).filter(Boolean); }

function fresh(){ return {box:0, due:0, seen:0, right:0, wrong:0, last:0}; }
function grade(rec, ok, now){
  const r = Object.assign(fresh(), rec);
  r.seen++; r.last = now;
  if(ok){ r.right++; r.box = Math.min(5, r.box + 1); }
  else  { r.wrong++; r.box = Math.max(0, r.box - 2); }
  r.due = now + INTERVALS[r.box];
  return r;
}
function isMastered(rec){ return !!rec && rec.box >= MASTER_BOX; }

function categoryStats(items, prog){
  const out = {};
  for(const it of items){
    const c = out[it.cat] || (out[it.cat] = {total:0, mastered:0, started:0, shaky:0});
    const r = prog[it.id];
    c.total++;
    if(isMastered(r)) c.mastered++;
    else if(r && r.seen){ c.started++; if(r.wrong > r.right) c.shaky++; }
  }
  return out;
}
function masteryPct(items, prog){
  if(!items.length) return 0;
  return Math.round(100 * items.filter(i=>isMastered(prog[i.id])).length / items.length);
}

/* due first (weakest box first), then unseen items up to a cap, then, if the user
   keeps going, whatever is furthest from mastery. */
function buildQueue(items, prog, now, opts){
  opts = opts || {};
  const pool = opts.cat ? items.filter(i=>i.cat===opts.cat) : items;
  const seen = [], unseen = [];
  for(const it of pool){
    const r = prog[it.id];
    if(!r || !r.seen) unseen.push(it);
    else if(r.due <= now || opts.ignoreSchedule) seen.push(it);
  }
  seen.sort((a,b)=>{
    const ra=prog[a.id], rb=prog[b.id];
    return ra.box - rb.box || ra.due - rb.due;
  });
  const newCap = opts.newCap == null ? 24 : opts.newCap;
  return seen.concat(unseen.slice(0, newCap));
}

function pickExam(items, prog, n){
  const per = {}; CATKEYS.forEach(c=>per[c]=[]);
  items.forEach(i=>{ if(per[i.cat]) per[i.cat].push(i); });
  CATKEYS.forEach(c=>{
    per[c].sort((a,b)=>{
      const ra=prog[a.id]||fresh(), rb=prog[b.id]||fresh();
      return (ra.box - rb.box) || (rb.wrong - ra.wrong) || Math.random()-0.5;
    });
  });
  const out = [];
  let i = 0;
  while(out.length < n){
    let added = 0;
    for(const c of CATKEYS){ if(per[c][i]){ out.push(per[c][i]); added++; if(out.length>=n) break; } }
    if(!added) break;
    i++;
  }
  return shuffle(out, Date.now());
}

function shuffle(arr, seed){
  const a = arr.slice();
  let s = seed >>> 0 || 1;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
