/* ---------- storage: window.storage in the artifact, localStorage in a saved
   copy of this file, memory as a last resort. Same async shape either way. ---- */
const KEY = "imperativ.drill.v1";
const Store = {
  mem: null,
  async load(){
    try{ if(window.storage){ const r = await window.storage.get(KEY); if(r && r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const v = localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
    return this.mem;
  },
  async save(obj){
    this.mem = obj;
    const s = JSON.stringify(obj);
    try{ if(window.storage){ await window.storage.set(KEY, s); return "cloud"; } }catch(e){}
    try{ localStorage.setItem(KEY, s); return "local"; }catch(e){}
    return "memory";
  },
  async clear(){
    this.mem = null;
    try{ if(window.storage) await window.storage.delete(KEY); }catch(e){}
    try{ localStorage.removeItem(KEY); }catch(e){}
  }
};

/* ---------- state ---------- */
let prog = {};            // id -> record
let store = "memory";
let view = "drill";
let queue = [], cur = null, answered = false, session = {right:0, done:0};
let mode = {cat:null, ignoreSchedule:false};
let picked = [];          // build-mode word slots
let root = null;          // the card currently on screen: #v-drill or #v-exam
let exam = null;

const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if(cls) e.className = cls; if(txt!=null) e.textContent = txt; return e; };
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

let saveTimer = null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{ store = await Store.save({v:1, prog}); paintFoot(); }, 250);
}

/* ---------- drill ---------- */
function nextItem(){
  answered = false; picked = [];
  if(!queue.length) queue = buildQueue(ITEMS, prog, Date.now(), mode);
  cur = queue.shift() || null;
  paintDrill();
}

function paintDrill(){
  const v = $("#v-drill"); v.innerHTML = ""; root = v;
  answered = false; picked = [];   // a freshly drawn card is always open for an answer
  if(!cur){
    const p = el("div","panel");
    const due = buildQueue(ITEMS, prog, Date.now(), {cat:mode.cat}).length;
    p.appendChild(el("h2", null, due ? "Ready when you are" : "Nothing due right now"));
    const lead = el("p","lead");
    lead.textContent = due
      ? "There are questions waiting."
      : "The gap between repetitions is the point — but you can keep going anyway.";
    p.appendChild(lead);
    const row = el("div","row");
    const a = el("button","btn","Keep practising");
    a.onclick = ()=>{ mode.ignoreSchedule = true; queue = buildQueue(ITEMS, prog, Date.now(), mode); nextItem(); };
    row.appendChild(a);
    if(mode.cat){
      const b = el("button","btn ghost","All rules");
      b.onclick = ()=>{ mode = {cat:null, ignoreSchedule:false}; queue = []; nextItem(); };
      row.appendChild(b);
    }
    p.appendChild(row); v.appendChild(p);
    return;
  }

  const plate = el("div","plate");
  const meta = el("div","meta");
  const left = el("div");
  left.appendChild(el("span","tag", cur.tag || CATS[cur.cat][0]));
  meta.appendChild(left);
  const rec = prog[cur.id];
  meta.appendChild(el("span", null, mode.cat ? CATS[cur.cat][0] : "Stufe " + ((rec&&rec.box)||0) + "/5"));
  plate.appendChild(meta);

  const q = el("p","q"); q.innerHTML = cur.q; plate.appendChild(q);
  if(cur.sub) plate.appendChild(el("div","sub", cur.sub));

  const ans = el("div","answer"); plate.appendChild(ans);
  const vd = el("div","verdict hide"); vd.setAttribute("role","status"); plate.appendChild(vd);
  v.appendChild(plate);

  if(cur.type === "mc") renderMC(ans);
  else if(cur.type === "build") renderBuild(ans);
  else renderType(ans);

  const foot = el("div","row");
  foot.appendChild(el("span","hintline", session.done
    ? `${session.right}/${session.done} right this session`
    : "Enter to check"));
  v.appendChild(foot);
}

function renderType(box){
  const i = document.createElement("input");
  i.type = "text"; i.className = "inp"; i.autocomplete = "off"; i.autocapitalize = "off";
  i.spellcheck = false; i.placeholder = "Type your answer";
  box.appendChild(i);
  const row = el("div","row");
  const b = el("button","btn","Check"); b.onclick = submit;
  row.appendChild(b);
  const s = el("button","btn quiet","Reveal"); s.onclick = ()=>submit(true);
  row.appendChild(s);
  row.appendChild(el("span","hintline","ae oe ue works instead of ä ö ü"));
  box.appendChild(row);
  i.focus();
  i.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); submit(); } };
}

function renderMC(box){
  const g = el("div","opts");
  cur.opts.forEach((o, k)=>{
    const b = el("button","opt"); b.dataset.k = k;
    b.appendChild(el("span","k", String(k+1)));
    b.appendChild(el("span", null, o));
    b.onclick = ()=>{ if(!answered) submitMC(k); };
    g.appendChild(b);
  });
  box.appendChild(g);
  box.appendChild(el("div","hintline")).innerHTML =
    "Mit <kbd>1</kbd>–<kbd>" + cur.opts.length + "</kbd> geht es schneller";
}

function renderBuild(box){
  const slot = el("div","slot"); box.appendChild(slot);
  const bank = el("div","bank"); box.appendChild(bank);
  const solved = tilesOf(cur.a);
  let words = shuffle(solved, cur.id.length * 7919 + cur.a.length);
  if(solved.length > 1 && words.join(" ") === solved.join(" ")) words = words.slice(1).concat(words[0]);
  words.forEach((w, k)=>{
    const t = el("button","tile", w); t.dataset.k = k;
    t.onclick = ()=>{ if(answered) return; picked.push({w, k}); paintTiles(); };
    bank.appendChild(t);
  });
  const row = el("div","row");
  const b = el("button","btn","Check"); b.onclick = submit; row.appendChild(b);
  const u = el("button","btn quiet","Clear tiles"); u.onclick = ()=>{ if(!answered){ picked = []; paintTiles(); } };
  row.appendChild(u);
  const s = el("button","btn quiet","Reveal"); s.onclick = ()=>submit(true); row.appendChild(s);
  box.appendChild(row);
  paintTiles();
}
function paintTiles(){
  const slot = root.querySelector(".slot"); slot.innerHTML = "";
  picked.forEach((p, idx)=>{
    const t = el("button","tile", p.w);
    t.onclick = ()=>{ if(answered) return; picked.splice(idx,1); paintTiles(); };
    slot.appendChild(t);
  });
  const used = new Set(picked.map(p=>p.k));
  [...root.querySelector(".bank").children].forEach(t=> t.classList.toggle("used", used.has(+t.dataset.k)));
}

function submitMC(k){
  answered = true;
  const ok = k === cur.ans;
  [...root.querySelectorAll(".opt")].forEach(b=>{
    b.disabled = true;
    const i = +b.dataset.k;
    if(i === cur.ans) b.classList.add("right");
    else if(i === k) b.classList.add("wrong");
  });
  finish(ok, cur.opts[k]);
}

function submit(reveal){
  if(answered) return;
  let given = "";
  if(cur.type === "build") given = picked.map(p=>p.w).join(" ");
  else given = (root.querySelector(".inp") || {}).value || "";
  if(reveal !== true && !norm(given)) return;
  answered = true;
  const ok = reveal === true ? false : isCorrect(cur, given);
  if(reveal === true) given = "";
  finish(ok, given, reveal === true);
}

function finish(ok, given, revealed){
  if(exam){ return examAnswer(ok); }
  session.done++; if(ok) session.right++;
  prog[cur.id] = grade(prog[cur.id], ok, Date.now());
  if(!ok) queue.splice(Math.min(4, queue.length), 0, cur);   // come back soon
  persist();

  const plate = root.querySelector(".plate");
  plate.classList.add(ok ? "ok" : "no");
  const v = root.querySelector(".verdict"); v.className = "verdict"; v.innerHTML = "";
  const call = el("div", "call " + (ok ? "ok" : "no"));
  call.appendChild(el("span", null, ok ? "Correct." : (revealed ? "Answer:" : "Not quite.")));
  if(!ok) call.appendChild(el("span","sol", cur.type === "mc" ? cur.opts[cur.ans] : cur.a));
  v.appendChild(call);
  if(!ok && !revealed && cur.type !== "mc"){
    const d = diagnose(cur, given);
    if(d) v.appendChild(el("div","diag", d));
  }
  if(!ok && (cur.alts||[]).length) v.appendChild(el("div","hintline","Also accepted: " + cur.alts.join(" · ")));
  v.appendChild(el("div","why", cur.why));
  const row = el("div","row");
  const n = el("button","btn next","Next"); n.onclick = nextItem;
  row.appendChild(n);
  row.appendChild(el("span","hintline","Enter"));
  v.appendChild(row);
  paintMastery();
  n.focus();
}

/* ---------- stats ---------- */
function paintStats(){
  const v = $("#v-stats"); v.innerHTML = "";
  const st = categoryStats(ITEMS, prog);
  const p = el("div","panel");
  p.appendChild(el("h2", null, "Mastery by rule"));
  p.appendChild(el("p","lead",
    "A question counts as secure once you have had it right four times in a row, spread over several days. Green is secure, blue is started, yellow is shaky."));
  CATKEYS.forEach(c=>{
    const s = st[c] || {total:0, mastered:0, started:0, shaky:0};
    const d = el("div","cat");
    const nm = el("div","name"); nm.textContent = CATS[c][0] + " ";
    nm.appendChild(el("em", null, "· " + CATS[c][1]));
    d.appendChild(nm);
    d.appendChild(el("div","num", s.mastered + "/" + s.total));
    const bar = el("div","bar");
    const m = el("i","m"), pr = el("i","p"), w = el("i","w");
    const tot = s.total || 1;
    m.style.width = (100*s.mastered/tot) + "%";
    pr.style.width = (100*Math.max(0, s.started - s.shaky)/tot) + "%";
    w.style.width = (100*s.shaky/tot) + "%";
    bar.append(m, pr, w); d.appendChild(bar);
    const b = el("button","btn ghost catbtn", "Practise this rule");
    b.onclick = ()=>{ mode = {cat:c, ignoreSchedule:true}; queue = []; go("drill"); nextItem(); };
    d.appendChild(b);
    p.appendChild(d);
  });
  v.appendChild(p);

  const soon = el("div","panel");
  soon.appendChild(el("h2", null, "Due"));
  const now = Date.now();
  const dueNow = ITEMS.filter(i=>prog[i.id] && prog[i.id].seen && prog[i.id].due <= now).length;
  const later = ITEMS.filter(i=>prog[i.id] && prog[i.id].due > now)
                     .sort((a,b)=>prog[a.id].due - prog[b.id].due)[0];
  const unseen = ITEMS.filter(i=>!prog[i.id] || !prog[i.id].seen).length;
  const l = el("p","lead");
  l.textContent = dueNow + " due for review · " + unseen + " never seen"
    + (later ? " · next review " + when(prog[later.id].due - now) : "");
  soon.appendChild(l);
  v.appendChild(soon);
}
function when(ms){
  if(ms < HOUR) return "in " + Math.max(1, Math.round(ms/MIN)) + " min";
  if(ms < DAY) return "in " + Math.round(ms/HOUR) + " h";
  return "in " + Math.round(ms/DAY) + " days";
}

/* ---------- exam ---------- */
function paintExam(){
  const v = $("#v-exam"); v.innerHTML = ""; root = v;
  if(!exam){
    const p = el("div","panel");
    p.appendChild(el("h2", null, "Test mode"));
    p.appendChild(el("p","lead",
      "22 questions across all twelve rules, with no explanations along the way. The selection favours whatever you are least sure of. At the end you see which rule cost you points."));
    const b = el("button","btn","Start the test");
    b.onclick = ()=>{
      exam = {items: pickExam(ITEMS, prog, 22), i:0, right:0, log:[], t0:Date.now()};
      cur = exam.items[0]; answered = false; picked = [];
      paintExamItem();
    };
    p.appendChild(b); v.appendChild(p);
    return;
  }
  paintExamItem();
}
function paintExamItem(){
  const v = $("#v-exam"); v.innerHTML = ""; root = v;
  if(exam.i >= exam.items.length) return paintExamResult();
  cur = exam.items[exam.i]; answered = false; picked = [];
  const plate = el("div","plate");
  const meta = el("div","meta");
  meta.appendChild(el("span","tag", "Question " + (exam.i+1) + " of " + exam.items.length));
  meta.appendChild(el("span", null, CATS[cur.cat][0]));
  plate.appendChild(meta);
  const q = el("p","q"); q.innerHTML = cur.q; plate.appendChild(q);
  if(cur.sub) plate.appendChild(el("div","sub", cur.sub));
  const ans = el("div","answer"); plate.appendChild(ans);
  v.appendChild(plate);
  if(cur.type === "mc") renderMC(ans);
  else if(cur.type === "build") renderBuild(ans);
  else renderType(ans);
}
function examAnswer(ok){
  exam.log.push({item:cur, ok});
  if(ok) exam.right++;
  prog[cur.id] = grade(prog[cur.id], ok, Date.now());
  persist();
  exam.i++;
  paintExamItem();
}
function paintExamResult(){
  const v = $("#v-exam"); v.innerHTML = ""; root = v;
  const p = el("div","panel");
  const d = el("div","done");
  d.appendChild(el("div","big", exam.right + "/" + exam.items.length));
  const mins = Math.max(1, Math.round((Date.now()-exam.t0)/MIN));
  d.appendChild(el("div","lead", "in " + mins + " min"));
  p.appendChild(d);
  const wrong = exam.log.filter(x=>!x.ok);
  if(wrong.length){
    p.appendChild(el("h2", null, "Not there yet"));
    const list = el("div","scorelist");
    wrong.forEach(x=>{
      const r = el("div");
      r.innerHTML = "<b class='de'>" + esc(x.item.type === "mc" ? x.item.opts[x.item.ans] : x.item.a)
        + "</b> — " + esc(x.item.why);
      list.appendChild(r);
    });
    p.appendChild(list);
  } else {
    p.appendChild(el("p","lead","All correct. The review schedule carries on regardless."));
  }
  const row = el("div","row");
  const again = el("button","btn","Another test");
  again.onclick = ()=>{ exam = null; paintExam(); };
  const back = el("button","btn ghost","Back to practice");
  back.onclick = ()=>{ exam = null; queue = []; go("drill"); nextItem(); };
  row.append(again, back); p.appendChild(row);
  v.appendChild(p);
  paintMastery();
}

/* ---------- rules ---------- */
const RULES = `
<div class="panel rules">
<h3>The four forms of address</h3>
<table>
<tr><th>Address</th><th>How it is built</th><th>Example</th></tr>
<tr><td>du — one person, informal</td><td>verb stem, no pronoun</td><td class="de">Komm!</td></tr>
<tr><td>ihr — several, informal</td><td>= present-tense ihr-form, no pronoun</td><td class="de">Kommt!</td></tr>
<tr><td>Sie — formal, singular and plural</td><td>infinitive + Sie</td><td class="de">Kommen Sie!</td></tr>
<tr><td>wir — &ldquo;let's&rdquo;</td><td>infinitive + wir</td><td class="de">Kommen wir!</td></tr>
</table>

<h3>The du-form in three checks</h3>
<p>Start from the present-tense du-form and strike the ending and the pronoun: du komm<b>st</b> → <span class="de">Komm!</span>
After a stem in -s, -ß or -z the ending is only <b>-t</b>: du lie<b>st</b> → <span class="de">Lies!</span></p>
<p><b>i. Does the du-form change e → i/ie?</b> Keep the change, never add an -e.<br>
geben → du gibst → <span class="de">Gib!</span> · nehmen → <span class="de">Nimm!</span> · lesen → <span class="de">Lies!</span> ·
sehen → <span class="de">Sieh!</span> · essen → <span class="de">Iss!</span> · helfen → <span class="de">Hilf!</span> ·
sprechen → <span class="de">Sprich!</span> · vergessen → <span class="de">Vergiss!</span> · treffen → <span class="de">Triff!</span> ·
werfen → <span class="de">Wirf!</span></p>
<p><b>ii. Does the du-form take an umlaut (a → ä, au → äu, o → ö)?</b> Throw the umlaut away.<br>
fahren → du fährst → <span class="de">Fahr!</span> · laufen → <span class="de">Lauf!</span> · schlafen → <span class="de">Schlaf!</span> ·
tragen → <span class="de">Trag!</span> · halten → <span class="de">Halt!</span> · stoßen → <span class="de">Stoß!</span><br>
Losing the umlaut is all that happens — check iii still applies:
raten → du rätst → <span class="de">Rate!</span> · einladen → du lädst ein → <span class="de">Lade ein!</span></p>
<p><b>iii. Otherwise: do you need an -e?</b> It is obligatory after stems in <b>-d</b>, <b>-t</b>, <b>-ig</b>
and after consonant + <b>m/n</b>. Everywhere else it is optional and sounds old-fashioned (Komme!, Gehe!).<br>
<span class="de">Arbeite! Warte! Finde! Entschuldige! Atme! Rechne! Öffne!</span></p>
<div class="note"><b>A correction to your notes.</b> With consonant + m/n, it is not only l and r that are
exceptions but also h, m and n: <span class="de">Wohn! Komm! Lern! Film!</span> — but
<span class="de">Atme! Rechne! Öffne! Zeichne! Trockne!</span>, because those are real consonant clusters.
</div>
<div class="note"><b>A second correction.</b> Check ii does <i>not</i> switch off check iii. With the strong
umlaut verbs whose stem ends in -t/-d, both forms are correct, because the present tense has no -e either
(<span class="de">du hältst, du rätst, du lädst</span> — not <i>du haltest</i>). Duden therefore writes
<span class="de">halt[e]!, rat[e]!, lad[e]!</span>. This app asks for the dictionary form
(<span class="de">Rate! Lade ein!</span>) but always accepts the short one too.
Weak verbs get no such choice: <span class="de">Arbeite! Melde! Warte!</span></div>
<p><b>Verbs in -eln / -ern</b> take the -e; <b>-eln</b> drops the stem -e in the process, <b>-ern</b> keeps it:
sammeln → <span class="de">Sammle!</span> · lächeln → <span class="de">Lächle!</span> · ändern → <span class="de">Ändere!</span></p>

<h3>The ihr-form</h3>
<p>Identical to the present tense. Strike the pronoun and you are done. No stem changes, no exceptions —
not even sein (ihr seid → <span class="de">Seid!</span>).<br>
ihr gebt → <span class="de">Gebt!</span> · ihr fahrt → <span class="de">Fahrt!</span> · ihr arbeitet → <span class="de">Arbeitet!</span></p>
<div class="note">The obligatory -e of the imperative and the -et of the present tense are two different
rules. Only the first is triggered by -ig: <span class="de">Entschuldige!</span> but <span class="de">ihr entschuldigt</span>.</div>

<div class="note">A stressed <span class="de">du</span> is possible for contrast —
<span class="de">Geh du voran!</span>, <span class="de">Frag du ihn!</span> — but the neutral request,
and the exam answer, has no pronoun.</div>

<h3>The Sie-form</h3>
<p>Infinitive + Sie, in that order. sein is the only exception: <span class="de">Seien Sie!</span><br>
<span class="de">Kommen Sie bitte herein. · Nehmen Sie Platz. · Warten Sie einen Moment.</span></p>

<h3>The four irregulars</h3>
<table>
<tr><th></th><th>sein</th><th>haben</th><th>werden</th><th>wissen</th></tr>
<tr><td>du</td><td class="de">Sei!</td><td class="de">Hab!</td><td class="de">Werde!</td><td class="de">Wisse! (lit.)</td></tr>
<tr><td>ihr</td><td class="de">Seid!</td><td class="de">Habt!</td><td class="de">Werdet!</td><td class="de">Wisst!</td></tr>
<tr><td>Sie</td><td class="de">Seien Sie!</td><td class="de">Haben Sie!</td><td class="de">Werden Sie!</td><td class="de">Wissen Sie!</td></tr>
<tr><td>wir</td><td class="de">Seien wir!</td><td class="de">Haben wir!</td><td></td><td></td></tr>
</table>

<h3>Separable verbs</h3>
<p>The prefix moves to the end — nothing stands behind it.<br>
aufstehen → <span class="de">Steh bitte auf!</span> · anrufen → <span class="de">Ruf mich heute Abend an!</span> ·
zumachen → <span class="de">Macht die Tür zu!</span> · mitkommen → <span class="de">Kommen Sie doch mit!</span> ·
aufhören → <span class="de">Hör endlich auf!</span> · einsteigen → <span class="de">Steigen Sie bitte ein!</span></p>

<h3>Negation and the impersonal request</h3>
<p><b>nicht</b> comes late but still before the prefix; nouns are negated with <b>kein-</b>.<br>
<span class="de">Mach das nicht! · Vergiss deinen Schlüssel nicht! · Mach die Tür nicht zu! ·
Hab keine Angst! · Mach keinen Lärm! · Sag das nie wieder!</span></p>
<p><b>The bare infinitive</b> is used for signs, instructions and recipes — addressed to nobody in
particular. The separable prefix stays attached to the verb.<br>
<span class="de">Bitte nicht rauchen. · Nicht öffnen, bevor der Zug hält. · Vor Gebrauch schütteln. ·
Zwiebeln klein schneiden und anbraten. · Bitte Abstand halten.</span></p>

<h3>Particles — how to stop the imperative sounding brusque</h3>
<table>
<tr><th>Particle</th><th>Effect</th><th>Example</th></tr>
<tr><td>bitte</td><td>the plain softener</td><td class="de">Komm bitte um acht.</td></tr>
<tr><td>mal</td><td>casual, a small thing, &ldquo;just&rdquo;</td><td class="de">Guck mal! · Warte mal.</td></tr>
<tr><td>doch</td><td>a friendly nudge, &ldquo;go on&rdquo;</td><td class="de">Komm doch mit! · Frag ihn doch.</td></tr>
<tr><td>doch mal</td><td>the everyday pairing</td><td class="de">Probier das doch mal.</td></tr>
<tr><td>einfach</td><td>&ldquo;just — no fuss&rdquo;</td><td class="de">Ruf mich einfach an.</td></tr>
<tr><td>ruhig</td><td>reassuring, &ldquo;feel free&rdquo;</td><td class="de">Nimm dir ruhig noch etwas.</td></tr>
</table>
<p>Order: verb — pronoun — particle — the rest — prefix. <span class="de">Ruf mich doch mal an!</span></p>
</div>`;

/* ---------- chrome ---------- */
function paintMastery(){
  const pct = masteryPct(ITEMS, prog);
  const seen = ITEMS.filter(i=>prog[i.id] && prog[i.id].seen).length;
  $("#mastery").innerHTML = "<b>" + pct + "%</b> secure · " + seen + "/" + ITEMS.length + " started";
  paintFoot();
}
function paintFoot(){
  const where = store === "cloud" ? "saved" : store === "local"
    ? "saved in this browser" : "this session only";
  $("#footinfo").textContent = ITEMS.length + " questions · progress " + where;
}
function go(name){
  view = name;
  ["drill","stats","exam","rules"].forEach(n=>{
    $("#v-" + n).classList.toggle("hide", n !== name);
    $("#t-" + n).setAttribute("aria-selected", String(n === name));
  });
  if(name === "stats") paintStats();
  if(name === "exam") paintExam();
  if(name === "rules") $("#v-rules").innerHTML = RULES;
  window.scrollTo({top:0, behavior:"instant"});
}
$("#t-drill").onclick = ()=>{ exam = null; go("drill"); if(!cur) nextItem(); else paintDrill(); };
$("#t-stats").onclick = ()=>{ exam = null; go("stats"); };
$("#t-exam").onclick  = ()=> go("exam");
$("#t-rules").onclick = ()=>{ exam = null; go("rules"); };
$("#reset").onclick = async ()=>{
  if(!confirm("This clears all progress. Continue?")) return;
  prog = {}; await Store.clear(); queue = []; session = {right:0, done:0}; exam = null;
  nextItem(); go("drill"); paintMastery();
};

document.addEventListener("keydown", e=>{
  if(view === "rules" || view === "stats") return;
  const t = e.target || {};
  if(t.tagName === "INPUT") return;              // the field runs its own Enter handler
  if(!answered && cur && cur.type === "mc" && /^[1-9]$/.test(e.key)){
    const k = +e.key - 1;
    if(k < cur.opts.length){ e.preventDefault(); submitMC(k); }
    return;
  }
  if(e.key === "Enter" && answered && !exam){
    if(t.tagName === "BUTTON") return;           // the button's own click already fires
    e.preventDefault(); nextItem();
  }
});

/* a small handle on the running state — handy in the console, used by the tests */
window.app = {
  ITEMS, CATS, tilesOf, isCorrect, buildQueue, categoryStats, masteryPct,
  get cur(){ return cur; }, get prog(){ return prog; }, get queue(){ return queue; },
};

(async function boot(){
  const saved = await Store.load();
  if(saved && saved.prog) prog = saved.prog;
  store = await Store.save({v:1, prog});
  queue = buildQueue(ITEMS, prog, Date.now(), mode);
  nextItem(); paintMastery();
})();
</script>
