<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konjunktiv II — wäre, hätte, würde</title>
<style>
:root{
  --paper:#EDEBE3; --card:#F8F7F2; --card-2:#E7E5DB;
  --ink:#1C1F1A; --ink-2:#5E635A; --ink-3:#8B9083;
  --rule:#D2D1C6; --rule-2:#BFBDB0;
  --acc:#2F4A8A; --acc-soft:#E1E7F4;
  --neg:#B3261E; --neg-soft:#F6E3E0;
  --yes:#2C6A48; --yes-soft:#E0EDE4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#15171A; --card:#1D2024; --card-2:#262A2F;
    --ink:#E9E7DF; --ink-2:#A8ADA3; --ink-3:#767C72;
    --rule:#333840; --rule-2:#454B54;
    --acc:#94ACEA; --acc-soft:#232B40;
    --neg:#E8776A; --neg-soft:#33211F;
    --yes:#7CC79B; --yes-soft:#1B2A22;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:2px}
[lang=de]{font-family:var(--serif)}
b{font-weight:600}

/* ---------- top rail ---------- */
.rail{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--rule)}
.rail-in{max-width:720px;margin:0 auto;padding:10px 20px 8px}
.rail-top{display:flex;align-items:baseline;gap:10px}
.wordmark{font-family:var(--serif);font-size:17px;white-space:nowrap}
.wordmark b{color:var(--acc);font-weight:600}
.rail-spacer{flex:1}
.navbtn{font-size:13px;color:var(--ink-2);padding:3px 8px;border-radius:4px}
.navbtn.on{color:var(--ink);background:var(--card-2)}
.meter{display:flex;height:5px;margin-top:8px;background:var(--card-2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%}
.meter .m5{background:var(--yes)} .meter .m3{background:var(--acc)} .meter .m1{background:var(--rule-2)}
.railstat{font-size:12px;color:var(--ink-3);margin-top:4px}

main{max-width:720px;margin:0 auto;padding:22px 20px 40px}
h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:500;font-size:21px;margin:30px 0 10px}
h3{font-size:14px;font-weight:600;margin:20px 0 6px;color:var(--ink-2)}
p{margin:0 0 10px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.hidden{display:none !important}

/* ---------- home ---------- */
.lead{font-size:17px;color:var(--ink-2);max-width:56ch}
.soften{margin:22px 0 6px;padding:18px 20px;background:var(--card);border:1px solid var(--rule);border-radius:10px}
.soften .row{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;font-family:var(--serif);font-size:20px}
.soften .row+.row{margin-top:8px}
.soften .tag{font-family:var(--sans);font-size:12px;color:var(--ink-3)}
.soften .direct{color:var(--ink-2)}
.soften .soft em{font-style:normal;color:var(--acc);font-weight:600;border-bottom:2px solid var(--acc)}
.soften .arrow{grid-column:2;font-family:var(--sans);font-size:12px;color:var(--ink-3);margin:2px 0}
.soften .more{margin-top:10px;font-size:13px;color:var(--acc)}

.setup{margin-top:26px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.opt{padding:8px 13px;border:1px solid var(--rule-2);border-radius:20px;font-size:14px;background:var(--card)}
.opt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.opt small{opacity:.7;margin-left:4px}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 4px}
@media (max-width:480px){.topics{grid-template-columns:1fr}}
.tchip{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--card);text-align:left}
.tchip.on{border-color:var(--acc);background:var(--acc-soft)}
.tchip .nm{font-size:14px;line-height:1.25}
.tchip .bl{font-size:12px;color:var(--ink-3);line-height:1.25}
.tchip .pct{margin-left:auto;font-size:12px;color:var(--ink-2);white-space:nowrap}
.tchip .box{width:9px;height:9px;border-radius:2px;background:var(--rule-2);flex:none}
.tchip .box.done{background:var(--yes)} .tchip .box.mid{background:var(--acc)}
.primary{display:inline-block;background:var(--acc);color:#fff;padding:12px 22px;border-radius:8px;font-weight:600;font-size:16px;margin-top:18px}
.primary:disabled{opacity:.5;cursor:default}
.secondary{display:inline-block;background:var(--card-2);padding:11px 18px;border-radius:8px;font-size:15px}
.linkbtn{color:var(--acc);font-size:14px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.plan{margin-top:14px;font-size:13px;color:var(--ink-3)}

/* ---------- drill ---------- */
.dhead{display:flex;align-items:baseline;gap:12px;font-size:13px;color:var(--ink-3)}
.dhead .n{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.dhead .t{flex:1}
.card{margin-top:12px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:20px 20px 18px}
.instr{font-size:13px;color:var(--ink-2);margin-bottom:10px}
.prompt{font-family:var(--serif);font-size:23px;line-height:1.4;margin:0 0 14px}
.prompt.en{font-family:var(--sans);font-size:19px}
.prompt .gapin{display:inline-block;width:8.5ch;min-width:5ch;margin:0 2px;padding:1px 6px 0;border:none;border-bottom:2px solid var(--rule-2);background:transparent;font-family:var(--serif);font-size:23px;text-align:center;border-radius:0}
.prompt .gapin:focus{border-bottom-color:var(--acc);outline:none}
.prompt .gapin.ok{border-bottom-color:var(--yes);color:var(--yes)}
.prompt .gapin.bad{border-bottom-color:var(--neg);color:var(--neg);text-decoration:line-through}
.cue{font-size:13px;color:var(--ink-3);margin:-6px 0 12px}
.cue b{color:var(--acc);font-weight:600;font-family:var(--serif);font-size:15px}
.hint{font-size:12px;color:var(--ink-3);margin-left:8px;font-family:var(--sans)}
.direct{font-size:12px;color:var(--ink-3);margin:-6px 0 12px}

.choices{display:grid;gap:8px}
.choice{display:flex;gap:12px;align-items:baseline;text-align:left;padding:11px 14px;border:1px solid var(--rule-2);border-radius:8px;background:var(--paper);font-size:16px;line-height:1.35}
.choice[lang=de]{font-size:17px}
.choice .k{font-family:var(--sans);font-size:12px;color:var(--ink-3);min-width:12px}
.choice.pick{border-color:var(--acc);background:var(--acc-soft)}
.choice.yes{border-color:var(--yes);background:var(--yes-soft)}
.choice.no{border-color:var(--neg);background:var(--neg-soft)}
.choice:disabled{cursor:default}

.typedin{width:100%;padding:12px 14px;border:1px solid var(--rule-2);border-radius:8px;background:var(--paper);font-family:var(--serif);font-size:20px}
.typedin:focus{border-color:var(--acc);outline:none}
.typedin.ok{border-color:var(--yes)} .typedin.bad{border-color:var(--neg)}
.keys{display:flex;gap:6px;margin-top:8px}
.key{padding:6px 0;width:44px;text-align:center;border:1px solid var(--rule);border-radius:6px;font-family:var(--serif);font-size:17px;background:var(--card-2)}

.builder{min-height:52px;padding:10px 12px;border:1px dashed var(--rule-2);border-radius:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--serif);font-size:19px}
.builder .frame{color:var(--ink-2);margin-right:4px}
.builder .end{color:var(--ink-3)}
.builder.ok{border-color:var(--yes);border-style:solid} .builder.bad{border-color:var(--neg);border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tok{padding:7px 12px;border:1px solid var(--rule-2);border-radius:7px;background:var(--paper);font-family:var(--serif);font-size:19px}
.builder .tok{background:var(--acc-soft);border-color:transparent}
.tok:disabled{opacity:.35;cursor:default}
.builder .tok:disabled{opacity:1}

.actions{display:flex;gap:10px;align-items:center;margin-top:16px}
.actions .sp{flex:1}
.fb{margin-top:16px;padding:14px 16px;border-radius:8px;border-left:4px solid var(--acc);background:var(--paper)}
.fb.yes{border-left-color:var(--yes)} .fb.no{border-left-color:var(--neg)}
.fb .v{font-weight:600;margin-bottom:4px}
.fb.yes .v{color:var(--yes)} .fb.no .v{color:var(--neg)}
.fb .ans{font-family:var(--serif);font-size:19px;margin:4px 0 6px}
.fb .ans em{font-style:normal;color:var(--acc);font-weight:600}
.fb .why{font-size:14px;color:var(--ink-2)}
.fb .why i{font-family:var(--serif);font-style:normal;font-size:15px;color:var(--ink)}
.fb .note{font-size:13px;color:var(--ink-3);margin-top:6px}
.fb .pair{margin:6px 0 8px;font-family:var(--serif);font-size:18px;line-height:1.45}
.fb .pair .d{color:var(--ink-3)}
.fb .pair .s em{font-style:normal;color:var(--acc);font-weight:600;border-bottom:2px solid var(--acc)}
.sched{font-size:12px;color:var(--ink-3);margin-top:8px}

/* ---------- rules ---------- */
.ref{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0 6px}
.ref th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-2);padding:6px 8px 6px 0;border-bottom:1px solid var(--rule-2)}
.ref td{padding:7px 8px 7px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ref td[lang=de]{font-size:16px}
.ref .yes{color:var(--yes)} .ref .no{color:var(--neg)}
.ladder{margin:8px 0 0;border-top:1px solid var(--rule)}
.rung{display:block;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--rule)}
.rung .d{font-family:var(--serif);font-size:17px;color:var(--ink-2)}
.rung .s{font-family:var(--serif);font-size:17px;margin-top:2px}
.rung .s em{font-style:normal;color:var(--acc);font-weight:600}
.rung .s.veil{color:transparent;text-shadow:0 0 9px var(--ink-3);user-select:none}
.rung .s.veil em{color:transparent;font-weight:400;text-shadow:0 0 9px var(--ink-3)}
.rulebox{padding:12px 14px;background:var(--card);border:1px solid var(--rule);border-radius:8px;margin:8px 0}
.rulebox [lang=de]{font-size:17px}

/* ---------- progress ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 4px}
.stat{padding:12px 14px;background:var(--card);border:1px solid var(--rule);border-radius:8px}
.stat .v{font-family:var(--serif);font-size:26px;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink-3)}
.trow{display:grid;grid-template-columns:1fr 130px 52px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.trow .nm{line-height:1.25}
.trow .bar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--card-2)}
.trow .bar i{display:block;height:100%}
.trow .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin:6px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.leech{padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.leech .p{font-family:var(--serif);font-size:17px}
.leech .a{color:var(--ink-2);font-size:13px}
.leech .a em{font-style:normal;color:var(--acc)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--rule-2);border-radius:8px;background:var(--card);font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
.msg{font-size:13px;margin-top:8px}
.msg.bad{color:var(--neg)} .msg.good{color:var(--yes)}

/* ---------- summary ---------- */
.tally{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 0}
.tally i{width:11px;height:11px;border-radius:2px;background:var(--yes)}
.tally i.no{background:var(--neg)}
.misslist{margin:18px 0 0;border-top:1px solid var(--rule)}
.miss{padding:12px 0;border-bottom:1px solid var(--rule);font-size:14px}
.miss .p{font-family:var(--serif);font-size:17px}
.miss .a{color:var(--ink-2);font-size:13px;margin-top:3px}
.miss .a em{color:var(--acc);font-style:normal}
footer{max-width:720px;margin:0 auto;padding:0 20px 40px;font-size:12px;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media (max-width:420px){.navbtn{padding:3px 6px;font-size:12.5px}.wordmark{font-size:15.5px}.prompt{font-size:21px}.prompt .gapin{font-size:21px}}
</style>
</head>
<body>

<div class="rail">
  <div class="rail-in">
    <div class="rail-top">
      <span class="wordmark">Konjunktiv II: <b>wäre</b> · <b>hätte</b> · <b>würde</b></span>
      <span class="rail-spacer"></span>
      <button class="navbtn" id="nav-home">Start</button>
      <button class="navbtn" id="nav-ref">Rules</button>
      <button class="navbtn" id="nav-prog">Progress</button>
    </div>
    <div class="meter" id="meter" title="mastered / learning / untouched">
      <i class="m5" style="width:0"></i><i class="m3" style="width:0"></i><i class="m1" style="width:0"></i>
    </div>
    <div class="railstat" id="railstat"></div>
  </div>
</div>

<main>
  <section id="view-home"></section>
  <section id="view-drill" class="hidden"></section>
  <section id="view-ref" class="hidden"></section>
  <section id="view-prog" class="hidden"></section>
  <section id="view-sum" class="hidden"></section>
</main>

<footer id="foot"></footer>

 u) + ending -e. Exception: wollen takes no umlaut, so the form is unchanged.","instr":"Build the Konjunktiv II (ich-form) from the Präteritum."},{"id":"orig-mc-01","topic":"orig","kind":"mc","prompt":"How is the own Konjunktiv II form built?","options":["Präteritum (ich-form) + umlaut on a/o/u + ending","Präsens + umlaut","Infinitive + -te","Partizip II + würde"],"correct":"Präteritum (ich-form) + umlaut on a/o/u + ending","why":"war → wäre, hatte → hätte, kam → käme. The endings are -e, -est, -e, -en, -et, -en.","instr":null,"enOpts":true,"enPrompt":true},{"id":"orig-mc-02","topic":"orig","kind":"mc","prompt":"Why does <b>ginge<\/b> have no umlaut?","options":["i cannot take an umlaut — only a, o, u can","gehen is completely irregular","ginge is actually the Präteritum","The umlaut is optional"],"correct":"i cannot take an umlaut — only a, o, u can","why":"ging → ginge: the vowel stays, only the ending -e is added.","instr":null,"enOpts":true,"enPrompt":true},{"id":"orig-mc-03","topic":"orig","kind":"mc","prompt":"Why do <b>sollte<\/b> and <b>wollte<\/b> have no umlaut?","options":["sollen and wollen are exceptions: no umlaut although the vowel is o","Their vowel is not a, o or u","They are not modal verbs","They only form Konjunktiv II with würde"],"correct":"sollen and wollen are exceptions: no umlaut although the vowel is o","why":"That is why <i>sollte / wollte<\/i> look identical to the Präteritum — context decides.","instr":null,"enOpts":true,"enPrompt":true},{"id":"orig-mc-04","topic":"orig","kind":"mc","prompt":"Konjunktiv II of <b>wissen<\/b> (ich):","options":["wüsste","wusste","weiß","wisse"],"correct":"wüsste","why":"wusste + umlaut = <i>wüsste<\/i>. <i>wisse<\/i> is Konjunktiv I, <i>weiß<\/i> Präsens.","instr":null,"enPrompt":true},{"id":"orig-mc-05","topic":"orig","kind":"mc","prompt":"Konjunktiv II of <b>gehen<\/b> (er):","options":["ginge","ging","gehe","gegangen"],"correct":"ginge","why":"ging + -e = <i>ginge<\/i>. <i>ging<\/i> alone is Präteritum tiv II.","cue":"müsst-","direct":"Sie müssen das Formular ausfüllen."},{"id":"pat-21","topic":"patterns","kind":"typed","prompt":"Ich habe eine Frage.","answers":["Ich hätte eine Frage."],"why":"habe → <i>hätte<\/i>: the classic polite opener.","instr":"Make it softer with Konjunktiv II.","cue":"hätt-","direct":"Ich habe eine Frage."},{"id":"pat-22","topic":"patterns","kind":"typed","prompt":"Ich habe noch einen Wunsch.","answers":["Ich hätte noch einen Wunsch."],"why":"habe → <i>hätte<\/i>.","instr":"Make it softer with Konjunktiv II.","cue":"hätt-","direct":"Ich habe noch einen Wunsch."},{"id":"pat-23","topic":"patterns","kind":"typed","prompt":"Ich nehme das Schnitzel.","answers":["Ich hätte gern das Schnitzel."],"why":"Ordering food politely: <i>Ich hätte gern …<\/i>","instr":"Make it softer with Konjunktiv II.","alt":["Ich würde das Schnitzel nehmen.","Ich möchte das Schnitzel."],"altWhy":"Also polite — the pattern drilled here is <i>hätte gern<\/i>.","cue":"hätte gern","direct":"Ich nehme das Schnitzel."},{"id":"pat-24","topic":"patterns","kind":"typed","prompt":"Das geht.","answers":["Das ginge."],"why":"geht → <i>ginge<\/i>: 'that would work' — tentative agreement.","instr":"Make it softer with Konjunktiv II.","cue":"ging-","direct":"Das geht."},{"id":"pat-25","topic":"patterns","kind":"typed","prompt":"Kommst du mit?","answers":["Würdest du mitkommen?"],"why":"Present question → <i>Würdest du mitkommen?<\/i> The separable verb becomes one infinitive at the end.","instr":"Make it softer with Konjunktiv II.","alt":["Kämst du mit?","Kämest du mit?"],"altWhy":"<i>Kämst du mit?<\/i> uses the own form — correct, but the pattern drilled here is <i>würdest<\/i>.","cue":"würd-","direct":"Kommst du mit?"},{"id":"pat-26","topic":"patterns","kind":"typed","prompt":"Machst du das Licht aus?","answers":["Würdest du das Licht ausmachen?"],"why":"<i>Würdest du … ausmachen?<\/i> — prefix and verb rejoin as an infinitive at the end.","instr":"Make it softer with Konjunktiv II.","alt":["Könntest du das Licht ausmachen?"],"altWhy":"<i>Könntest du …?<\/i> is fine too — the pattern drilled here is <i>würdest<\/i>.","cue":"würd-","direct":"Machst du das Licht aus?"},{"id":"pat-27","topic":"patterns","kind":"typed","prompt":"Rufen Sie mich morgen an.","answers":["Könnten Sie mich morgen anrufen?"],"why":"Imperative → <i>Könnten Sie … anrufen?<\/i>","instr":"Make it softer with Konjunktiv II.","alt":["Würden Sie mich morgen anrufen?"],"altWhy":"<i>Würden Sie …?<\/i> also works — the pattern drilled here is <i>könnten<\/i>.","cue":"könnt-","direct":"Rufen Sie mich morgen an."},{"id":"pat-28","topic":"patterns","kind":"typed","prompt":"Ist es okay, wenn ich später komme?","answers":["Wäre es okay, wenn ich später käme?"],"why":"Both verbs shift: ist → <i>wäre<\/i>, komme → <i>käme<\/i>.","instr":"Make it softer with Konjunktiv II.","alt":["Wäre es okay, wenn ich später kommen würde?"],"altWhy":"<i>kommen würde<\/i> is also correct — here the own form <i>käme<\/i> was the target.","cue":"wäre … käme","direct":"Ist es okay, wenn ich später komme?"},{"id":"pat-29","topic":"patterns","kind":"typed","prompt":"Es ist besser, wenn du gehst.","answers":["Es wäre besser, wenn du gehen würdest."],"why":"ist → <i>wäre<\/i>; gehst → <i>gehen würdest<\/i> (infinitive, then würdest at the end).","instr":"Make it softer with Konjunktiv II.","alt":["Es wäre besser, wenn du gingest."],"altWhy":"<i>gingest<\/i> is the own form — correct, but here <i>gehen würdest<\/i> was the target.","cue":"wäre … würd-","direct":"Es ist besser, wenn du gehst."},{"id":"pat-30","topic":"patterns","kind":"typed","prompt":"Kann ich Sie etwas fragen?","answers":["Könnte ich Sie etwas fragen?"],"why":"kann → <i>könnte<\/i>.","instr":"Make it softer with Konjunktiv II.","cue":"könnt-","direct":"Kann ich Sie etwas fragen?"},{"id":"pat-31","topic":"patterns","kind":"typed","prompt":"Haben Sie noch ein Zimmer frei?","answers":["Hätten Sie noch ein Zimmer frei?"],"why":"haben → <i>hätten<\/i>: hotel-reception politeness.","instr":"Make it softer with Konjunktiv II.","cue":"hätt-","direct":"Haben Sie noch ein Zimmer frei?"},{"id":"pat-32","topic":"patterns","kind":"typed","prompt":"Passt Ihnen Montag?","answers":["Würde Ihnen Montag passen?"],"why":"passt → <i>würde … passen<\/i>: the verb becomes an infinitive at the end.","instr":"Make it softer with Konjunktiv II.","cue":"würd-","direct":"Passt Ihnen Montag?"},{"id":"pat-33","topic":"patterns","kind":"typed","prompt":"Öffne bitte das Fenster.","answers":["Würdest du bitte das Fenster öffnen?"],"why":"Imperative → <i>Würdest du … öffnen?<\/i>","instr":"Make it softer with Konjunktiv II.","alt":["Könntest du bitte das Fenster öffnen?"],"altWhy":"<i>Könntest du …?<\/i> is fine as well — the pattern drilled here is <i>würdest<\/i>.","cue":"würd-","direct":"Öffne bitte das Fenster."},{"id":"pat-34","topic":"patterns","kind":"typed","prompt":"Ich empfehle dir das Buch.","answers":["Ich würde dir das Buch empfehlen."],"why":"empfehle → <i>würde … empfehlen<\/i>: a recommendation phrased more gently.","instr":"Make it softer with Konjunktiv II.","cue":"würd-","direct":"Ich empfehle dir das Buch."},{"id":"pat-35","topic":"patterns","kind":"typed","prompt":"Ich mache das nicht.","answers":["Ich würde das nicht machen."],"why":"<i>Ich würde das nicht machen.<\/i> — the flat refusal becomes a softer 'I wouldn't do that', which is also how German gives advice.","instr":"Make it softer with Konjunktiv II.","cue":"würd-","direct":"Ich mache das nicht."},{"id":"pat-36","topic":"patterns","kind":"typed","prompt":"Wie ist es mit Freitag?","answers":["Wie wäre es mit Freitag?"],"why":"ist → <i>wäre<\/i>: <i>Wie wäre es mit …?<\/i> is the standard suggestion formula.","instr":"Make it softer with Konjunktiv II.","cue":"wär-","direct":"Wie ist es mit Freitag?"},{"id":"pat-37","topic":"patterns","kind":"typed","prompt":"Können Sie bitte langsamer sprechen?","answers":["Könnten Sie bitte langsamer sprechen?"],"why":"können → <i>könnten<\/i>.","instr":"Make it softer with Konjunktiv II.","cue":"könnt-","direct":"Können Sie bitte langsamer sprechen?"},{"id":"pat-38","topic":"patterns","kind":"typed","prompt":"Können Sie mir sagen, wo der Bahnhof ist?","answers":["Könnten Sie mir sagen, wo der Bahnhof ist?"],"why":"Only the modal changes: können → <i>könnten<\/i>. The indirect question stays as it is.","instr":"Make it softer with Konjunktiv II.","cue":"könnt-","direct":"Können Sie mir sagen, wo der Bahnhof ist?"},{"id":"pat-39","topic":"patterns","kind":"typed","prompt":"Zeig mir den Weg.","answers":["Könntest du mir den Weg zeigen?"],"why":"Imperative → <i>Könntest du … zeigen?<\/i>","instr":"Make it softer with Konjunktiv II.","alt":["Würdest du mir den Weg zeigen?"],"altWhy":"<i>Würdest du …?<\/i> works as well — the pattern drilled here is <i>könntest<\/i>.","cue":"könnt-","direct":"Zeig mir den Weg."},{"id":"pat-40","topic":"patterns","kind":"typed","prompt":"Hast du Zeit für mich?","answers":["Hättest du Zeit für mich?"],"why":"hast → <i>hättest<\/i>.","instr":"Make it softer with Konjunktiv II.","cue":"hätt-","direct":"Hast du Zeit für mich?"},{"id":"pat-41","topic":"patterns","kind":"typed","prompt":"Treffen wir uns morgen?","answers":["Könnten wir uns morgen treffen?"],"why":"Direct proposal → <i>Könnten wir uns … treffen?<\/i> — modal in position 1, infinitive at the end.","instr":"Make it softer with Konjunktiv II.","cue":"könnt-","direct":"Treffen wir uns morgen?"},{"id":"pat-42","topic":"patterns","kind":"typed","prompt":"Ich brauche ein Zimmer für zwei Nächte.","answers":["Ich hätte gern ein Zimmer für zwei Nächte."],"why":"<i>Ich brauche<\/i> → <i>Ich hätte gern<\/i>: the polite way to ask at a reception.","instr":"Make it softer with Konjunktiv II.","alt":["Ich bräuchte ein Zimmer für zwei Nächte.","Ich möchte ein Zimmer für zwei Nächte."],"altWhy":"Also fine — <i>bräuchte<\/i> is common in speech but not in the notes' closed set; <i>hätte gern<\/i> is the safe exam form.","cue":"hätte gern","direct":"Ich brauche ein Zimmer für zwei Nächte."},{"id":"pat-mc-01","topic":"patterns","kind":"mc","prompt":"Kannst du mir helfen?","options":["Könntest du mir helfen?","Konntest du mir helfen?","Kannst du mir bitte helfen?","Könnest du mir helfen?"],"correct":"Könntest du mir helfen?","why":"<i>konntest<\/i> (no umlaut) is Präteritum — 'were you able to'. Only <i>könntest<\/i> is Konjunktiv II.","instr":"Which version is the softened (Konjunktiv II) one?"},{"id":"pat-mc-02","topic":"patterns","kind":"mc","prompt":"Haben Sie Zeit?","options":["Hätten Sie Zeit?","Hatten Sie Zeit?","Haben Sie Zeit, bitte?","Hättet Sie Zeit?"],"correct":"Hätten Sie Zeit?","why":"<i>Hatten Sie Zeit?<\/i> asks about the past. <i>Hättet<\/i> is the ihr-form, not Sie.","instr":"Which version is the softened (Konjunktiv II) one?"},{"id":"pat-mc-03","topic":"patterns","kind":"mc","prompt":"Ist das möglich?","options":["Wäre das möglich?","War das möglich?","Würde das möglich?","Wären das möglich?"],"correct":"Wäre das möglich?","why":"<i>würde<\/i> alone cannot replace <i>ist<\/i>; sein has its own form <i>wäre<\/i>. <i>Wären<\/i> is plural.","instr":"Which version is the softened (Konjunktiv II) one?"},{"id":"pat-mc-04","topic":"patterns","kind":"mc","prompt":"Gib mir das Salz.","options":["Würdest du mir das Salz geben?","Würdest du mir das Salz gibst?","Wurdest du mir das Salz geben?","Gibst du mir das Salz?"],"correct":"Würdest du mir das Salz geben?","why":"After <i>würdest<\/i> the verb is an infinitive (<i>geben<\/i>), and <i>wurdest<\/i> has no umlaut.","instr":"Which version is the softened (Konjunktiv II) one?"},{"id":"pat-mc-05","topic":"patterns","kind":"mc","prompt":"Schlaf mehr.","options":["Du solltest mehr schlafen.","Du söllst mehr schlafen.","Du sollst mehr schlafen.","Du solltest mehr schläfst."],"correct":"Du solltest mehr schlafen.","why":"<i>sollst<\/i> is Präsens (an instruction); <i>solltest<\/i> is advice. After a modal the verb is an infinitive.","instr":"Which version is the softened (Konjunktiv II) one?"},{"id":"pat-mc-06","topic":"patterns","kind":"mc","prompt":"Ich will einen Kaffee.","options":["Ich hätte gern einen Kaffee.","Ich hatte gern einen Kaffee.","Ich will gern einen Kaffee.","Ich würde gern einen Kaffee."],"correct":"Ich hätte gern einen Kaffee.","why":"<i>hatte<\/i> is Präteritum; <i>würde gern einen Kaffee<\/i> has no infinitive and is incomplete.","instr":"Which version is the softened (Konjunktiv II) one?"},{"id":"pat-mc-07","topic":"patterns","kind":"mc","prompt":"Darf ich das Fenster öffnen?","options":["Dürfte ich das Fenster öffnen?","Durfte ich das Fenster öffnen?","Dürftest ich das Fenster öffnen?","Darf ich bitte das Fenster öffnen?"],"correct":"Dürfte ich das Fenster öffnen?","why":"<i>durfte<\/i> is Präteritum; <i>dürftest<\/i> is the du-ending on an ich-subject.","instr":"Which version is the softened (Konjunktiv II) one?"},{"id":"pat-mc-08","topic":"patterns","kind":"mc","prompt":"Wie ist es mit Freitag?","options":["Wie wäre es mit Freitag?","Wie war es mit Freitag?","Wie würde es mit Freitag?","Wie wären es mit Freitag?"],"correct":"Wie wäre es mit Freitag?","why":"<i>es<\/i> is singular → <i>wäre<\/i>. <i>würde<\/i> needs an infinitive, which is missing here.","instr":"Which version is the softened (Konjunktiv II) one?"},{"id":"pat-mc-09","topic":"patterns","kind":"mc","prompt":"Können Sie das wiederholen?","options":["Könnten Sie das wiederholen?","Konnten Sie das wiederholen?","Könnten Sie das wiederholten?","Könnte Sie das wiederholen?"],"correct":"Könnten Sie das wiederholen?","why":"Sie → -en: <i>Könnten<\/i>. The main verb stays an infinitive.","instr":"Which version is the softened (Konjunktiv II) one?"},{"id":"pat-mc-10","topic":"patterns","kind":"mc","prompt":"Ich habe eine Frage.","options":["Ich hätte eine Frage.","Ich hatte eine Frage.","Ich habe gern eine Frage.","Ich würde eine Frage haben."],"correct":"Ich hätte eine Frage.","why":"haben has its own form — <i>würde … haben<\/i> is avoided.","instr":"Which version is the softened (Konjunktiv II) one?"},{"id":"cond-g-01","topic":"condition","kind":"gaps","prompt":"Wenn ich Zeit ___, ___ ich kommen. (haben, werden)","answers":[["hätte"],["würde"]],"why":"Unreal condition: the wenn-clause ends with its verb; the main clause starts with the verb because the wenn-clause took position 1.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-02","topic":"condition","kind":"gaps","prompt":"Wenn ich mehr Geld ___, ___ ich ein Haus kaufen. (haben, werden)","answers":[["hätte"],["würde"]],"why":"Unreal condition: the wenn-clause ends with its verb; the main clause starts with the verb because the wenn-clause took position 1.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-03","topic":"condition","kind":"gaps","prompt":"Wenn das Wetter besser ___, ___ wir wandern gehen. (sein, können)","answers":[["wäre"],["könnten"]],"why":"Unreal condition: the wenn-clause ends with its verb; the main clause starts with the verb because the wenn-clause took position 1.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-04","topic":"condition","kind":"gaps","prompt":"Wenn du früher aufstehen ___, ___ du pünktlich. (werden, sein)","answers":[["würdest"],["wärst","wärest"]],"why":"wenn-clause with würde: infinitive <i>aufstehen<\/i>, then <i>würdest<\/i> last. Main clause: <i>wärst du pünktlich<\/i>.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-05","topic":"condition","kind":"gaps","prompt":"Wenn er das ___, ___ er es uns sagen. (wissen, werden)","answers":[["wüsste"],["würde"]],"why":"Unreal condition: the wenn-clause ends with its verb; the main clause starts with the verb because the wenn-clause took position 1.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-06","topic":"condition","kind":"gaps","prompt":"Wenn wir ein Auto ___, ___ wir ans Meer fahren. (haben, werden)","answers":[["hätten"],["würden"]],"why":"Unreal condition: the wenn-clause ends with its verb; the main clause starts with the verb because the wenn-clause took position 1.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-07","topic":"condition","kind":"gaps","prompt":"Wenn ihr Lust ___, ___ ihr mitkommen. (haben, können)","answers":[["hättet"],["könntet"]],"why":"Unreal condition: the wenn-clause ends with its verb; the main clause starts with the verb because the wenn-clause took position 1.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-08","topic":"condition","kind":"gaps","prompt":"Wenn ich du ___, ___ ich das nicht machen. (sein, werden)","answers":[["wäre"],["würde"]],"why":"<i>Wenn ich du wäre, würde ich …<\/i> — the standard advice formula.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-09","topic":"condition","kind":"gaps","prompt":"Wenn Sie Fragen ___, ___ Sie mich anrufen. (haben, können)","answers":[["hätten"],["könnten"]],"why":"Unreal condition: the wenn-clause ends with its verb; the main clause starts with the verb because the wenn-clause took position 1.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-10","topic":"condition","kind":"gaps","prompt":"Ich ___ dich besuchen, wenn ich in Berlin ___. (werden, sein)","answers":[["würde"],["wäre"]],"why":"Unreal condition, main clause first: verb in position 2, then the wenn-clause with its verb at the end.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-11","topic":"condition","kind":"gaps","prompt":"Wir ___ nach Italien fahren, wenn wir Urlaub ___. (werden, haben)","answers":[["würden"],["hätten"]],"why":"Unreal condition, main clause first: verb in position 2, then the wenn-clause with its verb at the end.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-12","topic":"condition","kind":"gaps","prompt":"Es ___ schön, wenn du ___. (sein, kommen)","answers":[["wäre"],["kämst","kämest"]],"why":"<i>Es wäre schön, wenn du kämst.<\/i> — own forms for both sein and kommen.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-13","topic":"condition","kind":"gaps","prompt":"Wenn ich nicht so müde ___, ___ ich mit ins Kino gehen. (sein, werden)","answers":[["wäre"],["würde"]],"why":"Unreal condition: the wenn-clause ends with its verb; the main clause starts with the verb because the wenn-clause took position 1.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-14","topic":"condition","kind":"gaps","prompt":"Wenn du mehr ___ ___, ___ dein Deutsch besser. (üben + werden, sein)","answers":[["üben"],["würdest"],["wäre"]],"why":"üben has no own form → <i>üben würdest<\/i> at the end of the wenn-clause. Then <i>wäre<\/i> opens the main clause.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-15","topic":"condition","kind":"gaps","prompt":"Ich ___ das Angebot annehmen, wenn ich du ___. (werden, sein)","answers":[["würde"],["wäre"]],"why":"Unreal condition, main clause first: verb in position 2, then the wenn-clause with its verb at the end.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-16","topic":"condition","kind":"gaps","prompt":"Wenn es nicht so teuer ___, ___ ich es kaufen. (sein, werden)","answers":[["wäre"],["würde"]],"why":"Unreal condition: the wenn-clause ends with its verb; the main clause starts with the verb because the wenn-clause took position 1.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-17","topic":"condition","kind":"gaps","prompt":"___ es möglich, wenn wir später ___? (sein, kommen)","answers":[["Wäre"],["kämen"]],"why":"Question first: <i>Wäre es möglich, wenn wir später kämen?<\/i>","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-18","topic":"condition","kind":"gaps","prompt":"Wenn ich ein Ticket ___, ___ ich zum Konzert gehen. (haben, können)","answers":[["hätte"],["könnte"]],"why":"Unreal condition: the wenn-clause ends with its verb; the main clause starts with the verb because the wenn-clause took position 1.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-19","topic":"condition","kind":"gaps","prompt":"Wenn er nicht so viel arbeiten ___, ___ er mehr Zeit für uns. (müssen, haben)","answers":[["müsste"],["hätte"]],"why":"Unreal condition: the wenn-clause ends with its verb; the main clause starts with the verb because the wenn-clause took position 1.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-20","topic":"condition","kind":"gaps","prompt":"Wenn ich perfekt Deutsch ___, ___ ich mir keine Sorgen um die Prüfung machen. (können, werden)","answers":[["könnte"],["würde"]],"why":"Unreal condition: the wenn-clause ends with its verb; the main clause starts with the verb because the wenn-clause took position 1.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-21","topic":"condition","kind":"gaps","prompt":"Wenn du mich ___ ___, ___ ich sofort kommen. (anrufen + werden, werden)","answers":[["anrufen"],["würdest"],["würde"]],"why":"Separable verb as infinitive (<i>anrufen<\/i>), then <i>würdest<\/i> at the end; <i>würde<\/i> opens the main clause.","instr":"Fill the gaps with Konjunktiv II forms of the verbs in brackets (in order)."},{"id":"cond-g-22","topic":"condition","kind":"gaps","prompt" /* ============================ storage ============================ */
const KEY = "konjunktiv2.v1";
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
let PERSISTS = true;
try{ localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe"); }
catch(e){ PERSISTS = false; }

/* ============================ model ============================== */
const DAY = 86400000;
// Leitner boxes. 0 = new or just lapsed, 5 = mastered. A box is only left when
// the item is due, so five correct answers must be spread over ≥ 11 days.
const IVL = [0, 10*60000, 1*DAY, 3*DAY, 7*DAY, 21*DAY];
const MASTER_BOX = 5;
let NOW = () => Date.now();

const TOPICS = {
  "shw":       {name:"sein · haben · werden", blurb:"wäre, hätte, würde in every person"},
  "modal":     {name:"Modal verbs",           blurb:"könnte, müsste, dürfte, möchte, sollte, wollte"},
  "orig":      {name:"Own forms & the rule",  blurb:"Präteritum + umlaut + ending: wüsste, käme, ginge"},
  "wuerde":    {name:"würde + infinitive",    blurb:"The default: würde in position 2, infinitive last"},
  "function":  {name:"What is it doing?",     blurb:"Politeness, wish, condition, advice, caution, comparison"},
  "patterns":  {name:"Softening patterns",    blurb:"Kannst du … → Könntest du …"},
  "condition": {name:"Unreal conditions",     blurb:"Wenn ich … hätte, würde ich …"},
  "order":     {name:"Word order",            blurb:"Position 2, verb at the end, wenn-clause first"},
  "ambig":     {name:"Indicative or KII?",    blurb:"sollte, wollte, gingen — context decides"},
  "choice":    {name:"würde or own form?",    blurb:"Which verbs skip würde"},
  "produce":   {name:"Produce it",            blurb:"English → German"}
};
const TOPIC_ORDER = Object.keys(TOPICS);
const BY_TOPIC = {};
TOPIC_ORDER.forEach(t => BY_TOPIC[t] = BANK.filter(q => q.topic === t));

let S = load();
function blank(){
  return {v:1, items:{}, stats:{answered:0, correct:0, sessions:0, days:{}, lastDay:null, streak:0}};
}
function load(){
  try{
    const raw = store.get(KEY);
    if(!raw) return blank();
    const p = JSON.parse(raw);
    if(!p || p.v !== 1) return blank();
    p.items = p.items || {}; p.stats = Object.assign(blank().stats, p.stats || {});
    p.stats.days = p.stats.days || {};
    return p;
  }catch(e){ return blank(); }
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ store.set(KEY, JSON.stringify(S)); }, 120);
}
function saveNow(){ clearTimeout(saveTimer); store.set(KEY, JSON.stringify(S)); }
function rec(id){
  if(!S.items[id]) S.items[id] = {b:0, due:0, s:0, c:0, w:0, lap:0, seen:0};
  return S.items[id];
}
const boxOf = id => (S.items[id] ? S.items[id].b : 0);
const seen = id => !!(S.items[id] && S.items[id].seen > 0);
const isMastered = id => boxOf(id) >= MASTER_BOX;
const isDue = id => { const r = S.items[id]; return !r || r.seen === 0 || r.due <= NOW(); };
const dueAt = id => (S.items[id] ? S.items[id].due : 0);

function dayKey(t){ const d = new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function touchDay(){
  const today = dayKey(NOW());
  const st = S.stats;
  if(st.lastDay !== today){
    const y = dayKey(NOW() - DAY);
    st.streak = (st.lastDay === y) ? (st.streak||0) + 1 : 1;
    st.lastDay = today;
  }
  st.days[today] = (st.days[today]||0) + 1;
}

// Grade an answer. `promotable` = the item was due when asked.
function grade(id, ok, promotable){
  const r = rec(id); const now = NOW();
  r.seen++; r.s = now;
  S.stats.answered++;
  if(ok){
    r.c++; S.stats.correct++;
    if(promotable){ r.b = Math.min(MASTER_BOX, r.b + 1); r.due = now + IVL[r.b]; }
  }else{
    r.w++; if(r.b > 0) r.lap++;
    r.b = 0; r.due = now;
  }
  touchDay();
  save();
  return r;
}

/* ============================ answer checking ==================== */
function norm(s){
  s = String(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
  s = s.replace(/[.,!?;:„“”"'’…]/g," ");
  return s.split(/\s+/).filter(t => t && t !== "bitte").map(t => t === "gerne" ? "gern" : t).join(" ");
}
// returns {ok, alt} for typed answers
function checkTyped(q, input){
  const n = norm(input);
  if(!n) return {ok:false, empty:true};
  if(q.answers.some(a => norm(a) === n)) return {ok:true};
  if((q.alt||[]).some(a => norm(a) === n)) return {ok:true, alt:true};
  if(q.direct && norm(q.direct) === n) return {ok:false, unchanged:true};
  return {ok:false};
}
function checkGaps(q, inputs){
  const per = q.answers.map((group, i) => group.some(a => norm(a) === norm(inputs[i]||"")));
  return {ok: per.every(Boolean), per};
}
function checkOrder(q, placed){
  const s = placed.join(" ");
  if(s === q.tokens.join(" ")) return {ok:true};
  if((q.alt||[]).some(a => a.join(" ") === s)) return {ok:true, alt:true};
  return {ok:false};
}
function checkMC(q, choice){ return {ok: choice === q.correct}; }

/* ============================ session ============================ */
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function interleave(list){
  // round-robin across topics, shuffled within each topic
  const groups = {}; list.forEach(q => (groups[q.topic] = groups[q.topic]||[]).push(q));
  const keys = shuffle(Object.keys(groups)); keys.forEach(k => groups[k] = shuffle(groups[k]));
  const out = []; let any = true;
  while(any){ any = false; for(const k of keys){ if(groups[k].length){ out.push(groups[k].shift()); any = true; } } }
  return out;
}
function buildQueue(mode, topics, n){
  const pool = BANK.filter(q => topics.includes(q.topic));
  let q = [];
  if(mode === "srs"){
    const due = pool.filter(x => seen(x.id) && isDue(x.id)).sort((a,b) => boxOf(a.id)-boxOf(b.id) || dueAt(a.id)-dueAt(b.id));
    const fresh = interleave(pool.filter(x => !seen(x.id)));
    // Review rounds contain only what is scheduled: due items first, then new
    // ones. Nothing is pulled in early — an early miss would reset an item
    // that a correct answer could not have advanced.
    q = due.slice(0, n);
    if(q.length < n) q = q.concat(fresh.slice(0, n - q.length));
    q = shuffle(q);
  }else if(mode === "exam"){
    q = interleave(pool).slice(0, n);
    q = shuffle(q);
  }else if(mode === "leech"){
    const weak = pool.filter(x => { const r = S.items[x.id]; return r && (r.w >= 2 || r.lap >= 1); })
      .sort((a,b) => { const ra=S.items[a.id], rb=S.items[b.id]; return (rb.w-rb.c)-(ra.w-ra.c) || ra.b-rb.b; });
    q = weak.slice(0, n);
    if(q.length < n){
      const rest = pool.filter(x => !q.includes(x) && seen(x.id) && boxOf(x.id) === 0);
      q = q.concat(shuffle(rest).slice(0, n - q.length));
    }
    q = shuffle(q);
  }
  return q.map(x => ({q:x, promotable:isDue(x.id), retry:0}));
}

let SESSION = null;
function startSession(mode, topics, n){
  const queue = buildQueue(mode, topics, n);
  if(!queue.length) return null;
  SESSION = {mode, topics, queue, i:0, results:[], misses:[], answered:0, correct:0, started:NOW()};
  S.stats.sessions++; save();
  return SESSION;
}
function currentEntry(){ return SESSION && SESSION.i < SESSION.queue.length ? SESSION.queue[SESSION.i] : null; }
// Record an answer for the current entry; wrong answers are requeued 4–6 positions later (max twice).
function recordAnswer(ok, extra){
  const e = currentEntry(); if(!e) return null;
  const r = grade(e.q.id, ok, e.promotable);
  SESSION.answered++; if(ok) SESSION.correct++;
  SESSION.results.push(ok);
  if(!ok){
    if(!SESSION.misses.some(m => m.id === e.q.id)) SESSION.misses.push({id:e.q.id, given:extra||""});
    if(e.retry < 2){
      const pos = Math.min(SESSION.queue.length, SESSION.i + 4 + Math.floor(Math.random()*3));
      SESSION.queue.splice(pos, 0, {q:e.q, promotable:true, retry:e.retry+1});
    }
  }
  return r;
}
function advance(){ SESSION.i++; return currentEntry(); }

/* ============================ helpers ============================ */
const $ = sel => document.querySelector(sel);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === "class") el.className = attrs[k];
    else if(k === "html") el.innerHTML = attrs[k];
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] !== null && attrs[k] !== undefined) el.setAttribute(k, attrs[k]);
  }
  for(const kid of kids){ if(kid === null || kid === undefined || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return el;
}
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KII_RE = /^(wär(e|st|est|en|t|et)|hätt(e|est|en|et)|würd(e|est|en|et)|könnt(e|est|en|et)|müsst(e|est|en|et)|dürft(e|est|en|et)|möcht(e|est|en|et)|sollt(e|est|en|et)|wollt(e|est|en|et)|wüsst(e|est|en|et)|käm(e|st|est|en|t|et)|ging(e|est|en|et))$/i;
function markKII(sentence){
  // wrap Konjunktiv II finite forms in <em>
  return esc(sentence).split(/(\s+)/).map(w => {
    const core = w.replace(/[.,!?;:]+$/,""); const tail = w.slice(core.length);
    return KII_RE.test(core) ? "<em>"+core+"</em>"+tail : w;
  }).join("");
}
function diffMark(direct, soft){
  // highlight tokens of `soft` that do not occur in `direct`
  const d = new Set(norm(direct).split(" "));
  return esc(soft).split(/(\s+)/).map(w => {
    const core = w.replace(/[.,!?;:]+$/,""); const tail = w.slice(core.length);
    if(!core) return w;
    return d.has(norm(core)) ? w : "<em>"+core+"</em>"+tail;
  }).join("");
}
function fmtDue(t){
  const d = t - NOW();
  if(d <= 0) return "now";
  if(d < 3600000) return Math.max(1, Math.round(d/60000)) + " min";
  if(d < DAY) return Math.round(d/3600000) + " h";
  return Math.round(d/DAY) + " d";
}
function counts(topics){
  const pool = topics ? BANK.filter(q => topics.includes(q.topic)) : BANK;
  let m=0, l=0, u=0, due=0;
  pool.forEach(q => { const b = boxOf(q.id); if(!seen(q.id)) u++; else if(b >= MASTER_BOX) m++; else l++; if(seen(q.id) && isDue(q.id)) due++; });
  return {m, l, u, due, total:pool.length};
}

function beginDrill(){
  const mode = homeSel.mode === "topic" ? "srs" : homeSel.mode;

}

/* ---------- drill ---------- */
let UI = {};   // per-question state
function renderQuestion(){
  const v = $("#view-drill"); v.innerHTML = "";

  const q = e.q;
  UI = {q, placed:[], gapEls:[], answered:false, pick:null};
  const head = h("div", {class:"dhead"},
    h("span", {class:"n"}, (SESSION.i+1) + " / " + SESSION.queue.length),
    h("span", {class:"t"}, TOPICS[q.topic].name + (e.retry ? " · retry" : "") + (!e.promotable && !e.retry ? " · not due yet" : "")),
    h("button", {class:"linkbtn", onclick:()=>{ if(confirm("End this round now? Answers so far are saved.")) finishSession(); }}, "End round"));
  v.append(head);
  const card = h("div", {class:"card"});
  if(q.instr) card.append(h("div", {class:"instr"}, q.instr));

  if(q.kind === "mc") renderMC(card, q);
  else if(q.kind === "typed") renderTyped(card, q);
  else if(q.kind === "gaps") renderGaps(card, q);

  v.append(card);

}
function promptEl(q, extraClass){
  const isEn = !!q.enPrompt;
  const el = h("div", {class:"prompt"+(isEn?" en":"")+(extraClass?" "+extraClass:"")});
  if(!isEn) el.setAttribute("lang","de");

}
function cueEl(q){ return q.cue ? h("div", {class:"cue"}, "Use: ", h("b", null, q.cue)) : null; }
function keysBar(getInput){

  ["ä","ö","ü","ß"].forEach(ch => bar.append(h("button", {class:"key", type:"button", onmousedown:ev=>ev.preventDefault(), onclick:()=>{
    const inp = getInput(); if(!inp || inp.disabled) return;
    const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s;

function actions(card, onCheck){

function afterAnswer(card, res, given){

  const ansText = answerText(q);
  if(q.direct){
    fb.append(h("div", {class:"pair"}, h("div", {class:"d", lang:"de"}, q.direct), h("div", {class:"s", lang:"de", html: diffMark(q.direct, q.answers[0])})));
  }else if(q.kind === "mc" && q.enOpts){

  }

  fb.append(h("div", {class:"why", html:q.why}));
  const e = SESSION.queue[SESSION.i];
  let sched;
  if(res.ok && e.promotable) sched = r.b >= MASTER_BOX ? "Box 5 — mastered. Next check in " + fmtDue(r.due) + "." : "Up to box " + r.b + ". Due again in " + fmtDue(r.due) + ".";
  else if(res.ok) sched = "Correct, but this item wasn't due yet, so it stays in box " + r.b + ".";

function promptText(q){
  if(q.kind !== "order") return q.prompt.replace(/\s*\([^)]*\)\s*$/,"");
  const toks = q.tokens.slice().sort((a,b)=>a.localeCompare(b,"de"));
  return (q.frame ? esc(q.frame) + " " : "") + "[ " + toks.map(esc).join(" · ") + " ]";
}
function answerText(q){
  return q.kind === "mc" ? q.correct : q.kind === "typed" ? q.answers[0] : q.kind === "gaps" ? fillGaps(q) : (q.frame ? q.frame + " " : "") + q.tokens.join(" ") + (q.end||"");
}
function fillGaps(q){
  let s = q.prompt.replace(/\s*\([^)]*\)\s*$/, "");
  q.answers.forEach(g => { s = s.replace("___", g[0]); });
  return s.replace(/<[^>]+>/g,"");
}

function renderMC(card, q){
  card.append(promptEl(q));
  const fixed = q.topic === "function" || q.topic === "ambig" || q.topic === "choice";
  const opts = fixed ? q.options.slice() : shuffle(q.options);
  const isDe = !q.enOpts;
  const list = h("div", {class:"choices"});
  UI.choiceBtns = [];
  opts.forEach((o, i) => {
    const b = h("button", {class:"choice", onclick:ev=>{ if(UI.answered) return; UI.pick = o; UI.choiceBtns.forEach(x => x.classList.toggle("pick", x.dataset.opt === o)); ev.currentTarget.blur(); }},
      h("span", {class:"k"}, String(i+1)), h("span", {html: esc(o)}));
    b.dataset.opt = o; if(isDe) b.setAttribute("lang","de");
    list.append(b); UI.choiceBtns.push(b);
  });
  card.append(list);
  actions(card, () => {
    if(UI.answered || UI.pick === null) return;
    const res = checkMC(q, UI.pick);
    UI.choiceBtns.forEach(b => { b.disabled = true; if(b.dataset.opt === q.correct) b.classList.add("yes"); else if(b.dataset.opt === UI.pick) b.classList.add("no"); });
    afterAnswer(card, res, UI.pick);
  });
}
function renderTyped(card, q){
  if(q.prompt.includes("___")){
    // inline single blank
    const el = promptEl(q); const inp = h("input", {class:"gapin", type:"text", autocapitalize:"off", autocomplete:"off", autocorrect:"off", spellcheck:"false"});
    el.innerHTML = q.prompt.replace("___", "\uE000");
    // replace marker with input
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let node;
    while((node = walker.nextNode())){ const i = node.data.indexOf("\uE000"); if(i >= 0){ const after = node.splitText(i); after.data = after.data.slice(1); node.parentNode.insertBefore(inp, after); break; } }
    card.append(el); UI.inp = inp;
  }else{
    card.append(promptEl(q));
    if(q.direct) card.append(h("div", {class:"direct"}, "Rewrite the sentence — keep the meaning, soften the tone."));
    const cue = cueEl(q); if(cue) card.append(cue);
    UI.inp = h("input", {class:"typedin", type:"text", lang:"de", autocapitalize:"sentences", autocomplete:"off", autocorrect:"off", spellcheck:"false", placeholder:"…"});
    card.append(UI.inp);
  }
  card.append(keysBar(() => UI.inp));
  const check = () => {
    if(UI.answered) return;
    const res = checkTyped(q, UI.inp.value);
    if(res.empty) return;
    UI.inp.disabled = true; UI.inp.classList.add(res.ok ? "ok" : "bad");
    afterAnswer(card, res, UI.inp.value);
  };
  UI.inp.addEventListener("keydown", ev => { if(ev.key === "Enter"){ ev.preventDefault(); check(); } });
  actions(card, check);
}
function renderGaps(card, q){
  const el = promptEl(q);
  let html = q.prompt; const parts = html.split("___");
  el.innerHTML = "";
  parts.forEach((part, i) => {
    const span = h("span", {html: part}); el.append(span);
    if(i < parts.length - 1){
      const inp = h("input", {class:"gapin", type:"text", autocapitalize:"off", autocomplete:"off", autocorrect:"off", spellcheck:"false"});
      const longest = Math.max(...q.answers[i].map(a => a.length));
      inp.style.width = Math.max(6, longest + 2) + "ch";
      el.append(inp); UI.gapEls.push(inp);
    }
  });
  card.append(el);
  card.append(keysBar(() => UI.gapEls.find(x => x === document.activeElement) || UI.lastGap || UI.gapEls[0]));
  UI.gapEls.forEach((inp, i) => {
    inp.addEventListener("focus", () => UI.lastGap = inp);
    inp.addEventListener("keydown", ev => { if(ev.key === "Enter"){ ev.preventDefault(); if(i < UI.gapEls.length-1 && !UI.gapEls[i+1].value) UI.gapEls[i+1].focus(); else check(); } });
  });
  const check = () => {
    if(UI.answered) return;
    const vals = UI.gapEls.map(x => x.value);
    if(vals.some(v => !norm(v))) { (UI.gapEls.find(x => !norm(x.value))||UI.gapEls[0]).focus(); return; }
    const res = checkGaps(q, vals);
    UI.gapEls.forEach((x, i) => { x.disabled = true; x.classList.add(res.per[i] ? "ok" : "bad"); });
    afterAnswer(card, res, vals.join(" / "));
  };
  actions(card, check);
}
function renderOrder(card, q){
  const p = h("div", {class:"prompt", lang:"de"});
  card.append(h("div", {class:"instr"}, (q.frame ? "Complete the sentence" : "Build the sentence") + (q.hint ? " (" + q.hint + ")" : "") + "."));
  const builder = h("div", {class:"builder"});
  if(q.frame) builder.append(h("span", {class:"frame"}, q.frame));
  const slot = h("span", {style:"display:contents"}); builder.append(slot);
  builder.append(h("span", {class:"end"}, q.end || "."));
  let pool = shuffle(q.tokens); if(pool.join(" ") === q.tokens.join(" ")) pool = pool.slice(1).concat(pool.slice(0,1));
  const poolEl = h("div", {class:"pool"});
  const poolBtns = {};
  const redraw = () => {
    slot.innerHTML = "";
    UI.placed.forEach((t, i) => slot.append(h("button", {class:"tok", type:"button", disabled: UI.answered ? "disabled" : null, onclick:ev=>{ if(UI.answered) return; ev.currentTarget.blur(); UI.placed.splice(i,1); redraw(); }}, t)));
    q.tokens.forEach(t => { poolBtns[t].disabled = UI.answered || UI.placed.includes(t); });
  };
  pool.forEach(t => {
    const b = h("button", {class:"tok", type:"button", onclick:ev=>{ if(UI.answered || UI.placed.includes(t)) return; ev.currentTarget.blur(); UI.placed.push(t); redraw(); }}, t);
    poolBtns[t] = b; poolEl.append(b);
  });
  card.append(builder, poolEl);
  UI.builder = builder; UI.redraw = redraw;
  actions(card, () => {
    if(UI.answered) return;
    if(UI.placed.length < q.tokens.length){ builder.classList.add("bad"); setTimeout(()=>builder.classList.remove("bad"), 600); return; }
    const res = checkOrder(q, UI.placed);
    builder.classList.add(res.ok ? "ok" : "bad");
    UI.answered = true; redraw();
    afterAnswer(card, res, UI.placed.join(" "));
  });
}

document.addEventListener("keydown", ev => {
  if($("#view-drill").classList.contains("hidden")) return;
  const q = UI.q; if(!q) return;
  const tag = (ev.target.tagName||"").toLowerCase();
  if(ev.key === "Enter" && (tag === "button" || tag === "input" || tag === "textarea")) return; // the element handles it
  if(UI.answered){
    if(ev.key === "Enter"){ ev.preventDefault(); advance(); renderQuestion(); }
    return;
  }
  if(q.kind === "mc" && /^[1-9]$/.test(ev.key)){
    const b = UI.choiceBtns[Number(ev.key)-1]; if(b){ b.click(); }
  }else if(q.kind === "mc" && ev.key === "Enter" && UI.pick !== null){ ev.preventDefault(); UI.checkBtn.click(); }
  else if(q.kind === "order"){
    if(ev.key === "Enter"){ ev.preventDefault(); UI.checkBtn.click(); }
    else if(ev.key === "Backspace"){ ev.preventDefault(); UI.placed.pop(); UI.redraw(); }
  }
});

/* ---------- summary ---------- */
function finishSession(){
  const s = SESSION; if(!s) { show("home"); renderHome(); return; }
  saveNow();
  const v = $("#view-sum"); v.innerHTML = "";
  v.append(h("h1", null, "Round done"));
  const pct = s.answered ? Math.round(100*s.correct/s.answered) : 0;
  v.append(h("p", {class:"lead"}, s.answered ? s.correct + " of " + s.answered + " correct (" + pct + "%)." : "No answers this round."));
  const tally = h("div", {class:"tally"}); s.results.forEach(ok => tally.append(h("i", {class: ok ? "" : "no"}))); v.append(tally);
  const c = counts();
  v.append(h("p", {class:"small muted", style:"margin-top:12px"}, c.m + " of " + c.total + " items mastered · " + c.due + " due now."));
  if(s.misses.length){
    v.append(h("h2", null, "To look at again"));
    const ml = h("div", {class:"misslist"});
    s.misses.forEach(m => {
      const q = BANK.find(x => x.id === m.id);
      const ans = answerText(q);
      ml.append(h("div", {class:"miss"}, h("div", {class:"p", lang:"de", html:promptText(q)}), h("div", {class:"a", html:"<em lang=de>"+esc(ans)+"</em>" + (m.given ? " — you wrote <span lang=de>"+esc(m.given)+"</span>" : "")}), h("div", {class:"a", html:q.why})));
    });
    v.append(ml);
  }
  const row = h("div", {class:"tools", style:"margin-top:22px"});
  row.append(h("button", {class:"primary", style:"margin-top:0", onclick:()=>{ show("home"); renderHome(); }}, "Back to start"));
  if(s.misses.length) row.append(h("button", {class:"secondary", onclick:()=>{ homeSel.mode="leech"; beginDrill(); }}, "Drill weak spots"));
  v.append(row);
  SESSION = null;
  renderRail(); show("sum");
}

/* ---------- rules ---------- */
function renderRef(){
  const v = $("#view-ref"); v.innerHTML = "";
  v.append(h("h1", null, "Rules"));
  v.append(h("p", {class:"lead"}, "Konjunktiv II marks something as not real: a wish, a hypothesis, a suggestion, a softened request."));

  v.append(h("h2", null, "What it does"));
  const t1 = h("table", {class:"ref"}, h("tr", null, h("th", null, "Function"), h("th", null, "Example"), h("th", null, "English")));
  [["Politeness","<b>Könnten</b> Sie mir helfen?","Could you help me?"],["Wish","Ich <b>hätte</b> gern einen Kaffee.","I'd like a coffee."],["Unreal condition","Wenn ich Zeit <b>hätte</b>, <b>würde</b> ich kommen.","If I had time, I'd come."],["Advice","Du <b>solltest</b> mehr schlafen.","You should sleep more."],["Cautious statement","Das <b>wäre</b> möglich.","That would be possible."],["Unreal comparison","Er tut so, als ob er krank <b>wäre</b>.","He acts as if he were ill."]]
    .forEach(r => t1.append(h("tr", null, h("td", null, r[0]), h("td", {lang:"de", html:r[1]}), h("td", {class:"muted"}, r[2]))));
  v.append(t1);

  v.append(h("h2", null, "Two ways to build it"));
  v.append(h("div", {class:"rulebox", html:"<b>1. würde + infinitive</b> — the default, works with almost every verb. <i>würde</i> is conjugated and sits in position 2; the infinitive goes to the end.<br><span lang=de>Ich <b>würde</b> morgen gern nach Berlin <b>fahren</b>. · <b>Würdest</b> du mir <b>helfen</b>?</span><br>In a subordinate clause the infinitive comes first and <i>würde</i> last: <span lang=de>…, wenn ich in Berlin <b>wohnen würde</b>.</span>"}));
  v.append(h("div", {class:"rulebox", html:"<b>2. Own form</b> — a small closed set: <span lang=de>sein, haben, werden, wissen, kommen, gehen</span> and all six modal verbs. Rule: Präteritum (ich-form) + umlaut (only on a, o, u) + ending.<br><span lang=de>war → <b>wäre</b> · hatte → <b>hätte</b> · wurde → <b>würde</b> · konnte → <b>könnte</b> · wusste → <b>wüsste</b> · kam → <b>käme</b> · ging → <b>ginge</b></span><br>The own form sits in position 2 (or last in a subordinate clause); with a modal the infinitive goes to the end: <span lang=de>Er <b>könnte</b> recht <b>haben</b>.</span> Never <i>würde sein / würde haben / würde können</i>."}));

  v.append(h("h2", null, "The forms to know"));
  const t2 = h("table", {class:"ref"}, h("tr", null, h("th", null, ""), h("th", null, "sein"), h("th", null, "haben"), h("th", null, "werden")));
  [["ich","wäre","hätte","würde"],["du","wärst","hättest","würdest"],["er/sie/es","wäre","hätte","würde"],["wir","wären","hätten","würden"],["ihr","wärt","hättet","würdet"],["sie/Sie","wären","hätten","würden"]]
    .forEach(r => t2.append(h("tr", null, h("td", {class:"muted"}, r[0]), h("td", {lang:"de"}, r[1]), h("td", {lang:"de"}, r[2]), h("td", {lang:"de"}, r[3]))));
  v.append(t2);
  v.append(h("p", {class:"small muted"}, "wärst / wärt also appear as wärest / wäret — both are correct."));

  v.append(h("h3", null, "Modal verbs"));
  const t3 = h("table", {class:"ref"}, h("tr", null, h("th", null, "Infinitive"), h("th", null, "Konjunktiv II"), h("th", null, "Umlaut")));
  [["können","könnte","yes"],["müssen","müsste","yes"],["dürfen","dürfte","yes"],["mögen","möchte","yes"],["sollen","sollte","no"],["wollen","wollte","no"]]
    .forEach(r => t3.append(h("tr", null, h("td", {lang:"de"}, r[0]), h("td", {lang:"de"}, r[1]), h("td", {class:r[2]==="yes"?"yes":"no"}, r[2]==="yes"?"umlaut":"no umlaut"))));
  v.append(t3);
  v.append(h("p", {class:"small"}, "Endings are the same for every verb: -e, -est, -e, -en, -et, -en. ", h("span", {lang:"de"}, "ich könnte, du könntest, er könnte, wir könnten, ihr könntet, sie könnten.")));
  v.append(h("div", {class:"rulebox", html:"<b>sollte / wollte</b> look exactly like the Präteritum. Context decides:<br><span lang=de>Ich <b>wollte</b> gestern anrufen.</span> — past, indicative<br><span lang=de>Du <b>solltest</b> zum Arzt gehen.</span> — advice, Konjunktiv II"}));

  v.append(h("h2", null, "Word order in one line"));
  v.append(h("div", {class:"rulebox", html:"Main clause: Konjunktiv II verb in <b>position 2</b>, infinitive at the <b>end</b>. Question: verb <b>first</b>. Subordinate clause (<i>wenn, als ob, ob, dass</i>): verb <b>last</b> — with würde, the infinitive comes just before it. If the wenn-clause is fronted, the main-clause verb follows <b>right after the comma</b>: <span lang=de>Wenn ich Zeit hätte, <b>würde</b> ich kommen.</span>"}));

  v.append(h("h2", null, "Softening ladder"));
  v.append(h("p", {class:"small muted"}, "Tap a line to reveal the softened version. These are the patterns to have ready before the speaking exam."));
  const lad = h("div", {class:"ladder"});
  PATTERNS.forEach(p => {
    const s = h("div", {class:"s veil", lang:"de", html: diffMark(p.direct, p.answers[0])});
    lad.append(h("button", {class:"rung", onclick:()=>s.classList.toggle("veil")}, h("div", {class:"d", lang:"de"}, p.direct), s));
  });
  v.append(lad);
}

/* ---------- progress ---------- */
function renderProg(){
  const v = $("#view-prog"); v.innerHTML = "";
  v.append(h("h1", null, "Progress"));
  const c = counts(); const st = S.stats;
  const acc = st.answered ? Math.round(100*st.correct/st.answered) : 0;
  const grid = h("div", {class:"stats"},
    h("div", {class:"stat"}, h("div", {class:"v"}, c.m + "/" + c.total), h("div", {class:"l"}, "mastered")),
    h("div", {class:"stat"}, h("div", {class:"v"}, String(c.due)), h("div", {class:"l"}, "due now")),
    h("div", {class:"stat"}, h("div", {class:"v"}, acc + "%"), h("div", {class:"l"}, "accuracy, " + st.answered + " answers")));
  v.append(grid);
  const days = Object.keys(st.days).length;
  v.append(h("p", {class:"small muted"}, days + " day" + (days===1?"":"s") + " studied · " + st.sessions + " round" + (st.sessions===1?"":"s") + (st.streak>1 ? " · " + st.streak + "-day streak" : "")));
  if(c.m === c.total) v.append(h("div", {class:"rulebox", style:"border-color:var(--yes)"}, "Every item is in box 5. Keep answering the reviews as they come due to hold it."));

  // next due
  const upcoming = BANK.filter(q => seen(q.id) && !isDue(q.id)).sort((a,b)=>dueAt(a.id)-dueAt(b.id));
  if(!c.due && upcoming.length) v.append(h("p", {class:"small muted"}, "Nothing due. Next review in " + fmtDue(dueAt(upcoming[0].id)) + "."));

  v.append(h("h2", null, "By topic"));
  v.append(h("div", {class:"legend"}, h("span", null, h("i", {style:"background:var(--yes)"}), "box 5"), h("span", null, h("i", {style:"background:var(--acc)"}), "box 1–4"), h("span", null, h("i", {style:"background:var(--neg)"}), "box 0, seen"), h("span", null, h("i", {style:"background:var(--rule-2)"}), "untouched")));
  TOPIC_ORDER.forEach(t => {
    const pool = BY_TOPIC[t]; let m=0,l=0,z=0,u=0;
    pool.forEach(q => { if(!seen(q.id)) u++; else { const b=boxOf(q.id); if(b>=MASTER_BOX) m++; else if(b===0) z++; else l++; } });
    const n = pool.length;
    v.append(h("div", {class:"trow"},
      h("div", {class:"nm"}, TOPICS[t].name, h("div", {class:"small muted"}, n + " items")),
      h("div", {class:"bar"}, h("i", {style:"width:"+(100*m/n)+"%;background:var(--yes)"}), h("i", {style:"width:"+(100*l/n)+"%;background:var(--acc)"}), h("i", {style:"width:"+(100*z/n)+"%;background:var(--neg)"}), h("i", {style:"width:"+(100*u/n)+"%;background:var(--rule-2)"})),
      h("div", {class:"pct"}, Math.round(100*m/n) + "%")));
  });

  const leeches = BANK.filter(q => S.items[q.id] && (S.items[q.id].w >= 2 || S.items[q.id].lap >= 1)).sort((a,b) => (S.items[b.id].w - S.items[b.id].c) - (S.items[a.id].w - S.items[a.id].c)).slice(0, 12);
  v.append(h("h2", null, "Weak spots"));
  if(!leeches.length) v.append(h("p", {class:"small muted"}, "Nothing has been missed twice yet."));
  leeches.forEach(q => {
    const r = S.items[q.id];
    const ans = answerText(q);
    v.append(h("div", {class:"leech"}, h("div", {class:"p", lang:"de", html:promptText(q)}), h("div", {class:"a", html:"<em lang=de>"+esc(ans)+"</em> · " + r.w + " wrong, " + r.c + " right, box " + r.b})));
  });

  v.append(h("h2", null, "Backup"));
  v.append(h("p", {class:"small muted"}, PERSISTS ? "Progress is saved in this browser only. Export a copy before switching devices or clearing browser data." : "Storage is blocked in this browser — export to keep your progress."));
  const tools = h("div", {class:"tools"});
  tools.append(h("button", {class:"secondary", onclick:exportProgress}, "Export progress"));
  const file = h("input", {type:"file", accept:"application/json,.json", style:"display:none", onchange:ev=>{ const f = ev.target.files[0]; if(!f) return; f.text().then(t => importProgress(t)); ev.target.value=""; }});
  tools.append(file, h("button", {class:"secondary", onclick:()=>file.click()}, "Import file"));
  tools.append(h("button", {class:"secondary", onclick:()=>{ const box = $("#pastebox"); box.classList.toggle("hidden"); }}, "Paste JSON"));
  tools.append(h("button", {class:"secondary", style:"color:var(--neg)", onclick:()=>{ if(confirm("Reset all progress for Konjunktiv II? This cannot be undone.")){ S = blank(); saveNow(); renderRail(); renderProg(); } }}, "Reset"));
  v.append(tools);
  const paste = h("div", {id:"pastebox", class:"hidden", style:"margin-top:10px"});
  const ta = h("textarea", {placeholder:"Paste an exported JSON backup here"});
  paste.append(ta, h("div", {style:"margin-top:8px"}, h("button", {class:"secondary", onclick:()=>importProgress(ta.value)}, "Import pasted JSON")));
  v.append(paste);
  v.append(h("div", {id:"impmsg", class:"msg"}));
}
function exportProgress(){
  const data = JSON.stringify(Object.assign({app:"konjunktiv2", exported:new Date(NOW()).toISOString()}, S));
  try{
    const blob = new Blob([data], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "konjunktiv2-progress-" + dayKey(NOW()) + ".json"; document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }catch(e){}
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(data).catch(()=>{});
  const m = $("#impmsg"); if(m){ m.className = "msg good"; m.textContent = "Exported (downloaded and copied to the clipboard)."; }
}
function validateImport(p){
  if(!p || typeof p !== "object") return "Not a JSON object.";
  if(p.v !== 1) return "Unknown version.";
  if(!p.items || typeof p.items !== "object") return "Missing items.";
  const ids = new Set(BANK.map(q => q.id));
  for(const id in p.items){
    const r = p.items[id];
    if(!r || typeof r !== "object") return "Bad record for " + id + ".";
    for(const k of ["b","due","s","c","w","lap","seen"]) if(typeof r[k] !== "number" || !isFinite(r[k])) return "Bad field " + k + " in " + id + ".";
    if(r.b < 0 || r.b > MASTER_BOX) return "Box out of range in " + id + ".";
    if(!ids.has(id)) return "Unknown item " + id + ".";
  }
  if(!p.stats || typeof p.stats !== "object") return "Missing stats.";
  return null;
}
function importProgress(text){
  const m = $("#impmsg");
  let p;
  try{ p = JSON.parse(text); }catch(e){ m.className="msg bad"; m.textContent = "That is not valid JSON."; return false; }
  const err = validateImport(p);
  if(err){ m.className="msg bad"; m.textContent = "Import rejected: " + err + " Nothing was changed."; return false; }
  S = {v:1, items:p.items, stats:Object.assign(blank().stats, p.stats)};
  S.stats.days = S.stats.days || {};
  saveNow(); renderRail(); renderProg();
  const mm = $("#impmsg"); mm.className="msg good"; mm.textContent = "Imported " + Object.keys(S.items).length + " item records.";
  return true;
}
