<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KASUS — B1 Case Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EEF1;
  --sheet:#FBFCFD;
  --grid:rgba(31,95,168,.10);
  --ink:#152430;
  --ink2:#5A6D7A;
  --ink3:#8C9BA6;
  --rule:#C9D5DD;
  --m:#1F5FA8;   /* der  · masculine */
  --f:#C2334D;   /* die  · feminine  */
  --n:#1D7A52;   /* das  · neuter  */
  --p:#6B4E9E;   /* die  · Plural   */
  --ok:#1D7A52;
  --no:#C2334D;
  --amber:#B57A0B;
  --shadow:0 1px 0 rgba(21,36,48,.06), 0 12px 28px -18px rgba(21,36,48,.5);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Archivo',system-ui,sans-serif;
  --serif:'Source Serif 4',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--disp);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  -webkit-text-size-adjust:100%;
  padding-bottom:64px;
}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--m);outline-offset:2px}

/* ---------- shell ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{
  border-bottom:1.5px solid var(--ink);
  background:rgba(233,238,241,.92);
  backdrop-filter:blur(6px);
  position:sticky;top:0;z-index:40;
}
.topin{display:flex;align-items:center;gap:14px;height:56px}
.mark{font-weight:800;letter-spacing:.26em;font-size:15px}
.mark em{font-style:normal;color:var(--f)}
.tag{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  color:var(--ink2);text-transform:uppercase;padding-top:2px;
}
.spacer{flex:1}
.hud{display:flex;gap:10px;align-items:center}
.pill{
  font-family:var(--mono);font-size:11px;font-weight:500;
  border:1.5px solid var(--ink);background:var(--sheet);
  padding:4px 9px;border-radius:2px;white-space:nowrap;
}
.pill b{font-weight:700}
.pill.hot{border-color:var(--f);color:var(--f)}

nav.tabs{display:flex;gap:0;border-bottom:1.5px solid var(--ink);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  background:transparent;border:0;border-bottom:3px solid transparent;
  padding:11px 15px;font-size:13px;font-weight:600;letter-spacing:.02em;
  color:var(--ink2);white-space:nowrap;
}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--f)}
nav.tabs button:hover{color:var(--ink)}

main{padding-top:22px}
.cols{display:grid;grid-template-columns:262px 1fr;gap:26px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr;gap:18px}.cols aside{order:2}.cols section{order:1}}

/* ---------- Kasusraster (signature) ---------- */
.raster{position:sticky;top:112px}
@media(max-width:860px){.raster{position:static}}
.raster h3,.side h3{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink2);margin:0 0 8px;font-weight:500;
}
.rtable{
  width:100%;border-collapse:collapse;background:var(--sheet);
  border:1.5px solid var(--ink);font-family:var(--mono);font-size:11px;
  box-shadow:var(--shadow);table-layout:fixed;
}
.rtable th,.rtable td{border:1px solid var(--rule);padding:5px 2px;text-align:center;transition:background .18s,color .18s}
.rtable thead th:first-child{width:32px}
.rtable thead th{font-size:9.5px;letter-spacing:.08em;font-weight:700;color:#fff;padding:5px 2px}
.rtable thead th:nth-child(1){background:var(--ink)}
.rtable thead th:nth-child(2){background:var(--m)}
.rtable thead th:nth-child(3){background:var(--f)}
.rtable thead th:nth-child(4){background:var(--n)}
.rtable thead th:nth-child(5){background:var(--p)}
.rtable tbody th{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;font-weight:700;
  background:#EFF3F6;color:var(--ink2);
}
.rtable td{color:var(--ink2)}
.rtable tr.rowon th{background:var(--ink);color:#fff}
.rtable tr.rowon td{background:rgba(31,95,168,.07);color:var(--ink)}
.rtable td.cellon{background:var(--ink)!important;color:#fff!important;font-weight:700}
.rtable td.reveal{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
.rcap{font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-top:7px;letter-spacing:.04em;line-height:1.5}

.side{margin-top:22px}
.mastery{display:flex;flex-direction:column;gap:5px}
.mrow{display:grid;grid-template-columns:1fr 34px;gap:7px;align-items:center;font-size:11.5px;cursor:pointer;background:none;border:0;padding:2px 0;text-align:left;width:100%}
.mrow .lbl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2);font-weight:600}
.mrow:hover .lbl{color:var(--ink)}
.bar{display:block;height:6px;background:#DCE4E9;border:1px solid var(--rule);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--m);display:block}
.bar i.full{background:var(--ok)}
.mnum{font-family:var(--mono);font-size:10px;color:var(--ink3);text-align:right}

/* ---------- question card ---------- */
.card{
  background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.card.ruled{padding:26px 24px 24px 40px}
.card.ruled::before{
  content:"";position:absolute;left:22px;top:0;bottom:0;width:1.5px;background:var(--f);opacity:.55;
}
@media(max-width:600px){.card.ruled{padding:20px 16px 20px 30px}.card.ruled::before{left:15px}}

.qmeta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:16px}
.chip{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1.5px solid var(--ink);padding:3px 7px;border-radius:2px;font-weight:500;
}
.chip.solid{background:var(--ink);color:var(--sheet)}
.chip.m{border-color:var(--m);color:var(--m)}
.chip.f{border-color:var(--f);color:var(--f)}
.chip.n{border-color:var(--n);color:var(--n)}
.chip.p{border-color:var(--p);color:var(--p)}
.chip.bonus{border-color:var(--amber);color:var(--amber)}
.chip.box{border-color:var(--rule);color:var(--ink3)}

.qtext{font-family:var(--serif);font-size:25px;line-height:1.45;margin:0 0 6px;font-weight:400}
@media(max-width:600px){.qtext{font-size:21px}}
.qtext .gap{
  display:inline-block;min-width:74px;border-bottom:2.5px solid var(--ink);
  text-align:center;font-family:var(--mono);font-size:.82em;vertical-align:baseline;
}
.qtext .gap.filled{border-bottom-color:var(--ok);color:var(--ok);font-weight:700}
.qtext .gap.bad{border-bottom-color:var(--no);color:var(--no)}
.qtext b{font-weight:600;box-shadow:inset 0 -.5em 0 rgba(181,122,11,.22)}
.qtext .qsm{font-family:var(--mono);font-size:.6em;letter-spacing:.03em;color:var(--ink2);text-transform:uppercase;font-weight:500}
.qhint{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:15px;margin:2px 0 0}
.qcue{font-family:var(--mono);font-size:12px;color:var(--m);margin-top:8px;letter-spacing:.02em}

.choices{display:grid;gap:8px;margin-top:20px}
.choices.wide{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ch{
  display:flex;align-items:center;gap:10px;text-align:left;
  background:var(--sheet);border:1.5px solid var(--rule);border-radius:3px;
  padding:11px 13px;font-size:16px;font-weight:600;transition:border-color .12s,background .12s,transform .06s;
}
.ch:hover:not(:disabled){border-color:var(--ink);background:#fff}
.ch:active:not(:disabled){transform:translateY(1px)}
.ch kbd{
  font-family:var(--mono);font-size:10px;font-weight:500;color:var(--ink3);
  border:1px solid var(--rule);border-radius:2px;padding:1px 5px;flex:none;
}
.ch .txt{font-family:var(--mono);font-weight:500}
.ch.long .txt{font-family:var(--serif);font-size:16px;font-weight:400}
.ch:disabled{cursor:default;opacity:.55}
.ch.right{border-color:var(--ok);background:rgba(29,122,82,.09);opacity:1}
.ch.right kbd{border-color:var(--ok);color:var(--ok)}
.ch.wrong{border-color:var(--no);background:rgba(194,51,77,.08);opacity:1}
.ch.wrong .txt{text-decoration:line-through;text-decoration-color:var(--no);text-decoration-thickness:2px}

.typerow{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
input.answer{
  flex:1;min-width:200px;font-family:var(--mono);font-size:18px;padding:11px 13px;
  border:1.5px solid var(--ink);border-radius:3px;background:#fff;color:var(--ink);
}
input.answer::placeholder{color:var(--ink3);font-size:14px}
input.answer.right{border-color:var(--ok);background:rgba(29,122,82,.07)}
input.answer.wrong{border-color:var(--no);background:rgba(194,51,77,.07);text-decoration:line-through}
.btn{
  border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);
  border-radius:3px;padding:11px 20px;font-size:14px;font-weight:700;letter-spacing:.02em;
}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:rgba(21,36,48,.06)}
.btn.sm{padding:7px 13px;font-size:12px}
.umlauts{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.umlauts button{font-family:var(--mono);font-size:14px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:2px;padding:4px 11px}
.umlauts button:hover{border-color:var(--ink)}

.verdict{margin-top:20px;border-top:1.5px solid var(--ink);padding-top:15px}
.vhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.vlabel{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.vlabel.ok{color:var(--ok)}
.vlabel.no{color:var(--no)}
.vsol{font-family:var(--mono);font-size:19px;font-weight:700}
.why{font-family:var(--serif);font-size:16px;line-height:1.6;color:var(--ink);margin:0}
.why s{text-decoration-color:var(--no);text-decoration-thickness:1.5px;opacity:.75}
.why code{font-family:var(--mono);font-size:.86em;background:#E4EAEE;padding:1px 5px;border-radius:2px}
.why .warn{color:var(--amber);font-weight:600;font-style:italic}
.vnext{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.vnext .hintkey{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}

/* ---------- mode bar ---------- */
.modebar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.mode{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;
  border:1.5px solid var(--rule);background:var(--sheet);border-radius:2px;padding:6px 11px;color:var(--ink2);
}
.mode[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.mode:hover{border-color:var(--ink);color:var(--ink)}
.mode[aria-pressed="true"]:hover{color:var(--sheet)}

/* ---------- panels ---------- */
.panel{background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;box-shadow:var(--shadow);padding:24px;margin-bottom:20px}
.panel h2{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
.panel .sub{font-family:var(--serif);color:var(--ink2);font-size:15px;margin:0 0 18px;line-height:1.55}
.panel h4{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin:24px 0 9px;font-weight:500}
.panel h4:first-of-type{margin-top:0}
table.ref{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin-bottom:6px}
table.ref th,table.ref td{border:1px solid var(--rule);padding:6px 8px;text-align:center}
table.ref thead th{color:#fff;font-size:10px;letter-spacing:.08em}
table.ref thead th:nth-child(1){background:var(--ink);text-align:left}
table.ref thead th:nth-child(2){background:var(--m)}
table.ref thead th:nth-child(3){background:var(--f)}
table.ref thead th:nth-child(4){background:var(--n)}
table.ref thead th:nth-child(5){background:var(--p)}
table.ref.plain thead th{background:var(--ink);text-align:left}
table.ref tbody th{background:#EFF3F6;text-align:left;font-size:10.5px;letter-spacing:.06em;color:var(--ink2)}
.reflist{font-family:var(--serif);font-size:15.5px;line-height:1.65;margin:0 0 4px;padding-left:20px}
.reflist li{margin-bottom:5px}
.reflist code,.inline-code{font-family:var(--mono);font-size:.84em;background:#E4EAEE;padding:1px 5px;border-radius:2px}
.note{
  border-left:3px solid var(--amber);background:rgba(181,122,11,.07);
  padding:12px 15px;font-family:var(--serif);font-size:15px;line-height:1.6;margin:14px 0;
}
.note b{font-family:var(--disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:5px;color:var(--amber)}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:12px;margin-bottom:6px}
.stat{border:1.5px solid var(--ink);border-radius:3px;padding:13px 14px;background:var(--sheet)}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.stat .v{font-family:var(--mono);font-size:27px;font-weight:700;line-height:1.2;margin-top:3px}
.stat .v small{font-size:13px;color:var(--ink3);font-weight:400}

.tprog{display:grid;grid-template-columns:1fr;gap:10px}
.tp{display:grid;grid-template-columns:1fr;gap:5px;border-bottom:1px solid var(--rule);padding-bottom:10px}
.tp .r1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tp .nm{font-size:14px;font-weight:600}
.tp .de{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.tp .num{font-family:var(--mono);font-size:11.5px;color:var(--ink2);white-space:nowrap}
.bigbar{height:9px;background:#DCE4E9;border:1px solid var(--rule);display:flex;overflow:hidden}
.bigbar span{display:block;height:100%}
.bigbar .s5{background:var(--ok)}
.bigbar .s3{background:var(--m)}
.bigbar .s1{background:#9FB4C4}
.legend{display:flex;gap:14px;font-family:var(--mono);font-size:10px;color:var(--ink2);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}

textarea.bak{width:100%;height:74px;font-family:var(--mono);font-size:10.5px;line-height:1.5;color:var(--ink2);
  border:1.5px solid var(--rule);border-radius:3px;background:#fff;padding:8px 10px;resize:vertical;margin-bottom:10px}
textarea.bak:focus{border-color:var(--ink);color:var(--ink)}
.empty{font-family:var(--serif);font-size:17px;line-height:1.6;color:var(--ink2)}
.result{text-align:center;padding:14px 0}
.result .big{font-family:var(--mono);font-size:56px;font-weight:700;line-height:1}
.result .cap{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin-top:6px}
.result .msg{font-family:var(--serif);font-size:17px;line-height:1.6;margin:16px auto 0;max-width:46ch}
.misslist{margin-top:20px;border-top:1.5px solid var(--ink);padding-top:14px;text-align:left}
.miss{font-family:var(--serif);font-size:15px;line-height:1.55;padding:7px 0;border-bottom:1px solid var(--rule)}
.miss .sol{font-family:var(--mono);font-weight:700;color:var(--ok)}
.miss .yours{font-family:var(--mono);color:var(--no);text-decoration:line-through}

footer{max-width:1120px;margin:34px auto 0;padding:16px;font-family:var(--mono);font-size:10.5px;color:var(--ink3);line-height:1.7;border-top:1px solid var(--rule)}
@media(max-width:560px){.topin{gap:9px}.tag{display:none}.hud .pill.hide-s{display:none}.mark{font-size:13px;letter-spacing:.2em}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topin">
      <div class="mark">KASUS<em>.</em></div>
      <div class="tag">telc&nbsp;B1</div>
      <div class="spacer"></div>
      <div class="hud" id="hud"></div>
    </div>
  </div>
  <div class="wrap">
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer>
  Built from your own B1 notes · 4 cases × 4 genders × every trigger you wrote down.<br>
  Keyboard: <b>1–6</b> pick · <b>Enter</b> check / next · <b>Esc</b> skip.
</footer>
<script>
"use strict";
/* ============================================================
   KASUS — B1 German case trainer
   Content derived from the user's own B1 notes.
   ============================================================ */

const CASES = ["nom","akk","dat","gen"];
const CASE_DE = {nom:"Nominativ",akk:"Akkusativ",dat:"Dativ",gen:"Genitiv"};
const CASE_SHORT = {nom:"NOM",akk:"AKK",dat:"DAT",gen:"GEN"};
const GEN_DE = {m:"masculine",f:"feminine",n:"neuter",p:"plural"};
const GEN_SHORT = {m:"MASC",f:"FEM",n:"NEUT",p:"PL"};

/* ---- declension tables (from the notes) ---- */
const TBL = {
  def:   {nom:{m:"der",f:"die",n:"das",p:"die"},akk:{m:"den",f:"die",n:"das",p:"die"},dat:{m:"dem",f:"der",n:"dem",p:"den"},gen:{m:"des",f:"der",n:"des",p:"der"}},
  dies:  {nom:{m:"dieser",f:"diese",n:"dieses",p:"diese"},akk:{m:"diesen",f:"diese",n:"dieses",p:"diese"},dat:{m:"diesem",f:"dieser",n:"diesem",p:"diesen"},gen:{m:"dieses",f:"dieser",n:"dieses",p:"dieser"}},
  ein:   {nom:{m:"ein",f:"eine",n:"ein",p:"—"},akk:{m:"einen",f:"eine",n:"ein",p:"—"},dat:{m:"einem",f:"einer",n:"einem",p:"—"},gen:{m:"eines",f:"einer",n:"eines",p:"—"}},
  kein:  {nom:{m:"kein",f:"keine",n:"kein",p:"keine"},akk:{m:"keinen",f:"keine",n:"kein",p:"keine"},dat:{m:"keinem",f:"keiner",n:"keinem",p:"keinen"},gen:{m:"keines",f:"keiner",n:"keines",p:"keiner"}},
  mein:  {nom:{m:"mein",f:"meine",n:"mein",p:"meine"},akk:{m:"meinen",f:"meine",n:"mein",p:"meine"},dat:{m:"meinem",f:"meiner",n:"meinem",p:"meinen"},gen:{m:"meines",f:"meiner",n:"meines",p:"meiner"}},
  euer:  {nom:{m:"euer",f:"eure",n:"euer",p:"eure"},akk:{m:"euren",f:"eure",n:"euer",p:"eure"},dat:{m:"eurem",f:"eurer",n:"eurem",p:"euren"},gen:{m:"eures",f:"eurer",n:"eures",p:"eurer"}},
  weak:  {nom:{m:"-e",f:"-e",n:"-e",p:"-en"},akk:{m:"-en",f:"-e",n:"-e",p:"-en"},dat:{m:"-en",f:"-en",n:"-en",p:"-en"},gen:{m:"-en",f:"-en",n:"-en",p:"-en"}},
  mixed: {nom:{m:"-er",f:"-e",n:"-es",p:"-en"},akk:{m:"-en",f:"-e",n:"-es",p:"-en"},dat:{m:"-en",f:"-en",n:"-en",p:"-en"},gen:{m:"-en",f:"-en",n:"-en",p:"-en"}},
  strong:{nom:{m:"-er",f:"-e",n:"-es",p:"-e"},akk:{m:"-en",f:"-e",n:"-es",p:"-e"},dat:{m:"-em",f:"-er",n:"-em",p:"-en"},gen:{m:"-en",f:"-er",n:"-en",p:"-er"}},
  rel:   {nom:{m:"der",f:"die",n:"das",p:"die"},akk:{m:"den",f:"die",n:"das",p:"die"},dat:{m:"dem",f:"der",n:"dem",p:"denen"},gen:{m:"dessen",f:"deren",n:"dessen",p:"deren"}}
};
const GRID_CAP = {
  def:"definite article", dies:"der-words (dieser)", ein:"indefinite article",
  kein:"ein-words (kein / mein)", mein:"possessive (mein)", euer:"euer — the second e drops",

function wech(sent,ans,gender,cs,gloss,extra){
  const seen=[], ch=[];
  ["akk","dat","gen","nom"].forEach(c=>{const v=TBL.def[c][gender]; if(seen.indexOf(v)<0){seen.push(v);ch.push(v);}});
  ["den","dem","die","der","das","des"].forEach(v=>{ if(ch.length<4 && ch.indexOf(v)<0) ch.push(v); });
  add({topic:"wechsel",kind:"mc",q:sent,hint:gloss,a:ans,
    choices:ch,gender:gender,
    why:(cs==="akk"
      ? "<em>Wohin?</em> — the thing crosses into a new place, so <b>Akkusativ</b>. "
      : "<em>Wo?</em> — stable position, nothing changes place, so <b>Dativ</b>. ")+(extra||""),
    grid:{mode:"def",case:cs,gender:gender}});
}

const ART_SETS = [

  {key:"mein",word:"mein", note:"possessive article", full:false},
  {key:"euer",word:"euer", note:"euer loses its second e", full:true}
];
function uniqForms(key){
  const s=new Set();
  CASES.forEach(c=>["m","f","n","p"].forEach(g=>{const v=TBL[key][c][g]; if(v!=="—") s.add(v);}));
  return Array.from(s);
}
ART_SETS.forEach(set=>{
  const forms = uniqForms(set.key);
  const gens = set.key==="ein" ? ["m","f","n"] : ["m","f","n","p"];
  const subset = set.full ? CASES : ["akk","dat","gen"];
  subset.forEach(c=>{
    gens.forEach(g=>{
      const a = TBL[set.key][c][g];
      let why = "";
      if(set.key==="def") why = "The definite article is the master pattern — every der-word copies it.";
      else if(set.key==="dies") why = "der-words (<code>dieser, jeder, jener, mancher, welcher, alle</code>) take exactly the definite-article endings.";
      else if(set.key==="ein") why = "<code>ein</code> has <b>no ending at all</b> in Nominativ masculine and Nominativ/Akkusativ neuter — that bare form is what makes the ein-pattern different.";
      else if(set.key==="euer") why = "<code>euer</code> drops its second <b>e</b> as soon as an ending is added: <em>euer → eurem</em>, never <s>euerem</s>.";
      else why = "ein-words: <code>kein</code> and all possessives run on this table. Bare form only in Nom. mask. and Nom./Akk. neuter.";
      if(c==="gen" && (g==="m"||g==="n")) why += " In the Genitiv the noun itself also takes <b>-s / -es</b>.";
      if(c==="dat" && g==="p") why += " In the Dativ Plural the noun also takes an extra <b>-n</b>.";
      add({topic:"artikel",id:"art-"+set.key+"-"+c+"-"+g,kind:"mc",
        q:"<span class='qsm'>"+set.word+"</span> &nbsp;·&nbsp; "+CASE_DE[c]+" &nbsp;·&nbsp; "+GEN_DE[g],
        hint:set.note,a:a,pool:forms,why:why,
        grid:{mode:set.key,case:c,gender:g,open:true}});
    });
  });
});

];

/* ============================================================
   ENGINE
   ============================================================ */
const POOLS = {
  wech:["der","die","das","den","dem","des"],
  rel:["der","die","das","den","dem","denen","dessen","deren"],
  pers:["mich","mir","dich","dir","ihn","ihm","es","sie","ihr","uns","euch","ihnen","Ihnen","Sie"]
};
/* Box gaps. n = how many other answers must pass, t = how much real time.
   The first boxes are spaced by answers so an item actually comes back inside
   a session; the last boxes are spaced by days, so "sicher" cannot be faked
   in one sitting. */
const BOX_LAG = [{n:0,t:0},{n:8,t:0},{n:25,t:0},{n:60,t:20*36e5},{n:0,t:3*24*36e5},{n:0,t:8*24*36e5}];
const MASTER_BOX = 4;
const KEY = "kasus.b1.v3";

const S = {
  prog:{}, stats:{streak:0, best:0, answered:0, correct:0, day:"", dayCount:0},
  extras:true, view:"drill", mode:"mix", topic:null,
  queue:[], cur:null, answered:false, lastRight:false, given:"",
  exam:null, dirty:false, bakMsg:""
};

/* ---- storage -------------------------------------------------
   Three backends, picked at startup by what the page actually has:
     1. window.storage — present when this runs as a Claude artifact
     2. localStorage   — present when the .html file is opened directly
     3. memory         — private-mode browsers and anything else
   Every call is wrapped, so a blocked backend degrades instead of
   throwing. -------------------------------------------------- */
const STORE = (function(){
  const w = (typeof window !== "undefined") ? window : null;
  if(w && w.storage && typeof w.storage.get === "function" && typeof w.storage.set === "function"){
    return {kind:"artifact", label:"saved in this artifact — it will be here next time you open the chat",
      get:async k=>{ const r = await w.storage.get(k,false); return (r && r.value) ? r.value : null; },
      set:async (k,v)=>{ await w.storage.set(k,v,false); }};
  }
  try{
    const probe = "__kasus_probe__";
    w.localStorage.setItem(probe,"1");
    w.localStorage.removeItem(probe);
    return {kind:"local", label:"saved in this browser (localStorage) — it survives closing the tab",
      get:async k=>w.localStorage.getItem(k),
      set:async (k,v)=>{ w.localStorage.setItem(k,v); }};
  }catch(e){ /* no localStorage: private mode, file:// restrictions, sandbox */ }
  const mem = {};
  return {kind:"memory", label:"no storage available here — progress lasts for this session only",
    get:async k=>(k in mem ? mem[k] : null), set:async (k,v)=>{ mem[k]=v; }};
})();

function payload(){ return JSON.stringify({v:3, prog:S.prog, stats:S.stats, extras:S.extras}); }
function applySaved(d){
  if(!d || typeof d !== "object") return false;
  if(d.prog && typeof d.prog === "object") S.prog = d.prog;
  if(d.stats && typeof d.stats === "object") S.stats = Object.assign(S.stats, d.stats);
  if(typeof d.extras === "boolean") S.extras = d.extras;
  return true;
}
async function load(){
  try{
    const raw = await STORE.get(KEY);
    if(raw) applySaved(JSON.parse(raw));
  }catch(e){ /* first run, or unreadable — start clean */ }
}
let saveT = null;
async function flush(){
  clearTimeout(saveT); saveT = null;
  try{ await STORE.set(KEY, payload()); S.dirty = false; }catch(e){ /* keep going in memory */ }
}
function save(){
  S.dirty = true;
  clearTimeout(saveT);
  saveT = setTimeout(flush, 600);
}
/* a debounced write must not be lost when the tab closes */
if(typeof document !== "undefined" && typeof document.addEventListener === "function"){
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden" && S.dirty) flush();
  });
}
if(typeof window !== "undefined" && typeof window.addEventListener === "function"){
  window.addEventListener("pagehide", function(){ if(S.dirty) flush(); });
}

/* ---- helpers ---- */
const byId = {}; BANK.forEach(i=>byId[i.id]=i);
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function P(id){ const p = S.prog[id] || (S.prog[id]={b:0,d:0,n:0,s:0,r:0,w:0});
  if(p.d===undefined) p.d=0; if(p.n===undefined) p.n=0; return p; }
function has(id){ return !!S.prog[id]; }
function isBonus(it){ return it.bonus || (TOPIC_BY_ID[it.topic]||{}).bonus; }
function pool(it){
  if(it.choices) return it.choices;
  const p = typeof it.pool === "string" ? POOLS[it.pool] : it.pool;
  if(!p) return [it.a];
  if(p.length<=5) return p;
  const others = shuffle(p.filter(x=>x!==it.a)).slice(0,3);
  return others.concat([it.a]);
}
const CONTR = [[/\bam\b/g,"an dem"],[/\bim\b/g,"in dem"],[/\bins\b/g,"in das"],[/\bans\b/g,"an das"],
  [/\bzum\b/g,"zu dem"],[/\bzur\b/g,"zu der"],[/\bvom\b/g,"von dem"],[/\bbeim\b/g,"bei dem"],[/\baufs\b/g,"auf das"]];
function norm(s){
  let t = String(s||"").toLowerCase().replace(/[.,!?;:„“"']/g," ").replace(/\s+/g," ").trim();
  CONTR.forEach(([re,to])=>{ t = t.replace(re,to); });
  return t.replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/\s+/g," ").trim();
}
function check(it,given){
  const g = norm(given);
  if(!g) return false;
  if(g === norm(it.a)) return true;
  return (it.alts||[]).some(x=>norm(x)===g);
}

/* ---- candidate set + queue ---- */
function candidates(){
  return BANK.filter(it=>{
    if(!S.extras && isBonus(it)) return false;
    if(S.mode==="topic" && S.topic) return it.topic===S.topic;
    if(S.mode==="fehler") { const p=S.prog[it.id]; return p && p.w>0 && p.b<MASTER_BOX; }
    return true;
  });
}
function refill(){
  const now = Date.now(), ans = S.stats.answered;
  const cand = candidates();
  if(!cand.length) return;
  const inQ = new Set(S.queue);
  const due = [], fresh = [], rest = [];
  cand.forEach(it=>{
    if(inQ.has(it.id) || (S.cur && S.cur.id===it.id)) return;
    const p = S.prog[it.id];
    if(!p) fresh.push(it);
    else if(p.d<=now && p.n<=ans) due.push(it);
    else rest.push(it);
  });
  due.sort((a,b)=> (S.prog[a.id].b - S.prog[b.id].b) || (S.prog[a.id].d - S.prog[b.id].d));
  const fr = shuffle(fresh), rs = shuffle(rest);
  const out = [];
  // 2 due : 1 new, and no new material at all while a backlog is waiting
  const room = due.length < 12;
  let di=0, fi=0;
  while(out.length<14 && (di<due.length || (room && fi<fr.length))){
    if(di<due.length) out.push(due[di++].id);
    if(di<due.length) out.push(due[di++].id);
    if(room && fi<fr.length) out.push(fr[fi++].id);
  }
  let ri=0;
  while(out.length<10 && ri<rs.length) out.push(rs[ri++].id);
  S.queue = S.queue.concat(out);
}
function nextItem(){
  if(S.queue.length<5) refill();
  const id = S.queue.shift();
  S.cur = id ? byId[id] : null;
  S.answered = false; S.given = "";
  if(S.cur) P(S.cur.id);
}

/* ---- grading ---- */
function grade(right){
  const it = S.cur, p = P(it.id);
  p.s++;
  const st = S.stats;
  st.answered++;
  const today = new Date().toISOString().slice(0,10);
  if(st.day !== today){ st.day = today; st.dayCount = 0; }
  st.dayCount++;
  if(right){
    p.r++; p.b = Math.min(5, p.b+1);
    p.d = Date.now() + BOX_LAG[p.b].t;
    p.n = st.answered + BOX_LAG[p.b].n;
    st.correct++; st.streak++; st.best = Math.max(st.best, st.streak);
  }else{
    p.w++; p.b = Math.max(0, p.b-2);
    p.d = Date.now(); p.n = 0;
    st.streak = 0;
    const pos = Math.min(S.queue.length, 3+Math.floor(Math.random()*3));
    S.queue.splice(pos, 0, it.id);
  }
  save();
}

/* ---- mastery numbers ---- */
function topicStats(tid){
  const items = BANK.filter(i=>i.topic===tid);
  let mastered=0, learning=0, touched=0, right=0, seen=0;
  items.forEach(i=>{
    const p = S.prog[i.id];
    if(!p) return;
    touched++; right+=p.r; seen+=p.s;
    if(p.b>=MASTER_BOX) mastered++; else if(p.b>=2) learning++;
  });
  return {total:items.length, mastered, learning, touched, acc: seen? Math.round(right/seen*100):null};
}
function overall(){
  let m=0, t=0;
  BANK.forEach(i=>{ if(!S.extras && isBonus(i)) return; t++; const p=S.prog[i.id]; if(p&&p.b>=MASTER_BOX) m++; });
  return {m:m, t:t, pct: t? Math.round(m/t*100):0};
}

/* ---- Kasusraster ---- */
function raster(g){
  const mode = (g && g.mode) || "def";
  const tbl = TBL[mode] || TBL.def;
  const show = !!(g && (g.open || S.answered));
  const cs = show ? (g && g.case) : null, gd = show ? (g && g.gender) : null;
  const reveal = S.answered;
  let h = '<h3>Case grid</h3><table class="rtable"><thead><tr><th></th><th>MASC</th><th>FEM</th><th>NEUT</th><th>PL</th></tr></thead><tbody>';
  CASES.forEach(c=>{
    const on = c===cs;
    h += '<tr class="'+(on?"rowon":"")+'"><th>'+CASE_SHORT[c]+'</th>';
    ["m","f","n","p"].forEach(gg=>{
      const cell = on && gg===gd;
      const v = tbl[c][gg];
      h += '<td class="'+(cell?"cellon":"")+(cell&&reveal?" reveal":"")+'">'+(cell&&!reveal?"?":esc(v))+'</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table><div class="rcap">'+esc(GRID_CAP[mode]||"")+'</div>';
  return h;
}

/* ---- side mastery list ---- */
function sideList(){
  const rows = TOPICS.filter(t=>S.extras||!t.bonus).map(t=>{
    const s = topicStats(t.id);
    const pct = s.total? Math.round(s.mastered/s.total*100):0;
    return '<button class="mrow" data-topic="'+t.id+'" title="'+esc(t.de)+'">'+
      '<span><span class="lbl">'+esc(t.nm)+'</span><span class="bar"><i class="'+(pct===100?"full":"")+'" style="width:'+pct+'%"></i></span></span>'+
      '<span class="mnum">'+pct+'%</span></button>';
  }).join("");
  return '<div class="side"><h3>Mastered</h3><div class="mastery">'+rows+'</div></div>';
}

/* ---- question card ---- */
function cardHTML(){
  const it = S.cur;
  if(!it) return '<div class="card ruled"><p class="empty">'+(S.mode==="fehler"
      ? "Your mistakes list is empty. Nothing you have got wrong is still unlearnt — every past mistake has climbed back to box 4 or higher."
      : "Nothing due in this selection. Everything here is scheduled for a later review, which is exactly what you want. Switch topic, or come back tomorrow.")+'</p></div>';
  const p = P(it.id);
  const t = TOPIC_BY_ID[it.topic];
  const g = it.grid||{};
  const open = !!g.open || S.answered;
  let chips = '<span class="chip solid">'+esc(t.nm)+'</span>';
  if(g.case && open) chips += '<span class="chip">'+CASE_DE[g.case]+'</span>';
  if(g.gender && open) chips += '<span class="chip '+g.gender+'">'+GEN_DE[g.gender]+'</span>';
  if(isBonus(it)) chips += '<span class="chip bonus">'+esc(it.flag ? it.flag+" · beyond B1" : "+ beyond your notes")+'</span>';
  chips += '<span class="chip box">box '+p.b+'/5</span>';

  let q = it.q;
  if(S.answered && it.kind==="type" && (q.match(/___/g)||[]).length===1){
    q = q.replace("___", '<span class="gap '+(S.lastRight?"filled":"bad")+'">'+esc(it.a)+'</span>');
  }
  let h = '<div class="card ruled"><div class="qmeta">'+chips+'</div>';
  h += '<p class="qtext">'+q+'</p>';
  if(it.hint) h += '<p class="qhint">'+esc(it.hint)+'</p>';
  if(it.cue)  h += '<p class="qcue">→ '+esc(it.cue)+'</p>';

  if(it.kind==="mc"){
    const opts = S.answered ? S.shownOpts : (S.shownOpts = shuffle(pool(it)));
    h += '<div class="choices'+(it.long?"":" wide")+'">';
    opts.forEach((o,i)=>{
      let cls = "ch"+(it.long?" long":"");
      if(S.answered){
        if(o===it.a) cls += " right";
        else if(o===S.given) cls += " wrong";
      }
      h += '<button class="'+cls+'" data-opt="'+esc(o)+'"'+(S.answered?" disabled":"")+'>'+
           '<kbd>'+(i+1)+'</kbd><span class="txt">'+esc(o)+'</span></button>';
    });
    h += '</div>';
  }else{
    const cls = S.answered ? (S.lastRight?"right":"wrong") : "";
    h += '<div class="typerow"><input class="answer '+cls+'" id="ans" autocomplete="off" autocorrect="off" '+
         'autocapitalize="off" spellcheck="false" placeholder="Type your answer…" value="'+esc(S.given)+'"'+
         (S.answered?" disabled":"")+'>'+
         (S.answered?'':'<button class="btn" id="checkBtn">Check</button>')+'</div>';
    if(!S.answered) h += '<div class="umlauts">'+["ä","ö","ü","ß","Ä","Ö","Ü"].map(c=>'<button data-ins="'+c+'">'+c+'</button>').join("")+'</div>';
  }

  if(S.answered){
    h += '<div class="verdict"><div class="vhead">'+
         '<span class="vlabel '+(S.lastRight?"ok":"no")+'">'+(S.lastRight?"Correct":"Wrong")+'</span>'+
         '<span class="vsol">'+esc(it.a)+'</span>';
    if(S.lastRight && S.given && norm(S.given)===norm(it.a) && S.given.trim()!==it.a)
      h += '<span class="hintkey">you wrote: '+esc(S.given.trim())+'</span>';
    h += '</div><p class="why">'+it.why+'</p>'+
         '<div class="vnext"><button class="btn" id="nextBtn">Next</button>'+
         '<span class="hintkey">Enter</span></div></div>';
  }
  h += '</div>';
  return h;
}

function modeBar(){
  const modes = [["mix","Mixed"],["topic","One topic"],["fehler","Mistakes"],["pruefung","Exam"]];
  let h = '<div class="modebar">';
  modes.forEach(([k,l])=>{ h += '<button class="mode" data-mode="'+k+'" aria-pressed="'+(S.mode===k)+'">'+l+'</button>'; });
  h += '<button class="mode" data-extras="1" aria-pressed="'+S.extras+'">+ Extras</button></div>';
  if(S.mode==="topic"){
    h += '<div class="modebar">'+TOPICS.filter(t=>S.extras||!t.bonus).map(t=>
      '<button class="mode" data-topic="'+t.id+'" aria-pressed="'+(S.topic===t.id)+'">'+esc(t.nm)+'</button>').join("")+'</div>';
  }
  return h;
}

/* ---- exam ---- */
function startExam(){
  const cand = shuffle(candidates());
  const seen = cand.filter(i=>has(i.id)), fresh = cand.filter(i=>!has(i.id));
  const list = seen.slice(0,18).concat(fresh.slice(0, 25-Math.min(18,seen.length))).slice(0,25);
  S.exam = {list:shuffle(list), i:0, right:0, miss:[]};
  S.queue = []; S.cur = S.exam.list[0]; S.answered=false; S.given="";
  if(S.cur) P(S.cur.id);
}
function examResult(){
  const e = S.exam, n = e.list.length;
  const pct = Math.round(e.right/n*100);
  const pass = pct>=90;
  let h = '<div class="card ruled"><div class="result">'+
    '<div class="big" style="color:'+(pass?"var(--ok)":"var(--no)")+'">'+pct+'%</div>'+
    '<div class="cap">'+e.right+' of '+n+' correct</div>'+
    '<p class="msg">'+(pass
      ? "That is exam standard. Run it again on a different day — a score you can repeat cold is the one that counts."
      : "Below 90%. The misses below went straight back into your queue at a lower box, so they will come round again soon.")+'</p>';
  if(e.miss.length){
    h += '<div class="misslist">';
    e.miss.forEach(m=>{
      h += '<div class="miss">'+m.q.replace(/<[^>]+>/g,"")+'<br><span class="sol">'+esc(m.a)+'</span>'+
           (m.g?' &nbsp;·&nbsp; <span class="yours">'+esc(m.g)+'</span>':'')+'</div>';
    });
    h += '</div>';
  }
  h += '<div class="vnext" style="justify-content:center"><button class="btn" id="againBtn">Try another set</button>'+
       '<button class="btn ghost" id="backBtn">Back to practice</button></div></div></div>';
  return h;
}

function renderDrill(){
  let body;
  if(S.mode==="pruefung"){
    if(!S.exam) startExam();
    body = (S.exam && S.exam.i>=S.exam.list.length) ? examResult() : cardHTML();
  }else{
    if(!S.cur) nextItem();
    body = cardHTML();
  }
  const gridSrc = (S.mode==="pruefung" && S.exam && S.exam.i>=S.exam.list.length) ? null : (S.cur&&S.cur.grid);
  $main.innerHTML = '<div class="cols"><aside><div class="raster">'+raster(gridSrc)+'</div>'+sideList()+'</aside>'+
    '<section>'+modeBar()+
    (S.mode==="pruefung"&&S.exam&&S.exam.i<S.exam.list.length
      ? '<div class="modebar"><span class="chip solid">Question '+(S.exam.i+1)+' of '+S.exam.list.length+'</span>'+
        '<span class="chip box">no feedback until the end</span></div>' : '')+
    body+'</section></div>';
  const inp = document.getElementById("ans");
  const pointer = !window.matchMedia || window.matchMedia("(hover: hover)").matches;
  if(inp && !S.answered && pointer) inp.focus();
  renderHud();
}

function renderRef(){
  $main.innerHTML =
  '<div class="panel"><h2>How is the case decided?</h2>'+
  '<p class="sub">Work down the list. The first rule that applies wins — you never reach step 4 if a preposition already answered the question.</p>'+
  '<h4>1 · Is there a preposition? Then it decides.</h4>'+
  '<ul class="reflist">'+
  '<li><b>Always Akkusativ:</b> <code>durch, für, gegen, ohne, um, bis, entlang</code></li>'+
  '<li><b>Always Dativ:</b> <code>aus, außer, bei, mit, nach, seit, von, zu, ab, gegenüber</code></li>'+
  '<li><b>Always Genitiv:</b> <code>wegen, während, trotz, (an)statt</code></li>'+
  '<li><b>Two-way (Wechselpräpositionen):</b> <code>an, auf, hinter, in, neben, über, unter, vor, zwischen</code></li></ul>'+
  '<p class="reflist" style="padding-left:0;list-style:none">Wechselpräpositionen take <b>Akkusativ</b> when the sentence marks a change of position — something crosses into a new place: <em>Ich gehe in die Küche.</em> They take <b>Dativ</b> for a stable position: <em>Ich bin in der Küche.</em> Movement on its own is not enough: <em>Ich jogge im Park</em> (moving around inside) vs <em>Ich jogge in den Park</em> (crossing in).</p>'+
  '<div class="note"><b>Beyond your notes</b>Some verbs come welded to a preposition, and the case is frozen: <code>warten auf</code> + Akk., <code>sich freuen auf</code> + Akk., <code>denken an</code> + Akk., <code>teilnehmen an</code> + Dat., <code>Angst haben vor</code> + Dat. Here the wohin/wo test does not apply — learn the pair as one word. These appear in the <em>feste Verbindungen</em> topic, flagged in amber.</div>'+

  '<h4>2 · Does the verb fix the case?</h4>'+
  '<ul class="reflist">'+
  '<li><b>Nominativ (linking verbs):</b> <code>sein, werden, bleiben</code> — the noun renames the subject: <em>Er ist ein guter Arzt.</em></li>'+
  '<li><b>Dative only:</b> <code>'+DAT_VERBS.join(", ")+'</code></li>'+
  '<li><b>Dativ + Akkusativ:</b> <code>'+DA_VERBS.join(", ")+'</code> — person in the Dativ, thing in the Akkusativ.</li></ul>'+

  '<h4>3 · Is it a time expression?</h4>'+
  '<ul class="reflist">'+
  '<li>Definite time or duration <b>without</b> a preposition → <b>Akkusativ</b>: <em>jeden Tag, nächste Woche, letzten Sommer, einen Monat lang</em>.</li>'+
  '<li>With <code>an, in, vor, seit, nach, ab, zu, bei</code> → <b>Dativ</b>: <em>am Montag, im Juli, vor einem Jahr, seit zwei Jahren</em>.</li></ul>'+

  '<h4>4 · Otherwise, by function</h4>'+
  '<div class="scroller"><table class="ref plain"><thead><tr><th>CASE</th><th>JOB</th><th>QUESTION</th><th>EXAMPLE</th></tr></thead><tbody>'+
  '<tr><th>Nominativ</th><td>subject</td><td>Wer? Was?</td><td>Der Mann ist mein Bruder</td></tr>'+
  '<tr><th>Akkusativ</th><td>direct object</td><td>Wen? Was?</td><td>Ich sehe den Mann</td></tr>'+
  '<tr><th>Dativ</th><td>indirect object</td><td>Wem?</td><td>Ich gebe dem Mann das Buch</td></tr>'+
  '<tr><th>Genitiv</th><td>possession, „of“</td><td>Wessen?</td><td>das Auto des Mannes</td></tr>'+
  '</tbody></table></div></div>'+

  '<div class="panel"><h2>Articles and article words</h2>'+
  '<p class="sub">Two patterns, and that is all. der-words copy the definite article exactly; ein-words copy it too, except for three bare cells.</p>'+
  '<h4>Definite article</h4>'+refTable("def","")+
  '<h4>der-words — dieser, jeder, jener, mancher, welcher, alle</h4>'+refTable("dies","dieser")+
  '<h4>Indefinite article — no plural</h4>'+refTable("ein","ein")+
  '<h4>ein-words — kein, mein, dein, sein, ihr, unser, euer, Ihr</h4>'+refTable("kein","kein")+
  '<p class="reflist" style="padding-left:0;list-style:none">The three bare cells are <b>Nominativ masculine</b> and <b>Nominativ / Akkusativ neuter</b>. <code>euer</code> drops its second <b>e</b> whenever an ending is added: <em>eurem</em>, not <s>euerem</s>.</p>'+
  refTable("euer","euer")+
  '<div class="note"><b>Correction to your notes</b>The Genitiv row of your <em>kein</em> table reads <code>manches / mancher / keines / keiner</code> — the first two cells were copied over from the <em>mancher</em> table above it. The correct row is <b>keines · keiner · keines · keiner</b>, as shown here.</div></div>'+

  '<div class="panel"><h2>Adjective endings</h2>'+
  '<p class="sub">One question decides which table: what comes in front of the adjective?</p>'+
  '<h4>After a der-word · weak</h4>'+refTable("weak","Ending")+
  '<h4>After an ein-word · mixed</h4>'+refTable("mixed","Ending")+
  '<h4>With no article · strong</h4>'+refTable("strong","Ending")+
  '<p class="reflist" style="padding-left:0;list-style:none">Shortcut worth having: <b>everything from the Dativ down is -en</b>, in the weak and mixed tables alike. The only cells you really have to think about are the top two rows.</p></div>'+

  '<div class="panel"><h2>Relative pronouns</h2>'+
  '<p class="sub">Gender and number come from the antecedent. Case comes from the job inside the relative clause. The two are decided separately.</p>'+
  refTable("rel","Relative pron.")+
  '<div class="note"><b>Correction to your notes</b>Your notes say the relative pronouns are identical to the definite articles. That holds for 14 of the 16 cells. Two exceptions:<br><br><b>Dativ Plural = denen</b> is inside B1 and is drilled normally — <em>Die Leute, denen ich vertraue</em>. Relative clauses in the Nominativ, Akkusativ and Dativ, including with prepositions, are standard telc B1 material.<br><br><b>Genitiv = dessen / deren</b> is usually catalogued at B2, not B1. It is drilled here only under Extras and marked „B2“. For telc B1 you need to recognise it in a reading text or as a Sprachbaustein distractor; you will not be asked to produce it. Do not spend October on it.</div>'+
  '<ul class="reflist">'+
  '<li><em>Der Mann, <b>der</b> dort steht</em> — masculine from <em>Mann</em>, Nominativ because it is the subject of <em>steht</em>.</li>'+
  '<li><em>Der Mann, <b>den</b> ich kenne</em> — masculine, Akkusativ as the object of <em>kenne</em>.</li>'+
  '<li><em>Der Mann, <b>dem</b> ich helfe</em> — masculine, Dativ because <em>helfen</em> takes the Dativ.</li></ul>'+
  '<p class="reflist" style="padding-left:0;list-style:none">German has no droppable all-purpose „that“. The pronoun is compulsory and inflected, the clause is subordinate so the conjugated verb goes last, and a comma always opens it: <em>Das Buch, das ich gestern gekauft <b>habe</b>, ist gut.</em></p></div>'+

  '<div class="panel"><h2>Pronouns</h2>'+
  '<h4>Personal pronouns</h4><div class="scroller"><table class="ref plain"><thead><tr><th>PERSON</th><th>AKKUSATIV</th><th>DATIV</th><th>PERSON</th><th>AKK. / DAT.</th></tr></thead><tbody>'+
  '<tr><th>ich</th><td>mich</td><td>mir</td><th>wir</th><td>uns / uns</td></tr>'+
  '<tr><th>du</th><td>dich</td><td>dir</td><th>ihr</th><td>euch / euch</td></tr>'+
  '<tr><th>er</th><td>ihn</td><td>ihm</td><th>sie (Pl.)</th><td>sie / ihnen</td></tr>'+
  '<tr><th>es</th><td>es</td><td>ihm</td><th>Sie</th><td>Sie / Ihnen</td></tr>'+
  '<tr><th>sie</th><td>sie</td><td>ihr</td><th>—</th><td>—</td></tr></tbody></table></div>'+
  '<h4>Reflexive pronouns</h4>'+
  '<p class="reflist" style="padding-left:0;list-style:none">Identical to the personal pronouns except that everything from the third person on is <b>sich</b>. Only <em>ich</em> and <em>du</em> distinguish the cases: <em>mich / mir</em>, <em>dich / dir</em>. The Dativ appears when there is already an accusative object: <em>Ich wasche <b>mich</b></em> but <em>Ich wasche <b>mir</b> die Hände</em>.</p>'+
  '<h4>Question word wer</h4><div class="scroller"><table class="ref plain"><thead><tr><th>QUESTION</th><th>NOMINATIV</th><th>AKKUSATIV</th><th>DATIV</th><th>GENITIV</th></tr></thead>'+
  '<tbody><tr><th>wer</th><td>wer</td><td>wen</td><td>wem</td><td>wessen</td></tr></tbody></table></div></div>'+

  '<div class="panel"><h2>When the noun itself changes</h2>'+
  '<ul class="reflist">'+
  '<li><b>Dativ Plural</b> adds <b>-n</b>, unless the plural already ends in <b>-n</b> or <b>-s</b>: <em>mit den Kindern, aus den Häusern</em> — but <em>mit den Autos</em>.</li>'+
  '<li><b>Genitiv masculine / neuter</b> adds <b>-s</b> or <b>-es</b>. Use <em>-es</em> after <em>-s, -ß, -z, -tsch</em> and with most one-syllable nouns: <em>des Autos, des Mannes, des Kindes</em>. Names just take <em>-s</em>: <em>Annas Auto</em>.</li>'+
  '<li><b>n-Deklination:</b> some masculine nouns take <b>-n / -en</b> in every case but the Nominativ singular — nouns in <em>-e</em> (Junge, Kunde, Kollege), in <em>-ent / -ant / -ist / -oge</em> (Student, Praktikant, Journalist, Biologe), plus <em>Herr, Mensch, Nachbar, Bauer</em>: <em>der Student → den / dem / des Studenten</em>; <em>Herr Meier → Herrn Meier</em>.</li></ul></div>'+

  '<div class="panel"><h2>Objects and word order</h2>'+
  '<div class="scroller"><table class="ref plain"><thead><tr><th>SITUATION</th><th>RULE</th><th>EXAMPLE</th></tr></thead><tbody>'+
  '<tr><th>noun + noun</th><td>Dativ before Akkusativ</td><td>Ich gebe dem Kind das Buch.</td></tr>'+
  '<tr><th>one pronoun</th><td>the pronoun goes first</td><td>Ich gebe es dem Kind. / Ich gebe ihm das Buch.</td></tr>'+
  '<tr><th>two pronouns</th><td>Akkusativ before Dativ</td><td>Ich gebe es ihm.</td></tr>'+
  '</tbody></table></div></div>';
}

/* ============================================================
   FORTSCHRITT
   ============================================================ */
function renderProg(){
  const o = overall(), st = S.stats;
  const acc = st.answered ? Math.round(st.correct/st.answered*100) : 0;
  const weak = TOPICS.filter(t=>S.extras||!t.bonus).map(t=>({t:t,s:topicStats(t.id)}))
    .filter(x=>x.s.touched>3 && x.s.acc!==null).sort((a,b)=>a.s.acc-b.s.acc).slice(0,3);
  let h = '<div class="panel"><h2>Progress</h2>'+
    '<p class="sub">Each item climbs a box every time you get it right and drops two every time you miss it. The first boxes come back within the session; box 4 is only reachable a day later, so <b>mastered</b> always means you got it right again cold. Nothing here can be mastered in one sitting.</p>'+
    '<div class="statgrid">'+
    '<div class="stat"><div class="k">Mastered</div><div class="v">'+o.pct+'<small>%</small></div></div>'+
    '<div class="stat"><div class="k">Items</div><div class="v">'+o.m+'<small>/'+o.t+'</small></div></div>'+
    '<div class="stat"><div class="k">Accuracy</div><div class="v">'+acc+'<small>%</small></div></div>'+
    '<div class="stat"><div class="k">Answered</div><div class="v">'+st.answered+'</div></div>'+
    '<div class="stat"><div class="k">Best streak</div><div class="v">'+st.best+'</div></div>'+
    '</div>';
  if(weak.length) h += '<h4>Weakest right now</h4><p class="reflist" style="padding-left:0;list-style:none">'+
    weak.map(x=>'<b>'+esc(x.t.nm)+'</b> ('+x.s.acc+'%)').join(' · ')+
    ' — pick one under <em>One topic</em> and hammer it for ten minutes.</p>';
  h += '</div><div class="panel"><h2>Topics</h2><div class="tprog">';
  TOPICS.filter(t=>S.extras||!t.bonus).forEach(t=>{
    const s = topicStats(t.id);
    const m = s.total? s.mastered/s.total*100:0;
    const l = s.total? s.learning/s.total*100:0;
    const k = s.total? (s.touched-s.mastered-s.learning)/s.total*100:0;
    h += '<div class="tp"><div class="r1"><span><span class="nm">'+esc(t.nm)+'</span> <span class="de">'+esc(t.de)+'</span></span>'+
      '<span class="num">'+s.mastered+'/'+s.total+(s.acc!==null?' · '+s.acc+'%':'')+'</span></div>'+
      '<div class="bigbar"><span class="s5" style="width:'+m+'%"></span><span class="s3" style="width:'+l+'%"></span>'+
      '<span class="s1" style="width:'+k+'%"></span></div></div>';
  });
  h += '</div><div class="legend"><span><i class="s5" style="background:var(--ok)"></i>mastered (box 4–5)</span>'+
    '<span><i class="s3" style="background:var(--m)"></i>building (box 2–3)</span>'+
    '<span><i class="s1" style="background:#9FB4C4"></i>new / shaky</span>'+
    '<span><i style="background:#DCE4E9;border:1px solid var(--rule)"></i>not seen yet</span></div>'+
    '<div class="vnext"><button class="btn ghost sm" id="resetBtn">Reset progress</button>'+
    '<span class="hintkey">'+esc(STORE.label)+'</span></div>'+
    '<h4>Move progress to another device</h4>'+
    '<p class="reflist" style="padding-left:0;list-style:none">Each place you run this keeps its own boxes — the artifact in the chat and the downloaded file do not share storage. Copy the text below to carry your progress across.</p>'+
    '<textarea class="bak" id="bak" spellcheck="false" autocomplete="off">'+esc(payload())+'</textarea>'+
    '<div class="vnext"><button class="btn ghost sm" id="copyBak">Select all</button>'+
    '<button class="btn ghost sm" id="restoreBak">Restore from text</button>'+
    (S.bakMsg?'<span class="hintkey">'+esc(S.bakMsg)+'</span>':'')+'</div></div>';
  $main.innerHTML = h;
}

function render(){
  renderTabs();
  if(S.view==="drill") renderDrill();
  else if(S.view==="tabellen"){ renderRef(); renderHud(); }
  else { renderProg(); renderHud(); }
}

/* ============================================================
   EVENTS
   ============================================================ */
function submit(given){
  if(S.answered || !S.cur) return;
  const it = S.cur;
  const right = it.kind==="mc" ? (given===it.a) : check(it,given);
  S.given = given;
  if(S.mode==="pruefung" && S.exam){
    grade(right);
    if(right) S.exam.right++; else S.exam.miss.push({q:it.q, a:it.a, g:given});
    S.exam.i++;
    S.cur = S.exam.list[S.exam.i] || null;
    S.answered = false; S.given = "";
    if(S.cur) P(S.cur.id);
    render();
    return;
  }
  S.answered = true; S.lastRight = right;
  grade(right);
  render();
}
function next(){
  if(S.mode==="pruefung") return;
  nextItem(); render();
}
function setMode(m){
  S.mode = m;
  if(m==="topic" && !S.topic) S.topic = "prep";
  S.exam = null; S.queue = []; S.cur = null; S.answered = false; S.given = "";
  if(m==="pruefung") startExam();
  render();
}

document.addEventListener("click", function(e){
  const el = e.target.closest("[data-v],[data-mode],[data-topic],[data-extras],[data-opt],[data-ins],#checkBtn,#nextBtn,#againBtn,#backBtn,#resetBtn,#copyBak,#restoreBak");
  if(!el) return;
  if(el.dataset.v){ S.view = el.dataset.v; render(); return; }
  if(el.dataset.extras!==undefined){ S.extras=!S.extras; S.queue=[]; S.cur=null; S.answered=false; if(S.mode==="pruefung") startExam(); save(); render(); return; }
  if(el.dataset.mode){ setMode(el.dataset.mode); return; }
  if(el.dataset.topic){
    S.topic = el.dataset.topic; S.view="drill";
    S.mode = "topic";
    S.exam=null; S.queue=[]; S.cur=null; S.answered=false; render(); return;
  }
  if(el.dataset.opt!==undefined){ submit(el.dataset.opt); return; }
  if(el.dataset.ins){
    const i = document.getElementById("ans");
    if(i){ const s=i.selectionStart||i.value.length; i.value = i.value.slice(0,s)+el.dataset.ins+i.value.slice(i.selectionEnd||s); i.focus(); i.selectionStart=i.selectionEnd=s+1; }
    return;
  }
  if(el.id==="checkBtn"){ const i=document.getElementById("ans"); submit(i?i.value:""); return; }
  if(el.id==="nextBtn"){ next(); return; }
  if(el.id==="againBtn"){ startExam(); render(); return; }
  if(el.id==="backBtn"){ setMode("mix"); return; }
  if(el.id==="copyBak"){
    const t = document.getElementById("bak");
    if(t){ t.focus(); t.select(); let done=false;
      try{ done = document.execCommand("copy"); }catch(e2){}
      S.bakMsg = done ? "copied to the clipboard" : "selected — copy it with Ctrl/Cmd+C";
      const keep = t.value; render();
      const t2 = document.getElementById("bak"); if(t2){ t2.value = keep; t2.focus(); t2.select(); } }
    return;
  }
  if(el.id==="restoreBak"){
    const t = document.getElementById("bak");
    try{
      const d = JSON.parse(t ? t.value : "");
      if(!d || !d.prog) throw new Error("no progress in that text");
      S.prog = {}; S.stats = {streak:0,best:0,answered:0,correct:0,day:"",dayCount:0};
      applySaved(d);
      S.queue=[]; S.cur=null; S.exam=null; S.answered=false;
      S.bakMsg = "restored — " + Object.keys(S.prog).length + " items loaded";
      save();
    }catch(e2){ S.bakMsg = "could not read that text — paste the whole line, braces included"; }
    render();
    return;
  }
  if(el.id==="resetBtn"){
    if(el.dataset.armed){
      S.prog={}; S.stats={streak:0,best:0,answered:0,correct:0,day:"",dayCount:0};
      S.queue=[]; S.cur=null; S.exam=null; S.answered=false; S.bakMsg=""; save(); render();
    }else{
      el.dataset.armed="1"; el.textContent="Sure? Click again"; el.style.borderColor="var(--no)"; el.style.color="var(--no)";
    }
    return;
  }
});

document.addEventListener("keydown", function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const inInput = e.target && e.target.tagName==="INPUT";
  if(e.key==="Enter"){
    if(S.view!=="drill") return;
    e.preventDefault();
    if(S.answered) next();
    else if(S.cur && S.cur.kind==="type"){ const i=document.getElementById("ans"); submit(i?i.value:""); }
    return;
  }
  if(e.key==="Escape" && S.view==="drill" && S.mode!=="pruefung"){ e.preventDefault(); next(); return; }
  if(inInput) return;
  if(/^[1-9]$/.test(e.key) && S.view==="drill" && !S.answered && S.cur && S.cur.kind==="mc"){
    const b = document.querySelectorAll(".choices .ch");
    const n = parseInt(e.key,10)-1;
    if(b[n]){ e.preventDefault(); b[n].click(); }
  }
});

/* ---- go ---- */
(async function init(){
  await load();
  render();
})();
</script>
