<style>
/* Layout: one reading column like an exam answer booklet; sticky tab rail; A–D answer-sheet bubbles as the recurring motif */
:root{
  --paper:#ffffff; --card:#ffffff; --ink:#111111; --muted:#5f5f5f; --line:#e2e2e2;
  --pen:#111111; --pen-soft:#f1f1f1; --markbg:#e8e8e8; --markfg:#111111;
  --ok:#2e7d4f; --ok-soft:#eef6f0; --warn:#8a6a2e; --warn-soft:#f7f2e6; --bad:#b0443d; --bad-soft:#f9ecea;
  color-scheme:light;
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.65 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.brand h1{font:700 1.25rem/1.2 var(--f-display);margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--pen)}
.meter{display:flex;align-items:center;gap:8px;font:600 .8rem var(--f-mono);color:var(--muted)}
.bar{width:120px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font:600 .9rem var(--f-display);padding:6px 12px;border-radius:99px}
nav.tabs a.on{background:var(--pen-soft);color:var(--pen)}
nav.tabs a:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
main{padding-block:24px 80px}
h2{font:700 1.7rem/1.2 var(--f-display);margin:0 0 6px;text-wrap:balance;letter-spacing:-.015em}
h3{font:700 1.2rem/1.3 var(--f-display);margin:28px 0 8px;text-wrap:balance}
h4{font:600 1rem var(--f-display);margin:16px 0 6px}
p{margin:0 0 12px;max-width:68ch}
.lead{color:var(--muted);font-size:1.05rem}
.eyebrow{font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--pen)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid2>*{min-width:0}
.de{font-weight:700}
.en{color:var(--muted)}
.note{font-size:.88rem;color:var(--muted)}
mark{background:var(--markbg);color:var(--markfg);padding:0 2px;border-radius:3px}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .78rem var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,.btn{font:600 .9rem var(--f-display);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary,.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--card)}
button:hover,.btn:hover{border-color:var(--pen)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font:600 .72rem var(--f-mono);padding:2px 8px;border-radius:99px;background:var(--pen-soft);color:var(--pen);letter-spacing:.03em}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
/* plan */
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dayhead h3{margin:0}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 18px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.done .lbl{text-decoration:line-through;color:var(--muted)}
.item .lbl{min-width:0}
.item a{color:var(--pen);font-weight:700;text-decoration:none;white-space:nowrap}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--pen);background:transparent;padding:0;justify-content:center}
.tick.on{background:var(--pen)}
.tick.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--card)}
.next{outline:2px solid var(--pen);outline-offset:-2px;background:var(--pen-soft)}
/* bubbles */
.bub{display:inline-flex;gap:6px}
.bub button{width:34px;height:34px;border-radius:50%;padding:0;justify-content:center;border:2px solid var(--pen);color:var(--pen);font:700 .85rem var(--f-mono)}
.bub button.on{background:var(--pen);color:var(--card)}
.scoreline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.big{font:700 2rem var(--f-display)}
/* quiz */
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.q .stem{font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opts button{justify-content:flex-start;text-align:left;font:400 .95rem var(--f-body);white-space:normal}
.opts button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opts button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.expl{margin-top:8px;font-size:.9rem;padding:8px 10px;border-radius:8px;background:var(--pen-soft)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
summary{cursor:pointer;padding:12px 16px;font:600 1rem var(--f-display)}
details>div{padding:0 16px 14px}
.ph{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:4px 14px;padding:8px 0;border-top:1px solid var(--line)}
.ph .n{grid-column:1/-1;font-size:.84rem;color:var(--warn)}
@media (max-width:560px){.ph{grid-template-columns:1fr}}
/* flashcards */
.fc{background:var(--card);border:2px solid var(--pen);border-radius:14px;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;cursor:pointer;width:100%;font:inherit;color:inherit}
.fc .w{font:700 1.6rem/1.2 var(--f-display)}
.fc .m{font-size:1.1rem;margin-top:8px}
.fc .x{color:var(--muted);margin-top:8px;font-size:.92rem}
/* email / studio */
.mail{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mailhead{padding:10px 16px;border-bottom:1px solid var(--line);font:400 .85rem var(--f-mono);color:var(--muted)}
.mailbody{padding:14px 16px;white-space:pre-wrap}
.lp{list-style:none;padding:0;margin:8px 0}
.lp li{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:6px 0;align-items:start}
textarea,input[type=text]{width:100%;font:16px/1.6 var(--f-body);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea.writing{min-height:360px;font-size:17px}
.timer{font:700 1.6rem var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.find{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.model{white-space:pre-wrap;line-height:1.7}
.tasklist{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.task{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.task:hover{border-color:var(--pen)}
.task b{font-family:var(--f-display)}
.order button{display:block;width:100%;text-align:left;margin:6px 0;font:400 .95rem var(--f-body);white-space:normal;justify-content:flex-start}
.order .placed{background:var(--pen-soft);border-color:var(--pen)}
.banner{padding:10px 14px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-weight:700;margin:8px 0}
.callout{border-left:4px solid var(--pen);padding:10px 14px;background:var(--pen-soft);border-radius:0 10px 10px 0;margin:12px 0}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
@media (prefers-reduced-motion:no-preference){.opts button,.tick,.bub button{transition:background .15s,border-color .15s}}
</style>

<script>
/* ===================== CONTENT ===================== */
const TABS=[["plan","5-Tage-Plan"],["exam","Die Prüfung"],["parts","Bausteine"],["phrases","Redemittel"],["grammar","Grammatik"],["words","Wörter"],["drills","Übungen"],["studio","Schreiben"]];

const PLAN=[
 {d:1,t:"Know the target",items:[
  ["d1a","Exam briefing: format, scoring, what counts as a Leitpunkt. Try the score calculator.",15,"exam"],
  ["d1b","Components 1–3: Betreff, Anrede, Einleitung. Learn the rules and phrases.",20,"parts"],
  ["d1c","Quiz: E-Mail components",5,"parts"],
  ["d1d","Drill: du vs. Sie (register)",15,"drills"],
  ["d1e","Grammar 1: word order (verb position) + quiz",25,"grammar"],
  ["d1f","Vocabulary: task-instruction words (deck 1)",15,"words"],
  ["d1g","Write Task 1 without a timer, run the check, then study the model",25,"task-1"]]},
 {d:2,t:"Leitpunkte and linking",items:[
  ["d2a","Components 4–6: Hauptteil, Schluss, Gruß + Leitpunkt pronoun drill",20,"parts"],
  ["d2b","Connectors table + connector drill",20,"drills"],
  ["d2c","Redemittel: thanking, suggesting, advice, accepting/declining, asking",25,"phrases"],
  ["d2d","Grammar 2: Perfekt (haben/sein, participles) + quiz",25,"grammar"],
  ["d2e","Vocabulary: Reise & Besuch, Feiern & Einladungen",10,"words"],
  ["d2f","Write Task 7 (semi-formal) and compare with the model",20,"task-7"]]},
 {d:3,t:"Accuracy",items:[
  ["d3a","Grammar 3: cases, prepositions, gender shortcuts + quiz",30,"grammar"],
  ["d3b","Grammar 4: polite forms (Konjunktiv II) and zu + infinitive + quiz",15,"grammar"],
  ["d3c","Leitpunkt sprint: first 13 points",20,"drills"],
  ["d3d","Error hunt drill",15,"drills"],
  ["d3e","TIMED: Task 3 in 30 minutes, then check and self-score",40,"task-3"]]},
 {d:4,t:"Exam speed",items:[
  ["d4a","Vocabulary: Wohnung, Kurs & Arbeit, Probleme",15,"words"],
  ["d4b","Ordering drill (both e-mails)",10,"drills"],
  ["d4c","TIMED: Task 8 (semi-formal) + check + self-score",40,"task-8"],
  ["d4d","TIMED: Task 6 (past tense report) + check + self-score",40,"task-6"],
  ["d4e","Redo the quiz with your lowest score",15,"grammar"]]},
 {d:5,t:"Dress rehearsal",items:[
  ["d5a","Write both skeletons from memory and compare",20,"parts"],
  ["d5b","Leitpunkt sprint: remaining points",15,"drills"],
  ["d5c","MOCK EXAM: Task 12 under exam rules (no help, 30 min) + check",45,"task-12"],
  ["d5d","MOCK EXAM: Task 2 (30 min) + check, then read the exam-day checklist",40,"task-2"]]}
];

/* ---------- Components ---------- */
const PARTS=[
 {n:"Betreff",en:"subject line",what:"One short line naming the topic. The task asks for a suitable Betreff, so always write one. A noun phrase is enough; no full sentence needed.",
  rules:["Start with <b>Re:</b> or <b>AW:</b> (Antwort) when you reply, then the topic.","Keep it under 6 words.","Nouns keep their capital letters."],
  ph:[["Re: Dein Besuch in Berlin","Re: Your visit to Berlin"],["Re: Deine Einladung","Re: Your invitation"],["Unser Kursabschlussfest","Our end-of-course party"],["Termin für die Reparatur","Appointment for the repair"],["Ihre E-Mail vom 3. März","Your e-mail of 3 March"]]},
 {n:"Anrede",en:"salutation",what:"Copy the tone of the e-mail you received. A friend who writes „Hallo“ or „Liebe …“ gets du. A teacher, landlord, office or company gets Sie.",
  rules:["Female name: <b>Liebe</b> Anna, … Male name: <b>Lieber</b> Tom, …","Formal: <b>Sehr geehrte</b> Frau Becker, / <b>Sehr geehrter</b> Herr Schulz,","Unknown person or office: <b>Sehr geehrte Damen und Herren,</b>","Friendly but polite (teacher, neighbour): <b>Liebe Frau Wagner,</b> / <b>Lieber Herr Meier,</b> (still Sie!)","After the comma, the next line starts with a <b>small letter</b>: „Liebe Anna,<br>vielen Dank …“. Nouns stay capital: „herzlichen Glückwunsch“ but „Danke“ → „danke“."],
  ph:[["Liebe Sara, / Lieber Jonas,","Dear Sara / Dear Jonas (friend)"],["Hallo Tim,","Hi Tim (friend, casual)"],["Liebe Frau Becker,","Dear Ms Becker (polite, warm, Sie)"],["Sehr geehrter Herr Schulz,","Dear Mr Schulz (formal)"],["Sehr geehrte Damen und Herren,","Dear Sir or Madam (unknown)"]]},
 {n:"Einleitung",en:"introduction",what:"1–2 sentences: thank them and react to their news. This is where you show you read the e-mail.",
  rules:["Thank + react: „vielen Dank für deine E-Mail. Ich habe mich sehr gefreut, von dir zu hören.“","Do not start with a Leitpunkt straight away. Do not write your life story either."],
  ph:[["vielen Dank für deine E-Mail!","thank you very much for your e-mail!"],["ich habe mich sehr über deine Nachricht gefreut.","I was very happy about your message."],["schön, von dir zu hören!","nice to hear from you!"],["entschuldige bitte, dass ich erst jetzt antworte.","sorry that I'm only answering now."],["vielen Dank für Ihre E-Mail und die Informationen.","thank you for your e-mail and the information. (Sie)"],["gern beantworte ich Ihre Fragen.","I'm happy to answer your questions. (Sie)"]]},
 {n:"Hauptteil",en:"main part — the 4 Leitpunkte",what:"Answer all four Leitpunkte. Each one = 2–3 sentences: answer + reason (weil/denn) + one detail. Choose a logical order; the given order is not required. Link them with transition words so they don't stand alone.",
  rules:["<b>Pronoun switch:</b> the Leitpunkte are written to <i>you</i> as the candidate. „Sie“ in a Leitpunkt = YOU → write „ich“. „er/sie“ = your friend → write „du“ to them.","Example: Leitpunkt „was er mitbringen soll“ → in your mail: „<b>Bring</b> bitte bequeme Schuhe <b>mit</b>.“","One short sentence officially counts, but 2–3 sentences earn points in criteria II and III.","You may say no or make a counter-proposal: that still counts.","If a Leitpunkt is plural („welche Ausflüge“), one example is enough.","Start sentences with different words. Not „Ich … Ich … Ich …“."],
  ph:[["Zuerst zu deiner Frage nach …","First, about your question regarding … (+ Dat)"],["Was … betrifft, …","As far as … is concerned, … (verb next)"],["Du hast gefragt, wann … Am besten …","You asked when … It's best …"],["Außerdem …","Besides / also … (verb next)"],["Übrigens …","By the way … (verb next)"],["Zum Schluss noch eine Frage: …","Finally, one more question: …"]]},
 {n:"Schluss",en:"closing sentence",what:"One sentence that ends the conversation politely: looking forward, asking for an answer, or wishing something.",
  rules:["„Ich freue mich auf …“ + Akk (the future thing). „Ich freue mich über …“ = happy about something you got.","Formal: no imperatives like „Schreib mir!“; use „Ich freue mich auf Ihre Antwort.“"],
  ph:[["Ich freue mich schon auf deine Antwort.","I'm looking forward to your reply."],["Ich freue mich auf dich / auf deinen Besuch!","I'm looking forward to seeing you / your visit!"],["Schreib mir bald!","Write to me soon! (du)"],["Melde dich, wenn du noch Fragen hast.","Get in touch if you have more questions."],["Ich freue mich auf Ihre Antwort.","I look forward to your reply. (Sie)"],["Vielen Dank im Voraus.","Thank you in advance. (Sie)"]]},
 {n:"Gruß + Name",en:"sign-off + name",what:"Greeting formula on its own line, NO comma after it, then your name on the next line.",
  rules:["Informal: Viele Grüße / Liebe Grüße / Herzliche Grüße / Bis bald + first name.","Formal: Mit freundlichen Grüßen + first and last name.","If a polite sender signed „Viele Grüße“, you may answer with „Viele Grüße“ too.","No comma: „Mit freundlichen Grüßen“ ⏎ „Elvis Nnajiofor“. (English puts a comma; German does not.)"],
  ph:[["Liebe Grüße","Love / best wishes (friend)"],["Viele Grüße","Best regards (friend or polite)"],["Herzliche Grüße","Warm regards"],["Mit freundlichen Grüßen","Yours sincerely (formal)"]]}
];

const SKELETONS={
 du:`Betreff: Re: [Thema]

Liebe [Name], / Lieber [Name],

vielen Dank für deine E-Mail! Ich habe mich sehr gefreut, von dir zu hören.

Zuerst zu deiner Frage nach [Leitpunkt 1]: … , weil …
Was [Leitpunkt 2] betrifft, … Ich finde, dass …
Außerdem [Leitpunkt 3] … Deshalb …
Zum Schluss noch [Leitpunkt 4]: Ich schlage vor, dass wir …

Ich freue mich schon auf deine Antwort!

Liebe Grüße
[Vorname]`,
 sie:`Betreff: [Thema]

Sehr geehrte Frau [Name], / Sehr geehrter Herr [Name], / Sehr geehrte Damen und Herren,

vielen Dank für Ihre E-Mail. Gern beantworte ich Ihre Fragen.

Zuerst zu [Leitpunkt 1]: … , weil …
Was [Leitpunkt 2] betrifft, …
Außerdem möchte ich Sie fragen, ob …
Zum Schluss hätte ich noch eine Bitte: Könnten Sie mir bitte …?

Ich freue mich auf Ihre Antwort.

Mit freundlichen Grüßen
[Vorname Nachname]`
};

/* ---------- Phrase bank ---------- */
const PHRASES=[
 {c:"Sich bedanken · thanking",p:[
  ["Vielen Dank für deine E-Mail / deine Einladung.","Thanks a lot for your e-mail / your invitation.","für + Akkusativ: deine (die E-Mail), deinen (der Brief), dein (das Geschenk)"],
  ["Danke, dass du an mich gedacht hast.","Thanks for thinking of me.","dass → verb at the end"],
  ["Herzlichen Dank für Ihre schnelle Antwort.","Many thanks for your quick reply.",""],
  ["Ich möchte mich bei Ihnen für … bedanken.","I'd like to thank you for …","sich bedanken bei (person) für (thing)"]]},
 {c:"Freude & Bedauern · joy & regret",p:[
  ["Ich habe mich sehr über deine Nachricht gefreut.","I was very happy about your message.","sich freuen über = about something now/past"],
  ["Ich freue mich schon auf das Wochenende.","I'm already looking forward to the weekend.","sich freuen auf = future"],
  ["Es tut mir wirklich leid, dass …","I'm really sorry that …","verb at the end"],
  ["Schade, dass wir uns nicht sehen können.","A pity we can't see each other.",""],
  ["Leider kann ich nicht kommen, weil …","Unfortunately I can't come because …","Leider → verb comes next: Leider kann ich …"]]},
 {c:"Sich entschuldigen · apologising",p:[
  ["Entschuldige bitte, dass ich so spät antworte.","Sorry for replying so late. (du)",""],
  ["Entschuldigen Sie bitte, dass ich gestern nicht gekommen bin.","Please excuse me for not coming yesterday. (Sie)","Perfekt in dass-clause: gekommen bin at the end"],
  ["Ich möchte mich für das Missverständnis entschuldigen.","I'd like to apologise for the misunderstanding.",""]]},
 {c:"Gratulieren · congratulating",p:[
  ["Herzlichen Glückwunsch zum Geburtstag / zur Hochzeit!","Happy birthday / Congratulations on your wedding!","zu + Dativ: zum (der/das), zur (die)"],
  ["Ich gratuliere dir zu deiner neuen Stelle!","Congratulations on your new job!","gratulieren + Dativ (dir, Ihnen)"],
  ["Ich wünsche dir / euch alles Gute!","I wish you all the best!",""]]},
 {c:"Zusagen & absagen · accepting & declining",p:[
  ["Ich komme sehr gern!","I'd love to come!",""],
  ["Natürlich bin ich dabei.","Of course I'm in.","dabei sein = to be part of it"],
  ["Ich nehme gern an der Feier teil.","I'm happy to take part in the party.","teilnehmen an + Dativ"],
  ["Leider muss ich absagen, weil ich an dem Tag arbeiten muss.","Unfortunately I have to decline because I have to work that day.",""],
  ["Das passt mir leider nicht so gut.","That doesn't really suit me, unfortunately.","passen + Dativ (mir)"]]},
 {c:"Vorschlagen · suggesting",p:[
  ["Ich schlage vor, dass wir zusammen ins Kino gehen.","I suggest that we go to the cinema together.","dass → verb last"],
  ["Wie wäre es mit einem Picknick im Park?","How about a picnic in the park?","mit + Dativ"],
  ["Wir könnten am Samstag nach Potsdam fahren.","We could go to Potsdam on Saturday.","könnten + infinitive at the end"],
  ["Hast du Lust, mit mir Fahrrad zu fahren?","Do you feel like cycling with me?","Lust haben, … zu + infinitive"],
  ["Was hältst du davon, wenn wir zu Hause kochen?","What do you think about us cooking at home?",""],

const GRAMMAR=[
 {id:"g1",t:"1 · Word order: where the verb goes",html:`
<p>German sentences have a fixed slot for the verb. Getting this right is the biggest single gain in criterion III.</p>
<div class="tbl"><table><tr><th>Rule</th><th>Example</th><th>Meaning</th></tr>
<tr><td>Main clause: conjugated verb is <b>2nd element</b></td><td>Ich <u>habe</u> am Samstag Zeit.</td><td>I have time on Saturday.</td></tr>
<tr><td>Something else first → verb stays 2nd, subject moves behind (Inversion)</td><td>Am Samstag <u>habe</u> ich Zeit.</td><td>On Saturday I have time.</td></tr>
<tr><td>Modal verb 2nd, infinitive at the <b>end</b></td><td>Ich <u>kann</u> leider nicht <u>kommen</u>.</td><td>Unfortunately I can't come.</td></tr>
<tr><td>Perfekt: haben/sein 2nd, participle at the <b>end</b></td><td>Wir <u>sind</u> nach Hamburg <u>gefahren</u>.</td><td>We went to Hamburg.</td></tr>
<tr><td>Separable verb: prefix at the <b>end</b></td><td>Ich <u>rufe</u> dich morgen <u>an</u>.</td><td>I'll call you tomorrow.</td></tr>
<tr><td>Subordinate clause (weil, dass, wenn, ob…): verb <b>last</b></td><td>…, weil ich morgen arbeiten <u>muss</u>.</td><td>… because I have to work tomorrow.</td></tr>
<tr><td>Subordinate clause first → main verb comes right after the comma</td><td>Wenn du Zeit hast, <u>besuchen</u> wir dich.</td><td>If you have time, we'll visit you.</td></tr>
<tr><td>Indirect question: verb last</td><td>Kannst du mir sagen, wann der Kurs <u>beginnt</u>?</td><td>Can you tell me when the course starts?</td></tr>
</table></div>
<div class="callout">Memory trick: <b>Position 2</b> in main clauses, <b>END</b> after weil/dass/wenn/ob. Everything else is a frame (Satzklammer): verb 2 … rest … infinitive/participle/prefix at the end.</div>`},
 {id:"g2",t:"2 · Perfekt: talking about the past",html:`
<p>In e-mails you report the past with <b>haben/sein + participle</b>. Only <b>sein, haben</b> and the modal verbs are usually in Präteritum: <b>war, hatte, konnte, musste, wollte, durfte, sollte</b>.</p>
<h4>haben or sein?</h4>
<p><b>sein</b> for movement from A to B and change of state: gehen, fahren, fliegen, kommen, laufen, reisen, umziehen, ankommen, aufstehen, einschlafen, werden, passieren — plus <b>sein</b> and <b>bleiben</b>. Everything else: <b>haben</b>.</p>
<h4>Building the participle</h4>
<div class="tbl"><table><tr><th>Type</th><th>Pattern</th><th>Examples</th></tr>
<tr><td>Regular</td><td>ge- … -t</td><td>machen → gemacht, kaufen → gekauft, arbeiten → gearbeitet, wohnen → gewohnt</td></tr>
<tr><td>Ends in -ieren</td><td>no ge-</td><td>telefonieren → telefoniert, studieren → studiert, passieren → passiert</td></tr>
<tr><td>Inseparable be-, ver-, er-, ent-, ge-, emp-</td><td>no ge-</td><td>besuchen → besucht, erzählen → erzählt, verstehen → verstanden, bekommen → bekommen</td></tr>
<tr><td>Separable</td><td>prefix + ge + …</td><td>einkaufen → eingekauft, anrufen → angerufen, mitbringen → mitgebracht, einladen → eingeladen</td></tr>
</table></div>
<h4>The 40 participles you need (s = with sein)</h4>
<div class="tbl"><table><tr><th>Infinitive</th><th>Participle</th><th>Meaning</th></tr>${[
["sein","gewesen (s)","be"],["haben","gehabt","have"],["werden","geworden (s)","become"],["gehen","gegangen (s)","go"],["kommen","gekommen (s)","come"],["fahren","gefahren (s)","drive/travel"],["fliegen","geflogen (s)","fly"],["bleiben","geblieben (s)","stay"],["laufen","gelaufen (s)","run/walk"],["umziehen","umgezogen (s)","move house"],["ankommen","angekommen (s)","arrive"],["aufstehen","aufgestanden (s)","get up"],["passieren","passiert (s)","happen"],["essen","gegessen","eat"],["trinken","getrunken","drink"],["sehen","gesehen","see"],["lesen","gelesen","read"],["schreiben","geschrieben","write"],["sprechen","gesprochen","speak"],["treffen","getroffen","meet"],["finden","gefunden","find"],["nehmen","genommen","take"],["geben","gegeben","give"],["helfen","geholfen","help"],["schlafen","geschlafen","sleep"],["bekommen","bekommen","receive"],["vergessen","vergessen","forget"],["verstehen","verstanden","understand"],["beginnen","begonnen","begin"],["anfangen","angefangen","start"],["anrufen","angerufen","phone"],["einladen","eingeladen","invite"],["mitbringen","mitgebracht","bring along"],["bringen","gebracht","bring"],["denken","gedacht","think"],["wissen","gewusst","know"],["kennen","gekannt","know (person)"],["gefallen","gefallen","please/like"],["tun","getan","do"],["stehen","gestanden","stand"]].map(r=>`<tr><td>${r[0]}</td><td class="de">${r[1]}</td><td class="en">${r[2]}</td></tr>`).join("")}</table></div>`},
 {id:"g3",t:"3 · Cases, prepositions and gender shortcuts",html:`
<div class="callout">Good news from the official rating guide: <b>ending and gender mistakes count less</b> than mistakes that block understanding (like wrong verb agreement). So don't freeze on der/die/das — but learn the fixed phrases below by heart.</div>
<div class="tbl"><table><tr><th></th><th>der (m)</th><th>die (f)</th><th>das (n)</th><th>die (pl)</th></tr>
<tr><td><b>Nominativ</b> (subject)</td><td>der / ein / mein</td><td>die / eine / meine</td><td>das / ein / mein</td><td>die / – / meine</td></tr>
<tr><td><b>Akkusativ</b> (object)</td><td><mark>den / einen / meinen</mark></td><td>die / eine / meine</td><td>das / ein / mein</td><td>die / – / meine</td></tr>
<tr><td><b>Dativ</b> (to/with)</td><td>dem / einem / meinem</td><td>der / einer / meiner</td><td>dem / einem / meinem</td><td>den …<b>n</b> / meinen …n</td></tr></table></div>
<p class="note">Only masculine changes in Akkusativ. Dativ plural adds -n to the noun: mit meinen Freunde<b>n</b>, seit zwei Jahre<b>n</b>.</p>
<h4>Prepositions</h4>
<div class="tbl"><table><tr><th>Case</th><th>Prepositions</th><th>Fixed phrases</th></tr>
<tr><td>Akkusativ</td><td>für, ohne, gegen, durch, um</td><td>Danke für <b>deinen</b> Brief / <b>deine</b> E-Mail / <b>dein</b> Geschenk · um 15 Uhr</td></tr>
<tr><td>Dativ</td><td>mit, bei, nach, von, zu, aus, seit, gegenüber</td><td>mit <b>dem</b> Zug · bei mir · <b>zum</b> Bahnhof · <b>zur</b> Arbeit · seit einem Jahr · nach Hause (going) · zu Hause (being)</td></tr>
<tr><td>Wechsel: Wohin? → Akk · Wo? → Dat</td><td>in, an, auf, über, unter, vor, hinter, neben, zwischen</td><td>Ich gehe <b>in die</b> Stadt (wohin) · Ich bin <b>in der</b> Stadt (wo) · ins Kino · im Kino · am Bahnhof</td></tr></table></div>
<h4>Verbs that take Dativ (dir, mir, Ihnen)</h4>
<p>helfen, danken, gefallen, gratulieren, antworten, passen, schmecken, gehören: Ich helfe <b>dir</b>. Das gefällt <b>mir</b>. Ich gratuliere <b>Ihnen</b>.</p>
<h4>Gender shortcuts</h4>
<div class="tbl"><table><tr><th>die</th><th>das</th><th>der</th></tr>
<tr><td>-ung, -heit, -keit, -schaft, -ion, -tät, -ie: die Einladung, die Information, die Party</td><td>-chen, -ment, -um, infinitives as nouns: das Mädchen, das Zentrum, das Essen</td><td>days, months, seasons, -er persons, -ismus: der Montag, der Mai, der Sommer, der Lehrer</td></tr></table></div>
<p><b>Exam nouns:</b> die E-Mail · die Nachricht · die Einladung · die Reise · die Wohnung · die Feier · die Party · die Hochzeit · die Frage · die Antwort · die Idee · die Heizung · die Kleidung · die Jahreszeit — der Besuch · der Termin · der Kurs · der Urlaub · der Vorschlag · der Geburtstag · der Umzug · der Schlüssel · der Ausflug · der Zug — das Wochenende · das Geschenk · das Fest · das Wetter · das Problem · das Zimmer · das Hotel · das Essen</p>
<p class="note">Escape trick: if you don't know the gender, use the plural (die Geschenke) or a possessive with a stable form (meine/deine work for feminine and plural).</p>`},
 {id:"g4",t:"4 · Polite forms and zu + infinitive",html:`
<p>Konjunktiv II makes requests and suggestions polite. You only need four forms:</p>
<div class="tbl"><table><tr><th>Form</th><th>Use</th><th>Example</th></tr>
<tr><td>würde + infinitive</td><td>would</td><td>An deiner Stelle <b>würde</b> ich früh buchen.</td></tr>
<tr><td>hätte</td><td>would have / I'd like</td><td>Ich <b>hätte</b> gern einen Termin.</td></tr>
<tr><td>wäre</td><td>would be</td><td>Es <b>wäre</b> schön, wenn du kommst. · <b>Wäre</b> es möglich, …?</td></tr>
<tr><td>könnte</td><td>could</td><td><b>Könnten</b> Sie mir bitte helfen? · Wir <b>könnten</b> ins Kino gehen.</td></tr>
<tr><td>sollte</td><td>should (advice)</td><td>Du <b>solltest</b> eine Jacke mitnehmen.</td></tr></table></div>
<h4>zu + infinitive (at the end)</h4>
<p>After: Lust haben · Zeit haben · vergessen · versuchen · vorhaben · empfehlen · Es ist wichtig/schön … → Ich habe Lust, ins Kino <b>zu gehen</b>. Separable verbs put zu in the middle: mit<b>zu</b>bringen, an<b>zu</b>rufen, ein<b>zu</b>kaufen.</p>
<h4>Imperative (instructions & tips)</h4>
<div class="tbl"><table><tr><th>du</th><th>ihr</th><th>Sie</th></tr>
<tr><td>Komm! Schreib mir! Bring … mit! Vergiss nicht …!</td><td>Kommt! Schreibt mir!</td><td>Kommen Sie! Schreiben Sie mir bitte!</td></tr></table></div>`}

 {id:1,reg:"du",to:"Jonas",g:"m",title:"Besuch in Berlin",from:"Jonas",sit:"Sie haben von Ihrem Freund Jonas folgende E-Mail erhalten.",sitEn:"You have received the following e-mail from your friend Jonas.",
  mail:"Hallo,\nstell dir vor: Ich habe endlich Urlaub und möchte dich in Berlin besuchen! Ich war noch nie in Berlin. Wann passt es dir am besten? Und was können wir zusammen machen? Ich weiß auch noch nicht, ob ich ein Hotel buchen soll. Gibt es noch etwas, das ich wissen muss?\nSchreib mir bald!\nViele Grüße\nJonas",
  lp:[["wann der Besuch am besten passt","when the visit suits best"],["was Sie zusammen unternehmen können","what you can do together"],["wo Jonas schlafen kann","where Jonas can sleep"],["was er mitbringen soll","what he should bring"]],
  model:"Betreff: Re: Mein Besuch in Berlin\n\nLieber Jonas,\n\nvielen Dank für deine E-Mail! Ich freue mich sehr, dass du mich besuchen möchtest.\n\nAm besten kommst du im Mai, denn dann ist das Wetter schön und es ist noch nicht so heiß. Im Dezember habe ich leider viel Arbeit.\n\nNatürlich musst du kein Hotel buchen. Meine Wohnung ist zwar nicht groß, aber im Wohnzimmer steht ein bequemes Sofa. Dort kannst du gern schlafen.\n\nIn Berlin gibt es viel zu sehen. Ich schlage vor, dass wir zuerst eine Stadtrundfahrt machen. Danach könnten wir ins Museum gehen oder abends in ein gutes Restaurant.\n\nAußerdem solltest du bequeme Schuhe mitbringen, weil wir viel zu Fuß gehen werden. Vergiss auch deinen Regenschirm nicht!\n\nIch freue mich schon auf dich!\n\nLiebe Grüße\n[Name]",
  en:"Dear Jonas, thank you very much for your e-mail! I'm really happy that you want to visit me. It's best if you come in May, because the weather is nice then and it's not so hot yet. In December I unfortunately have a lot of work. Of course you don't need to book a hotel. My flat isn't big, but there's a comfortable sofa in the living room. You're welcome to sleep there. There's a lot to see in Berlin. I suggest that we do a city tour first. After that we could go to a museum, or to a good restaurant in the evening. Also, you should bring comfortable shoes, because we'll walk a lot. Don't forget your umbrella either! I'm looking forward to seeing you! Love, [Name]",
  words:[["zwar … aber","admittedly … but"],["bequem","comfortable"],["die Stadtrundfahrt","city tour"],["zu Fuß gehen","to walk"],["der Regenschirm","umbrella"],["Vergiss … nicht!","Don't forget …!"]],
  note:"The order was changed on purpose (when → sleeping → activities → bring). Each point has a reason (denn, weil) or detail."},
 {id:2,reg:"du",to:"Sara",g:"f",title:"Hochzeit — absagen",from:"Sara",sit:"Sie haben von Ihrer Freundin Sara folgende E-Mail erhalten.",sitEn:"You have received the following e-mail from your friend Sara.",
  mail:"Hallo,\nich habe tolle Neuigkeiten: Max und ich heiraten am 14. Juni! Wir feiern in einem kleinen Restaurant am See und würden uns sehr freuen, wenn du kommst. Kannst du mir bis Ende Mai sagen, ob du dabei bist?\nLiebe Grüße\nSara",
  lp:[["Glückwünsche zur Hochzeit","congratulations on the wedding"],["warum Sie nicht kommen können","why you can't come"],["was Sie als Geschenk schicken","what you send as a present"],["wann Sie das Paar besuchen können","when you can visit the couple"]],
  model:"Betreff: Re: Eure Hochzeit\n\nLiebe Sara,\n\nherzlichen Glückwunsch! Ich habe mich riesig über deine Nachricht gefreut. Max und du, ihr seid wirklich ein tolles Paar.\n\nLeider kann ich am 14. Juni nicht kommen, weil meine Schwester an diesem Wochenende ihr Baby bekommt. Ich habe ihr versprochen, dass ich bei ihr bin. Das tut mir wirklich leid!\n\nTrotzdem möchte ich euch etwas schenken. Ich schicke euch ein Paket mit einem Gutschein für ein schönes Abendessen. Ich hoffe, die Idee gefällt euch.\n\nWie wäre es, wenn ich euch im Juli besuche? Dann können wir zusammen die Hochzeitsfotos ansehen und ihr erzählt mir alles.\n\nIch wünsche euch einen wunderschönen Tag!\n\nViele liebe Grüße\n[Name]",
  en:"Dear Sara, congratulations! I was thrilled about your message. Max and you are a really great couple. Unfortunately I can't come on 14 June because my sister is having her baby that weekend. I promised her I'd be with her. I'm really sorry! Still, I'd like to give you something. I'm sending you a parcel with a voucher for a nice dinner. I hope you like the idea. How about I visit you in July? Then we can look at the wedding photos together and you can tell me everything. I wish you a wonderful day! Lots of love, [Name]",

  note:"Two people → euch/ihr when you mean the couple. Declining still fulfils the point."},

  mail:"Hi,\nwie geht's? Ich habe endlich eine neue Wohnung gefunden! Am Samstag, den 3. Mai, ziehe ich um. Kannst du mir vielleicht helfen? Ich habe leider kein Auto und so viele Kisten … Und du bist doch letztes Jahr auch umgezogen. Hast du ein paar Tipps für mich?\nViele Grüße\nTim",
  lp:[["ob und wann Sie helfen können","whether and when you can help"],["wie man die Kisten transportieren kann","how the boxes can be transported"],["Ihre Erfahrungen mit Ihrem Umzug","your experience with your own move"],["Tipps für den Umzug","tips for the move"]],
  model:"Betreff: Re: Dein Umzug\n\nLieber Tim,\n\nsuper, dass du eine neue Wohnung gefunden hast! Herzlichen Glückwunsch!\n\nNatürlich helfe ich dir. Am Samstagvormittag habe ich leider einen Termin, aber ab 13 Uhr bin ich frei.\n\nMein Bruder hat einen großen Transporter. Ich frage ihn, ob wir das Auto am Samstag nehmen können. Dann müssen wir nur einmal fahren.\n\nMein Umzug letztes Jahr war ziemlich anstrengend. Ich habe zu spät mit dem Packen angefangen und am Ende hatte ich viel Stress. Deshalb solltest du schon jetzt Kisten packen und auf jede Kiste das Zimmer schreiben. Außerdem musst du dich nach dem Umzug beim Bürgeramt anmelden.\n\nBis Samstag!\n\nViele Grüße\n[Name]",
  en:"Dear Tim, great that you've found a new flat! Congratulations! Of course I'll help you. On Saturday morning I unfortunately have an appointment, but from 1 pm I'm free. My brother has a big van. I'll ask him whether we can take the car on Saturday. Then we only have to drive once. My move last year was quite exhausting. I started packing too late and at the end I was very stressed. That's why you should pack boxes now and write the room on each box. Also, after the move you have to register at the citizens' office. See you Saturday! Best, [Name]",
  words:[["der Transporter","van"],["ob","whether"],["ziemlich anstrengend","quite exhausting"],["anfangen mit (angefangen)","to start with"],["das Packen","packing"],["sich anmelden beim Bürgeramt","register your address"]],
  note:"Leitpunkt 3 needs the past: war, habe … angefangen, hatte. Leitpunkt 4 uses solltest + musst for tips."},
 {id:4,reg:"du",to:"Lena",g:"f",title:"Deutsch lernen — Tipps",from:"Lena",sit:"Sie haben von Ihrer Freundin Lena folgende E-Mail erhalten.",sitEn:"You have received the following e-mail from your friend Lena.",
  mail:"Hallo,\ndu lernst ja schon lange Deutsch. Ich möchte im Herbst auch einen Deutschkurs machen, weil ich vielleicht in Deutschland arbeiten möchte. Wie lernst du eigentlich? Was ist für dich am schwierigsten? Kannst du mir einen Kurs empfehlen?\nLiebe Grüße\nLena",
  lp:[["wie Sie Deutsch lernen","how you learn German"],["was für Sie schwierig ist","what is difficult for you"],["welchen Kurs Sie empfehlen","which course you recommend"],["Vorschlag: gemeinsam üben","suggestion: practise together"]],
  model:"Betreff: Re: Deutsch lernen\n\nLiebe Lena,\n\ndanke für deine E-Mail! Toll, dass du auch Deutsch lernen möchtest.\n\nIch besuche seit einem Jahr einen Kurs an der Volkshochschule. Außerdem lerne ich jeden Tag 20 Minuten mit einer App und höre deutsche Podcasts in der U-Bahn.\n\nAm schwierigsten finde ich die Artikel: der, die oder das? Auch die Vergangenheit ist nicht leicht für mich. Trotzdem macht mir die Sprache Spaß, weil ich sie jeden Tag benutzen kann.\n\nDeshalb empfehle ich dir die Volkshochschule. Die Kurse sind nicht so teuer und die Lehrer erklären sehr gut.\n\nHast du Lust, einmal pro Woche mit mir per Video zu sprechen? So können wir beide üben.\n\nIch freue mich auf deine Antwort!\n\nLiebe Grüße\n[Name]",
  en:"Dear Lena, thanks for your e-mail! Great that you want to learn German too. For a year I've been attending a course at the adult education centre. I also study 20 minutes every day with an app and listen to German podcasts on the underground. I find the articles hardest: der, die or das? The past tense isn't easy for me either. Still, I enjoy the language, because I can use it every day. That's why I recommend the adult education centre. The courses aren't so expensive and the teachers explain very well. Do you feel like talking with me by video once a week? That way we can both practise. I look forward to your reply! Love, [Name]",
  words:[["seit einem Jahr","for a year (and still)"],["die Volkshochschule (VHS)","adult education centre"],["am schwierigsten","most difficult"],["die Vergangenheit","past (tense)"],["empfehlen + Dat","to recommend to"],["Hast du Lust, … zu …?","Do you feel like …?"]],
  note:"seit + present tense for something still going on: Ich besuche seit einem Jahr …"},
 {id:5,reg:"du",to:"Mia",g:"f",title:"Die neue Wohnung",from:"Mia",sit:"Sie haben von Ihrer Freundin Mia folgende E-Mail erhalten.",sitEn:"You have received the following e-mail from your friend Mia.",
  mail:"Hallo,\nich habe gehört, dass du umgezogen bist! Wie ist die neue Wohnung? Und wie sind die Nachbarn? Brauchst du noch etwas für die Wohnung? Ich würde dir gern etwas schenken. Ich hoffe, wir sehen uns bald!\nMia",
  lp:[["wie die Wohnung ist","what the flat is like"],["wie die Nachbarn sind","what the neighbours are like"],["was Sie noch brauchen","what you still need"],["Einladung: wann Mia kommen kann","invitation: when Mia can come"]],
  model:"Betreff: Re: Meine neue Wohnung\n\nLiebe Mia,\n\nvielen Dank für deine liebe Nachricht! Ja, ich bin vor drei Wochen umgezogen.\n\nDie neue Wohnung ist hell und viel größer als die alte. Sie hat zwei Zimmer, eine kleine Küche und einen Balkon. Am besten gefällt mir der Balkon, denn dort kann ich morgens Kaffee trinken.\n\nDie Nachbarn sind sehr freundlich. Neben mir wohnt eine ältere Frau. Sie hat mir am ersten Tag sogar Kuchen gebracht.\n\nDu bist wirklich lieb! Ich brauche noch eine Lampe für das Wohnzimmer. Wenn du möchtest, können wir zusammen eine aussuchen.\n\nKomm doch am Samstag, den 21. November, zum Abendessen zu mir! Dann zeige ich dir alles.\n\nBis bald und liebe Grüße\n[Name]",
  en:"Dear Mia, thank you very much for your kind message! Yes, I moved three weeks ago. The new flat is bright and much bigger than the old one. It has two rooms, a small kitchen and a balcony. I like the balcony best, because I can drink coffee there in the mornings. The neighbours are very friendly. An older woman lives next to me. She even brought me cake on the first day. You're really sweet! I still need a lamp for the living room. If you like, we can choose one together. Come over for dinner on Saturday, 21 November! Then I'll show you everything. See you soon, love, [Name]",
  words:[["vor drei Wochen","three weeks ago"],["hell","bright"],["größer als","bigger than"],["sogar","even"],["lieb","sweet, kind"],["aussuchen","to choose"]],
  note:"Comparatives (größer als) and „Am besten gefällt mir …“ are easy B1 points."},
 {id:6,reg:"du",to:"Paul",g:"m",title:"Urlaub — berichten",from:"Paul",sit:"Sie haben von Ihrem Freund Paul folgende E-Mail erhalten.",sitEn:"You have received the following e-mail from your friend Paul.",
  mail:"Hey,\ndu bist doch gerade aus dem Urlaub zurück! Wie war es? Wo warst du genau? Ich möchte im Sommer auch wegfahren und brauche noch Ideen. Erzähl mal!\nPaul",
  lp:[["wo und mit wem Sie waren","where and with whom you were"],["was Ihnen besonders gut gefallen hat","what you particularly liked"],["was nicht so gut war","what wasn't so good"],["ein Tipp für Pauls Urlaub","a tip for Paul's holiday"]],
  model:"Betreff: Re: Mein Urlaub\n\nLieber Paul,\n\ndanke für deine Nachricht! Ja, ich bin seit Sonntag wieder zu Hause.\n\nIch war zwei Wochen mit einem Freund an der Ostsee. Wir haben in einer kleinen Pension direkt am Strand gewohnt.\n\nBesonders gut hat mir das Essen gefallen. Wir haben jeden Tag frischen Fisch gegessen. Außerdem sind wir viel Fahrrad gefahren.\n\nLeider hat es in der zweiten Woche oft geregnet. Deshalb waren wir zweimal im Museum, aber das war auch interessant.\n\nWenn du Ruhe und Natur magst, solltest du auch an die Ostsee fahren. Du musst aber früh buchen, weil die Hotels im Sommer schnell voll sind.\n\nSchreib mir, wohin du fährst!\n\nViele Grüße\n[Name]",
  en:"Dear Paul, thanks for your message! Yes, I've been back home since Sunday. I spent two weeks with a friend on the Baltic coast. We stayed in a small guesthouse right on the beach. I especially liked the food. We ate fresh fish every day. We also cycled a lot. Unfortunately it often rained in the second week. So we went to the museum twice, but that was interesting too. If you like peace and nature, you should go to the Baltic Sea too. But you have to book early, because the hotels fill up quickly in summer. Write and tell me where you're going! Best, [Name]",
  words:[["die Ostsee","the Baltic Sea"],["die Pension","guesthouse"],["direkt am Strand","right on the beach"],["Fahrrad fahren (ist gefahren)","to cycle"],["die Ruhe","peace and quiet"],["voll","full"]],
  note:"Perfekt with sein (sind gefahren) and haben (haben gewohnt, gegessen, hat geregnet) plus war/waren."},
 {id:7,reg:"Sie",to:"Frau Becker",g:"f",title:"Kursabschlussfest",from:"Birgit Becker (Kursleiterin)",sit:"Ihre Kursleiterin, Frau Becker, hat allen Teilnehmenden folgende E-Mail geschrieben.",sitEn:"Your course teacher, Ms Becker, has written the following e-mail to all participants.",
  mail:"Liebe Kursteilnehmerinnen und Kursteilnehmer,\nunser Kurs endet am 15. Dezember. Zum Abschluss möchte ich mit Ihnen ein kleines Fest feiern. Bitte schreiben Sie mir, ob Sie kommen können. Haben Sie Ideen, wo wir feiern könnten? Jeder kann auch etwas zu essen mitbringen.\nHerzliche Grüße\nIhre Birgit Becker",
  lp:[["ob Sie teilnehmen","whether you are taking part"],["Vorschlag für den Ort","suggestion for the place"],["was Sie mitbringen","what you will bring"],["Dank für den Kurs","thanks for the course"]],
  model:"Betreff: Unser Kursabschlussfest\n\nLiebe Frau Becker,\n\nvielen Dank für Ihre E-Mail und die schöne Idee mit dem Fest!\n\nIch komme sehr gern am 15. Dezember, denn an diesem Tag habe ich zum Glück frei.\n\nIch schlage vor, dass wir im Kursraum feiern, weil wir dort genug Platz haben und es nichts kostet. Wenn das Wetter gut ist, könnten wir danach noch auf den Weihnachtsmarkt gehen.\n\nZum Fest bringe ich gern einen Salat und ein typisches Gericht aus meiner Heimat mit.\n\nZum Schluss möchte ich mich bei Ihnen bedanken. Ihr Unterricht hat mir sehr geholfen und ich habe viel gelernt.\n\nIch freue mich auf das Fest!\n\nHerzliche Grüße\n[Vorname Nachname]",
  en:"Dear Ms Becker, thank you very much for your e-mail and the lovely idea of a party! I'd be very happy to come on 15 December, because luckily I'm off that day. I suggest that we celebrate in the classroom, because we have enough space there and it costs nothing. If the weather is good, we could go to the Christmas market afterwards. For the party I'm happy to bring a salad and a typical dish from my home country. Finally, I'd like to thank you. Your lessons helped me a lot and I learned a great deal. I'm looking forward to the party! Warm regards, [First name Last name]",
  words:[["der Kursraum","classroom"],["genug Platz","enough space"],["der Weihnachtsmarkt","Christmas market"],["das Gericht","dish (food)"],["die Heimat","home country"],["sich bedanken bei","to thank (someone)"]],
  note:"Warm but formal: Liebe Frau Becker + Sie/Ihr. She signed „Herzliche Grüße“, so you may too."},
 {id:8,reg:"Sie",to:"Herr Schulz",g:"m",title:"Neue Fenster & Heizung",from:"Klaus Schulz (Hausverwaltung)",sit:"Die Hausverwaltung hat allen Mietern folgende E-Mail geschrieben.",sitEn:"The property management has sent the following e-mail to all tenants.",
  mail:"Sehr geehrte Mieterinnen und Mieter,\nim März werden in allen Wohnungen neue Fenster eingebaut. Der Handwerker braucht dafür ca. zwei Stunden pro Wohnung. Bitte teilen Sie mir mit, wann Sie zu Hause sind. Wenn Sie andere Probleme in Ihrer Wohnung haben, schreiben Sie mir bitte auch.\nMit freundlichen Grüßen\nKlaus Schulz, Hausverwaltung",
  lp:[["wann Sie zu Hause sind","when you are at home"],["ein Problem in Ihrer Wohnung","a problem in your flat"],["Bitte um Reparatur","request for repair"],["was passiert, wenn Sie nicht da sind","what happens if you're not there"]],
  model:"Betreff: Neue Fenster – Termin und Heizung\n\nSehr geehrter Herr Schulz,\n\nvielen Dank für Ihre Information über die neuen Fenster.\n\nIm März bin ich meistens montags und mittwochs ab 14 Uhr zu Hause, weil ich dann frei habe. Deshalb passen mir diese Termine am besten.\n\nAußerdem habe ich leider noch ein anderes Problem: Seit zwei Wochen funktioniert die Heizung im Schlafzimmer nicht richtig. Sie wird nur ein bisschen warm und nachts ist es sehr kalt.\n\nKönnte der Handwerker die Heizung vielleicht am selben Tag reparieren? Das wäre sehr praktisch.\n\nFalls ich an dem Termin doch arbeiten muss, kann meine Nachbarin, Frau Yilmaz, dem Handwerker die Tür öffnen. Sie hat einen Schlüssel für meine Wohnung.\n\nVielen Dank im Voraus.\n\nMit freundlichen Grüßen\n[Vorname Nachname]",
  en:"Dear Mr Schulz, thank you for the information about the new windows. In March I'm mostly at home on Mondays and Wednesdays from 2 pm, because I'm off then. That's why these times suit me best. Unfortunately I also have another problem: for two weeks the heating in the bedroom hasn't worked properly. It only gets a little warm and at night it's very cold. Could the tradesman perhaps repair the heating on the same day? That would be very practical. If I do have to work at that time, my neighbour, Ms Yilmaz, can open the door for the tradesman. She has a key to my flat. Thank you in advance. Yours sincerely, [First name Last name]",
  words:[["meistens","mostly"],["montags","on Mondays"],["nicht richtig","not properly"],["am selben Tag","on the same day"],["Falls","in case, if"],["dem Handwerker die Tür öffnen","open the door for the tradesman"]],
  note:"„Seit zwei Wochen funktioniert …“: seit + present tense. Requests use Konjunktiv II: Könnte …? Das wäre …"},
 {id:9,reg:"Sie",to:"Frau Wagner",g:"f",title:"Blumen gießen",from:"Erika Wagner (Nachbarin)",sit:"Ihre Nachbarin, Frau Wagner, hat Ihnen folgende E-Mail geschrieben.",sitEn:"Your neighbour, Ms Wagner, has written you the following e-mail.",
  mail:"Liebe Nachbarin, lieber Nachbar,\nich fahre vom 2. bis 16. August zu meiner Tochter nach Hamburg. Könnten Sie in dieser Zeit meine Blumen gießen? Ich lasse Ihnen gern den Schlüssel da. Wann passt es Ihnen, dass ich den Schlüssel vorbeibringe?\nHerzliche Grüße\nErika Wagner (2. Stock)",
  lp:[["ob Sie helfen können","whether you can help"],["wann Sie den Schlüssel bekommen können","when you can get the key"],["eine Frage zu den Blumen","a question about the plants"],["Angebot: Briefkasten leeren","offer: empty the letterbox"]],
  model:"Betreff: Ihre Blumen im August\n\nLiebe Frau Wagner,\n\nvielen Dank für Ihre Nachricht. Natürlich helfe ich Ihnen gern!\n\nDen Schlüssel kann ich am Donnerstagabend bei Ihnen abholen, weil ich dann früher von der Arbeit komme. Passt Ihnen 19 Uhr?\n\nAußerdem habe ich noch eine Frage zu den Blumen: Wie oft muss ich sie gießen? Und brauchen die Pflanzen auf dem Balkon mehr Wasser als die Pflanzen in der Wohnung?\n\nSoll ich auch Ihren Briefkasten leeren? Das mache ich gern, denn dann liegt keine Post vor Ihrer Tür.\n\nIch wünsche Ihnen eine schöne Zeit bei Ihrer Tochter in Hamburg!\n\nHerzliche Grüße\n[Vorname Nachname]",
  en:"Dear Ms Wagner, thank you for your message. Of course I'm happy to help! I can pick up the key from you on Thursday evening, because I get home from work earlier then. Does 7 pm suit you? I also have a question about the plants: how often do I need to water them? And do the plants on the balcony need more water than the ones in the flat? Shall I empty your letterbox too? I'm happy to do that, because then there's no post lying in front of your door. I wish you a lovely time with your daughter in Hamburg! Warm regards, [First name Last name]",
  words:[["abholen","to pick up"],["Passt Ihnen …?","Does … suit you?"],["wie oft","how often"],["gießen","to water"],["den Briefkasten leeren","empty the letterbox"],["Ich wünsche Ihnen …","I wish you …"]],
  note:"Your own question and an offer turn a short reply into a full B1 answer."},
 {id:10,reg:"Sie",to:"Damen und Herren",g:"x",title:"VHS: Kurszeit ändert sich",from:"Volkshochschule Mitte",sit:"Die Volkshochschule hat Ihnen folgende E-Mail geschrieben.",sitEn:"The adult education centre has written you the following e-mail.",
  mail:"Sehr geehrte Teilnehmerin, sehr geehrter Teilnehmer,\nleider müssen wir Ihren Kurs „Deutsch im Beruf“ ab dem 1. Februar von Dienstag 18 Uhr auf Donnerstag 9 Uhr verschieben, weil die Kursleiterin wechselt. Bitte teilen Sie uns mit, ob Sie weiter am Kurs teilnehmen möchten.\nMit freundlichen Grüßen\nVolkshochschule Mitte, Anmeldung",
  lp:[["warum der neue Termin ein Problem ist","why the new time is a problem"],["Vorschlag für eine andere Lösung","suggestion for another solution"],["Frage nach der Kursgebühr","question about the course fee"],["wie Sie den Kurs bisher finden","what you think of the course so far"]],
  model:"Betreff: Ihre E-Mail – Kurs „Deutsch im Beruf“\n\nSehr geehrte Damen und Herren,\n\nvielen Dank für Ihre Information. Leider ist der neue Termin für mich ein großes Problem.\n\nIch arbeite von Montag bis Freitag von 8 bis 17 Uhr. Deshalb kann ich am Donnerstagvormittag nicht in den Kurs kommen.\n\nGibt es vielleicht einen anderen Abendkurs auf dem gleichen Niveau? Ich könnte auch am Samstag kommen. Sonst wäre ein Online-Kurs eine gute Lösung für mich.\n\nAußerdem möchte ich wissen, ob ich die Kursgebühr zurückbekomme, wenn ich nicht weiter teilnehmen kann.\n\nBis jetzt hat mir der Kurs sehr gut gefallen. Ich habe viele nützliche Wörter für meine Arbeit gelernt.\n\nIch freue mich auf Ihre Antwort.\n\nMit freundlichen Grüßen\n[Vorname Nachname]",
  en:"Dear Sir or Madam, thank you for the information. Unfortunately the new time is a big problem for me. I work Monday to Friday from 8 to 5. So I can't come to the course on Thursday morning. Is there perhaps another evening course at the same level? I could also come on Saturday. Otherwise an online course would be a good solution for me. I'd also like to know whether I get the course fee back if I can't continue. So far I've really liked the course. I've learned many useful words for my work. I look forward to your reply. Yours sincerely, [First name Last name]",
  words:[["verschieben","to move, postpone"],["auf dem gleichen Niveau","at the same level"],["Sonst","otherwise"],["die Lösung","solution"],["zurückbekommen","to get back"],["bis jetzt","so far"]],
  note:"An office with no name → Sehr geehrte Damen und Herren. Indirect question: ob ich … zurückbekomme (verb last)."},
 {id:11,reg:"Sie",to:"Herr Meier",g:"m",title:"Betriebsausflug",from:"Thomas Meier (Teamleiter)",sit:"Ihr Teamleiter, Herr Meier, hat allen Kollegen folgende E-Mail geschrieben.",sitEn:"Your team lead, Mr Meier, has sent the following e-mail to all colleagues.",
  mail:"Liebe Kolleginnen und Kollegen,\nam Freitag, dem 20. Juni, machen wir unseren Betriebsausflug. Ich habe an eine Schifffahrt auf der Spree gedacht. Bitte sagen Sie mir bis Ende Mai Bescheid, ob Sie dabei sind. Ideen für das Programm sind willkommen!\nViele Grüße\nThomas Meier",
  lp:[["ob Sie teilnehmen","whether you're taking part"],["Ihre Meinung zur Schifffahrt","your opinion on the boat trip"],["Vorschlag für das Essen","suggestion for food"],["ob Partner mitkommen dürfen","whether partners may come"]],
  model:"Betreff: Re: Betriebsausflug am 20. Juni\n\nLieber Herr Meier,\n\nvielen Dank für die Einladung zum Betriebsausflug. Ich bin gern dabei, denn ich mag solche Ausflüge sehr.\n\nEine Schifffahrt auf der Spree finde ich eine sehr gute Idee, weil wir so viele Sehenswürdigkeiten sehen und uns gleichzeitig unterhalten können.\n\nDanach könnten wir zusammen grillen, zum Beispiel im Tiergarten. Wenn das Wetter schlecht ist, gibt es in der Nähe auch gute Restaurants.\n\nAußerdem habe ich noch eine Frage: Dürfen wir unsere Partner mitbringen? Meine Partnerin würde meine Kollegen gern kennenlernen.\n\nBitte geben Sie mir kurz Bescheid.\n\nViele Grüße\n[Vorname Nachname]",
  en:"Dear Mr Meier, thank you for the invitation to the company outing. I'm happy to join, because I really like outings like this. I think a boat trip on the Spree is a very good idea, because that way we'll see many sights and can chat at the same time. Afterwards we could have a barbecue together, for example in the Tiergarten. If the weather is bad, there are good restaurants nearby too. I also have a question: may we bring our partners? My partner would like to meet my colleagues. Please let me know briefly. Best regards, [First name Last name]",
  words:[["der Betriebsausflug","company outing"],["die Schifffahrt","boat trip"],["sich unterhalten","to chat"],["gleichzeitig","at the same time"],["in der Nähe","nearby"],["Bescheid geben","to let know"]],
  note:"Colleague e-mail signed „Viele Grüße“ → you can mirror it, but keep Sie."},
 {id:12,reg:"Sie",to:"Damen und Herren",g:"x",title:"Fitnessstudio: Preiserhöhung",from:"FitPlus Fitnessstudio",sit:"Ihr Fitnessstudio hat allen Mitgliedern folgende E-Mail geschrieben.",sitEn:"Your gym has sent the following e-mail to all members.",
  mail:"Sehr geehrte Mitglieder,\nab dem 1. Januar erhöhen wir den Monatsbeitrag von 29 auf 39 Euro. Dafür bieten wir neue Kurse an. Für Fragen und Wünsche schreiben Sie uns gern.\nIhr FitPlus-Team",
  lp:[["Ihre Meinung zur Preiserhöhung","your opinion on the price increase"],["was Sie im Studio stört","what bothers you at the gym"],["welche Kurse Sie sich wünschen","which courses you'd like"],["Frage zur Kündigung","question about cancelling"]],
  model:"Betreff: Preiserhöhung ab 1. Januar\n\nSehr geehrte Damen und Herren,\n\nvielen Dank für Ihre Information. Ehrlich gesagt bin ich mit der Preiserhöhung nicht einverstanden, denn zehn Euro mehr pro Monat sind sehr viel.\n\nAußerdem gibt es im Moment ein Problem: Abends ist das Studio oft so voll, dass ich lange auf die Geräte warten muss. Auch die Duschen sind manchmal kalt.\n\nWenn es neue Kurse gibt, wünsche ich mir einen Yogakurs am Abend und einen Kurs für Anfänger am Wochenende.\n\nZum Schluss habe ich noch eine Frage: Kann ich meinen Vertrag kündigen, wenn ich den neuen Preis nicht bezahlen möchte? Wie lange ist die Kündigungsfrist?\n\nIch bitte um eine kurze Antwort.\n\nMit freundlichen Grüßen\n[Vorname Nachname]",
  en:"Dear Sir or Madam, thank you for the information. To be honest, I don't agree with the price increase, because ten euros more per month is a lot. There's also a problem at the moment: in the evenings the gym is often so full that I have to wait a long time for the machines. The showers are sometimes cold too. If there are new courses, I'd like an evening yoga class and a beginners' course at the weekend. Finally, I have one more question: can I cancel my contract if I don't want to pay the new price? How long is the notice period? I'd appreciate a short reply. Yours sincerely, [First name Last name]",
  words:[["die Preiserhöhung","price increase"],["einverstanden sein mit","to agree with"],["so voll, dass …","so full that …"],["das Gerät, -e","machine, equipment"],["den Vertrag kündigen","to cancel the contract"],["die Kündigungsfrist","notice period"]],
  note:"A polite complaint: opinion + reason, a concrete problem, a wish, a question."}
];

const FINAL_CHECK=["Betreff written","Anrede matches the sender (Liebe/Lieber/Sehr geehrte/r) + comma","Line after the Anrede starts with a small letter","All 4 Leitpunkte answered (tick them!)","du or Sie the whole way through; Sie/Ihnen/Ihr capitalised","Verb 2nd in main clauses; verb last after weil/dass/wenn/ob","Perfekt: sein for movement (bin gefahren, bin gekommen)","At least 4 different connectors (denn, deshalb, außerdem, weil …)","Not every sentence starts with Ich","Schluss sentence + Gruß (no comma) + name"];

/* ===================== STATE ===================== */
const KEY="telcB1-schreiben-v1";
let S;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=Object.assign({plan:{},quiz:{},cards:{},drafts:{},sprint:{},order:{},skel:{du:"",sie:"",show:{}},calc:{}},load()||{});
const h=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PTS={A:5,B:3,C:1,D:0};
let ui={deck:"task",cardIdx:0,flip:false,listView:false,orderSel:{},phq:""};

/* ===================== HELPERS ===================== */
function planPct(){const all=PLAN.flatMap(d=>d.items);const done=all.filter(i=>S.plan[i[0]]).length;return Math.round(done/all.length*100)}
function updateMeter(){const p=planPct();document.getElementById("pct").textContent=p+"%";document.getElementById("pctbar").style.width=p+"%"}
function rot(n,qi){const k=(qi*2+1)%n;return Array.from({length:n},(_,i)=>(i+k)%n)}
function quizScore(id){const q=QUIZ[id],a=(S.quiz[id]||{}).ans||{};const answered=Object.keys(a).length;const right=Object.values(a).filter(v=>v===0).length;return{answered,right,total:q.items.length}}
function quizChip(id){const s=quizScore(id);if(!s.answered)return`<span class="chip">not started</span>`;const cls=s.answered<s.total?"":s.right/s.total>=.8?"ok":s.right/s.total>=.6?"warn":"bad";return`<span class="chip ${cls}">${s.right}/${s.total} correct${s.answered<s.total?` · ${s.answered} done`:""}</span>`}
function renderQuiz(id){const q=QUIZ[id],a=(S.quiz[id]||{}).ans||{};
 return `<div class="row" style="justify-content:space-between"><h4 style="margin:0">${h(q.t)}</h4><div class="row">${quizChip(id)}<button data-act="qreset" data-q="${id}">Reset</button></div></div>`+
 q.items.map((it,qi)=>{const order=rot(it[1].length,qi);const chosen=a[qi];
  return `<div class="q"><div class="stem">${qi+1}. ${h(it[0])}</div><div class="opts">${order.map(oi=>{let cls="";if(chosen!==undefined){if(oi===0)cls="right";else if(oi===chosen)cls="wrong"}return `<button class="${cls}" data-act="qa" data-q="${id}" data-i="${qi}" data-o="${oi}" ${chosen!==undefined?"disabled":""}>${h(it[1][oi])}</button>`}).join("")}</div>${chosen!==undefined?`<div class="expl">${chosen===0?"✓ Richtig. ":"✗ Not quite. "}${h(it[2])}</div>`:""}</div>`}).join("")}
function bubbles(prefix,val){return `<span class="bub">${["A","B","C","D"].map(g=>`<button class="${val===g?"on":""}" data-act="${prefix}" data-g="${g}" aria-label="${g}">${g}</button>`).join("")}</span>`}

/* ===================== VIEWS ===================== */
function vPlan(){
 const all=PLAN.flatMap(d=>d.items);const next=all.find(i=>!S.plan[i[0]]);
 return `<p class="eyebrow">Zertifikat Deutsch · Schriftlicher Ausdruck</p><h2>Your 5-day plan</h2>

 <h3>How it is scored</h3>
 <p>Two licensed raters mark three criteria. Each gets A, B, C or D. The sum is multiplied by 3.</p>
 <div class="tbl"><table><tr><th>Criterion</th><th>What it means</th><th class="mono">A</th><th class="mono">B</th><th class="mono">C</th><th class="mono">D</th></tr>

 <tr><td><b>III · Formale Richtigkeit</b><br><span class="en">accuracy</span></td><td>Grammar, spelling, punctuation. Understandability comes first.</td><td>5</td><td>3</td><td>1</td><td>0</td></tr></table></div>
 <div class="grid2">

  <div class="scoreline"><span><b>II</b> · Format, du/Sie, linking, varied openings</span>${bubbles("selfII",sc.II)}</div>
  <div class="scoreline"><span><b>III</b> · Grammar & spelling</span>${bubbles("selfIII",sc.III)}</div>
  <div class="row" style="justify-content:space-between;margin-top:10px"><span class="big mono">${sc.I&&sc.II&&sc.III?raw*3:"–"} <span class="note">/ 45</span></span><button class="primary" data-act="savescore" data-t="${id}" ${sc.I&&sc.II&&sc.III?"":"disabled"}>Save this score</button></div>
  ${(d.scores||[]).length?`<p class="note">Saved: ${d.scores.map(s=>`${s.date} → ${s.pts}`).join(" · ")}</p>`:""}
 </div>`}

function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
const CONN_RE=/\b(weil|denn|deshalb|deswegen|trotzdem|außerdem|aber|dass|wenn|ob|obwohl|damit|danach|dann|zuerst|zum Schluss|übrigens|natürlich|leider|zum Glück|sonst|falls|zwar|als|Am besten|Was .{1,30}? betrifft)\b/gi;
function markConn(s){return s.replace(CONN_RE,m=>`<mark>${m}</mark>`)}

/* ===================== AUTO-CHECK ===================== */
function analyse(t,text){
 const F=[];const add=(lvl,msg)=>F.push([lvl,msg]);
 const lines=text.split(/\n/).map(l=>l.trim());const nonEmpty=lines.filter(Boolean);
 const words=(text.match(/[A-Za-zÄÖÜäöüß]+(?:-[A-Za-zÄÖÜäöüß]+)*/g)||[]).length;
 if(!words){add("bad","Nothing written yet.");return F}
 // Betreff
 if(nonEmpty.length&&/^(betreff|re:|aw:)/i.test(nonEmpty[0]))add("ok","Betreff present.");else add("warn","No Betreff found in the first line. Start with „Betreff: …“ (the task asks for one).");
 // Anrede
 const aIdx=lines.findIndex(l=>/^(liebe[rs]?|hallo|hi|sehr geehrte[rs]?|guten tag)\b/i.test(l));
 if(aIdx<0)add("bad","No Anrede found (Liebe/Lieber …, Sehr geehrte/r …).");
 else{const a=lines[aIdx];
  if(!/,\s*$/.test(a))add("warn","Put a comma at the end of the Anrede line: „"+a.replace(/[!.:]?\s*$/,"")+",“");
  if(/sehr geehrte\s+herr/i.test(a))add("bad","„Sehr geehrte Herr“ → „Sehr geehrter Herr“ (masculine).");
  if(/sehr geehrter\s+frau/i.test(a))add("bad","„Sehr geehrter Frau“ → „Sehr geehrte Frau“.");
  if(/^liebe\s+herr\b/i.test(a))add("bad","„Liebe Herr …“ → „Lieber Herr …“.");
  if(/^lieber\s+frau\b/i.test(a))add("bad","„Lieber Frau …“ → „Liebe Frau …“.");
  if(t.reg==="du"&&/sehr geehrte/i.test(a))add("bad","This is a friend: use Liebe/Lieber or Hallo, not „Sehr geehrte“.");
  if(t.reg==="Sie"&&/^(hallo|hi)\b/i.test(a)&&t.g!=="x")add("warn","„Hallo“ is too casual for this person. Use „Liebe Frau …/Lieber Herr …“ or „Sehr geehrte/r …“.");
  if(t.reg==="du"&&t.g==="m"&&new RegExp("^liebe\\s+"+t.to,"i").test(a))add("bad","„"+t.to+"“ is a man: „Lieber "+t.to+",“");
  if(t.reg==="du"&&t.g==="f"&&new RegExp("^lieber\\s+"+t.to,"i").test(a))add("bad","„"+t.to+"“ is a woman: „Liebe "+t.to+",“");
  const nxt=lines.slice(aIdx+1).find(Boolean);
  if(nxt){const fw=nxt.split(/\s+/)[0].replace(/[^A-Za-zÄÖÜäöüß]/g,"");
   if(/^(Vielen|Ich|Danke|Wie|Schön|Es|Gern|Gerne|Entschuldige|Entschuldigen|Leider|Herzlichen|Toll|Super|Endlich|Wir|Heute|Jetzt|Ja|Natürlich|Was|Hoffentlich|Mit|Vor|Nach|Hier|Das)$/.test(fw))add("warn","After the Anrede comma, continue with a small letter: „"+fw.toLowerCase()+" …“ (nouns stay capital).");}}
 // Gruß
 const gIdx=lines.findIndex(l=>/(viele|liebe|herzliche|beste|freundlichen?)\s+grüße|grüßen|bis bald|bis samstag|bis dann/i.test(l)&&l.split(/\s+/).length<=6);
 if(gIdx<0)add("bad","No Gruß found (Viele Grüße / Liebe Grüße / Mit freundlichen Grüßen).");
 else{const g=lines[gIdx];if(/,\s*$/.test(g))add("warn","No comma after the Gruß in German: „"+g.replace(/,\s*$/,"")+"“");
  if(t.reg==="du"&&/freundlichen/i.test(g))add("warn","„Mit freundlichen Grüßen“ is too formal for a friend. Use „Liebe/Viele Grüße“.");
  if(t.reg==="Sie"&&/liebe grüße/i.test(g))add("warn","„Liebe Grüße“ is too personal here. Use „Mit freundlichen Grüßen“ (or „Viele/Herzliche Grüße“ if the sender used it).");
  if(!lines.slice(gIdx+1).some(Boolean)&&!/,?\s*[A-ZÄÖÜ][a-zäöüß]+\s*$/.test(g.replace(/grüße|grüßen/i,"")))add("warn","Write your name on the line after the Gruß.");}
 // Register
 const body=text;
 const inf=(body.match(/\b(du|dich|dir|dein|deine|deinen|deinem|deiner|euch|euer|eure)\b/gi)||[]).length;
 const formal=(body.match(/(?<![.!?:]\s|^|\n)\b(Sie|Ihnen|Ihr|Ihre|Ihren|Ihrem|Ihrer)\b/g)||[]).length;
 if(t.reg==="du"&&formal>0)add("bad","You wrote Sie/Ihnen/Ihr to a friend ("+formal+"×). Stay with du the whole way through.");
 if(t.reg==="Sie"&&inf>0)add("bad","du/dich/dir/dein found ("+inf+"×) in a Sie e-mail. Mixed register costs points in criterion II.");
 if(t.reg==="Sie"&&/\b(ihnen|ihren|ihrem)\b/.test(body))add("warn","Formal „Ihnen/Ihren/Ihrem“ must be capitalised.");
 if(t.reg==="du"&&inf===0&&formal===0)add("warn","No du/dich/dir/dein at all. Talk directly to your friend.");
 if((t.reg==="du"&&formal===0&&inf>0)||(t.reg==="Sie"&&inf===0&&formal>0))add("ok","Register is consistent ("+t.reg+").");
 // Length
 if(words<80)add("bad",words+" words: too short to cover four points well. Aim for 110–150.");
 else if(words<95)add("warn",words+" words: OK, but add a reason or detail to the thinnest point.");
 else if(words<=170)add("ok",words+" words: good length.");
 else add("warn",words+" words: longer than needed. More text means more chances for errors and less time to check.");
 // Sentence openings
 const sents=text.replace(/\n+/g," . ").split(/[.!?]+\s+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>2&&!/^(betreff|liebe|lieber|hallo|sehr geehrte|viele grüße|liebe grüße|mit freundlichen)/i.test(s));
 if(sents.length>=4){const ichs=sents.filter(s=>/^(ich|wir)\b/i.test(s)).length;const pct=Math.round(ichs/sents.length*100);
  if(pct>50)add("bad",pct+"% of your sentences start with Ich/Wir. Raters won't give A in criterion II. Start some with Am besten / Deshalb / Leider / Außerdem / time words.");
  else if(pct>40)add("warn",pct+"% of sentences start with Ich/Wir. Vary a few more openings.");
  else add("ok","Varied sentence openings ("+pct+"% start with Ich/Wir).");}
 // Connectors
 const conns=new Set((text.match(/\b(weil|denn|deshalb|deswegen|trotzdem|außerdem|aber|dass|wenn|ob|obwohl|damit|danach|dann|zuerst|übrigens|sonst|falls|als|zum schluss|am besten|leider|natürlich|zum glück|zwar|sondern|nachdem|bevor|während|ehrlich gesagt)\b/gi)||[]).map(x=>x.toLowerCase()));
 if(conns.size>=5)add("ok",conns.size+" different connectors: "+[...conns].join(", ")+".");
 else if(conns.size>=3)add("warn","Only "+conns.size+" different connectors ("+[...conns].join(", ")+"). Add deshalb, außerdem or weil to link the points.");
 else add("bad","Hardly any connectors ("+([...conns].join(", ")||"none")+"). Link the Leitpunkte: außerdem, deshalb, weil, denn, zum Schluss.");
 // Verb-last errors
 const vl=/\b(weil|dass|wenn|ob|obwohl|damit|bevor|nachdem|falls)\s+(ich|du|er|sie|es|wir|ihr|man|Sie)\s+(bin|bist|ist|sind|seid|habe|hast|hat|haben|habt|kann|kannst|können|könnt|muss|musst|müssen|will|willst|wollen|möchte|möchtest|möchten|werde|wirst|wird|werden|war|warst|waren|hatte|hattest|hatten|darf|darfst|dürfen|soll|sollst|sollen|komme|kommst|kommt|kommen|gehe|gehst|geht|gehen|fahre|fährst|fährt|fahren|arbeite|arbeitest|arbeitet|arbeiten|mache|machst|macht|machen|wohne|wohnst|wohnt|wohnen|finde|findest|findet|finden)\s+(?=[A-Za-zÄÖÜäöüß])/gi;
 const vlm=[...text.matchAll(vl)];
 vlm.slice(0,4).forEach(m=>add("bad","Verb position: „"+m[0].trim()+" …“ → after „"+m[1]+"“ the verb „"+m[3]+"“ goes to the END of the clause."));
 // Inversion errors
 const inv=/(^|[.!?:]\s+|\n)(Deshalb|Deswegen|Trotzdem|Dann|Danach|Außerdem|Leider|Morgen|Heute|Gestern|Zuerst|Natürlich|Vielleicht|Jetzt|Übrigens|Zum Glück|Am Wochenende|Am Samstag|Am Sonntag|Im Sommer|Im Winter|Letztes Jahr|Nächste Woche)\s+(ich|du|wir|er|sie|es|man|ihr)\s+/g;
 [...text.matchAll(inv)].slice(0,4).forEach(m=>add("bad","Word order: „"+m[2]+" "+m[3]+" …“ → the verb comes right after „"+m[2]+"“: „"+m[2]+" [verb] "+m[3]+" …“."));
 // haben + sein-verb
 const hs=/\b(habe|hast|hat|haben|habt)\b[^.!?\n]{0,40}?\b(gegangen|gekommen|geflogen|geblieben|gewesen|gelaufen|umgezogen|angekommen|aufgestanden|passiert|geworden|eingeschlafen|gereist|mitgekommen|zurückgekommen|losgefahren|ausgestiegen|eingestiegen|gestorben|gewandert|gefahren)\b/gi;
 [...text.matchAll(hs)].slice(0,3).forEach(m=>add("bad","Perfekt: „"+m[1]+" … "+m[2]+"“ → „"+m[2]+"“ goes with sein (bin/bist/ist/sind)."+(m[2].toLowerCase()==="gefahren"?" (Only „Ich habe das Auto gefahren“ uses haben.)":"")));
 // gender of die-words after für
 const fe=/\b(deinen|Ihren|einen|meinen|den)\s+(E-?Mail|Nachricht|Einladung|Frage|Antwort|Idee|Hilfe)\b/gi;
 [...text.matchAll(fe)].slice(0,3).forEach(m=>add("warn","„"+m[0]+"“: "+m[2]+" is feminine (die) → "+({deinen:"deine",ihren:"Ihre",einen:"eine",meinen:"meine",den:"die"}[m[1].toLowerCase()])+" "+m[2]+"."));
 // dative verbs
 const dv=/\b(helfe|hilfst|hilft|helfen|danke|dankst|gratuliere|gratulierst|antworte)\s+(dich|mich|ihn)\b/gi;
 [...text.matchAll(dv)].forEach(m=>add("bad","„"+m[0]+"“ → this verb takes Dativ: "+m[1]+" "+({dich:"dir",mich:"mir",ihn:"ihm"}[m[2].toLowerCase()])+"."));
 // Leitpunkte ticks
 const d=S.drafts[t.id];const ticked=t.lp.filter((_,i)=>d.lp[i]).length;
 if(ticked<4)add("warn","You've ticked "+ticked+"/4 Leitpunkte. Each missing point drops criterion I by one grade (4=A, 3=B, 2=C).");else add("ok","All 4 Leitpunkte ticked.");
 return F}
function renderFindings(F){const order={bad:0,warn:1,ok:2};const s=[...F].sort((a,b)=>order[a[0]]-order[b[0]]);
 const n={bad:F.filter(f=>f[0]==="bad").length,warn:F.filter(f=>f[0]==="warn").length};
 return `<div class="card"><div class="row" style="justify-content:space-between"><h4 style="margin:0">Automatic check</h4><span class="row"><span class="chip bad">${n.bad} fix</span><span class="chip warn">${n.warn} improve</span></span></div>
 ${s.map(f=>`<div class="find"><span class="dot ${f[0]}"></span><span>${h(f[1])}</span></div>`).join("")}
 <p class="note" style="margin-top:8px">This checker catches format, register and the most common B1 word-order and Perfekt errors. It can't judge meaning, so also compare with the model answer.</p></div>`}

/* ===================== TIMER ===================== */
let timer={id:null,iv:null};
function stopTimer(){clearInterval(timer.iv);timer={id:null,iv:null}}
function startTimer(id){stopTimer();const d=S.drafts[id];if(d.left<=0)d.left=1800;timer.id=id;
 timer.iv=setInterval(()=>{d.left--;save();const el=document.getElementById("tm");if(el){el.textContent=fmt(d.left);el.classList.toggle("low",d.left<300)}
  if(d.left<=0){stopTimer();const tu=document.getElementById("timeup");if(tu)tu.innerHTML=`<div class="banner">Time's up. In the exam the sheet is collected now. Finish your sentence, then check.</div>`;const b=document.querySelector('[data-act="tstart"]');if(b)b.textContent="Start 30-min timer"}},1000)}

/* ===================== ROUTER ===================== */
function route(){
 const hash=(location.hash||"#plan").slice(1);let html;let tab=hash;
 if(/^task-\d+$/.test(hash)){html=vTask(+hash.split("-")[1]);tab="studio"}
 else html=({plan:vPlan,exam:vExam,parts:vParts,phrases:vPhrases,grammar:vGrammar,words:vWords,drills:vDrills,studio:vStudio}[hash]||vPlan)();
 if(timer.id&&hash!=="task-"+timer.id)stopTimer();
 document.getElementById("tabs").innerHTML=TABS.map(t=>`<a href="#${t[0]}" class="${t[0]===tab?"on":""}">${t[1]}</a>`).join("");
 document.getElementById("view").innerHTML=html;updateMeter()}
function rerender(keepScroll=true){const y=window.scrollY;const open=[...document.querySelectorAll("details")].map(d=>d.open);route();
 const ds=document.querySelectorAll("details");if(ds.length===open.length)ds.forEach((d,i)=>d.open=open[i]);if(keepScroll)window.scrollTo(0,y)}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});

/* ===================== EVENTS ===================== */
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;const D=b.dataset;
 switch(a){
  case "plan":S.plan[D.id]=!S.plan[D.id];break;
  case "resetall":{const c=document.getElementById("resetconfirm");c.innerHTML=`<span class="note">Delete everything?</span> <button data-act="resetyes">Yes, reset</button>`;return}
  case "resetyes":S={plan:{},quiz:{},cards:{},drafts:{},sprint:{},order:{},skel:{du:"",sie:"",show:{}},calc:{}};break;
  case "qa":{const q=S.quiz[D.q]=S.quiz[D.q]||{ans:{}};q.ans[D.i]=+D.o;break}
  case "qreset":S.quiz[D.q]={ans:{}};break;
  case "calcI":case "calcII":case "calcIII":S.calc[a.slice(4)]=D.g;break;
  case "skelshow":S.skel.show[D.k]=!S.skel.show[D.k];break;
  case "deck":ui.deck=D.id;ui.cardIdx=0;ui.flip=false;break;
  case "flip":ui.flip=!ui.flip;break;
  case "card":{const d=DECKS.find(x=>x.id===ui.deck);const q=d.w.filter(w=>S.cards[w[0]]!==2);const w=q[ui.cardIdx%q.length];if(D.v==="2")S.cards[w[0]]=2;else{S.cards[w[0]]=1;ui.cardIdx++}ui.flip=false;break}
  case "deckreset":DECKS.find(x=>x.id===ui.deck).w.forEach(w=>delete S.cards[w[0]]);break;
  case "listview":ui.listView=!ui.listView;break;
  case "ord":{const s=ui.orderSel[D.o]=ui.orderSel[D.o]||[];s.push(+D.i);const o=ORDER.find(x=>x.id===D.o);if(s.length===o.lines.length&&s.every((v,i)=>v===i))S.order[D.o]=true;break}
  case "ordreset":ui.orderSel[D.o]=[];break;
  case "spshow":{const s=S.sprint[D.i]=S.sprint[D.i]||{};s.show=!s.show;break}
  case "spmark":{const s=S.sprint[D.i]=S.sprint[D.i]||{};s.m=D.m;break}
  case "lptick":{const d=S.drafts[D.t];d.lp[D.i]=!d.lp[D.i];break}
  case "tstart":{const id=+D.t;if(timer.id===id){stopTimer();b.textContent="Start 30-min timer"}else{startTimer(id);b.textContent="Pause"}save();return}
  case "treset":{stopTimer();S.drafts[D.t].left=1800;break}
  case "check":{const t=TASKS.find(x=>x.id===+D.t);const d=S.drafts[t.id];d.findings=analyse(t,d.text);save();document.getElementById("findings").innerHTML=renderFindings(d.findings);document.getElementById("findings").scrollIntoView({behavior:"smooth",block:"start"});return}
  case "model":{const d=S.drafts[D.t];d.showModel=!d.showModel;break}
  case "clear":{document.getElementById("clearconfirm").innerHTML=`<p class="note" style="margin-top:8px">Clear the text, ticks and timer? Saved scores stay. <button data-act="clearyes" data-t="${D.t}">Yes, start over</button></p>`;return}
  case "clearyes":{const d=S.drafts[D.t];stopTimer();Object.assign(d,{text:"",lp:{},left:1800,findings:null,showModel:false,self:{}});break}
  case "selfI":case "selfII":case "selfIII":{const id=+location.hash.split("-")[1];S.drafts[id].self[a.slice(4)]=D.g;break}
  case "savescore":{const d=S.drafts[D.t];const s=d.self;const pts=(PTS[s.I]+PTS[s.II]+PTS[s.III])*3;d.scores=d.scores||[];
   const words=(d.text.match(/[A-Za-zÄÖÜäöüß]+(?:-[A-Za-zÄÖÜäöüß]+)*/g)||[]).length;const dt=new Date();
   d.scores.push({date:dt.getDate()+"."+(dt.getMonth()+1)+".",I:s.I,II:s.II,III:s.III,pts,words});break}
  default:return}
 save();rerender()});
let saveT;
document.addEventListener("input",e=>{
 const el=e.target;const k=el.dataset.in;if(!k)return;
 if(k==="write"){const d=S.drafts[el.dataset.t];d.text=el.value;const w=(el.value.match(/[A-Za-zÄÖÜäöüß]+(?:-[A-Za-zÄÖÜäöüß]+)*/g)||[]).length;const wc=document.getElementById("wc");if(wc)wc.textContent=w+" words · aim 110–150"}
 else if(k==="skel")S.skel[el.dataset.k]=el.value;
 else if(k==="sprint"){const s=S.sprint[el.dataset.i]=S.sprint[el.dataset.i]||{};s.t=el.value}
 else if(k==="phq"){ui.phq=el.value;const pos=el.selectionStart;rerender();const n=document.getElementById("phsearch");n.focus();n.setSelectionRange(pos,pos);return}
 clearTimeout(saveT);saveT=setTimeout(save,300)});
route();
</script>
