/* Persistence shim: the component expects an async window.storage API.
   Back it with localStorage so progress survives reloads in a plain browser. */
window.storage = window.storage || {
  async get(key) {
    const value = localStorage.getItem(key);
    return value === null ? null : { value };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
  },
  async delete(key) {
    localStorage.removeItem(key);
  },
};
</script>

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=DM+Mono:wght@400;500&display=swap');

.dt {
  --paper:#E9E8E2;
  --card:#F6F5F1;
  --grid:#D8D8CE;
  --ink:#15171A;
  --ink2:#4E545A;
  --ink3:#878D93;
  --line:#C9C9BE;
  --nom:#1B5E9C;
  --akk:#0F7A6B;
  --dat:#9A6A00;
  --gen:#6E3B96;
  --err:#C0392B;
  --disp:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;

  font-family:var(--disp);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:22px 22px;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.dt *{box-sizing:border-box;}
.dt button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.dt button:focus-visible,.dt input:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

.dt-shell{max-width:660px;margin:0 auto;padding:0 16px 96px;}

/* ---------- masthead ---------- */
.dt-top{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:20px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:0;flex-wrap:wrap;
}
.dt-wordmark{font-size:19px;font-weight:700;letter-spacing:-0.02em;}
.dt-wordmark span{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--ink2);letter-spacing:0.06em;margin-left:8px;}
.dt-tabs{display:flex;gap:2px;}
.dt-tab{
  font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
  padding:6px 11px;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-2px;
}
.dt-tab[data-on="1"]{color:var(--ink);border-bottom-color:var(--ink);}

/* ---------- eyebrow ---------- */
.dt-eyebrow{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11px;letter-spacing:0.09em;text-transform:uppercase;
  color:var(--ink2);padding:16px 0 12px;
}
.dt-caseTag{
  color:#fff;padding:2px 7px 3px;font-weight:500;letter-spacing:0.07em;border-radius:2px;
}
.dt-lvl{border:1px solid var(--line);padding:2px 6px 3px;border-radius:2px;color:var(--ink3);}

/* ---------- question card ---------- */
.dt-card{
  background:var(--card);border:1px solid var(--line);
  box-shadow:3px 3px 0 rgba(21,23,26,0.07);
  padding:24px 20px;
}
.dt-sentence{
  font-family:var(--serif);font-size:23px;line-height:1.5;letter-spacing:-0.005em;
}
@media(min-width:520px){.dt-sentence{font-size:26px;}}
.dt-slot{
  display:inline-block;min-width:52px;text-align:center;
  border-bottom:2.5px solid var(--ink);padding:0 6px 1px;margin:0 1px;
}
.dt-slot[data-filled="1"]{border-bottom-color:currentColor;}
.dt-gloss{font-family:var(--disp);font-size:13px;color:var(--ink2);margin-top:12px;line-height:1.5;}
.dt-cue{font-family:var(--mono);font-size:13px;color:var(--ink);background:#E4E2D9;padding:1px 6px;border-radius:2px;}

/* ---------- answer controls ---------- */
.dt-choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;}
.dt-chip{
  font-family:var(--mono);font-size:15px;padding:11px 16px;
  border:1.5px solid var(--ink);background:var(--card);border-radius:3px;
  transition:transform .09s ease, background .12s ease;
}
.dt-chip:hover:not(:disabled){background:#E4E2D9;}
.dt-chip:active:not(:disabled){transform:translateY(1px);}
.dt-chip:disabled{cursor:default;}
.dt-chip[data-state="right"]{background:var(--ink);color:var(--card);border-color:var(--ink);}
.dt-chip[data-state="wrong"]{background:var(--err);color:#fff;border-color:var(--err);}
.dt-chip[data-state="muted"]{opacity:.34;}

.dt-input{
  width:100%;font-family:var(--mono);font-size:19px;padding:13px 14px;
  border:1.5px solid var(--ink);background:var(--card);border-radius:3px;color:var(--ink);
  margin-top:22px;
}
.dt-input::placeholder{color:var(--ink3);}
.dt-input:disabled{opacity:.75;}

/* ---------- token / order builder ---------- */
.dt-line{
  min-height:52px;border-bottom:2.5px solid var(--ink);padding:8px 2px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:18px;
}
.dt-line:empty::after{content:"Tippe die Wörter in der richtigen Reihenfolge an";font-family:var(--disp);font-size:13px;color:var(--ink3);}
.dt-tok{
  font-family:var(--serif);font-size:18px;padding:6px 11px;border:1px solid var(--line);
  background:var(--card);border-radius:3px;
}
.dt-tok[data-used="1"]{opacity:.22;pointer-events:none;}
.dt-bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}

/* ---------- feedback ---------- */
.dt-fb{margin-top:22px;padding-top:16px;border-top:2px solid var(--ink);}
.dt-verdict{

}
.dt-verdict[data-v="1"]{background:var(--ink);color:var(--card);}
.dt-verdict[data-v="0"]{background:var(--err);color:#fff;}
.dt-note{font-size:14.5px;line-height:1.62;color:var(--ink2);}
.dt-note b{color:var(--ink);font-weight:600;}
.dt-note code{font-family:var(--serif);font-size:16px;color:var(--ink);font-style:italic;}

/* ---------- paradigm mini-table ---------- */
.dt-para{margin-top:18px;}
.dt-paraLbl{font-family:var(--mono);font-size:10.5px;letter-spacing:0.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px;}
.dt-grid{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;width:100%;max-width:340px;}
.dt-grid th,.dt-grid td{border:1px solid var(--line);padding:5px 4px;text-align:center;color:var(--ink2);}
.dt-grid th{font-weight:500;color:var(--ink3);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;background:#E4E2D9;}
.dt-grid td[data-hit="1"]{background:var(--ink);color:var(--card);font-weight:500;}
.dt-grid th[data-hit="1"]{color:var(--ink);}

.dt-bar{

.dt-boxFill{position:absolute;bottom:0;left:0;right:0;background:var(--ink);}

.dt-topic{

.dt-mark{

.dt-topicMeta{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink3);}

.dt-ref h3{font-size:16px;font-weight:600;margin:30px 0 4px;letter-spacing:-0.01em;}
.dt-ref p{font-size:14px;line-height:1.6;color:var(--ink2);margin:0 0 12px;}
.dt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
.dt-table{border-collapse:collapse;font-size:13.5px;width:100%;min-width:340px;background:var(--card);}
.dt-table th,.dt-table td{border:1px solid var(--line);padding:7px 9px;text-align:left;}
.dt-table th{font-family:var(--mono);font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink3);background:#E4E2D9;font-weight:500;}
.dt-table td.k{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:#fff;text-align:center;width:64px;}
.dt-table td.m{font-family:var(--mono);font-size:13px;}
.dt-search{
  width:100%;font-family:var(--mono);font-size:14px;padding:10px 12px;margin-bottom:10px;
  border:1.5px solid var(--line);background:var(--card);border-radius:3px;color:var(--ink);
}

/* ---------- stats ---------- */
.dt-figs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:6px;}
.dt-fig{background:var(--card);padding:14px 12px;}
.dt-figN{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-0.02em;}
.dt-figL{font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink3);margin-top:3px;}
.dt-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.dt-rowBar{flex:1;height:7px;background:#DEDCD3;border-radius:1px;overflow:hidden;}
.dt-rowFill{height:100%;background:var(--ink);}
.dt-rowN{font-family:var(--mono);font-size:11.5px;color:var(--ink3);width:58px;text-align:right;flex:none;}

.dt-empty{font-size:14px;line-height:1.6;color:var(--ink2);padding:26px 0;}
.dt-mini{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:0.04em;}
.dt-link{text-decoration:underline;text-underline-offset:3px;font-size:13px;color:var(--ink2);}

@media(prefers-reduced-motion:reduce){.dt *{transition:none !important;animation:none !important;}}
`;

// deterministic PRNG so the item pool — and therefore Leitner
// progress — is identical on every load
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a += 0x6d2b79f5;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function genAdjektiv(r, n) {
  const out = [];
  const cases = ["nom", "akk", "dat"];
  for (let i = 0; i < n; i++) {
    const at = pick(r, ["def", "indef", "none"]);
    const kase = pick(r, cases);

    // an adjective with no article needs a mass noun or a plural
    const usePl = at === "none" ? r() < 0.5 : r() < 0.25;
    const useMass = at === "none" && !usePl;
    const noun = useMass ? pick(r, MASS) : pick(r, NOUNS);
    const cat = useMass ? "mass" : noun[4];
    const g = usePl ? "pl" : noun[1];

    const usable = ADJS.filter((a) => fitsNoun(a, cat));
    if (!usable.length) continue;
    const adj = pick(r, usable);
    const stem = adjStem(adj[0]);
    const end = ADJ_END[at][kase][g];
    const nounForm = usePl ? (kase === "dat" ? datPlural(noun[2]) : noun[2]) : noun[0];
    const head = at === "none" ? "" : ART[at][g][kase] + " ";
    const phrase = `${head}${stem}___ ${nounForm}`;

    let frame;
    if (kase === "nom") {
      frame = useMass ? `${phrase} schmeckt gut.` : `${phrase} ${usePl ? "sind" : "ist"} hier.`;
    } else if (kase === "akk") {
      frame = useMass ? `Ich mag ${phrase}.` : cat === "person" ? `Ich kenne ${phrase}.` : `Ich sehe ${phrase}.`;
    } else {
      frame = useMass
        ? `Ich koche mit ${phrase}.`
        : cat === "person"
        ? `Ich spreche mit ${phrase}.`
        : `Ich frage nach ${phrase}.`;
    }

    out.push({
      id: `g:adj:${at}:${kase}:${g}:${noun[0]}:${adj[0]}`,
      topic: "adjektiv",
      level: "A2",
      type: "choice",
      sentence: frame,
      gloss: `${adj[0]} — ${adj[1]}`,
      answer: end,
      options: ["e", "en", "er", "es", "em"],
      caseTag: kase,
      note: `${at === "none" ? "<b>Kein Artikel</b>" : `<b>${head.trim()}</b>`} · ${
        { m: "maskulin", f: "feminin", n: "neutrum", pl: "Plural" }[g]
      } · ${CASES[kase].label} → <b>-${end}</b>`,
      table: { kind: "adj", article: at, gender: g, kase },
    });
  }
  return out;
}

function genArtikel(r, n) {
  const out = [];
  const cases = ["nom", "akk", "dat"];
  for (let i = 0; i < n; i++) {
    const noun = pick(r, NOUNS);

    const cat = noun[4];
    const kase = pick(r, cases);
    const at = r() < 0.5 ? "def" : "indef";
    const correct = ART[at][g][kase];
    let opts = [...new Set(Object.values(ART[at][g]).concat(Object.values(ART[at].m)))].slice(0, 5);
    if (!opts.includes(correct)) opts = [correct, ...opts.slice(0, 4)];

    let frame, why;
    if (kase === "nom") {
      frame = `___ ${noun[0]} ist ${cat === "person" ? "nett" : cat === "abstrakt" ? "wichtig" : "neu"}.`;
      why = "Subject → Nominativ.";
    } else if (kase === "akk") {
      frame = cat === "person" ? `Ich kenne ___ ${noun[0]}.` : `Ich brauche ___ ${noun[0]}.`;
      why = "Direct object → Akkusativ.";
    } else {
      frame = cat === "person" ? `Ich helfe ___ ${noun[0]}.` : `Ich frage nach ___ ${noun[0]}.`;
      why = cat === "person" ? "<code>helfen</code> governs the Dativ." : "<code>nach</code> is always Dativ.";
    }

    out.push({
      id: `g:art:${at}:${kase}:${noun[0]}`,
      topic: "artikel",
      level: "A1",
      type: "choice",
      sentence: frame,
      gloss: `${noun[0]} — ${noun[3]}`,

      table: { kind: "art", article: at, gender: g, kase },
    });
  }
  return out;
}

    const sup = a[3] ? a[3][1] : "am " + (a[2] ? umlaut(a[0]) : a[0]) + (/[tdszß]$|sch$|[aeiouäöü]$/.test(a[0]) ? "esten" : "sten");

      }`,
      table: null,
    });
  }
  return out;
}

function umlaut(w) {
  if (/a(?!u)/.test(w)) return w.replace(/a(?!u)/, "ä");
  if (/au/.test(w)) return w.replace(/au/, "äu");
  if (/o/.test(w)) return w.replace(/o/, "ö");
  if (/u(?!e)/.test(w)) return w.replace(/u(?!e)/, "ü");
  return w;
}

/* ============================================================
   ITEM POOL — built once, deterministically, so that Leitner
   progress keyed on item id survives a reload
   ============================================================ */

function shuffleWith(r, arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const ALL_ITEMS = (() => {
  const r = rng(20260815);
  const gen = [
    ...genAdjektiv(r, 46),
    ...genArtikel(r, 30),
    ...genPlural(r, 26),
    ...genPraesens(r, 24),
    ...genPerfekt(r, 30),
    ...genPraeteritum(r, 28),
    ...genKomparativ(r, 20),
    ...genVerben(r, 26),
  ];
  const bank = BANK.map((q) => ({
    ...q,
    options: q.options ? shuffleWith(r, q.options) : undefined,
    tokens: q.tokens ? shuffleWith(r, q.tokens) : undefined,
    answer: Array.isArray(q.answer) ? q.answer : [q.answer],
    caseTag: q.caseTag || null,
    table: q.table || null,
  }));
  const seen = new Set();
  return [...gen, ...bank]
    .map((q) => ({ ...q, answer: Array.isArray(q.answer) ? q.answer : [q.answer] }))
    .filter((q) => (seen.has(q.id) ? false : (seen.add(q.id), true)));
})();

const BOX_MS = [0, 60e3, 10 * 60e3, 24 * 3600e3, 3 * 24 * 3600e3, 10 * 24 * 3600e3];
const STORE_KEY = "deutschtrainer:v1";

const norm = (s) =>
  (s == null ? "" : String(s))
    .toLowerCase()
    .trim()
    .replace(/\s+/g, " ")
    .replace(/ä/g, "ae")
    .replace(/ö/g, "oe")
    .replace(/ü/g, "ue")
    .replace(/ß/g, "ss")
    .replace(/[.,!?;:]/g, "");

const isRight = (given, answers) => answers.some((a) => norm(a) === norm(given));

function chooseNext(pool, progress, lastId) {
  if (!pool.length) return null;
  const now = Date.now();
  const seen = pool.filter((i) => progress[i.id]);
  const fresh = pool.filter((i) => !progress[i.id]);
  const due = seen.filter((i) => progress[i.id].due <= now);

  let bucket;
  if (due.length) {
    bucket = [...due].sort(
      (a, b) => progress[a.id].box - progress[b.id].box || progress[a.id].due - progress[b.id].due
    );
  } else if (fresh.length) {
    bucket = fresh;
  } else {
    bucket = [...seen].sort((a, b) => progress[a.id].due - progress[b.id].due);
  }
  let top = bucket.slice(0, 8);
  if (top.length > 1 && lastId) {
    const without = top.filter((i) => i.id !== lastId);
    if (without.length) top = without;
  }
  return top[Math.floor(Math.random() * top.length)];
}

/* ============================================================
   COMPONENT
   ============================================================ */

function DeutschTrainer() {
  const [tab, setTab] = useState("drill");
  const [topics, setTopics] = useState(() => new Set(TOPICS.map((t) => t[0])));
  const [pickerOpen, setPickerOpen] = useState(false);
  const [progress, setProgress] = useState({});
  const [ready, setReady] = useState(false);
  const [item, setItem] = useState(null);
  const [result, setResult] = useState(null);
  const [typed, setTyped] = useState("");
  const [built, setBuilt] = useState([]);
  const [session, setSession] = useState({ right: 0, wrong: 0, streak: 0, best: 0 });
  const [saveNote, setSaveNote] = useState("");
  const [vquery, setVquery] = useState("");
  const saveTimer = useRef(null);
  const inputRef = useRef(null);

  const pool = useMemo(() => ALL_ITEMS.filter((i) => topics.has(i.topic)), [topics]);

  /* ---- load ---- */
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const res = await window.storage.get(STORE_KEY);
        const saved = res && res.value ? JSON.parse(res.value) : null;
        if (alive && saved) {
          setProgress(saved.progress || {});
          if (saved.topics && saved.topics.length) setTopics(new Set(saved.topics));
          if (saved.best) setSession((s) => ({ ...s, best: saved.best }));
        }
      } catch (e) {
        /* nothing saved yet — first run */
      }
      if (alive) setReady(true);
    })();
    return () => {
      alive = false;
    };
  }, []);

  /* ---- save (debounced) ---- */
  const persist = useCallback(
    (prog, tset, best) => {
      if (saveTimer.current) clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(async () => {
        try {
          await window.storage.set(
            STORE_KEY,
            JSON.stringify({ progress: prog, topics: [...tset], best })
          );
          setSaveNote("gespeichert");
          setTimeout(() => setSaveNote(""), 1600);
        } catch (e) {
          setSaveNote("nicht gespeichert");
        }
      }, 600);
    },
    []
  );

  /* ---- first question ---- */
  useEffect(() => {
    if (ready && !item && pool.length) setItem(chooseNext(pool, progress, null));
  }, [ready, item, pool, progress]);

  useEffect(() => {
    if (item && item.type === "input" && inputRef.current) inputRef.current.focus();
  }, [item]);

  const advance = useCallback(() => {
    const nxt = chooseNext(pool, progress, item ? item.id : null);
    setItem(nxt);
    setResult(null);
    setTyped("");
    setBuilt([]);
  }, [pool, progress, item]);

  const grade = useCallback(
    (given) => {
      if (!item || result) return;
      const ok = isRight(given, item.answer);
      const prev = progress[item.id] || { box: 1, right: 0, wrong: 0 };
      const box = ok ? Math.min(5, prev.box + 1) : 1;
      const next = {
        ...progress,
        [item.id]: {
          box,
          due: Date.now() + BOX_MS[box],
          right: prev.right + (ok ? 1 : 0),
          wrong: prev.wrong + (ok ? 0 : 1),
        },
      };
      const streak = ok ? session.streak + 1 : 0;
      const best = Math.max(session.best, streak);
      setProgress(next);
      setSession({ right: session.right + (ok ? 1 : 0), wrong: session.wrong + (ok ? 0 : 1), streak, best });
      setResult({ ok, given });
      persist(next, topics, best);
    },
    [item, result, progress, session, topics, persist]
  );

  const submit = () => {
    if (!item) return;
    if (item.type === "input") grade(typed);
    else if (item.type === "order") grade(built.map((i) => item.tokens[i]).join(" "));
  };

  const toggleTopic = (key) => {
    const nt = new Set(topics);
    if (nt.has(key)) nt.delete(key);
    else nt.add(key);
    if (!nt.size) return;
    setTopics(nt);
    setItem(null);
    setResult(null);
    setTyped("");
    setBuilt([]);
    persist(progress, nt, session.best);
  };

  const resetAll = async () => {
    setProgress({});
    setSession({ right: 0, wrong: 0, streak: 0, best: 0 });
    setItem(null);
    setResult(null);
    try {
      await window.storage.delete(STORE_KEY);
      setSaveNote("zurückgesetzt");
      setTimeout(() => setSaveNote(""), 1600);
    } catch (e) {
      /* nothing stored */
    }
  };

  /* ---- derived ---- */
  const boxCounts = useMemo(() => {
    const c = [0, 0, 0, 0, 0];
    Object.values(progress).forEach((p) => {
      if (p.box >= 1 && p.box <= 5) c[p.box - 1]++;
    });
    return c;
  }, [progress]);

  const topicStats = useMemo(() => {
    const m = {};
    TOPICS.forEach(([k]) => (m[k] = { right: 0, wrong: 0, seen: 0, total: 0 }));
    ALL_ITEMS.forEach((i) => m[i.topic] && m[i.topic].total++);
    Object.entries(progress).forEach(([id, p]) => {
      const it = ALL_ITEMS.find((x) => x.id === id);
      if (!it || !m[it.topic]) return;
      m[it.topic].right += p.right;
      m[it.topic].wrong += p.wrong;
      m[it.topic].seen++;
    });
    return m;
  }, [progress]);

  const totalRight = Object.values(progress).reduce((a, p) => a + p.right, 0);
  const totalWrong = Object.values(progress).reduce((a, p) => a + p.wrong, 0);
  const accuracy = totalRight + totalWrong ? Math.round((totalRight / (totalRight + totalWrong)) * 100) : 0;

  /* ---- render helpers ---- */
  const renderSentence = (it, res) => {
    if (!it.sentence) return null;
    const parts = it.sentence.split("___");
    const fill = res ? it.answer[0] : null;
    const col = it.caseTag ? CASES[it.caseTag].color : "var(--ink)";
    return (
      <div className="dt-sentence">
        {parts.map((p, i) => (
          <React.Fragment key={i}>
            <span>{p}</span>
            {i < parts.length - 1 && (
              <span className="dt-slot" data-filled={fill ? "1" : "0"} style={fill ? { color: col } : undefined}>
                {fill || " "}
              </span>
            )}
          </React.Fragment>
        ))}
      </div>
    );
  };

  const renderParadigm = (t) => {
    if (!t) return null;
    const cases = ["nom", "akk", "dat"];
    const gens = ["m", "f", "n", "pl"];
    const label =
      t.kind === "adj"
        ? `Adjektivendungen · ${ADJ_TABLE_NAME[t.article]}`
        : `Artikel · ${t.article === "def" ? "bestimmt" : "unbestimmt"}`;
    return (
      <div className="dt-para">
        <div className="dt-paraLbl">{label}</div>
        <table className="dt-grid">
          <thead>
            <tr>
              <th />
              {gens.map((g) => (
                <th key={g} data-hit={t.gender === g ? "1" : "0"}>
                  {g === "pl" ? "Pl" : g}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {cases.map((c) => (
              <tr key={c}>
                <th data-hit={t.kase === c ? "1" : "0"}>{c}</th>
                {gens.map((g) => {
                  const hit = t.kase === c && t.gender === g;
                  const val = t.kind === "adj" ? "-" + ADJ_END[t.article][c][g] : ART[t.article][g][c];
                  return (
                    <td key={g} data-hit={hit ? "1" : "0"}>
                      {val}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  };

  /* ============================ DRILL ============================ */
  const topicMeta = TOPICS.find((t) => item && t[0] === item.topic);

  const drill = (
    <>
      <div className="dt-eyebrow">
        <button className="dt-link" onClick={() => setPickerOpen((v) => !v)}>
          {topics.size} von {TOPICS.length} Themen
        </button>
        <span style={{ color: "var(--line)" }}>·</span>
        <span>{pool.length} Aufgaben</span>
        {saveNote && <span style={{ marginLeft: "auto" }}>{saveNote}</span>}
      </div>

      {pickerOpen && (
        <div style={{ marginBottom: 22 }}>
          <div className="dt-topics">
            {TOPICS.map(([key, name, sub, lvl]) => (
              <button key={key} className="dt-topic" data-on={topics.has(key) ? "1" : "0"} onClick={() => toggleTopic(key)}>
                <span className="dt-mark">{topics.has(key) ? "✓" : ""}</span>
                <span>
                  <span style={{ display: "block", fontWeight: 500 }}>{name}</span>
                  <span style={{ display: "block", fontSize: 12, color: "var(--ink3)" }}>{sub}</span>
                </span>
                <span className="dt-topicMeta">{lvl}</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {!item ? (
        <div className="dt-empty">Wähle mindestens ein Thema aus, um zu üben.</div>
      ) : (
        <>
          <div className="dt-eyebrow" style={{ paddingTop: 0 }}>
            <span>{topicMeta ? topicMeta[1] : item.topic}</span>
            {item.caseTag && (
              <span className="dt-caseTag" style={{ background: CASES[item.caseTag].color }}>
                {CASES[item.caseTag].label}
              </span>
            )}
            <span className="dt-lvl">{item.level}</span>
          </div>

          <div className="dt-card">
            {item.type === "order" ? (
              <>
                <div className="dt-gloss" style={{ marginTop: 0, fontSize: 14 }}>
                  {item.gloss}
                </div>
                <div className="dt-line">
                  {built.map((idx, pos) => (
                    <button
                      key={pos}
                      className="dt-tok"
                      disabled={!!result}
                      onClick={() => setBuilt(built.filter((_, j) => j !== pos))}
                    >
                      {item.tokens[idx]}
                    </button>
                  ))}
                </div>
                <div className="dt-bank">
                  {item.tokens.map((w, i) => (
                    <button
                      key={i}
                      className="dt-tok"
                      data-used={built.includes(i) ? "1" : "0"}
                      disabled={!!result}
                      onClick={() => setBuilt([...built, i])}
                    >
                      {w}
                    </button>
                  ))}
                </div>
              </>
            ) : (
              <>
                {renderSentence(item, result)}
                {item.gloss && <div className="dt-gloss">{item.gloss}</div>}
                {item.type === "choice" ? (
                  <div className="dt-choices">
                    {item.options.map((o) => {
                      let state = "";
                      if (result) {
                        if (isRight(o, item.answer)) state = "right";
                        else if (norm(o) === norm(result.given)) state = "wrong";
                        else state = "muted";
                      }
                      return (
                        <button key={o} className="dt-chip" data-state={state} disabled={!!result} onClick={() => grade(o)}>
                          {item.topic === "adjektiv" ? "-" + o : o}
                        </button>
                      );
                    })}
                  </div>
                ) : (
                  <input
                    ref={inputRef}
                    className="dt-input"
                    value={typed}
                    disabled={!!result}
                    placeholder={item.placeholder || "Antwort"}
                    onChange={(e) => setTyped(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter") {
                        e.preventDefault();
                        result ? advance() : submit();
                      }
                    }}
                    aria-label="Antwort eingeben"
                  />
                )}
              </>
            )}

            {result && (
              <div className="dt-fb">
                <div className="dt-verdict" data-v={result.ok ? "1" : "0"}>
                  {result.ok ? "Richtig" : "Nicht ganz"}
                </div>
                {!result.ok && (
                  <div className="dt-note" style={{ marginBottom: 8 }}>
                    Richtig wäre: <b>{item.answer[0]}</b>
                  </div>
                )}
                <div className="dt-note" dangerouslySetInnerHTML={{ __html: item.note }} />
                {renderParadigm(item.table)}
              </div>
            )}
          </div>
        </>
      )}
    </>
  );

  /* ============================ REFERENCE ============================ */
  const caseRow = (k) => (
    <td className="k" style={{ background: CASES[k].color }}>
      {k}
    </td>
  );

  const verbsFiltered = VERBS.filter((v) => {
    const q = vquery.toLowerCase().trim();
    if (!q) return true;
    return v[0].includes(q) || v[1].toLowerCase().includes(q) || v[3].includes(q) || v[5].includes(q) || v[6].includes(q);
  });

  const reference = (
    <div className="dt-ref">
      <h3>Artikel</h3>
      <p>Only the masculine changes in the Akkusativ. That one fact carries most of A1.</p>
      <div className="dt-scroll">
        <table className="dt-table">
          <thead>
            <tr>
              <th>Kasus</th>
              <th>mask.</th>
              <th>fem.</th>
              <th>neut.</th>
              <th>Plural</th>
            </tr>
          </thead>
          <tbody>
            {["nom", "akk", "dat", "gen"].map((k) => (
              <tr key={k}>
                {caseRow(k)}
                {["m", "f", "n", "pl"].map((g) => (
                  <td className="m" key={g}>
                    {ART.def[g][k]} / {ART.indef[g][k]}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <h3>Personalpronomen</h3>
      <div className="dt-scroll">
        <table className="dt-table">
          <thead>
            <tr>
              <th>Kasus</th>
              <th>ich</th>
              <th>du</th>
              <th>er</th>
              <th>sie</th>
              <th>wir</th>
              <th>ihr</th>
              <th>sie/Sie</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              {caseRow("nom")}
              {["ich", "du", "er", "sie", "wir", "ihr", "sie/Sie"].map((x) => (
                <td className="m" key={x}>{x}</td>
              ))}
            </tr>
            <tr>
              {caseRow("akk")}
              {["mich", "dich", "ihn", "sie", "uns", "euch", "sie/Sie"].map((x) => (
                <td className="m" key={x}>{x}</td>
              ))}
            </tr>
            <tr>
              {caseRow("dat")}
              {["mir", "dir", "ihm", "ihr", "uns", "euch", "ihnen/Ihnen"].map((x) => (
                <td className="m" key={x}>{x}</td>
              ))}
            </tr>
          </tbody>
        </table>
      </div>

      <h3>Adjektivendungen</h3>
      <p>The case signal appears exactly once — on the article or on the adjective, never twice.</p>
      {["def", "indef", "none"].map((at) => (
        <div key={at} style={{ marginBottom: 14 }}>
          <div className="dt-paraLbl">{ADJ_TABLE_NAME[at]}</div>
          <div className="dt-scroll">
            <table className="dt-table">
              <thead>
                <tr>
                  <th>Kasus</th>
                  <th>mask.</th>
                  <th>fem.</th>
                  <th>neut.</th>
                  <th>Plural</th>
                </tr>
              </thead>
              <tbody>
                {["nom", "akk", "dat", "gen"].map((k) => (
                  <tr key={k}>
                    {caseRow(k)}
                    {["m", "f", "n", "pl"].map((g) => (
                      <td className="m" key={g}>
                        -{ADJ_END[at][k][g]}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ))}

      <h3>Relativpronomen</h3>
      <p>Identical to the definite article except <b>denen</b> in the Dativ Plural and the whole Genitiv row.</p>
      <div className="dt-scroll">
        <table className="dt-table">
          <thead>
            <tr>
              <th>Kasus</th>
              <th>mask.</th>
              <th>fem.</th>
              <th>neut.</th>
              <th>Plural</th>
            </tr>
          </thead>
          <tbody>
            {[
              ["nom", "der", "die", "das", "die"],
              ["akk", "den", "die", "das", "die"],
              ["dat", "dem", "der", "dem", "denen"],
              ["gen", "dessen", "deren", "dessen", "deren"],
            ].map((row) => (
              <tr key={row[0]}>
                {caseRow(row[0])}
                {row.slice(1).map((x, i) => (
                  <td className="m" key={i}>{x}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <h3>Präpositionen</h3>
      <div className="dt-scroll">
        <table className="dt-table">
          <thead>
            <tr>
              <th>Kasus</th>
              <th>Präpositionen</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              {caseRow("akk")}
              <td className="m">durch, ohne, gegen, für, um, bis, entlang</td>
            </tr>
            <tr>
              {caseRow("dat")}
              <td className="m">aus, bei, mit, nach, seit, von, zu, gegenüber, ab, außer</td>
            </tr>
            <tr>
              <td className="k" style={{ background: "var(--ink)" }}>wechsel</td>
              <td className="m">an, auf, hinter, in, neben, über, unter, vor, zwischen — Akk. bei <i>wohin?</i>, Dat. bei <i>wo?</i></td>
            </tr>
            <tr>
              {caseRow("gen")}
              <td className="m">wegen, während, trotz, statt, innerhalb, außerhalb</td>
            </tr>
          </tbody>
        </table>
      </div>

      <h3>Konjunktionen</h3>
      <div className="dt-scroll">
        <table className="dt-table">
          <thead>
            <tr>
              <th>Verbposition</th>
              <th>Wörter</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Position 2 (unverändert)</td>
              <td className="m">und, oder, aber, denn, sondern</td>
            </tr>
            <tr>
              <td>Position 2, Inversion</td>
              <td className="m">deshalb, deswegen, darum, daher, trotzdem, dann, danach, sonst, außerdem, also</td>
            </tr>
            <tr>
              <td>Verb am Ende</td>
              <td className="m">weil, dass, wenn, als, ob, obwohl, damit, bevor, nachdem, während, bis, seitdem, sobald, falls, solange</td>
            </tr>
          </tbody>
        </table>
      </div>

      <h3>Unregelmäßige Verben</h3>
      <input
        className="dt-search"
        value={vquery}
        onChange={(e) => setVquery(e.target.value)}
        placeholder="Verb, Bedeutung oder Ablautklasse suchen"
        aria-label="Verben durchsuchen"
      />
      <div className="dt-scroll">
        <table className="dt-table">
          <thead>
            <tr>
              <th>Infinitiv</th>
              <th>er</th>
              <th>Präteritum</th>
              <th>Perfekt</th>
              <th>Klasse</th>
            </tr>
          </thead>
          <tbody>
            {verbsFiltered.map((v) => (
              <tr key={v[0]}>
                <td className="m">
                  {v[0]}
                  <span style={{ color: "var(--ink3)", fontSize: 11, display: "block" }}>{v[1]}</span>
                </td>
                <td className="m">{v[2]}</td>
                <td className="m">{v[3]}</td>
                <td className="m">
                  {v[4]} {v[5]}
                </td>
                <td className="m" style={{ fontSize: 11, color: "var(--ink3)" }}>{v[6]}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {!verbsFiltered.length && <div className="dt-empty">Kein Verb gefunden. Versuch es mit einem Teil des Infinitivs.</div>}
    </div>
  );

  /* ============================ PROGRESS ============================ */
  const progressView = (
    <div>
      <div className="dt-secTitle">Diese Sitzung</div>
      <div className="dt-figs">
        <div className="dt-fig">
          <div className="dt-figN">{session.right + session.wrong}</div>
          <div className="dt-figL">Aufgaben</div>
        </div>
        <div className="dt-fig">
          <div className="dt-figN">{session.streak}</div>
          <div className="dt-figL">Serie</div>
        </div>
        <div className="dt-fig">
          <div className="dt-figN">{session.best}</div>
          <div className="dt-figL">Bestserie</div>
        </div>
      </div>

      <div className="dt-secTitle">Insgesamt</div>
      <div className="dt-figs">
        <div className="dt-fig">
          <div className="dt-figN">{Object.keys(progress).length}</div>
          <div className="dt-figL">gesehen</div>
        </div>
        <div className="dt-fig">
          <div className="dt-figN">{accuracy}%</div>
          <div className="dt-figL">richtig</div>
        </div>
        <div className="dt-fig">
          <div className="dt-figN">{boxCounts[4]}</div>
          <div className="dt-figL">in Kasten 5</div>
        </div>
      </div>

      <div className="dt-secTitle">Nach Thema</div>
      {TOPICS.map(([key, name]) => {
        const s = topicStats[key];
        const tot = s.right + s.wrong;
        const pct = tot ? Math.round((s.right / tot) * 100) : 0;
        return (
          <div className="dt-row" key={key}>
            <span style={{ width: 150, flex: "none" }}>{name}</span>
            <span className="dt-rowBar">
              <span className="dt-rowFill" style={{ width: tot ? pct + "%" : "0%" }} />
            </span>
            <span className="dt-rowN">{tot ? pct + "% · " + s.seen : "–"}</span>
          </div>
        );
      })}

      <div style={{ marginTop: 26 }}>
        <button className="dt-go" data-alt="1" onClick={resetAll}>
          Fortschritt zurücksetzen
        </button>
        <p style={{ fontSize: 12.5, color: "var(--ink3)", marginTop: 10, lineHeight: 1.5 }}>
          Die Leitner-Kästen steuern die Wiederholung: richtig beantwortet → ein Kasten weiter und später wieder
          dran, falsch → zurück in Kasten 1.
        </p>
      </div>
    </div>
  );

  /* ============================ SHELL ============================ */
  const canSubmit = item && !result && (item.type === "input" ? typed.trim().length > 0 : built.length > 0);

  return (
    <div className="dt">
      <style>{CSS}</style>
      <div className="dt-shell">
        <div className="dt-top">
          <div className="dt-wordmark">
            Deutschtrainer<span>A1–A2</span>
          </div>
          <div className="dt-tabs">
            {[
              ["drill", "Üben"],
              ["ref", "Tabellen"],
              ["stats", "Fortschritt"],
            ].map(([k, l]) => (
              <button key={k} className="dt-tab" data-on={tab === k ? "1" : "0"} onClick={() => setTab(k)}>
                {l}
              </button>
            ))}
          </div>
        </div>

        {tab === "drill" && drill}
        {tab === "ref" && reference}
        {tab === "stats" && progressView}
      </div>

      {tab === "drill" && item && (
        <div className="dt-bar">
          <div className="dt-barIn">
            <div className="dt-boxes">
              {boxCounts.map((c, i) => {
                const max = Math.max(1, ...boxCounts);
                return (
                  <div className="dt-box" key={i}>
                    <span className="dt-boxBar">
                      <span className="dt-boxFill" style={{ height: Math.round((c / max) * 20) + "px" }} />
                    </span>
                    <span>{i + 1}</span>
                  </div>
                );
              })}
            </div>
            {result || item.type === "choice" ? (
              <button className="dt-go" onClick={advance} disabled={!result}>
                Weiter
              </button>
            ) : (
              <button className="dt-go" onClick={submit} disabled={!canSubmit}>
                Prüfen
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DeutschTrainer />);
</script>
</body>
</html>
