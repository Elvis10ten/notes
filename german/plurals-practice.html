<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Plurale — German plurals to mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --shell:#191c22; --shell2:#212632; --line:#2e3441; --dim:#8b93a3; --dimmer:#5d6575;
  --paper:#f4f3ee; --grid:#e2e0d6; --ink:#14161a; --ink2:#4a4f58;
  --der:#2b5ce6; --die:#c6362c; --das:#a9760a; --plu:#177a58;
  --derL:#7fa0ff; --dieL:#ff8f85; --dasL:#e8b64e; --pluL:#4fc79b;
  --ok:#177a58; --bad:#c6362c;
  --disp:"Bricolage Grotesque","Archivo","Helvetica Neue",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--shell); color:#e7eaf0; font-family:var(--body);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--dasL); outline-offset:2px}
.hide{display:none !important}

/* ---------- frame ---------- */
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:16px 0 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:.02em}
.brand em{font-style:normal;color:var(--dimmer);font-family:var(--mono);
  font-size:11px;font-weight:400;letter-spacing:.06em;margin-left:8px;text-transform:uppercase}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);padding:7px 11px;border-radius:2px}
.tab:hover{color:#fff;background:var(--shell2)}
.tab[aria-selected="true"]{color:var(--shell);background:var(--dasL)}
.hud{display:flex;gap:18px;width:100%;font-family:var(--mono);font-size:11px;
  letter-spacing:.05em;color:var(--dimmer);text-transform:uppercase}
.hud b{color:#e7eaf0;font-weight:500}

/* ---------- the card ---------- */
.card{
  background:var(--paper);color:var(--ink);border-radius:3px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:23px 23px; background-position:-1px -1px;
  box-shadow:0 18px 40px -22px #000,0 2px 0 #cfcdc2;
  padding:24px 26px 26px; position:relative; overflow:hidden;
}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px #d8d6cb}
.cardtop{display:flex;align-items:center;gap:10px;margin-bottom:20px;min-height:24px}
.artchip{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;
  color:#fff;padding:3px 9px;border-radius:2px}
.artchip.der{background:var(--der)} .artchip.die{background:var(--die)} .artchip.das{background:var(--das)}
.artchip.plu{background:var(--plu)}
.rulechip{font-family:var(--mono);font-size:11px;color:var(--ink2);
  border:1px solid #c9c7bb;padding:3px 8px;border-radius:2px;background:#fbfaf6}
.rulechip.t{border-color:var(--die);color:var(--die)}
.ask{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink2);margin-left:auto}

.word{font-family:var(--disp);font-weight:800;font-size:clamp(38px,8.2vw,62px);
  line-height:1.02;letter-spacing:-.025em;word-break:break-word;margin:0}
.word .u{color:var(--plu)}
.gloss{font-size:15px;color:var(--ink2);margin-top:6px}
.gloss .sub{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:#8a8778;display:block;margin-bottom:2px}

/* ---------- answering ---------- */
.answer{display:flex;align-items:stretch;gap:8px;margin-top:22px;flex-wrap:wrap}
.plurallabel{font-family:var(--mono);font-size:14px;font-weight:600;color:#fff;background:var(--plu);
  display:flex;align-items:center;padding:0 12px;border-radius:2px;letter-spacing:.04em}
.field{flex:1 1 220px;min-width:0;border:1.5px solid #bfbdb1;background:#fffefb;border-radius:2px;
  padding:12px 14px;font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:-.01em;
  color:var(--ink)}
.field::placeholder{color:#bdbbb0;font-weight:500}
.field:focus{border-color:var(--ink);outline:none}
.field.good{border-color:var(--ok);background:#f2fbf7}
.field.bad{border-color:var(--bad);background:#fdf4f3}
.keys{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.key{font-family:var(--disp);font-weight:700;font-size:17px;border:1px solid #c9c7bb;background:#fbfaf6;
  width:40px;height:36px;border-radius:2px;color:var(--ink)}
.key:hover{background:#efeee7}
.keyhint{font-family:var(--mono);font-size:11px;color:#8a8778;margin-left:auto}

.opts{display:grid;gap:8px;margin-top:20px}
.opts.g3{grid-template-columns:repeat(3,1fr)}
.opts.g6{grid-template-columns:repeat(3,1fr)}
.opt{border:1.5px solid #c9c7bb;background:#fbfaf6;border-radius:2px;padding:13px 12px;text-align:left;
  color:var(--ink);font-size:15px;display:flex;align-items:center;gap:9px;line-height:1.3}
.opt:hover{border-color:var(--ink);background:#fff}
.opt .kbd{font-family:var(--mono);font-size:10.5px;color:#8a8778;border:1px solid #d5d3c7;
  border-radius:2px;padding:1px 5px;flex:none}
.opt.sel{border-color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--ink)}
.opt.good{border-color:var(--ok);background:#eef9f4;box-shadow:inset 0 0 0 1px var(--ok)}
.opt.bad{border-color:var(--bad);background:#fdf1f0;box-shadow:inset 0 0 0 1px var(--bad)}
.opt.cls{font-family:var(--mono);font-weight:600;font-size:17px;justify-content:center}
.opt.art{justify-content:center;font-family:var(--mono);font-weight:600;font-size:16px}
.opt.art.der{color:var(--der)} .opt.art.die{color:var(--die)} .opt.art.das{color:var(--das)}
.steplabel{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:#8a8778;margin:16px 0 -6px}

/* ---------- verdict ---------- */
.verdict{margin-top:20px;border-top:1px solid #d8d6cb;padding-top:18px}
.vhead{display:flex;align-items:baseline;gap:10px;font-family:var(--mono);font-size:12px;
  letter-spacing:.08em;text-transform:uppercase}
.vhead.ok{color:var(--ok)} .vhead.bad{color:var(--bad)}
.vnote{font-size:14.5px;color:var(--ink2);margin-top:8px}
.build{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.slot{border:1px dashed #bfbdb1;border-radius:2px;padding:7px 11px;background:#fffefb;text-align:center}
.slot .lab{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:#96938a;margin-bottom:3px}
.slot .val{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--ink)}
.slot.on{border-style:solid;border-color:var(--plu);background:#f0faf6}
.slot.off .val{color:#c2bfb4}
.dots{display:inline-flex;gap:4px;height:19px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--plu);display:block}
.eq{font-family:var(--mono);color:#96938a}
.res{font-family:var(--disp);font-weight:800;font-size:27px;letter-spacing:-.02em}
.res .u{color:var(--plu)}
.vrule{font-size:13.5px;color:var(--ink2);margin-top:12px;border-left:2px solid var(--das);padding-left:10px}
.vnext{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.go{background:var(--ink);color:#fff;font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;
  text-transform:uppercase;padding:11px 18px;border-radius:2px}
.go:hover{background:#000}
.go.ghost{background:none;color:var(--ink2);border:1px solid #c9c7bb}
.go.ghost:hover{background:#efeee7;color:var(--ink)}
.mini{font-family:var(--mono);font-size:11px;color:#8a8778}

@media(prefers-reduced-motion:no-preference){
  .anim-in{animation:rise .22s ease-out both}
  .slot.drop .dots i{animation:drop .34s cubic-bezier(.3,1.4,.5,1) both}
  .slot.drop .dots i:nth-child(2){animation-delay:.06s}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
}

/* ---------- rail + panels ---------- */
.rail{display:flex;align-items:center;gap:10px;margin-top:18px;font-family:var(--mono);
  font-size:11px;color:var(--dimmer);letter-spacing:.05em}
.bar{flex:1;height:4px;background:var(--shell2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pluL);width:0;transition:width .3s}
.panel{background:var(--shell2);border:1px solid var(--line);border-radius:3px;padding:20px 22px}
.panel h2{font-family:var(--disp);font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.panel p{color:var(--dim);font-size:14.5px;margin:0 0 16px}
.startgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:18px 0}
.stat{border:1px solid var(--line);border-radius:3px;padding:12px 14px}
.stat b{display:block;font-family:var(--disp);font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pri{background:var(--dasL);color:#191c22;font-family:var(--mono);font-size:12.5px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;padding:12px 20px;border-radius:2px}
.pri:hover{background:#f5cb6a}
.sec{border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;padding:11px 16px;border-radius:2px}
.sec:hover{color:#fff;border-color:var(--dim)}
.sec[aria-pressed="true"]{background:var(--shell);color:#fff;border-color:var(--dim)}
select{background:var(--shell);color:#e7eaf0;border:1px solid var(--line);border-radius:2px;
  padding:10px 12px;font-family:var(--mono);font-size:12px}

/* ---------- map ---------- */
.maprow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);
  width:100%;text-align:left}
.maprow:hover{background:var(--shell2)}
.maprow .nm{flex:1;font-size:14px;min-width:0}
.maprow .nm i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;color:var(--dimmer);text-transform:uppercase}
.mbar{width:130px;height:7px;background:var(--shell);border-radius:1px;display:flex;overflow:hidden;flex:none}
.mbar i{display:block;height:100%}
.mbar .l3{background:var(--pluL)} .mbar .l2{background:#2f6f57} .mbar .l1{background:#454b59}
.mnum{font-family:var(--mono);font-size:11px;color:var(--dim);width:52px;text-align:right;flex:none}
.legend{display:flex;gap:14px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);
  text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px;flex-wrap:wrap}
.legend i{width:9px;height:9px;display:inline-block;margin-right:5px;border-radius:1px}
.wordlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:6px;margin-top:14px}
.wl{display:flex;align-items:center;gap:7px;font-size:13.5px;padding:5px 7px;border-radius:2px;
  background:var(--shell);border:1px solid var(--line)}
.wl .dot{width:7px;height:7px;border-radius:50%;flex:none;background:#454b59}
.wl .dot.l2{background:#2f6f57} .wl .dot.l3{background:var(--pluL)}
.wl s{text-decoration:none;color:var(--dimmer);font-family:var(--mono);font-size:11px;margin-left:auto}
.trouble{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tw{border:1px solid var(--line);border-radius:2px;padding:6px 10px;font-size:13.5px;background:var(--shell)}
.tw b{color:var(--dieL);font-weight:500;font-family:var(--mono);font-size:11px;margin-left:6px}

/* ---------- exam ---------- */
.examgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px;margin-top:16px}
.ex{display:flex;gap:8px;align-items:baseline;font-size:13.5px;padding:6px 8px;border-radius:2px;
  border:1px solid var(--line);background:var(--shell)}
.ex.bad{border-color:#5c2a26;background:#2a1a19}
.ex s{text-decoration:line-through;color:var(--dieL);font-size:12px}
.ex em{font-style:normal;color:var(--pluL);font-size:12px}
.hist{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:12px}

textarea{width:100%;height:110px;background:var(--shell);color:var(--dim);border:1px solid var(--line);
  border-radius:2px;padding:10px;font-family:var(--mono);font-size:11px;resize:vertical}
.note{font-size:13px;color:var(--dimmer);margin-top:12px}
.note b{color:var(--dim);font-weight:500}

@media(max-width:600px){
  .wrap{padding:0 12px 48px}
  .card{padding:18px 16px 20px}
  .opts.g6,.opts.g3{grid-template-columns:repeat(2,1fr)}
  .tabs{margin-left:0;width:100%;justify-content:space-between}
  .brand{width:100%}
  .mbar{width:88px}
}

</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">PLURALE<em>586 nouns · 27 patterns</em></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" id="tab-drill" role="tab" aria-selected="true">Drill</button>
      <button class="tab" id="tab-map" role="tab" aria-selected="false">Map</button>
      <button class="tab" id="tab-exam" role="tab" aria-selected="false">Exam</button>
      <button class="tab" id="tab-data" role="tab" aria-selected="false">Progress</button>
    </nav>
    <div class="hud" id="hud"></div>
  </header>
  <main id="view-drill" role="tabpanel"></main>
  <main id="view-map" class="hide" role="tabpanel"></main>
  <main id="view-exam" class="hide" role="tabpanel"></main>
  <main id="view-data" class="hide" role="tabpanel"></main>
</div>
<script>
/* ---------- core: answer checking + scheduling. No DOM in here. ---------- */
const DAY = 86400000;
const FOLD = { 'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'ß': 'ss' };
const BARE = { 'ä': 'a', 'ö': 'o', 'ü': 'u' };

function fold(s) {                     // umlaut-tolerant: Haeuser === Häuser
  return Array.from(s.toLowerCase()).map(c => FOLD[c] || c).join('');
}
function bare(s) {                     // umlaut-blind: Hauser === Häuser
  return Array.from(s.toLowerCase()).map(c => BARE[c] || (c === 'ß' ? 'ss' : c)).join('');
}
function stripArticle(s) {
  return s.replace(/^\s*(die|der|das)\s+/i, '');
}
function norm(s) {
  return fold(stripArticle(String(s == null ? '' : s).normalize('NFC').trim().replace(/\s+/g, ' ')));
}
function umlautCount(s) {
  return (s.match(/[äöü]/gi) || []).length;
}
function commonPrefix(a, b) {
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  return i;
}

/* Diagnose a typed plural. Returns {ok, kind} where kind explains the miss. */
function checkPlural(input, item) {
  const raw = String(input == null ? '' : input).trim();
  if (!raw) return { ok: false, kind: 'empty' };
  const plain = stripArticle(raw.normalize('NFC').replace(/\s+/g, ' '));
  const got = fold(plain), want = norm(item.p);
  if (got === want) return { ok: true, kind: 'exact' };
  for (const a of (item.alt || [])) {
    if (got === norm(a)) return { ok: true, kind: 'alt', form: a };
  }
  const wrongArticle = /^\s*(der|das)\s+/i.test(raw);
  // compare with umlauts stripped, straight from the raw text, to tell apart
  // "right shape, wrong umlaut" from "wrong shape"
  const gotB = bare(plain), wantB = bare(item.p);
  const gotU = umlautCount(plain), wantU = umlautCount(item.p);
  if (gotB === wantB) {
    return { ok: false, kind: gotU < wantU ? 'umlaut-missing' : 'umlaut-extra', article: wrongArticle };
  }
  if (got === norm(item.s)) return { ok: false, kind: 'singular', article: wrongArticle };
  const cp = commonPrefix(gotB, wantB);
  if (cp >= Math.min(3, wantB.length - 1)) {
    return { ok: false, kind: gotU === wantU ? 'ending' : 'ending-umlaut', article: wrongArticle };
  }
  return { ok: false, kind: 'wrong', article: wrongArticle };
}

const MISS_TEXT = {
  'empty': 'Nothing entered.',
  'alt': 'Accepted — that variant is also standard.',
  'umlaut-missing': 'Right ending, missing umlaut.',
  'umlaut-extra': 'Right ending, but there is no umlaut here.',
  'ending': 'Umlaut right, ending wrong.',
  'ending-umlaut': 'Both the umlaut and the ending are off.',
  'singular': 'That is the singular.',
  'no-article': 'Right noun — but the article is the point here.',
  'wrong-article': 'Right noun, wrong gender.',
  'wrong-noun': 'Right gender, wrong noun.',
  'wrong': 'Not this one.',
};

/* Reverse mode: the article is part of the answer, because gender drives the plural. */
function checkSingular(input, item) {
  const raw = String(input == null ? '' : input).trim().normalize('NFC').replace(/\s+/g, ' ');
  if (!raw) return { ok: false, kind: 'empty' };
  const m = raw.match(/^(der|die|das)\s+(.*)$/i);
  const noun = m ? m[2] : raw;
  const nounOk = fold(noun) === fold(item.s);
  if (!m) return { ok: false, kind: nounOk ? 'no-article' : 'wrong' };
  const artOk = m[1].toLowerCase() === item.a;
  if (artOk && nounOk) return { ok: true, kind: 'exact' };
  if (nounOk) return { ok: false, kind: 'wrong-article' };
  if (artOk) return { ok: false, kind: 'wrong-noun' };
  return { ok: false, kind: 'wrong' };
}

/* ---------- scheduling ---------- */
function newState() {
  return { seen: 0, pc: 0, cc: 0, ac: 0, lapse: 0, streak: 0, ef: 2.5, iv: 0, due: 0, last: 0 };
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function grade(st, ok, mode, now) {
  st = Object.assign(newState(), st);
  st.seen++; st.last = now;
  const heavy = (mode === 'produce' || mode === 'reverse' || mode === 'concept' || mode === 'special');
  if (ok) {
    st.streak++;
    if (mode === 'produce' || mode === 'reverse') st.pc++;
    else if (mode === 'class') st.cc++;
    else if (mode === 'article') st.ac++;
    else st.pc++;                                   // concept / special
    if (heavy) {
      st.ef = clamp(st.ef + 0.05, 1.3, 2.9);
      st.iv = st.iv === 0 ? 1 : clamp(Math.round(st.iv * st.ef), 2, 240);
    } else if (st.iv === 0) {
      st.iv = 0;                                     // light modes never graduate an item
    }
  } else {
    st.streak = 0;
    st.ef = clamp(st.ef - 0.22, 1.3, 2.9);
    st.iv = 0;
    if (mode === 'produce' || mode === 'reverse') st.lapse++;
  }
  st.due = now + st.iv * DAY;
  return st;
}

/* 0 untouched · 1 learning · 2 solid · 3 mastered */
function level(st, item) {
  if (!st || !st.seen) return 0;
  const needClass = item && item.k === 'noun';
  if (st.pc >= 4 && st.streak >= 3 && st.iv >= 21 && (!needClass || st.cc >= 1)) return 3;
  if (st.pc >= 2 && st.iv >= 7) return 2;
  return 1;
}

/* What is still standing between this item and mastered. */
function missing(st, item) {
  const s = st || newState(), out = [];
  const needClass = item && item.k === 'noun';
  if (s.pc < 4) out.push(`${4 - s.pc} more correct ${item && item.k === 'noun' ? 'spelling' : 'answer'}${4 - s.pc > 1 ? 's' : ''}`);
  if (needClass && s.cc < 1) out.push('name its plural class once');
  if (s.streak < 3) out.push(`${3 - s.streak} in a row without a slip`);
  if (s.iv < 21) out.push(`survive a ${s.iv < 1 ? 1 : s.iv}-day gap and grow it to 21`);
  return out;
}

function pickMode(st, item, rnd) {
  const r = rnd || Math.random;
  if (item.k === 'concept') return 'concept';
  if (item.k === 'special') return 'special';
  if (!st || !st.seen) return 'article';
  if (!st.cc) return 'class';
  if (st.pc >= 2) {
    const x = r();
    if (x < 0.10) return 'class';
    if (x < 0.22) return 'reverse';
  }
  return 'produce';
}

/* Build a session queue: due reviews first, then new material. */
function buildQueue(pool, states, size, now, rnd) {
  const r = rnd || Math.random;
  const due = [], fresh = [], soon = [];
  for (const it of pool) {
    const st = states[it.id];
    if (!st || !st.seen) fresh.push(it);
    else if (st.due <= now) due.push(it);
    else soon.push(it);
  }
  due.sort((a, b) => (states[a.id].due - states[b.id].due) || (states[b.id].lapse - states[a.id].lapse));
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const newCap = Math.max(0, Math.min(fresh.length, Math.ceil(size * 0.45)));
  const take = due.slice(0, size - Math.min(newCap, Math.max(0, size - due.length)));
  const q = take.concat(fresh.slice(0, size - take.length));
  if (q.length < size) {                              // nothing left to do: cram the weakest
    soon.sort((a, b) => (level(states[a.id], a) - level(states[b.id], b)) || (states[b.id].lapse - states[a.id].lapse));
    q.push(...soon.slice(0, size - q.length));
  }
  return shuffle(q);
}

function stats(pool, states) {
  const out = { total: pool.length, m0: 0, m1: 0, m2: 0, m3: 0, due: 0, lapsed: 0 };
  const now = Date.now();
  for (const it of pool) {
    const st = states[it.id];
    out['m' + level(st, it)]++;
    if (st && st.seen && st.due <= now) out.due++;
    if (st && st.lapse >= 3) out.lapsed++;
  }
  return out;
}

in -ung","Feminine loanwords"],"n":"Hand → Hände, Stadt → Städte, Nacht → Nächte. You have to learn the set.","r":"f.umlaut_e"},{"id":"c013","k":"concept","q":"Which two feminine nouns take a bare umlaut with no ending?","ok":"Mutter and Tochter","opts":["Mutter and Tochter","Schwester and Tante","Hand and Wand","Nacht and Kraft"],"n":"Mütter and Töchter are the only common ones.","r":"f.umlaut_only"},{"id":"c014","k":"concept","q":"A feminine noun matches none of the suffix rules. What is your best guess?","ok":"-en","opts":["-en","-e","-er","-s"],"n":"The feminine default is -en: Frau → Frauen, Zeit → Zeiten.","r":"f.default_en"},{"id":"c015","k":"concept","q":"Most one-syllable masculine nouns take which plural?","ok":"-e, sometimes with umlaut","opts":["-e, sometimes with umlaut","-er with umlaut","-en","-s"],"n":"Hund → Hunde, Stuhl → Stühle.","r":"m.mono_e"},{"id":"c016","k":"concept","q":"Masculine nouns ending in -er, -el or -en take which plural?","ok":"No ending, sometimes with umlaut","opts":["No ending, sometimes with umlaut","-e","-n","-s"],"n":"Lehrer → Lehrer, Apfel → Äpfel, Garten → Gärten.","r":"m.er_el_en_zero"},{"id":"c017","k":"concept","q":"Masculine nouns in -ling, -ich and -ig take which plural?","ok":"-e with no umlaut","opts":["-e with no umlaut","-e with umlaut","-en","-∅"],"n":"Lehrling → Lehrlinge, König → Könige.","r":"m.ling_ich_ig_e"},{"id":"c018","k":"concept","q":"What happens to the stress in der Professor → die Professoren?","ok":"It moves onto the -or- syllable","opts":["It moves onto the -or- syllable","It stays on Pro-","It moves onto the final -en","German has no word stress"],"n":"Prófessor becomes Professóren. The same happens with Doktor and Motor.","r":"m.or_en"},{"id":"c019","k":"concept","q":"Which set of endings marks a masculine weak (n-) noun?","ok":"-e, -ent, -ant, -ist, -oge","opts":["-e, -ent, -ant, -ist, -oge","-er, -el, -en","-ling, -ich, -ig","-heit, -keit, -ung"],"n":"Junge → Jungen, Student → Studenten, Polizist → Polizisten.","r":"m.weak_n"},{"id":"c020","k":"concept","q":"What else is true of weak masculine nouns like der Student?","ok":"They add -en in every case except the nominative singular","opts":["They add -en in every case except the nominative singular","They never take an article","They are always plural","They cannot take adjectives"],"n":"You say den Studenten, dem Studenten, des Studenten.","r":"m.weak_n"},{"id":"c021","k":"concept","q":"Neuter nouns in -er, -el, -en, -chen and -lein take which plural?","ok":"No ending and no umlaut","opts":["No ending and no umlaut","No ending but with umlaut","-e","-n"],"n":"das Fenster → die Fenster, das Mädchen → die Mädchen. Unlike masculines, neuters never umlaut here.","r":"n.zero"},{"id":"c022","k":"concept","q":"What is the difference between masculine and neuter zero plurals?","ok":"Masculines can umlaut, neuters do not","opts":["Masculines can umlaut, neuters do not","Neuters can umlaut, masculines do not","Both always umlaut","Neither ever umlauts"],"n":"der Apfel → die Äpfel, but das Fenster → die Fenster. The rare exception is das Kloster → die Klöster.","r":"n.zero"},{"id":"c023","k":"concept","q":"Neuter nouns of the shape Ge- ... -e take which plural?","ok":"No ending","opts":["No ending","-e","-en","-er"],"n":"das Gebäude → die Gebäude, das Gemälde → die Gemälde.","r":"n.ge_e_zero"},{"id":"c024","k":"concept","q":"Why is the plural of das Geschenk not unchanged?","ok":"It does not end in -e, so the Ge- ... -e pattern does not apply","opts":["It does not end in -e, so the Ge- ... -e pattern does not apply","Geschenk is masculine","It is a loanword","It is irregular"],"n":"The pattern needs both the Ge- prefix and the final -e. Geschenk → Geschenke.","r":"n.ge_e_zero"},{"id":"c025","k":"concept","q":"Many one-syllable neuter nouns take which plural?","ok":"-er with umlaut","opts":["-er with umlaut","-e with umlaut","-en","-s"],"n":"Buch → Bücher, Haus → Häuser, Land → Länder.","r":"n.mono_er_umlaut"},{"id":"c026","k":"concept","q":"Which plural does a Latin neuter in -um take?","ok":"Drop -um and add -en","opts":["Drop -um and add -en","Keep -um and add -e","Add -s","Leave it unchanged"],"n":"Museum → Museen, Zentrum → Zentren.","r":"n.um_en"},{"id":"c027","k":"concept","q":"What is the plural of a noun ending in -nis?","ok":"-nisse, with the s doubled","opts":["-nisse, with the s doubled","-nisen","-nis","-nisser"],"n":"Ergebnis → Ergebnisse.","r":"n.nis_nisse"},{"id":"c028","k":"concept","q":"Neuter nouns in -ment and -at take which plural?","ok":"-e","opts":["-e","-en","-s","-er"],"n":"Instrument → Instrumente, Plakat → Plakate.","r":"n.ment_at_e"},{"id":"c029","k":"concept","q":"Which of these neuter nouns takes an -en plural against the usual pattern?","ok":"das Auge","opts":["das Auge","das Buch","das Fenster","das Zimmer"],"n":"Auge → Augen. The same oddity hits Ohr, Bett, Hemd and Herz.","r":"n.odd_en"},{"id":"c030","k":"concept","q":"Which noun keeps a Latin -a plural?","ok":"das Praktikum","opts":["das Praktikum","das Museum","das Zentrum","das Studium"],"n":"Praktikum → Praktika. Museum → Museen and Zentrum → Zentren follow the -en pattern.","r":"irr"},{"id":"c031","k":"concept","q":"What is the plural of der Kaktus?","ok":"Kakteen","opts":["Kakteen","Kaktusse","Kaktus","Kaktussen"],"n":"The Latin stem Kakte- takes -en. Kaktusse is a colloquial variant.","r":"irr"},{"id":"c032","k":"concept","q":"What is the plural of der Atlas?","ok":"Atlanten","opts":["Atlanten","Atlasse","Atlase","Atlas"],"n":"The Greek stem is Atlant-.","r":"irr"},{"id":"c033","k":"concept","q":"Which word has no singular?","ok":"die Eltern","opts":["die Eltern","die Familie","die Person","die Gruppe"],"n":"Eltern, Geschwister, Leute, Ferien and Kosten are plural-only.","r":"pluralonly"},{"id":"c034","k":"concept","q":"Which word has no ordinary plural?","ok":"das Obst","opts":["das Obst","das Buch","das Auto","das Kind"],"n":"Obst, Gemüse, Fleisch, Milch and Zucker are mass nouns.","r":"singularonly"},{"id":"c035","k":"concept","q":"How do you count a plural-only noun like die Eltern?","ok":"Use a different word, such as ein Elternteil","opts":["Use a different word, such as ein Elternteil","Add -e to the stem","Drop the -n","Use the singular article with the plural form"],"n":"German supplies a separate countable noun.","r":"pluralonly"},{"id":"c036","k":"concept","q":"Where does a compound noun get its plural from?","ok":"Its last element","opts":["Its last element","Its first element","Always -s","Always -en"],"n":"das Fahrrad → die Fahrräder, because das Rad → die Räder.","r":"compound"},{"id":"c037","k":"concept","q":"What is the plural of das Krankenhaus?","ok":"Krankenhäuser","opts":["Krankenhäuser","Krankenhause","Krankenhausen","Krankenhaus"],"n":"The head is Haus → Häuser.","r":"compound"},{"id":"c038","k":"concept","q":"Which article do all plural nouns take in the nominative?","ok":"die","opts":["die","der","das","den"],"n":"Plural is always die in the nominative and accusative, regardless of the singular gender.","r":"general"},{"id":"c039","k":"concept","q":"What extra ending does the plural take in the dative case?","ok":"-n, unless the plural already ends in -n or -s","opts":["-n, unless the plural already ends in -n or -s","-e","-er","None"],"n":"mit den Kindern, mit den Büchern, but mit den Autos and mit den Frauen.","r":"general"},{"id":"c040","k":"concept","q":"What is the dative plural of das Kind?","ok":"den Kindern","opts":["den Kindern","den Kinder","den Kinds","dem Kinder"],"n":"Dative plural adds -n: den Kindern.","r":"general"},{"id":"c041","k":"concept","q":"What is the dative plural of das Auto?","ok":"den Autos","opts":["den Autos","den Autosn","den Auton","den Autoren"],"n":"Plurals in -s never add the dative -n.","r":"general"},{"id":"c042","k":"concept","q":"Which is the plural of die Bank meaning a bench?","ok":"Bänke","opts":["Bänke","Banken","Banks","Bänken"],"n":"die Bank (bench) → Bänke; die Bank (financial) → Banken.","r":"homograph"},{"id":"c043","k":"concept","q":"Which is the plural of die Bank meaning a financial institution?","ok":"Banken","opts":["Banken","Bänke","Banks","Bänker"],"n":"The financial Bank is regular and takes -en.","r":"homograph"},{"id":"c044","k":"concept","q":"Which plural of das Wort means individual vocabulary items?","ok":"Wörter","opts":["Wörter","Worte","Wörten","Wortes"],"n":"Wörter counts words; Worte means someone's words in a statement.","r":"homograph"},{"id":"c045","k":"concept","q":"Which plural of das Wort means someone's connected remarks?","ok":"Worte","opts":["Worte","Wörter","Wörte","Worten"],"n":"Seine letzten Worte: his last words.","r":"homograph"},{"id":"c046","k":"concept","q":"What is the plural of der Band, meaning a volume of a book?","ok":"Bände","opts":["Bände","Bänder","Bands","Bande"],"n":"der Band → Bände, das Band → Bänder, die Band → Bands.","r":"homograph"},{"id":"c047","k":"concept","q":"What is the plural of das Band, meaning a ribbon?","ok":"Bänder","opts":["Bänder","Bände","Bands","Bande"],"n":"das Band takes the neuter -er plus umlaut plural.","r":"homograph"},{"id":"c048","k":"concept","q":"Why does der Computer not take -s?","ok":"It ends in -er, and the -er rule wins","opts":["It ends in -er, and the -er rule wins","It is not a loanword","It is neuter","It is plural-only"],"n":"Loanwords in -er take the zero plural: die Computer, die Manager, die Container.","r":"s.loan"},{"id":"c049","k":"concept","q":"Why does der Film take -e rather than -s?","ok":"It is a fully naturalised loan","opts":["It is a fully naturalised loan","It is one syllable","It is not a loanword","It ends in a consonant"],"n":"Older, fully naturalised loans behave like native nouns: Filme, Busse, Telefone.","r":"s.loan"},{"id":"c050","k":"concept","q":"Which of these is a genuine masculine -er plural?","ok":"der Mann → die Männer","opts":["der Mann → die Männer","der Hund → die Hunder","der Tag → die Täger","der Arm → die Ärmer"],"n":"Männer, Wälder, Götter and Ränder are rare masculine -er plurals worth memorising.","r":"m.er_umlaut"},{"id":"c051","k":"concept","q":"Nouns in -tum such as der Irrtum take which plural?","ok":"-er with umlaut","opts":["-er with umlaut","-e","-en","-s"],"n":"Irrtum → Irrtümer, Reichtum → Reichtümer.","r":"m.er_umlaut"},{"id":"c052","k":"concept","q":"Which one-syllable feminine noun does NOT take umlaut + -e?","ok":"die Zeit","opts":["die Zeit","die Hand","die Nacht","die Stadt"],"n":"Zeit → Zeiten. The umlaut set is closed, so anything outside it takes the -en default.","r":"f.umlaut_e"},{"id":"c053","k":"concept","q":"What is the safest strategy when you do not know a plural?","ok":"Learn it with the noun, then fall back on gender and suffix","opts":["Learn it with the noun, then fall back on gender and suffix","Always add -en","Always add -e","Always add -s"],"n":"The rules cover most cases, but plurals are learned as part of the word.","r":"general"},{"id":"c054","k":"concept","q":"Which of these takes -s in the plural?","ok":"das Sofa","opts":["das Sofa","die Blume","der Apfel","das Buch"],"n":"Sofa ends in a vowel other than -e: Sofas.","r":"s.vowel"},{"id":"c055","k":"concept","q":"Which of these takes no ending in the plural?","ok":"der Löffel","opts":["der Löffel","der Hund","die Blume","das Buch"],"n":"Masculine -el: die Löffel, unchanged.","r":"m.er_el_en_zero"}]};
/* ---------------------------- app ---------------------------- */
const $ = s => document.querySelector(s);
const mk = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const ALL = DATA.items.concat(DATA.specials, DATA.concepts);
const BYID = new Map(ALL.map(i => [i.id, i]));
const RULE = new Map(DATA.rules.map(r => [r.id, r]));
const KEY = 'plurale.v1';
const CLASSES = ['-∅', '-e', '-er', '-(e)n', '-s', 'special'];

let S = {
  v: 1, states: {},
  meta: { sessions: 0, answers: 0, correct: 0, lastDay: null, streak: 0 },
  exams: [], settings: { size: 24, scope: 'all' }
};
let sess = null, exam = null, storageKind = 'memory', mapOpen = null;

/* ---------------------------- storage ---------------------------- */
const store = {
  async load() {
    try { if (window.storage) { const r = await window.storage.get(KEY, false); if (r && r.value) { storageKind = 'saved'; return JSON.parse(r.value); } } } catch (e) { }
    try { const raw = window.localStorage && localStorage.getItem(KEY); if (raw) { storageKind = 'saved'; return JSON.parse(raw); } } catch (e) { }
    return null;
  },
  async save(obj) {
    const str = JSON.stringify(obj);
    try { if (window.storage) { await window.storage.set(KEY, str, false); storageKind = 'saved'; return; } } catch (e) { }
    try { if (window.localStorage) { localStorage.setItem(KEY, str); storageKind = 'saved'; return; } } catch (e) { }
    storageKind = 'memory';
  }
};
let saveTimer = null;
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.save(S), 500); }
window.addEventListener('visibilitychange', () => { if (document.hidden) store.save(S); });

function st(id) { return S.states[id]; }
function setState(id, v) { S.states[id] = v; persist(); }

/* ---------------------------- pools ---------------------------- */
function pool(scope) {
  if (scope === 'all') return ALL;
  if (scope === 'nouns') return DATA.items;
  if (scope === 'concepts') return DATA.concepts;
  if (scope === 'traps') return DATA.items.filter(i => i.t);
  if (scope === 'trouble') return ALL.filter(i => { const s = st(i.id); return s && (s.lapse >= 2 || (s.seen >= 2 && level(s, i) === 1)); });
  return ALL.filter(i => i.r === scope);
}
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function touchDay() {
  const t = todayKey();
  if (S.meta.lastDay === t) return;
  const y = new Date(Date.now() - DAY); const yk = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate();
  S.meta.streak = (S.meta.lastDay === yk) ? (S.meta.streak || 0) + 1 : 1;
  S.meta.lastDay = t; persist();
}

/* ---------------------------- chrome ---------------------------- */
function hud() {
  const s = stats(ALL, S.states);
  $('#hud').innerHTML = '';
  const add = (label, val) => { const d = mk('div'); d.append(mk('b', null, val), document.createTextNode(' ' + label)); $('#hud').append(d); };
  add('mastered', s.m3 + '/' + s.total);
  add('solid', String(s.m2));
  add('due now', String(s.due));
  add('day streak', String(S.meta.streak || 0));
  add('accuracy', S.meta.answers ? Math.round(100 * S.meta.correct / S.meta.answers) + '%' : '—');
}
function show(view) {
  ['drill', 'map', 'exam', 'data'].forEach(v => {
    $('#view-' + v).classList.toggle('hide', v !== view);
    $('#tab-' + v).setAttribute('aria-selected', String(v === view));
  });
  hud();
  if (view === 'map') renderMap();
  if (view === 'exam') renderExamHome();
  if (view === 'data') renderData();
  if (view === 'drill' && !sess) renderStart();
}

/* ---------------------------- start screen ---------------------------- */
function renderStart() {
  const p = pool(S.settings.scope), s = stats(p, S.states);
  const v = $('#view-drill'); v.innerHTML = '';
  const panel = mk('div', 'panel');
  panel.append(mk('h2', null, 'Drill'));
  const sc = RULE.get(S.settings.scope);
  panel.append(mk('p', null, sc ? 'Scope: ' + sc.label
    : S.settings.scope === 'traps' ? 'Scope: the 52 nouns that break the rules you wrote down.'
      : S.settings.scope === 'trouble' ? 'Scope: everything you have got wrong more than once.'
        : S.settings.scope === 'concepts' ? 'Scope: the rules themselves, not the words.'
          : S.settings.scope === 'nouns' ? 'Scope: all 592 nouns.'
            : 'Everything: 592 nouns, 21 nouns with no singular or no plural, 56 rule questions.'));
  const g = mk('div', 'startgrid');
  [['due now', s.due], ['unseen', s.m0], ['solid', s.m2], ['mastered', s.m3 + '/' + s.total]].forEach(([l, n]) => {
    const d = mk('div', 'stat'); d.append(mk('b', null, String(n)), mk('span', null, l)); g.append(d);
  });
  panel.append(g);

  const row = mk('div', 'btnrow');
  const start = mk('button', 'pri', s.due ? 'Start session' : (s.m0 ? 'Learn new words' : 'Drill the weakest'));
  start.onclick = () => beginSession();
  row.append(start);

  const sel = mk('select');
  const opts = [['all', 'Everything'], ['nouns', 'Nouns only'], ['traps', 'Rule-breakers only'], ['trouble', 'My trouble words'], ['concepts', 'Rule questions']];
  DATA.rules.forEach(r => opts.push([r.id, '§' + r.sec + '  ' + r.label]));
  opts.forEach(([val, lab]) => { const o = mk('option', null, lab); o.value = val; if (val === S.settings.scope) o.selected = true; sel.append(o); });
  sel.onchange = () => { S.settings.scope = sel.value; persist(); renderStart(); };
  row.append(sel);

  const sz = mk('select');
  [12, 24, 40, 60].forEach(n => { const o = mk('option', null, n + ' cards'); o.value = n; if (n === S.settings.size) o.selected = true; sz.append(o); });
  sz.onchange = () => { S.settings.size = +sz.value; persist(); };
  row.append(sz);
  panel.append(row);

  const note = mk('div', 'note');
  note.innerHTML = s.due
    ? '<b>' + s.due + ' cards are ripe.</b> Reviewing them today is what turns them into memory.'
    : (s.m0 ? 'Nothing is due. New material it is.'
      : 'Nothing is due and nothing is new — so this will be a cram round over your weakest cards. It still helps, but the spacing is what makes it stick: come back tomorrow.');
  panel.append(note);
  v.append(panel);
}

/* ---------------------------- session ---------------------------- */
function beginSession() {
  touchDay();
  const q = buildQueue(pool(S.settings.scope), S.states, S.settings.size, Date.now());
  if (!q.length) { renderStart(); return; }
  sess = { queue: q.map(it => ({ it })), i: 0, right: 0, wrong: 0, done: new Set(), total: q.length, relearn: 0, chain: 0 };
  S.meta.sessions++;
  nextCard();
}
function nextCard() {
  if (!sess || sess.i >= sess.queue.length) return endSession();
  const entry = sess.queue[sess.i];
  const item = entry.it;
  entry.mode = entry.mode || pickMode(st(item.id), item);
  renderCard(entry);
}
function endSession() {
  const total = sess.right + sess.wrong;
  const v = $('#view-drill'); v.innerHTML = '';
  const panel = mk('div', 'panel');
  panel.append(mk('h2', null, 'Session done'));
  panel.append(mk('p', null, total ? Math.round(100 * sess.right / total) + '% correct across ' + total + ' answers, ' + sess.done.size + ' cards cleared.' : 'Nothing answered.'));
  const s = stats(ALL, S.states);
  const g = mk('div', 'startgrid');
  [['mastered', s.m3], ['solid', s.m2], ['still learning', s.m1], ['untouched', s.m0]].forEach(([l, n]) => {
    const d = mk('div', 'stat'); d.append(mk('b', null, String(n)), mk('span', null, l)); g.append(d);
  });
  panel.append(g);
  const next = ALL.map(i => st(i.id)).filter(x => x && x.due > Date.now()).sort((a, b) => a.due - b.due)[0];
  if (next) {
    const h = Math.max(1, Math.round((next.due - Date.now()) / 3600000));
    panel.append(mk('div', 'note', 'Next card ripens in about ' + (h < 48 ? h + ' hours' : Math.round(h / 24) + ' days') + '. Spacing is the part that does the work — short daily rounds beat long ones.'));
  }
  const row = mk('div', 'btnrow');
  const again = mk('button', 'pri', 'Another session'); again.onclick = () => beginSession();
  const back = mk('button', 'sec', 'Back to start'); back.onclick = () => { sess = null; renderStart(); };
  row.append(again, back); panel.append(row);
  v.append(panel);
  sess = null; hud(); store.save(S);
}

/* ---------------------------- the card ---------------------------- */
function artChip(a) { return mk('span', 'artchip ' + a, a === 'plu' ? 'die' : a); }
function wordSpans(word, idx, cls) {
  const f = document.createDocumentFragment();
  Array.from(word).forEach((ch, i) => {
    const s = mk('span', i === idx ? (cls || 'u') : null, ch); f.append(s);
  });
  return f;
}

      };
      g.append(b);
    });
    body.append(mk('div', 'steplabel', 'step 1 — which ending?'));
    body.append(g);
    const umlRow = mk('div', 'opts g3 hide');

/* ---------------------------- verdict ---------------------------- */
function resolve(entry, okFlag, detail, card) {
  const item = entry.it, mode = entry.mode;
  card.querySelectorAll('input,button.opt,button.key,button.go').forEach(b => { b.disabled = true; b.style.pointerEvents = 'none'; });
  S.meta.answers++; if (okFlag) S.meta.correct++;
  const before = level(st(item.id), item);
  setState(item.id, grade(st(item.id), okFlag, mode, Date.now()));
  const after = level(st(item.id), item);
  const NEXT = { article: 'class', class: 'produce' };
  if (okFlag) {
    sess.right++; sess.done.add(item.id);
    // a card met for the first time climbs gender -> class -> written form in one sitting
    if (item.k === 'noun' && NEXT[mode] && sess.chain < 40) {
      sess.chain++;
      sess.queue.splice(Math.min(sess.queue.length, sess.i + 5), 0, { it: item, mode: NEXT[mode] });
    }
  } else {
    sess.wrong++;
    if (sess.relearn < 40) {                       // wrong cards come back before the session ends
      sess.relearn++;
      const back = item.k !== 'noun' ? mode : (mode === 'article' || mode === 'class' ? mode : 'produce');
      sess.queue.splice(Math.min(sess.queue.length, sess.i + 4), 0, { it: item, mode: back });
    }
  }

  const v = mk('div', 'verdict anim-in');
  v.setAttribute('aria-live', 'polite');
  const head = mk('div', 'vhead ' + (okFlag ? 'ok' : 'bad'));
  head.append(mk('span', null, okFlag ? '✓ correct' : '✗ not yet'));
  if (detail && detail.kind && MISS_TEXT[detail.kind] && detail.kind !== 'exact') head.append(mk('span', null, MISS_TEXT[detail.kind]));
  if (after > before) head.append(mk('span', null, after === 3 ? '· mastered' : after === 2 ? '· now solid' : ''));
  v.append(head);

  if (item.k === 'noun') {
    if (detail && detail.typed && !okFlag) v.append(mk('div', 'vnote', 'You wrote “' + detail.typed + '”.'));
    v.append(buildStrip(item, mode));
    const r = RULE.get(item.r);
    const rn = mk('div', 'vrule');
    rn.append(mk('b', null, r ? r.label : ''));
    if (item.n) rn.append(document.createTextNode(' — ' + item.n));
    v.append(rn);
    const s = st(item.id), miss = missing(s, item);
    v.append(mk('div', 'mini', miss.length ? 'To master this: ' + miss.join(' · ') : 'Mastered. It will still come back occasionally.'));
  } else if (item.k === 'special') {
    const line = mk('div', 'vrule');
    line.append(mk('b', null, item.a + ' ' + item.s), document.createTextNode(' — ' + (item.typ === 'pluralonly' ? 'plural only, there is no everyday singular.' : 'singular only, there is no everyday plural.')));
    if (item.n) line.append(document.createTextNode(' ' + item.n));
    v.append(line);
  } else {
    const line = mk('div', 'vrule');
    line.append(mk('b', null, item.ok), document.createTextNode(' — ' + item.n));
    v.append(line);
  }

  const nav = mk('div', 'vnext');
  const nx = mk('button', 'go', 'Next  ⏎');
  nx.onclick = () => { sess.i++; nextCard(); };
  nav.append(nx);
  if (!okFlag) nav.append(mk('span', 'mini', 'this card comes back later in the session'));
  v.append(nav);
  card.append(v);
  nx.focus();
  hud();
}

/* the signature: stem + umlaut + ending = plural, as three separate decisions */
function buildStrip(item, mode) {
  const wrap = mk('div', 'build');
  const slot = (lab, val, on, drop) => {
    const d = mk('div', 'slot' + (on ? ' on' : ' off') + (drop ? ' drop' : ''));
    d.append(mk('span', 'lab', lab));
    const s = mk('span', 'val');
    if (val === '¨') { const dots = mk('span', 'dots'); dots.append(mk('i'), mk('i')); s.append(dots); }
    else s.textContent = val;
    d.append(s); return d;
  };
  if (item.c === 'special') {
    wrap.append(slot('form', item.s, false), mk('span', 'eq', '→'), slot('special', item.p, true));
  } else {
    wrap.append(slot('stem', item.s, true));
    wrap.append(mk('span', 'eq', '+'));
    wrap.append(slot('umlaut', item.u ? '¨' : '—', !!item.u, !!item.u));
    wrap.append(mk('span', 'eq', '+'));
    wrap.append(slot('ending', item.sf === '' ? '∅' : '-' + item.sf, true));
  }
  wrap.append(mk('span', 'eq', '='));
  const res = mk('span', 'res');
  res.append(document.createTextNode('die '));
  res.append(wordSpans(item.p, item.u ? item.ui : -1));
  wrap.append(res);
  if (item.alt && item.alt.length) wrap.append(mk('span', 'mini', 'also: ' + item.alt.join(', ')));
  return wrap;
}

/* ---------------------------- exam ---------------------------- */
function sampleExam(n) {
  const out = [], used = new Set();
  const pick = arr => { for (let k = 0; k < 40; k++) { const c = arr[Math.floor(Math.random() * arr.length)]; if (c && !used.has(c.id)) { used.add(c.id); return c; } } return null; };
  DATA.rules.forEach(r => { const p = DATA.items.filter(i => i.r === r.id); if (p.length) { const c = pick(p); if (c) out.push(c); } });
  while (out.length < n) { const c = pick(DATA.items); if (!c) break; out.push(c); }
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[out[i], out[j]] = [out[j], out[i]]; }
  return out.slice(0, n);
}

function renderExamResult() {
  const score = exam.answers.filter(a => a.ok).length, total = exam.answers.length;
  const byRule = {};
  exam.answers.forEach(a => { const it = BYID.get(a.id); byRule[it.r] = byRule[it.r] || [0, 0]; byRule[it.r][1]++; if (a.ok) byRule[it.r][0]++; });

  const weak = Object.entries(byRule).filter(([, [c, n]]) => c < n).sort((a, b) => (a[1][0] / a[1][1]) - (b[1][0] / b[1][1]));
  if (weak.length) {

    weak.slice(0, 6).forEach(([id, [c, n]]) => { const r = RULE.get(id); w.append(mk('div', null, (r ? r.label : id) + '  ' + c + '/' + n)); });
    panel.append(w);

  const row = mk('div', 'btnrow');

  const b2 = mk('button', 'sec', 'Exam again'); b2.onclick = () => startExam();
  row.append(b1, b2); panel.append(row);
  v.append(panel); exam = null; hud();
}

  };
  const im = mk('button', 'sec', 'Import from box');
  im.onclick = () => { try { const o = JSON.parse(ta.value); if (!o.states) throw 0; S = o; persist(); store.save(S); renderData(); hud(); } catch (e) { im.textContent = 'Not valid progress data'; setTimeout(() => im.textContent = 'Import from box', 1600); } };
  const rs = mk('button', 'sec', 'Reset everything');
  rs.onclick = () => {
    if (rs.dataset.armed) { S = { v: 1, states: {}, meta: { sessions: 0, answers: 0, correct: 0, lastDay: null, streak: 0 }, exams: [], settings: { size: 24, scope: 'all' } }; store.save(S); renderData(); hud(); }
    else { rs.dataset.armed = '1'; rs.textContent = 'Tap again to wipe'; setTimeout(() => { delete rs.dataset.armed; rs.textContent = 'Reset everything'; }, 3000); }
  };
  row.append(cp, im, rs); panel.append(row);
  panel.append(mk('div', 'note', 'Built from your notes: 592 nouns across 27 plural patterns, 21 nouns with only one number, 56 questions on the rules themselves.'));
  v.append(panel);
}

/* ---------------------------- keys ---------------------------- */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.target.tagName === 'BUTTON' && !e.target.disabled) return;   // the button itself handles Enter
  const v = document.querySelector('#view-drill:not(.hide), #view-exam:not(.hide)');
  if (!v) return;
  if (e.key === 'Enter' || e.key === ' ') {
    const nx = v.querySelector('.vnext .go');
    if (nx) { e.preventDefault(); nx.click(); return; }
  }
  if (/^[1-6]$/.test(e.key)) {
    const groups = Array.from(v.querySelectorAll('.opts')).filter(g => !g.classList.contains('hide'));
    const active = groups.reverse().find(g => Array.from(g.querySelectorAll('.opt')).some(b => !b.disabled));
    if (!active) return;
    const b = active.querySelectorAll('.opt')[+e.key - 1];
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  }
});

/* ---------------------------- boot ---------------------------- */
(async function () {
  const saved = await store.load();
  if (saved && saved.states) {
    S = Object.assign(S, saved);
    S.meta = Object.assign({ sessions: 0, answers: 0, correct: 0, lastDay: null, streak: 0 }, saved.meta || {});
    S.settings = Object.assign({ size: 24, scope: 'all' }, saved.settings || {});
  }
  ['drill', 'map', 'exam', 'data'].forEach(v => { $('#tab-' + v).onclick = () => show(v); });
  show('drill');
})();

</script>
