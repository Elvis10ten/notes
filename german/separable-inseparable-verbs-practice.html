<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Separable &amp; inseparable verbs — Practice</title>
<style>
  :root {
    --bg: #EDF0F2; --card: #FFFFFF; --ink: #16202A; --muted: #5F6B76; --line: #D6DCE1; --soft: #F3F5F7;
    --sep: #0E7C7B; --insep: #8A3B6E; --dual: #B7791F;
    --ok: #2C7A4B; --okbg: #E6F3EA; --bad: #B42318; --badbg: #FBE9E7; --focus: #1B6AC9;
    --b0: #C9D1D8; --b1: #A8C8C8; --b2: #7FB5B4; --b3: #4E9F9E; --b4: #2A8A89; --b5: #0E7C7B;
    --ui: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --de: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.45; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 56px; }
  header { margin-bottom: 14px; }
  h1 { font-family: var(--de); font-weight: 600; font-size: 28px; letter-spacing: 0.005em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .strip { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--b0); border: 1px solid var(--line); }
  .strip span { display: block; height: 100%; min-width: 0; }
  .strip-cap { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .strip-cap b { color: var(--ink); font-weight: 600; }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 18px; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 8px 12px; font: inherit; font-size: 15px; color: var(--muted); cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  nav button:focus-visible, .btn:focus-visible, .opt:focus-visible, input:focus-visible, .link:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
  .card + .card { margin-top: 14px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .head .mode { white-space: nowrap; }
  .head .mode.due { color: var(--sep); }
  .head .mode.ahead { color: var(--dual); }
  .prompt { font-size: 15px; margin: 0 0 12px; }
  .cues { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 16px; }
  .chip { font-family: var(--de); font-size: 21px; line-height: 1.2; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; }
  .chip.en { font-family: var(--ui); font-size: 15px; color: var(--muted); background: none; border-style: dashed; }
  .frame { font-family: var(--de); font-size: 22px; margin: 0 0 10px; }
  .frame .blank { display: inline-block; width: 7em; border-bottom: 2px solid var(--line); vertical-align: -3px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin: 0 0 14px; }
  .opt { display: flex; align-items: baseline; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 14px; font-family: var(--de); font-size: 20px; line-height: 1.3; color: var(--ink); cursor: pointer; }
  .opt .k { font-family: var(--ui); font-size: 12px; color: var(--muted); min-width: 14px; }
  .opt[aria-pressed="true"] { border-color: var(--ink); }
  .opt.ok { border-color: var(--ok); background: var(--okbg); }
  .opt.bad { border-color: var(--bad); background: var(--badbg); }
  .opt:disabled { cursor: default; }
  .opt:disabled:not(.ok):not(.bad) { color: var(--muted); }
  input.answer { width: 100%; font-family: var(--de); font-size: 21px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); margin: 0 0 14px; }
  input.answer.ok { border-color: var(--ok); background: var(--okbg); }
  input.answer.bad { border-color: var(--bad); background: var(--badbg); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row .spacer { flex: 1; }
  .btn { font: inherit; font-size: 15px; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  .btn.secondary { background: var(--card); color: var(--ink); border-color: var(--line); }
  .btn.danger { background: var(--card); color: var(--bad); border-color: var(--line); }
  .btn.small { font-size: 13px; padding: 6px 11px; font-weight: 500; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .link { background: none; border: 0; padding: 0; font: inherit; font-size: 14px; color: var(--focus); cursor: pointer; text-decoration: underline; }
  .hint { color: var(--muted); font-size: 13px; margin: 14px 0 0; }

  .fb { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
  .verdict { font-weight: 700; font-size: 15px; margin: 0 0 8px; }
  .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
  .typed-was { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
  .typed-was span { font-family: var(--de); font-size: 17px; text-decoration: line-through; }
  .solution { font-family: var(--de); font-size: 24px; line-height: 1.4; margin: 0 0 8px; }
  .solution .v { font-weight: 700; }
  .solution .brk { border-bottom: 2px solid; padding-bottom: 1px; }
  .solution.sep .v, .solution.sep .brk { color: var(--sep); border-color: var(--sep); }
  .solution.insep .v, .solution.insep .brk { color: var(--insep); border-color: var(--insep); }
  .solution.x .v { color: var(--ink); }
  .solution .rest { color: var(--ink); }
  .alt { font-size: 14px; color: var(--muted); margin: -4px 0 8px; }
  .alt span { font-family: var(--de); font-size: 17px; color: var(--ink); }
  .rule { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
  .move { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 4px; border: 1px solid; margin-left: 6px; vertical-align: middle; }
  .tag.sep { color: var(--sep); border-color: var(--sep); } .tag.insep { color: var(--insep); border-color: var(--insep); }

  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 18px; }
  .summary div { background: var(--soft); border-radius: 8px; padding: 10px 12px; }
  .summary b { display: block; font-size: 22px; font-weight: 700; }
  .summary span { font-size: 12px; color: var(--muted); }
  table.concepts { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.concepts th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  table.concepts td { padding: 6px; border-bottom: 1px solid var(--soft); vertical-align: middle; }
  table.concepts td.num { text-align: right; white-space: nowrap; }
  table.concepts .grp td { color: var(--muted); font-size: 12px; padding-top: 12px; border: 0; }
  .mini { display: flex; height: 9px; width: 130px; border-radius: 5px; overflow: hidden; background: var(--b0); }
  .mini span { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .msg { font-size: 14px; color: var(--muted); margin-top: 10px; }

  .test-bar { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .results li { margin: 6px 0; }
  .results .q { font-family: var(--de); font-size: 18px; }
  .results .a { font-size: 13px; color: var(--muted); }
  .score { font-size: 28px; font-weight: 700; margin: 4px 0 10px; }

  .rules h2 { font-size: 18px; margin: 22px 0 8px; }
  .rules h2:first-child { margin-top: 0; }
  .rules p, .rules li { font-size: 15px; }
  .rules table { border-collapse: collapse; width: 100%; margin: 8px 0 12px; font-size: 15px; }
  .rules th, .rules td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--soft); vertical-align: top; }
  .rules th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .rules .de { font-family: var(--de); font-size: 17px; }
  .rules .p { font-weight: 700; }
  .rules .p.sep { color: var(--sep); } .rules .p.insep { color: var(--insep); } .rules .p.dual { color: var(--dual); }
  .rules .note { background: var(--soft); border-radius: 8px; padding: 10px 14px; font-size: 14px; }

  @media (max-width: 560px) {
    .wrap { padding: 14px 12px 48px; }
    h1 { font-size: 24px; }
    .card { padding: 16px; }
    .summary { grid-template-columns: repeat(2, 1fr); }
    .mini { width: 90px; }
    table.concepts, .rules table { display: block; overflow-x: auto; }
    .opt { font-size: 18px; }
    .chip { font-size: 19px; }
    .solution { font-size: 22px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .opt, .btn { transition: background-color 120ms, border-color 120ms; }
  }
</style>
</head>

<div class="wrap">
  <header>
    <h1>Trennbare &amp; untrennbare Verben</h1>
    <p class="sub">Prefix verbs: which prefixes detach, where they go, and how the Partizip II and zu-infinitive are built.</p>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <div class="strip-cap" id="stripcap"></div>
  </header>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="practice" aria-selected="true">Practice</button>
    <button role="tab" data-tab="progress" aria-selected="false">Progress</button>
    <button role="tab" data-tab="test" aria-selected="false">Test</button>
    <button role="tab" data-tab="rules" aria-selected="false">Rules</button>
  </nav>
  <main id="app"></main>
</div>
<script>
/* Trennbare & untrennbare Verben — data layer.
   Everything German here is hand-written and cross-checked in test/test.js by an
   independent rule engine (participle / zu-form / finite-verb derivations).

   Frame verb fields:
     inf      infinitive as written (dual verbs appear twice, once per reading)
     pre      prefix (lower case)
     base     base verb infinitive
     type     'sep' | 'insep'
     dual     true when the prefix is one of the eight dual prefixes AND the verb has both readings
     en       English meaning
     aux      'haben' | 'sein' (Perfekt auxiliary)
     ge       does the base verb take ge- in its participle? (false for -ieren and for bases that are
              themselves inseparable-prefixed: bereiten, erkennen, bekommen)
     bpp      base participle WITHOUT ge- (rufen -> 'rufen', suchen -> 'sucht', stehen -> 'standen')
     pres     6 base finite forms (ich, du, er/sie/es, wir, ihr, sie/Sie) without the prefix
     imp      base du-imperative forms without the prefix, primary first (null: no imperative drilled)
     subj     subject as it appears in the sentence; si = index into pres (0..5)
     subjCue  how the subject is shown in a cue chip (defaults to subj)
     comp     complement (may contain {refl} which agrees with the subject)
     impComp  complement for the du-imperative (implicit subject = du)
     zuComp   complement for the zu-infinitive frame (defaults to comp; {refl} resolves to the frame's subject)
     zuFrame  index into ZU_FRAMES (default 0)
     sub      [main clause, conjunction] override for the subordinate clause (default 'dass')
     modal    modal verb for the modal context
     ctx      contexts drilled for this verb: pres sub perf modal futur zu imp
*/

const PREFIXES = {
  insep: ['be', 'emp', 'ent', 'er', 'ge', 'miss', 'ver', 'zer'],
  sep: ['ab', 'an', 'auf', 'aus', 'bei', 'ein', 'fest', 'her', 'hin', 'los', 'mit', 'nach', 'vor', 'weg',
    'weiter', 'zu', 'zurück', 'zusammen', 'fern', 'fort', 'statt', 'teil', 'vorbei', 'heraus', 'hinein', 'entlang', 'voran'],
  dual: ['durch', 'hinter', 'über', 'um', 'unter', 'voll', 'wider', 'wieder'],
};

// Base finite paradigms (ich, du, er/sie/es, wir, ihr, sie/Sie). Stem-changing verbs spelled out.
const P = {
  rufen: ['rufe', 'rufst', 'ruft', 'rufen', 'ruft', 'rufen'],
  suchen: ['suche', 'suchst', 'sucht', 'suchen', 'sucht', 'suchen'],
  stehen: ['stehe', 'stehst', 'steht', 'stehen', 'steht', 'stehen'],
  kaufen: ['kaufe', 'kaufst', 'kauft', 'kaufen', 'kauft', 'kaufen'],
  kommen: ['komme', 'kommst', 'kommt', 'kommen', 'kommt', 'kommen'],
  finden: ['finde', 'findest', 'findet', 'finden', 'findet', 'finden'],
  nehmen: ['nehme', 'nimmst', 'nimmt', 'nehmen', 'nehmt', 'nehmen'],
  sehen: ['sehe', 'siehst', 'sieht', 'sehen', 'seht', 'sehen'],
  ziehen: ['ziehe', 'ziehst', 'zieht', 'ziehen', 'zieht', 'ziehen'],
  gehen: ['gehe', 'gehst', 'geht', 'gehen', 'geht', 'gehen'],
  bringen: ['bringe', 'bringst', 'bringt', 'bringen', 'bringt', 'bringen'],
  fallen: ['falle', 'fällst', 'fällt', 'fallen', 'fallt', 'fallen'],
  tanken: ['tanke', 'tankst', 'tankt', 'tanken', 'tankt', 'tanken'],
  fehlen: ['fehle', 'fiehlst', 'fiehlt', 'fehlen', 'fehlt', 'fehlen'],       // emp-fehlen
  scheiden: ['scheide', 'scheidest', 'scheidet', 'scheiden', 'scheidet', 'scheiden'],
  klären: ['kläre', 'klärst', 'klärt', 'klären', 'klärt', 'klären'],
  hören: ['höre', 'hörst', 'hört', 'hören', 'hört', 'hören'],
  lingen: ['linge', 'lingst', 'lingt', 'lingen', 'lingt', 'lingen'],         // miss-lingen
  stören: ['störe', 'störst', 'stört', 'stören', 'stört', 'stören'],
  schreiben: ['schreibe', 'schreibst', 'schreibt', 'schreiben', 'schreibt', 'schreiben'],
  brechen: ['breche', 'brichst', 'bricht', 'brechen', 'brecht', 'brechen'],
  armen: ['arme', 'armst', 'armt', 'armen', 'armt', 'armen'],                // um-armen
  holen: ['hole', 'holst', 'holt', 'holen', 'holt', 'holen'],
  sprechen: ['spreche', 'sprichst', 'spricht', 'sprechen', 'sprecht', 'sprechen'],
  lassen: ['lasse', 'lässt', 'lässt', 'lassen', 'lasst', 'lassen'],
  fangen: ['fange', 'fängst', 'fängt', 'fangen', 'fangt', 'fangen'],
  laden: ['lade', 'lädst', 'lädt', 'laden', 'ladet', 'laden'],
  passen: ['passe', 'passt', 'passt', 'passen', 'passt', 'passen'],
  räumen: ['räume', 'räumst', 'räumt', 'räumen', 'räumt', 'räumen'],
  bereiten: ['bereite', 'bereitest', 'bereitet', 'bereiten', 'bereitet', 'bereiten'],
  probieren: ['probiere', 'probierst', 'probiert', 'probieren', 'probiert', 'probieren'],
  erkennen: ['erkenne', 'erkennst', 'erkennt', 'erkennen', 'erkennt', 'erkennen'],
  bekommen: ['bekomme', 'bekommst', 'bekommt', 'bekommen', 'bekommt', 'bekommen'],
  denken: ['denke', 'denkst', 'denkt', 'denken', 'denkt', 'denken'],
  schlafen: ['schlafe', 'schläfst', 'schläft', 'schlafen', 'schlaft', 'schlafen'],
  füllen: ['fülle', 'füllst', 'füllt', 'füllen', 'füllt', 'füllen'],
  lesen: ['lese', 'liest', 'liest', 'lesen', 'lest', 'lesen'],
  machen: ['mache', 'machst', 'macht', 'machen', 'macht', 'machen'],
  lernen: ['lerne', 'lernst', 'lernt', 'lernen', 'lernt', 'lernen'],
  zahlen: ['zahle', 'zahlst', 'zahlt', 'zahlen', 'zahlt', 'zahlen'],
  gessen: ['gesse', 'gisst', 'gisst', 'gessen', 'gesst', 'gessen'],         // ver-gessen
  zählen: ['zähle', 'zählst', 'zählt', 'zählen', 'zählt', 'zählen'],
  winnen: ['winne', 'winnst', 'winnt', 'winnen', 'winnt', 'winnen'],         // ge-winnen
  nachten: ['nachte', 'nachtest', 'nachtet', 'nachten', 'nachtet', 'nachten'], // über-nachten
  schuldigen: ['schuldige', 'schuldigst', 'schuldigt', 'schuldigen', 'schuldigt', 'schuldigen'],
  fahren: ['fahre', 'fährst', 'fährt', 'fahren', 'fahrt', 'fahren'],
  setzen: ['setze', 'setzt', 'setzt', 'setzen', 'setzt', 'setzen'],
  schauen: ['schaue', 'schaust', 'schaut', 'schauen', 'schaut', 'schauen'],
  halten: ['halte', 'hältst', 'hält', 'halten', 'haltet', 'halten'],
};

const MODALS = {
  müssen: ['muss', 'musst', 'muss', 'müssen', 'müsst', 'müssen'],
  können: ['kann', 'kannst', 'kann', 'können', 'könnt', 'können'],
  wollen: ['will', 'willst', 'will', 'wollen', 'wollt', 'wollen'],
  sollen: ['soll', 'sollst', 'soll', 'sollen', 'sollt', 'sollen'],
  dürfen: ['darf', 'darfst', 'darf', 'dürfen', 'dürft', 'dürfen'],
};
const HABEN = ['habe', 'hast', 'hat', 'haben', 'habt', 'haben'];
const SEIN = ['bin', 'bist', 'ist', 'sind', 'seid', 'sind'];
const WERDEN = ['werde', 'wirst', 'wird', 'werden', 'werdet', 'werden'];
const REFL = ['mich', 'dich', 'sich', 'uns', 'euch', 'sich'];

// zu-infinitive frames: [text before the comma, implicit subject index for {refl}]
const ZU_FRAMES = [
  ['Ich habe vor,', 0],
  ['Vergiss nicht,', 1],
  ['Es ist wichtig,', 2],
  ['Ich habe vergessen,', 0],
];

const VERBS = [
  // ---- separable, from the notes -------------------------------------------------------------
  { inf: 'anrufen', pre: 'an', base: 'rufen', type: 'sep', en: 'to call (on the phone)', aux: 'haben', ge: true, bpp: 'rufen',
    pres: P.rufen, imp: ['ruf', 'rufe'], subj: 'ich', si: 0, comp: 'dich', impComp: 'mich', modal: 'müssen',
    ctx: ['pres', 'sub', 'perf', 'modal', 'futur', 'zu', 'imp'] },
  { inf: 'aufstehen', pre: 'auf', base: 'stehen', type: 'sep', en: 'to get up', aux: 'sein', ge: true, bpp: 'standen',
    pres: P.stehen, imp: ['steh', 'stehe'], subj: 'ich', si: 0, comp: 'um sieben', impComp: 'jetzt', modal: 'müssen',
    sub: ['Ich bin müde,', 'weil'], ctx: ['pres', 'zu', 'imp'] },
  { inf: 'einkaufen', pre: 'ein', base: 'kaufen', type: 'sep', en: 'to shop, to go shopping', aux: 'haben', ge: true, bpp: 'kauft',
    pres: P.kaufen, imp: ['kauf', 'kaufe'], subj: 'wir', si: 3, comp: 'am Samstag', impComp: 'bitte Brot', modal: 'müssen',
    ctx: ['perf', 'futur', 'imp'] },
  { inf: 'mitkommen', pre: 'mit', base: 'kommen', type: 'sep', en: 'to come along', aux: 'sein', ge: true, bpp: 'kommen',
    pres: P.kommen, imp: ['komm', 'komme'], subj: 'du', si: 1, comp: 'ins Kino', impComp: 'ins Kino', modal: 'können',
    sub: ['Ich freue mich,', 'weil'], ctx: ['pres', 'modal', 'imp'] },
  { inf: 'stattfinden', pre: 'statt', base: 'finden', type: 'sep', en: 'to take place', aux: 'haben', ge: true, bpp: 'funden',
    pres: P.finden, imp: null, subj: 'das Konzert', si: 2, comp: 'am Freitag', modal: 'sollen',
    ctx: ['sub', 'futur', 'modal'] },
  { inf: 'teilnehmen', pre: 'teil', base: 'nehmen', type: 'sep', en: 'to take part, to participate', aux: 'haben', ge: true, bpp: 'nommen',
    pres: P.nehmen, imp: ['nimm'], subj: 'sie', subjCue: 'sie (she)', si: 2, comp: 'am Kurs', impComp: 'am Kurs', modal: 'wollen',
    ctx: ['sub', 'perf', 'zu'] },
  { inf: 'fernsehen', pre: 'fern', base: 'sehen', type: 'sep', en: 'to watch TV', aux: 'haben', ge: true, bpp: 'sehen',
    pres: P.sehen, imp: ['sieh'], subj: 'die Kinder', si: 5, comp: 'am Abend', impComp: 'nicht so viel', modal: 'dürfen',
    ctx: ['perf', 'modal', 'imp'] },
  { inf: 'umziehen', pre: 'um', base: 'ziehen', type: 'sep', en: 'to move house', aux: 'sein', ge: true, bpp: 'zogen',
    pres: P.ziehen, imp: null, subj: 'wir', si: 3, comp: 'nach Berlin', modal: 'wollen',
    ctx: ['futur', 'zu', 'modal'] },
  { inf: 'ankommen', pre: 'an', base: 'kommen', type: 'sep', en: 'to arrive', aux: 'sein', ge: true, bpp: 'kommen',
    pres: P.kommen, imp: null, subj: 'der Zug', si: 2, comp: 'um acht', modal: 'sollen',
    ctx: ['pres', 'sub', 'futur'] },
  { inf: 'umkommen', pre: 'um', base: 'kommen', type: 'sep', en: 'to perish, to die', aux: 'sein', ge: true, bpp: 'kommen',
    pres: P.kommen, imp: null, subj: 'viele Menschen', si: 5, comp: 'bei dem Unglück', modal: 'können',
    ctx: ['pres', 'sub', 'perf'] },
  { inf: 'vorkommen', pre: 'vor', base: 'kommen', type: 'sep', en: 'to occur, to happen', aux: 'sein', ge: true, bpp: 'kommen',
    pres: P.kommen, imp: null, subj: 'das', si: 2, comp: 'oft', modal: 'können',
    ctx: ['pres', 'perf', 'modal'] },
  { inf: 'untergehen', pre: 'unter', base: 'gehen', type: 'sep', en: 'to set (sun), to sink', aux: 'sein', ge: true, bpp: 'gangen',

      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'separable-verbs-progress-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },

    // ---------------------------------------------------------------- test
    startTest(n) {
      const items = Core.testSample(ITEMS, CONCEPTS, n);
      this.test = { items, idx: 0, answers: [], phase: 'run', cur: null };
      this.testLoad();
    },
    testLoad() {
      const t = this.test, item = t.items[t.idx];
      t.cur = { item, phase: 'answer', chosen: null, typed: '', correct: null,
        options: item.kind === 'mc' ? shuffle(item.options.map((x, i) => ({ t: x, correct: i === 0 }))) : null };
    },
    testAct(a) {
      const t = this.test, c = t.cur;
      if (a === 'check' && c.phase === 'answer') {
        if (c.item.kind === 'mc' && c.chosen == null) return;
        const inp = document.getElementById('tanswer'); if (inp) c.typed = inp.value;
        c.correct = this.grade(c.item, c);
        t.answers.push({ id: c.item.id, correct: c.correct, typed: c.typed, chosen: c.chosen == null ? null : c.options[c.chosen].t });
        if (!c.correct) { Core.resetItem(this.progress, c.item, Core.now()); this.save(); }
        c.phase = 'feedback'; this.render();
      } else if (a === 'next' && c.phase === 'feedback') {
        t.idx += 1;
        if (t.idx >= t.items.length) { this.finishTest(); } else { this.testLoad(); }
        this.render();
      }
    },
    finishTest() {
      const t = this.test;
      const by = {};
      for (const ans of t.answers) { const it = ITEMS.find(i => i.id === ans.id); const c = it.concept; by[c] = by[c] || { n: 0, ok: 0 }; by[c].n++; if (ans.correct) by[c].ok++; }
      const score = t.answers.filter(a => a.correct).length;
      this.progress.tests.push({ at: Core.now(), n: t.answers.length, score });
      while (this.progress.tests.length > 10) this.progress.tests.shift();
      this.save();
      t.phase = 'done'; t.by = by; t.score = score;
    },

    renderTest(app) {
      const t = this.test;
      let h = '<div class="card">';
      if (!t || t.phase === 'idle') {
        h += '<p class="prompt">A test draws items evenly across all concepts, in a random order, and does not move anything up a box. Any item you get wrong goes back to box 0 so the drill picks it up again.</p>';
        h += '<div class="row"><button class="btn" data-n="20">Start 20 questions</button><button class="btn secondary" data-n="40">Start 40 questions</button></div>';
        const hist = this.progress.tests;
        if (hist.length) {
          h += '<p class="hint">Recent tests: ' + hist.slice().reverse().map(x => x.score + '/' + x.n + ' (' + esc(fmtTime(x.at)) + ')').join(' · ') + '</p>';
        }
        h += '</div>';
        app.innerHTML = h;
        app.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => { this.startTest(+b.dataset.n); this.render(); }));
        return;
      }
      if (t.phase === 'done') {
        h += '<div class="test-bar"><span>Test finished</span></div>';
        h += '<div class="score">' + t.score + ' / ' + t.items.length + '</div>';
        h += '<table class="concepts"><thead><tr><th>Concept</th><th class="num">Score</th></tr></thead><tbody>';
        for (const c of CONCEPTS) { const s = t.by[c.id]; if (!s) continue; h += '<tr><td>' + esc(c.label) + '</td><td class="num">' + s.ok + ' / ' + s.n + '</td></tr>'; }
        h += '</tbody></table>';
        const wrong = t.answers.filter(a => !a.correct);
        if (wrong.length) {
          h += '<p class="prompt" style="margin-top:16px">To review (sent back to box 0):</p><ul class="results">';
          for (const w of wrong) { const it = ITEMS.find(i => i.id === w.id); h += '<li><div class="q">' + esc(it.solution.replace(/[\[\]]/g, '')) + '</div><div class="a">' + esc(conceptLabel(it.concept)) + ' · ' + esc(it.verb) + (w.typed ? ' · you wrote: ' + esc(w.typed) : w.chosen ? ' · you chose: ' + esc(w.chosen) : '') + '</div></li>'; }
          h += '</ul>';
        } else h += '<p class="prompt">Everything correct.</p>';
        h += '<div class="row" style="margin-top:14px"><button class="btn" data-act="again">New test</button></div></div>';
        app.innerHTML = h;
        app.querySelector('[data-act="again"]').addEventListener('click', () => { this.test = null; this.render(); });
        return;
      }
      const c = t.cur, it = c.item;
      h += '<div class="test-bar"><span>Question ' + (t.idx + 1) + ' of ' + t.items.length + '</span><span>' + esc(conceptLabel(it.concept)) + '</span></div>';
      h += '<p class="prompt">' + esc(it.prompt) + '</p>';
      if (it.frame) h += '<p class="frame">' + esc(it.frame) + ' <span class="blank"></span></p>';
      h += '<div class="cues">' + it.cue.map(x => '<span class="chip' + (/^(to |.* — )/.test(x) || it.concept === 'meaning' ? ' en' : '') + '">' + esc(x) + '</span>').join('') + '</div>';
      if (it.kind === 'mc') {
        h += '<div class="opts">' + c.options.map((o, i) => {
          let cls = 'opt';
          if (c.phase === 'feedback') { if (o.correct) cls += ' ok'; else if (c.chosen === i) cls += ' bad'; }
          return '<button class="' + cls + '" data-opt="' + i + '" aria-pressed="' + (c.chosen === i && c.phase === 'answer') + '"' + (c.phase === 'feedback' ? ' disabled' : '') + '><span class="k">' + (i + 1) + '</span><span>' + esc(o.t) + '</span></button>';
        }).join('') + '</div>';
      } else {
        const cls = c.phase === 'feedback' ? (c.correct ? ' ok' : ' bad') : '';
        h += '<input class="answer' + cls + '" id="tanswer" type="text" enterkeyhint="go" autocomplete="off" autocapitalize="off" spellcheck="false" lang="de" placeholder="Type your answer" value="' + esc(c.typed) + '"' + (c.phase === 'feedback' ? ' disabled' : '') + '>';
      }
      if (c.phase === 'answer') {
        const can = it.kind === 'mc' ? c.chosen != null : true;
        h += '<div class="row"><button class="btn" data-act="check"' + (can ? '' : ' disabled') + '>Check</button><span class="spacer"></span><button class="btn secondary small" data-act="abort">Stop test</button></div>';
      } else {
        h += '<div class="fb"><p class="verdict ' + (c.correct ? 'ok' : 'bad') + '">' + (c.correct ? 'Correct' : 'Not quite') + '</p>';
        if (it.kind === 'typed' && !c.correct && c.typed.trim()) h += '<p class="typed-was">You wrote <span>' + esc(c.typed) + '</span></p>';
        h += renderSolution(it.solution, it.type);
        h += '<p class="rule">' + esc(it.rule) + '</p>';
        h += '<div class="row"><button class="btn" data-act="next">Next</button></div></div>';
      }
      h += '</div>';
      app.innerHTML = h;
      app.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => { if (c.phase !== 'answer') return; c.chosen = +b.dataset.opt; this.render(); }));
      app.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
        if (b.dataset.act === 'abort') { this.test = null; this.render(); } else this.testAct(b.dataset.act);
      }));
      const inp = app.querySelector('#tanswer');
      if (inp) {
        inp.addEventListener('input', () => { c.typed = inp.value; });
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); this.testAct('check'); } });
        if (c.phase === 'answer') inp.focus();
      }
      if (c.phase === 'feedback') { const nb = app.querySelector('[data-act="next"]'); if (nb) nb.focus(); }
    },

    // ---------------------------------------------------------------- rules
    renderRules(app) {
      app.innerHTML = '<div class="card rules">' + RULES_HTML + '</div>';
    },
  };

  const RULES_HTML = `
<h2>One base verb, many prefixes</h2>
<p>German builds families of verbs by attaching a prefix to a base verb. The prefix changes the meaning; its <em>type</em> decides whether it detaches.</p>
<table><thead><tr><th>Base</th><th>+ prefix</th><th>Meaning</th></tr></thead><tbody>
<tr><td class="de">kommen</td><td class="de"><span class="p sep">an</span>kommen</td><td>to arrive</td></tr>
<tr><td></td><td class="de"><span class="p insep">be</span>kommen</td><td>to receive</td></tr>
<tr><td></td><td class="de"><span class="p sep">mit</span>kommen</td><td>to come along</td></tr>
<tr><td></td><td class="de"><span class="p insep">ent</span>kommen</td><td>to escape</td></tr>
<tr><td></td><td class="de"><span class="p sep">um</span>kommen</td><td>to perish</td></tr>
<tr><td></td><td class="de"><span class="p sep">vor</span>kommen</td><td>to occur, to happen</td></tr>
</tbody></table>
<ul><li><b>Separable</b> verbs: the prefix flies to the end of the clause when the verb is conjugated in position 2.</li>
<li><b>Inseparable</b> verbs: the prefix stays welded on, always.</li></ul>

<h2>Inseparable prefixes (never detach, unstressed)</h2>
<p class="de"><span class="p insep">be-</span> · <span class="p insep">emp-</span> · <span class="p insep">ent-</span> · <span class="p insep">er-</span> · <span class="p insep">ge-</span> · <span class="p insep">miss-</span> · <span class="p insep">ver-</span> · <span class="p insep">zer-</span></p>
<p class="de">besuchen · empfehlen · entscheiden · erklären · gehören · misslingen · verstehen · zerstören</p>

<h2>Separable prefixes (detach, stressed)</h2>
<p>Mostly prepositions or adverbs used as prefixes: <span class="de">ab-, an-, auf-, aus-, bei-, ein-, fest-, her-, hin-, los-, mit-, nach-, vor-, weg-, weiter-, zu-, zurück-, zusammen-, fern-, fort-, statt-, teil-, vorbei-, heraus-, hinein-, entlang-, voran-</span> … The prefix is always stressed: <span class="de">ÁNrufen</span>, but <span class="de">beSÚCHen</span>.</p>
<p class="de">anrufen · aufstehen · einkaufen · mitkommen · stattfinden · teilnehmen · fernsehen · umziehen</p>

<h2>Dual prefixes: separable or inseparable</h2>
<p class="de"><span class="p dual">durch-</span> · <span class="p dual">hinter-</span> · <span class="p dual">über-</span> · <span class="p dual">um-</span> · <span class="p dual">unter-</span> · <span class="p dual">voll-</span> · <span class="p dual">wider-</span> · <span class="p dual">wieder-</span></p>
<p>These go both ways and the difference is meaningful. Rough tendency: concrete / physical meaning → separable (prefix stressed); figurative / abstract meaning → inseparable (stem stressed).</p>
<table><thead><tr><th>Infinitive</th><th>Separable (stressed prefix)</th><th>Inseparable (stressed stem)</th></tr></thead><tbody>
<tr><td class="de">umfahren</td><td class="de">Ich fahre den Baum <b>um</b>. <span style="color:var(--muted)">(knock the tree down)</span></td><td class="de">Ich um<b>fah</b>re den Baum. <span style="color:var(--muted)">(drive around the tree)</span></td></tr>
<tr><td class="de">übersetzen</td><td class="de">Der Fährmann setzt uns <b>über</b>. <span style="color:var(--muted)">(ferries us across)</span></td><td class="de">Sie über<b>setzt</b> den Text. <span style="color:var(--muted)">(translates)</span></td></tr>
<tr><td class="de">durchschauen</td><td class="de">Ich schaue die Unterlagen <b>durch</b>. <span style="color:var(--muted)">(look through)</span></td><td class="de">Ich durch<b>schaue</b> dich. <span style="color:var(--muted)">(see through you)</span></td></tr>
<tr><td class="de">wiederholen</td><td class="de">Ich hole das Buch <b>wieder</b>. <span style="color:var(--muted)">(fetch it back)</span></td><td class="de">Ich wieder<b>hole</b> den Satz. <span style="color:var(--muted)">(repeat)</span></td></tr>
<tr><td class="de">unterhalten</td><td class="de">Er hält den Schirm <b>unter</b>. <span style="color:var(--muted)">(holds it underneath)</span></td><td class="de">Wir unter<b>halten</b> uns. <span style="color:var(--muted)">(we chat)</span></td></tr>
</tbody></table>
<p class="note">Treat the concrete/figurative split as a tendency, not a rule. <span class="de">umfahren</span> already breaks it: the inseparable reading (drive around) is perfectly spatial, while the separable one (knock down) involves physical contact. A better rough guide for inseparable readings: the prefix makes the object directly affected or "covered" by the action. Stress and meaning have to be learned verb by verb.</p>
<p>Fixed one-way members of these families:</p>
<table><thead><tr><th>Always separable</th><th>Always inseparable</th></tr></thead><tbody>
<tr><td class="de"><b>unter</b>gehen (to set, to sink)</td><td class="de">unter<b>schreiben</b> (to sign)</td></tr>
<tr><td class="de"><b>unter</b>bringen (to accommodate)</td><td class="de">unter<b>brechen</b> (to interrupt)</td></tr>
<tr><td class="de"><b>durch</b>fallen (to fail an exam)</td><td class="de">um<b>armen</b> (to hug)</td></tr>
<tr><td class="de"><b>um</b>ziehen (to move house)</td><td class="de">über<b>holen</b> (to overtake)</td></tr>
<tr><td class="de"><b>wieder</b>sehen (to see again)</td><td class="de">wider<b>sprechen</b> (to contradict)</td></tr>
<tr><td class="de"><b>voll</b>tanken (to fill the tank)</td><td class="de">hinter<b>lassen</b> (to leave behind)</td></tr>
</tbody></table>

<h2>Word order</h2>
<table><thead><tr><th>Context</th><th>Separable — anrufen</th><th>Inseparable — besuchen</th></tr></thead><tbody>
<tr><td>Present / Präteritum, main clause</td><td class="de">Ich <b>rufe</b> dich <b>an</b>.</td><td class="de">Ich <b>besuche</b> dich.</td></tr>
<tr><td>Subordinate clause</td><td class="de">…, weil ich dich <b>anrufe</b>.</td><td class="de">…, weil ich dich <b>besuche</b>.</td></tr>
<tr><td>Perfekt</td><td class="de">Ich habe dich <b>an</b>ge<b>rufen</b>.</td><td class="de">Ich habe dich <b>besucht</b>.</td></tr>
<tr><td>Modal verb</td><td class="de">Ich muss dich <b>anrufen</b>.</td><td class="de">Ich muss dich <b>besuchen</b>.</td></tr>
<tr><td>Futur I</td><td class="de">Ich werde dich <b>anrufen</b>.</td><td class="de">Ich werde dich <b>besuchen</b>.</td></tr>
<tr><td>zu-infinitive</td><td class="de">Ich vergaß, dich <b>anzurufen</b>.</td><td class="de">Ich vergaß, dich <b>zu besuchen</b>.</td></tr>
<tr><td>Imperative</td><td class="de"><b>Ruf</b> mich <b>an</b>!</td><td class="de"><b>Besuch</b> mich!</td></tr>
</tbody></table>

<h2>Partizip II in detail</h2>
<ul>
<li>Separable: prefix + <b>ge</b> + participle of the base: <span class="de">an·ge·rufen, auf·ge·standen, teil·ge·nommen, statt·ge·funden</span>.</li>
<li>Inseparable: no <b>ge-</b> at all: <span class="de">besucht, verstanden, empfohlen, entschieden, gehört, misslungen</span>.</li>
<li>Separable prefix on a base that never takes ge- (<span class="de">-ieren</span> verbs, or a base with its own inseparable prefix): no ge- anywhere: <span class="de">aus·probiert, vor·bereitet, an·erkannt, mit·bekommen</span>.</li>
<li>Dual verbs follow their reading: <span class="de">um·ge·fahren</span> (knocked down) vs. <span class="de">umfahren</span> (drove around); <span class="de">über·ge·setzt</span> vs. <span class="de">übersetzt</span>; <span class="de">wieder·ge·holt</span> vs. <span class="de">wiederholt</span>.</li>
<li>Auxiliary: movement and change of state take <span class="de">sein</span> — <span class="de">ist aufgestanden, angekommen, mitgekommen, zurückgekommen, umgezogen, eingeschlafen, durchgefallen, untergegangen, umgekommen, entkommen, misslungen</span>.</li>
</ul>

<h2>zu-infinitive in detail</h2>
<ul>
<li>Separable: <b>zu</b> slips between prefix and base, one word: <span class="de">an·zu·rufen, auf·zu·stehen, teil·zu·nehmen, aus·zu·probieren, mit·zu·bekommen</span>.</li>
<li>Inseparable: <b>zu</b> stands in front as a separate word: <span class="de">zu besuchen, zu verstehen, zu unterschreiben</span>.</li>
<li>Dual verbs: <span class="de">über·zu·setzen</span> (ferry across) vs. <span class="de">zu übersetzen</span> (translate).</li>
</ul>

<h2>Imperative</h2>
<p>Verb first, separable prefix last: <span class="de">Ruf mich an! · Steh auf! · Nimm teil! · Lade deine Freunde ein!</span> Inseparable verbs stay whole: <span class="de">Besuch mich! · Erklär mir die Regel! · Unterschreib hier!</span> The du-form <span class="de">-e</span> is optional for most verbs (<span class="de">Ruf / Rufe</span>), standard after stems in <span class="de">-d/-t</span> (<span class="de">Lade ein, Entscheide dich</span>), and dropped where the stem vowel changes (<span class="de">Nimm, Sieh, Lies, Vergiss, Empfiehl</span>).</p>
`;

  window.SEP_UI = UI;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => UI.boot()); else UI.boot();
})();
