<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Präteritum — ging, hatte, konnte</title>
<style>
:root{
  --paper:#EDEBE3; --card:#F8F7F2; --card-2:#E7E5DB;
  --ink:#1C1F1A; --ink-2:#5E635A; --ink-3:#8B9083;
  --rule:#D2D1C6; --rule-2:#BFBDB0;
  --acc:#2F4A8A; --acc-soft:#E1E7F4;
  --neg:#B3261E; --neg-soft:#F6E3E0;
  --yes:#2C6A48; --yes-soft:#E0EDE4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#15171A; --card:#1D2024; --card-2:#262A2F;
    --ink:#E9E7DF; --ink-2:#A8ADA3; --ink-3:#767C72;
    --rule:#333840; --rule-2:#454B54;
    --acc:#94ACEA; --acc-soft:#232B40;
    --neg:#E8776A; --neg-soft:#33211F;
    --yes:#7CC79B; --yes-soft:#1B2A22;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:2px}
[lang=de]{font-family:var(--serif)}
b{font-weight:600}
mark{background:none;color:var(--acc);font-weight:600}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* ---------- top rail ---------- */
.rail{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--rule)}
.rail-in{max-width:720px;margin:0 auto;padding:10px 20px 8px}
.rail-top{display:flex;align-items:baseline;gap:10px}
.wordmark{font-family:var(--serif);font-size:17px;white-space:nowrap}
.wordmark b{color:var(--acc);font-weight:600}
.rail-spacer{flex:1}
.navbtn{font-size:13px;color:var(--ink-2);padding:3px 8px;border-radius:4px}
.navbtn.on{color:var(--ink);background:var(--card-2)}
.persist-warn{margin-top:6px;font-size:12px;color:var(--neg);display:none}
.persist-warn.show{display:block}

main{max-width:720px;margin:0 auto;padding:18px 20px 60px}
section[hidden]{display:none}
h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;margin:6px 0 4px}
h2{font-family:var(--serif);font-weight:500;font-size:20px;margin:26px 0 8px}
h3{font-size:14px;font-weight:600;margin:16px 0 6px;color:var(--ink-2)}
p{margin:6px 0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.de{font-family:var(--serif)}

/* ---------- home ---------- */
.mastery{margin:14px 0 4px}
.bar{height:8px;background:var(--card-2);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b5{background:var(--yes)} .bar .b4{background:var(--acc)} .bar .b3{background:var(--acc);opacity:.7}
.bar .b2{background:var(--acc);opacity:.45} .bar .b1{background:var(--acc);opacity:.25} .bar .b0{background:var(--neg);opacity:.5}
.legend{font-size:12px;color:var(--ink-3);margin-top:4px}
.start{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 8px}
.btn{padding:9px 16px;border-radius:6px;background:var(--card);border:1px solid var(--rule-2);font-size:15px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:6px;overflow:hidden}
.seg button{padding:7px 12px;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--card-2);color:var(--ink)}
.topics{margin-top:20px;border-top:1px solid var(--rule)}
.topic{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:center}
.topic .name{font-weight:600}
.topic .blurb{font-family:var(--serif);color:var(--ink-2);font-size:14px;grid-column:1}
.topic .bar{margin-top:6px;height:5px;grid-column:1}
.topic .go{grid-row:1/4;align-self:center}
.topic .cnt{font-size:12px;color:var(--ink-3);grid-column:1;margin-top:2px}

/* ---------- drill ---------- */
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.prog .bar{flex:1}
.prog .bar i{background:var(--acc)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:20px 22px}
.instr{font-size:13px;color:var(--ink-2);margin-bottom:8px}
.prompt{font-family:var(--serif);font-size:24px;line-height:1.35;margin:4px 0 14px}
.prompt i{font-family:var(--serif)}
.prompt .gap{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink-3);text-align:center;color:var(--ink-3)}
.meaning{font-size:14px;color:var(--ink-3);font-family:var(--sans);margin-left:8px}
.cue{font-size:14px;color:var(--ink-2);margin-top:-6px;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:baseline;gap:12px;text-align:left;padding:10px 14px;border:1px solid var(--rule-2);border-radius:8px;background:var(--paper)}
.opt:hover{border-color:var(--ink-3)}
.opt .k{font-size:12px;color:var(--ink-3);min-width:1em}
.opt .t{font-family:var(--serif);font-size:19px}
.opt.en .t{font-family:var(--sans);font-size:16px}
.opt.yes{border-color:var(--yes);background:var(--yes-soft)}
.opt.no{border-color:var(--neg);background:var(--neg-soft)}
.opt:disabled{cursor:default}
.typed{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.txt{flex:1;min-width:180px;font-family:var(--serif);font-size:20px;padding:8px 12px;border:1px solid var(--rule-2);border-radius:6px;background:var(--paper)}
.txt.wide{flex-basis:100%}
.txt.yes{border-color:var(--yes);background:var(--yes-soft)}
.txt.no{border-color:var(--neg);background:var(--neg-soft)}
.gapin{width:7.5em;font-family:var(--serif);font-size:22px;padding:2px 6px;border:none;border-bottom:2px solid var(--rule-2);background:transparent;text-align:center}
.gapin.yes{border-color:var(--yes);color:var(--yes)} .gapin.no{border-color:var(--neg);color:var(--neg)}
.umlauts{display:flex;gap:6px;margin-top:10px}
.umlauts button{font-family:var(--serif);font-size:17px;padding:2px 10px;border:1px solid var(--rule);border-radius:5px;background:var(--paper)}
.table{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;max-width:420px}
.table label{font-family:var(--serif);font-size:17px;color:var(--ink-2);text-align:right}
.table .txt{font-size:18px;padding:6px 10px;min-width:0}
.table .exp{font-family:var(--serif);font-size:15px;color:var(--ink-2);grid-column:2;margin-top:-4px}
.actions{display:flex;gap:8px;margin-top:16px;align-items:center}
.actions .hint{font-size:12px;color:var(--ink-3);margin-left:auto}
.feedback{margin-top:16px;padding:14px 16px;border-left:3px solid var(--rule-2);background:var(--paper);border-radius:0 8px 8px 0}
.feedback.yes{border-color:var(--yes)} .feedback.no{border-color:var(--neg)}
.feedback .verdict{font-weight:600;margin-bottom:6px}
.feedback.yes .verdict{color:var(--yes)} .feedback.no .verdict{color:var(--neg)}
.feedback .ans{font-family:var(--serif);font-size:19px;margin:4px 0 8px}
.feedback .why{font-size:14px;color:var(--ink-2)}
.feedback .why i{font-family:var(--serif);font-style:italic;color:var(--ink)}
.ladder{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-family:var(--serif);font-size:19px;margin:8px 0 10px}
.ladder .rung{display:inline-flex;flex-direction:column;align-items:flex-start}
.ladder .lab{font-family:var(--sans);font-size:11px;color:var(--ink-3)}
.ladder .arr{color:var(--ink-3);font-size:15px}
.forms6{font-family:var(--serif);font-size:15px;color:var(--ink-2);margin-top:4px}
.forms6 span{white-space:nowrap;margin-right:12px}

/* ---------- rules ---------- */
.rules p, .rules li{font-size:15px}
.rules i{font-family:var(--serif);color:var(--ink)}
.rules table{border-collapse:collapse;margin:8px 0 14px;font-size:14px;width:100%}
.rules th{text-align:left;font-weight:600;color:var(--ink-2);padding:4px 10px 4px 0;border-bottom:1px solid var(--rule-2);font-size:13px}
.rules td{padding:4px 10px 4px 0;border-bottom:1px solid var(--rule);font-family:var(--serif);font-size:15px}
.rules td.en{font-family:var(--sans);font-size:13px;color:var(--ink-2)}
.group{margin:16px 0}
.group h3{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--ink);margin:14px 0 4px}
.group h3 mark{font-weight:500}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 16px}
.stamm{font-family:var(--serif);font-size:15px;padding:3px 0;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:8px}
.stamm .m{font-family:var(--sans);font-size:12px;color:var(--ink-3);text-align:right}

/* ---------- progress ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0 16px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.stat .n{font-family:var(--serif);font-size:26px;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink-2)}
.leech{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}
.leech .de{font-size:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
textarea.io{width:100%;height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;margin-top:8px;border:1px solid var(--rule-2);border-radius:6px;background:var(--card);color:var(--ink);padding:8px}

/* ---------- summary ---------- */
.big{font-family:var(--serif);font-size:44px;line-height:1;margin:12px 0}
.lapses{margin:12px 0}
.lapse{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}
</style>
</head>
<body>
<div class="rail"><div class="rail-in">
  <div class="rail-top">
    <span class="wordmark">Präteritum <b>ging · hatte · konnte</b></span>
    <span class="rail-spacer"></span>
    <button class="navbtn" data-nav="home">Home</button>
    <button class="navbtn" data-nav="rules">Rules</button>
    <button class="navbtn" data-nav="progress">Progress</button>
  </div>
  <div class="persist-warn" id="persist-warn">Progress is not being saved here — open this file directly in your browser to keep it.</div>
</div></div>
<main>
  <section id="view-home"></section>
  <section id="view-drill" hidden></section>
  <section id="view-rules" hidden></section>
  <section id="view-progress" hidden></section>
  <section id="view-summary" hidden></section>
</main>

/* ============================ storage ============================ */
const KEY = "praeteritum.v1";
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
let PERSISTS = true;
try{ localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe"); }
catch(e){ PERSISTS = false; }

/* ============================ model ============================== */
const DAY = 86400000;
// Leitner boxes. 0 = new or just lapsed, 5 = mastered. A box is only left when
// the item is due, so five correct answers must be spread over ≥ 11 days.
const IVL = [0, 10*60000, 1*DAY, 3*DAY, 7*DAY, 21*DAY];
const MASTER_BOX = 5;
let NOW = () => Date.now();

let S = load();
function blank(){
  return {v:1, items:{}, stats:{answered:0, correct:0, sessions:0, days:{}, lastDay:null, streak:0}};
}
function load(){
  try{
    const raw = store.get(KEY);
    if(!raw) return blank();
    const p = JSON.parse(raw);
    if(!p || p.v !== 1) return blank();
    p.items = p.items || {}; p.stats = Object.assign(blank().stats, p.stats || {});
    p.stats.days = p.stats.days || {};
    return p;
  }catch(e){ return blank(); }
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ store.set(KEY, JSON.stringify(S)); }, 120);
}
function saveNow(){ clearTimeout(saveTimer); store.set(KEY, JSON.stringify(S)); }
function rec(id){
  if(!S.items[id]) S.items[id] = {b:0, due:0, s:0, c:0, w:0, lap:0, seen:0};
  return S.items[id];
}
const boxOf = id => (S.items[id] ? S.items[id].b : 0);
const seen = id => !!(S.items[id] && S.items[id].seen > 0);
const isMastered = id => boxOf(id) >= MASTER_BOX;
const isDue = id => { const r = S.items[id]; return !r || r.seen === 0 || r.due <= NOW(); };
const dueAt = id => (S.items[id] ? S.items[id].due : 0);

function dayKey(t){ const d = new Date(t); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function touchDay(){
  const k = dayKey(NOW());
  const st = S.stats;
  if(st.lastDay !== k){
    const y = dayKey(NOW() - DAY);
    st.streak = (st.lastDay === y) ? st.streak + 1 : 1;
    st.lastDay = k;
  }
  st.days[k] = (st.days[k] || 0) + 1;
}

/** Record an answer. Promotion only happens when the item was due. */
function record(id, ok, wasDue){
  const r = rec(id);
  r.seen++;
  S.stats.answered++;
  touchDay();
  if(ok){
    r.c++; r.s++; S.stats.correct++;
    if(wasDue){
      r.b = Math.min(MASTER_BOX, r.b + 1);
      r.due = NOW() + IVL[r.b];
    }
  }else{
    r.w++; r.s = 0; r.lap++;
    r.b = 0; r.due = NOW();
  }
  save();
  return r;
}

/* ============================ normalisation ===================== */
function norm(s){
  s = (s || "").toLowerCase();
  s = s.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
  s = s.replace(/…/g," ").replace(/\.\.\./g," ");
  s = s.replace(/[.,!?;:„“”"'’]/g," ");
  return s.split(/\s+/).filter(Boolean).join(" ");
}
function sameAnswer(a, b){ return norm(a) === norm(b); }

/* ============================ questions ========================= */
let rng = Math.random;
function pick(arr){ return arr[Math.floor(rng()*arr.length)]; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const PWEIGHT = [2,1,2,1,1,1];
function weightedPerson(item){
  const allowed = item.persons || [0,1,2,3,4,5];
  const tot = allowed.reduce((a,i)=>a+PWEIGHT[i],0); let r = rng()*tot;
  for(const i of allowed){ r -= PWEIGHT[i]; if(r<0) return i; } return allowed[allowed.length-1];
}
function pickPerson(item, wanted){
  const allowed = item.persons || [0,1,2,3,4,5];
  const c = wanted.filter(i => allowed.includes(i));
  return pick(c.length ? c : allowed);
}
function praetDisplay(q, pi, form){
  const f = form || q.forms[pi][0];
  return q.sep ? f + " … " + q.sep : f;
}
function praetAccepted(q, pi){
  return q.forms[pi].map(f => q.sep ? f + " " + q.sep : f);
}

/** Build the concrete question shown for an item, depending on its box. */
function makeQ(item, box, mode){
  if(item.kind !== "verb") return {item, kind:item.kind};
  if(mode === "exam") box = Math.max(box, 3);
  const noTable = item.sep || (item.persons && item.persons.length < 6);
  let v;
  if(box <= 0) v = "mc";
  else if(box === 1) v = "typed1";
  else if(box === 2) v = "typed";
  else if(box === 3) v = "typedHard";
  else if(box === 4) v = (noTable || rng() < 0.4) ? "stamm" : "table";
  else v = pick(noTable ? ["typed","stamm"] : ["typed","stamm","table"]);
  if(v === "mc"){
    const pi = weightedPerson(item);
    const opts = shuffle([praetDisplay(item, pi)].concat(item.dis[pi].slice(0,3).map(d => (item.sep && !d.startsWith(item.sep)) ? d + " … " + item.sep : d)));
    return {item, kind:"vmc", pi, opts, correct: praetDisplay(item, pi)};
  }
  if(v === "typed1") return {item, kind:"vtyped", pi: pickPerson(item, [0,2])};
  if(v === "typed") return {item, kind:"vtyped", pi: pickPerson(item, [0,1,2,3,4,5])};
  if(v === "typedHard") return {item, kind:"vtyped", pi: pickPerson(item, [1,3,4,5])};
  if(v === "stamm") return {item, kind:"vstamm"};
  return {item, kind:"vtable"};
}

/* ============================ session =========================== */
const RATIO = {verb:3, sent:2, trans:1, rules:1};
function newOrder(){
  // curriculum order for unseen items: verbs in topic order, sentences,
  // transformations and rules interleaved 3:2:1:1 so a session mixes kinds.
  const lanes = {
    verb: VERB_TOPICS.flatMap(t => BY_TOPIC[t]).filter(q => !seen(q.id)),
    sent: BY_TOPIC.sent.filter(q => !seen(q.id)),
    trans: BY_TOPIC.trans.filter(q => !seen(q.id)),
    rules: BY_TOPIC.rules.filter(q => !seen(q.id)),
  };
  const out = [];
  while(Object.values(lanes).some(l => l.length)){
    for(const k of ["verb","sent","trans","rules"]){
      for(let i=0;i<RATIO[k] && lanes[k].length;i++) out.push(lanes[k].shift());
    }
  }
  return out;
}
function dueItems(pool){
  return pool.filter(q => seen(q.id) && dueAt(q.id) <= NOW())
             .sort((a,b) => (boxOf(a.id)-boxOf(b.id)) || (dueAt(a.id)-dueAt(b.id)));
}
function buildSession(mode, len, topic){
  let pool = BANK, list = [];
  if(mode === "topic"){ pool = BY_TOPIC[topic]; }
  if(mode === "exam"){
    // stratified: two per topic, never MC for verbs
    const per = Math.max(1, Math.round(30 / TOPIC_ORDER.length));
    TOPIC_ORDER.forEach(t => { list = list.concat(shuffle(BY_TOPIC[t]).slice(0, per)); });
    list = shuffle(list).slice(0, 30);
  }else if(mode === "leech"){
    list = BANK.filter(q => (S.items[q.id]||{}).lap >= 2)
               .sort((a,b) => S.items[b.id].lap - S.items[a.id].lap).slice(0, len);
  }else{
    const due = dueItems(pool);
    const fresh = (mode === "topic") ? pool.filter(q => !seen(q.id)) : newOrder();
    list = due.slice(0, len);
    if(list.length < len) list = list.concat(fresh.slice(0, len - list.length));
    if(list.length < len){
      const have = new Set(list.map(q => q.id));
      const rest = pool.filter(q => !have.has(q.id)).sort((a,b) => (boxOf(a.id)-boxOf(b.id)) || (dueAt(a.id)-dueAt(b.id)));
      list = list.concat(rest.slice(0, len - list.length));
    }
    // keep due first, but don't cluster ten identical verb tables: light shuffle of the new part
    const nd = list.filter(q => isDue(q.id) && seen(q.id)).length;
    list = list.slice(0, nd).concat(shuffle(list.slice(nd)));
  }
  return {
    mode, topic, len: list.length,
    queue: list.map(q => ({id:q.id, wasDue:isDue(q.id), tries:0})),
    pos: 0, answered: 0, correct: 0, lapses: [], firstTry: {}, done: false, startedAt: NOW()
  };
}

/* ============================ checking ========================= */
function checkTyped(q, values){
  // values: array of strings, one per input. Returns {ok, expected:[..], perInput:[bool]}
  const it = q.item;
  if(q.kind === "vtyped"){
    const acc = praetAccepted(it, q.pi);
    const ok = acc.some(a => sameAnswer(a, values[0]));
    return {ok, expected:[praetDisplay(it, q.pi)], perInput:[ok]};
  }
  if(q.kind === "vstamm"){
    const acc = praetAccepted(it, 2);
    const ok1 = acc.some(a => sameAnswer(a, values[0]));
    const ok2 = sameAnswer(it.pp, values[1]);
    return {ok: ok1 && ok2, expected:[praetDisplay(it, 2), it.pp], perInput:[ok1, ok2]};
  }
  if(q.kind === "vtable"){
    const per = [], exp = [];
    for(let i=0;i<6;i++){
      per.push(it.forms[i].some(a => sameAnswer(a, values[i])));
      exp.push(it.forms[i][0]);
    }
    return {ok: per.every(Boolean), expected: exp, perInput: per};
  }
  if(q.kind === "gaps"){
    const per = it.answers.map((g, i) => g.some(a => sameAnswer(a, values[i])));
    return {ok: per.every(Boolean), expected: it.answers.map(g => g[0]), perInput: per};
  }
  if(q.kind === "typed"){
    const ok = it.answers.some(a => sameAnswer(a, values[0]));
    const alt = !ok && (it.alt || []).some(a => sameAnswer(a, values[0]));
    return {ok: ok || alt, alt, expected:[it.answers[0]], perInput:[ok || alt]};
  }
  return {ok:false, expected:[], perInput:[]};
}
function checkMC(q, choice){
  const it = q.item;
  if(q.kind === "vmc") return {ok: sameAnswer(choice, q.correct), expected:[q.correct]};
  return {ok: sameAnswer(choice, it.correct), expected:[it.correct]};
}

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let VIEW = "home";

function show(view){

  document.querySelectorAll(".navbtn").forEach(b => b.classList.toggle("on", b.dataset.nav === view));

function boxCounts(list){
  const c = [0,0,0,0,0,0];
  list.forEach(q => c[boxOf(q.id)]++);
  return c;
}
function barHTML(list){
  const c = boxCounts(list), n = list.length || 1;
  return '<div class="bar">' + [5,4,3,2,1].map(b => '<i class="b'+b+'" style="width:'+(100*c[b]/n)+'%"></i>').join("") +
         '<i class="b0" style="width:'+(100*(list.filter(q=>seen(q.id)&&boxOf(q.id)===0).length)/n)+'%"></i></div>';
}
function fmtWhen(t){
  const d = t - NOW();
  if(d <= 0) return "now";
  if(d < 3600000) return "in " + Math.max(1, Math.round(d/60000)) + " min";
  if(d < DAY) return "in " + Math.round(d/3600000) + " h";
  return "in " + Math.round(d/DAY) + " d";
}
function nextDue(){
  let t = Infinity;
  BANK.forEach(q => { const r = S.items[q.id]; if(r && r.seen>0 && r.due > NOW() && r.due < t) t = r.due; });
  return t;
}

  S.stats.sessions++; save();
  show("drill"); nextQ();

function nextQ(){
  FB = null;

function promptWithGaps(prompt, answers, results){

let lastInput = null;
function inputs(){ return Array.from(document.querySelectorAll("#view-drill input")).sort((a,b)=>(+a.dataset.i)-(+b.dataset.i)); }

function answerMC(idx){
  if(FB) return;
  const it = Q.item;
  const choice = Q.kind === "vmc" ? Q.opts[idx] : it.options[idx];
  const res = checkMC(Q, choice);
  document.querySelectorAll("#view-drill .opt").forEach((b,i) => {
    b.disabled = true;
    const txt = Q.kind === "vmc" ? Q.opts[i] : it.options[i];
    if(sameAnswer(txt, res.expected[0])) b.classList.add("yes");
    else if(i === idx) b.classList.add("no");
  });
  finishAnswer(res);
}
function answerTyped(){
  if(FB) return;
  const vals = inputs().map(i => i.value);
  if(vals.every(v => !v.trim())) return;
  const res = checkTyped(Q, vals);
  const ins = inputs();
  ins.forEach((inp, i) => { inp.disabled = true; inp.classList.add(res.perInput[i] ? "yes" : "no"); });
  if(Q.kind === "vtable" || Q.kind === "vstamm"){
    // show expected next to wrong rows
    ins.forEach((inp, i) => {
      if(!res.perInput[i]){
        const e = document.createElement("div"); e.className = "exp"; e.setAttribute("lang","de"); e.textContent = "→ " + res.expected[i];
        inp.insertAdjacentElement("afterend", e);
      }
    });
  }
  if(Q.kind === "gaps"){
    $("#view-drill .prompt").innerHTML = promptWithGaps(Q.item.prompt, Q.item.answers, res);
  }
  finishAnswer(res);
}
function finishAnswer(res){
  const it = Q.item, e = Q.entry, s = SESSION;
  const first = !(e.id in s.firstTry);
  if(first) s.firstTry[e.id] = res.ok;
  s.answered++;
  if(res.ok && first) s.correct++;
  const r = record(e.id, res.ok, e.wasDue);
  if(!res.ok){
    if(first) s.lapses.push(e.id);
    e.tries++;
    if(e.tries <= 2){
      const at = Math.min(s.queue.length, s.pos + 4 + Math.floor(rng()*3));
      s.queue.splice(at, 0, {id:e.id, wasDue:true, tries:e.tries});
    }
  }
  FB = res;
  renderFeedback(res, r);
}
function renderFeedback(res, r){
  const it = Q.item;
  let html = '<div class="feedback '+(res.ok?'yes':'no')+'"><div class="verdict">'+(res.ok ? (res.alt ? "Accepted." : "Right.") : "Not quite.")+'</div>';
  if(it.kind === "verb"){
    if(Q.kind !== "vtable") html += '<div class="ans" lang="de">'+esc(Q.kind==="vstamm" ? praetDisplay(it,2)+" · "+it.pp : Q.kind==="vmc" ? personLabel(Q.pi)+" "+Q.correct : personLabel(Q.pi)+" "+praetDisplay(it,Q.pi))+(Q.kind==="vtyped"&&it.forms[Q.pi].length>1?' <span class="muted small">(also '+esc(it.forms[Q.pi].slice(1).join(", "))+')</span>':'')+'</div>';
    html += ladderHTML(it) + forms6HTML(it);
    html += '<div class="why">'+it.why+'</div>';
  }else if(it.kind === "gaps"){
    html += '<div class="why">'+it.why+'</div>';
  }else if(it.kind === "typed"){
    html += '<div class="ans" lang="de">'+esc(it.answers[0])+(it.answers.length>1?' <span class="muted small">(or '+esc(it.answers.slice(1).join(", "))+')</span>':'')+'</div>';
    if(res.alt) html += '<div class="why">'+(it.altWhy||"")+'</div>';
    html += '<div class="why">'+it.why+'</div>';
  }else{
    html += '<div class="ans" '+(it.enOpts?'':'lang="de"')+'>'+esc(it.correct)+'</div><div class="why">'+it.why+'</div>';
  }
  const bx = r.b;
  html += '<div class="small muted" style="margin-top:8px">'+(res.ok ? (Q.entry.wasDue ? 'Box '+bx+(bx>=MASTER_BOX?' — mastered':' · next '+fmtWhen(r.due)) : 'Not due yet — no box change') : 'Back to box 0 — it will come up again in this round') +
    (SESSION.mode==="exam"?' · exam':'')+'</div>';
  html += '<div class="actions"><button class="btn primary" data-next="1">Next</button><span class="hint">Enter</span></div></div>';
  $("#fb").innerHTML = html;
  $("[data-next]").focus();
}
function finish(){

  $("#view-summary").innerHTML = html;

/* ---------- rules ---------- */
function renderRules(){
  const verbs = BANK.filter(q => q.kind === "verb");
  const byTopic = {}; VERB_TOPICS.forEach(t => byTopic[t] = verbs.filter(v => v.topic === t));
  const stammList = t => '<div class="grid3">' + byTopic[t].map(v => {

    return '<div class="stamm" lang="de"><span>'+hl(v.inf,v.marks.inf)+' · '+hl(v.praet,v.marks.praet)+(v.sep?' … '+esc(v.sep):'')+' · '+hl(v.pp,v.marks.pp)+'</span><span class="m">'+esc(v.meaning)+'</span></div>';
  }).join("") + '</div>';
  let h = '<div class="rules"><h1>The rules</h1>';
  h += '<h2>What it is</h2><p>The Präteritum is the one-word past tense: <i>ich ging, er hatte, wir konnten</i>. It refers to the same time as the Perfekt — the difference is <b>register</b>, not meaning.</p>' +
    '<table><tr><th></th><th>Präteritum</th><th>Perfekt</th></tr>' +
    '<tr><td class="en">Typical use</td><td class="en">Written narrative: stories, novels, news, biographies, fairy tales, formal reports</td><td class="en">Spoken German and informal writing (messages, chat, emails)</td></tr>' +
    '<tr><td class="en">Example</td><td>Er öffnete die Tür und sah niemanden.</td><td>Ich habe gestern Pizza gegessen.</td></tr></table>' +
    '<p><b>Exception:</b> <i>sein, haben, werden</i>, the modal verbs and <i>wissen</i> are used in the Präteritum even in speech: <i>Ich war krank. Ich hatte keine Zeit. Ich konnte nicht kommen. Ich wusste das nicht.</i></p>';
  h += '<h2>Formation</h2><table><tr><th>Type</th><th>Stem</th><th>Endings</th><th>Example</th></tr>' +
    '<tr><td class="en">Weak</td><td class="en">no change</td><td>-te, -test, -te, -ten, -tet, -ten</td><td>machen → machte</td></tr>' +
    '<tr><td class="en">Strong</td><td class="en">vowel change</td><td>—, -st, —, -en, -t, -en</td><td>gehen → ging</td></tr>' +
    '<tr><td class="en">Mixed</td><td class="en">vowel change <b>and</b> -te</td><td>-te, -test, -te, -ten, -tet, -ten</td><td>bringen → brachte</td></tr></table>' +
    '<ul><li><i>ich</i> and <i>er/sie/es</i> are always identical: <i>ich ging / er ging; ich machte / sie machte</i>.</li>' +
    '<li>Strong verbs get no ending in the 1st and 3rd person singular.</li>' +
    '<li>Prefixed verbs follow their base verb: <i>verstehen → verstand, ankommen → kam … an, bekommen → bekam</i>.</li>' +
    '<li>Separable prefix: at the end of a main clause (<i>Er kam um acht an</i>), one word in a subordinate clause (<i>…, als er um acht ankam</i>).</li></ul>';
  h += '<h3>Weak: the -e- insertion</h3><p>If the stem ends in <b>-t / -d</b>, or in <b>-m / -n after another consonant</b> (not l or r), insert -e-: <i>arbeitete, redete, öffnete, atmete, rechnete, es regnete</i>. But: <i>lernte, wohnte, filmte</i>.</p>' +
    '<table><tr><th></th><th>machen</th><th>arbeiten</th></tr>' + PERSONS.map((p,i) => '<tr><td>'+esc(p)+'</td><td>'+esc(BY_ID["v-machen"].forms[i][0])+'</td><td>'+esc(BY_ID["v-arbeiten"].forms[i][0])+'</td></tr>').join("") + '</table>';
  h += '<h3>Strong: -e- for du and ihr after -d / -t</h3><p><i>du fandest, ihr fandet; du hieltest, ihr batet</i>. After a hissing sound the fuller du-form is standard: <i>du aßest, du ließest</i> (also <i>aßt, ließt</i>).</p>' +
    '<table><tr><th></th><th>gehen</th><th>finden</th><th>essen</th></tr>' + PERSONS.map((p,i) => '<tr><td>'+esc(p)+'</td><td>'+esc(BY_ID["v-gehen"].forms[i][0])+'</td><td>'+esc(BY_ID["v-finden"].forms[i][0])+'</td><td>'+esc(BY_ID["v-essen"].forms[i][0])+'</td></tr>').join("") + '</table>';
  h += '<h2>sein · haben · werden</h2><table><tr><th></th><th>sein</th><th>haben</th><th>werden</th></tr>' + PERSONS.map((p,i) => '<tr><td>'+esc(p)+'</td><td>'+esc(BY_ID["v-sein"].forms[i][0])+'</td><td>'+esc(BY_ID["v-haben"].forms[i][0])+'</td><td>'+esc(BY_ID["v-werden"].forms[i][0])+'</td></tr>').join("") + '</table>' +
    '<ul><li><i>es gibt → es gab: Früher gab es hier einen Bäcker.</i></li><li><i>wurde</i> has three jobs: <b>became</b> (<i>Er wurde Arzt</i>), <b>Passiv Präteritum</b> (<i>Das Haus wurde 1900 gebaut</i>), and it is <b>not</b> <i>würde</i> (Konjunktiv II, "would").</li></ul>';
  h += '<h2>Modal verbs</h2><p>Drop the umlaut, add the -te endings. <i>mögen</i> also changes g → ch.</p><table><tr><th>Infinitiv</th><th>Präteritum</th><th>Note</th></tr>' +
    ["können","müssen","dürfen","mögen","wollen","sollen"].map(v => '<tr><td>'+v+'</td><td>'+esc(BY_ID["v-"+v].praet)+'</td><td class="en">'+({können:"ö → o",müssen:"ü → u",dürfen:"ü → u",mögen:"ö → o, g → ch",wollen:"no change",sollen:"no change"})[v]+'</td></tr>').join("") + '</table>' +
    '<ul><li>Structure unchanged: modal in position 2, infinitive at the end — <i>Ich konnte gestern nicht kommen.</i></li><li><i>möchte</i> has no Präteritum of its own → <i>wollte</i>: <i>Ich möchte einen Kaffee → Ich wollte einen Kaffee.</i></li></ul>';
  h += '<h2>Mixed verbs</h2>' + stammList("mixed");
  h += '<h2>Strong verbs by vowel pattern</h2><p class="muted small">The highlighted vowel is the one that changes. The vowel change is not predictable — but the groups are.</p>';
  ["g1","g2","g3","g4","g5","g6","g7","g8"].forEach(t => {
    h += '<div class="group"><h3>'+esc(TOPICS[t].name)+'</h3>' + stammList(t) + '</div>';
  });
  h += '<h2>Weak verbs in the bank</h2>' + stammList("weak");
  h += '</div>';
  $("#view-rules").innerHTML = h;
}

/* ---------- progress ---------- */
function renderProgress(){
  const st = S.stats;
  const mastered = BANK.filter(q => isMastered(q.id)).length;
  const started = BANK.filter(q => seen(q.id)).length;
  const acc = st.answered ? Math.round(100*st.correct/st.answered) : 0;
  const today = st.days[dayKey(NOW())] || 0;
  let h = '<h1>Progress</h1>';
  h += '<div class="stats">' + [
    [mastered+' / '+BANK.length, 'mastered'], [started, 'started'], [acc+'%', 'accuracy, all time'],
    [today, 'answered today'], [st.streak, 'day streak'], [st.sessions, 'rounds']
  ].map(x => '<div class="stat"><div class="n">'+x[0]+'</div><div class="l">'+x[1]+'</div></div>').join("") + '</div>';
  h += '<div class="mastery">' + barHTML(BANK) + '<div class="legend">green = mastered · blues = box 4 → 1 · red = lapsed (box 0) · grey = not started</div></div>';
  h += '<h2>By topic</h2><div class="topics">' + TOPIC_ORDER.map(t => {
    const list = BY_TOPIC[t], c = boxCounts(list);
    return '<div class="topic"><div class="name">'+esc(TOPICS[t].name)+'</div><button class="btn small go" data-topic="'+t+'">Practice</button>' + barHTML(list) +
      '<div class="cnt">boxes 0–5: '+c.map((n,i)=>i===0?list.filter(q=>seen(q.id)&&boxOf(q.id)===0).length:n).join(' · ')+' · '+list.filter(q=>!seen(q.id)).length+' new</div></div>';
  }).join("") + '</div>';
  const leeches = BANK.filter(q => (S.items[q.id]||{}).lap >= 2).sort((a,b) => S.items[b.id].lap - S.items[a.id].lap).slice(0, 25);
  h += '<h2>Leeches</h2>' + (leeches.length ? leeches.map(q => {
    const label = q.kind === "verb" ? q.inf + " → " + praetDisplay(q,2) : q.kind === "gaps" ? q.prompt.replace(/<[^>]+>/g,"").replace(/\s*\([^)]*\)\s*$/,"") : q.kind === "typed" ? q.answers[0] : q.prompt.replace(/<[^>]+>/g,"");
    return '<div class="leech"><span class="de" lang="de">'+esc(label)+'</span><span class="muted">'+S.items[q.id].lap+' lapses · box '+boxOf(q.id)+'</span></div>';
  }).join("") : '<p class="muted small">None yet. An item becomes a leech after two lapses.</p>');
  h += '<h2>Backup</h2><p class="small muted">Progress lives in this browser'+(PERSISTS?'':' (not persisting here)')+'. Export before switching devices; paste an export below to import.</p>' +
    '<div class="tools"><button class="btn small" data-export="1">Export</button><button class="btn small" data-import="1">Import</button><button class="btn small" data-reset="1">Reset all progress</button></div>' +
    '<textarea class="io" id="io" placeholder="Export appears here / paste an export here"></textarea>';
  $("#view-progress").innerHTML = h;
}

/* ============================ events ============================ */
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if(!t) return;
  if(t.dataset.nav) { if(t.dataset.nav !== "drill") show(t.dataset.nav); return; }
  if(t.dataset.len){ LEN = +t.dataset.len; renderHome(); return; }
  if(t.dataset.start){ startSession(t.dataset.start, t.dataset.topic || null); return; }
  if(t.dataset.topic && !t.dataset.start){ startSession("topic", t.dataset.topic); return; }
  if(t.dataset.quit){ finish(); return; }
  if(t.dataset.opt !== undefined){ answerMC(+t.dataset.opt); return; }
  if(t.dataset.check){ answerTyped(); return; }
  if(t.dataset.next){ SESSION.pos++; nextQ(); return; }
  if(t.dataset.ch){
    const inp = (lastInput && lastInput.isConnected && !lastInput.disabled) ? lastInput : inputs().find(i => !i.disabled);
    if(!inp) return;
    const s = inp.selectionStart, en = inp.selectionEnd;
    inp.value = inp.value.slice(0,s) + t.dataset.ch + inp.value.slice(en);
    inp.focus(); inp.setSelectionRange(s+1, s+1);
    return;
  }
  if(t.dataset.export){ $("#io").value = JSON.stringify(S); $("#io").select(); return; }
  if(t.dataset.import){
    try{
      const p = JSON.parse($("#io").value);
      if(!p || p.v !== 1 || typeof p.items !== "object") throw new Error("bad");
      S = p; S.stats = Object.assign(blank().stats, S.stats || {}); saveNow(); renderProgress();
      $("#io").value = "Imported.";
    }catch(err){ $("#io").value = "That is not a valid export."; }
    return;
  }
  if(t.dataset.reset){
    if(confirm("Delete all progress for this app?")){ S = blank(); saveNow(); renderProgress(); }
    return;
  }
});
document.addEventListener("focusin", e => { if(e.target.matches("#view-drill input")) lastInput = e.target; });
document.addEventListener("keydown", e => {
  if(VIEW !== "drill" || !Q) return;
  if(e.key === "Enter"){
    if(e.target.tagName === "TEXTAREA") return;
    e.preventDefault();
    if(FB){ SESSION.pos++; nextQ(); return; }
    if(Q.kind === "vmc" || Q.kind === "mc") return;
    // move to the next empty input first, otherwise check
    const ins = inputs();
    const idx = ins.indexOf(document.activeElement);
    const nextEmpty = ins.find((i, k) => k > idx && !i.value.trim());
    if(nextEmpty && ins.length > 1){ nextEmpty.focus(); return; }
    answerTyped();
    return;
  }
  if(!FB && (Q.kind === "vmc" || Q.kind === "mc") && /^[1-9]$/.test(e.key) && !(e.target.tagName === "INPUT")){
    const n = +e.key - 1, max = Q.kind === "vmc" ? Q.opts.length : Q.item.options.length;
    if(n < max){ e.preventDefault(); answerMC(n); }
  }
  if(e.key === "Escape"){ finish(); }
});

/* ============================ boot ============================== */
if(!PERSISTS) $("#persist-warn").classList.add("show");
show("home");

// test hooks
window.__pt = {
  get S(){ return S; }, set S(v){ S = v; }, get SESSION(){ return SESSION; }, get Q(){ return Q; }, get FB(){ return FB; },
  setNow(fn){ NOW = fn; }, setRng(fn){ rng = fn; },
  buildSession, startSession, nextQ, answerMC, answerTyped, checkTyped, checkMC, makeQ, norm, record, isDue, boxOf,
  dueItems, newOrder, BANK, BY_ID, BY_TOPIC, IVL, MASTER_BOX, show, load, save: saveNow, blank(){ S = blank(); saveNow(); },
  setLen(n){ LEN = n; }, inputs, finish
};
</script>
</body>
