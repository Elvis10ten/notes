<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Futur I — Drill</title>
<style>
  :root{
    --bg:#F2F4F8; --surface:#FFFFFF; --ink:#16213A; --muted:#5B667A; --line:#D9DEE8;
    --accent:#1F4FD8; --accent-ink:#FFFFFF; --soft:#E7EDFB;
    --ok:#157A4A; --ok-soft:#E3F3EA; --bad:#B83A2A; --bad-soft:#FBE7E3;
    --gold:#B7791F;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI","Helvetica Neue",Inter,system-ui,sans-serif}
  button{font:inherit;cursor:pointer}
  input{font:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
  header h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
  header h1 span{color:var(--accent)}
  .navbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--ink)}
  .navbtn:hover{border-color:var(--ink)}

  /* bracket hero */
  .bracket{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:0;margin:8px 0 22px;font-weight:800;font-size:26px;letter-spacing:-.01em}
  .bracket .l,.bracket .r{padding:0 10px 8px;border-bottom:3px solid var(--accent);color:var(--accent)}
  .bracket .l{border-left:3px solid var(--accent);border-radius:8px 0 0 0}
  .bracket .r{border-right:3px solid var(--accent);border-radius:0 8px 0 0}
  .bracket .m{padding:0 12px 8px;color:var(--muted);font-weight:400;font-size:18px;border-bottom:3px dashed var(--line);text-align:center}

  .mastery{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
  .mastery .pct{font-size:34px;font-weight:800;line-height:1;min-width:90px}
  .mastery .pct small{font-size:14px;font-weight:400;color:var(--muted);display:block;margin-top:4px}
  .bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .bar .b5{background:var(--ok)} .bar .b4{background:#4C9E76} .bar .b3{background:#7BB79A} .bar .b2{background:#A8CDB9} .bar .b1{background:#C9DFD2}
  .mastery .barwrap{flex:1}
  .legend{font-size:12px;color:var(--muted);margin-top:6px}

  .cats{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:16px}
  .cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;color:var(--ink)}
  .cat:hover{border-color:var(--accent)}
  .cat.active{border-color:var(--accent);background:var(--soft)}
  .cat .name{font-weight:600}
  .cat .sub{grid-column:1/-1;font-size:13px;color:var(--muted)}
  .cat .num{font-size:13px;color:var(--muted);white-space:nowrap}
  .cat .bar{grid-column:1/-1;height:6px}

  .actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
  .primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:12px 20px;font-weight:600;font-size:16px}
  .primary:hover{filter:brightness(1.08)}
  .primary:disabled{opacity:.45;cursor:default;filter:none}
  .ghost{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;color:var(--ink)}
  .ghost:hover{border-color:var(--ink)}
  .danger{color:var(--bad);border-color:transparent;background:none;font-size:13px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 18px;margin-bottom:12px}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}
  .meta b{color:var(--ink);font-weight:600}
  .boxes{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
  .boxes i{width:9px;height:9px;border-radius:2px;background:var(--soft);display:inline-block}
  .boxes i.on{background:var(--ok)}
  .task{font-size:14px;color:var(--muted);margin-bottom:6px}
  .prompt{font-size:22px;font-weight:600;line-height:1.35;margin-bottom:16px;letter-spacing:-.005em}
  .prompt .hint{font-weight:400;color:var(--muted);font-size:16px}
  .prompt .gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center;padding:0 4px}
  .prompt .en{display:block;font-size:15px;font-weight:400;color:var(--muted);margin-top:4px}

  .typed{display:flex;gap:8px}
  .typed input{flex:1;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r);font-size:18px;color:var(--ink);background:var(--surface)}
  .typed input:focus{outline:none;border-color:var(--accent)}
  .umlauts{display:flex;gap:6px;margin-top:8px}
  .umlauts button{background:var(--soft);border:0;border-radius:6px;padding:6px 12px;font-size:16px;color:var(--ink)}

  .opts{display:grid;gap:8px}
  .opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:17px;color:var(--ink)}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--accent);background:var(--soft)}
  .opt.right{border-color:var(--ok);background:var(--ok-soft)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt kbd{display:inline-block;font:inherit;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:8px;vertical-align:middle}

  .built{min-height:56px;border:2px dashed var(--line);border-radius:var(--r);padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .built.empty::before{content:"Tap the words below in the right order";color:var(--muted);font-size:14px;padding:6px}
  .pool{display:flex;flex-wrap:wrap;gap:6px}
  .tok{background:var(--soft);border:1px solid transparent;border-radius:8px;padding:8px 12px;font-size:17px;color:var(--ink)}
  .tok:hover{border-color:var(--accent)}
  .built .tok{background:var(--surface);border-color:var(--accent)}
  .tok.used{visibility:hidden}

  .feedback{border-radius:var(--r);padding:14px 16px;margin-top:14px;border:1px solid}
  .feedback.ok{background:var(--ok-soft);border-color:#B9DEC8}
  .feedback.bad{background:var(--bad-soft);border-color:#F0C5BD}
  .feedback .verdict{font-weight:800;margin-bottom:4px}
  .feedback.ok .verdict{color:var(--ok)} .feedback.bad .verdict{color:var(--bad)}
  .feedback .ans{font-size:18px;font-weight:600;margin:4px 0 6px}
  .feedback .exp{font-size:15px;color:var(--ink)}
  .feedback .exp em{color:var(--accent);font-style:normal;font-weight:600}
  .rowbtns{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}
  .kbd-hint{font-size:12px;color:var(--muted)}
  .done{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 20px;text-align:center}
  .done h2{margin:0 0 6px;font-size:24px}
  .stat{font-size:14px;color:var(--muted)}
  .ref{font-size:14px;color:var(--muted);margin-top:22px;line-height:1.6}
  .ref table{border-collapse:collapse;margin-top:6px}
  .ref td{padding:2px 12px 2px 0}
  .ref b{color:var(--ink)}
  .weak{margin-top:10px;font-size:14px}
  .weak span{display:inline-block;background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0}
  .data{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px;font-size:14px}
  .data textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:var(--r);padding:8px 10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);margin-top:8px}
  .data textarea:focus{outline:none;border-color:var(--accent)}
  .data .msg{margin-top:8px;font-weight:600}
  .data .msg.bad{color:var(--bad)} .data .msg.ok{color:var(--ok)}
  .data input[type=file]{display:none}
  @media (max-width:480px){.prompt{font-size:19px}.bracket{font-size:20px}.bracket .m{font-size:14px}}
  @media (prefers-reduced-motion:no-preference){.opt,.tok,.cat{transition:border-color .12s,background .12s}}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================== QUESTION BANK =========================== */
/* BANK-START */
const CATS = {

  sub:   {name:"Subordinate clauses",     sub:"infinitive + werden at the very end: …, dass er kommen wird"},

  use:   {name:"Future or assumption?",   sub:"prediction / plan / promise vs. assumption about the present"},
  three: {name:"The three werden",        sub:"full verb (werden + noun/adjective), Futur I (+ infinitive), Passiv (+ Partizip II)"},
  err:   {name:"Spot the error",          sub:"which sentence is correct? word order, negation, separable and reflexive verbs"},

const WERDEN = {ich:"werde", du:"wirst", er:"wird", wir:"werden", ihr:"werdet", sie:"werden"};

// type "conj": fill the gap with a form of werden. p = subject key for validation.
const CONJ = [

// type "order": tokens (shuffled at runtime) → one of the accepted sentences.
// [canonical, ...alternatives]; tokens are split on " | ".
const ORDER = [
  ["ich | werde | morgen | mit meiner Schwester | telefonieren.", "Morgen werde ich mit meiner Schwester telefonieren.", "Mit meiner Schwester werde ich morgen telefonieren.", "Ich werde mit meiner Schwester morgen telefonieren."],

  ["ich | werde | früh | aufstehen.", "Früh werde ich aufstehen."],

  ["ich | werde | dir | helfen.", "Dir werde ich helfen."],

  ["wir | werden | nächstes Jahr | nach Japan | fliegen.", "Nächstes Jahr werden wir nach Japan fliegen.", "Nach Japan werden wir nächstes Jahr fliegen.", "Wir werden nach Japan nächstes Jahr fliegen."],

  ["ich | werde | das Paket | morgen | abholen.", "Morgen werde ich das Paket abholen.", "Das Paket werde ich morgen abholen.", "Ich werde morgen das Paket abholen."],

/* =========================== BUILD ITEMS =========================== */
function buildBank(){
  const items = [];
  CONJ.forEach(([p, subj], i) => items.push({
    id:"conj"+i, cat:"conj", type:"typed", task:"Fill in the correct form of werden.",
    prompt:p, answers:[WERDEN[subj]], explain:`${subjLabel(subj)} → <em>${WERDEN[subj]}</em>`
  }));
  ORDER.forEach((arr, i) => {
    const tokens = arr[0].split(" | ");
    const canonical = cap(tokens.join(" "));
    const answers = [canonical, ...arr.slice(1)];
    const isSub = tokens.includes("dass");
    items.push({
      id:"order"+i, cat:"order", type:"order", task:"Build the sentence from the words.",
      tokens, answers,
      explain: isSub ? "Subordinate clause: infinitive + werden at the very end." : "werden in position 2, infinitive at the very end." + (arr.length>1 ? " Also correct: " + arr.slice(1).join(" / ") : "")
    });
  });
  SUB.forEach(([p, verb, ans], i) => items.push({
    id:"sub"+i, cat:"sub", type:"typed", task:"Complete the end of the subordinate clause (Futur I).",
    prompt:p, hintVerb:verb, answers:[ans],
    explain:`In a subordinate clause the finite verb moves to the very end, <em>after</em> the infinitive: … ${ans}.`
  }));
  TRANS.forEach((arr, i) => items.push({
    id:"trans"+i, cat:"trans", type:"typed", task:"Rewrite the sentence in Futur I.",
    prompt:arr[0], answers:arr.slice(1), wide:true,
    explain:`<em>${arr[1]}</em>` + (arr.length>2 ? " — also correct: " + arr.slice(2).join(" / ") : "")
  }));
  USE.forEach(([s, k, ex], i) => items.push({
    id:"use"+i, cat:"use", type:"mc", task:"Future, or an assumption about the present?",
    prompt:s, options:["Future (prediction, plan, promise)", "Assumption about the present"],
    correct: k==="Z" ? 0 : 1, explain:ex
  }));
  PART.forEach((p, i) => items.push({
    id:"part"+i, cat:"use", type:"typed", task:"Add a particle so the sentence expresses an assumption.",
    prompt:p, answers:["wohl","sicher","wahrscheinlich","bestimmt"],
    explain:"The assumption reading almost always needs a particle: <em>wohl</em>, <em>sicher</em>, <em>wahrscheinlich</em> or <em>bestimmt</em>."
  }));
  THREE.forEach(([s, k], i) => items.push({
    id:"three"+i, cat:"three", type:"mc", task:"Which werden is this?",
    prompt:s, options:["Full verb (werden + noun / adjective = to become)", "Futur I (werden + infinitive)", "Passiv (werden + Partizip II)"],
    correct:{Voll:0, Futur:1, Passiv:2}[k],
    explain:{Voll:"werden is followed by a noun or adjective → full verb werden (to become / to get).",
             Futur:"werden is followed by an infinitive at the end of the sentence → Futur I.",
             Passiv:"werden is followed by a Partizip II (ge-…-t / ge-…-en) → Passiv."}[k]
  }));
  ERR.forEach(([ok, w1, w2, ex], i) => items.push({
    id:"err"+i, cat:"err", type:"mc", task:"Which sentence is correct?",
    prompt:"", options:[ok, w1, w2], correct:0, shuffle:true, explain:ex
  }));
  return items;
}
function subjLabel(s){ return {ich:"ich", du:"du", er:"er / sie / es (singular)", wir:"wir", ihr:"ihr", sie:"sie (plural) / Sie"}[s]; }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function norm(s){
  return s.toLowerCase().replace(/[.!?,]/g," ").replace(/\s+/g," ").trim();
}
function checkTyped(item, input){
  const n = norm(input);
  return item.answers.some(a => norm(a) === n);
}
function checkOrder(item, tokensInOrder){
  const n = norm(tokensInOrder.join(" "));
  return item.answers.some(a => norm(a) === n);
}
/* =========================== SCHEDULER (Leitner) =========================== */
// Boxes 0..5. Box 5 = mastered. Interval in "steps" (answered questions) before due again.
const INTERVAL = [0, 4, 10, 25, 60];
const MASTER = 5;
const KEY = "futur1_drill_v1";

const BANK = buildBank();
let state = load();

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.items) return s; }catch(e){}
  return {step:0, items:{}, session:null, history:[]};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function rec(id){ return state.items[id] || (state.items[id] = {box:0, due:0, seen:0, right:0, wrong:0, streak:0}); }

function pickNext(filterCats){
  const pool = BANK.filter(q => !filterCats || filterCats.includes(q.cat));
  const recent = state.history.slice(-3);
  const cand = pool.filter(q => !recent.includes(q.id));
  const list = cand.length ? cand : pool;
  const due = list.filter(q => { const r = rec(q.id); return r.box < MASTER && r.due <= state.step; });
  if(due.length){
    // lowest box first, then longest overdue, then seed randomness
    due.sort((a,b) => (rec(a.id).box - rec(b.id).box) || (rec(a.id).due - rec(b.id).due) || (Math.random()-.5));
    const top = due.filter(q => rec(q.id).box === rec(due[0].id).box);
    return top[Math.floor(Math.random()*Math.min(top.length, 6))];
  }
  const unmastered = list.filter(q => rec(q.id).box < MASTER);
  if(unmastered.length){
    // nothing due yet: pull the earliest-due card forward (keeps drilling without dead time)
    unmastered.sort((a,b) => rec(a.id).due - rec(b.id).due);
    return unmastered[0];
  }
  // all mastered: light maintenance review of the weakest historically
  const m = list.slice().sort((a,b) => (rec(b.id).wrong - rec(a.id).wrong) || (Math.random()-.5));
  return m[Math.floor(Math.random()*Math.min(m.length, 10))];
}
function grade(id, ok){
  const r = rec(id);
  r.seen++;
  state.step++;
  if(ok){
    r.right++; r.streak++;
    if(r.box < MASTER) r.box++;
    r.due = state.step + (r.box < MASTER ? INTERVAL[r.box] : 10000);
  }else{
    r.wrong++; r.streak = 0;
    r.box = 0;
    r.due = state.step + 2;
  }
  state.history.push(id); if(state.history.length > 50) state.history.shift();
  save();
}
function stats(cats){
  const pool = BANK.filter(q => !cats || cats.includes(q.cat));
  const boxes = [0,0,0,0,0,0];
  pool.forEach(q => boxes[rec(q.id).box]++);
  return {n:pool.length, boxes, mastered:boxes[5], pct: pool.length ? Math.round(100*boxes[5]/pool.length) : 0};
}

/* =========================== EXPORT / IMPORT =========================== */
function exportProgress(){
  const payload = {app:"futur1-drill", version:1, exported:new Date().toISOString(), step:state.step, items:state.items, history:state.history};
  const text = JSON.stringify(payload);
  const stamp = new Date().toISOString().slice(0,10);
  const blob = new Blob([text], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `futur1-progress-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(()=>{});
}
function validateImport(obj){
  if(!obj || typeof obj !== "object") return "Not a valid export.";
  if(obj.app !== "futur1-drill") return "This file was not exported from this app.";
  if(typeof obj.step !== "number" || obj.step < 0 || !isFinite(obj.step)) return "Export is missing the answer counter.";
  if(!obj.items || typeof obj.items !== "object") return "Export is missing card progress.";
  const known = new Set(BANK.map(q => q.id));
  let matched = 0;
  for(const [id, r] of Object.entries(obj.items)){
    if(!r || typeof r !== "object") return `Card "${id}" has malformed data.`;
    for(const k of ["box","due","seen","right","wrong","streak"]){
      if(typeof r[k] !== "number" || !isFinite(r[k]) || r[k] < 0) return `Card "${id}" has an invalid "${k}" value.`;
    }
    if(r.box > MASTER) return `Card "${id}" has an invalid box.`;
    if(known.has(id)) matched++;
  }
  if(matched === 0 && Object.keys(obj.items).length) return "None of the cards in this file match this app's question bank.";
  return null;
}
function importProgress(text){
  let obj;
  try{ obj = JSON.parse(text); }catch(e){ setImportMsg("That is not valid JSON.", false); return; }
  const err = validateImport(obj);
  if(err){ setImportMsg(err, false); return; }
  const known = new Set(BANK.map(q => q.id));
  const items = {};
  for(const [id, r] of Object.entries(obj.items)) if(known.has(id)) items[id] = {box:r.box, due:r.due, seen:r.seen, right:r.right, wrong:r.wrong, streak:r.streak};
  const mastered = Object.values(items).filter(r => r.box === MASTER).length;
  if(!confirm(`Import ${Object.keys(items).length} cards (${mastered} mastered, ${obj.step} answers)? This replaces the progress saved in this browser.`)) return;
  state = {step:Math.floor(obj.step), items, session:null, history:Array.isArray(obj.history) ? obj.history.filter(x => known.has(x)).slice(-50) : []};
  save();
  renderHome();
  const panel = app.querySelector("#importpanel"); panel.hidden = false;
  setImportMsg(`Imported ${Object.keys(items).length} cards.`, true);
}
function setImportMsg(text, ok){
  const m = app.querySelector("#importmsg"); if(!m) return;
  m.textContent = text; m.className = "msg " + (ok ? "ok" : "bad");
}

    renderHome();
  });
  app.querySelector("#start").onclick = () => { session.count=0; session.ok=0; next(); };
  const cs = app.querySelector("#clearsel"); if(cs) cs.onclick = () => { session.cats=null; renderHome(); };
  const wk = app.querySelector("#weak"); if(wk) wk.onclick = () => { session.cats=null; session.weak=true; session.count=0; session.ok=0; next(); };
  app.querySelector("#reset").onclick = () => { if(confirm("Delete all progress? This cannot be undone.")){ state = {step:0, items:{}, session:null, history:[]}; save(); renderHome(); } };
  app.querySelector("#export").onclick = exportProgress;
  const panel = app.querySelector("#importpanel");
  app.querySelector("#import").onclick = () => { panel.hidden = !panel.hidden; if(!panel.hidden) app.querySelector("#importtext").focus(); };
  app.querySelector("#cancelimport").onclick = () => { panel.hidden = true; };
  app.querySelector("#pickfile").onclick = () => app.querySelector("#file").click();
  app.querySelector("#file").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => { app.querySelector("#importtext").value = rd.result; importProgress(rd.result); };
    rd.onerror = () => setImportMsg("Could not read that file.", false);
    rd.readAsText(f);
  };
  app.querySelector("#doimport").onclick = () => importProgress(app.querySelector("#importtext").value);
}
function weakHTML(){
  const weak = BANK.filter(q => rec(q.id).wrong >= 2 && rec(q.id).box < MASTER);
  return weak.length ? `<button class="ghost" id="weak">Drill weak cards (${weak.length})</button>` : "";
}
function refHTML(){
  return `<div class="ref"><b>Quick reference</b><table>
    <tr><td><b>Main clause</b></td><td>Ich <b>werde</b> morgen nach Berlin <b>fahren</b>.</td></tr>
    <tr><td><b>Subordinate</b></td><td>…, dass er morgen <b>kommen wird</b>.</td></tr>
    <tr><td><b>Separable</b></td><td>Ich werde früh <b>aufstehen</b>.</td></tr>
    <tr><td><b>Reflexive</b></td><td>Ich werde <b>mich</b> beeilen.</td></tr>
    <tr><td><b>Negation</b></td><td>Ich werde morgen <b>nicht arbeiten</b>.</td></tr>
    <tr><td><b>Assumption</b></td><td>Er wird <b>wohl</b> zu Hause sein. (needs a particle)</td></tr>
    <tr><td><b>Three werden</b></td><td>Ich werde Lehrer (full verb) · Ich werde arbeiten (Futur I) · Das Auto wird repariert (Passiv)</td></tr>
  </table></div>`;
}

function next(){
  let cats = session.cats;
  let q;
  if(session.weak){
    const weakAll = BANK.filter(x => rec(x.id).wrong >= 2 && rec(x.id).box < MASTER);
    if(!weakAll.length){ session.weak=false; renderHome(); return; }
    const recent = state.history.slice(-3);
    const weak = weakAll.filter(x => !recent.includes(x.id));
    q = weak.length ? weak[Math.floor(Math.random()*weak.length)] : pickNext(cats);
  } else q = pickNext(cats);
  session.q = q; session.answered=false; session.built=[]; session.sel=null;
  session.optOrder = q.options ? q.options.map((_,i)=>i) : null;
  if(q.shuffle) shuffle(session.optOrder);
  session.pool = q.tokens ? shuffleUntilDifferent(q.tokens) : null;
  renderQ();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shuffleUntilDifferent(t){ let p; let tries=0; do{ p = shuffle(t.slice()); }while(p.join()===t.join() && ++tries<10); return p; }

function renderQ(){
  const q = session.q; const r = rec(q.id);
  const boxes = `<span class="boxes">${[1,2,3,4,5].map(k=>`<i class="${r.box>=k?"on":""}"></i>`).join("")}</span>`;
  let body = "";
  if(q.type==="typed"){
    let p = h(q.prompt);
    if(q.hintVerb) p = p.replace("___", `<span class="gap">___</span> <span class="hint">(${q.hintVerb})</span>`);
    else p = p.replace("___", `<span class="gap">___</span>`);
    body = `<div class="prompt">${p}</div>
      <div class="typed"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.wide?"Whole sentence…":"…"}"></div>
      <div class="umlauts">${["ä","ö","ü","ß"].map(c=>`<button data-c="${c}">${c}</button>`).join("")}</div>`;
  }else if(q.type==="mc"){
    body = (q.prompt ? `<div class="prompt">${h(q.prompt)}</div>` : "") +
      `<div class="opts">${session.optOrder.map((oi,k)=>`<button class="opt" data-i="${oi}"><kbd>${k+1}</kbd>${h(q.options[oi])}</button>`).join("")}</div>`;
  }else if(q.type==="order"){
    body = `<div class="built ${session.built.length?"":"empty"}" id="built">${session.built.map((ti,k)=>`<button class="tok" data-b="${k}">${h(session.pool[ti])}</button>`).join("")}</div>
      <div class="pool">${session.pool.map((t,i)=>`<button class="tok ${session.built.includes(i)?"used":""}" data-p="${i}">${h(t)}</button>`).join("")}</div>`;
  }
  app.innerHTML = `
    <header><h1>Futur I <span>drill</span></h1><button class="navbtn" id="home">Overview</button></header>
    <div class="card">
      <div class="meta"><span><b>${CATS[q.cat].name}</b>${boxes}</span><span>${session.count} answered · ${session.ok} correct</span></div>
      <div class="task">${q.task}</div>
      ${body}
      <div id="fb"></div>
      <div class="rowbtns">
        <span class="kbd-hint">${q.type==="mc"?"Keys 1–3 select, Enter checks":q.type==="order"?"Enter checks, Backspace removes the last word":"Enter checks"}</span>
        <button class="primary" id="check">Check</button>
      </div>
    </div>`;
  app.querySelector("#home").onclick = () => { session.weak=false; renderHome(); };
  const btn = app.querySelector("#check");
  btn.onclick = submit;
  if(q.type==="typed"){
    const inp = app.querySelector("#inp"); inp.focus();
    app.querySelectorAll(".umlauts button").forEach(b=>b.onclick=()=>{ const s=inp.selectionStart; inp.setRangeText(b.dataset.c, s, inp.selectionEnd, "end"); inp.focus(); });
  }
  if(q.type==="mc"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(session.answered) return; session.sel=+b.dataset.i; app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel", +x.dataset.i===session.sel)); });
  }
  if(q.type==="order"){
    app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ if(session.answered) return; const i=+b.dataset.p; if(!session.built.includes(i)){ session.built.push(i); renderQ(); } });
    app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ if(session.answered) return; session.built.splice(+b.dataset.b,1); renderQ(); });
  }
}
document.addEventListener("keydown", e => {
  if(view!=="q") return;
  const q = session.q; if(!q) return;
  if(e.key==="Enter"){ e.preventDefault(); session.answered ? next() : submit(); return; }
  if(session.answered) return;
  if(q.type==="mc" && /^[1-3]$/.test(e.key)){ const k=+e.key-1; if(k<session.optOrder.length){ session.sel=session.optOrder[k]; app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel", +x.dataset.i===session.sel)); } }
  if(q.type==="order" && e.key==="Backspace" && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); session.built.pop(); renderQ(); }
});
const _next = next; next = function(){ view="q"; _next(); };
const _home = renderHome; renderHome = function(){ view="home"; _home(); };

function submit(){
  if(session.answered) return;
  const q = session.q; let ok=false, given="";
  if(q.type==="typed"){
    given = app.querySelector("#inp").value;
    if(!norm(given)) { app.querySelector("#inp").focus(); return; }
    ok = checkTyped(q, given);
  }else if(q.type==="mc"){
    if(session.sel===null) return;
    ok = session.sel === q.correct;
  }else if(q.type==="order"){
    if(session.built.length !== session.pool.length) { app.querySelector("#fb").innerHTML = `<div class="task" style="margin-top:10px">Use all the words before checking.</div>`; return; }
    given = session.built.map(i=>session.pool[i]).join(" ");
    ok = checkOrder(q, session.built.map(i=>session.pool[i]));
  }
  session.answered = true; session.count++; if(ok) session.ok++;
  grade(q.id, ok);
  const r = rec(q.id);
  const answerLine = q.type==="mc" ? q.options[q.correct] : q.answers[0];
  const fb = app.querySelector("#fb");
  fb.innerHTML = `<div class="feedback ${ok?"ok":"bad"}">
    <div class="verdict">${ok ? (r.box===MASTER ? "Correct — mastered." : "Correct.") : "Wrong."}</div>
    <div class="ans">${h(answerLine)}</div>
    ${ok && q.type!=="mc" && norm(given)!==norm(q.answers[0]) ? `<div class="exp">Your version is also correct.</div>` : ""}
    <div class="exp">${q.explain}</div>
  </div>`;
  if(q.type==="mc"){
    app.querySelectorAll(".opt").forEach(x=>{ const i=+x.dataset.i; x.classList.remove("sel"); if(i===q.correct) x.classList.add("right"); else if(i===session.sel) x.classList.add("wrong"); });
  }
  if(q.type==="typed"){ app.querySelector("#inp").disabled = true; }
  const btn = app.querySelector("#check"); btn.textContent = "Next"; btn.onclick = next; if(document.activeElement) document.activeElement.blur();
}

renderHome();
window.__t = {BANK, exportProgress, importProgress, validateImport, get session(){return session}, get state(){return state}, stats, checkOrder, checkTyped};
</script>
