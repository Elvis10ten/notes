":["wenn"],"explain":"Future (even though the Perfekt is used) → <b>wenn</b>.","rule":"wenn → present/future"},{"id":"wa-017","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"___ ich gestern aufwachte, war es schon zehn Uhr.","answers":["Als"],"explain":"<i>gestern</i>, one-off → <b>Als</b>.","rule":"als → one-off, past"},{"id":"wa-018","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"Ruf mich an, ___ du angekommen bist.","answers":["wenn"],"explain":"Future → <b>wenn</b>.","rule":"wenn → present/future"},{"id":"wa-019","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"___ er die Nachricht bekam, war er sehr überrascht.","answers":["Als"],"explain":"A one-off event in the past → <b>Als</b>.","rule":"als → one-off, past"},{"id":"wa-020","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"Sonntags, ___ ich frei habe, schlafe ich lange.","answers":["wenn"],"explain":"Present, repeated → <b>wenn</b>.","rule":"wenn → present/future"},{"id":"wa-021","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"___ meine Großeltern jung waren, gab es noch kein Internet.","answers":["Als"],"explain":"A single period in the past → <b>Als</b>.","rule":"als → one-off, past"},{"id":"wa-022","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"Früher, ___ wir Besuch hatten, gab es immer Kuchen.","answers":["wenn"],"explain":"<i>immer</i> — a repeated situation in the past → <b>wenn</b>.","rule":"wenn → repeated (past)"},{"id":"wa-101","kind":"mc","topic":"wenn-als","question":"When do you use <b>als</b>?","prompt":"Rule","options":["For a one-off event or a single period in the past.","For everything in the past, including repeated events.","For present and future.","For conditions."],"answer":"For a one-off event or a single period in the past.","explain":"<i>Als ich klein war …</i> — once. Repeated past events take <i>wenn</i>.","rule":"als → one-off, past","meta":true},{"id":"wa-102","kind":"mc","topic":"wenn-als","question":"When do you use <b>wenn</b> for the past?","prompt":"Rule","options":["Only for repeated events: <i>immer wenn</i>, <i>jedes Mal wenn</i>.","Never — the past always takes <i>als</i>.","Whenever the clause comes first.","Only in the Präteritum."],"answer":"Only for repeated events: <i>immer wenn</i>, <i>jedes Mal wenn</i>.","explain":"<i>Immer wenn er kam, brachte er Blumen mit.</i>","rule":"wenn → repeated (past)","meta":true},{"id":"wa-103","kind":"mc","topic":"wenn-als","question":"Which sentence is correct?","prompt":"one-off, past","options":["Als ich klein war, wohnte ich in Bonn.","Wenn ich klein war, wohnte ich in Bonn.","Als ich klein bin, wohne ich in Bonn.","Wenn ich klein war, wohne ich in Bonn."],"answer":"Als ich klein war, wohnte ich in Bonn.","explain":"Childhood = a single period in the past → <b>als</b>.","rule":"als → one-off, past"},{"id":"wa-104","kind":"mc","topic":"wenn-als","question":"Which sentence is correct?","prompt":"present/future","options":["Wenn ich Zeit habe, komme ich.","Als ich Zeit habe, komme ich.","Als ich Zeit hatte, komme ich.","Wenn ich Zeit hatte, komme ich."],"answer":"Wenn ich Zeit habe, komme ich.","explain":"Present/future → <b>wenn</b>; <i>als</i> only works for the past.","rule":"wenn → present/future"},{"id":"wa-105","kind":"mc","topic":"wenn-als","question":"Which sentence describes a repeated event in the past?","prompt":"Repetition","options":["Immer wenn er kam, brachte er Blumen mit.","Als er kam, brachte er Blumen mit.","Wenn er kommt, bringt er Blumen mit.","Als er gekommen war, brachte er Blumen mit."],"answer":"Immer wenn er kam, brachte er Blumen mit.","explain":"<i>immer wenn</i> + Präteritum = repeated in the past.","rule":"wenn → repeated (past)"},{"id":"wa-106","kind":"mc","topic":"wenn-als","question":"What does <b>wenn</b> mean in „Wenn es regnet, bleibe ich zu Hause“?","prompt":"Rule","options":["when/if — present, future or condition","when — a one-off event in the past","whether — an indirect question","while — at the same time"],"answer":"when/if — present, future or condition","explain":"<i>wenn</i> covers “when” and “if” — except for one-off past events (<i>als</i>) and indirect questions (<i>ob</i>).","rule":"wenn → present/future","meta":true},{"id":"do-001","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich weiß, ___ er kommt.","answers":["dass"],"explain":"Certain statement → <b>dass</b>.","rule":"dass → statement"},{"id":"do-002","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich weiß nicht, ___ er kommt.","answers":["ob"],"explain":"Uncertainty, an open yes/no question → <b>ob</b>.","rule":"ob → yes/no question"},{"id":"do-003","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich frage mich, ___ sie recht hat.","answers":["ob"],"explain":"<i>sich fragen</i> → open question → <b>ob</b>.","rule":"ob → yes/no question"},{"id":"do-004","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich glaube, ___ sie recht hat.","answers":["dass"],"explain":"<i>glauben</i> → statement → <b>dass</b>.","rule":"dass → statement"},{"id":"do-005","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Kannst du mir sagen, ___ der Zug pünktlich ist?","answers":["ob"],"explain":"The direct question would be <i>Ist der Zug pünktlich?</i> (yes/no) → <b>ob</b>.","rule":"ob → yes/no question"},{"id":"do-006","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Es ist schade, ___ du nicht kommst.","answers":["dass"],"explain":"Feeling + fact → <b>dass</b>.","rule":"dass → statement"},{"id":"do-007","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich bin nicht sicher, ___ das richtig ist.","answers":["ob"],"explain":"Uncertainty → <b>ob</b>.","rule":"ob → yes/no question"},{"id":"do-008","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich bin sicher, ___ das richtig ist.","answers":["dass"],"explain":"Certainty → <b>dass</b>.","rule":"dass → statement"},{"id":"do-009","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Er hat gefragt, ___ wir morgen Zeit haben.","answers":["ob"],"explain":"<i>fragen</i> → <b>ob</b>.","rule":"ob → yes/no question"},{"id":"do-010","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Er hat gesagt, ___ er morgen keine Zeit hat.","answers":["dass"],"explain":"<i>sagen</i> → statement → <b>dass</b>.","rule":"dass → statement"},{"id":"do-011","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich hoffe, ___ das Wetter schön wird.","answers":["dass"],"explain":"<i>hoffen</i> → <b>dass</b>.","rule":"dass → statement"},{"id":"do-012","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Weißt du, ___ das Geschäft heute geöffnet ist? Ich habe keine Ahnung.","answers":["ob"],"explain":"The speaker doesn't know → open yes/no question → <b>ob</b>.","rule":"ob → yes/no question"},{"id":"do-013","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Es ist wichtig, ___ du pünktlich bist.","answers":["dass"],"explain":"Firm statement → <b>dass</b>.","rule":"dass → statement"},{"id":"do-014","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich möchte wissen, ___ du mitkommst oder nicht.","answers":["ob"],"explain":"<i>… oder nicht</i> = yes/no → <b>ob</b>.","rule":"ob → yes/no question"},{"id":"do-015","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Sie hat mir erzählt, ___ sie umzieht.","answers":["dass"],"explain":"<i>erzählen</i> → statement → <b>dass</b>.","rule":"dass → statement"},{"id":"do-016","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich habe keine Ahnung, ___ er noch hier wohnt.","answers":["ob"],"explain":"Not knowing → <b>ob</b>.","rule":"ob → yes/no question"},{"id":"do-017","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Es freut mich, ___ du da bist.","answers":["dass"],"explain":"Feeling + fact → <b>dass</b>.","rule":"dass → statement"},{"id":"do-018","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich habe ihn gefragt, ___ er mir helfen kann.","answers":["ob"],"explain":"<i>fragen</i> → <b>ob</b>.","rule":"ob → yes/no question"},{"id":"do-019","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich finde, ___ der Film langweilig ist.","answers":["dass"],"explain":"<i>finden</i> (opinion) → <b>dass</b>.","rule":"dass → statement"},{"id":"do-020","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich prüfe, ___ die Tür abgeschlossen ist.","answers":["ob"],"explain":"<i>prüfen</i> = settling an open question → <b>ob</b>.","rule":"ob → yes/no question"},{"id":"do-021","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich denke, ___ er morgen kommt.","answers":["dass"],"explain":"<i>denken</i> → statement → <b>dass</b>.","rule":"dass → statement"},{"id":"do-022","kind":"typed","topic":"dass-ob","question":"Fill in: <b>dass</b> or <b>ob</b>?","prompt":"Ich bin gespannt, ___ sie die Stelle bekommt.","answers":["ob"],"explain":"The outcome is open → <b>ob</b>.","rule":"ob → yes/no question"},{"id":"do-101","kind":"mc","topic":"dass-ob","question":"Which conjunction follows <b>fragen</b>?","prompt":"Rule","options":["ob","dass","wenn","weil"],"answer":"ob","explain":"A question without a question word is introduced by <b>ob</b>.","rule":"ob → yes/no question"},{"id":"do-102","kind":"mc","topic":"dass-ob","question":"When do you use <b>ob</b>?","prompt":"Rule","options":["For uncertainty or an indirect yes/no question.","After all verbs of saying and thinking.","Only after question words.","When the subordinate clause comes first."],"answer":"For uncertainty or an indirect yes/no question.","explain":"<i>Ich weiß nicht, ob …</i> / <i>Ich frage, ob …</i>","rule":"ob → yes/no question","meta":true},{"id":"do-103","kind":"mc","topic":"dass-ob","question":"Which sentence is correct?","prompt":"fragen","options":["Er fragt, ob sie morgen kommt.","Er fragt, dass sie morgen kommt.","Er fragt, ob kommt sie morgen.","Er fragt, ob sie kommt morgen."],"answer":"Er fragt, ob sie morgen kommt.","explain":"After <i>fragen</i> comes <b>ob</b>, and the verb goes to the end.","rule":"ob → yes/no question"},{"id":"do-104","kind":"mc","topic":"dass-ob","question":"Which verbs are typically followed by <b>dass</b>?","prompt":"Rule","options":["sagen, glauben, denken, hoffen, meinen — and <i>wissen</i> when you are certain","fragen, sich fragen, prüfen","only after <i>wissen</i>","after question words"],"answer":"sagen, glauben, denken, hoffen, meinen — and <i>wissen</i> when you are certain","explain":"Verbs of saying, thinking and knowing, plus expressions of feeling (<i>es ist schade, dass …</i>).","rule":"dass → statement","meta":true},{"id":"do-105","kind":"mc","topic":"dass-ob","question":"Which sentence is correct?","prompt":"hoffen","options":["Ich hoffe, dass du kommst.","Ich hoffe, ob du kommst.","Ich hoffe, dass kommst du.","Ich hoffe dass du kommst."],"answer":"Ich hoffe, dass du kommst.","explain":"<i>hoffen</i> → <b>dass</b>, comma before it, verb at the end.","rule":"dass → statement"},{"id":"do-106","kind":"mc","topic":"dass-ob","question":"What changes from „Ich weiß, dass er kommt“ to „Ich weiß nicht, ob er kommt“?","prompt":"Rule","options":["A certain statement becomes an open yes/no question.","Only the tense.","The word order in the subordinate clause.","Nothing — <i>dass</i> and <i>ob</i> are interchangeable."],"answer":"A certain statement becomes an open yes/no question.","explain":"<i>dass</i> = fact, <i>ob</i> = “yes or no?”. The word order stays the same (verb at the end).","rule":"dass / ob","meta":true},{"id":"te-001","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"___ ich frühstücke, dusche ich. (before)","answers":["Bevor"],"explain":"<b>Bevor</b> = before.","rule":"bevor"},{"id":"te-002","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"___ ich geduscht habe, frühstücke ich. (after)","answers":["Nachdem"],"explain":"<b>Nachdem</b> = after; Perfekt in the subordinate clause, Präsens in the main clause.","rule":"nachdem"},{"id":"te-003","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"___ ich koche, hört sie Musik. (while)","answers":["Während"],"explain":"At the same time → <b>Während</b>.","rule":"während"},{"id":"te-004","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"Ich warte, ___ der Bus kommt. (until)","answers":["bis"],"explain":"End point → <b>bis</b>.","rule":"bis"},{"id":"te-005","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"___ ich in Berlin wohne, spreche ich besser Deutsch. (since – time)","answers":["Seitdem"],"alt":["Seit"],"altWhy":"As conjunctions, <i>seit</i> and <i>seitdem</i> mean the same.","explain":"Starting point, still ongoing → <b>Seitdem</b>.","rule":"seitdem"},{"id":"te-006","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"___ ich zu Hause bin, rufe ich dich an. (as soon as)","answers":["Sobald"],"explain":"<b>Sobald</b> = immediately after.","rule":"sobald"},{"id":"te-007","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"___ du krank bist, musst du im Bett bleiben. (as long as)","answers":["Solange"],"explain":"Duration → <b>Solange</b>.","rule":"solange"},{"id":"te-008","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"Mach das Licht aus, ___ du gehst. (before)","answers":["bevor"],"explain":"<b>bevor</b> = before.","rule":"bevor"},{"id":"te-009","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"___ er die Schule beendet hatte, machte er eine Ausbildung. (after)","answers":["Nachdem"],"explain":"<b>Nachdem</b> + Plusquamperfekt.","rule":"nachdem"},{"id":"te-010","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"Du kannst hier bleiben, ___ du willst. (as long as)","answers":["solange"],"explain":"Duration → <b>solange</b>.","rule":"solange"},{"id":"te-011","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"Wir warten, ___ der Regen aufhört. (until)","answers":["bis"],"explain":"End point → <b>bis</b>.","rule":"bis"},{"id":"te-012","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"___ sie das Baby bekommen hat, arbeitet sie nicht mehr. (since – time)","answers":["Seitdem"],"alt":["Seit"],"altWhy":"As conjunctions, <i>seit</i> and <i>seitdem</i> mean the same.","explain":"Starting point → <b>Seitdem</b>.","rule":"seitdem"},{"id":"te-013","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"___ die Kinder schlafen, lesen wir. (while)","answers":["Während"],"explain":"At the same time → <b>Während</b>.","rule":"während"},{"id":"te-014","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"Ich schreibe dir, ___ ich angekommen bin. (as soon as)","answers":["sobald"],"explain":"<b>sobald</b> = immediately after.","rule":"sobald"},{"id":"te-015","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"Er hat die Wohnung aufgeräumt, ___ die Gäste kamen. (before)","answers":["bevor"],"explain":"<b>bevor</b> = before.","rule":"bevor"},{"id":"te-016","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"___ wir gegessen hatten, spielten wir Karten. (after)","answers":["Nachdem"],"explain":"<b>Nachdem</b> + Plusquamperfekt.","rule":"nachdem"},{"id":"te-017","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"Ich bleibe bei dir, ___ du wieder gesund bist. (until)","answers":["bis"],"explain":"End point → <b>bis</b>.","rule":"bis"},{"id":"te-018","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"___ er sein Handy verloren hat, ist er schlecht erreichbar. (since – time)","answers":["Seitdem"],"alt":["Seit"],"altWhy":"As conjunctions, <i>seit</i> and <i>seitdem</i> mean the same.","explain":"Starting point → <b>Seitdem</b>.","rule":"seitdem"},{"id":"te-019","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"Sie hört Musik, ___ sie arbeitet. (while)","answers":["während"],"explain":"At the same time → <b>während</b>.","rule":"während"},{"id":"te-020","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"___ das Essen fertig ist, rufe ich euch. (as soon as)","answers":["Sobald"],"explain":"<b>Sobald</b>.","rule":"sobald"},{"id":"te-021","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"Ich putze mir die Zähne, ___ ich ins Bett gehe. (before)","answers":["bevor"],"explain":"<b>bevor</b> = before.","rule":"bevor"},{"id":"te-022","kind":"typed","topic":"temporal","question":"Fill in the time conjunction.","prompt":"___ es dunkel wird, gehen wir nach Hause. (as soon as)","answers":["Sobald"],"explain":"<b>Sobald</b> = immediately after.","rule":"sobald"},{"id":"te-101","kind":"mc","topic":"temporal","question":"Which sentence is correct?","prompt":"nachdem + Präteritum in the main clause","options":["Nachdem ich gegessen hatte, ging ich spazieren.","Nachdem ich gegessen habe, ging ich spazieren.","Nachdem ich aß, ging ich spazieren.","Nachdem ich esse, ging ich spazieren."],"answer":"Nachdem ich gegessen hatte, ging ich spazieren.","explain":"The <i>nachdem</i> clause is one step further back in time: main clause Präteritum → subordinate clause Plusquamperfekt.","rule":"nachdem → Plusquamperfekt"},{"id":"te-102","kind":"mc","topic":"temporal","question":"Which tense is typical in the <b>nachdem</b> clause when the main clause is in the Präteritum?","prompt":"Rule","options":["Plusquamperfekt","Präsens","Futur I","Präteritum"],"answer":"Plusquamperfekt","explain":"<i>Nachdem ich gegessen <b>hatte</b>, ging ich.</i> With a Präsens main clause: Perfekt.","rule":"nachdem → Plusquamperfekt","meta":true},{"id":"te-103","kind":"mc","topic":"temporal","question":"<b>bis</b> or <b>bevor</b>?","prompt":"Ich warte, ___ du fertig bist.","options":["bis","bevor","nachdem","seitdem"],"answer":"bis","explain":"The waiting lasts up to an end point → <b>bis</b>.","rule":"bis"},{"id":"te-104","kind":"mc","topic":"temporal","question":"<b>bevor</b> or <b>nachdem</b>?","prompt":"Ich putze mir die Zähne, ___ ich ins Bett gehe.","options":["bevor","nachdem","bis","während"],"answer":"bevor","explain":"Brushing your teeth comes before going to bed → <b>bevor</b>.","rule":"bevor"},{"id":"te-105","kind":"mc","topic":"temporal","question":"<b>seitdem</b> or <b>bis</b>?","prompt":"___ er in Berlin wohnt, hat er viele Freunde.","options":["Seitdem","Bis","Bevor","Nachdem"],"answer":"Seitdem","explain":"Starting point of a state that continues → <b>Seitdem</b>.","rule":"seitdem"},{"id":"te-106","kind":"mc","topic":"temporal","question":"What does <b>während</b> mean?","prompt":"Rule","options":["At the same time (“while”) — or a contrast (“whereas”).","Earlier (“before”).","Later (“after”).","An end point (“until”)."],"answer":"At the same time (“while”) — or a contrast (“whereas”).","explain":"<i>Während er kocht, deckt sie den Tisch.</i>","rule":"während","meta":true},{"id":"te-107","kind":"mc","topic":"temporal","question":"<b>sobald</b> or <b>solange</b>?","prompt":"___ ich das Geld habe, kaufe ich das Auto.","options":["Sobald","Solange","Bevor","Seitdem"],"answer":"Sobald","explain":"A point in time (“as soon as”) → <b>Sobald</b>.","rule":"sobald"},{"id":"te-108","kind":"mc","topic":"temporal","question":"<b>solange</b> or <b>sobald</b>?","prompt":"___ du noch hier wohnst, musst du die Regeln respektieren.","options":["Solange","Sobald","Nachdem","Bis"],"answer":"Solange","explain":"A duration (“as long as”) → <b>Solange</b>.","rule":"solange"},{"id":"te-109","kind":"mc","topic":"temporal","question":"Which sentence is correct?","prompt":"seitdem","options":["Seitdem er hier wohnt, ist er glücklich.","Seitdem er hier wohnte, ist er glücklich.","Seitdem wohnt er hier, ist er glücklich.","Seitdem er hier wohnt, er ist glücklich."],"answer":"Seitdem er hier wohnt, ist er glücklich.","explain":"Ongoing state → Präsens; verb at the end of the subordinate clause; then the main-clause verb.","rule":"seitdem"},{"id":"te-110","kind":"mc","topic":"temporal","question":"Which sentence says that two things happen at the same time?","prompt":"Same time","options":["Während er kocht, deckt sie den Tisch.","Nachdem er gekocht hat, deckt sie den Tisch.","Bevor er kocht, deckt sie den Tisch.","Bis er kocht, deckt sie den Tisch."],"answer":"Während er kocht, deckt sie den Tisch.","explain":"<b>während</b> = at the same time.","rule":"während"},{"id":"in-001","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Wo wohnt er? → Ich weiß nicht, …","frame":"Ich weiß nicht,","answers":["wo er wohnt"],"shape":"sub","vbw":["wohnt"],"explain":"The W-word stays, the verb goes to the end: <b>wo er wohnt</b>.","rule":"W-word stays"},{"id":"in-002","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Wann kommt sie? → Sag mir, …","frame":"Sag mir,","answers":["wann sie kommt"],"shape":"sub","vbw":["kommt"],"explain":"<b>wann sie kommt</b>.","rule":"W-word stays"},{"id":"in-003","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Wie geht das? → Ich weiß nicht, …","frame":"Ich weiß nicht,","answers":["wie das geht"],"shape":"sub","vbw":["geht"],"explain":"<b>wie das geht</b>.","rule":"W-word stays"},{"id":"in-004","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Kommt er? → Ich frage, …","frame":"Ich frage,","answers":["ob er kommt"],"shape":"sub","vbw":["kommt"],"explain":"Yes/no question → <b>ob</b>, verb at the end.","rule":"yes/no → ob"},{"id":"in-005","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Was kostet das Ticket? → Weißt du, …?","frame":"Weißt du,","answers":["was das Ticket kostet"],"shape":"sub","vbw":["kostet"],"explain":"<b>was das Ticket kostet</b>. Question mark, because the main clause is a question.","rule":"W-word stays"},{"id":"in-006","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Warum ist er nicht gekommen? → Ich weiß nicht, …","frame":"Ich weiß nicht,","answers":["warum er nicht gekommen ist"],"shape":"sub","vbw":["gekommen","ist"],"explain":"Perfekt: <i>gekommen</i> + <b>ist</b> at the end.","rule":"W-word stays"},{"id":"in-007","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Hat sie Zeit? → Ich frage sie, …","frame":"Ich frage sie,","answers":["ob sie Zeit hat"],"shape":"sub","vbw":["hat"],"explain":"Yes/no → <b>ob sie Zeit hat</b>.","rule":"yes/no → ob"},{"id":"in-008","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Wie spät ist es? → Können Sie mir sagen, …?","frame":"Können Sie mir sagen,","answers":["wie spät es ist"],"shape":"sub","vbw":["ist"],"explain":"<b>wie spät es ist</b>.","rule":"W-word stays"},{"id":"in-009","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Wohin fährt der Bus? → Ich möchte wissen, …","frame":"Ich möchte wissen,","answers":["wohin der Bus fährt"],"shape":"sub","vbw":["fährt"],"explain":"<b>wohin der Bus fährt</b>.","rule":"W-word stays"},{"id":"in-010","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Kann er schwimmen? → Ich weiß nicht, …","frame":"Ich weiß nicht,","answers":["ob er schwimmen kann"],"shape":"sub","vbw":["schwimmen","kann"],"explain":"Yes/no → <b>ob</b>; modal verb: <i>schwimmen</i> + <b>kann</b>.","rule":"yes/no → ob"},{"id":"in-011","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Woher kommt sie? → Ich frage mich, …","frame":"Ich frage mich,","answers":["woher sie kommt"],"shape":"sub","vbw":["kommt"],"explain":"<b>woher sie kommt</b>.","rule":"W-word stays"},{"id":"in-012","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Ist das Geschäft geöffnet? → Weißt du, …?","frame":"Weißt du,","answers":["ob das Geschäft geöffnet ist"],"shape":"sub","vbw":["ist"],"explain":"Yes/no → <b>ob</b>; <i>geöffnet</i> + <b>ist</b>.","rule":"yes/no → ob"},{"id":"in-013","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Wie lange dauert der Kurs? → Ich möchte wissen, …","frame":"Ich möchte wissen,","answers":["wie lange der Kurs dauert"],"shape":"sub","vbw":["dauert"],"explain":"<i>wie lange</i> stays together at the front; <b>dauert</b> at the end.","rule":"W-word stays"},{"id":"in-014","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Mit wem spricht er? → Ich weiß nicht, …","frame":"Ich weiß nicht,","answers":["mit wem er spricht"],"shape":"sub","vbw":["spricht"],"explain":"Preposition + question word stay together: <b>mit wem er spricht</b>.","rule":"W-word stays"},{"id":"in-015","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Hat er den Brief geschrieben? → Ich frage mich, …","frame":"Ich frage mich,","answers":["ob er den Brief geschrieben hat"],"shape":"sub","vbw":["geschrieben","hat"],"explain":"Yes/no → <b>ob</b>; <i>geschrieben</i> + <b>hat</b>.","rule":"yes/no → ob"},{"id":"in-016","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Wie viel kostet das? → Weißt du, …?","frame":"Weißt du,","answers":["wie viel das kostet"],"shape":"sub","vbw":["kostet"],"explain":"<b>wie viel das kostet</b>.","rule":"W-word stays"},{"id":"in-017","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Wer hat angerufen? → Ich weiß nicht, …","frame":"Ich weiß nicht,","answers":["wer angerufen hat"],"shape":"sub","vbw":["angerufen","hat"],"explain":"<i>wer</i> is the subject here; block <b>angerufen hat</b>.","rule":"W-word stays"},{"id":"in-018","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Muss ich ein Visum beantragen? → Ich möchte wissen, …","frame":"Ich möchte wissen,","answers":["ob ich ein Visum beantragen muss"],"shape":"sub","vbw":["beantragen","muss"],"explain":"Yes/no → <b>ob</b>; <i>beantragen</i> + <b>muss</b>.","rule":"yes/no → ob"},{"id":"in-019","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Wann fängt der Film an? → Weißt du, …?","frame":"Weißt du,","answers":["wann der Film anfängt"],"shape":"sub","vbw":["anfängt"],"explain":"Separable verb in a subordinate clause → one word: <b>anfängt</b>.","rule":"W-word stays"},{"id":"in-020","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Wo hast du das gekauft? → Sag mir, …","frame":"Sag mir,","answers":["wo du das gekauft hast"],"shape":"sub","vbw":["gekauft","hast"],"explain":"<i>gekauft</i> + <b>hast</b> at the end.","rule":"W-word stays"},{"id":"in-021","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Fährt der Zug pünktlich ab? → Ich weiß nicht, …","frame":"Ich weiß nicht,","answers":["ob der Zug pünktlich abfährt"],"shape":"sub","vbw":["abfährt"],"explain":"Yes/no → <b>ob</b>; the separable verb is one word again: <b>abfährt</b>.","rule":"yes/no → ob"},{"id":"in-022","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Wem gehört das Auto? → Ich frage mich, …","frame":"Ich frage mich,","answers":["wem das Auto gehört"],"shape":"sub","vbw":["gehört"],"explain":"<b>wem das Auto gehört</b>.","rule":"W-word stays"},{"id":"in-023","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Kommst du morgen mit? → Ich möchte wissen, …","frame":"Ich möchte wissen,","answers":["ob du morgen mitkommst"],"shape":"sub","vbw":["mitkommst"],"explain":"Yes/no → <b>ob</b>; <i>mitkommen</i> becomes one word again.","rule":"yes/no → ob"},{"id":"in-024","kind":"typed","topic":"indirekt","question":"Form the indirect question.","prompt":"Welches Buch liest sie? → Ich weiß nicht, …","frame":"Ich weiß nicht,","answers":["welches Buch sie liest"],"shape":"sub","vbw":["liest"],"explain":"<i>welches Buch</i> stays together at the front; <b>liest</b> at the end.","rule":"W-word stays"},{"id":"in-201","kind":"order","topic":"indirekt","question":"Build the indirect question.","frame":"Ich weiß nicht,","tokens":["wo","er","wohnt"],"extra":["ob"],"end":".","shape":"sub","vbw":["wohnt"],"explain":"W-question → the W-word stays; <i>ob</i> would only be for yes/no questions.","rule":"W-word stays","accept":[["wo","er","wohnt"]]},{"id":"in-202","kind":"order","topic":"indirekt","question":"Build the indirect question.","frame":"Ich frage,","tokens":["ob","er","kommt"],"extra":["dass"],"end":".","shape":"sub","vbw":["kommt"],"explain":"Yes/no question → <b>ob</b>; <i>dass</i> doesn't fit a question.","rule":"yes/no → ob","accept":[["ob","er","kommt"]]},{"id":"in-203","kind":"order","topic":"indirekt","question":"Build the indirect question.","frame":"Weißt du,","tokens":["wann","der","Zug","kommt"],"extra":["ob"],"end":"?","shape":"sub","vbw":["kommt"],"explain":"W-word + subject + <b>kommt</b>. Question mark, because <i>Weißt du</i> is a question.","rule":"W-word stays","accept":[["wann","der","Zug","kommt"]]},{"id":"in-204","kind":"order","topic":"indirekt","question":"Build the indirect question.","frame":"Ich möchte wissen,","tokens":["ob","sie","das","verstanden","hat"],"extra":["dass"],"end":".","shape":"sub","vbw":["verstanden","hat"],"explain":"Yes/no → <b>ob</b>; Perfekt block <b>verstanden hat</b>.","rule":"yes/no → ob","accept":[["ob","sie","das","verstanden","hat"]]},{"id":"in-205","kind":"order","topic":"indirekt","question":"Build the indirect question.","frame":"Sag mir,","tokens":["wie","viel","das","kostet"],"end":".","shape":"sub","vbw":["kostet"],"explain":"<i>wie viel</i> stays together; <b>kostet</b> at the end.","rule":"W-word stays","accept":[["wie","viel","das","kostet"]]},{"id":"in-206","kind":"order","topic":"indirekt","question":"Build the indirect question.","frame":"Können Sie mir sagen,","tokens":["wo","der","Bahnhof","ist"],"end":"?","shape":"sub","vbw":["ist"],"explain":"<b>ist</b> at the end; question mark because of the main clause.","rule":"W-word stays","accept":[["wo","der","Bahnhof","ist"]]},{"id":"in-207","kind":"order","topic":"indirekt","question":"Build the indirect question.","frame":"Ich weiß nicht,","tokens":["ob","ich","das","schaffen","kann"],"extra":["dass"],"end":".","shape":"sub","vbw":["schaffen","kann"],"explain":"Yes/no → <b>ob</b>; block <b>schaffen kann</b>.","rule":"yes/no → ob","accept":[["ob","ich","das","schaffen","kann"]]},{"id":"in-208","kind":"order","topic":"indirekt","question":"Build the indirect question.","frame":"Ich frage mich,","tokens":["warum","er","nicht","geantwortet","hat"],"end":".","shape":"sub","vbw":["geantwortet","hat"],"explain":"<i>nicht</i> before the block <b>geantwortet hat</b>.","rule":"W-word stays","accept":[["warum","er","nicht","geantwortet","hat"]]},{"id":"in-209","kind":"order","topic":"indirekt","question":"Build the indirect question.","frame":"Weißt du,","tokens":["ob","er","heute","arbeitet"],"extra":["wenn"],"end":"?","shape":"sub","vbw":["arbeitet"],"explain":"Yes/no → <b>ob</b>; <i>wenn</i> is the trap from English (“if”).","rule":"yes/no → ob","accept":[["ob","er","heute","arbeitet"]]},{"id":"in-210","kind":"order","topic":"indirekt","question":"Build the indirect question.","frame":"Ich weiß nicht,","tokens":["mit","wem","sie","spricht"],"end":".","shape":"sub","vbw":["spricht"],"explain":"Preposition + question word together at the front; <b>spricht</b> at the end.","rule":"W-word stays","accept":[["mit","wem","sie","spricht"]]},{"id":"in-101","kind":"mc","topic":"indirekt","question":"Which sentence is correct?","prompt":"Punctuation","options":["Weißt du, wo er wohnt?","Weißt du, wo er wohnt.","Weißt du, wo wohnt er?","Weißt du wo er wohnt?"],"answer":"Weißt du, wo er wohnt?","explain":"Verb at the end of the subordinate clause; the punctuation follows the main clause (<i>Weißt du</i> = question → ?).","rule":"punctuation follows the main clause"},{"id":"in-102","kind":"mc","topic":"indirekt","question":"Which sentence is correct?","prompt":"Punctuation","options":["Ich weiß nicht, wo er wohnt.","Ich weiß nicht, wo er wohnt?","Ich weiß nicht, wo wohnt er.","Ich weiß nicht wo er wohnt."],"answer":"Ich weiß nicht, wo er wohnt.","explain":"The main clause is a statement → full stop, even though the subordinate clause contains a question.","rule":"punctuation follows the main clause"},{"id":"in-103","kind":"mc","topic":"indirekt","question":"What happens in an indirect yes/no question?","prompt":"Rule","options":["You use <i>ob</i>, and the verb goes to the end.","You use <i>dass</i>, and the verb stays in position 1.","You use <i>wenn</i>, and the verb goes to the end.","You drop the conjunction."],"answer":"You use <i>ob</i>, and the verb goes to the end.","explain":"<i>Kommt er?</i> → <i>Ich frage, <b>ob</b> er kommt.</i>","rule":"yes/no → ob","meta":true},{"id":"in-104","kind":"mc","topic":"indirekt","question":"What happens in an indirect W-question?","prompt":"Rule","options":["The W-word stays; the verb goes to the end.","The W-word is replaced by <i>ob</i>.","The W-word is replaced by <i>dass</i>.","The word order stays as in the direct question."],"answer":"The W-word stays; the verb goes to the end.","explain":"<i>Wo wohnt er?</i> → <i>Ich weiß nicht, <b>wo</b> er <b>wohnt</b>.</i>","rule":"W-word stays","meta":true},{"id":"in-105","kind":"mc","topic":"indirekt","question":"Which sentence is correct?","prompt":"Direkt: Kommt er?","options":["Ich frage, ob er kommt.","Ich frage, dass er kommt.","Ich frage, ob kommt er.","Ich frage, wenn er kommt."],"answer":"Ich frage, ob er kommt.","explain":"Yes/no → <b>ob</b>. Not <i>wenn</i> — English “if” is a trap here.","rule":"yes/no → ob"},{"id":"in-106","kind":"mc","topic":"indirekt","question":"Which indirect question is correct?","prompt":"Direkt: Hast du Zeit?","options":["Ich frage dich, ob du Zeit hast.","Ich frage dich, dass du Zeit hast.","Ich frage dich, wenn du Zeit hast.","Ich frage dich, ob hast du Zeit."],"answer":"Ich frage dich, ob du Zeit hast.","explain":"<b>ob</b> + subject + object + <b>hast</b>.","rule":"yes/no → ob"},{"id":"pr-001","kind":"typed","topic":"produktion","question":"Join the sentences with <b>weil</b>. Main clause first.","prompt":"Ich bleibe zu Hause. Ich bin krank.","answers":["Ich bleibe zu Hause, weil ich krank bin."],"shape":"hs-ns","vbw":["bin"],"explain":"Comma, <i>weil</i>, subject, then <b>bin</b> at the end.","rule":"weil"},{"id":"pr-002","kind":"typed","topic":"produktion","question":"Join the sentences with <b>dass</b>. Main clause first.","prompt":"Ich glaube. Er hat recht.","answers":["Ich glaube, dass er recht hat."],"shape":"hs-ns","vbw":["hat"],"explain":"<i>dass er recht <b>hat</b></i>.","rule":"dass"},{"id":"pr-003","kind":"typed","topic":"produktion","question":"Join the sentences with <b>ob</b>. Main clause first.","prompt":"Ich weiß nicht. Kommt sie morgen?","answers":["Ich weiß nicht, ob sie morgen kommt."],"shape":"hs-ns","vbw":["kommt"],"explain":"Yes/no question → <i>ob</i>; <b>kommt</b> at the end.","rule":"ob"},{"id":"pr-004","kind":"typed","topic":"produktion","question":"Join the sentences with <b>obwohl</b>. Main clause first.","prompt":"Er geht zur Arbeit. Er ist krank.","answers":["Er geht zur Arbeit, obwohl er krank ist."],"shape":"hs-ns","vbw":["ist"],"explain":"<i>obwohl er krank <b>ist</b></i>.","rule":"obwohl"},{"id":"pr-005","kind":"typed","topic":"produktion","question":"Join the sentences with <b>wenn</b>. Subordinate clause first.","prompt":"Ich habe Zeit. Ich rufe dich an.","answers":["Wenn ich Zeit habe, rufe ich dich an."],"shape":"ns-hs","vbw":["habe"],"explain":"Subordinate clause first → <b>rufe</b> right after the comma, <i>an</i> at the end.","rule":"wenn"},{"id":"pr-006","kind":"typed","topic":"produktion","question":"Join the sentences with <b>als</b>. Subordinate clause first.","prompt":"Ich war klein. Ich wohnte in Bonn.","answers":["Als ich klein war, wohnte ich in Bonn."],"shape":"ns-hs","vbw":["war"],"explain":"<i>Als ich klein <b>war</b></i>, then <b>wohnte</b> ich.","rule":"als"},{"id":"pr-007","kind":"typed","topic":"produktion","question":"Join the sentences with <b>damit</b>. Main clause first.","prompt":"Ich lerne viel. Ich bestehe die Prüfung.","answers":["Ich lerne viel, damit ich die Prüfung bestehe."],"shape":"hs-ns","vbw":["bestehe"],"explain":"Purpose → <i>damit</i>; <b>bestehe</b> at the end.","rule":"damit"},{"id":"pr-008","kind":"typed","topic":"produktion","question":"Join the sentences with <b>bevor</b>. Subordinate clause first.","prompt":"Ich gehe. Ich esse.","answers":["Bevor ich gehe, esse ich."],"shape":"ns-hs","vbw":["gehe"],"explain":"<i>Bevor ich <b>gehe</b></i>, <b>esse</b> ich.","rule":"bevor"},{"id":"pr-009","kind":"typed","topic":"produktion","question":"Join the sentences with <b>nachdem</b>. Subordinate clause first.","prompt":"Ich hatte gegessen. Ich ging spazieren.","answers":["Nachdem ich gegessen hatte, ging ich spazieren."],"shape":"ns-hs","vbw":["gegessen","hatte"],"explain":"Plusquamperfekt block <b>gegessen hatte</b>, then <b>ging</b> ich.","rule":"nachdem"},{"id":"pr-010","kind":"typed","topic":"produktion","question":"Join the sentences with <b>während</b>. Subordinate clause first.","prompt":"Er kocht. Sie deckt den Tisch.","answers":["Während er kocht, deckt sie den Tisch."],"shape":"ns-hs","vbw":["kocht"],"explain":"<i>Während er <b>kocht</b></i>, <b>deckt</b> sie …","rule":"während"},{"id":"pr-011","kind":"typed","topic":"produktion","question":"Join the sentences with <b>bis</b>. Main clause first.","prompt":"Warte. Ich bin fertig.","answers":["Warte, bis ich fertig bin."],"shape":"hs-ns","vbw":["bin"],"explain":"<i>bis ich fertig <b>bin</b></i>.","rule":"bis"},{"id":"pr-012","kind":"typed","topic":"produktion","question":"Join the sentences with <b>seitdem</b>. Subordinate clause first.","prompt":"Er wohnt hier. Er ist glücklich.","answers":["Seitdem er hier wohnt, ist er glücklich."],"alt":["Seit er hier wohnt, ist er glücklich."],"altWhy":"As conjunctions, <i>seit</i> and <i>seitdem</i> mean the same.","shape":"ns-hs","vbw":["wohnt"],"explain":"<i>Seitdem er hier <b>wohnt</b></i>, <b>ist</b> er glücklich.","rule":"seitdem"},{"id":"pr-013","kind":"typed","topic":"produktion","question":"Join the sentences with <b>sobald</b>. Subordinate clause first.","prompt":"Er kommt. Wir essen.","answers":["Sobald er kommt, essen wir."],"shape":"ns-hs","vbw":["kommt"],"explain":"<i>Sobald er <b>kommt</b></i>, <b>essen</b> wir.","rule":"sobald"},{"id":"pr-014","kind":"typed","topic":"produktion","question":"Join the sentences with <b>solange</b>. Subordinate clause first.","prompt":"Es regnet. Wir bleiben hier.","answers":["Solange es regnet, bleiben wir hier."],"shape":"ns-hs","vbw":["regnet"],"explain":"<i>Solange es <b>regnet</b></i>, <b>bleiben</b> wir hier.","rule":"solange"},{"id":"pr-015","kind":"typed","topic":"produktion","question":"Join the sentences with <b>falls</b>. Subordinate clause first.","prompt":"Es regnet. Nimm den Schirm.","answers":["Falls es regnet, nimm den Schirm."],"shape":"ns-hs","vbw":["regnet"],"explain":"The imperative <b>nimm</b> also comes right after the comma.","rule":"falls"},{"id":"pr-016","kind":"typed","topic":"produktion","question":"Join the sentences with <b>sodass</b>. Main clause first.","prompt":"Er sprach leise. Ich verstand nichts.","answers":["Er sprach leise, sodass ich nichts verstand."],"alt":["Er sprach leise, so dass ich nichts verstand."],"altWhy":"<i>so dass</i> (two words) is an accepted spelling of <i>sodass</i>.","shape":"hs-ns","vbw":["verstand"],"explain":"Result → <i>sodass</i>; <b>verstand</b> at the end.","rule":"sodass"},{"id":"pr-017","kind":"typed","topic":"produktion","question":"Join the sentences with <b>indem</b>. Main clause first.","prompt":"Man lernt. Man übt.","answers":["Man lernt, indem man übt."],"shape":"hs-ns","vbw":["übt"],"explain":"Method → <i>indem</i>; <b>übt</b> at the end.","rule":"indem"},{"id":"pr-018","kind":"typed","topic":"produktion","question":"Join the sentences with <b>weil</b>. Main clause first.","prompt":"Ich kann nicht kommen. Ich muss arbeiten.","answers":["Ich kann nicht kommen, weil ich arbeiten muss."],"shape":"hs-ns","vbw":["arbeiten","muss"],"explain":"Modal-verb block <b>arbeiten muss</b> at the end.","rule":"weil"},{"id":"pr-019","kind":"typed","topic":"produktion","question":"Join the sentences with <b>dass</b>. Main clause first.","prompt":"Ich hoffe. Du hast gut geschlafen.","answers":["Ich hoffe, dass du gut geschlafen hast."],"shape":"hs-ns","vbw":["geschlafen","hast"],"explain":"Perfekt block <b>geschlafen hast</b> at the end.","rule":"dass"},{"id":"pr-020","kind":"typed","topic":"produktion","question":"Join the sentences with <b>weil</b>. Main clause first.","prompt":"Er ist müde. Er steht jeden Tag früh auf.","answers":["Er ist müde, weil er jeden Tag früh aufsteht."],"shape":"hs-ns","vbw":["aufsteht"],"explain":"The separable verb becomes one word again: <b>aufsteht</b>.","rule":"weil"},{"id":"pr-021","kind":"typed","topic":"produktion","question":"Join the sentences with <b>ob</b>. Main clause first.","prompt":"Ich frage ihn. Kann er mir helfen?","answers":["Ich frage ihn, ob er mir helfen kann."],"shape":"hs-ns","vbw":["helfen","kann"],"explain":"Yes/no → <i>ob</i>; block <b>helfen kann</b>.","rule":"ob"},{"id":"pr-022","kind":"typed","topic":"produktion","question":"Join the sentences with <b>obwohl</b>. Subordinate clause first.","prompt":"Er hat viel gelernt. Er hat die Prüfung nicht bestanden.","answers":["Obwohl er viel gelernt hat, hat er die Prüfung nicht bestanden."],"shape":"ns-hs","vbw":["gelernt","hat"],"explain":"Subordinate-clause block <b>gelernt hat</b>, then <b>hat</b> er … <i>bestanden</i>.","rule":"obwohl"},{"id":"pr-023","kind":"typed","topic":"produktion","question":"Join the sentences with <b>wenn</b>. Subordinate clause first.","prompt":"Du brauchst Hilfe. Du kannst mich anrufen.","answers":["Wenn du Hilfe brauchst, kannst du mich anrufen."],"shape":"ns-hs","vbw":["brauchst"],"explain":"<b>kannst</b> right after the comma, <i>anrufen</i> at the end.","rule":"wenn"},{"id":"pr-024","kind":"typed","topic":"produktion","question":"Join the sentences with <b>weil</b>. Main clause first.","prompt":"Wir bleiben zu Hause. Es wird regnen.","answers":["Wir bleiben zu Hause, weil es regnen wird."],"shape":"hs-ns","vbw":["regnen","wird"],"explain":"Futur block <b>regnen wird</b> at the end.","rule":"weil"},{"id":"pr-025","kind":"typed","topic":"produktion","question":"Join the sentences with <b>dass</b>. Main clause first.","prompt":"Ich hoffe. Das Auto wird morgen repariert.","answers":["Ich hoffe, dass das Auto morgen repariert wird.","Ich hoffe, dass morgen das Auto repariert wird."],"shape":"hs-ns","vbw":["repariert","wird"],"explain":"Passive block <b>repariert wird</b> at the end.","rule":"dass"},{"id":"pr-026","kind":"typed","topic":"produktion","question":"Join the sentences with <b>weil</b>. Main clause first.","prompt":"Er ist nicht gekommen. Er hat arbeiten müssen.","answers":["Er ist nicht gekommen, weil er hat arbeiten müssen."],"shape":"hs-ns","vbw":["hat","arbeiten","müssen"],"explain":"Double infinitive: <b>hat arbeiten müssen</b> — conjugated verb before the infinitives.","rule":"weil"},{"id":"pr-027","kind":"typed","topic":"produktion","question":"Join the sentences with <b>als</b>. Subordinate clause first.","prompt":"Ich kam nach Hause. Niemand war da.","answers":["Als ich nach Hause kam, war niemand da."],"shape":"ns-hs","vbw":["kam"],"explain":"<i>Als ich nach Hause <b>kam</b></i>, <b>war</b> niemand da.","rule":"als"},{"id":"pr-028","kind":"typed","topic":"produktion","question":"Join the sentences with <b>damit</b>. Main clause first.","prompt":"Sie spart Geld. Sie kann sich ein Auto kaufen.","answers":["Sie spart Geld, damit sie sich ein Auto kaufen kann."],"shape":"hs-ns","vbw":["kaufen","kann"],"explain":"Purpose → <i>damit</i>; block <b>kaufen kann</b>.","rule":"damit"},{"id":"pr-029","kind":"typed","topic":"produktion","question":"Join the sentences with <b>nachdem</b>. Main clause first.","prompt":"Wir gingen spazieren. Wir hatten gegessen.","answers":["Wir gingen spazieren, nachdem wir gegessen hatten."],"shape":"hs-ns","vbw":["gegessen","hatten"],"explain":"Plusquamperfekt block <b>gegessen hatten</b> at the end.","rule":"nachdem"},{"id":"pr-030","kind":"typed","topic":"produktion","question":"Join the sentences with <b>weil</b>. Main clause first.","prompt":"Ich bin zu Hause geblieben. Ich habe mich nicht gut gefühlt.","answers":["Ich bin zu Hause geblieben, weil ich mich nicht gut gefühlt habe."],"shape":"hs-ns","vbw":["gefühlt","habe"],"explain":"<i>nicht gut</i> before the block <b>gefühlt habe</b>.","rule":"weil"},{"id":"pr-031","kind":"typed","topic":"produktion","question":"Join the sentences with <b>ob</b>. Main clause first.","prompt":"Weißt du? Ist der Laden heute geöffnet?","answers":["Weißt du, ob der Laden heute geöffnet ist?","Weißt du, ob heute der Laden geöffnet ist?"],"shape":"hs-ns","vbw":["ist"],"explain":"Yes/no → <i>ob</i>; <b>ist</b> at the end; question mark because of <i>Weißt du</i>.","rule":"ob"},{"id":"pr-032","kind":"typed","topic":"produktion","question":"Join the sentences with <b>dass</b>. Main clause first.","prompt":"Ich weiß. Das Konzert findet heute statt.","answers":["Ich weiß, dass das Konzert heute stattfindet.","Ich weiß, dass heute das Konzert stattfindet."],"shape":"hs-ns","vbw":["stattfindet"],"explain":"The separable verb becomes one word again: <b>stattfindet</b>.","rule":"dass"},{"id":"fe-001","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Ich bleibe zu Hause, weil ich bin krank.","options":["Ich bleibe zu Hause, weil ich krank bin.","Ich bleibe zu Hause, weil bin ich krank.","Ich bleibe zu Hause, weil ich krank bin nicht.","Ich bleibe zu Hause, denn ich krank bin."],"answer":"Ich bleibe zu Hause, weil ich krank bin.","explain":"After <i>weil</i> the verb is at the end — not in position 2 as after <i>denn</i>.","rule":"verb at the end"},{"id":"fe-002","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Ich weiß, dass er früh steht auf.","options":["Ich weiß, dass er früh aufsteht.","Ich weiß, dass er steht früh auf.","Ich weiß, dass er aufsteht früh.","Ich weiß, dass auf er früh steht."],"answer":"Ich weiß, dass er früh aufsteht.","explain":"Separable verbs become <b>one word</b> again in a subordinate clause.","rule":"separable verb → one word"},{"id":"fe-003","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Weil ich krank bin, ich bleibe zu Hause.","options":["Weil ich krank bin, bleibe ich zu Hause.","Weil ich bin krank, bleibe ich zu Hause.","Weil ich krank bin, ich zu Hause bleibe.","Weil ich krank bin bleibe ich zu Hause."],"answer":"Weil ich krank bin, bleibe ich zu Hause.","explain":"The fronted subordinate clause is position 1 → the verb <b>bleibe</b> follows right after the comma.","rule":"verb right after the comma"},{"id":"fe-004","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Ich bleibe zu Hause, denn ich krank bin.","options":["Ich bleibe zu Hause, denn ich bin krank.","Ich bleibe zu Hause, denn bin ich krank.","Ich bleibe zu Hause, weil ich bin krank.","Denn ich bin krank, bleibe ich zu Hause."],"answer":"Ich bleibe zu Hause, denn ich bin krank.","explain":"<i>denn</i> is coordinating: main-clause word order follows, verb in position 2.","rule":"denn → position 0"},{"id":"fe-005","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Wenn ich klein war, wohnte ich in Bonn.","options":["Als ich klein war, wohnte ich in Bonn.","Wenn ich klein bin, wohnte ich in Bonn.","Als ich klein war, ich wohnte in Bonn.","Wann ich klein war, wohnte ich in Bonn."],"answer":"Als ich klein war, wohnte ich in Bonn.","explain":"A single period in the past → <b>als</b>. (<i>wann</i> is a question word.)","rule":"als → one-off, past"},{"id":"fe-006","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Ich frage, dass er kommt.","options":["Ich frage, ob er kommt.","Ich frage, wenn er kommt.","Ich frage, ob kommt er.","Ich frage, dass kommt er."],"answer":"Ich frage, ob er kommt.","explain":"After <i>fragen</i> comes <b>ob</b> — a question is not a statement.","rule":"ob → yes/no question"},{"id":"fe-007","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Ich weiß nicht, wo wohnt er.","options":["Ich weiß nicht, wo er wohnt.","Ich weiß nicht, wo er wohnt?","Ich weiß nicht, ob er wohnt.","Ich weiß nicht wo wohnt er."],"answer":"Ich weiß nicht, wo er wohnt.","explain":"In an indirect question the verb goes to the end; the punctuation follows the main clause (statement → full stop).","rule":"W-word stays"},{"id":"fe-008","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Ich glaube dass er recht hat.","options":["Ich glaube, dass er recht hat.","Ich glaube, dass er hat recht.","Ich glaube dass, er recht hat.","Ich glaube, dass, er recht hat."],"answer":"Ich glaube, dass er recht hat.","explain":"A subordinate clause is always separated from the main clause by a comma — here right before <i>dass</i>.","rule":"comma"},{"id":"fe-009","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Er kommt nicht, weil er muss arbeiten.","options":["Er kommt nicht, weil er arbeiten muss.","Er kommt nicht, weil muss er arbeiten.","Er kommt nicht, weil er zu arbeiten muss.","Er kommt nicht, denn er arbeiten muss."],"answer":"Er kommt nicht, weil er arbeiten muss.","explain":"Infinitive, then the conjugated modal verb at the end: <b>arbeiten muss</b>.","rule":"modal verb"},{"id":"fe-010","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Er ist sauer, weil ich nicht kommen können habe.","options":["Er ist sauer, weil ich nicht habe kommen können.","Er ist sauer, weil ich nicht kommen habe können.","Er ist sauer, weil ich habe nicht können kommen.","Er ist sauer, weil ich nicht gekonnt habe kommen."],"answer":"Er ist sauer, weil ich nicht habe kommen können.","explain":"Double infinitive: <b>habe</b> before the two infinitives.","rule":"double infinitive"},{"id":"fe-011","kind":"mc","topic":"fehler","question":"This sentence is wrong (intended meaning: “whether”). What is the correct version?","prompt":"✗ Ich frage, wenn er Zeit hat.","options":["Ich frage, ob er Zeit hat.","Ich frage, dass er Zeit hat.","Ich frage, wann er Zeit hat.","Ich frage, ob hat er Zeit."],"answer":"Ich frage, ob er Zeit hat.","explain":"“if/whether” in an indirect question is <b>ob</b>, never <i>wenn</i>.","rule":"ob → yes/no question"},{"id":"fe-012","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Nachdem ich gegessen hatte, ich ging spazieren.","options":["Nachdem ich gegessen hatte, ging ich spazieren.","Nachdem ich hatte gegessen, ging ich spazieren.","Nachdem ich gegessen hatte, ich spazieren ging.","Nachdem ich gegessen hatte ging ich spazieren."],"answer":"Nachdem ich gegessen hatte, ging ich spazieren.","explain":"After the fronted subordinate clause the verb comes immediately: <b>ging ich</b>.","rule":"verb right after the comma"},{"id":"fe-013","kind":"mc","topic":"fehler","question":"This sentence is wrong (intended meaning: purpose). What is the correct version?","prompt":"✗ Ich lerne viel, sodass ich die Prüfung bestehe.","options":["Ich lerne viel, damit ich die Prüfung bestehe.","Ich lerne viel, obwohl ich die Prüfung bestehe.","Ich lerne viel, damit ich bestehe die Prüfung.","Ich lerne viel, weil ich die Prüfung bestehe."],"answer":"Ich lerne viel, damit ich die Prüfung bestehe.","explain":"Purpose → <b>damit</b>; <i>sodass</i> only describes a result.","rule":"damit"},{"id":"fe-014","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Ich warte, bis das Auto wird repariert.","options":["Ich warte, bis das Auto repariert wird.","Ich warte, bis wird das Auto repariert.","Ich warte, bis das Auto repariert.","Ich warte bis das Auto repariert wird."],"answer":"Ich warte, bis das Auto repariert wird.","explain":"Passive in a subordinate clause: participle, then <b>wird</b> at the very end.","rule":"passive"},{"id":"fe-015","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Weißt du, wo er wohnt.","options":["Weißt du, wo er wohnt?","Weißt du, wo wohnt er?","Weißt du wo er wohnt?","Weißt du, ob er wohnt?"],"answer":"Weißt du, wo er wohnt?","explain":"The main clause <i>Weißt du</i> is a question → question mark.","rule":"punctuation follows the main clause"},{"id":"fe-016","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Als ich Zeit habe, rufe ich dich an.","options":["Wenn ich Zeit habe, rufe ich dich an.","Als ich Zeit hatte, rufe ich dich an.","Wenn ich Zeit habe, ich rufe dich an.","Wann ich Zeit habe, rufe ich dich an."],"answer":"Wenn ich Zeit habe, rufe ich dich an.","explain":"Present/future → <b>wenn</b>; <i>als</i> only for one-off past events.","rule":"wenn → present/future"},{"id":"fe-017","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Ich weiß nicht, ob kommt sie.","options":["Ich weiß nicht, ob sie kommt.","Ich weiß nicht, ob sie kommt?","Ich weiß nicht, ob sie kommen.","Ich weiß nicht ob sie kommt."],"answer":"Ich weiß nicht, ob sie kommt.","explain":"After <i>ob</i> the verb goes to the end.","rule":"yes/no → ob"},{"id":"fe-018","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Sie ist glücklich, seitdem sie hier wohnte.","options":["Sie ist glücklich, seitdem sie hier wohnt.","Sie ist glücklich, seitdem wohnt sie hier.","Sie ist glücklich, bis sie hier wohnt.","Sie ist glücklich, seitdem sie hier gewohnt."],"answer":"Sie ist glücklich, seitdem sie hier wohnt.","explain":"<i>seitdem</i> describes a state that continues until now → Präsens.","rule":"seitdem"},{"id":"fe-019","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Ich hoffe, dass du mich wirst verstehen.","options":["Ich hoffe, dass du mich verstehen wirst.","Ich hoffe, dass du wirst mich verstehen.","Ich hoffe, dass wirst du mich verstehen.","Ich hoffe, dass du mich verstehst wirst."],"answer":"Ich hoffe, dass du mich verstehen wirst.","explain":"Futur in a subordinate clause: infinitive, then <b>wirst</b> at the end.","rule":"Futur I"},{"id":"fe-020","kind":"mc","topic":"fehler","question":"This sentence is wrong. What is the correct version?","prompt":"✗ Ich gehe ins Bett, obwohl ich müde nicht bin.","options":["Ich gehe ins Bett, obwohl ich nicht müde bin.","Ich gehe ins Bett, obwohl ich müde bin nicht.","Ich gehe ins Bett, obwohl nicht ich müde bin.","Ich gehe ins Bett, obwohl ich bin nicht müde."],"answer":"Ich gehe ins Bett, obwohl ich nicht müde bin.","explain":"<i>nicht</i> comes before the predicative adjective: <b>nicht müde bin</b>.","rule":"nicht before the predicative"}];

/* ============================ storage ============================ */
const KEY = "nebensaetze.v1";
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
let PERSISTS = true;
try{ localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe"); }
catch(e){ PERSISTS = false; }

/* ============================ model ============================== */
const DAY = 86400000;
// Leitner boxes. 0 = new or just lapsed, 5 = mastered. A box is only left
// when the item is due, so five correct answers must be spread over ≥ 11 days.
const IVL = [0, 10*60000, 1*DAY, 3*DAY, 7*DAY, 21*DAY];
const MASTER_BOX = 5;

const TOPICS = {
  "verbende":      {name:"Verb at the end",            blurb:"The core rule, separable verbs"},
  "verbblock":     {name:"The verb block",             blurb:"Modal, Perfekt, Futur, passive, double infinitive"},
  "nicht":         {name:"nicht in the clause",         blurb:"Before the verb — or before what?"},
  "voranstellung": {name:"Subordinate clause first",   blurb:"Then the verb follows immediately"},
  "konjunktion":   {name:"Which conjunction?",         blurb:"Meaning: obwohl, damit, indem …"},
  "weil-denn-da":  {name:"weil · denn · da",           blurb:"Same meaning, different word order"},
  "wenn-als":      {name:"wenn or als",                blurb:"Once, or every time?"},
  "dass-ob":       {name:"dass or ob",                 blurb:"Statement or question?"},
  "temporal":      {name:"Time conjunctions",          blurb:"bevor, nachdem, während, bis, seitdem …"},
  "indirekt":      {name:"Indirect questions",         blurb:"W-word stays, yes/no becomes ob"},
  "produktion":    {name:"Joining sentences",          blurb:"Write whole sentences yourself"},
  "fehler":        {name:"Spot the error",             blurb:"Typical stumbling blocks"}
};
const TOPIC_ORDER = Object.keys(TOPICS);

let S = load();
function blank(){
  return {v:1, items:{}, stats:{answered:0, correct:0, sessions:0, days:{}, lastDay:null, streak:0}};
}
function load(){
  try{
    const raw = store.get(KEY);
    if(!raw) return blank();
    const p = JSON.parse(raw);
    if(!p || p.v !== 1) return blank();
    p.items = p.items || {}; p.stats = p.stats || blank().stats;
    p.stats.days = p.stats.days || {};
    return p;
  }catch(e){ return blank(); }
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ store.set(KEY, JSON.stringify(S)); }, 120);
}
function rec(id){
  if(!S.items[id]) S.items[id] = {b:0, due:0, s:0, c:0, w:0, lap:0, seen:0};
  return S.items[id];
}
const isMastered = id => (S.items[id]?.b || 0) >= MASTER_BOX;
const isDue = id => { const r = S.items[id]; return !!r && r.seen > 0 && r.due <= Date.now(); };
const isNew = id => !S.items[id] || S.items[id].seen === 0;

function grade(id, ok){
  const r = rec(id); const now = Date.now();
  const wasDue = r.seen === 0 || r.due <= now;
  r.seen++;
  if(ok){
    r.c++; r.s++;
    // promotion only when the review was actually due -- early extra practice
    // is welcome but must not shortcut the spacing
    if(wasDue){ r.b = Math.min(MASTER_BOX, r.b + 1); r.due = now + IVL[Math.min(r.b, IVL.length-1)]; }
  } else {
    r.w++; r.s = 0; if(r.b > 0) r.lap++; r.b = 0; r.due = now;
  }
  S.stats.answered++; if(ok) S.stats.correct++;
  const d = new Date().toISOString().slice(0,10);
  S.stats.days[d] = (S.stats.days[d]||0) + 1;
  if(S.stats.lastDay !== d){
    const y = new Date(Date.now()-DAY).toISOString().slice(0,10);
    S.stats.streak = (S.stats.lastDay === y) ? (S.stats.streak||0)+1 : 1;
    S.stats.lastDay = d;
  }
  save();
}

/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function norm(s){
  return String(s).toLowerCase()
    .replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
    .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function lev(a,b){
  // edit distance where swapping two adjacent letters counts as one edit
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  const d=[]; for(let i=0;i<=m;i++){ d[i]=[i]; } for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const c = a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+c);
    if(i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j], d[i-2][j-2]+1);
  }
  return d[m][n];
}
const OPENERS = new Set(("weil dass ob da wenn als obwohl damit bevor nachdem waehrend bis seit seitdem sobald solange falls sodass indem denn "+
  "wo wann wie was warum wohin woher wer wem wen welches welche welcher wieso womit nicht kein keine keinen").split(" "));

/* ---- bracket rendering (the Satzklammer) ---- */
// Returns [{w, cls, p}] where cls is "lb" (conjunction), "rb" (verb block),
// "mf" (Mittelfeld) or "" (fixed text); p is trailing punctuation.
function bracketize(text, shape, vbw, tail){
  const raw = String(text).trim().split(/\s+/).filter(Boolean);
  const toks = raw.map(w=>{ const m = w.match(/^(.*?)([.,?!]*)$/); return {w:m[1], p:m[2], cls:""}; });
  const n = toks.length; const vb = (vbw||[]).length;
  const mark = (from, to, cls) => { for(let i=from;i<to;i++) if(i>=0 && i<n) toks[i].cls = cls; };
  if(shape === "sub"){
    mark(0,1,"lb"); mark(n-vb, n, "rb"); mark(1, n-vb, "mf");
  } else if(shape === "main"){
    mark(0,1,"rb"); const t=(tail||[]).length; if(t) mark(n-t, n, "rb"); mark(1, n-t, "mf");
  } else if(shape === "hs-ns" || shape === "ns-hs"){
    const ci = toks.findIndex(t=>t.p.startsWith(","));
    if(ci >= 0){
      if(shape === "hs-ns"){ mark(ci+1, ci+2, "lb"); mark(n-vb, n, "rb"); mark(ci+2, n-vb, "mf"); }
      else { mark(0,1,"lb"); mark(ci+1-vb, ci+1, "rb"); mark(1, ci+1-vb, "mf"); mark(ci+1, ci+2, "rb"); }
    }
  }
  // "so dass" counts as one opener
  toks.forEach((t,i)=>{ if(t.cls==="lb" && t.w.toLowerCase()==="so" && toks[i+1] && toks[i+1].w.toLowerCase()==="dass") toks[i+1].cls="lb"; });
  return toks;
}
function klammerHTML(toks, ghost){
  let out = `<span class="klammer${ghost?" ghost":""}">`;
  toks.forEach((t,i)=>{
    const last = t.cls==="rb" && (i===toks.length-1 || toks[i+1].cls!=="rb");
    // punctuation stays inside the word's span: a flex gap must never open before a comma
    out += (i ? " " : "") + `<span class="w ${t.cls}${last?" last":""}">${esc(t.w)}${t.p?`<span class="p">${esc(t.p)}</span>`:""}</span>`;
  });
  return out + `</span>`;
}
function protectedWords(q){
  const set = new Set(OPENERS);
  (q.vbw||[]).forEach(w=>set.add(norm(w)));
  (q.tail||[]).forEach(w=>set.add(norm(w)));
  const all = (q.answers||[]).concat(q.alt||[]);
  for(const a of all) for(const t of bracketize(a, q.shape, q.vbw)) if(t.cls==="lb"||t.cls==="rb") set.add(norm(t.w));
  return set;
}

// Comma positions as "after word N". The comma before a Nebensatz is part of
// the grammar, not typography, so it is checked separately from the words.
function commaMap(s){
  const out = []; let n = 0;
  for(const tok of String(s).replace(/<[^>]+>/g,"").replace(/[.?!…]/g,"").split(/\s+/)){
    if(!tok) continue;
    const hasComma = /,$/.test(tok);
    const w = norm(tok.replace(/,$/,""));
    if(w){ n++; if(hasComma) out.push(n); }
    else if(hasComma && n) out.push(n);
  }
  return out.join(",");
}

// Returns {res: "ok" | "typo" | "alt" | "comma" | "no"}.
// - words are compared without case, umlauts, ß or punctuation;
// - if the words are right but a comma is missing or misplaced, the result is
//   "comma" -- graded wrong, because the comma is one of the rules;
// - a typo is forgiven one edit away in a word that carries no grammar (never
//   the conjunction, the verb block, or the negation), never on single-word
//   answers, and never in the word right after the comma.
function checkTyped(input, q){
  const u = norm(input);
  if(!u) return {res:"no"};
  const uC = commaMap(input);
  const raw = q.answers.map(a=>({a, k:"ok"})).concat((q.alt||[]).map(a=>({a, k:"alt"})));
  const cands = [];
  for(const c of raw){
    cands.push({t:norm(c.a), cm:commaMap(c.a), k:c.k});
    if(q.frame) cands.push({t:norm(q.frame+" "+c.a), cm:commaMap(q.frame+" "+c.a), k:c.k});
  }
  for(const c of cands) if(u === c.t) return {res: c.cm === uC ? c.k : "comma"};
  const prot = protectedWords(q);
  for(const c of cands){
    const A = c.t.split(" "), U = u.split(" ");
    if(A.length < 2 || A.length !== U.length) continue;
    let diff = -1, n = 0;
    for(let i=0;i<A.length;i++) if(A[i]!==U[i]){ n++; diff=i; }
    if(n !== 1) continue;
    if(prot.has(A[diff]) || prot.has(U[diff])) continue;
    if(c.cm.split(",").includes(String(diff))) continue;   // word right after a comma
    if(lev(A[diff], U[diff]) <= 1) return {res: c.cm !== uC ? "comma" : (c.k==="alt" ? "alt" : "typo")};
  }
  return {res:"no"};
}
function checkOrder(seq, q){
  for(let i=0;i<q.accept.length;i++){
    const a = q.accept[i];
    if(a.length === seq.length && a.every((w,j)=>w===seq[j])) return {res: i===0 ? "ok" : "alt", idx:i};
  }
  return {res:"no"};
}

/* ============================ session ============================ */
let SES = null;

function pool(mode, topic){
  let ids = BANK.map(q=>q.id);
  if(topic) ids = BANK.filter(q=>q.topic===topic).map(q=>q.id);
  if(mode==="leech") return ids.filter(id=>(S.items[id]?.lap||0)>=2 && !isMastered(id));
  return ids;
}

function buildQueue(mode, topic, size){
  const ids = pool(mode, topic);
  if(mode==="exam"){
    // stratified: every topic is represented, the rest is random
    const per = {}; ids.forEach(id=>{ const t = BANK.find(q=>q.id===id).topic; (per[t] ||= []).push(id); });
    const picked = [];
    TOPIC_ORDER.forEach(t=>{ if(per[t]) picked.push(...shuffle(per[t]).slice(0,2)); });
    const rest = shuffle(ids.filter(id=>!picked.includes(id)));
    return shuffle(picked.concat(rest.slice(0, Math.max(0, size - picked.length)))).slice(0, size);
  }
  if(mode==="leech") return shuffle(ids).slice(0, size);

  const due = ids.filter(id=>isDue(id) && !isNew(id)).sort((a,b)=>S.items[a].due - S.items[b].due);
  const fresh = shuffle(ids.filter(isNew));
  const byTopic = {};
  fresh.forEach(id=>{ const t = BANK.find(q=>q.id===id).topic; (byTopic[t] ||= []).push(id); });
  const woven = [];
  let added = true;
  while(added){ added=false;
    for(const t of TOPIC_ORDER){ const q = byTopic[t]; if(q && q.length){ woven.push(q.shift()); added=true; } }
  }
  // extra practice: seen, not yet due, not mastered -- lowest boxes first
  const rest = shuffle(ids.filter(id=>!isNew(id) && !isDue(id) && !isMastered(id)))
                 .sort((a,b)=>(S.items[a].b||0)-(S.items[b].b||0));
  const spot = shuffle(ids.filter(id=>!isNew(id) && !isDue(id) && isMastered(id)));
  // due reviews come first, but a quarter of every round is reserved for new
  // material while any is left -- otherwise a backlog of reviews would starve
  // the rest of the bank forever
  const nNew = Math.min(woven.length, Math.ceil(size/4));
  const nDue = Math.min(due.length, size - nNew);
  return [...due.slice(0, nDue), ...woven, ...due.slice(nDue), ...rest, ...spot].slice(0, size);
}

function start(mode, topic, size){
  const q = buildQueue(mode, topic, size);
  if(!q.length){ renderHome(); show("home"); return; }
  SES = {mode, topic, queue:q, i:0, results:[]};
  S.stats.sessions++; save();
  show("drill"); renderQ();
}
function current(){ return BANK.find(q=>q.id === SES.queue[SES.i]); }
function next(){
  SES.i++;
  if(SES.i >= SES.queue.length){ show("sum"); renderSum(); return; }
  renderQ();
}
// A wrong answer comes back later in the same sitting -- a round is not over
// until everything in it has been answered correctly once.
function requeue(id){
  const at = Math.min(SES.queue.length, SES.i + 4 + Math.floor(Math.random()*3));
  SES.queue.splice(at, 0, id);
}

function show(v){

  $("#nav-home").setAttribute("aria-current", v==="home");
  $("#nav-ref").setAttribute("aria-current", v==="ref");
  $("#nav-prog").setAttribute("aria-current", v==="prog");

function counts(){
  let m=0, mid=0, seen=0, due=0, leech=0;
  for(const q of BANK){
    const r = S.items[q.id];
    if(!r || !r.seen) continue;
    seen++;
    if(r.b >= MASTER_BOX) m++; else if(r.b >= 2) mid++;
    if(isDue(q.id)) due++;
    if((r.lap||0) >= 2 && r.b < MASTER_BOX) leech++;
  }
  return {total:BANK.length, mastered:m, mid, seen, due, leech, newly:BANK.length-seen};
}
function paintRail(){
  const c = counts(), n = c.total;

  m[0].style.width = (c.mastered/n*100)+"%";
  m[1].style.width = (c.mid/n*100)+"%";
  m[2].style.width = ((c.seen-c.mastered-c.mid)/n*100)+"%";
  const acc = S.stats.answered ? Math.round(S.stats.correct/S.stats.answered*100) : 0;
  $("#railstat").innerHTML =
    `<span><b>${c.mastered}</b>/${n} mastered</span>` +
    `<span><b>${c.due}</b> due</span>` +
    `<span><b>${c.newly}</b> new</span>` +
    (S.stats.answered ? `<span>Accuracy <b>${acc}%</b></span>` : "") +
    (S.stats.streak > 1 ? `<span><b>${S.stats.streak}</b>-day streak</span>` : "");
  $("#foot").innerHTML = PERSISTS
    ? "Progress is saved in this browser."
    : "Note: this browser does not allow storage — progress only lasts for this session. Download the file and open it locally.";
}
