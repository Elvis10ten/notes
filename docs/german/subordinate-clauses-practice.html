/* ---------- drill ---------- */
let LOCK = false, BUILT = [];

function questionText(q){
  if(q.question) return q.question;
  if(q.kind === "order") return q.shape === "main" ? "Build the main clause." : "Build the subordinate clause.";
  return "";
}
function renderQ(){
  const q = current(); LOCK = false; BUILT = [];
  const r = S.items[q.id];
  const boxLabel = !r || !r.seen ? "new" : `Box ${r.b}/${MASTER_BOX}`;
  let body = "", hint = "";

  if(q.kind === "mc"){
    const opts = shuffle(q.options);
    body = `<div class="opts"${q.meta ? "" : ' lang="de"'}>` + opts.map((o,i)=>
      `<button class="opt" data-opt="${esc(o)}"><span class="key">${i+1}</span><span>${o}</span></button>`
    ).join("") + `</div>`;
  }
  else if(q.kind === "order"){
    const pool = shuffle(q.tokens.concat(q.extra||[]));
    q._pool = pool;
    body = `<div class="build" lang="de">
        ${q.frame ? `<span class="fixed">${esc(q.frame)}</span>` : ""}
        <span class="line" id="line" aria-live="polite"></span>
        <span class="fixed">${esc((q.after||"") + q.end)}</span>
      </div>
      <div class="pool" id="pool" lang="de">${pool.map((w,i)=>`<button class="chip" data-i="${i}">${esc(w)}</button>`).join("")}</div>
      <div class="bact">
        <button class="btn" id="check" disabled>Check</button>
        <button class="btn ghost" id="undo" disabled>Undo</button>
      </div>`;
    hint = "Tap the words in the right order." + ((q.extra||[]).length ? " Not every word is needed." : "");
  }
  else {
    body = `<div class="typed">
      <input id="inp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
             aria-label="Answer" placeholder="${q.frame ? "Type just the subordinate clause…" : "Type your answer…"}">
      <button class="btn" id="check">Check</button></div>`;
    if(q.hint) hint = q.hint;
  }

  $("#view-drill").innerHTML = `
    <div class="card">
      <div class="eyebrow">
        <span>${TOPICS[q.topic].name}</span><span class="dot"></span>
        <span>${boxLabel}</span><span class="dot"></span>
        <span>${SES.i+1} / ${SES.queue.length}</span>
      </div>
      <p class="qtext">${questionText(q)}</p>
      ${q.kind !== "order" ? `<p class="prompt"${q.meta ? "" : ' lang="de"'}>${q.prompt || ""}</p>` : ""}
      ${hint ? `<p class="hintline">${hint}</p>` : ""}
      ${body}
      <div id="fb"></div>
    </div>`;

  if(q.kind === "mc")
    $("#view-drill").querySelectorAll(".opt").forEach(b=> b.onclick=()=>answerMC(b.dataset.opt));
  if(q.kind === "order"){
    $("#pool").querySelectorAll(".chip").forEach(b=> b.onclick=()=>pick(+b.dataset.i));
    $("#check").onclick = ()=>answerOrder();
    $("#undo").onclick = ()=>unpick(BUILT.length-1);
  }
  if(q.kind === "typed"){
    const inp = $("#inp");
    inp.focus();
    $("#check").onclick = ()=>answerTyped(inp.value);
    inp.onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); LOCK ? next() : answerTyped(inp.value); } };
  }
  paintRail();
}

function pick(i){
  if(LOCK || BUILT.includes(i)) return;
  BUILT.push(i); paintBuild();
}
function unpick(k){
  if(LOCK || k<0 || k>=BUILT.length) return;
  BUILT.splice(k,1); paintBuild();
}
function paintBuild(){
  const q = current();
  const line = $("#line");
  line.innerHTML = BUILT.map((i,k)=>`<button class="chip" data-k="${k}" aria-label="remove ${esc(q._pool[i])}">${esc(q._pool[i])}</button>`).join("");
  line.querySelectorAll(".chip").forEach(b=> b.onclick=()=>unpick(+b.dataset.k));
  $("#pool").querySelectorAll(".chip").forEach(b=> b.classList.toggle("used", BUILT.includes(+b.dataset.i)));
  $("#check").disabled = BUILT.length === 0;
  $("#undo").disabled = BUILT.length === 0;
}

function solutionHTML(q, which){
  if(q.kind === "order"){
    const seq = q.accept[which||0];
    const shape = which ? null : q.shape;   // an accepted alternative (weil↔denn) has its own structure
    const inner = shape ? klammerHTML(bracketize(seq.join(" "), shape, q.vbw, q.tail)) : esc(seq.join(" "));
    return `${q.frame ? `<span class="fixed">${esc(q.frame)}</span> ` : ""}${inner}<span class="fixed">${esc((q.after||"")+q.end)}</span>`;
  }
  if(q.kind === "typed"){
    const a = q.answers[0];
    if(q.prompt.includes("___")){
      const p = q.prompt.replace(/\s*\([^)]*\)\s*$/, "");
      return p.replace("___", `<span class="klammer"><span class="w lb">${esc(a)}</span></span>`);
    }
    const inner = q.shape ? klammerHTML(bracketize(a, q.shape, q.vbw)) : esc(a);
    return `${q.frame ? `<span class="fixed">${esc(q.frame)}</span> ` : ""}${inner}`;
  }
  return q.answer;
}
function plainSolution(q){
  if(q.kind === "order") return (q.frame ? q.frame+" " : "") + q.accept[0].join(" ") + (q.after||"") + q.end;
  if(q.kind === "typed"){
    if(q.prompt.includes("___")) return q.prompt.replace(/<[^>]+>/g,"").replace(/\s*\([^)]*\)\s*$/, "").replace("___", q.answers[0]);
    return (q.frame ? q.frame+" " : "") + q.answers[0];
  }
  return q.answer.replace(/<[^>]+>/g,"");
}

function finish(q, ok, res, userHTML){
  LOCK = true;
  grade(q.id, ok);
  if(!ok && SES.mode !== "exam") requeue(q.id);
  SES.results.push({id:q.id, ok});
  const isLast = SES.i >= SES.queue.length - 1;
  const verdict = !ok ? (res==="comma" ? "Almost — the comma is missing or misplaced" : "Not yet")
                      : res==="typo" ? "Correct — with a typo" : res==="alt" ? "Correct — that works too" : "Correct";
  const showSol = !ok || q.kind === "typed" || (q.kind === "order" && res === "alt");
  const bracketed = q.kind === "order" || (q.kind === "typed" && q.shape);
  $("#fb").innerHTML = `
    <div class="fb">
      <div class="verdict ${ok?"ok":"no"}">${verdict}</div>
      ${userHTML || ""}
      ${showSol ? `<p class="solution" lang="de">${solutionHTML(q)}</p>` : ""}
      ${bracketed && showSol ? `<div class="legend"><span><i></i>Conjunction on the left, verb block on the right — the sentence bracket</span></div>` : ""}
      ${res==="alt" && q.altWhy ? `<p class="altnote">${q.altWhy}</p>` : ""}
      ${res==="comma" ? `<p class="altnote">The words are right. But a comma always precedes a subordinate clause — and when the clause comes first, the comma separates it from the main clause. Without the comma the sentence counts as wrong.</p>` : ""}
      <p class="explain">${q.explain}</p>
      ${q.rule ? `<span class="rulechip">${q.rule}</span>` : ""}
      <div class="fbnav">
        <button class="btn" id="nextbtn">${isLast ? "Summary" : "Next"}</button>
        <span class="kbd"><kbd>Enter</kbd> next</span>
      </div>
    </div>`;
  $("#nextbtn").onclick = next;
  $("#nextbtn").focus();
  paintRail();
}

function answerMC(choice){
  if(LOCK) return;
  const q = current(); const ok = choice === q.answer;
  $("#view-drill").querySelectorAll(".opt").forEach(b=>{
    b.disabled = true;
    const v = b.dataset.opt;
    if(v === q.answer) b.classList.add("is-right");
    else if(v === choice) b.classList.add("is-wrong");
    else b.classList.add("is-dim");
  });
  finish(q, ok);
}

function answerOrder(){
  if(LOCK || !BUILT.length) return;
  const q = current();
  const seq = BUILT.map(i=>q._pool[i]);
  const r = checkOrder(seq, q);
  const ok = r.res !== "no";
  $("#view-drill").querySelectorAll(".chip,#check,#undo").forEach(b=> b.disabled = true);
  // replace the builder with a readable verdict line
  const fixedL = q.frame ? `<span class="fixed">${esc(q.frame)}</span> ` : "";
  const fixedR = `<span class="fixed">${esc((q.after||"")+q.end)}</span>`;
  let userHTML;
  if(ok){
    const shape = r.idx ? null : q.shape;
    const inner = shape ? klammerHTML(bracketize(seq.join(" "), shape, q.vbw, q.tail)) : esc(seq.join(" "));
    userHTML = `<div class="built" lang="de">${fixedL}${inner}${fixedR}</div>`;
    $("#view-drill .build").outerHTML = userHTML; $("#pool").remove(); $("#view-drill .bact").remove();
    userHTML = "";
  } else {
    userHTML = `<div class="built" lang="de"><span class="lab">Your answer</span>${fixedL}${klammerHTML(bracketize(seq.join(" "), null), true)}${fixedR}</div>`;
    $("#view-drill .build").remove(); $("#pool").remove(); $("#view-drill .bact").remove();
  }
  finish(q, ok, r.res, userHTML);
}

function answerTyped(val){
  if(LOCK) return;
  const q = current();
  const r = checkTyped(val, q);
  const ok = r.res === "ok" || r.res === "typo" || r.res === "alt";
  const inp = $("#inp"); inp.disabled = true; $("#check").disabled = true;
  inp.style.borderColor = ok ? "var(--yes)" : "var(--neg)";
  finish(q, ok, r.res);
}

/* ---------- summary ---------- */
function renderSum(){
  const r = SES.results;
  const ok = r.filter(x=>x.ok).length;
  const firstTry = {};
  r.forEach(x=>{ if(!(x.id in firstTry)) firstTry[x.id] = x.ok; });
  const missed = Object.keys(firstTry).filter(id=>!firstTry[id]);
  const c = counts();
  const pct = r.length ? Math.round(ok/r.length*100) : 0;
  $("#view-sum").innerHTML = `
    <h1 class="lede">${SES.mode==="exam" ? `${ok} of ${r.length} correct` : "Round complete"}</h1>
    <p class="sub">${SES.mode==="exam"
      ? `${pct}% — for telc B1 you want to be consistently above 85% here.`
      : `${ok} of ${r.length} answers correct. Wrong items came back in the same round.`}</p>
    <div class="tally">${r.map(x=>`<i class="${x.ok?"":"no"}"></i>`).join("")}</div>
    ${missed.length ? `<h2 class="sec">Missed on the first try</h2>
      <div class="misslist">${missed.map(id=>{
        const q = BANK.find(b=>b.id===id);
        const p = q.kind==="order" ? questionText(q) + " " + (q.frame||"") + " …" : (q.prompt||q.question);
        return `<div class="miss"><div class="p" lang="de">${p}</div>
                <div class="a">→ <em lang="de">${esc(plainSolution(q))}</em></div></div>`;
      }).join("")}</div>` : `<p class="note">Everything right on the first try.</p>`}
    <h2 class="sec">Where you stand</h2>
    <p class="note">${c.mastered} of ${c.total} items mastered · ${c.due} due now · ${c.newly} never seen.</p>
    <div class="tools">
      <button class="btn" id="again">Next round</button>
      <button class="btn ghost" id="tohome">Back to start</button>
    </div>`;
  $("#again").onclick = ()=> start(SES.mode==="exam"?"srs":SES.mode, SES.topic, SIZE);
  $("#tohome").onclick = ()=>{ renderHome(); show("home"); };
}

/* ---------- reference ---------- */
function renderRef(){
  $("#view-ref").innerHTML = `<div class="ref">
    <h1 class="lede">The rules</h1>
    <h2 class="sec">Three things always hold</h2>
    <table>
      <tr><td>Comma</td><td>A subordinate clause is always set off by a comma.</td></tr>
      <tr><td>Verb last</td><td>The conjugated verb goes to the very end; an infinitive or participle sits right before it:
        <span class="ex" lang="de">…, weil ich arbeiten <b>muss</b></span>. Exception, Perfekt + modal: <span class="ex" lang="de">…, weil ich nicht <b>habe</b> kommen können</span>.</td></tr>
      <tr><td>Conjunction ≠ field</td><td>The conjunction does not count as position 1. After it come the subject, then the Mittelfeld (Te-Ka-Mo-Lo), then the verb block.</td></tr>
    </table>
    <h2 class="sec">Subordinate clause first</h2>
    <p>The whole subordinate clause is position 1, so the main-clause verb follows right after the comma:
      <span class="ex" lang="de"><b>Weil</b> ich krank <b>bin</b>, <b>bleibe</b> ich zu Hause.</span></p>
    <h2 class="sec">nicht in a subordinate clause</h2>
    <p>Directly before the verb block — or before a predicative adjective/noun, or a prepositional/direction complement:
      <span class="ex" lang="de">…, weil ich das Buch <b>nicht</b> lese · …, weil ich <b>nicht</b> müde bin · …, weil ich <b>nicht</b> nach Bonn fahre</span>.</p>
    <h2 class="sec">The conjunctions</h2>
    <table lang="de">
      <tr><th lang="en">Conjunction</th><th lang="en">Meaning</th><th lang="en">Example</th></tr>
      <tr><td>dass</td><td lang="en">that — after sagen, glauben, wissen, hoffen …</td><td class="ex">Ich glaube, dass er recht hat.</td></tr>
      <tr><td>ob</td><td lang="en">whether — yes/no question</td><td class="ex">Ich frage, ob er kommt.</td></tr>
      <tr><td>weil</td><td lang="en">because</td><td class="ex">Ich gehe, weil es spät ist.</td></tr>
      <tr><td>da</td><td lang="en">since — known reason, formal</td><td class="ex">Da es regnet, bleiben wir hier.</td></tr>
      <tr><td>wenn</td><td lang="en">if / when — present, future, condition, repeated past</td><td class="ex">Wenn ich Zeit habe, komme ich.</td></tr>
      <tr><td>als</td><td lang="en">when — one-off, past</td><td class="ex">Als ich klein war, wohnte ich in Bonn.</td></tr>
      <tr><td>obwohl</td><td lang="en">although</td><td class="ex">Ich gehe, obwohl ich müde bin.</td></tr>
      <tr><td>damit</td><td lang="en">so that — purpose</td><td class="ex">Ich lerne, damit ich die Prüfung bestehe.</td></tr>
      <tr><td>bevor</td><td lang="en">before</td><td class="ex">Bevor ich gehe, esse ich.</td></tr>
      <tr><td>nachdem</td><td lang="en">after — usually Plusquamperfekt</td><td class="ex">Nachdem ich gegessen hatte, ging ich.</td></tr>
      <tr><td>während</td><td lang="en">while / whereas</td><td class="ex">Während er kocht, deckt sie den Tisch.</td></tr>
      <tr><td>bis</td><td lang="en">until</td><td class="ex">Warte, bis ich fertig bin.</td></tr>
      <tr><td>seit / seitdem</td><td lang="en">since — time</td><td class="ex">Seitdem er hier wohnt, ist er glücklich.</td></tr>
      <tr><td>sobald</td><td lang="en">as soon as</td><td class="ex">Sobald er kommt, essen wir.</td></tr>
      <tr><td>solange</td><td lang="en">as long as</td><td class="ex">Solange es regnet, bleiben wir.</td></tr>
      <tr><td>falls</td><td lang="en">in case</td><td class="ex">Falls es regnet, nimm den Schirm.</td></tr>
      <tr><td>sodass</td><td lang="en">so that — result</td><td class="ex">Er sprach leise, sodass ich nichts verstand.</td></tr>
      <tr><td>indem</td><td lang="en">by …ing — method</td><td class="ex">Man lernt, indem man übt.</td></tr>
    </table>
    <h2 class="sec">weil · denn · da</h2>
    <table>
      <tr><td>weil</td><td>subordinating</td><td class="ex" lang="de">…, weil ich krank <b>bin</b>.</td></tr>
      <tr><td>denn</td><td>coordinating (position 0) — the verb stays in position 2</td><td class="ex" lang="de">…, denn ich <b>bin</b> krank.</td></tr>
      <tr><td>da</td><td>subordinating, formal, reason already known</td><td class="ex" lang="de">Da ich krank <b>bin</b>, …</td></tr>
    </table>
    <h2 class="sec">Indirect questions</h2>
    <p>W-question: the W-word stays. Yes/no question: <b>ob</b>. Verb at the end. The punctuation follows the main clause:
      <span class="ex" lang="de">Ich weiß nicht, wo er wohnt<b>.</b> · Weißt du, wo er wohnt<b>?</b></span></p>
  </div>`;
}

/* ---------- progress ---------- */
function renderProg(){
  const c = counts();
  const acc = S.stats.answered ? Math.round(S.stats.correct/S.stats.answered*100) : 0;
  const rows = TOPIC_ORDER.map(t=>{
    const ids = BANK.filter(q=>q.topic===t).map(q=>q.id);
    let m=0, mid=0, seen=0;
    ids.forEach(id=>{ const r=S.items[id]; if(!r||!r.seen) return; seen++;
      if(r.b>=MASTER_BOX) m++; else if(r.b>=2) mid++; });
    const n = ids.length;
    return `<div class="trow">
      <div class="tname">${TOPICS[t].name}<small>${TOPICS[t].blurb} · ${n} items</small></div>
      <div class="bar">
        <i style="width:${m/n*100}%;background:var(--yes)"></i>
        <i style="width:${mid/n*100}%;background:var(--ink-3)"></i>
        <i style="width:${(seen-m-mid)/n*100}%;background:var(--rule-2)"></i>
      </div>
      <div class="tpct">${m}/${n}</div></div>`;
  }).join("");
  const today = S.stats.days[new Date().toISOString().slice(0,10)] || 0;

  $("#view-prog").innerHTML = `
    <div class="statgrid">
      <div class="stat"><b>${c.mastered}</b><span>mastered of ${c.total}</span></div>
      <div class="stat"><b>${acc}%</b><span>accuracy</span></div>
      <div class="stat"><b>${today}</b><span>answered today</span></div>
      <div class="stat"><b>${S.stats.streak||0}</b><span>day streak</span></div>
    </div>
    <h2 class="sec">Topics</h2>
    ${rows}
    <h2 class="sec">What “mastered” means</h2>
    <p class="note">Every item sits in a box from 0 to 5. A correct answer moves it up one box — but only if it
    was actually due. A wrong answer drops it back to 0. The waiting times are 10 minutes, 1 day, 3 days,
    7 days, 21 days. So box 5 takes at least five correct answers spread over more than eleven days —
    extra practice in between does no harm, but it cannot shortcut the wait.</p>
    <p class="note">Within a round, every item you get wrong comes back until it sticks.
    A round never ends with an open mistake.</p>
    <h2 class="sec">Data</h2>
    <div class="tools">
      <button class="btn ghost" id="exp">Export progress</button>
      <button class="btn ghost" id="imp">Import</button>
      <button class="btn ghost danger" id="rst">Reset everything</button>
    </div>
    <input type="file" id="file" accept="application/json" class="hidden">
    <p class="note" id="dmsg"></p>`;

  $("#exp").onclick = ()=>{
    const b = new Blob([JSON.stringify(S)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "nebensaetze-progress.json";
    a.click(); URL.revokeObjectURL(a.href);
  };
  $("#imp").onclick = ()=> $("#file").click();
  $("#file").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        const p = JSON.parse(fr.result);
        if(!p.items || p.v !== 1) throw 0;
        S = p; save(); renderProg(); paintRail();
        $("#dmsg").textContent = "Progress loaded.";
      }catch(err){ $("#dmsg").textContent = "That file could not be read."; }
    };
    fr.readAsText(f);
  };
  let armed = false;
  $("#rst").onclick = ()=>{
    if(!armed){ armed = true; $("#rst").textContent = "Really? This cannot be undone"; return; }
    S = blank(); store.del(KEY); save(); renderProg(); paintRail();
  };
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e=>{
  if($("#view-drill").classList.contains("hidden")) return;
  const q = current(); if(!q) return;
  if(e.key === "Enter"){
    if(LOCK){ e.preventDefault(); next(); return; }
    if(q.kind === "order" && BUILT.length){ e.preventDefault(); answerOrder(); return; }
    return;
  }
  if(LOCK) return;
  if(q.kind === "order" && e.key === "Backspace" && document.activeElement?.tagName !== "INPUT"){ e.preventDefault(); unpick(BUILT.length-1); return; }
  const n = parseInt(e.key, 10);
  if(!n) return;
  if(q.kind === "mc"){
    const b = $("#view-drill").querySelectorAll(".opt")[n-1];
    if(b){ e.preventDefault(); b.click(); }
  } else if(q.kind === "order"){
    const b = $("#pool").querySelectorAll(".chip:not(.used)")[n-1];
    if(b){ e.preventDefault(); b.click(); }
  }
});

/* ---------- boot ---------- */
$("#nav-home").onclick = ()=>{ renderHome(); show("home"); };
$("#nav-ref").onclick = ()=>{ renderRef(); show("ref"); };
$("#nav-prog").onclick = ()=>{ renderProg(); show("prog"); };
renderHome(); show("home");
</script>
