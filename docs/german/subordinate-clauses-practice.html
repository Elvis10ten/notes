<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subordinate clauses — conjunction first, verb last</title>
<style>
:root{
  --paper:#EDEBE3; --card:#F8F7F2; --card-2:#E7E5DB;
  --ink:#1C1F1A; --ink-2:#5E635A; --ink-3:#8B9083;
  --rule:#D2D1C6; --rule-2:#BFBDB0;
  --acc:#2F4A8A; --acc-soft:#E1E7F4;
  --neg:#B3261E; --neg-soft:#F6E3E0;
  --yes:#2C6A48; --yes-soft:#E0EDE4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#15171A; --card:#1D2024; --card-2:#262A2F;
    --ink:#E9E7DF; --ink-2:#A8ADA3; --ink-3:#767C72;
    --rule:#333840; --rule-2:#454B54;
    --acc:#94ACEA; --acc-soft:#232B40;
    --neg:#E8776A; --neg-soft:#33211F;
    --yes:#7CC79B; --yes-soft:#1B2A22;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:2px}

/* ---------- top rail ---------- */
.rail{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--rule)}
.rail-in{max-width:720px;margin:0 auto;padding:10px 20px 8px}
.rail-top{display:flex;align-items:baseline;gap:10px}
.wordmark{font-family:var(--serif);font-size:17px;letter-spacing:.01em;white-space:nowrap}
.wordmark b{color:var(--acc);font-weight:600}
.rail-spacer{flex:1}
.navbtn{font-size:13px;color:var(--ink-2);padding:3px 8px;border-radius:3px}
.navbtn:hover{color:var(--ink);background:var(--card-2)}
.navbtn[aria-current="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
.meter{margin-top:8px;height:5px;background:var(--card-2);border-radius:3px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .m5{background:var(--yes)} .meter .m3{background:var(--ink-3)} .meter .m1{background:var(--rule-2)}
.railstat{margin-top:5px;font-size:11.5px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap}
.railstat b{color:var(--ink-2);font-weight:600}

/* ---------- shell ---------- */
main{max-width:720px;margin:0 auto;padding:22px 20px 64px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:22px 22px 20px}
.eyebrow{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;margin-bottom:14px}
.eyebrow .dot{width:4px;height:4px;border-radius:50%;background:var(--rule-2)}
.qtext{font-size:14px;color:var(--ink-2);margin:0 0 12px}
.qtext b{color:var(--ink)}
.prompt{font-family:var(--serif);font-size:clamp(1.25rem,4.4vw,1.7rem);line-height:1.35;margin:0 0 4px}
.prompt small{font-size:.72em;color:var(--ink-2)}
.hintline{font-size:13px;color:var(--ink-3);margin:8px 0 0;font-style:italic}

/* ---------- multiple choice ---------- */
.opts{display:flex;flex-direction:column;gap:7px;margin-top:20px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;padding:11px 13px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--rule-2)}
.opt:disabled{cursor:default}
.opt .key{flex:none;font-size:11px;color:var(--ink-3);border:1px solid var(--rule);border-radius:2px;min-width:18px;height:18px;display:grid;place-items:center;margin-top:2px}
.opt.is-right{border-color:var(--yes);background:var(--yes-soft)}
.opt.is-right .key{border-color:var(--yes);color:var(--yes)}
.opt.is-wrong{border-color:var(--neg);background:var(--neg-soft)}
.opt.is-wrong .key{border-color:var(--neg);color:var(--neg)}
.opt.is-dim{opacity:.5}

/* ---------- builder (the Satzklammer) ---------- */
.build{
  font-family:var(--serif);font-size:clamp(1.15rem,4.1vw,1.55rem);line-height:1.5;
  margin-top:16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;
}
.build .fixed{color:var(--ink-2)}
.line{display:inline-flex;flex-wrap:wrap;gap:6px 6px;align-items:baseline;min-width:60px;min-height:1.5em;
  padding:2px 4px;border-bottom:1px dashed var(--rule-2)}
.line:empty::after{content:"…";color:var(--ink-3)}
.chip{
  font-family:var(--serif);font-size:1em;line-height:1.2;
  padding:7px 11px;border:1px solid var(--rule-2);border-radius:3px;background:var(--paper);
  transition:transform .12s ease,border-color .12s ease;
}
.chip:hover:not(:disabled){border-color:var(--ink-3)}
.chip:active:not(:disabled){transform:translateY(1px)}
.chip:disabled{cursor:default}
.line .chip{background:var(--card-2);border-color:transparent;padding:3px 8px}
.line .chip:hover:not(:disabled){border-color:var(--neg);color:var(--neg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--rule);font-size:clamp(1.05rem,3.8vw,1.35rem)}
.pool .chip.used{opacity:0;pointer-events:none}
.bact{margin-top:16px;display:flex;gap:8px;align-items:center}

/* bracket rendering of a finished clause */
.klammer{display:inline-flex;flex-wrap:wrap;gap:0 .3em;align-items:baseline}
.klammer .w{padding:0 1px}
.klammer .w .p{color:var(--ink);font-weight:400;border:none}
.klammer .lb,.klammer .rb{
  color:var(--acc);font-weight:600;
  border-bottom:3px solid var(--acc);padding-bottom:1px;
}
.klammer .rb + .rb{margin-left:-.3em;padding-left:.3em}
.klammer .lb{border-left:3px solid var(--acc);padding-left:4px;margin-left:-4px}
.klammer .rb.last{border-right:3px solid var(--acc);padding-right:4px;margin-right:-4px}
.klammer .mf{color:var(--ink);border-bottom:1px dotted var(--rule-2)}
.ghost{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--neg);text-decoration-thickness:1.5px}
.built{font-family:var(--serif);font-size:clamp(1.15rem,4.1vw,1.55rem);line-height:1.6;margin-top:16px}
.built .fixed{color:var(--ink-2)}
.built .lab{display:block;font-family:var(--sans);font-size:11.5px;color:var(--ink-3);margin-bottom:2px}
.built + .built{margin-top:10px}
.legend{font-size:11.5px;color:var(--ink-3);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:0;border-bottom:3px solid var(--acc);vertical-align:middle;margin-right:5px}

/* ---------- typed ---------- */
.typed{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}
.typed input{flex:1;min-width:200px;font-family:var(--serif);font-size:1.05rem;padding:10px 12px;border:1px solid var(--rule-2);border-radius:3px;background:var(--paper);color:var(--ink)}
.typed input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.btn{padding:10px 18px;border-radius:3px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:14px}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none;color:var(--ink);border-color:var(--rule-2)}
.btn.ghost:hover{background:var(--card-2);opacity:1}

/* ---------- feedback ---------- */
.fb{margin-top:20px;border-top:1px solid var(--rule);padding-top:16px}
.verdict{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--yes)} .verdict.no{color:var(--neg)}
.solution{font-family:var(--serif);font-size:1.15rem;margin:10px 0 0;line-height:1.7}
.solution .fixed{color:var(--ink-2)}
.explain{font-size:14.5px;color:var(--ink-2);margin:10px 0 0;line-height:1.55}
.explain b{color:var(--ink);font-weight:600}
.altnote{font-size:13.5px;color:var(--ink-2);margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--acc);background:var(--acc-soft)}
.rulechip{display:inline-block;margin-top:12px;font-size:11.5px;color:var(--ink-2);border:1px solid var(--rule);border-radius:2px;padding:2px 7px;background:var(--paper)}
.fbnav{margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kbd{font-size:11.5px;color:var(--ink-3)}
.kbd kbd{font-family:var(--sans);border:1px solid var(--rule);border-radius:2px;padding:1px 4px;font-size:10.5px;background:var(--paper)}

/* ---------- home ---------- */
.lede{font-family:var(--serif);font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.25;margin:0 0 10px}
.sub{color:var(--ink-2);font-size:15px;margin:0 0 26px;max-width:56ch}
.modes{display:grid;gap:9px}
.mode{display:flex;gap:14px;align-items:baseline;text-align:left;width:100%;border:1px solid var(--rule);border-radius:4px;padding:14px 16px;background:var(--card)}
.mode:hover{border-color:var(--rule-2)}
.mode:disabled{opacity:.45;cursor:default}
.mode h3{margin:0;font-size:15px;font-weight:600}
.mode p{margin:3px 0 0;font-size:13px;color:var(--ink-2)}
.mode .count{margin-left:auto;font-size:12px;color:var(--ink-3);flex:none}
.seg{display:flex;gap:6px;margin:22px 0 0;flex-wrap:wrap;align-items:center}
.seg span{font-size:12.5px;color:var(--ink-3);margin-right:2px}
.segbtn{font-size:12.5px;padding:4px 10px;border:1px solid var(--rule);border-radius:3px;color:var(--ink-2)}
.segbtn[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--card)}

/* ---------- progress / reference ---------- */
.trow{display:grid;grid-template-columns:1fr 92px 46px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule)}
.trow:last-child{border-bottom:none}
.tname{font-size:14px}
.tname small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.bar{height:6px;background:var(--card-2);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.tpct{font-size:12.5px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin:0 0 24px}
.stat b{display:block;font-family:var(--serif);font-size:1.6rem;line-height:1.1}
.stat span{font-size:12px;color:var(--ink-3)}
h2.sec{font-size:13px;font-weight:600;color:var(--ink-2);margin:28px 0 6px}
.note{font-size:13px;color:var(--ink-3);line-height:1.6;margin:10px 0 0}
.danger{color:var(--neg);border-color:var(--neg)}
.btn.ghost.danger{color:var(--neg);border-color:var(--neg)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tools .btn{font-size:13px;padding:7px 13px}
.ref{font-size:14px;line-height:1.6}
.ref table{border-collapse:collapse;width:100%;margin:8px 0 0;font-size:13.5px}
.ref th,.ref td{text-align:left;vertical-align:top;padding:7px 8px 7px 0;border-bottom:1px solid var(--rule)}
.ref th{font-weight:600;color:var(--ink-2);font-size:12px}
.ref td:first-child{white-space:nowrap;font-family:var(--serif);font-size:15px}
.ref .ex{font-family:var(--serif)}
.ref .ex b{color:var(--acc)}

/* ---------- summary ---------- */
.tally{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 0}
.tally i{width:11px;height:11px;border-radius:2px;background:var(--yes)}
.tally i.no{background:var(--neg)}
.misslist{margin:18px 0 0;border-top:1px solid var(--rule)}
.miss{padding:12px 0;border-bottom:1px solid var(--rule);font-size:14px}
.miss .p{font-family:var(--serif);font-size:1rem}
.miss .a{color:var(--ink-2);font-size:13px;margin-top:3px}
.miss .a em{color:var(--acc);font-style:normal}
footer{max-width:720px;margin:0 auto;padding:0 20px 40px;font-size:12px;color:var(--ink-3)}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){.chip{transition:none}}
@media (max-width:420px){.navbtn{padding:3px 6px;font-size:12.5px}.wordmark{font-size:15.5px}}
</style>
</head>
<body>

<div class="rail">
  <div class="rail-in">
    <div class="rail-top">
      <span class="wordmark">Nebensätze: <b>weil</b> … <b>bin</b></span>
      <span class="rail-spacer"></span>
      <button class="navbtn" id="nav-home">Home</button>
      <button class="navbtn" id="nav-ref">Rules</button>
      <button class="navbtn" id="nav-prog">Progress</button>
    </div>
    <div class="meter" id="meter" title="Mastered / in progress / new">
      <i class="m5" style="width:0"></i><i class="m3" style="width:0"></i><i class="m1" style="width:0"></i>
    </div>
    <div class="railstat" id="railstat"></div>
  </div>
</div>

<main>
  <section id="view-home"></section>
  <section id="view-drill" class="hidden"></section>
  <section id="view-ref" class="hidden"></section>
  <section id="view-prog" class="hidden"></section>
  <section id="view-sum" class="hidden"></section>
</main>

<footer id="foot"></footer>

const BANK = [{"id":"ve-001","kind":"order","topic":"verbende","frame":"Ich bleibe zu Hause,","tokens":["weil","ich","krank","bin"],"end":".","shape":"sub","vbw":["bin"],"explain":"The conjugated verb <b>bin</b> goes to the very end of the subordinate clause.","rule":"verb at the end","accept":[["weil","ich","krank","bin"]]},{"id":"ve-002","kind":"order","topic":"verbende","frame":"Er kommt nicht,","tokens":["weil","er","keine","Zeit","hat"],"end":".","shape":"sub","vbw":["hat"],"explain":"Conjunction → subject → Mittelfeld → <b>hat</b> at the end.","rule":"verb at the end","accept":[["weil","er","keine","Zeit","hat"]]},{"id":"ve-003","kind":"order","topic":"verbende","frame":"Sie sagt,","tokens":["dass","sie","müde","ist"],"end":".","shape":"sub","vbw":["ist"],"explain":"After <i>dass</i> the same rule applies: <b>ist</b> at the end.","rule":"verb at the end","accept":[["dass","sie","müde","ist"]]},{"id":"ve-004","kind":"order","topic":"verbende","frame":"Ich weiß,","tokens":["dass","er","in","Berlin","wohnt"],"end":".","shape":"sub","vbw":["wohnt"],"explain":"The place phrase stays in the Mittelfeld; <b>wohnt</b> closes the clause.","rule":"verb at the end","accept":[["dass","er","in","Berlin","wohnt"]]},{"id":"ve-005","kind":"order","topic":"verbende","frame":"Wir bleiben hier,","tokens":["solange","es","regnet"],"end":".","shape":"sub","vbw":["regnet"],"explain":"<i>solange</i> is a subordinating conjunction → <b>regnet</b> at the end.","rule":"verb at the end","accept":[["solange","es","regnet"]]},{"id":"ve-006","kind":"order","topic":"verbende","frame":"Ich frage,","tokens":["ob","sie","morgen","kommt"],"end":".","shape":"sub","vbw":["kommt"],"explain":"After <i>ob</i>: subject, then the time expression, then <b>kommt</b>.","rule":"verb at the end","accept":[["ob","sie","morgen","kommt"]]},{"id":"ve-007","kind":"order","topic":"verbende","frame":"Er geht ins Bett,","tokens":["obwohl","es","noch","früh","ist"],"end":".","shape":"sub","vbw":["ist"],"explain":"<i>obwohl</i> + subject + Mittelfeld + <b>ist</b>.","rule":"verb at the end","accept":[["obwohl","es","noch","früh","ist"]]},{"id":"ve-008","kind":"order","topic":"verbende","frame":"Ich lerne Deutsch,","tokens":["weil","ich","in","Deutschland","arbeite"],"end":".","shape":"sub","vbw":["arbeite"],"explain":"<b>arbeite</b> moves to the end; <i>in Deutschland</i> stays before it.","rule":"verb at the end","accept":[["weil","ich","in","Deutschland","arbeite"]]},{"id":"ve-009","kind":"order","topic":"verbende","frame":"Sie ist glücklich,","tokens":["seitdem","sie","hier","wohnt"],"end":".","shape":"sub","vbw":["wohnt"],"explain":"<i>seitdem</i> introduces a subordinate clause → <b>wohnt</b> at the end.","rule":"verb at the end","accept":[["seitdem","sie","hier","wohnt"]]},{"id":"ve-010","kind":"order","topic":"verbende","frame":"Warte,","tokens":["bis","ich","fertig","bin"],"end":".","shape":"sub","vbw":["bin"],"explain":"After <i>bis</i> too: subject, predicative, then <b>bin</b>.","rule":"verb at the end","accept":[["bis","ich","fertig","bin"]]},{"id":"ve-011","kind":"order","topic":"verbende","frame":"Ich weiß,","tokens":["dass","er","früh","aufsteht"],"extra":["steht","auf"],"end":".","shape":"sub","vbw":["aufsteht"],"explain":"In a subordinate clause the separable verb becomes <b>one word</b> again: <i>aufsteht</i>, not <i>steht … auf</i>.","rule":"separable verb → one word","accept":[["dass","er","früh","aufsteht"]]},{"id":"ve-012","kind":"order","topic":"verbende","frame":"Sie sagt,","tokens":["dass","sie","mich","anruft"],"extra":["ruft","an"],"end":".","shape":"sub","vbw":["anruft"],"explain":"Separable verb at the end as one word: <b>anruft</b>.","rule":"separable verb → one word","accept":[["dass","sie","mich","anruft"]]},{"id":"ve-013","kind":"order","topic":"verbende","frame":"Er ist müde,","tokens":["weil","er","jeden","Tag","früh","aufsteht"],"extra":["steht","auf"],"end":".","shape":"sub","vbw":["aufsteht"],"explain":"Time expressions (<i>jeden Tag</i>, <i>früh</i>), then the whole verb <b>aufsteht</b>.","rule":"separable verb → one word","accept":[["weil","er","jeden","Tag","früh","aufsteht"]]},{"id":"ve-014","kind":"order","topic":"verbende","frame":"Ich freue mich,","tokens":["wenn","du","mich","besuchst"],"end":".","shape":"sub","vbw":["besuchst"],"explain":"<i>wenn</i> + subject + object + <b>besuchst</b>.","rule":"verb at the end","accept":[["wenn","du","mich","besuchst"]]},{"id":"ve-015","kind":"order","topic":"verbende","frame":"Es ist schade,","tokens":["dass","du","nicht","kommst"],"end":".","shape":"sub","vbw":["kommst"],"explain":"<i>nicht</i> sits directly before the verb; <b>kommst</b> is at the very end.","rule":"verb at the end","accept":[["dass","du","nicht","kommst"]]},{"id":"ve-016","kind":"order","topic":"verbende","frame":"Ich blieb zu Hause,","tokens":["weil","ich","keine","Zeit","hatte"],"end":".","shape":"sub","vbw":["hatte"],"explain":"The Präteritum changes nothing: the conjugated verb <b>hatte</b> is at the end.","rule":"Präteritum","accept":[["weil","ich","keine","Zeit","hatte"]]},{"id":"ve-017","kind":"order","topic":"verbende","frame":"Ich wohnte in Bonn,","tokens":["als","ich","klein","war"],"end":".","shape":"sub","vbw":["war"],"explain":"<i>als</i> for a one-off event in the past; <b>war</b> at the end.","rule":"Präteritum","accept":[["als","ich","klein","war"]]},{"id":"ve-018","kind":"order","topic":"verbende","frame":"Er wusste nicht,","tokens":["wo","sie","wohnte"],"end":".","shape":"sub","vbw":["wohnte"],"explain":"A question word also introduces a subordinate clause → <b>wohnte</b> at the end.","rule":"Präteritum","accept":[["wo","sie","wohnte"]]},{"id":"ve-019","kind":"order","topic":"verbende","frame":"Sie fragte,","tokens":["ob","ich","Zeit","hatte"],"end":".","shape":"sub","vbw":["hatte"],"explain":"<i>ob</i> + subject + object + <b>hatte</b>.","rule":"Präteritum","accept":[["ob","ich","Zeit","hatte"]]},{"id":"ve-020","kind":"order","topic":"verbende","frame":"Wir gehen spazieren,","tokens":["sobald","die","Sonne","scheint"],"end":".","shape":"sub","vbw":["scheint"],"explain":"<i>sobald</i> + subject (<i>die Sonne</i>) + <b>scheint</b>.","rule":"verb at the end","accept":[["sobald","die","Sonne","scheint"]]},{"id":"ve-021","kind":"order","topic":"verbende","frame":"Man lernt viel,","tokens":["indem","man","jeden","Tag","übt"],"end":".","shape":"sub","vbw":["übt"],"explain":"<i>indem</i> names the method; <b>übt</b> is at the end.","rule":"verb at the end","accept":[["indem","man","jeden","Tag","übt"]]},{"id":"ve-022","kind":"order","topic":"verbende","frame":"Nimm den Schirm mit,","tokens":["falls","es","regnet"],"end":".","shape":"sub","vbw":["regnet"],"explain":"<i>falls</i> + subject + <b>regnet</b>.","rule":"verb at the end","accept":[["falls","es","regnet"]]},{"id":"ve-023","kind":"order","topic":"verbende","frame":"Er kocht,","tokens":["während","sie","den","Tisch","deckt"],"end":".","shape":"sub","vbw":["deckt"],"explain":"The object <i>den Tisch</i> stays in the Mittelfeld; <b>deckt</b> closes the clause.","rule":"verb at the end","accept":[["während","sie","den","Tisch","deckt"]]},{"id":"ve-024","kind":"order","topic":"verbende","frame":"Ich esse etwas,","tokens":["bevor","ich","gehe"],"end":".","shape":"sub","vbw":["gehe"],"explain":"<i>bevor</i> + subject + <b>gehe</b>.","rule":"verb at the end","accept":[["bevor","ich","gehe"]]},{"id":"ve-025","kind":"order","topic":"verbende","frame":"Sie lernt viel,","tokens":["damit","sie","die","Prüfung","besteht"],"end":".","shape":"sub","vbw":["besteht"],"explain":"<i>damit</i> + subject + object + <b>besteht</b>.","rule":"verb at the end","accept":[["damit","sie","die","Prüfung","besteht"]]},{"id":"ve-026","kind":"order","topic":"verbende","frame":"Er sprach leise,","tokens":["sodass","ich","nichts","verstand"],"end":".","shape":"sub","vbw":["verstand"],"explain":"<i>sodass</i> + subject + object + <b>verstand</b>.","rule":"Präteritum","accept":[["sodass","ich","nichts","verstand"]]}, ,"zurückkommst"]]},{"id":"ve-101","kind":"mc","topic":"verbende","question":"Which sentence is correct?","prompt":"Verb in the subordinate clause","options":["Ich bleibe zu Hause, weil ich krank bin.","Ich bleibe zu Hause, weil ich bin krank.","Ich bleibe zu Hause, weil bin ich krank.","Ich bleibe zu Hause weil ich krank bin."],"answer":"Ich bleibe zu Hause, weil ich krank bin.","explain":"After <i>weil</i> the verb goes to the end, and a comma precedes the conjunction.","rule":"verb at the end"},{"id":"ve-102","kind":"mc","topic":"verbende","question":"Which sentence is correct?","prompt":"Separable verb in the subordinate clause","options":["Ich weiß, dass er früh aufsteht.","Ich weiß, dass er früh steht auf.","Ich weiß, dass er steht früh auf.","Ich weiß, dass er aufsteht früh."],"answer":"Ich weiß, dass er früh aufsteht.","explain":"In a subordinate clause the separable verb is not split: <b>aufsteht</b> stands as one word at the end.","rule":"separable verb → one word"},{"id":"ve-103","kind":"mc","topic":"verbende","question":"Where does the conjugated verb go in a subordinate clause?","prompt":"Rule","options":["Right at the end of the subordinate clause.","In position 2, as in a main clause.","Directly after the conjunction.","Directly before the subject."],"answer":"Right at the end of the subordinate clause.","explain":"This is the core rule: conjunction → subject → Mittelfeld → <b>verb</b>.","rule":"verb at the end","meta":true},{"id":"ve-104","kind":"mc","topic":"verbende","question":"Does the conjunction count as position 1 of the subordinate clause?","prompt":"Rule","options":["No — it sits outside the sentence fields and only introduces the clause.","Yes — that's why the verb is in position 2.","Yes, but only with <i>weil</i> and <i>dass</i>.","Only when the subordinate clause comes first."],"answer":"No — it sits outside the sentence fields and only introduces the clause.","explain":"The conjunction is not a sentence field. That is why the subject follows directly and the verb goes to the end.","rule":"conjunction ≠ a field","meta":true},{"id":"ve-105","kind":"mc","topic":"verbende","question":"Which sentence is correct?","prompt":"Präteritum in the subordinate clause","options":["Ich blieb zu Hause, weil ich keine Zeit hatte.","Ich blieb zu Hause, weil ich hatte keine Zeit.","Ich blieb zu Hause, weil hatte ich keine Zeit.","Ich blieb zu Hause, weil ich keine hatte Zeit."],"answer":"Ich blieb zu Hause, weil ich keine Zeit hatte.","explain":"Tense changes nothing about the position: <b>hatte</b> is at the end.","rule":"Präteritum"},{"id":"ve-106","kind":"mc","topic":"verbende","question":"How is a separable verb written in a subordinate clause?","prompt":"Rule","options":["As one word at the end: <i>…, weil er früh aufsteht.</i>","Split, as in a main clause: <i>…, weil er früh steht auf.</i>","With the prefix at the front: <i>…, weil auf er früh steht.</i>","As two words at the end: <i>…, weil er früh auf steht.</i>"],"answer":"As one word at the end: <i>…, weil er früh aufsteht.</i>","explain":"Once the verb is at the end, prefix and stem meet again.","rule":"separable verb → one word","meta":true},{"id":"ve-107","kind":"mc","topic":"verbende","question":"Which sentence is correct?","prompt":"Separable verb","options":["Sie fragt, ob das Konzert heute stattfindet.","Sie fragt, ob das Konzert findet heute statt.","Sie fragt, ob findet das Konzert heute statt.","Sie fragt, ob das Konzert heute findet statt."],"answer":"Sie fragt, ob das Konzert heute stattfindet.","explain":"<i>stattfinden</i> stands as one word at the end of the subordinate clause.","rule":"separable verb → one word"},{"id":"ve-108","kind":"mc","topic":"verbende","question":"Which sentence is punctuated correctly?","prompt":"Comma","options":["Ich hoffe, dass du kommst.","Ich hoffe dass du kommst.","Ich hoffe, dass, du kommst.","Ich, hoffe dass du kommst."],"answer":"Ich hoffe, dass du kommst.","explain":"A subordinate clause is <b>always</b> set Ich komme nicht, weil ich muss arbeiten.","Ich komme nicht, weil muss ich arbeiten.","Ich komme nicht, weil ich muss zu arbeiten."],"answer":"Ich komme nicht, weil ich arbeiten muss.","explain":"Infinitive first, conjugated modal verb at the very end: <b>arbeiten muss</b>.","rule":"modal verb"},{"id":"vb-102","kind":"mc","topic":"verbblock","question":"Which sentence is correct?","prompt":"Perfekt in the subordinate clause","options":["Ich bin müde, weil ich schlecht geschlafen habe.","Ich bin müde, weil ich habe schlecht geschlafen.","Ich bin müde, weil ich schlecht habe geschlafen.","Ich bin müde, weil ich geschlafen schlecht habe."],"answer":"Ich bin müde, weil ich schlecht geschlafen habe.","explain":"Participle, then auxiliary: <b>geschlafen habe</b>.","rule":"Perfekt"},{"id":"vb-103","kind":"mc","topic":"verbblock","question":"Which sentence is correct?","prompt":"Perfekt + modal verb","options":["Er ist sauer, weil ich nicht habe kommen können.","Er ist sauer, weil ich nicht kommen können habe.","Er ist sauer, weil ich nicht kommen habe können.","Er ist sauer, weil ich habe nicht kommen können."],"answer":"Er ist sauer, weil ich nicht habe kommen können.","explain":"The exception: with a double infinitive, <b>habe</b> moves before the two infinitives; <i>nicht</i> comes before the whole verb block.","rule":"double infinitive"},{"id":"vb-104","kind":"mc","topic":"verbblock","question":"Which sentence is correct?","prompt":"Futur I in the subordinate clause","options":["Ich glaube, dass er morgen kommen wird.","Ich glaube, dass er wird morgen kommen.","Ich glaube, dass er morgen wird kommen.","Ich glaube, dass er kommen morgen wird."],"answer":"Ich glaube, dass er morgen kommen wird.","explain":"Infinitive <i>kommen</i>, then conjugated <b>wird</b>.","rule":"Futur I"},{"id":"vb-105","kind":"mc","topic":"verbblock","question":"Which sentence is correct?","prompt":"Passive in the subordinate clause","options":["Ich warte, bis das Auto repariert wird.","Ich warte, bis das Auto wird repariert.","Ich warte, bis wird das Auto repariert.","Ich warte, bis das Auto repariert ist worden."],"answer":"Ich warte, bis das Auto repariert wird.","explain":"Participle <i>repariert</i>, then the conjugated <b>wird</b>.","rule":"passive"},{"id":"vb-106","kind":"mc","topic":"verbblock","question":"In what order does the verb block appear at the end of a subordinate clause?","prompt":"Rule","options":["Infinitive or participle first, then the conjugated verb: <i>arbeiten muss</i>, <i>geschlafen habe</i>.","Conjugated verb first, then infinitive or participle: <i>muss arbeiten</i>.","The order is free.","The conjugated verb is in position 2, the rest at the end."],"answer":"Infinitive or participle first, then the conjugated verb: <i>arbeiten muss</i>, <i>geschlafen habe</i>.","explain":"The conjugated verb takes the last slot; everything non-conjugated sits directly before it.","rule":"verb block","meta":true},{"id":"vb-107","kind":"mc","topic":"verbblock","question":"What is special about Perfekt + modal verb in a subordinate clause?","prompt":"Rule","options":["The conjugated <i>habe/hatte</i> goes <u>before</u> the two infinitives: <i>…, weil ich habe kommen müssen.</i>","The modal verb becomes a participle: <i>…, weil ich kommen gemusst habe.</i>","Nothing — the conjugated verb is at the very end as usual.","The subordinate clause then always comes first."],"answer":"The conjugated <i>habe/hatte</i> goes <u>before</u> the two infinitives: <i>…, weil ich habe kommen müssen.</i>","explain":"Double infinitive: the one exception to “conjugated verb last”.","rule":"double infinitive","meta":true},{"id":"vb-108","kind":"mc","topic":"verbblock","question":"Which sentence is correct?","prompt":"Perfekt with sein","options":["Ich weiß nicht, ob sie schon angekommen ist.","Ich weiß nicht, ob sie ist schon angekommen.","Ich weiß nicht, ob sie schon ist angekommen.","Ich weiß nicht, ob sie schon angekommen hat."],"answer":"Ich weiß nicht, ob sie schon angekommen ist.","explain":"<i>ankommen</i> forms the Perfekt with <i>sein</i>; <b>ist</b> is at the end.","rule":"Perfekt"},{"id":"vb-109","kind":"mc","topic":"verbblock","question":"Which sentence is correct?","prompt":"Plusquamperfekt after nachdem","options":["Nachdem er gegessen hatte, ging er spazieren.","Nachdem er hatte gegessen, ging er spazieren.","Nachdem er gegessen hatte, er ging spazieren.","Nachdem er gegessen, ging er spazieren."],"answer":"Nachdem er gegessen hatte, ging er spazieren.","explain":"<i>gegessen</i> + <b>hatte</b> at the end of the subordinate clause; the main-clause verb follows immediately.","rule":"Plusquamperfekt"},{"id":"vb-110","kind":"mc","topic":"verbblock","question":"Which sentence is correct?","prompt":"Passive Perfekt","options":["Er sagt, dass das Haus verkauft worden ist.","Er sagt, dass das Haus ist verkauft worden.","Er sagt, dass das Haus verkauft ist worden.","Er sagt, dass das Haus worden verkauft ist."],"answer":"Er sagt, dass das Haus verkauft worden ist.","explain":"Participle + <i>worden</i> + conjugated <b>ist</b>: the conjugated verb stays last.","rule":"passive"},{"id":"ni-001","kind":"order","topic":"nicht","question":"Build the subordinate clause. Negate the whole clause.","frame":"Ich bin zu Hause,","tokens":["weil","ich","das","Buch","nicht","lese"],"end":".","shape":"sub","vbw":["lese"],"explain":"Definite object, then <i>nicht</i>, then the verb: <b>… das Buch nicht lese</b>.","rule":"nicht before the verb","accept":[["weil","ich","das","Buch","nicht","lese"]]},{"id":"ni-002","kind":"order","topic":"nicht","question":"Build the subordinate clause. Negate the whole clause.","frame":"Er ist traurig,","tokens":["weil","ich","nicht","kommen","kann"],"end":".","shape":"sub","vbw":["kommen","kann"],"explain":"<i>nicht</i> sits directly before the verb block <b>kommen kann</b>.","rule":"nicht before the verb block","accept":[["weil","ich","nicht","kommen","kann"]]},{"id":"ni-003","kind":"order","topic":"nicht"  comma.","rule":"subordinate clause first","accept":[["Obwohl","er","müde","ist"]]},{"id":"vo-020","kind":"order","topic":"voranstellung","question":"Build the fronted subordinate clause.","tokens":["Nachdem","wir","gegessen","hatten"],"after":", gingen wir spazieren","end":".","shape":"sub","vbw":["gegessen","hatten"],"explain":"Block <b>gegessen hatten</b> before the comma; the main clause starts with <i>gingen</i>.","rule":"subordinate clause first","accept":[["Nachdem","wir","gegessen","hatten"]]},{"id":"vo-201","kind":"typed","topic":"voranstellung","question":"Move the subordinate clause to the front.","prompt":"Ich bleibe zu Hause, weil ich krank bin.","answers":["Weil ich krank bin, bleibe ich zu Hause."],"shape":"ns-hs","vbw":["bin"],"explain":"The subordinate clause becomes position 1 → <b>bleibe</b> follows right after the comma, then <i>ich</i>.","rule":"verb right after the comma"},{"id":"vo-202","kind":"typed","topic":"voranstellung","question":"Move the subordinate clause to the front.","prompt":"Ich rufe dich an, wenn ich Zeit habe.","answers":["Wenn ich Zeit habe, rufe ich dich an."],"shape":"ns-hs","vbw":["habe"],"explain":"<b>rufe</b> after the comma, <i>an</i> at the end.","rule":"verb right after the comma"},{"id":"vo-203","kind":"typed","topic":"voranstellung","question":"Move the subordinate clause to the front.","prompt":"Ich wohnte in Bonn, als ich klein war.","answers":["Als ich klein war, wohnte ich in Bonn."],"shape":"ns-hs","vbw":["war"],"explain":"<b>wohnte</b> right after the comma.","rule":"verb right after the comma"},{"id":"vo-204","kind":"typed","topic":"voranstellung","question":"Move the subordinate clause to the front.","prompt":"Wir gehen spazieren, obwohl es regnet.","answers":["Obwohl es regnet, gehen wir spazieren."],"shape":"ns-hs","vbw":["regnet"],"explain":"<b>gehen</b> after the comma, then <i>wir</i>.","rule":"verb right after the comma"},{"id":"vo-205","kind":"typed","topic":"voranstellung","question":"Move the subordinate clause to the front.","prompt":"Wir essen, sobald er kommt.","answers":["Sobald er kommt, essen wir."],"shape":"ns-hs","vbw":["kommt"],"explain":"<b>essen</b> after the comma, then <i>wir</i>.","rule":"verb right after the comma"},{"id":"vo-206","kind":"typed","topic":"voranstellung","question":"Move the subordinate clause to the front.","prompt":"Nimm den Schirm, falls es regnet.","answers":["Falls es regnet, nimm den Schirm."],"shape":"ns-hs","vbw":["regnet"],"explain":"Even with an imperative: the verb <b>nimm</b> comes right after the comma.","rule":"verb right after the comma"},{"id":"vo-207","kind":"typed","topic":"voranstellung","question":"Move the subordinate clause to the front.","prompt":"Ich lerne viel, damit ich die Prüfung bestehe.","answers":["Damit ich die Prüfung bestehe, lerne ich viel."],"shape":"ns-hs","vbw":["bestehe"],"explain":"<b>lerne</b> after the comma.","rule":"verb right after the comma"},{"id":"vo-208","kind":"typed","topic":"voranstellung","question":"Move the subordinate clause to the front.","prompt":"Er ist glücklich, seitdem er hier wohnt.","answers":["Seitdem er hier wohnt, ist er glücklich."],"shape":"ns-hs","vbw":["wohnt"],"explain":"<b>ist</b> after the comma, then <i>er</i>.","rule":"verb right after the comma"},{"id":"vo-209","kind":"typed","topic":"voranstellung","question":"Move the subordinate clause to the front.","prompt":"Sie deckt den Tisch, während er kocht.","answers":["Während er kocht, deckt sie den Tisch."],"shape":"ns-hs","vbw":["kocht"],"explain":"<b>deckt</b> after the comma, then <i>sie</i>.","rule":"verb right after the comma"},{"id":"vo-210","kind":"typed","topic":"voranstellung","question":"Move the subordinate clause to the front.","prompt":"Ich esse etwas, bevor ich gehe.","answers":["Bevor ich gehe, esse ich etwas."],"shape":"ns-hs","vbw":["gehe"],"explain":"<b>esse</b> after the comma.","rule":"verb right after the comma"},{"id":"vo-211","kind":"typed","topic":"voranstellung","question":"Move the subordinate clause to the front.","prompt":"Du kannst mich anrufen, wenn du Hilfe brauchst.","answers":["Wenn du Hilfe brauchst, kannst du mich anrufen."],"shape":"ns-hs","vbw":["brauchst"],"explain":"The conjugated <b>kannst</b> after the comma, <i>anrufen</i> stays at the end.","rule":"verb right after the comma"},{"id":"vo-212","kind":"typed","topic":"voranstellung","question":"Move the subordinate clause to the front.","prompt":"Er hat nicht angerufen, weil er keine Zeit hatte.","answers":["Weil er keine Zeit hatte, hat er nicht angerufen."],"shape":"ns-hs","vbw":["hatte"],"explain":"The auxiliary <b>hat</b> after the comma, <i>angerufen</i> at the end.","rule":"verb right after the comma"},{"id":"vo-101","kind":"mc","topic":"voranstellung","question":"Which sentence is correct?","prompt":"Subordinate clause first","options":["Weil ich krank bin, bleibe ich zu Hause.","Weil ich krank bin, ich bleibe zu Hause.","Weil ich bin krank, bleibe ich zu Hause.","Weil ich krank bin bleibe ich zu Hause."],"answer":"Weil ich krank bin, bleibe ich zu Hause.","explain":"Subordinate clause = position 1 → main-clause verb right after the comma. And the comma stays.","rule":"verb right after the comma"},{"id":"vo-102","kind":"mc","topic":"voranstellung","question":"What happens when the subordinate clause comes first?","prompt":"Rule","options":["The whole subordinate clause counts as position 1; the main-clause verb follows right after the comma.","Nothing — the main clause starts with the subject as usual.","The subordinate clause's verb moves to position 2.","The comma is dropped."],"answer":"The whole subordinate clause counts as position 1; the main-clause verb follows right after the comma.","explain":"Pattern: <i>subordinate clause, verb subject …</i> — e.g. <i>Wenn ich Zeit habe, rufe ich dich an.</i>","rule":"verb right after the comma","meta":true},{"id":"vo-103","kind":"mc","topic":"voranstellung","question":"Which sentence is correct?","prompt":"Subordinate clause first + separable verb","options":["Wenn ich Zeit habe, rufe ich dich an.","Wenn ich Zeit habe, ich rufe dich an.","Wenn ich habe Zeit, rufe ich dich an.","Wenn ich Zeit habe, rufe ich an dich."],"answer":"Wenn ich Zeit habe, rufe ich dich an.","explain":"<b>rufe</b> after the comma; the prefix <i>an</i> stays at the end of the sentence.","rule":"verb right after the comma"},{"id":"vo-104","kind":"mc","topic":"voranstellung","question":"Which sentence is correct?","prompt":"Subordinate clause first (Präteritum)","options":["Als ich klein war, wohnte ich in Bonn.","Als ich klein war, ich wohnte in Bonn.","Als ich war klein, wohnte ich in Bonn.","Als ich klein war, wohnte in Bonn ich."],"answer":"Als ich klein war, wohnte ich in Bonn.","explain":"Verb, then subject: <b>wohnte ich</b>.","rule":"verb right after the comma"},{"id":"vo-105","kind":"mc","topic":"voranstellung","question":"Which sentence is correct?","prompt":"Subordinate clause first + modal verb","options":["Wenn du willst, kannst du mitkommen.","Wenn du willst, du kannst mitkommen.","Wenn du willst, kannst mitkommen du.","Wenn willst du, kannst du mitkommen."],"answer":"Wenn du willst, kannst du mitkommen.","explain":"The conjugated <b>kannst</b> right after the comma, the infinitive at the end.","rule":"verb right after the comma"},{"id":"vo-106","kind":"mc","topic":"voranstellung","question":"What comes right after the comma when the subordinate clause is first?","prompt":"Rule","options":["The conjugated verb of the main clause.","The subject of the main clause.","A second conjunction.","An adverb such as <i>dann</i>."],"answer":"The conjugated verb of the main clause.","explain":"Position 1 is taken (by the subordinate clause), so position 2 holds the verb.","rule":"verb right after the comma","meta":true},{"id":"ko-001","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Ich bleibe zu Hause, ___ ich krank bin. (because)","answers":["weil"],"alt":["da"],"altWhy":"<i>da</i> works too — it sounds more formal and fits when the reason is already known.","explain":"Reason → <b>weil</b>; the verb goes to the end.","rule":"weil"},{"id":"ko-002","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Ich gehe spazieren, ___ es regnet. (although)","answers":["obwohl"],"explain":"Contrast → <b>obwohl</b>.","rule":"obwohl"},{"id":"ko-003","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Ich lerne jeden Tag, ___ ich die Prüfung bestehe. (so that – purpose)","answers":["damit"],"explain":"Purpose → <b>damit</b>.","rule":"damit"},{"id":"ko-004","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Er sprach sehr leise, ___ ich nichts verstand. (so that – result)","answers":["sodass"],"alt":["so dass"],"altWhy":"<i>so dass</i> (two words) is an accepted spelling of <i>sodass</i>.","explain":"Result → <b>sodass</b>.","rule":"sodass"},{"id":"ko-005","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"___ ich gehe, esse ich noch etwas. (before)","answers":["Bevor"],"explain":"<b>Bevor</b> = before.","rule":"bevor"},{"id":"ko-006","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"___ ich gegessen hatte, ging ich spazieren. (after)","answers":["Nachdem"],"explain":"<b>Nachdem</b> = after; typically with the Plusquamperfekt.","rule":"nachdem"},{"id":"ko-007","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"___ er kocht, deckt sie den Tisch. (while)","answers":["Während"],"explain":"Same time → <b>Während</b>.","rule":"während"},{"id":"ko-008","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Warte, ___ ich fertig bin. (until)","answers":["bis"],"explain":"End point → <b>bis</b>.","rule":"bis"},{"id":"ko-009","kind":"typed","topic":"konjunktion","question":"Fill in the right e”) fits too, but signals doubt; <i>wenn</i> is the default here.","explain":"Present/future/condition → <b>wenn</b>.","rule":"wenn"},{"id":"ko-017","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"___ ich klein war, wohnte ich in Bonn. (when – a single period, past)","answers":["Als"],"explain":"A single period in the past → <b>Als</b>.","rule":"als"},{"id":"ko-018","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"___ es regnet, bleiben wir zu Hause. (since – reason, formal)","answers":["Da"],"alt":["Weil"],"altWhy":"<i>weil</i> works too — <i>da</i> is the more formal choice when the reason is already known.","explain":"Known reason, formal, at the start of the sentence → <b>Da</b>.","rule":"da"},{"id":"ko-019","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Er trainiert jeden Tag, ___ er fit bleibt. (so that – purpose)","answers":["damit"],"explain":"Purpose → <b>damit</b>.","rule":"damit"},{"id":"ko-020","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Sie hat sehr viel gearbeitet, ___ sie jetzt müde ist. (so that – result)","answers":["sodass"],"alt":["so dass"],"altWhy":"<i>so dass</i> (two words) is an accepted spelling of <i>sodass</i>.","explain":"Result → <b>sodass</b>.","rule":"sodass"},{"id":"ko-021","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Ich bleibe hier, ___ du zurückkommst. (until)","answers":["bis"],"explain":"End point → <b>bis</b>.","rule":"bis"},{"id":"ko-022","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"___ du gehst, mach bitte das Licht aus. (before)","answers":["Bevor"],"explain":"<b>Bevor</b> = before.","rule":"bevor"},{"id":"ko-023","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Er ist glücklich, ___ er einen neuen Job hat. (since – time)","answers":["seitdem"],"alt":["seit"],"altWhy":"As conjunctions, <i>seit</i> and <i>seitdem</i> mean the same.","explain":"Starting point in time → <b>seitdem</b>.","rule":"seitdem"},{"id":"ko-024","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"___ sie die Prüfung bestanden hat, ist sie sehr zufrieden. (since – time)","answers":["Seitdem"],"alt":["Seit"],"altWhy":"As conjunctions, <i>seit</i> and <i>seitdem</i> mean the same.","explain":"Time, not reason → <b>Seitdem</b>.","rule":"seitdem"},{"id":"ko-025","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Ich esse etwas, ___ ich Hunger habe. (whenever)","answers":["wenn"],"explain":"Repeated in the present → <b>wenn</b>.","rule":"wenn"},{"id":"ko-026","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Er kann nicht kommen, ___ er arbeiten muss. (because)","answers":["weil"],"alt":["da"],"altWhy":"<i>da</i> works too — it sounds more formal and fits when the reason is already known.","explain":"Reason → <b>weil</b>.","rule":"weil"},{"id":"ko-027","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Sie geht zur Arbeit, ___ sie krank ist. (although)","answers":["obwohl"],"explain":"Contrast → <b>obwohl</b>.","rule":"obwohl"},{"id":"ko-028","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Ich spare Geld, ___ ich mir ein Auto kaufen kann. (so that – purpose)","answers":["damit"],"explain":"Purpose → <b>damit</b>.","rule":"damit"},{"id":"ko-029","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Ich verbessere mein Deutsch, ___ ich jeden Tag Zeitung lese. (by …ing)","answers":["indem"],"explain":"Method → <b>indem</b>.","rule":"indem"},{"id":"ko-030","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Ruf mich an, ___ du Hilfe brauchst. (in case)","answers":["falls"],"alt":["wenn"],"altWhy":"<i>wenn</i> is possible too; <i>falls</i> stresses that it is only a possibility.","explain":"Possibility → <b>falls</b>.","rule":"falls"},{"id":"ko-031","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"Ich warte hier, ___ der Bus kommt. (until)","answers":["bis"],"explain":"End point → <b>bis</b>.","rule":"bis"},{"id":"ko-032","kind":"typed","topic":"konjunktion","question":"Fill in the right conjunction.","prompt":"___ du die Tür abschließt, kontrolliere die Fenster. (before)","answers":["Bevor"],"explain":"<b>Bevor</b> = before.","rule":"bevor"},{"id":"ko-101","kind":"mc","topic":"konjunktion","question":"Which conjunction expresses a contrast?","prompt":"although","options":["obwohl","weil","damit","bevor"],"answer":"obwohl","explain":"<b>obwohl</b> = despite a circumstance.","rule":"obwohl"},{"id":"ko-102","kind":"mc","topic":"konjunktion","question":"Which conjunction expresses a purpose?","prompt":"so that (purpose)","options":["damit","sodass","obwohl","indem"],"answer":"damit","explain":"<b>damit</b> names the goal of an action.","rule":"damit"},{"id":"ko-103","kind":"mc","topic":"konjunktion","question":"Which conjunction expresses a result?","prompt":"so that (result)","options":["sodass","damit","weil","solange"],"answer":"sodass","explain":"<b>sodass</b> names what follows from it.","rule":"sodass"},{"id":"ko-104","kind":"mc","topic":"konjunktion","question":"Which conjunction names the method („how?“)?","prompt":"by …ing","options":["indem","während","bis","falls"],"answer":"indem","explain":"<b>indem</b> = by doing …","rule":"indem"},{"id":"ko-105","kind":"mc","topic":"konjunktion","question":"What is the difference between <b>damit</b> and <b>sodass</b>?","prompt":"Rule","options":["<i>damit</i> = purpose, <i>sodass</i> = result.","<i>damit</i> = result, <i>sodass</i> = purpose.","No difference — both mean “so that”.","<i>damit</i> can only start a sentence."],"answer":"<i>damit</i> = purpose, <i>sodass</i> = result.","explain":"<i>Ich lerne, damit ich bestehe</i> (goal) — <i>Ich habe gelernt, sodass ich bestanden habe</i> (result).","rule":"damit / sodass","meta":true},{"id":"ko-106","kind":"mc","topic":"konjunktion","question":"Which conjunction means “until”?","prompt":"until","options":["bis","bevor","seitdem","sobald"],"answer":"bis","explain":"<b>bis</b> names the end point.","rule":"bis"},{"id":"ko-107","kind":"mc","topic":"konjunktion","question":"Which conjunction introduces an indirect yes/no question?","prompt":"whether","options":["ob","dass","wenn","als"],"answer":"ob","explain":"<b>ob</b> — not <i>wenn</i>, even though English says “if”.","rule":"ob"},{"id":"ko-108","kind":"mc","topic":"konjunktion","question":"Which sentence expresses a purpose?","prompt":"Purpose","options":["Ich lerne viel, damit ich die Prüfung bestehe.","Ich habe viel gelernt, sodass ich müde bin.","Ich lerne viel, obwohl ich müde bin.","Ich lerne viel, weil ich müde bin."],"answer":"Ich lerne viel, damit ich die Prüfung bestehe.","explain":"Passing is the goal → <b>damit</b>.","rule":"damit"},{"id":"ko-109","kind":"mc","topic":"konjunktion","question":"Which sentence expresses a result?","prompt":"Result","options":["Er sprach leise, sodass ich nichts verstand.","Er sprach leise, damit niemand ihn hörte.","Er sprach leise, obwohl er wütend war.","Er sprach leise, während sie schlief."],"answer":"Er sprach leise, sodass ich nichts verstand.","explain":"Not understanding is the result of the quiet speaking → <b>sodass</b>.","rule":"sodass"},{"id":"ko-110","kind":"mc","topic":"konjunktion","question":"Which conjunction means “as soon as”?","prompt":"as soon as","options":["sobald","solange","seitdem","bis"],"answer":"sobald","explain":"<b>sobald</b> = the moment that …","rule":"sobald"},{"id":"ko-111","kind":"mc","topic":"konjunktion","question":"Which conjunction means “as long as”?","prompt":"as long as","options":["solange","sobald","bevor","nachdem"],"answer":"solange","explain":"<b>solange</b> = for the whole time that …","rule":"solange"},{"id":"ko-112","kind":"mc","topic":"konjunktion","question":"What does <b>indem</b> mean?","prompt":"Rule","options":["It names the method: “by doing …”.","It names the reason: “because”.","It names the time: “while”.","It names the result: “so that”."],"answer":"It names the method: “by doing …”.","explain":"<i>Man lernt, indem man übt.</i> = by practising.","rule":"indem","meta":true},{"id":"ko-113","kind":"mc","topic":"konjunktion","question":"Which sentence is correct?","prompt":"falls","options":["Falls es regnet, nimm den Schirm.","Falls regnet es, nimm den Schirm.","Falls es regnet, du nimmst den Schirm.","Falls, es regnet, nimm den Schirm."],"answer":"Falls es regnet, nimm den Schirm.","explain":"<i>falls</i> is subordinating: verb at the end, then comma, then the imperative.","rule":"falls"},{"id":"ko-114","kind":"mc","topic":"konjunktion","question":"Which two conjunctions both translate as “so that” but mean different things?","prompt":"Rule","options":["<i>damit</i> (purpose) and <i>sodass</i> (result)","<i>weil</i> (reason) and <i>da</i> (reason)","<i>wenn</i> (condition) and <i>falls</i> (condition)","<i>seit</i> (time) and <i>seitdem</i> (time)"],"answer":"<i>damit</i> (purpose) and <i>sodass</i> (result)","explain":"The other pairs are synonyms; only <i>damit/sodass</i> differ in meaning.","rule":"damit / sodass","meta":true},{"id":"ko-115","kind":"mc","topic":"konjunktion","question":"<b>bis</b> or <b>bevor</b>?","prompt":"Ich warte hier, ___ du kommst.","options":["bis","bevor","nachdem","seitdem"],"answer":"bis","explain":"The waiting lasts until the arrival → <b>bis</b>. <i>bevor</i> only gives the order of two actions.","rule":"bis"},{"id":"ko-116","kind":"mc","topic":"konjunktion","question":"<b>obwohl</b> or <b>weil</b>?","prompt":"Er geht zur Arbeit, ___ er krank ist.","options":["obwohl","weil","damit","sobald"],"answer":"obwohl","explain":"Being ill and working anyway = contrast → <b>obwohl</b>.","rule":"obwohl"},{"id":"wd-001","kind":"mc","topic":"weil-denn-da","question":"Fill in: <b>weil</b>, <b>denn</b> or <b>da</b>?","prompt":"Ich bleibe zu Hause, ___ ich bin krank.","options":["denn","weil","da","dass"],"answer":"denn","explain":"The verb is in position 2 (<i>ich bin</i>) → main-clause word order → <b>denn</b>.","rule":"denn → position 0"},{"id":"wd-002","kind":"mc","topic":"weil-denn-da","question":"Fill in: <b>weil</b>, <b>denn</b> or <b>da</b>?","prompt":"Ich bleibe zu Hause, ___ ich krank bin.","options":["weil","denn","dass","ob"],"answer":"weil","explain":"The verb is at the end → subordinating conjunction → <b>weil</b>.","rule":"weil → verb at the end"},{"id":"wd-003","kind":"mc","topic":"weil-denn-da","question":"Fill in: <b>weil</b>, <b>denn</b> or <b>da</b>?","prompt":"___ es regnet, bleiben wir zu Hause.","options":["Da","Denn","Dass","Ob"],"answer":"Da","explain":"Sentence-initial, known reason → <b>Da</b>. <i>Denn</i> cannot introduce a clause that comes before the other one.","rule":"da → formal / known reason"},{"id":"wd-004","kind":"mc","topic":"weil-denn-da","question":"Fill in: <b>weil</b>, <b>denn</b> or <b>da</b>?","prompt":"Er kommt nicht, ___ er hat keine Zeit.","options":["denn","weil","da","obwohl"],"answer":"denn","explain":"<i>er hat</i> = verb in position 2 → <b>denn</b>.","rule":"denn → position 0"},{"id":"wd-005","kind":"mc","topic":"weil-denn-da","question":"Fill in: <b>weil</b>, <b>denn</b> or <b>da</b>?","prompt":"Er kommt nicht, ___ er keine Zeit hat.","options":["weil","denn","obwohl","ob"],"answer":"weil","explain":"Verb at the end → <b>weil</b>.","rule":"weil → verb at the end"},{"id":"wd-006","kind":"mc","topic":"weil-denn-da","question":"Which sentence is correct?","prompt":"denn","options":["Ich lerne Deutsch, denn ich wohne in Berlin.","Ich lerne Deutsch, denn ich in Berlin wohne.","Ich lerne Deutsch, weil ich wohne in Berlin.","Ich lerne Deutsch weil ich in Berlin wohne."],"answer":"Ich lerne Deutsch, denn ich wohne in Berlin.","explain":"After <i>denn</i> comes a normal main clause: subject, verb in position 2.","rule":"denn → position 0"},{"id":"wd-007","kind":"mc","topic":"weil-denn-da","question":"Which sentence is correct?","prompt":"weil","options":["Ich lerne Deutsch, weil ich in Berlin wohne.","Ich lerne Deutsch, weil ich wohne in Berlin.","Ich lerne Deutsch, denn ich in Berlin wohne.","Ich lerne Deutsch, denn wohne ich in Berlin."],"answer":"Ich lerne Deutsch, weil ich in Berlin wohne.","explain":"After <i>weil</i> the verb goes to the end.","rule":"weil → verb at the end"},{"id":"wd-008","kind":"mc","topic":"weil-denn-da","question":"What kind of conjunction is <b>denn</b>?","prompt":"Rule","options":["A coordinating conjunction (position 0): normal main-clause word order follows.","A subordinating conjunction: the verb goes to the end.","An adverb like <i>deshalb</i>: the verb comes before the subject.","A question particle."],"answer":"A coordinating conjunction (position 0): normal main-clause word order follows.","explain":"<i>denn</i> joins two main clauses; it does not count as position 1.","rule":"denn → position 0","meta":true},{"id":"wd-009","kind":"mc","topic":"weil-denn-da","question":"When is <b>da</b> preferred over <i>weil</i>?","prompt":"Rule","options":["When the reason is already known or the style is formal — often at the start of the sentence.","When the verb should be in position 2.","When asking a question.","When the reason is a guess."],"answer":"When the reason is already known or the style is formal — often at the start of the sentence.","explain":"<i>da</i> is subordinating like <i>weil</i> (verb at the end), but the reason is treated as known.","rule":"da → formal / known reason","meta":true},{"id":"wd-010","kind":"mc","topic":"weil-denn-da","question":"Can the <b>denn</b> clause come before the other main clause?","prompt":"Rule","options":["No — the <i>denn</i> clause always comes second.","Yes, and the verb then goes to the end.","Yes, with no change.","Only in questions."],"answer":"No — the <i>denn</i> clause always comes second.","explain":"<i>Weil/Da ich krank bin, bleibe ich zu Hause</i> works; <i>Denn ich bin krank, …</i> does not.","rule":"denn → position 0","meta":true},{"id":"wd-011","kind":"mc","topic":"weil-denn-da","question":"Fill in: <b>weil</b>, <b>denn</b> or <b>da</b>?","prompt":"___ er müde war, ging er früh ins Bett.","options":["Da","Denn","Dass","Ob"],"answer":"Da","explain":"Fronted reason → <b>Da</b>; the main-clause verb follows.","rule":"da → formal / known reason"},{"id":"wd-012","kind":"mc","topic":"weil-denn-da","question":"Fill in: <b>weil</b>, <b>denn</b> or <b>da</b>?","prompt":"Sie lernt viel, ___ sie will die Prüfung bestehen.","options":["denn","weil","da","damit"],"answer":"denn","explain":"<i>sie will</i> = verb in position 2 → <b>denn</b>.","rule":"denn → position 0"},{"id":"wd-013","kind":"mc","topic":"weil-denn-da","question":"Fill in: <b>weil</b>, <b>denn</b> or <b>da</b>?","prompt":"Sie lernt viel, ___ sie die Prüfung bestehen will.","options":["weil","denn","dass","ob"],"answer":"weil","explain":"Verb block at the end (<i>bestehen will</i>) → <b>weil</b>.","rule":"weil → verb at the end"},{"id":"wd-014","kind":"mc","topic":"weil-denn-da","question":"Where is the verb after <b>denn</b>?","prompt":"Rule","options":["Position 2, as in any main clause.","At the very end.","Position 1.","Directly after <i>denn</i>."],"answer":"Position 2, as in any main clause.","explain":"<i>…, denn ich <b>bin</b> krank.</i>","rule":"denn → position 0","meta":true},{"id":"wd-201","kind":"order","topic":"weil-denn-da","question":"Build the clause. Both conjunctions work — the word order has to match.","frame":"Ich bleibe zu Hause,","tokens":["weil","ich","krank","bin"],"extra":["denn"],"end":".","shape":"sub","vbw":["bin"],"explain":"With <i>weil</i>, <b>bin</b> is at the end; with <i>denn</i> it would be in ]},{"id":"wd-206","kind":"order","topic":"weil-denn-da","question":"Build the clause. Both conjunctions work — the word order has to match.","frame":"Er geht zum Arzt,","tokens":["weil","er","Schmerzen","hat"],"extra":["denn"],"end":".","shape":"sub","vbw":["hat"],"explain":"<i>weil er Schmerzen hat</i> or <i>denn er hat Schmerzen</i>.","rule":"weil ↔ denn","accept":[["weil","er","Schmerzen","hat"],["denn","er","hat","Schmerzen"]]},{"id":"wd-301","kind":"typed","topic":"weil-denn-da","question":"Rewrite the sentence with <b>denn</b>.","prompt":"Ich bleibe zu Hause, weil ich krank bin.","answers":["Ich bleibe zu Hause, denn ich bin krank."],"explain":"After <i>denn</i> the verb returns to position 2: <b>ich bin krank</b>.","rule":"denn → position 0"},{"id":"wd-302","kind":"typed","topic":"weil-denn-da","question":"Rewrite the sentence with <b>weil</b>.","prompt":"Er kommt nicht, denn er hat keine Zeit.","answers":["Er kommt nicht, weil er keine Zeit hat."],"shape":"hs-ns","vbw":["hat"],"explain":"After <i>weil</i> the verb goes to the end: <b>keine Zeit hat</b>.","rule":"weil → verb at the end"},{"id":"wd-303","kind":"typed","topic":"weil-denn-da","question":"Rewrite the sentence with <b>denn</b>.","prompt":"Sie lernt viel, weil sie die Prüfung bestehen will.","answers":["Sie lernt viel, denn sie will die Prüfung bestehen."],"explain":"After <i>denn</i>: <b>sie will</b> … <i>bestehen</i> — the modal verb in position 2, the infinitive at the end.","rule":"denn → position 0"},{"id":"wd-304","kind":"typed","topic":"weil-denn-da","question":"Rewrite the sentence with <b>weil</b>.","prompt":"Ich nehme den Bus, denn mein Auto ist kaputt.","answers":["Ich nehme den Bus, weil mein Auto kaputt ist."],"shape":"hs-ns","vbw":["ist"],"explain":"After <i>weil</i>: <b>kaputt ist</b> at the end.","rule":"weil → verb at the end"},{"id":"wa-001","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"___ ich klein war, wohnte ich in Bonn.","answers":["Als"],"explain":"A single period in the past → <b>Als</b>.","rule":"als → one-off, past"},{"id":"wa-002","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"___ ich Zeit habe, rufe ich dich an.","answers":["Wenn"],"explain":"Present/future → <b>Wenn</b>.","rule":"wenn → present/future"},{"id":"wa-003","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"Immer ___ ich ihn besuchte, freute er sich.","answers":["wenn"],"explain":"<i>immer</i> = repeated in the past → <b>wenn</b>.","rule":"wenn → repeated (past)"},{"id":"wa-004","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"___ er gestern nach Hause kam, war niemand da.","answers":["Als"],"explain":"<i>gestern</i>, a one-off event → <b>Als</b>.","rule":"als → one-off, past"},{"id":"wa-005","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"___ es morgen regnet, bleiben wir zu Hause.","answers":["Wenn"],"explain":"Future/condition → <b>Wenn</b>.","rule":"wenn → present/future"},{"id":"wa-006","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"___ ich 18 wurde, machte ich den Führerschein.","answers":["Als"],"explain":"You only turn 18 once → <b>Als</b>.","rule":"als → one-off, past"},{"id":"wa-007","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"Jedes Mal, ___ er kocht, brennt etwas an.","answers":["wenn"],"explain":"<i>jedes Mal</i> = repetition → <b>wenn</b>.","rule":"wenn → repeated"},{"id":"wa-008","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","prompt":"___ wir in Italien waren, hat es die ganze Zeit geregnet.","answers":["Als"],"explain":"A single period in the past (that holiday) → <b>Als</b>.","rule":"als → one-off, past"},{"id":"wa-009","kind":"typed","topic":"wenn-als","question":"Fill in: <b>wenn</b> or <b>als</b>?","p
