<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Perfekt — Practice</title>
<style>
:root {
  --paper: #EDF0F5;
  --surface: #FFFFFF;
  --ink: #131A2B;
  --muted: #5E6778;
  --line: #D3D8E2;
  --line-strong: #A9B1C0;
  --aux: #2F4BD8;
  --aux-soft: #E4E9FB;
  --pp: #C2410C;
  --pp-soft: #FBE7DC;
  --ok: #1B7F5A;
  --ok-soft: #DDF3E8;
  --bad: #B42318;
  --bad-soft: #FBE3E0;
  --serif: "Charter", "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 6px;
  --box0: #E6E9F0; --box1: #C9D4F5; --box2: #9FB2EE; --box3: #6F8BE6; --box4: #4463DE; --box5: #1B7F5A;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible, .chip:focus-visible { outline: 3px solid #8FA3F0; outline-offset: 2px; }
.de { font-family: var(--serif); }
.aux { color: var(--aux); font-weight: 600; }
.pp { color: var(--pp); font-weight: 600; }
b { font-weight: 650; }

#app { max-width: 680px; margin: 0 auto; padding: 20px 16px 60px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
header.top h1 { font-family: var(--serif); font-weight: 400; font-size: 24px; margin: 0; letter-spacing: -0.01em; }
header.top h1 button { background: none; border: 0; padding: 0; font: inherit; color: inherit; }
header.top nav { display: flex; gap: 16px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover { color: var(--ink); }
.linkbtn.current { color: var(--ink); text-decoration: none; }

/* hero: the Satzklammer, drawn */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 22px 22px; margin-bottom: 20px; }
.hero .klammer { font-family: var(--serif); font-size: 30px; line-height: 1.35; position: relative; padding-bottom: 18px; margin: 0; }
.hero .hero-en { color: var(--muted); margin: 4px 0 0; font-size: 15px; }
.hero .hero-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hero .legend { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
.klammer { position: relative; }
.klammer .br { display: block; position: absolute; height: 9px; border: 1.5px solid var(--line-strong); border-top: 0; pointer-events: none; }
.klammer .br.hidden { display: none; }
@media (max-width: 480px) { .hero .klammer { font-size: 24px; } }

/* mastery strip */
.strip { display: flex; align-items: center; gap: 14px; margin: 0 0 22px; flex-wrap: wrap; }
.bar { display: flex; flex: 1 1 200px; height: 10px; background: var(--box0); border-radius: 5px; overflow: hidden; }
.bar span { display: block; height: 100%; }
.strip .nums { color: var(--muted); font-size: 14px; white-space: nowrap; }
.strip .nums b { color: var(--ink); }

/* home panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
.panel h2 { font-size: 17px; font-weight: 600; margin: 0 0 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.row .lbl { color: var(--muted); font-size: 14px; min-width: 64px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 14px; color: var(--muted); border-right: 1px solid var(--line); min-height: 40px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.modehelp { color: var(--muted); font-size: 14px; margin: -4px 0 14px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--muted); min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--aux-soft); border-color: var(--aux); color: var(--ink); }
.primary { background: var(--ink); color: #fff; border: 0; border-radius: var(--radius); padding: 12px 22px; font-weight: 600; min-height: 46px; }
.primary:hover { background: #262E42; }
.primary:disabled { opacity: 0.5; cursor: default; }
.secondary { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 11px 18px; min-height: 46px; }
.actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; }
.toggle input { width: 18px; height: 18px; margin: 0; }
.note { color: var(--muted); font-size: 14px; }
.warn { background: #FFF4D6; border: 1px solid #F0D48A; border-radius: var(--radius); padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }

/* concept rows */
.concepts { display: grid; grid-template-columns: 1fr; gap: 0; }
.concept { -webkit-appearance: none; appearance: none; font: inherit; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name nums" "bar bar" "desc desc"; gap: 4px 12px; padding: 12px 0; border: 0; border-top: 1px solid var(--line); text-align: left; background: none; width: 100%; color: inherit; }
.concept:first-child { border-top: 0; }
.concept .name { grid-area: name; font-weight: 600; }
.concept .nums { grid-area: nums; color: var(--muted); font-size: 14px; }
.concept .bar { grid-area: bar; margin-top: 4px; }
.concept .desc { grid-area: desc; color: var(--muted); font-size: 14px; }
.concept[aria-pressed="true"] .name::before { content: "\2713  "; color: var(--aux); }
.concept:not([disabled]):hover .name { text-decoration: underline; text-underline-offset: 3px; }

/* session */
.session-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; color: var(--muted); font-size: 14px; }
.session-head .concept-name { text-align: right; }
.progress-dots { height: 4px; background: var(--box0); border-radius: 2px; overflow: hidden; margin-bottom: 20px; }
.progress-dots span { display: block; height: 100%; background: var(--ink); transition: width 200ms ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 22px; }
.card .prompt { font-family: var(--serif); font-size: 28px; line-height: 1.3; margin: 0 0 6px; overflow-wrap: anywhere; }
.card .prompt.small { font-size: 24px; }
.card .sub { color: var(--muted); margin: 0 0 16px; min-height: 8px; }
.card .instruction { font-size: 15px; margin: 0 0 12px; }
.inputrow { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.inputrow .prefix { font-family: var(--serif); font-size: 20px; align-self: center; color: var(--muted); }
.answer { flex: 1 1 220px; font-family: var(--serif); font-size: 20px; padding: 10px 12px; border: 1.5px solid var(--line-strong); border-radius: var(--radius); background: #FBFCFE; min-height: 48px; }
.answer:focus { border-color: var(--aux); outline: 0; box-shadow: 0 0 0 3px var(--aux-soft); }
.answer[disabled] { background: var(--paper); color: var(--muted); }
.options { display: grid; gap: 8px; }
.options.two { grid-template-columns: 1fr 1fr; }
.opt { text-align: left; background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: var(--radius); padding: 12px 14px; min-height: 48px; font-size: 16px; display: flex; gap: 12px; align-items: center; }
.opt .key { color: var(--muted); font-size: 13px; min-width: 14px; }
.opt.de .txt { font-family: var(--serif); font-size: 20px; }
.opt:not([disabled]):hover { border-color: var(--ink); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.order-target { min-height: 56px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius); padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; background: #FBFCFE; }
.order-target .empty { color: var(--muted); font-size: 14px; padding: 4px 6px; }
.order-pool { display: flex; flex-wrap: wrap; gap: 8px; }
.tok { font-family: var(--serif); font-size: 19px; background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: var(--radius); padding: 6px 12px; min-height: 42px; display: inline-flex; align-items: center; gap: 8px; }
.tok .key { font-family: var(--sans); color: var(--muted); font-size: 12px; }
.tok.used { visibility: hidden; }
.order-target .tok { background: var(--aux-soft); border-color: var(--aux); }
.order-target .punct { font-family: var(--serif); font-size: 19px; color: var(--muted); }
.check-row { display: flex; gap: 12px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 13px; }
.kbd { display: inline-block; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; color: var(--muted); background: #fff; }
@media (hover: none) { .hint, .opt .key, .tok .key { display: none; } }

/* feedback */
.feedback { margin-top: 18px; border-left: 4px solid var(--ok); padding: 14px 16px; background: var(--ok-soft); border-radius: 0 var(--radius) var(--radius) 0; }
.feedback.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.feedback .verdict { font-weight: 600; margin: 0 0 6px; }
.feedback .correct { font-family: var(--serif); font-size: 22px; margin: 0 0 8px; overflow-wrap: anywhere; position: relative; padding-bottom: 12px; }
.feedback .yours { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.feedback .yours s { color: var(--bad); }
.feedback .explain { font-size: 15px; margin: 0; }
.feedback .sched { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.feedback .spelling { font-size: 14px; margin: 6px 0 0; }

/* summary */
.summary .big { font-family: var(--serif); font-size: 42px; line-height: 1.1; margin: 0 0 4px; }
.summary .missed { margin-top: 16px; }
.summary .missed h2 { margin-bottom: 8px; }
.summary .missed ul { padding-left: 18px; margin: 0; }
.summary .missed li { margin-bottom: 8px; }
.summary .missed .de { font-size: 18px; }

/* progress view */
.boxes { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
.boxes span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.stat .v { font-family: var(--serif); font-size: 28px; line-height: 1.1; }
.stat .k { color: var(--muted); font-size: 13px; }
.trouble { list-style: none; padding: 0; margin: 0; }
.trouble li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
.trouble li:first-child { border-top: 0; }
.trouble .de { font-size: 18px; }
textarea.io { width: 100%; min-height: 90px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 8px; }

.concept[disabled] { color: inherit; opacity: 1; cursor: default; }

</style>
</head>

    { frame:'Er kommt zu spät, weil', s:'er', p:'er', v:'verpasst', mid:'den Bus', aux:'hat', pp:'verpasst', inf:'verpassen', en:'He is late because he missed the bus.' },
    { frame:'Ich kenne die Stadt, weil', s:'ich', p:'ich', v:'wohne', mid:'dort', aux:'habe', pp:'gewohnt', inf:'wohnen', en:'I know the city because I lived there.' },
    { frame:'Wir sind zufrieden, obwohl', s:'wir', p:'wir', v:'verlieren', mid:'das Spiel', aux:'haben', pp:'verloren', inf:'verlieren', en:'We are satisfied although we lost the game.' },
    { frame:'Du bist fit, weil', s:'du', p:'du', v:'trainierst', mid:'viel', aux:'hast', pp:'trainiert', inf:'trainieren', en:'You are fit because you trained a lot.' },
    { frame:'Sie ist nicht da, weil', s:'sie', p:'er', v:'fährt', mid:'nach Hamburg', aux:'ist', pp:'gefahren', inf:'fahren', en:'She is not here because she went to Hamburg.' },
    { frame:'Ich bin müde, weil', s:'ich', p:'ich', v:'stehe', sep:'auf', mid:'früh', aux:'bin', pp:'aufgestanden', inf:'aufstehen', en:'I am tired because I got up early.' },
    { frame:'Er ist sauer, weil', s:'ich', p:'ich', v:'rufe', sep:'an', mid:'ihn nicht', aux:'habe', pp:'angerufen', inf:'anrufen', en:'He is angry because I did not call him.' },
    { frame:'Wir wissen es, obwohl', s:'niemand', p:'er', v:'sagt', mid:'es uns', aux:'hat', pp:'gesagt', inf:'sagen', en:'We know it although nobody told us.' },
    { frame:'Ich verstehe alles, weil', s:'der Lehrer', p:'er', v:'erklärt', mid:'es gut', aux:'hat', pp:'erklärt', inf:'erklären', en:'I understand everything because the teacher explained it well.' },
    { frame:'Ihr seid braun, weil', s:'ihr', p:'ihr', v:'liegt', mid:'lange in der Sonne', aux:'habt', pp:'gelegen', inf:'liegen', en:'You (pl.) are tanned because you lay in the sun for a long time.' },
    { frame:'Sie hat kein Geld, weil', s:'sie', p:'er', v:'kauft', mid:'ein neues Auto', aux:'hat', pp:'gekauft', inf:'kaufen', en:'She has no money because she bought a new car.' },
  ];

  // ───────────────────────────────────────────────────────────────────────────
  // 3. Grammar tables and helpers
  // ───────────────────────────────────────────────────────────────────────────
  const PERSONS = ['ich', 'du', 'er', 'wir', 'ihr', 'sie'];
  const PERSON_LABEL = { ich:'ich', du:'du', er:'er / sie / es', wir:'wir', ihr:'ihr', sie:'sie / Sie' };
  const HABEN = { ich:'habe', du:'hast', er:'hat', wir:'haben', ihr:'habt', sie:'haben' };
  const SEIN = { ich:'bin', du:'bist', er:'ist', wir:'sind', ihr:'seid', sie:'sind' };

  const CLASS_NAME = { reg:'regular (weak)', str:'irregular (strong)', mix:'mixed', sep:'separable', insep:'inseparable prefix', ier:'-ieren verb' };
  const INSEP_PREFIXES = ['be', 'emp', 'ent', 'er', 'ge', 'miss', 'ver', 'zer', 'über', 'unter', 'wieder'];

  const WHY_TEXT = {
    move: 'movement from A to B → sein',
    state: 'change of state → sein',
    special: 'special case, just learn it (sein, bleiben, passieren, geschehen, gelingen, begegnen) → sein',
    obj: 'takes an accusative object → haben',
    refl: 'reflexive verb → haben',
    stat: 'stationary verb (sitting, standing, lying, sleeping, living: no movement from A to B) → haben',
    other: 'not movement, not a change of state, not a special case → haben',
  };

  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function join(parts) { return parts.filter(function (x) { return x && x.length; }).join(' '); }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; });
  }
  function A(x) { return '<span class="aux">' + esc(x) + '</span>'; }
  function P(x) { return '<span class="pp">' + esc(x) + '</span>'; }

  function verbAuxWord(v) { return v.aux === 's' ? 'sein' : 'haben'; }
  function dictForm(v, person) { return v.aux === 's' ? SEIN[person] : HABEN[person]; }

  // Is this verb's Partizip II built without ge-? (inseparable, -ieren, or separable + such a base)
  function hasGe(v) {
    if (v.cls === 'insep' || v.cls === 'ier') return false;
    if (v.cls === 'sep') { return v.pp.indexOf('ge') !== -1 && !/ier(t)$/.test(v.pp) && !/^(vor|an|aus|ein|mit|ab|zu)be/.test(v.pp); }
    return true;
  }

  function sepPrefix(v) {
    if (v.cls !== 'sep') return '';
    if (v.base) return v.inf.slice(0, v.inf.length - v.base.length);
    // no listed base: prefix is everything before "ge" (or before the stem for no-ge participles)
    var i = v.pp.indexOf('ge');
    if (i > 0 && hasGe(v)) return v.pp.slice(0, i);
    var m = v.inf.match(/^(vor|an|aus|ein|mit|ab|zu|auf)/);
    return m ? m[1] : '';
  }

  function explainPP(v) {
    var stem, e;
    switch (v.cls) {
      case 'reg':
        stem = v.pp.replace(/^ge/, '').replace(/e?t$/, '');
        e = /et$/.test(v.pp) && /(t|d|[^aeiouäöü][mn])$/.test(stem)
          ? 'Regular verb: ge + ' + esc(stem) + ' + <b>et</b> (stem ends in -t, -d or consonant + m/n, so an e is inserted).'
          : 'Regular verb: ge + ' + esc(stem) + ' + t.';
        return e + ' Partizip II: ' + P(v.pp) + '.';
      case 'str':
        if (v.inf === 'haben') return 'Irregular: haben → ' + P('gehabt') + ' (ge + hab + t, but the b stays).';
        if (v.inf === 'tun') return 'Irregular (strong) verb: ge + ta + n. Partizip II: ' + P('getan') + '. Must be memorised.';
        stem = v.inf.replace(/e?n$/, '');
        var ppStem = v.pp.replace(/^ge/, '').replace(/en$/, '');
        return 'Irregular (strong) verb: ge + ' + (stem === ppStem ? esc(stem) : esc(stem) + ' → <b>' + esc(ppStem) + '</b>') + ' + en. Partizip II: ' + P(v.pp) + '. Must be memorised.';
      case 'mix':
        return 'Mixed verb: ge + changed stem + t (like a weak verb, but the stem changes). Partizip II: ' + P(v.pp) + '.' + (v.aux === 's' ? ' Note: rennen uses sein.' : '');
      case 'sep': {
        var pre = sepPrefix(v);
        var rest = v.pp.slice(pre.length);
        if (!hasGe(v)) {
          return 'Separable verb, but the base verb takes no ge- (' + (/iert$/.test(v.pp) ? '-ieren verb' : 'inseparable prefix') + '): ' + esc(pre) + ' + ' + esc(rest) + '. Partizip II: ' + P(v.pp) + '.';
        }
        var baseV = v.base ? VERB_BY_INF[v.base] : null;
        return 'Separable verb: prefix + ge + rest → ' + esc(pre) + '|' + esc(rest) + (baseV ? ' (base verb ' + esc(baseV.inf) + ' → ' + esc(baseV.pp) + ')' : '') + '. Partizip II: ' + P(v.pp) + '.';
      }
      case 'insep': {
        var pfx = INSEP_PREFIXES.filter(function (p) { return v.inf.replace(/^sich /, '').indexOf(p) === 0; }).sort(function (a, b) { return b.length - a.length; })[0] || '';
        var ppEnd = /en$/.test(v.pp) ? ' The base is irregular, so it ends in -en.' : '';
        if (pfx === 'ge') return 'The verb already starts with the inseparable prefix <b>ge-</b>, so no second ge- is added. Partizip II: ' + P(v.pp) + '.' + ppEnd;
        return 'Inseparable prefix <b>' + esc(pfx) + '-</b>: no ge-. Partizip II: ' + P(v.pp) + '.' + ppEnd;
      }
      case 'ier':
        return '-ieren verb: no ge-, always ends in -t. Partizip II: ' + P(v.pp) + '.';
    }
    return '';
  }

  function explainAux(v, why) {
    var w = why || v.why;
    return cap(WHY_TEXT[w]) + '.';
  }

  // Sentence rendering ───────────────────────────────────────────────────────
  function presentMain(S) {
    var punct = (S.form === 'q' || S.form === 'w') ? '?' : '.';
    var parts;
    if (S.form === 'q') parts = [cap(S.v), S.s, S.mid, S.sep];
    else if (S.form === 'w') parts = [S.w, S.v, S.s, S.mid, S.sep];
    else if (S.front) parts = [cap(S.front), S.v, S.s, S.mid, S.sep];
    else parts = [cap(S.s), S.v, S.mid, S.sep];
    return join(parts) + punct;
  }

  // chunks of the Perfekt main clause, in the correct order (no punctuation)
  function perfektChunks(S) {
    if (S.form === 'q') return [cap(S.aux), S.s, S.mid, S.pp].filter(Boolean);
    if (S.form === 'w') return [S.w, S.aux, S.s, S.mid, S.pp].filter(Boolean);
    if (S.front) return [cap(S.front), S.aux, S.s, S.mid, S.pp].filter(Boolean);
    return [cap(S.s), S.aux, S.mid, S.pp].filter(Boolean);
  }
  function perfektMain(S) {
    return perfektChunks(S).join(' ') + ((S.form === 'q' || S.form === 'w') ? '?' : '.');
  }
  function perfektMainHtml(S) {
    return perfektChunks(S).map(function (c) {
      if (c === S.pp) return P(c);
      if (c.toLowerCase() === S.aux) return A(c);
      return esc(c);
    }).join(' ') + ((S.form === 'q' || S.form === 'w') ? '?' : '.');
  }

  function negChunks(S) {
    return [cap(S.s), S.aux, S.mid, 'nicht', S.pp].filter(Boolean);
  }
  function negSentence(S) { return negChunks(S).join(' ') + '.'; }

  // Subordinate-clause frames derived from a sentence
  var FRAMES_3 = ['Ich weiß, dass', 'Ich glaube, dass', 'Ich habe gehört, dass'];
  var FRAMES_1 = ['Er sagt, dass', 'Sie hat gesagt, dass', 'Mein Freund weiß, dass'];
  function subFrame(S, i) {
    if (S.form === 'w') return 'Ich weiß nicht, ' + S.w.toLowerCase();
    if (S.form === 'q') return 'Ich weiß nicht, ob';
    var list = (S.p === 'ich' || S.p === 'wir') ? FRAMES_1 : FRAMES_3;
    return list[i % list.length];
  }
  // the clause after the conjunction: present and Perfekt
  function subPresentClause(S) { return join([S.s, S.mid, (S.sep || '') + S.v]); }
  function subPerfektClause(S) { return join([S.s, S.mid, S.pp, S.aux]); }
  function subPerfektChunks(S) { return [S.s, S.mid, S.pp, S.aux].filter(Boolean); }
  function subPerfektHtml(S) { return join([esc(S.s), esc(S.mid), P(S.pp), A(S.aux)]); }

  // ───────────────────────────────────────────────────────────────────────────
  // 4. Answer normalisation and checking
  // ───────────────────────────────────────────────────────────────────────────
  function normStrict(s) {
    return String(s || '').toLowerCase()
      .replace(/[.,!?;:"“”„'’`]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function normLoose(s) {
    return normStrict(s).replace(/ß/g, 'ss').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue');
  }

  function specialsSubset(user, canon) {
    var us = user.match(/[äöüß]/g) || [], cs = canon.match(/[äöüß]/g) || [];
    return us.every(function (ch) { return cs.indexOf(ch) !== -1; });
  }

  // Result: { correct, exact, spelling } — spelling=true means it only matched after
  // folding umlauts/ß (accepted unless strict mode; the UI shows the proper spelling).
  function checkTyped(item, answer, strict) {
    var a = normStrict(answer);
    var loose = normLoose(answer);
    var exact = item.answers.some(function (x) { return normStrict(x) === a; });
    if (exact) return { correct: true, exact: true, spelling: false };
    // Folded match: the learner may type ae/oe/ue/ss for ä/ö/ü/ß (no German keyboard),
    // but must not introduce a special character the correct answer does not have (gegoßen ≠ gegossen).
    var folded = item.answers.some(function (x) { return normLoose(x) === loose && specialsSubset(a, normStrict(x)); });
    if (folded) return { correct: !strict, exact: false, spelling: true };
    return { correct: false, exact: false, spelling: false };
  }

  function checkChoice(item, index) { return { correct: index === item.answer, exact: true, spelling: false }; }

  function checkOrder(item, chunks) {
    var ok = chunks.length === item.chunks.length && chunks.every(function (c, i) { return c === item.chunks[i]; });
    return { correct: ok, exact: true, spelling: false };
  }

  function check(item, answer, strict) {
    if (item.kind === 'type') return checkTyped(item, answer, strict);
    if (item.kind === 'choice') return checkChoice(item, answer);
    if (item.kind === 'order') return checkOrder(item, answer);
    throw new Error('unknown item kind ' + item.kind);
  }

  // ───────────────────────────────────────────────────────────────────────────
  // 5. Item generation
  //    kind: type (typed input) · choice (buttons) · order (arrange chunks)
  // ───────────────────────────────────────────────────────────────────────────
  const CONCEPTS = [
    { id:'pp',     name:'Partizip II: build it',          short:'Partizip II',   desc:'Infinitive → Partizip II for regular, irregular, mixed, separable, inseparable and -ieren verbs.' },
    { id:'rev',    name:'Partizip II: recognise it',      short:'Recognise',     desc:'Irregular Partizip II → infinitive. Reading-direction recall for the strong forms.' },
    { id:'aux',    name:'haben or sein: in a sentence',   short:'haben / sein',  desc:'Pick the helper in a real sentence, including the accusative-object trap (ist gefahren vs hat gefahren).' },
    { id:'rule',   name:'haben or sein: the rule',        short:'The rule',      desc:'Name the reason: movement, change of state, special case, or everything else → haben.' },
    { id:'helper', name:'Helper verbs and full forms',    short:'Helper',        desc:'Conjugate haben/sein and produce the full form (ihr + fahren → seid gefahren).' },
    { id:'trans',  name:'Present → Perfekt',              short:'Transform',     desc:'Rewrite a present-tense sentence in the Perfekt, keeping the word order.' },
    { id:'order',  name:'Word order: Satzklammer',        short:'Word order',    desc:'Arrange the pieces: helper in position 2, Partizip II at the end, reversed in subordinate clauses.' },
    { id:'sub',    name:'Subordinate clauses',            short:'Nebensatz',     desc:'weil, dass, ob, obwohl and W-words: Partizip II + helper at the very end.' },
    { id:'neg',    name:'Negation with nicht',            short:'Negation',      desc:'nicht goes directly before the Partizip II.' },
  ];
  const CONCEPT_BY_ID = {};
  CONCEPTS.forEach(function (c) { CONCEPT_BY_ID[c.id] = c; });

  function buildItems() {
    var items = [];
    var i, v, S;
    var reflexiveSich = function (inf) { return /^sich /.test(inf); };

    // pp: infinitive → Partizip II (every verb)
    for (i = 0; i < VERBS.length; i++) {
      v = VERBS[i];
      items.push({
        id: 'pp:' + v.inf, concept: 'pp', kind: 'type', inf: v.inf,
        prompt: v.inf, sub: v.en, instruction: 'Type the Partizip II',
        answers: reflexiveSich(v.inf) ? [v.pp, 'sich ' + v.pp] : [v.pp],
        display: v.pp, displayHtml: P(v.pp),
        explain: explainPP(v) + ' Full form: ' + A(dictForm(v, 'er')) + ' ' + P(v.pp) + ' (' + explainAux(v).replace(/\.$/, '') + ').',
      });
    }

    // rev: Partizip II → infinitive (irregular forms, not separable duplicates)
    for (i = 0; i < VERBS.length; i++) {
      v = VERBS[i];
      var irregular = v.cls === 'mix' || ((v.cls === 'str' || v.cls === 'insep') && /en$/.test(v.pp) && v.pp !== v.inf.replace(/^sich /, ''));
      if (!irregular) continue;
      var rest = VERBS.filter(function (o) { return o !== v && o.pp === v.pp; }); // duplicate participles (none expected)
      if (rest.length) continue;
      items.push({
        id: 'rev:' + v.inf, concept: 'rev', kind: 'type', inf: v.inf,
        prompt: (v.aux === 's' ? 'ist ' : 'hat ') + v.pp, sub: v.en, instruction: 'Type the infinitive',
        answers: [v.inf, v.inf.replace(/^sich /, '')], display: v.inf, displayHtml: esc(v.inf),
        explain: esc(v.pp) + ' is the Partizip II of <b>' + esc(v.inf) + '</b>. ' + explainPP(v),
      });
    }

    // aux: helper in a sentence (choice)
    for (i = 0; i < SENTENCES.length; i++) {
      S = SENTENCES[i];
      var chunks = perfektChunks(S);
      var blanked = chunks.map(function (c) { return c.toLowerCase() === S.aux ? '___' : c; }).join(' ') + ((S.form === 'q' || S.form === 'w') ? '?' : '.');
      var vb = VERB_BY_INF[S.inf];
      var isSein = SEIN[S.p] === S.aux;
      items.push({
        id: 'aux:' + i, concept: 'aux', kind: 'choice', inf: S.inf,
        prompt: blanked, sub: S.en, instruction: 'Which helper verb goes in the gap?',
        options: [HABEN[S.p], SEIN[S.p]], answer: isSein ? 1 : 0, display: S.aux, displayHtml: A(S.aux),
        explain: explainAux(vb, S.why) + ' ' + perfektMainHtml(S) + (S.why === 'obj' ? ' Compare: without an object, ' + esc(S.inf) + ' takes sein (ist ' + esc(vb.pp) + ').' : ''),
      });
    }

    // rule: which rule decides the helper (choice) — all sein verbs + stationary/reflexive + a sample of the rest
    var RULE_OPTIONS = ['Movement from A to B → sein', 'Change of state → sein', 'Special case (sein, bleiben, passieren …) → sein', 'Everything else → haben'];
    var RULE_INDEX = { move:0, state:1, special:2, obj:3, refl:3, stat:3, other:3 };
    for (i = 0; i < VERBS.length; i++) {
      v = VERBS[i];
      var include = v.aux === 's' || v.why === 'stat' || v.why === 'refl' || (i % 4 === 0);
      if (!include) continue;
      items.push({
        id: 'rule:' + v.inf, concept: 'rule', kind: 'choice', inf: v.inf,
        prompt: v.inf, sub: v.en, instruction: 'Which rule decides the helper verb?',
        options: RULE_OPTIONS, answer: RULE_INDEX[v.why], display: RULE_OPTIONS[RULE_INDEX[v.why]],
        explain: explainAux(v) + ' → ' + A(dictForm(v, 'er')) + ' ' + P(v.pp) + '.',
      });
    }

    // helper: conjugation of haben / sein (12)
    var pIdx;
    for (pIdx = 0; pIdx < PERSONS.length; pIdx++) {
      var pr = PERSONS[pIdx];
      items.push({ id: 'hlp:haben:' + pr, concept: 'helper', kind: 'type', inf: 'haben',
        prompt: PERSON_LABEL[pr] + ' + haben', sub: 'present tense of the helper', instruction: 'Type the conjugated form',
        answers: [HABEN[pr]], display: HABEN[pr], displayHtml: A(HABEN[pr]), explain: 'haben: ich habe, du hast, er/sie/es hat, wir haben, ihr habt, sie/Sie haben.' });
      items.push({ id: 'hlp:sein:' + pr, concept: 'helper', kind: 'type', inf: 'sein',
        prompt: PERSON_LABEL[pr] + ' + sein', sub: 'present tense of the helper', instruction: 'Type the conjugated form',
        answers: [SEIN[pr]], display: SEIN[pr], displayHtml: A(SEIN[pr]), explain: 'sein: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind.' });
    }

    // full: pronoun + infinitive → helper + Partizip II (all sein verbs + a third of the haben verbs; no reflexives)
    for (i = 0; i < VERBS.length; i++) {
      v = VERBS[i];
      if (reflexiveSich(v.inf)) continue;
      if (!(v.aux === 's' || i % 3 === 0)) continue;
      var person = PERSONS[(i * 7 + 3) % PERSONS.length];
      var form = dictForm(v, person) + ' ' + v.pp;
      var label = person === 'er' ? ['er', 'sie', 'es'][i % 3] : person === 'sie' ? ['sie (pl.)', 'Sie'][i % 2] : person;
      items.push({
        id: 'full:' + v.inf, concept: 'helper', kind: 'type', inf: v.inf,
        prompt: label + ' + ' + v.inf, sub: v.en, instruction: 'Type helper + Partizip II (e.g. "sind gefahren")',
        answers: [form], display: form, displayHtml: A(dictForm(v, person)) + ' ' + P(v.pp),
        explain: explainAux(v) + ' ' + esc(verbAuxWord(v)) + ' with ' + esc(label) + ' → ' + A(dictForm(v, person)) + '. ' + explainPP(v),
      });
    }

    // trans: present sentence → Perfekt sentence (typed)
    for (i = 0; i < SENTENCES.length; i++) {
      S = SENTENCES[i];
      items.push({
        id: 'tr:' + i, concept: 'trans', kind: 'type', inf: S.inf,
        prompt: presentMain(S), sub: S.en, instruction: 'Rewrite in the Perfekt. Keep the word order' + (S.front ? ' (start with "' + cap(S.front) + '")' : '') + '.',
        answers: [perfektMain(S)], display: perfektMain(S), displayHtml: perfektMainHtml(S),
        explain: transExplain(S),
      });
    }

    // order: arrange chunks — main clause, subordinate clause, negation
    for (i = 0; i < SENTENCES.length; i++) {
      S = SENTENCES[i];
      var mainChunks = perfektChunks(S);
      if (mainChunks.length >= 3) {
        items.push({
          id: 'wo:' + i + ':m', concept: 'order', kind: 'order', inf: S.inf,
          prompt: S.en, sub: null, instruction: (S.form === 'q') ? 'Build the yes/no question' : (S.form === 'w') ? 'Build the W-question' : S.front ? 'Build the statement (it starts with "' + cap(S.front) + '")' : 'Build the statement',
          chunks: mainChunks, punct: (S.form === 'q' || S.form === 'w') ? '?' : '.', display: perfektMain(S), displayHtml: perfektMainHtml(S),
          explain: orderExplain(S),
        });
      }
      var subChunks = [subFrame(S, i)].concat(subPerfektChunks(S));
      if (subChunks.length >= 4 && i % 2 === 0) {
        items.push({
          id: 'wo:' + i + ':s', concept: 'order', kind: 'order', inf: S.inf,
          prompt: S.en, sub: null, instruction: 'Build the sentence with the subordinate clause',
          chunks: subChunks, punct: '.', display: subChunks.join(' ') + '.', displayHtml: esc(subChunks[0]) + ' ' + subPerfektHtml(S) + '.',
          explain: 'Subordinate clause (' + esc(subChunks[0].split(' ').pop()) + '): the conjugated helper goes to the very end, after the Partizip II → … ' + P(S.pp) + ' ' + A(S.aux) + '.',
        });
      }
      if (S.neg && i % 2 === 1) {
        items.push({
          id: 'wo:' + i + ':n', concept: 'order', kind: 'order', inf: S.inf,
          prompt: S.en, sub: null, instruction: 'Negate the whole statement with "nicht"',
          chunks: negChunks(S), punct: '.', display: negSentence(S), displayHtml: negChunks(S).map(function (c) { return c === S.pp ? P(c) : c.toLowerCase() === S.aux ? A(c) : c === 'nicht' ? '<b>nicht</b>' : esc(c); }).join(' ') + '.',
          explain: '<b>nicht</b> goes directly before the Partizip II: … nicht ' + P(S.pp) + '. The helper stays in position 2.',
        });
      }
    }

    // sub: typed subordinate clauses — from sentences (dass / ob / W-word) and the hand-written weil/obwohl set
    for (i = 0; i < SENTENCES.length; i++) {
      S = SENTENCES[i];
      var frame = subFrame(S, i);
      var conj = frame.split(' ').pop();
      items.push({
        id: 'sub:' + i, concept: 'sub', kind: 'type', inf: S.inf,
        prompt: frame + ' ' + subPresentClause(S) + '.', sub: S.en, instruction: 'Rewrite the clause after "' + conj + '" in the Perfekt',
        prefix: frame, answers: [subPerfektClause(S), conj + ' ' + subPerfektClause(S), frame + ' ' + subPerfektClause(S)],
        display: frame + ' ' + subPerfektClause(S) + '.', displayHtml: esc(frame) + ' ' + subPerfektHtml(S) + '.',
        explain: 'After <b>' + esc(conj) + '</b> the conjugated verb goes to the end. In the Perfekt that is the helper, so the order at the end is Partizip II + helper: … ' + P(S.pp) + ' ' + A(S.aux) + '.' + (S.sep ? ' In the present tense the separable prefix rejoins the verb at the end (' + esc(S.sep + S.v) + '); in the Perfekt it is inside the participle (' + esc(S.pp) + ').' : ''),
      });
    }
    for (i = 0; i < SUBS.length; i++) {
      S = SUBS[i];
      var conj2 = S.frame.split(' ').pop();
      items.push({
        id: 'subx:' + i, concept: 'sub', kind: 'type', inf: S.inf,
        prompt: S.frame + ' ' + subPresentClause(S) + '.', sub: S.en, instruction: 'Rewrite the clause after "' + conj2 + '" in the Perfekt',
        prefix: S.frame, answers: [subPerfektClause(S), conj2 + ' ' + subPerfektClause(S), S.frame + ' ' + subPerfektClause(S)],
        display: S.frame + ' ' + subPerfektClause(S) + '.', displayHtml: esc(S.frame) + ' ' + subPerfektHtml(S) + '.',
        explain: 'After <b>' + esc(conj2) + '</b>: Partizip II + helper at the very end → … ' + P(S.pp) + ' ' + A(S.aux) + '.',
      });
      items.push({
        id: 'wo:x' + i + ':s', concept: 'order', kind: 'order', inf: S.inf,
        prompt: S.en, sub: null, instruction: 'Build the sentence with the subordinate clause',
        chunks: [S.frame].concat(subPerfektChunks(S)), punct: '.', display: S.frame + ' ' + subPerfektClause(S) + '.', displayHtml: esc(S.frame) + ' ' + subPerfektHtml(S) + '.',
        explain: 'Subordinate clause (' + esc(conj2) + '): the conjugated helper goes to the very end, after the Partizip II → … ' + P(S.pp) + ' ' + A(S.aux) + '.',
      });
    }

    // neg: typed negation with nicht
    for (i = 0; i < SENTENCES.length; i++) {
      S = SENTENCES[i];
      if (!S.neg) continue;
      items.push({
        id: 'neg:' + i, concept: 'neg', kind: 'type', inf: S.inf,
        prompt: perfektMain(S), sub: S.en, instruction: 'Negate the whole sentence with "nicht"',
        answers: [negSentence(S)], display: negSentence(S),
        displayHtml: negChunks(S).map(function (c) { return c === S.pp ? P(c) : c.toLowerCase() === S.aux ? A(c) : c === 'nicht' ? '<b>nicht</b>' : esc(c); }).join(' ') + '.',
        explain: '<b>nicht</b> goes directly before the Partizip II: … nicht ' + P(S.pp) + '. Everything else stays where it was.',
      });
    }

    return items;
  }

  function transExplain(S) {
    var vb = VERB_BY_INF[S.inf];
    var parts = [];
    parts.push('Helper ' + A(S.aux) + ' takes the verb\u2019s place in position 2' + (S.form === 'q' ? ' (position 1 in a yes/no question)' : '') + '; the Partizip II ' + P(S.pp) + ' goes to the end.');
    if (S.sep) parts.push('Separable verb: the prefix ' + esc(S.sep) + ' (which stood at the end in the present) is now inside the participle: ' + esc(S.pp) + '.');
    parts.push(explainAux(vb, S.why));
    if (S.form === 'w') parts.push('W-question: W-word first, then the helper, then the subject.');
    if (S.front) parts.push('Something else is in position 1, so the subject moves behind the helper (' + A(S.aux) + ' ' + esc(S.s) + ').');
    return parts.join(' ');
  }
  function orderExplain(S) {
    if (S.form === 'q') return 'Yes/no question: helper first, subject second, Partizip II ' + P(S.pp) + ' at the end.';
    if (S.form === 'w') return 'W-question: W-word, then helper ' + A(S.aux) + ' in position 2, then the subject, Partizip II ' + P(S.pp) + ' at the end.';
    if (S.front) return 'Statement starting with "' + esc(cap(S.front)) + '": helper ' + A(S.aux) + ' stays in position 2, so the subject comes after it. Partizip II ' + P(S.pp) + ' at the end.';
    return 'Statement: subject, helper ' + A(S.aux) + ' in position 2, everything else, Partizip II ' + P(S.pp) + ' at the end (Satzklammer).';
  }
  // ───────────────────────────────────────────────────────────────────────────
  // 6. Leitner scheduler
  //    box 0 = new / failed → due now · box 5 = mastered (kept on a long review cycle)
  // ───────────────────────────────────────────────────────────────────────────
  var MIN = 60 * 1000, HOUR = 60 * MIN, DAY = 24 * HOUR;
  var INTERVALS = [0, 30 * MIN, 4 * HOUR, 1 * DAY, 3 * DAY, 7 * DAY];
  var MASTER_BOX = 5;
  var STORAGE_KEY = 'perfekt-drill:v1';

  function createState() {
    return { v: 1, items: {}, stats: { answered: 0, correct: 0, sessions: 0, days: {} }, history: [], settings: { len: 20, concepts: [], strict: false, mode: 'drill' } };
  }
  function loadState(storage) {
    try {
      var raw = storage && storage.getItem(STORAGE_KEY);
      if (!raw) return createState();
      var st = JSON.parse(raw);
      if (!st || st.v !== 1) return createState();
      var base = createState();
      st.items = st.items || {};
      st.stats = Object.assign(base.stats, st.stats || {});
      st.history = st.history || [];
      st.settings = Object.assign(base.settings, st.settings || {});
      return st;
    } catch (e) { return createState(); }
  }
  function saveState(state, storage) {
    try { storage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; } catch (e) { return false; }
  }
  function rec(state, id) {
    return state.items[id] || { b: 0, d: 0, n: 0, c: 0, l: 0, s: 0 }; // box, due, seen, correct, lapses, streak
  }
  function isDue(r, now) { return r.n > 0 && r.d <= now; }
  function isNew(r) { return r.n === 0; }
  function isMastered(r) { return r.b >= MASTER_BOX; }

  function dayKey(now) { var d = new Date(now); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  // Apply an answer; returns the updated record
  function applyAnswer(state, id, correct, now) {
    var r = rec(state, id);
    r.n += 1;
    if (correct) {
      r.c += 1; r.s += 1;
      r.b = Math.min(MASTER_BOX, r.b + 1);
      r.d = now + (r.b === MASTER_BOX && r.s > MASTER_BOX ? Math.min(INTERVALS[MASTER_BOX] * (r.s - MASTER_BOX + 1), 60 * DAY) : INTERVALS[r.b]);
    } else {
      r.s = 0; r.l += 1; r.b = 0; r.d = now;
    }
    state.items[id] = r;
    state.stats.answered += 1;
    if (correct) state.stats.correct += 1;
    var k = dayKey(now);
    state.stats.days[k] = (state.stats.days[k] || 0) + 1;
    return r;
  }

  function filterItems(items, concepts) {
    if (!concepts || !concepts.length) return items;
    var set = {}; concepts.forEach(function (c) { set[c] = true; });
    return items.filter(function (it) { return set[it.concept]; });
  }

  function shuffle(arr, rnd) {
    rnd = rnd || Math.random;
    for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr;
  }

  // Interleave new items across concepts so early sessions mix question types
  function roundRobin(items) {
    var buckets = {}, order = [];
    items.forEach(function (it) { if (!buckets[it.concept]) { buckets[it.concept] = []; order.push(it.concept); } buckets[it.concept].push(it); });
    var out = [], more = true;
    while (more) {
      more = false;
      order.forEach(function (c) { if (buckets[c].length) { out.push(buckets[c].shift()); more = true; } });
    }
    return out;
  }

  // Build a session: list of item ids
  // mode: drill (due → new → ahead) · weak (lapsed / low boxes) · exam (random across everything)
  function buildSession(state, items, opts, now, rnd) {
    opts = opts || {};
    rnd = rnd || Math.random;
    var len = opts.len || 20;
    var pool = filterItems(items, opts.concepts);
    var picked = [];
    var recs = {};
    pool.forEach(function (it) { recs[it.id] = rec(state, it.id); });

    if (opts.mode === 'exam') {
      picked = shuffle(pool.slice(), rnd).slice(0, len);
    } else if (opts.mode === 'weak') {
      var weak = pool.filter(function (it) { var r = recs[it.id]; return r.n > 0 && (r.l > 0 || r.b <= 1); });
      weak.sort(function (a, b) { var ra = recs[a.id], rb = recs[b.id]; return (rb.l - ra.l) || (ra.b - rb.b) || (ra.d - rb.d); });
      picked = weak.slice(0, len);
      if (picked.length < len) {
        var restW = pool.filter(function (it) { return picked.indexOf(it) === -1 && recs[it.id].n > 0; });
        restW.sort(function (a, b) { return recs[a.id].b - recs[b.id].b || recs[a.id].d - recs[b.id].d; });
        picked = picked.concat(restW.slice(0, len - picked.length));
      }
    } else {
      var due = pool.filter(function (it) { return isDue(recs[it.id], now); });
      due.sort(function (a, b) { var ra = recs[a.id], rb = recs[b.id]; return (ra.b - rb.b) || (ra.d - rb.d); });
      picked = due.slice(0, len);
      if (picked.length < len) {
        var fresh = roundRobin(pool.filter(function (it) { return isNew(recs[it.id]); }));
        picked = picked.concat(fresh.slice(0, len - picked.length));
      }
      if (picked.length < len && opts.ahead !== false) {
        var ahead = pool.filter(function (it) { var r = recs[it.id]; return r.n > 0 && !isDue(r, now) && picked.indexOf(it) === -1; });
        ahead.sort(function (a, b) { var ra = recs[a.id], rb = recs[b.id]; return (ra.b - rb.b) || (ra.d - rb.d); });
        picked = picked.concat(ahead.slice(0, len - picked.length));
      }
    }
    return shuffle(picked.map(function (it) { return it.id; }), rnd);
  }

  // A running session: queue of ids; wrong answers are re-queued a few positions later
  function Session(ids, mode) {
    this.queue = ids.slice();
    this.mode = mode || 'drill';
    this.pos = 0;
    this.first = {};      // id → first-attempt correctness
    this.attempts = 0;
    this.correct = 0;
    this.retryGap = 4;
    this.done = false;
    this.total = ids.length;
  }
  Session.prototype.current = function () { return this.done ? null : this.queue[this.pos]; };
  Session.prototype.remaining = function () { return this.queue.length - this.pos; };
  Session.prototype.record = function (id, correct) {
    this.attempts += 1;
    if (correct) this.correct += 1;
    if (!(id in this.first)) this.first[id] = correct;
    if (!correct && this.mode !== 'exam') {
      var at = Math.min(this.queue.length, this.pos + 1 + this.retryGap);
      this.queue.splice(at, 0, id);
    }
    this.pos += 1;
    if (this.pos >= this.queue.length) this.done = true;
  };
  Session.prototype.summary = function () {
    var ids = Object.keys(this.first);
    var firstCorrect = ids.filter(function (k) { return this.first[k]; }, this).length;
    return { items: ids.length, firstTryCorrect: firstCorrect, attempts: this.attempts, correct: this.correct, missed: ids.filter(function (k) { return !this.first[k]; }, this) };
  };

  function finishSession(state, session, now) {
    state.stats.sessions += 1;
    var sm = session.summary();
    state.history.unshift({ t: now, mode: session.mode, items: sm.items, first: sm.firstTryCorrect, attempts: sm.attempts });
    if (state.history.length > 100) state.history.length = 100;
  }

  // Progress summaries
  function progress(state, items, now) {
    var byConcept = {};
    CONCEPTS.forEach(function (c) { byConcept[c.id] = { total: 0, boxes: [0, 0, 0, 0, 0, 0], mastered: 0, due: 0, fresh: 0 }; });
    var overall = { total: 0, mastered: 0, due: 0, fresh: 0, boxes: [0, 0, 0, 0, 0, 0] };
    items.forEach(function (it) {
      var r = rec(state, it.id), c = byConcept[it.concept];
      c.total += 1; c.boxes[r.b] += 1; overall.total += 1; overall.boxes[r.b] += 1;
      if (isMastered(r)) { c.mastered += 1; overall.mastered += 1; }
      if (isDue(r, now)) { c.due += 1; overall.due += 1; }
      if (isNew(r)) { c.fresh += 1; overall.fresh += 1; }
    });
    return { byConcept: byConcept, overall: overall };
  }

  function troubleVerbs(state, items, limit) {
    var agg = {};
    items.forEach(function (it) {
      var r = state.items[it.id]; if (!r || !r.l) return;
      var a = agg[it.inf] || (agg[it.inf] = { inf: it.inf, lapses: 0, items: 0 });
      a.lapses += r.l; a.items += 1;
    });
    return Object.keys(agg).map(function (k) { return agg[k]; }).sort(function (a, b) { return b.lapses - a.lapses; }).slice(0, limit || 10);
  }

  function streakDays(state, now) {
    var days = state.stats.days || {}, n = 0, d = new Date(now);
    if (!days[dayKey(d.getTime())]) d.setDate(d.getDate() - 1); // today not yet counted: streak may still be alive from yesterday
    while (days[dayKey(d.getTime())]) { n += 1; d.setDate(d.getDate() - 1); }
    return n;
  }

  function formatInterval(ms) {
    if (ms < HOUR) return Math.round(ms / MIN) + ' min';
    if (ms < DAY) return Math.round(ms / HOUR) + ' h';
    return Math.round(ms / DAY) + ' d';
  }

  var ITEMS = buildItems();
  var ITEM_BY_ID = {};
  ITEMS.forEach(function (it) { ITEM_BY_ID[it.id] = it; });

  globalThis.PerfektCore = {
    VERBS: VERBS, VERB_BY_INF: VERB_BY_INF, SENTENCES: SENTENCES, SUBS: SUBS, ITEMS: ITEMS, ITEM_BY_ID: ITEM_BY_ID,
    CONCEPTS: CONCEPTS, CONCEPT_BY_ID: CONCEPT_BY_ID, CLASS_NAME: CLASS_NAME, HABEN: HABEN, SEIN: SEIN, PERSONS: PERSONS, WHY_TEXT: WHY_TEXT,
    INTERVALS: INTERVALS, MASTER_BOX: MASTER_BOX, STORAGE_KEY: STORAGE_KEY,
    presentMain: presentMain, perfektMain: perfektMain, perfektChunks: perfektChunks, perfektMainHtml: perfektMainHtml, negSentence: negSentence, negChunks: negChunks,
    subFrame: subFrame, subPresentClause: subPresentClause, subPerfektClause: subPerfektClause, hasGe: hasGe, sepPrefix: sepPrefix, explainPP: explainPP, explainAux: explainAux,
    normStrict: normStrict, normLoose: normLoose, check: check, esc: esc, cap: cap,
    createState: createState, loadState: loadState, saveState: saveState, rec: rec, isDue: isDue, isNew: isNew, isMastered: isMastered,
    applyAnswer: applyAnswer, buildSession: buildSession, Session: Session, finishSession: finishSession, progress: progress, troubleVerbs: troubleVerbs, streakDays: streakDays,
    formatInterval: formatInterval, shuffle: shuffle, dayKey: dayKey,
  };
})();

<script id="ui">
/* Perfekt drill — UI. Depends on PerfektCore (globalThis). */
(function () {

  }

  // ── app state ──────────────────────────────────────────────────────────────
  var app = {

  function bar(boxes, total) {

    }

  }

  function drawBrackets() {
    var nodes = root.querySelectorAll('.klammer');
    for (var i = 0; i < nodes.length; i++) {
      var k = nodes[i];

      if (!br) { br = document.createElement('span'); br.className = 'br'; k.appendChild(br); }
      var a = k.querySelector('.aux'), p = k.querySelector('.pp');
      if (!a || !p || !k.offsetWidth || a.offsetTop !== p.offsetTop || p.offsetLeft <= a.offsetLeft) { br.className = 'br hidden'; continue; }
      var left = a.offsetLeft, right = p.offsetLeft + p.offsetWidth;
      br.className = 'br';
      br.style.left = left + 'px';
      br.style.width = (right - left) + 'px';
      br.style.top = (a.offsetTop + a.offsetHeight - 2) + 'px';
    }
  }
  var resizeTimer = null;
  globalThis.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawBrackets, 80); });

  function header(current) {
    var nav = ['home', 'progress'].map(function (v) {

    }).join('');
    return '<header class="top"><h1><button data-nav="home" aria-label="Perfekt drill, home">Perfekt</button></h1><nav>' + nav + '</nav></header>';
  }

  // ── home ───────────────────────────────────────────────────────────────────
  function renderHome() {
    var now = app.now();
    var pg = C.progress(state, C.ITEMS, now);
    var st = state.settings;
    var H = HERO[app.heroIdx % HERO.length];
    var heroHtml = C.perfektChunks(H).map(function (c) {
      if (c === H.pp) return '<span class="pp">' + esc(c) + '</span>';
      if (c.toLowerCase() === H.aux) return '<span class="aux">' + esc(c) + '</span>';
      return esc(c);
    }).join(' ') + '.';
    var due = pg.overall.due, fresh = pg.overall.fresh, mastered = pg.overall.mastered, total = pg.overall.total;
    var modes = [['drill', 'Drill'], ['weak', 'Weak spots'], ['exam', 'Exam']];
    var modeHelp = {
      drill: 'Reviews what is due, then introduces new questions, then pulls the weakest items forward. Wrong answers come back within the session.',
      weak: 'Only questions you have missed before or that sit in the lowest boxes.',
      exam: 'A random sample across everything you have selected, scored at the end. Wrong answers are not repeated.',
    }[st.mode];
    var lens = [10, 20, 40];
    var conceptChips = C.CONCEPTS.map(function (c) {
      var on = st.concepts.indexOf(c.id) !== -1;
      return '<button class="chip" data-concept="' + c.id + '" aria-pressed="' + on + '">' + esc(c.short) + '</button>';
    }).join('');
    var conceptRows = C.CONCEPTS.map(function (c) {
      var p = pg.byConcept[c.id];
      var on = st.concepts.indexOf(c.id) !== -1;
      return '<button class="concept" data-concept="' + c.id + '" aria-pressed="' + on + '">' +
        '<span class="name">' + esc(c.name) + '</span>' +
        '<span class="nums">' + p.mastered + ' / ' + p.total + ' mastered' + (p.due ? ' \u00b7 ' + p.due + ' due' : '') + '</span>' +
        bar(p.boxes, p.total) +
        '<span class="desc">' + esc(c.desc) + '</span></button>';
    }).join('');
    var poolSize = C.ITEMS.filter(function (it) { return !st.concepts.length || st.concepts.indexOf(it.concept) !== -1; }).length;

    root.innerHTML = header('home') +
      (storageWarning ? '<div class="warn">' + esc(storageWarning) + '</div>' : '') +
      '<section class="hero">' +
        '<p class="klammer" lang="de">' + heroHtml + '</p>' +
        '<div class="hero-row"><p class="hero-en">' + esc(H.en) + '</p><button class="linkbtn" data-act="hero-next">Another example</button></div>' +
        '<p class="legend">The Satzklammer: <span class="aux">helper</span> in position 2, <span class="pp">Partizip II</span> at the end. The colours stay the same everywhere in the app.</p>' +
      '</section>' +
      '<div class="strip">' + bar(pg.overall.boxes, total) + '<div class="nums"><b>' + mastered + '</b> of ' + total + ' mastered \u00b7 <b>' + due + '</b> due now \u00b7 ' + fresh + ' not yet seen</div></div>' +
      '<section class="panel">' +
        '<h2>Start a session</h2>' +
        '<div class="row"><span class="lbl">Mode</span><span class="seg" role="group" aria-label="Mode">' + modes.map(function (m) { return '<button data-mode="' + m[0] + '" aria-pressed="' + (st.mode === m[0]) + '">' + m[1] + '</button>'; }).join('') + '</span></div>' +
        '<p class="modehelp">' + modeHelp + '</p>' +
        '<div class="row"><span class="lbl">Length</span><span class="seg" role="group" aria-label="Session length">' + lens.map(function (n) { return '<button data-len="' + n + '" aria-pressed="' + (st.len === n) + '">' + n + '</button>'; }).join('') + '</span></div>' +
        '<div class="row" style="align-items:flex-start"><span class="lbl" style="padding-top:8px">Focus</span><div class="chips"><button class="chip" data-concept="" aria-pressed="' + (st.concepts.length === 0) + '">Everything</button>' + conceptChips + '</div></div>' +
        '<div class="row"><label class="toggle"><input type="checkbox" data-strict ' + (st.strict ? 'checked' : '') + '> Strict spelling (ae/oe/ue/ss for \u00e4/\u00f6/\u00fc/\u00df count as wrong)</label></div>' +
        '<div class="actions"><button class="primary" data-act="start"' + (poolSize ? '' : ' disabled') + '>Start ' + (st.mode === 'exam' ? 'exam' : 'session') + '</button><span class="note">' + poolSize + ' questions in the selected focus</span></div>' +
        (app.notice ? '<p class="note" role="status" style="margin:10px 0 0;color:var(--bad)">' + esc(app.notice) + '</p>' : '') +
      '</section>' +
      '<section class="panel">' +
        '<h2>Concepts</h2><p class="note" style="margin-top:-6px">Tap a concept to focus a session on it. Mastered means five correct answers in a row spread over at least four days; one mistake sends a question back to the start.</p>' +
        '<div class="concepts">' + conceptRows + '</div>' +
      '</section>';
    drawBrackets();
  }

  // ── session ────────────────────────────────────────────────────────────────
  function startSession() {
    var st = state.settings;
    var ids = C.buildSession(state, C.ITEMS, { len: st.len, mode: st.mode, concepts: st.concepts }, app.now());
    if (!ids.length) {
      app.notice = st.mode === 'weak' ? 'No weak spots yet in this focus. Answer some questions in Drill mode first.' : 'Nothing to drill in this focus.';
      app.view = 'home'; render(); return;
    }
    app.notice = '';
    app.session = new C.Session(ids, st.mode);
    app.sessionOpts = { mode: st.mode, len: st.len, concepts: st.concepts.slice() };
    app.view = 'session';
    prepareQuestion();
    render();
  }
  function prepareQuestion() {
    app.phase = 'ask';
    app.picked = null;
    app.lastResult = null;
    var it = currentItem();
    if (it && it.kind === 'order') {
      var pool = it.chunks.slice();
      // shuffle until the order differs from the answer (always possible with ≥3 distinct chunks)
      var tries = 0;
      do { C.shuffle(pool); tries++; } while (tries < 20 && pool.every(function (c, i) { return c === it.chunks[i]; }));
      app.orderPool = pool;
      app.picked = [];
    }
  }
  function currentItem() { var id = app.session && app.session.current(); return id ? C.ITEM_BY_ID[id] : null; }

  function renderSession() {
    var it = currentItem();
    if (!it) { app.view = 'summary'; return renderSummary(); }
    var ses = app.session;
    var concept = C.CONCEPT_BY_ID[it.concept];
    var answered = ses.pos, totalQ = ses.queue.length;
    var body = '';
    if (it.kind === 'type') {
      body = '<div class="inputrow">' + (it.prefix ? '<span class="prefix" lang="de">' + esc(it.prefix) + '</span>' : '') +
        '<input class="answer" lang="de" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" data-answer' + (app.phase === 'feedback' ? ' disabled' : '') + '>' +
        (app.phase === 'ask' ? '<button class="primary" data-act="check">Check</button>' : '') + '</div>';
    } else if (it.kind === 'choice') {
      var isDe = it.concept === 'aux';
      body = '<div class="options' + (it.options.length === 2 ? ' two' : '') + '" role="group" aria-label="Options">' + it.options.map(function (o, i) {
        var cls = 'opt' + (isDe ? ' de' : '');
        if (app.phase === 'feedback') { if (i === it.answer) cls += ' right'; else if (i === app.picked) cls += ' wrong'; }
        return '<button class="' + cls + '" data-opt="' + i + '"' + (app.phase === 'feedback' ? ' disabled' : '') + '><span class="key">' + (i + 1) + '</span><span class="txt">' + esc(o) + '</span></button>';
      }).join('') + '</div>';
    } else if (it.kind === 'order') {
      var target = app.picked.map(function (c, i) { return '<button class="tok" data-untok="' + i + '" lang="de" aria-label="Remove ' + esc(c) + '"' + (app.phase === 'feedback' ? ' disabled' : '') + '>' + esc(c) + '</button>'; }).join('');
      var full = app.picked.length === it.chunks.length;
      body = '<div class="order-target" aria-label="Your sentence">' + (target || '<span class="empty">Tap the pieces in order</span>') + (full ? '<span class="punct">' + it.punct + '</span>' : '') + '</div>' +
        '<div class="order-pool">' + app.orderPool.map(function (c, i) {
          var used = app.picked.indexOf(c) !== -1;
          return '<button class="tok' + (used ? ' used' : '') + '" data-tok="' + i + '" lang="de"' + (used || app.phase === 'feedback' ? ' disabled' : '') + '><span class="key">' + (i + 1) + '</span>' + esc(c) + '</button>';
        }).join('') + '</div>' +
        (app.phase === 'ask' ? '<div class="check-row"><button class="primary" data-act="check"' + (full ? '' : ' disabled') + '>Check</button><span class="hint"><span class="kbd">1</span>\u2013<span class="kbd">' + app.orderPool.length + '</span> pick, <span class="kbd">\u232b</span> undo, <span class="kbd">\u21b5</span> check</span></div>' : '');
    }

    var fb = '';
    if (app.phase === 'feedback') {
      var r = app.lastResult;
      var rec = C.rec(state, it.id);
      var correctHtml = it.displayHtml || (it.kind === 'type' && it.concept === 'pp' ? '<span class="pp">' + esc(it.display) + '</span>' : it.kind === 'type' && it.concept === 'helper' && it.id.indexOf('full:') === 0 ? '<span class="aux">' + esc(it.display.split(' ')[0]) + '</span> <span class="pp">' + esc(it.display.split(' ')[1]) + '</span>' : esc(it.display));
      var yours = '';
      if (!r.correct) {
        if (it.kind === 'type') yours = r.answer ? '<p class="yours">You wrote: <s lang="de">' + esc(r.answer) + '</s></p>' : '<p class="yours">You left it blank.</p>';
        if (it.kind === 'order') yours = '<p class="yours">You built: <s lang="de">' + esc(r.answer.join(' ')) + '</s></p>';
      }
      var sched = r.correct
        ? (rec.b >= C.MASTER_BOX ? 'Mastered. Next check in ' + C.formatInterval(rec.d - app.now()) + '.' : 'Box ' + rec.b + ' of ' + C.MASTER_BOX + '. Comes back in ' + C.formatInterval(rec.d - app.now()) + '.')
        : (ses.mode === 'exam' ? 'Back to box 0.' : 'Back to box 0. You\u2019ll see it again in a few questions.');
      var spelling = r.spelling ? '<p class="spelling">' + (r.correct ? 'Accepted, but note the spelling: ' : 'Spelling: ') + '<b lang="de">' + esc(it.display) + '</b></p>' : '';
      fb = '<div class="feedback' + (r.correct ? '' : ' bad') + '" role="status">' +
        '<p class="verdict">' + (r.correct ? 'Correct' : 'Not quite') + '</p>' +
        '<p class="correct klammer" lang="de">' + correctHtml + '</p>' + yours + spelling +
        '<p class="explain">' + it.explain + '</p>' +
        '<p class="sched">' + sched + '</p>' +
        '<div class="check-row"><button class="primary" data-act="next">' + (ses.remaining() > 1 ? 'Next' : 'Finish') + '</button><span class="hint"><span class="kbd">\u21b5</span> next</span></div>' +
      '</div>';
    }

    root.innerHTML = header('home') +
      '<div class="session-head"><button class="linkbtn" data-act="end">End session</button><span>' + (answered + 1) + ' of ' + totalQ + (ses.mode === 'exam' ? ' \u00b7 exam' : '') + '</span><span class="concept-name">' + esc(concept.name) + '</span></div>' +
      '<div class="progress-dots"><span style="width:' + (answered / totalQ * 100).toFixed(1) + '%"></span></div>' +
      '<section class="card">' +
        '<p class="prompt' + (it.prompt.length > 40 ? ' small' : '') + '" lang="' + (it.kind === 'order' ? 'en' : 'de') + '">' + esc(it.prompt) + '</p>' +
        (it.sub ? '<p class="sub">' + esc(it.sub) + '</p>' : '<p class="sub"></p>') +
        '<p class="instruction">' + esc(it.instruction) + '</p>' +
        body + fb +
      '</section>';
    if (app.phase === 'ask' && it.kind === 'type') { var inp = root.querySelector('[data-answer]'); if (inp) inp.focus(); }
    if (app.phase === 'feedback') { var nb = root.querySelector('[data-act="next"]'); if (nb) nb.focus(); }
    drawBrackets();
  }

  function submit() {
    var it = currentItem(); if (!it || app.phase !== 'ask') return;
    var answer;
    if (it.kind === 'type') { var inp = root.querySelector('[data-answer]'); answer = inp ? inp.value : ''; }
    else if (it.kind === 'choice') { if (app.picked === null) return; answer = app.picked; }
    else { if (app.picked.length !== it.chunks.length) return; answer = app.picked.slice(); }
    var r = C.check(it, answer, state.settings.strict);
    r.answer = answer;
    C.applyAnswer(state, it.id, r.correct, app.now());
    app.session.record(it.id, r.correct);
    if (window.deutschHome) deutschHome.answer(r.correct);
    // record() advanced the queue; step back so feedback shows this item, then advance on Next
    app.session.pos -= 1; app.session.done = false;
    app.lastResult = r;
    app.phase = 'feedback';
    persist();
    render();
  }
  function next() {
    if (app.phase !== 'feedback') return;
    app.session.pos += 1;
    if (app.session.pos >= app.session.queue.length) { app.session.done = true; finish(); return; }
    prepareQuestion();
    render();
  }
  function finish() {
    C.finishSession(state, app.session, app.now());
    persist();
    app.view = 'summary';
    render();
  }
  function endEarly() {
    if (app.session.attempts === 0) { app.view = 'home'; app.session = null; render(); return; }
    finish();
  }

  function renderSummary() {
    var ses = app.session;
    var sm = ses.summary();
    var pct = sm.items ? Math.round(sm.firstTryCorrect / sm.items * 100) : 0;
    var missed = sm.missed.map(function (id) {
      var it = C.ITEM_BY_ID[id];
      return '<li><span class="note">' + esc(C.CONCEPT_BY_ID[it.concept].short) + ' \u00b7 ' + esc(it.prompt) + '</span><br><span class="de" lang="de">' + (it.displayHtml || esc(it.display)) + '</span></li>';
    }).join('');
    var pg = C.progress(state, C.ITEMS, app.now());
    root.innerHTML = header('home') +
      '<section class="panel summary">' +
        '<p class="big">' + pct + '%</p>' +
        '<p>' + sm.firstTryCorrect + ' of ' + sm.items + ' right on the first try' + (sm.attempts > sm.items ? ', ' + (sm.attempts - sm.items) + ' retr' + (sm.attempts - sm.items === 1 ? 'y' : 'ies') : '') + (ses.mode === 'exam' ? ' (exam)' : '') + '.</p>' +
        '<p class="note">' + pg.overall.mastered + ' of ' + pg.overall.total + ' questions mastered overall \u00b7 ' + pg.overall.due + ' due now.</p>' +
        (missed ? '<div class="missed"><h2>Missed</h2><ul>' + missed + '</ul></div>' : '<p>Nothing missed.</p>') +
        '<div class="actions"><button class="primary" data-act="again">Another session</button><button class="secondary" data-nav="home">Back</button></div>' +
      '</section>';
    drawBrackets();
  }

  // ── progress view ──────────────────────────────────────────────────────────
  function renderProgress() {
    var now = app.now();
    var pg = C.progress(state, C.ITEMS, now);
    var o = pg.overall;
    var acc = state.stats.answered ? Math.round(state.stats.correct / state.stats.answered * 100) : 0;
    var rows = C.CONCEPTS.map(function (c) {
      var p = pg.byConcept[c.id];
      return '<button class="concept" disabled style="cursor:default"><span class="name">' + esc(c.name) + '</span><span class="nums">' + p.mastered + ' / ' + p.total + ' mastered \u00b7 ' + p.due + ' due \u00b7 ' + p.fresh + ' new</span>' + bar(p.boxes, p.total) + '</button>';
    }).join('');
    var trouble = C.troubleVerbs(state, C.ITEMS, 12);
    var tHtml = trouble.length ? '<ul class="trouble">' + trouble.map(function (t) {
      var v = C.VERB_BY_INF[t.inf];
      return '<li><span><span class="de" lang="de">' + esc(t.inf) + '</span>' + (v ? ' <span class="note">\u2192 <span class="aux">' + esc(v.aux === 's' ? 'ist' : 'hat') + '</span> <span class="pp">' + esc(v.pp) + '</span></span>' : '') + '</span><span class="note">' + t.lapses + ' miss' + (t.lapses === 1 ? '' : 'es') + '</span></li>';
    }).join('') + '</ul>' : '<p class="note">No mistakes recorded yet.</p>';
    var legend = [5, 4, 3, 2, 1, 0].map(function (b) { return '<span style="--c:var(--box' + b + ')">' + (b === 5 ? 'mastered' : b === 0 ? 'new / reset' : 'box ' + b) + ' ' + o.boxes[b] + '</span>'; }).join('');
    root.innerHTML = header('progress') +
      '<section class="panel"><h2>Overall</h2>' + bar(o.boxes, o.total) + '<div class="boxes">' + legend + '</div>' +
        '<p class="note" style="margin-top:12px">Intervals between boxes: ' + C.INTERVALS.slice(1).map(C.formatInterval).join(' \u2192 ') + '. A mastered question keeps coming back at growing intervals; a mistake at any point resets it to box 0.</p></section>' +
      '<section class="panel"><h2>By concept</h2><div class="concepts">' + rows + '</div></section>' +
      '<section class="panel"><h2>Verbs you keep missing</h2>' + tHtml + '</section>' +
      '<section class="panel"><h2>Stats</h2><div class="stats">' +
        '<div class="stat"><div class="v">' + state.stats.answered + '</div><div class="k">answers</div></div>' +
        '<div class="stat"><div class="v">' + acc + '%</div><div class="k">accuracy</div></div>' +
        '<div class="stat"><div class="v">' + state.stats.sessions + '</div><div class="k">sessions</div></div>' +
        '<div class="stat"><div class="v">' + C.streakDays(state, now) + '</div><div class="k">day streak</div></div>' +
      '</div></section>' +
      '<section class="panel"><h2>Your data</h2><p class="note">Progress lives in this browser only. Export to move it to another device or keep a backup.</p>' +
        '<div class="actions"><button class="secondary" data-act="export">Export progress</button><button class="secondary" data-act="import-show">Import</button><button class="secondary" data-act="reset">Reset everything</button></div>' +
        '<div data-io hidden style="margin-top:12px"><textarea class="io" data-io-text aria-label="Progress JSON"></textarea><div class="actions"><button class="primary" data-act="import">Load this JSON</button><button class="secondary" data-act="copy">Copy</button><span class="note" data-io-msg></span></div></div>' +
      '</section>';
  }

  // ── events ─────────────────────────────────────────────────────────────────
  root.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t || t.disabled) return;
    var st = state.settings;
    if (t.hasAttribute('data-nav')) {
      var v = t.getAttribute('data-nav');
      if (app.view === 'session' && v === 'home') { endEarly(); return; }
      if (app.view === 'session' && app.session && app.session.attempts > 0) { C.finishSession(state, app.session, app.now()); persist(); }
      app.view = v; app.session = null; app.notice = ''; render(); return;
    }
    if (t.hasAttribute('data-mode')) { st.mode = t.getAttribute('data-mode'); app.notice = ''; persist(); render(); return; }
    if (t.hasAttribute('data-len')) { st.len = +t.getAttribute('data-len'); app.notice = ''; persist(); render(); return; }
    if (t.hasAttribute('data-concept')) {
      app.notice = '';
      var c = t.getAttribute('data-concept');
      if (!c) st.concepts = [];
      else { var i = st.concepts.indexOf(c); if (i === -1) st.concepts.push(c); else st.concepts.splice(i, 1); }
      persist(); render(); return;
    }
    var act = t.getAttribute('data-act');
    if (act === 'hero-next') { app.heroIdx = (app.heroIdx + 1 + Math.floor(Math.random() * (HERO.length - 1))) % HERO.length; render(); return; }
    if (act === 'start' || act === 'again') { startSession(); return; }
    if (act === 'check') { submit(); return; }
    if (act === 'next') { next(); return; }
    if (act === 'end') { endEarly(); return; }
    if (t.hasAttribute('data-opt') && app.phase === 'ask') { app.picked = +t.getAttribute('data-opt'); submit(); return; }
    if (t.hasAttribute('data-tok') && app.phase === 'ask') { pickTok(+t.getAttribute('data-tok')); return; }
    if (t.hasAttribute('data-untok') && app.phase === 'ask') { app.picked.splice(+t.getAttribute('data-untok'), 1); render(); return; }
    if (act === 'export') { showIO(JSON.stringify(state)); return; }
    if (act === 'import-show') { showIO(''); return; }
    if (act === 'copy') { var ta = root.querySelector('[data-io-text]'); ta.select(); try { document.execCommand('copy'); ioMsg('Copied.'); } catch (err) { ioMsg('Select the text and copy it manually.'); } return; }
    if (act === 'import') { importJSON(); return; }
    if (act === 'reset') { if (globalThis.confirm && !globalThis.confirm('Delete all progress and start from zero?')) return; state = C.createState(); persist(); render(); return; }
  });
  root.addEventListener('change', function (e) {
    if (e.target.hasAttribute('data-strict')) { state.settings.strict = e.target.checked; persist(); }
  });
  function pickTok(i) {
    var it = currentItem(); if (!it || it.kind !== 'order') return;
    var c = app.orderPool[i];
    if (c === undefined || app.picked.indexOf(c) !== -1 || app.picked.length >= it.chunks.length) return;
    app.picked.push(c); render();
  }
  function showIO(text) {
    var box = root.querySelector('[data-io]'); if (!box) return;
    box.hidden = false; var ta = root.querySelector('[data-io-text]'); ta.value = text; ioMsg(text ? 'Copy this text to back up or move your progress.' : 'Paste exported progress here.'); ta.focus();
  }
  function ioMsg(m) { var el = root.querySelector('[data-io-msg]'); if (el) el.textContent = m; }
  function importJSON() {
    var ta = root.querySelector('[data-io-text]'); if (!ta) return;
    try {
      var obj = JSON.parse(ta.value);
      if (!obj || obj.v !== 1 || typeof obj.items !== 'object') throw new Error('bad');
      var fake = { getItem: function () { return JSON.stringify(obj); } };
      state = C.loadState(fake); persist(); ioMsg('Loaded. ' + Object.keys(state.items).length + ' questions with history.'); render();
    } catch (err) { ioMsg('That is not a progress export from this app.'); }
  }

  document.addEventListener('keydown', function (e) {
    if (app.view !== 'session') return;
    var it = currentItem(); if (!it) return;
    var tag = (e.target && e.target.tagName) || '';
    if (e.key === 'Enter') {
      if (app.phase === 'feedback') { e.preventDefault(); next(); return; }
      if (it.kind === 'type' && tag === 'INPUT') { e.preventDefault(); submit(); return; }
      if (it.kind === 'order') { e.preventDefault(); submit(); return; }
      return;
    }
    if (e.key === 'Escape') { e.preventDefault(); endEarly(); return; }
    if (app.phase !== 'ask' || tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (it.kind === 'choice' && /^[1-9]$/.test(e.key)) { var n = +e.key - 1; if (n < it.options.length) { app.picked = n; submit(); } return; }
    if (it.kind === 'order') {
      if (/^[1-9]$/.test(e.key)) { pickTok(+e.key - 1); return; }
      if (e.key === 'Backspace') { e.preventDefault(); if (app.picked.length) { app.picked.pop(); render(); } return; }
    }
  });

  function render() {
    if (app.view === 'home') renderHome();
    else if (app.view === 'session') renderSession();
    else if (app.view === 'summary') renderSummary();
    else if (app.view === 'progress') renderProgress();
    try { globalThis.scrollTo(0, 0); } catch (err) { /* not available */ }
  }

  // exposed for the headless test suite
  globalThis.PerfektApp = { app: app, render: render, getState: function () { return state; }, startSession: startSession, submit: submit, next: next, HERO: HERO };
  render();
})();

</script>
<script src="deutsch-home.js"></script>
</body>
</html>
