<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wortstellung — German word order</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEEF0; --card:#fff; --ink:#16202B; --ink2:#4E5A69; --ink3:#7C8794;
  --rule:#D5D9DE; --rule2:#E7EAEE;
  --kl:#2C46B8; --kl-bg:#E8EBF9;
  --vf:#8E6110; --vf-bg:#F7EFDF;
  --nf:#1A6558; --nf-bg:#E1EFEC;
  --mf:#5E6A79; --mf-bg:#F1F3F5;
  --bad:#A32B20; --bad-bg:#FBECEA;
  --good:#1A6558; --good-bg:#E4F0ED;
  --sans:'Archivo',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
  --serif:'Source Serif 4',Charter,Georgia,'Times New Roman',serif;
  --r:3px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--rule2) 1px,transparent 1px),linear-gradient(90deg,var(--rule2) 1px,transparent 1px);
  background-size:26px 26px;
}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.011em}
h1{font-size:1.5rem;line-height:1.25}
h2{font-size:.9375rem;color:var(--ink2);font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--kl);outline-offset:2px}

/* ── chrome ── */
header{
  position:sticky;top:0;z-index:20;background:rgba(237,238,240,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
}
.bar{max-width:60rem;margin:0 auto;padding:.7rem 1.25rem;display:flex;align-items:center;gap:1rem}
.mark{font-family:var(--serif);font-size:1.0625rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.meter{flex:1;max-width:15rem;margin-right:auto;min-width:60px;display:flex;align-items:center;gap:.55rem}
.mtrack{flex:1;height:5px;background:var(--rule);border-radius:99px;overflow:hidden}
#meter-fill{height:100%;background:var(--kl);width:0;transition:width .5s cubic-bezier(.2,.7,.3,1)}
#meter-num{font-size:.75rem;font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:500}
.nav{display:flex;gap:.15rem}
.nav button{padding:.3rem .6rem;font-size:.8125rem;color:var(--ink2);border-radius:var(--r)}
.nav button[aria-current=page]{background:var(--ink);color:#fff}
main{max-width:60rem;margin:0 auto;padding:1.75rem 1.25rem 5rem}

/* ── field frame (the signature) ── */
.framewrap{margin:1rem 0 0}
.framenote{font-size:.75rem;color:var(--ink3);margin-bottom:.35rem}
.frame{
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
}
.fcol{padding:.5rem .65rem .6rem;border-right:1px solid var(--rule2);min-width:0}
.fcol:nth-of-type(5){border-right:0}
.flab{display:block;font-size:.625rem;font-weight:600;color:var(--ink3);margin-bottom:.25rem;line-height:1.3}
.fval{font-family:var(--serif);font-size:.9375rem;line-height:1.35;overflow-wrap:break-word}
.f-vf{background:var(--vf-bg)} .f-vf .flab{color:var(--vf)}
.f-lk,.f-rk{background:var(--kl-bg)} .f-lk .flab,.f-rk .flab{color:var(--kl)}
.f-lk .fval,.f-rk .fval{font-weight:600;color:var(--kl)}
.f-mf{background:var(--card)}
.f-nf{background:var(--nf-bg)} .f-nf .flab{color:var(--nf)}
.clamp{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:repeat(10,1fr)}
.clamp i{
  grid-column:4/8;height:12px;border:2px solid var(--kl);border-top:0;border-radius:0 0 2px 2px;
  transform-origin:center;animation:clampin .45s cubic-bezier(.3,.8,.3,1) both;
}
.frame::after{
  content:'Satzklammer';grid-column:1/-1;grid-row:3;text-align:center;
  font-size:.625rem;font-weight:600;color:var(--kl);padding:.1rem 0 .3rem;
}
@keyframes clampin{from{transform:scaleX(.15);opacity:0}to{transform:scaleX(1);opacity:1}}

/* ── home ── */
.hero{margin-bottom:2.25rem}
.heroText{max-width:34rem}
.hero h1{font-family:var(--serif);font-size:clamp(1.5rem,4.4vw,2rem);line-height:1.18;letter-spacing:-.02em}
.lede{color:var(--ink2);margin-top:.5rem;font-size:.9375rem;max-width:36rem}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem;margin:0 0 2.25rem}
.btn{
  display:block;text-align:left;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r);padding:.7rem .85rem;transition:border-color .15s,background .15s;
}
.btn strong{display:block;font-size:.9375rem;font-weight:600}
.btn span{display:block;font-size:.75rem;color:var(--ink3);margin-top:.1rem}
.btn:hover:not(:disabled){border-color:var(--ink3)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary span{color:#A8B4C2}
.btn.primary:hover{background:#0D1620}
.topics h2{margin-bottom:.6rem}
.tlist{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.topic{
  display:block;width:100%;text-align:left;padding:.6rem .85rem .7rem;
  border-bottom:1px solid var(--rule2);transition:background .12s;
}
.topic:last-child{border-bottom:0}
.topic:hover:not(.static){background:#F6F7F9}
.topic.static{cursor:default}
.thead{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.tno{font-size:.6875rem;color:var(--ink3);font-variant-numeric:tabular-nums;margin-right:.5rem;font-weight:600}
.tname{min-width:0}
.tde{display:block;font-family:var(--serif);font-size:1rem;font-weight:600}
.ten{display:block;font-size:.75rem;color:var(--ink3);line-height:1.4}
.tnum{text-align:right;font-size:.8125rem;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.tpct{display:block;font-weight:600}
.tcount{display:block;font-size:.6875rem;color:var(--ink3)}
.tbar{position:relative;height:3px;background:var(--rule);border-radius:99px;margin-top:.5rem;overflow:hidden}
.tbar .fill{position:absolute;left:0;top:0;height:100%;background:var(--kl);border-radius:99px}
.tbar .part{position:absolute;left:0;top:0;height:100%;background:#BDC6EC;border-radius:99px}
.cert{background:var(--good-bg);border:1px solid var(--good);border-radius:var(--r);padding:.9rem 1rem;margin-top:1.5rem}
.cert h2{color:var(--good)}
.cert p{font-size:.875rem;color:var(--ink2);margin-top:.3rem}

/* ── drill ── */
.sessbar{margin-bottom:1rem}
.sprog{height:3px;background:var(--rule);border-radius:99px;overflow:hidden}
.spfill{height:100%;background:var(--ink);transition:width .35s}
.smeta{display:flex;align-items:center;gap:.6rem;margin-top:.45rem;font-size:.75rem;color:var(--ink3)}
.smeta>span:first-child{font-weight:500;color:var(--ink2)}
.pips{display:inline-flex;gap:3px;flex:1}
.pip{width:5px;height:5px;border-radius:99px;background:var(--rule);display:inline-block}
.pip.on{background:var(--kl)}
.scount{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:1.1rem 1.15rem 1.25rem}
.prompt p{margin-bottom:.35rem}
.prompt .ask{font-size:.9375rem;color:var(--ink2)}
.prompt .given{font-family:var(--serif);font-size:1.25rem;line-height:1.4;color:var(--ink)}
.answer{margin-top:1.1rem}
.stem{font-family:var(--serif);font-size:1.0625rem;color:var(--ink2)}
.stem.tail{margin-top:.4rem}
.line{
  min-height:3rem;border-bottom:2px solid var(--ink);padding:.4rem .1rem .5rem;
  display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin:.5rem 0 .9rem;
}
.linehint{font-size:.8125rem;color:var(--ink3)}
.tokrow{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.tok{
  font-family:var(--serif);font-size:1rem;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r);padding:.28rem .55rem;display:inline-flex;align-items:center;gap:.35rem;
  transition:border-color .12s,background .12s;
}
.tok:hover:not(.spent){border-color:var(--ink)}
.tok .tnum{font-family:var(--sans);font-size:.625rem;color:var(--ink3);font-variant-numeric:tabular-nums}
.tok.spent{opacity:.32;cursor:default}
.tok.in{background:var(--kl-bg);border-color:#BDC6EC}
.tok.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.tok.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.tok.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.tokfix{font-family:var(--serif);font-size:1.0625rem;padding:.15rem 0}
.slots{gap:.1rem;line-height:2.4}
.gap{
  min-width:1.35rem;height:1.9rem;border-bottom:2px dotted var(--ink3);border-radius:2px;
  font-family:var(--serif);font-size:1rem;padding:0 .2rem;color:var(--kl);
}
.gap:hover{background:var(--kl-bg);border-bottom-color:var(--kl)}
.gap.sel{background:var(--kl-bg);border-bottom:2px solid var(--kl);font-weight:600}
.gap.good{background:var(--good-bg);border-bottom:2px solid var(--good);color:var(--good);font-weight:600}
.gap.bad{background:var(--bad-bg);border-bottom:2px solid var(--bad);color:var(--bad)}
.fixed{font-family:var(--serif);font-size:1.0625rem;color:var(--ink2);margin-right:.2rem}
.opts{display:flex;flex-direction:column;gap:.35rem}
.opt{
  display:flex;gap:.6rem;align-items:baseline;text-align:left;background:var(--card);
  border:1px solid var(--rule);border-radius:var(--r);padding:.5rem .7rem;transition:border-color .12s;
}
.opt:hover{border-color:var(--ink3)}
.onum{font-size:.6875rem;color:var(--ink3);font-variant-numeric:tabular-nums;min-width:.7rem}
.otxt{font-size:.9375rem}
.otxt.de{font-family:var(--serif);font-size:1.0625rem}
.opt.sel{border-color:var(--ink);background:#F7F8F9}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.input{
  width:100%;font-family:var(--serif);font-size:1.125rem;padding:.5rem .1rem;
  border:0;border-bottom:2px solid var(--ink);background:transparent;border-radius:0;
}
.input::placeholder{font-family:var(--sans);font-size:.9375rem;color:var(--ink3)}
.feedback{display:none}
.feedback.on{display:block;margin-top:1.1rem;padding-top:.9rem;border-top:1px solid var(--rule2)}
.verdict{font-size:.8125rem;font-weight:600}
.feedback.right .verdict{color:var(--good)}
.feedback.wrong .verdict,.feedback.shown .verdict{color:var(--bad)}
.solution{font-family:var(--serif);font-size:1.1875rem;line-height:1.4;margin-top:.25rem}
.explain{font-size:.875rem;color:var(--ink2);margin-top:.45rem;max-width:44rem}
.foot{display:flex;align-items:center;gap:1rem;margin-top:1rem}
.btn.go{background:var(--ink);border-color:var(--ink);color:#fff;padding:.5rem 1.4rem;font-weight:600;font-size:.9375rem;text-align:center}
.btn.go:hover{background:#0D1620}
.linkbtn{font-size:.8125rem;color:var(--ink3);text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

/* ── result ── */
.result h1{font-family:var(--serif)}
.missed{margin:1.75rem 0}
.missed h2{margin-bottom:.6rem}
.missrow{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--bad);border-radius:var(--r);padding:.65rem .8rem;margin-bottom:.4rem}
.mtopic{font-size:.6875rem;font-weight:600;color:var(--ink3)}
.msol{font-family:var(--serif);font-size:1.0625rem;margin-top:.15rem}
.mexp{font-size:.8125rem;color:var(--ink2);margin-top:.25rem}

/* ── progress ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin:1.25rem 0 2rem}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:.7rem .8rem}
.sv{display:block;font-size:1.5rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.sk{display:block;font-size:.75rem;color:var(--ink3);margin-top:.15rem}
.tools{margin-top:2rem;border-top:1px solid var(--rule);padding-top:1.25rem}
.tools p{font-size:.875rem;color:var(--ink2);margin:.35rem 0 .8rem;max-width:34rem}
.toolrow{display:flex;flex-wrap:wrap;gap:.4rem}
.btn.small{padding:.4rem .8rem;font-size:.8125rem;font-weight:500}
.btn.small.danger{color:var(--bad);border-color:#E4C4C0}

/* ── reference ── */
.ref h1{font-family:var(--serif);margin-bottom:1.25rem}
.refsec{border-top:1px solid var(--rule);padding:1.1rem 0}
.refsec h2{font-family:var(--serif);font-size:1.0625rem;color:var(--ink);margin-bottom:.5rem}
.refsec p{font-size:.9375rem;color:var(--ink2);max-width:44rem;margin-bottom:.5rem}
.refsec ul{margin:.25rem 0 .5rem;padding-left:1.1rem;max-width:44rem}
.refsec li{font-size:.9375rem;margin-bottom:.28rem;color:var(--ink2)}
.refsec li i{font-family:var(--serif);font-style:normal;font-size:1.0625rem;color:var(--ink)}
.refsec li b{font-weight:600;color:var(--ink)}

#toast{
  position:fixed;left:50%;bottom:1.25rem;transform:translate(-50%,140%);
  background:var(--ink);color:#fff;font-size:.8125rem;padding:.55rem .9rem;border-radius:var(--r);
  transition:transform .25s cubic-bezier(.2,.8,.3,1);z-index:60;max-width:90vw;text-align:center;
}
#toast.on{transform:translate(-50%,0)}

@media (max-width:720px){
  .frame{grid-template-columns:1fr}
  .fcol{border-right:0;border-bottom:1px solid var(--rule2);display:flex;gap:.6rem;align-items:baseline}
  .fcol:nth-of-type(5){border-bottom:0}
  .flab{margin:0;min-width:6.5rem;flex:none}
  .clamp,.frame::after{display:none}
  main{padding:1.25rem 1rem 4rem}
  .bar{padding:.55rem 1rem;flex-wrap:wrap;gap:.6rem}
  .mark{flex:1}
  .meter{order:3;flex-basis:100%;max-width:none}
  .nav button{padding:.3rem .5rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="mark">Wortstellung</span>
    <span class="meter"><span class="mtrack"><span id="meter-fill"></span></span><span id="meter-num">0%</span></span>
    <nav class="nav">
      <button data-v="home">Drill</button>
      <button data-v="progress">Progress</button>
      <button data-v="reference">Reference</button>
    </nav>
  </div>
</header>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* Wortstellung — question bank.
   i=id t=topic k=kind q=prompt s=stem x=tail o=options c=correct
   tk=tokens a=accepted answers w=word-to-insert e=explanation f=field breakdown */

const TOPICS = [
  { id: 'feld',        n: 'Das Feldermodell',       en: 'The five fields of the sentence frame' },
  { id: 'v2',          n: 'Verbzweitstellung',      en: 'The finite verb is the second element' },
  { id: 'v1',          n: 'Verberststellung',       en: 'Questions, imperatives, wenn-less conditionals' },
  { id: 'klammer',     n: 'Die rechte Klammer',     en: 'What waits at the end of the clause' },
  { id: 'nebensatz',   n: 'Verbletztstellung',      en: 'Subordinate clauses send the verb to the end' },
  { id: 'konnektoren', n: 'Konnektoren',            en: 'Three kinds of connector, three structures' },
  { id: 'mittelfeld',  n: 'Im Mittelfeld',          en: 'TeKaMoLo and the order of objects' },
  { id: 'negation',    n: 'Die Stellung von nicht', en: 'Sentence negation and partial negation' },
  { id: 'nachfeld',    n: 'Das Nachfeld',           en: 'What is allowed to follow the bracket' }
];

const BANK_A = [

/* ─────────────── 1. DAS FELDERMODELL ─────────────── */

{ i:'feld-01', t:'feld', k:'mc',
  q:'Gestern habe ich meinem Bruder ein Buch geschenkt.\nWhat occupies the Vorfeld?',
  o:['Gestern','habe','ich','geschenkt'], c:0,
  e:'The Vorfeld holds exactly one element — here the temporal adverb Gestern. The subject ich has been pushed into the Mittelfeld.',
  f:{vf:'Gestern', lk:'habe', mf:'ich meinem Bruder ein Buch', rk:'geschenkt', nf:'—'} },

{ i:'feld-02', t:'feld', k:'mc',
  q:'Gestern habe ich meinem Bruder ein Buch geschenkt.\nWhat is in the right bracket?',
  o:['ein Buch','geschenkt','habe','meinem Bruder'], c:1,
  e:'The right bracket takes the non-finite verb parts. Here that is the past participle geschenkt.',
  f:{vf:'Gestern', lk:'habe', mf:'ich meinem Bruder ein Buch', rk:'geschenkt', nf:'—'} },

{ i:'feld-03', t:'feld', k:'mc',
  q:'Gestern habe ich meinem Bruder ein Buch geschenkt.\nWhat is in the left bracket?',
  o:['Gestern','ich','habe','geschenkt'], c:2,
  e:'In a main clause the left bracket is the finite verb — the one carrying person and tense. That is habe.',
  f:{vf:'Gestern', lk:'habe', mf:'ich meinem Bruder ein Buch', rk:'geschenkt', nf:'—'} },

{ i:'feld-04', t:'feld', k:'mc',
  q:'Gestern habe ich meinem Bruder ein Buch geschenkt.\nWhat is in the Mittelfeld?',
  o:['ich meinem Bruder ein Buch','meinem Bruder ein Buch geschenkt','Gestern ich','ein Buch'], c:0,
  e:'The Mittelfeld is everything sitting between the two brackets: subject, objects and adverbials.',
  f:{vf:'Gestern', lk:'habe', mf:'ich meinem Bruder ein Buch', rk:'geschenkt', nf:'—'} },

{ i:'feld-05', t:'feld', k:'mc',
  q:'Morgen will ich nach Berlin fahren.\nWhat is in the right bracket?',
  o:['nach Berlin','will','fahren','nach Berlin fahren'], c:2,
  e:'Only the non-finite verb belongs to the bracket. nach Berlin is a normal Mittelfeld element that happens to sit right before it.',
  f:{vf:'Morgen', lk:'will', mf:'ich nach Berlin', rk:'fahren', nf:'—'} },

{ i:'feld-06', t:'feld', k:'mc',
  q:'Morgen will ich nach Berlin fahren.\nWhat is in the Mittelfeld?',
  o:['ich','ich nach Berlin','nach Berlin fahren','Morgen ich'], c:1,
  e:'Everything between will and fahren is Mittelfeld: the subject ich plus the local phrase nach Berlin.',
  f:{vf:'Morgen', lk:'will', mf:'ich nach Berlin', rk:'fahren', nf:'—'} },

{ i:'feld-07', t:'feld', k:'mc',
  q:'Er hat mir gesagt, dass er kommt.\nWhat is in the Nachfeld?',
  o:['mir','gesagt','dass er kommt','hat'], c:2,
  e:'Subordinate clauses are routinely pushed out past the right bracket into the Nachfeld rather than sitting inside the Mittelfeld.',
  f:{vf:'Er', lk:'hat', mf:'mir', rk:'gesagt', nf:', dass er kommt'} },

{ i:'feld-08', t:'feld', k:'mc',
  q:'Er hat mir gesagt, dass er kommt.\nWhat is in the right bracket?',
  o:['hat','mir','gesagt','kommt'], c:2,
  e:'gesagt is the participle of the main clause. kommt belongs to the embedded clause, which has its own frame.',
  f:{vf:'Er', lk:'hat', mf:'mir', rk:'gesagt', nf:', dass er kommt'} },

{ i:'feld-09', t:'feld', k:'mc',
  q:'Ich rufe dich morgen an.\nWhat is in the right bracket?',
  o:['an','rufe','morgen','dich'], c:0,
  e:'A stranded separable prefix occupies the right bracket on its own.',
  f:{vf:'Ich', lk:'rufe', mf:'dich morgen', rk:'an', nf:'—'} },

{ i:'feld-10', t:'feld', k:'mc',
  q:'Ich fahre morgen nach Berlin.\nWhat is in the right bracket?',
  o:['fahre','nach Berlin','morgen nach Berlin','nothing — it is empty'], c:3,
  e:'A simple tense with a non-separable verb leaves the right bracket empty. The frame is still there, just unfilled.',
  f:{vf:'Ich', lk:'fahre', mf:'morgen nach Berlin', rk:'—', nf:'—'} },

{ i:'feld-11', t:'feld', k:'mc',
  q:'Weil ich müde bin, bleibe ich zu Hause.\nWhat occupies the Vorfeld of the main clause?',
  o:['Weil','Weil ich müde bin','bleibe','ich'], c:1,
  e:'A whole subordinate clause counts as one element, so it can fill the Vorfeld by itself. That is why bleibe comes straight after the comma.',
  f:{vf:'Weil ich müde bin', lk:'bleibe', mf:'ich zu Hause', rk:'—', nf:'—'} },

{ i:'feld-12', t:'feld', k:'mc',
  q:'…, weil ich müde bin.\nIn this subordinate clause, what fills the left bracket?',
  o:['ich','weil','müde','bin'], c:1,
  e:'The same frame covers subordinate clauses. The subordinating conjunction takes the slot the finite verb would otherwise hold.',
  f:{vf:'—', lk:'weil', mf:'ich müde', rk:'bin', nf:'—'} },

{ i:'feld-13', t:'feld', k:'mc',
  q:'…, weil ich müde bin.\nIn this subordinate clause, what fills the right bracket?',
  o:['weil','ich','müde','bin'], c:3,
  e:'Because the conjunction has taken the left bracket, the finite verb is pushed all the way to the right bracket.',

{ i:'kl-21', t:'klammer', k:'order', q:'Build the sentence. Start with: Er',

<script>
const REF = [
{ h:'The frame', b:[
  { p:'Every clause is one frame with five slots. Two of them hold verb material and clamp the rest in place.' },
  { f:{vf:'Gestern', lk:'habe', mf:'ich meinem Bruder ein Buch', rk:'geschenkt', nf:'—'} },
  { f:{vf:'Er', lk:'hat', mf:'mir', rk:'gesagt', nf:', dass er kommt'} },
  { l:['<b>Vorfeld</b> — exactly one element.',
       '<b>Left bracket</b> — the finite verb in a main clause, the conjunction in a subordinate clause.',
       '<b>Mittelfeld</b> — everything else.',
       '<b>Right bracket</b> — non-finite verb parts, prefixes, predicatives.',
       '<b>Nachfeld</b> — overflow.'] }
]},

{ h:'Main clauses', b:[
  { p:'The finite verb is the second element. An element is one constituent — a noun phrase, a prepositional phrase, an adverb, or a whole subordinate clause.' },
  { l:['<i>Ich fahre</i> morgen nach Berlin.',
       '<i>Morgen fahre ich</i> nach Berlin.',
       '<i>Nach Berlin fahre ich</i> morgen.',
       '<i>Mit meinem besten Freund aus Nigeria fahre ich</i> morgen nach Berlin.',
       '<i>Weil ich Urlaub habe, fahre ich</i> nach Berlin.'] },
  { p:'When anything other than the subject takes the Vorfeld, the subject moves into the Mittelfeld, usually straight after the verb.' }
]},

{ h:'Verb-first clauses', b:[
  { l:['Yes/no question — <i>Fährst du morgen nach Berlin?</i>',
       'Imperative — <i>Mach bitte das Fenster zu! / Machen Sie bitte das Fenster zu!</i>',
       'Conditional without wenn — <i>Hätte ich Zeit, würde ich kommen.</i>'] },
  { p:'W-questions are ordinary V2 — the question word simply takes the Vorfeld: Wann fährst du?' }
]},

{ h:'The right bracket', b:[
  { l:['Past participle — Ich habe das Buch <i>gelesen</i>.',
       'Infinitive after a modal — Ich muss heute <i>arbeiten</i>.',
       'Separable prefix — Ich rufe dich morgen <i>an</i>.',
       'Predicate noun or adjective — Er wird nächstes Jahr <i>Arzt</i>. / Sie ist <i>krank</i>.',
       'Fixed verb-noun pair — Ich fahre <i>Auto</i>. / Sie spielt <i>Klavier</i>.',
       'Verb cluster — Ich hätte das <i>machen können</i>.'] }
]},

{ h:'Subordinate clauses', b:[
  { p:'After a subordinating conjunction the finite verb goes to the very end, and a comma always separates the clauses.' },
  { l:['Ich bleibe zu Hause, <b>weil</b> ich müde <b>bin</b>.',
       'Er sagt, <b>dass</b> der Zug um acht <b>ankommt</b>. — the separable verb rejoins.',
       'Ich freue mich, <b>wenn</b> du mich besuchen <b>kannst</b>. — modal last.',
       'Sie glaubt, <b>dass</b> ich das Buch gelesen <b>habe</b>. — auxiliary last.',
       'Ich weiß, dass ich das <b>hätte</b> machen können. — double infinitive: the finite verb jumps in front.'] },
  { p:'Subordinators: dass, weil, da, ob, wenn, als, obwohl, damit, während, bevor, nachdem, seitdem, bis, falls, sobald, solange, indem, sodass. Relative clauses and indirect questions work the same way.' },
  { p:'If the subordinate clause comes first, the whole clause is the Vorfeld, so the main verb follows immediately: Weil ich müde bin, bleibe ich zu Hause.' }
]},

{ h:'Three kinds of connector', b:[
  { l:['<b>Coordinating</b> (position 0): und, aber, oder, denn, sondern — do not count as an element, normal V2 follows.',
       '<b>Subordinating</b>: weil, dass, obwohl, wenn, da — verb to the end.',
       '<b>Conjunctional adverbs</b>: deshalb, deswegen, darum, trotzdem, dann, danach, außerdem, sonst, also — usually take the Vorfeld.'] },
  { p:'Same idea, three structures: Ich bin müde, denn ich habe schlecht geschlafen. / Ich bin müde, weil ich schlecht geschlafen habe. / Ich habe schlecht geschlafen, deshalb bin ich müde.' },
  { p:'Conjunctional adverbs can also sit in the Mittelfeld: Ich bin deshalb müde.' }
]},

{ h:'Inside the Mittelfeld', b:[
  { p:'These are preferences rather than hard rules, but breaking them sounds wrong. Adverbials run temporal, kausal, modal, lokal.' },
  { p:'Ich fahre morgen wegen der Konferenz mit dem Zug nach Leeds.' },
  { p:'Objects have their own order:' },
  { l:['Pronouns come before all full noun phrases — Er hat <i>es dem Mann</i> gegeben.',
       'Among pronouns: nominative, accusative, dative — Er hat <i>es mir</i> gegeben.',
       'Among nouns: dative, accusative — Er hat <i>dem Mann das Buch</i> gegeben.',
       'Known before new.'] },
  { p:'The pronoun order inverts the noun order. Learn the pair together.' }
]},

{ h:'Placing nicht', b:[
  { p:'Partial negation: nicht goes directly before the element being negated. Ich fahre nicht nach Berlin, sondern nach Hamburg.' },
  { p:'Sentence negation: nicht goes as late as possible, but before the right bracket.' },
  { l:['Ich kenne ihn <b>nicht</b>.',
       'Ich habe das Buch <b>nicht</b> gelesen. — before the participle.',
       'Er ruft mich <b>nicht</b> an. — before the prefix.',
       'Ich kann heute <b>nicht</b> kommen. — before the infinitive.',
       'Ich fahre morgen <b>nicht</b> nach Berlin. — before the directional phrase.',
       'Das Buch ist <b>nicht</b> interessant. — before the predicative.',
       'Ich warte <b>nicht</b> auf dich. — before a prepositional object.'] },
  { p:'The two types are often structurally identical and are told apart only by stress and a sondern-continuation.' },
  { p:'One thing nicht does not do: negate an indefinite or bare noun. That takes kein, inflected like ein — Ich habe <b>kein</b> Auto. / Ich habe <b>keine</b> Zeit. / Sie wird <b>keine</b> Ärztin.' }
]},

{ h:'The Nachfeld', b:[
  { l:['Subordinate clauses — Ich habe gehört, <i>dass er kommt</i>.',
       'zu-infinitives — Ich habe versucht, <i>ihn anzurufen</i>. Note that zu goes inside a separable verb.',
       'Purpose clauses — Ich fahre nach Leeds, <i>um an einer Konferenz teilzunehmen</i>.',
       'Comparisons — Er hat mehr gearbeitet <i>als ich</i>. / Das war schwieriger, <i>als ich gedacht hatte</i>.',
       'Afterthoughts in speech — Ich bin gestern angekommen, <i>mit dem letzten Zug</i>.'] }
]}
];

</script>
<script>
/* ══════════ state ══════════ */
const KEY = 'wortstellung.v1';
const BOX_MAX = 5, MASTER_BOX = 4;
const IV = [0, 10 * 6e4, 864e5, 3 * 864e5, 8 * 864e5, 21 * 864e5];

const byId = {};
BANK.forEach(q => byId[q.i] = q);
const TOPIC = {};
TOPICS.forEach(t => TOPIC[t.id] = t);

let S = load();

function blank() {
  return { v: 1, items: {}, log: [], exam: { best: 0, attempts: 0 }, streak: { last: null, days: 0 } };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    const p = JSON.parse(raw);
    if (!p || p.v !== 1) return blank();
    p.items = p.items || {}; p.log = p.log || [];
    p.exam = p.exam || { best: 0, attempts: 0 };
    p.streak = p.streak || { last: null, days: 0 };
    for (const k of Object.keys(p.items)) if (!byId[k]) delete p.items[k];
    return p;
  } catch (e) { return blank(); }
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast('Progress could not be saved — this browser is blocking local storage.'); }
  }, 120);
}
function flush() {
  clearTimeout(saveTimer);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
}
addEventListener('pagehide', flush);
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
function st(id) { return S.items[id] || (S.items[id] = { b: 0, d: 0, n: 0, c: 0, w: 0 }); }
function has(id) { return !!S.items[id]; }

const today = () => new Date().toISOString().slice(0, 10);
function touchStreak() {
  const d = today();
  if (S.streak.last === d) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  S.streak.days = S.streak.last === y ? S.streak.days + 1 : 1;
  S.streak.last = d;
}

/* ══════════ mastery ══════════ */
function topicStats(tid) {
  const items = BANK.filter(q => q.t === tid);
  let mastered = 0, learning = 0, due = 0;
  const now = Date.now();
  for (const q of items) {
    if (!has(q.i)) continue;
    const s = st(q.i);
    if (s.b >= MASTER_BOX) mastered++; else learning++;
    if (s.d <= now) due++;
  }
  return { total: items.length, mastered, learning, fresh: items.length - mastered - learning, due, pct: items.length ? mastered / items.length : 0 };
}
function overall() {
  let m = 0;
  for (const q of BANK) if (has(q.i) && st(q.i).b >= MASTER_BOX) m++;
  return { mastered: m, total: BANK.length, pct: m / BANK.length };
}
function certified() {
  return TOPICS.every(t => topicStats(t.id).pct >= 0.9) && S.exam.best >= 90;
}

/* ══════════ session building ══════════ */
let sess = null;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };

function buildSession(mode, tid) {
  const now = Date.now();
  let queue = [];
  if (mode === 'exam') {
    const core = [], spare = [];
    TOPICS.forEach(t => {
      const pool = shuffle(BANK.filter(q => q.t === t.id));
      core.push(...pool.slice(0, 3));   // 9 topics x 3 = 27 guaranteed
      spare.push(...pool.slice(3));
    });
    queue = shuffle(core.concat(shuffle(spare).slice(0, 30 - core.length))).map(q => q.i);
  } else if (mode === 'topic') {
    const pool = BANK.filter(q => q.t === tid);
    const seen = pool.filter(q => has(q.i)).sort((a, b) => (st(a.i).b - st(b.i).b) || (st(a.i).d - st(b.i).d));
    const fresh = pool.filter(q => !has(q.i));
    queue = seen.filter(q => st(q.i).d <= now || st(q.i).b < MASTER_BOX).concat(fresh).slice(0, 20).map(q => q.i);
    if (!queue.length) queue = shuffle(pool).slice(0, 20).map(q => q.i);
  } else if (mode === 'weak') {
    queue = BANK.filter(q => has(q.i) && st(q.i).w > 0 && st(q.i).b < MASTER_BOX)
      .sort((a, b) => (st(b.i).w - st(b.i).c) - (st(a.i).w - st(a.i).c) || st(a.i).b - st(b.i).b)
      .slice(0, 20).map(q => q.i);
  } else { // smart
    const due = BANK.filter(q => has(q.i) && st(q.i).d <= now)
      .sort((a, b) => st(a.i).d - st(b.i).d).map(q => q.i);
    const fresh = [];
    const byTopic = TOPICS.map(t => BANK.filter(q => q.t === t.id && !has(q.i)));
    for (let r = 0; fresh.length < 8; r++) {
      let added = false;
      for (const list of byTopic) if (list[r]) { fresh.push(list[r].i); added = true; if (fresh.length >= 8) break; }
      if (!added) break;
    }
    queue = due.slice(0, 20 - Math.min(fresh.length, 8)).concat(fresh);
    queue = shuffle(queue);
  }
  if (!queue.length) return null;
  return { mode, tid, queue, idx: 0, right: 0, wrong: 0, done: 0, planned: queue.length, redone: new Set(), answered: false, log: [] };
}

/* ══════════ answer checking ══════════ */
const strip = s => (s || '').toLowerCase()
  .replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
const fold = s => strip(s).replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
const same = (a, b) => strip(a) === strip(b) || fold(a) === fold(b);

function check(q, resp) {
  switch (q.k) {
    case 'mc': case 'pick': return resp === q.c;
    case 'slot': return resp === q.c;
    case 'order': return q.a.some(a => same(a, resp.join(' ')));
    case 'cloze': return q.a.some(a => same(a, resp));
  }
  return false;
}

// typed answers are matched case-insensitively so that word order stays the thing being tested,
// but German capitalisation is graded at B1 — so flag a slip without failing the item
function capSlip(q, resp) {
  if (q.k !== 'cloze') return null;
  const keep = t => (t || '').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
  const given = keep(resp);
  for (const a of q.a) {
    const want = keep(a);
    if (want === given) return null;
    if (want.toLowerCase() === given.toLowerCase()) return a;
  }
  return null;
}

function grade(q, ok, schedule) {
  const s = st(q.i);
  s.n++;
  if (ok) { s.c++; s.b = Math.min(BOX_MAX, s.b + 1); }
  else { s.w++; s.b = 0; }
  if (schedule) s.d = Date.now() + IV[s.b];
  save();
}

/* ══════════ view plumbing ══════════ */
const $ = sel => document.querySelector(sel);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
let view = 'home';

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 3200);
}

function go(v) { view = v; render(); window.scrollTo({ top: 0 }); }

const EN_WORDS = /\b(the|what|which|is|are|was|where|how|why|does|do|did|rewrite|build|complete|place|click|give|turn|join|order|same|now|start|kind|correct|sentence|clause|answer|question|word|verb|field|bracket|negation|partial|and|not|but|of|to|in|for|with|it|you|your|this|that|these|those|one|two|three|five|none|nothing|only|yes|no)\b/i;
const isDE = t => !EN_WORDS.test(t || '');

function render() {
  document.onkeydown = null;
  const root = $('#main'); root.innerHTML = '';
  if (view === 'home') root.appendChild(Home());
  else if (view === 'drill') root.appendChild(Drill());
  else if (view === 'result') root.appendChild(Result());
  else if (view === 'progress') root.appendChild(Progress());
  else if (view === 'reference') root.appendChild(Reference());
  const o = overall();
  $('#meter-fill').style.width = (o.pct * 100).toFixed(1) + '%';
  $('#meter-num').textContent = Math.round(o.pct * 100) + '%';
  document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.v === view ? 'page' : 'false'));
}

/* ══════════ field frame ══════════ */
function Frame(f, note) {
  const wrap = el('div', 'framewrap');
  if (note) wrap.appendChild(el('p', 'framenote', note));
  const g = el('div', 'frame');
  const cols = [['vf', 'Vorfeld', f.vf], ['lk', 'linke Klammer', f.lk], ['mf', 'Mittelfeld', f.mf], ['rk', 'rechte Klammer', f.rk], ['nf', 'Nachfeld', f.nf]];
  cols.forEach(([k, label, val]) => {
    const c = el('div', 'fcol f-' + k);
    c.appendChild(el('span', 'flab', label));
    c.appendChild(el('span', 'fval', val && val !== '—' ? val : '—'));
    g.appendChild(c);
  });
  const clamp = el('div', 'clamp');
  clamp.setAttribute('aria-hidden', 'true');
  clamp.appendChild(el('i'));
  g.appendChild(clamp);
  wrap.appendChild(g);
  return wrap;
}

/* ══════════ home ══════════ */
function Home() {
  const w = el('div');
  const o = overall();

  const hero = el('section', 'hero');
  const h = el('div', 'heroText');
  h.appendChild(el('h1', null, 'Every German clause hangs on the same frame.'));
  h.appendChild(el('p', 'lede', 'Two verb positions clamp the sentence. Everything else falls into the space they leave. Drill the frame until placing a word is automatic.'));
  hero.appendChild(h);
  hero.appendChild(Frame({ vf: 'Gestern', lk: 'habe', mf: 'ich meinem Bruder ein Buch', rk: 'geschenkt', nf: '—' }));
  w.appendChild(hero);

  const now = Date.now();
  const dueCount = BANK.filter(q => has(q.i) && st(q.i).d <= now).length;
  const freshCount = BANK.filter(q => !has(q.i)).length;
  const weakCount = BANK.filter(q => has(q.i) && st(q.i).w > 0 && st(q.i).b < MASTER_BOX).length;

  const acts = el('div', 'actions');
  const start = el('button', 'btn primary');
  start.innerHTML = '<strong>Start today\u2019s review</strong><span>' +
    (dueCount ? dueCount + ' due' : 'nothing due') + (freshCount ? ', ' + freshCount + ' unseen' : '') + '</span>';
  start.onclick = () => { const s = buildSession('smart'); if (!s) { toast('Nothing to review right now. Try a topic drill.'); return; } sess = s; go('drill'); };
  acts.appendChild(start);

  const weak = el('button', 'btn');
  weak.innerHTML = '<strong>Weak spots</strong><span>' + (weakCount ? weakCount + ' item' + (weakCount === 1 ? '' : 's') + ' you have missed' : 'nothing missed yet') + '</span>';
  weak.disabled = !weakCount;
  weak.onclick = () => { const s = buildSession('weak'); if (!s) return; sess = s; go('drill'); };
  acts.appendChild(weak);

  const ex = el('button', 'btn');
  ex.innerHTML = '<strong>Mastery test</strong><span>' + (S.exam.attempts ? '30 questions, best so far ' + S.exam.best + '%' : '30 questions, all topics') + '</span>';
  ex.onclick = () => { sess = buildSession('exam'); go('drill'); };
  acts.appendChild(ex);
  w.appendChild(acts);

  const list = el('section', 'topics');
  list.appendChild(el('h2', null, 'The nine rules'));
  const tl = el('div', 'tlist');
  list.appendChild(tl);
  TOPICS.forEach((t, i) => {
    const s = topicStats(t.id);
    const row = el('button', 'topic');
    row.onclick = () => { sess = buildSession('topic', t.id); go('drill'); };
    const head = el('div', 'thead');
    const nm = el('div', 'tname');
    const de = el('span', 'tde');
    de.appendChild(el('span', 'tno', String(i + 1)));
    de.appendChild(document.createTextNode(t.n));
    nm.appendChild(de);
    nm.appendChild(el('span', 'ten', t.en));
    head.appendChild(nm);
    const num = el('div', 'tnum');
    num.appendChild(el('span', 'tpct', Math.round(s.pct * 100) + '%'));
    num.appendChild(el('span', 'tcount', s.mastered + '/' + s.total));
    head.appendChild(num);
    row.appendChild(head);
    const bar = el('div', 'tbar');
    const part = el('div', 'part'); part.style.width = ((s.mastered + s.learning) / s.total * 100) + '%';
    const fill = el('div', 'fill'); fill.style.width = (s.pct * 100) + '%';
    bar.appendChild(part); bar.appendChild(fill);
    row.appendChild(bar);
    tl.appendChild(row);
  });
  w.appendChild(list);

  if (certified()) {
    const c = el('section', 'cert');
    c.appendChild(el('h2', null, 'Mastery reached'));
    c.appendChild(el('p', null, 'Every topic is above 90% and you scored ' + S.exam.best + '% on the mastery test. Keep the daily review going so the spacing does its work.'));
    w.appendChild(c);
  }
  return w;
}

/* ══════════ drill ══════════ */
let resp = null;

function Drill() {
  if (!sess) { view = 'home'; return Home(); }
  if (sess.idx >= sess.queue.length) { view = 'result'; return Result(); }
  const q = byId[sess.queue[sess.idx]];
  const w = el('div', 'drill');

  const bar = el('div', 'sessbar');
  const prog = el('div', 'sprog');
  const pf = el('div', 'spfill'); pf.style.width = (sess.done / Math.max(sess.planned, sess.queue.length) * 100) + '%';
  prog.appendChild(pf); bar.appendChild(prog);
  const meta = el('div', 'smeta');
  meta.appendChild(el('span', null, sess.mode === 'exam' ? 'Mastery test' : TOPIC[q.t].n));
  const s = st(q.i);
  const pips = el('span', 'pips');
  if (sess.mode !== 'exam') {
    for (let i = 0; i < BOX_MAX; i++) { const p = el('i', 'pip' + (i < s.b ? ' on' : '')); pips.appendChild(p); }
    pips.title = 'Box ' + s.b + ' of ' + BOX_MAX;
  }
  meta.appendChild(pips);
  meta.appendChild(el('span', 'scount', (sess.done + 1) + ' / ' + sess.queue.length));
  bar.appendChild(meta);
  w.appendChild(bar);

  const card = el('section', 'card');
  const pr = el('div', 'prompt');
  q.q.split('\n').forEach(line => pr.appendChild(el('p', isDE(line) ? 'given' : 'ask', line)));
  card.appendChild(pr);

  const area = el('div', 'answer');
  card.appendChild(area);
  const fb = el('div', 'feedback');
  card.appendChild(fb);
  w.appendChild(card);

  const foot = el('div', 'foot');
  const submit = el('button', 'btn go', 'Check');
  const next = el('button', 'btn go', 'Next');
  next.style.display = 'none';
  foot.appendChild(submit); foot.appendChild(next);
  const skip = el('button', 'linkbtn', 'Show answer');
  foot.appendChild(skip);
  w.appendChild(foot);

  resp = q.k === 'order' ? [] : null;
  let locked = false;

  /* --- answer widgets --- */
  if (q.k === 'mc') {
    const opts = shuffle(q.o.map((text, i) => ({ text, ok: i === q.c })));
    const box = el('div', 'opts');
    opts.forEach((o, i) => {
      const b = el('button', 'opt');
      b.appendChild(el('span', 'onum', String(i + 1)));
      b.appendChild(el('span', 'otxt' + (isDE(o.text) ? ' de' : ''), o.text));
      b.onclick = () => { if (locked) return; box.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); resp = o.ok ? q.c : -1; b._ok = o.ok; };
      box.appendChild(b);
    });
    area.appendChild(box);
    area._keys = n => { const b = box.querySelectorAll('.opt')[n - 1]; if (b) b.click(); };
    area._reveal = () => box.querySelectorAll('.opt').forEach(b => {
      const o = opts[[...box.querySelectorAll('.opt')].indexOf(b)];
      if (o.ok) b.classList.add('good'); else if (b.classList.contains('sel')) b.classList.add('bad');
    });
  }

  if (q.k === 'pick') {
    const box = el('div', 'tokrow');
    if (q.s) box.appendChild(el('span', 'fixed', q.s));
    q.tk.forEach((t, i) => {
      const b = el('button', 'tok'); b.textContent = t;
      b.onclick = () => { if (locked) return; box.querySelectorAll('.tok').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); resp = i; };
      box.appendChild(b);
    });
    area.appendChild(box);
    area._keys = n => { const b = box.querySelectorAll('.tok')[n - 1]; if (b) b.click(); };
    area._reveal = () => box.querySelectorAll('.tok').forEach((b, i) => { if (i === q.c) b.classList.add('good'); else if (b.classList.contains('sel')) b.classList.add('bad'); });
  }

  if (q.k === 'slot') {
    const box = el('div', 'tokrow slots');
    const mk = gi => {
      const g = el('button', 'gap');
      g.setAttribute('aria-label', 'Insert ' + q.w + ' at position ' + (gi + 1));
      g.onclick = () => {
        if (locked) return;
        box.querySelectorAll('.gap').forEach(x => { x.classList.remove('sel'); x.textContent = ''; });
        g.classList.add('sel'); g.textContent = q.w; resp = gi;
      };
      return g;
    };
    box.appendChild(mk(0));
    q.tk.forEach((t, i) => { box.appendChild(el('span', 'tokfix', t)); box.appendChild(mk(i + 1)); });
    area.appendChild(box);
    area._reveal = () => box.querySelectorAll('.gap').forEach((g, i) => {
      if (i === q.c) { g.classList.add('good'); g.textContent = q.w; }
      else if (g.classList.contains('sel')) g.classList.add('bad');
    });
  }

  if (q.k === 'order') {
    if (q.s) area.appendChild(el('p', 'stem', q.s));
    const line = el('div', 'line');
    const hint = el('span', 'linehint', 'Tap the words below in order');
    line.appendChild(hint);
    area.appendChild(line);
    if (q.x) area.appendChild(el('p', 'stem tail', q.x));
    const bankRow = el('div', 'tokrow');
    area.appendChild(bankRow);
    const order = shuffle(q.tk.map((t, i) => ({ t, i })));
    const used = new Set();
    const paint = () => {
      line.innerHTML = '';
      if (!resp.length) line.appendChild(hint);
      resp.forEach((r, pos) => {
        const b = el('button', 'tok in'); b.textContent = r.t;
        b.onclick = () => { if (locked) return; used.delete(r.i); resp.splice(pos, 1); paint(); };
        line.appendChild(b);
      });
      bankRow.innerHTML = '';
      order.forEach((o, n) => {
        const b = el('button', 'tok');
        b.appendChild(el('span', 'tnum', String(n + 1)));
        b.appendChild(document.createTextNode(o.t));
        if (used.has(o.i)) b.classList.add('spent');
        b.onclick = () => { if (locked || used.has(o.i)) return; used.add(o.i); resp.push(o); paint(); };
        bankRow.appendChild(b);
      });
    };
    paint();
    area._keys = n => { const b = bankRow.querySelectorAll('.tok')[n - 1]; if (b) b.click(); };
    area._back = () => { if (resp.length) { const r = resp.pop(); used.delete(r.i); paint(); } };
    area._reveal = () => { line.classList.add('shown'); };
    area._value = () => resp.map(r => r.t);
  }

  if (q.k === 'cloze') {
    const inp = el('input', 'input');
    inp.type = 'text'; inp.autocapitalize = 'sentences'; inp.autocomplete = 'off'; inp.spellcheck = false;
    inp.placeholder = 'Type your answer';
    inp.oninput = () => resp = inp.value;
    area.appendChild(inp);
    setTimeout(() => inp.focus(), 30);
    area._reveal = () => inp.classList.add('done');
  }

  /* --- grading --- */
  function reveal(ok, shown, slip) {
    locked = true;
    if (area._reveal) area._reveal();
    submit.style.display = 'none';
    next.style.display = '';
    skip.style.display = 'none';
    fb.className = 'feedback on ' + (shown ? 'shown' : ok ? 'right' : 'wrong');
    const verdict = el('p', 'verdict', shown ? 'The answer' : ok ? 'Correct' : 'Not quite');
    fb.appendChild(verdict);
    if (!ok || shown) {
      const sol = el('p', 'solution');
      sol.textContent = solutionText(q);
      fb.appendChild(sol);
    } else if (slip) {
      const note = el('p', 'solution');
      note.textContent = 'Watch the capitals: ' + slip;
      fb.appendChild(note);
    }
    fb.appendChild(el('p', 'explain', q.e));
    if (q.f) fb.appendChild(Frame(q.f, q.fn));
    next.focus();
  }

  submit.onclick = () => {
    if (locked) return;
    const val = area._value ? area._value() : resp;
    if (val == null || val === '' || (Array.isArray(val) && !val.length)) { toast('Give an answer first.'); return; }
    const ok = check(q, val);
    if (sess.mode !== 'exam') grade(q, ok, true); else { const s2 = st(q.i); s2.n++; ok ? s2.c++ : s2.w++; save(); }
    sess.log.push({ i: q.i, ok });
    ok ? sess.right++ : sess.wrong++;
    if (!ok && sess.mode !== 'exam' && !sess.redone.has(q.i)) {
      sess.redone.add(q.i);
      const at = Math.min(sess.queue.length, sess.idx + 4);
      sess.queue.splice(at, 0, q.i);
    }
    reveal(ok, false, ok ? capSlip(q, val) : null);
  };

  skip.onclick = () => {
    if (locked) return;
    if (sess.mode !== 'exam') { grade(q, false, true); }
    sess.wrong++;
    sess.log.push({ i: q.i, ok: false });
    if (sess.mode !== 'exam' && !sess.redone.has(q.i)) {
      sess.redone.add(q.i);
      sess.queue.splice(Math.min(sess.queue.length, sess.idx + 4), 0, q.i);
    }
    reveal(false, true);
  };

  next.onclick = () => { sess.idx++; sess.done++; touchStreak(); save(); render(); };

  document.onkeydown = e => {
    if (view !== 'drill') return;
    if (e.key === 'Enter') { e.preventDefault(); locked ? next.click() : submit.click(); return; }
    if (e.key === 'Backspace' && area._back && q.k === 'order' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); area._back(); return; }
    if (/^[1-9]$/.test(e.key) && area._keys && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); area._keys(+e.key); }
  };

  return w;
}

function solutionText(q) {
  if (q.k === 'mc') return q.o[q.c];
  if (q.k === 'pick') return q.tk[q.c];
  if (q.k === 'cloze') return q.a[0];
  if (q.k === 'slot') { const t = q.tk.slice(); t.splice(q.c, 0, q.w); return t.join(' '); }
  if (q.k === 'order') return [q.s || '', q.a[0], q.x || ''].join(' ').replace(/\s+([,.])/g, '$1').replace(/\s+/g, ' ').trim();
  return '';
}

/* ══════════ result ══════════ */
function Result() {
  const w = el('div', 'result');
  const n = sess.log.length, right = sess.log.filter(l => l.ok).length;
  const pct = n ? Math.round(right / n * 100) : 0;
  if (sess.mode === 'exam') {
    S.exam.attempts++;
    if (pct > S.exam.best) S.exam.best = pct;
    save();
  }
  S.log.push({ t: Date.now(), n, c: right, m: sess.mode });
  if (S.log.length > 200) S.log = S.log.slice(-200);
  save();

  w.appendChild(el('h1', null, sess.mode === 'exam' ? 'Mastery test: ' + pct + '%' : 'Session complete'));
  w.appendChild(el('p', 'lede', right + ' of ' + n + ' correct' +
    (sess.mode === 'exam'
      ? (pct >= 90 ? '. That clears the 90% bar.' : '. 90% clears the bar — the misses below are where to go next.')
      : '.')));

  const missed = [...new Set(sess.log.filter(l => !l.ok).map(l => l.i))];
  if (missed.length) {
    const sec = el('section', 'missed');
    sec.appendChild(el('h2', null, 'Worth another look'));
    missed.forEach(id => {
      const q = byId[id];
      const d = el('div', 'missrow');
      d.appendChild(el('span', 'mtopic', TOPIC[q.t].n));
      d.appendChild(el('p', 'msol', solutionText(q)));
      d.appendChild(el('p', 'mexp', q.e));
      sec.appendChild(d);
    });
    w.appendChild(sec);
  }

  const acts = el('div', 'actions');
  const again = el('button', 'btn primary');
  again.innerHTML = '<strong>Keep going</strong><span>next batch</span>';
  again.onclick = () => { const s = buildSession(sess.mode === 'exam' ? 'smart' : sess.mode, sess.tid); if (!s) { toast('Nothing left in that queue.'); go('home'); return; } sess = s; go('drill'); };
  acts.appendChild(again);
  const home = el('button', 'btn');
  home.innerHTML = '<strong>Back to the overview</strong><span>see where you stand</span>';
  home.onclick = () => go('home');
  acts.appendChild(home);
  w.appendChild(acts);
  document.onkeydown = null;
  return w;
}

/* ══════════ progress ══════════ */
function Progress() {
  const w = el('div');
  const o = overall();
  w.appendChild(el('h1', null, 'Progress'));
  w.appendChild(el('p', 'lede', o.mastered + ' of ' + o.total + ' items mastered. An item counts as mastered once you have answered it correctly ' + MASTER_BOX + ' times in a row across separate sittings.'));

  const grid = el('div', 'stats');
  const days = S.streak.days || 0;
  const rev = S.log.reduce((a, l) => a + l.n, 0);
  [['Day streak', days], ['Questions answered', rev], ['Mastery test best', S.exam.attempts ? S.exam.best + '%' : '—'],
  ['Due now', BANK.filter(q => has(q.i) && st(q.i).d <= Date.now()).length]]
    .forEach(([k, v]) => { const c = el('div', 'stat'); c.appendChild(el('span', 'sv', String(v))); c.appendChild(el('span', 'sk', k)); grid.appendChild(c); });
  w.appendChild(grid);

  const sec = el('section', 'topics');
  sec.appendChild(el('h2', null, 'By topic'));
  const tl2 = el('div', 'tlist');
  sec.appendChild(tl2);
  TOPICS.forEach(t => {
    const s = topicStats(t.id);
    const row = el('div', 'topic static');
    const head = el('div', 'thead');
    const nm = el('div', 'tname');
    nm.appendChild(el('span', 'tde', t.n));
    nm.appendChild(el('span', 'ten', s.mastered + ' mastered, ' + s.learning + ' in progress, ' + s.fresh + ' unseen'));
    head.appendChild(nm);
    head.appendChild(el('div', 'tnum', Math.round(s.pct * 100) + '%'));
    row.appendChild(head);
    const bar = el('div', 'tbar');
    const part = el('div', 'part'); part.style.width = ((s.mastered + s.learning) / s.total * 100) + '%';
    const fill = el('div', 'fill'); fill.style.width = (s.pct * 100) + '%';
    bar.appendChild(part); bar.appendChild(fill);
    row.appendChild(bar);
    tl2.appendChild(row);
  });
  w.appendChild(sec);

  const tools = el('section', 'tools');
  tools.appendChild(el('h2', null, 'Your data'));
  tools.appendChild(el('p', null, 'Progress lives in this browser only. Export it if you want to move to another machine.'));
  const row = el('div', 'toolrow');
  const exp = el('button', 'btn small', 'Export progress');
  exp.onclick = () => {
    const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'wortstellung-' + today() + '.json';
    a.click(); URL.revokeObjectURL(a.href);
  };
  row.appendChild(exp);
  const imp = el('button', 'btn small', 'Import progress');
  const file = el('input'); file.type = 'file'; file.accept = 'application/json'; file.style.display = 'none';
  file.onchange = () => {
    const f = file.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const p = JSON.parse(r.result);
        if (!p || p.v !== 1 || typeof p.items !== 'object') throw 0;
        S = p; for (const k of Object.keys(S.items)) if (!byId[k]) delete S.items[k];
        save(); render(); toast('Progress imported.');
      } catch (e) { toast('That file is not a Wortstellung export.'); }
    };
    r.readAsText(f);
  };
  imp.onclick = () => file.click();
  row.appendChild(imp); row.appendChild(file);
  const res = el('button', 'btn small danger', 'Reset everything');
  res.onclick = () => {
    if (res.dataset.armed) { S = blank(); save(); toast('Progress cleared.'); render(); return; }
    res.dataset.armed = '1'; res.textContent = 'Tap again to erase';
    setTimeout(() => { delete res.dataset.armed; res.textContent = 'Reset everything'; }, 4000);
  };
  row.appendChild(res);
  tools.appendChild(row);
  w.appendChild(tools);
  document.onkeydown = null;
  return w;
}

/* ══════════ reference ══════════ */
function Reference() {
  const w = el('div', 'ref');
  w.appendChild(el('h1', null, 'Reference'));
  REF.forEach(sec => {
    const s = el('section', 'refsec');
    s.appendChild(el('h2', null, sec.h));
    sec.b.forEach(block => {
      if (block.p) s.appendChild(el('p', null, block.p));
      if (block.f) s.appendChild(Frame(block.f, block.n));
      if (block.l) {
        const ul = el('ul');
        block.l.forEach(li => { const e = el('li'); e.innerHTML = li; ul.appendChild(e); });
        s.appendChild(ul);
      }
    });
    w.appendChild(s);
  });
  document.onkeydown = null;
  return w;
}

/* ══════════ boot ══════════ */
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => go(b.dataset.v));
render();

</script>
</body>
</html>
