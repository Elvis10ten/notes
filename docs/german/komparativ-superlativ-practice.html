<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Komparativ & Superlativ — drill to mastery</title>
<meta name="description" content="Spaced-repetition drills for German comparative and superlative forms (telc B1).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Komparativ & Superlativ — the subject is degree, so the palette is one
     green stepped through six tints: box 0 (pale) to box 5 (deep). The
     stepped bar is the app's only ornament and it carries real information. */
  :root{
    --paper:#F2F5F1; --card:#FFFFFF; --ink:#17262A; --mute:#5D6B70; --line:#D3DBD6; --soft:#E9EEEA;
    --b0:#E1E7E3; --b1:#D4EADB; --b2:#B0D9C0; --b3:#7FC09F; --b4:#48A07E; --b5:#1B6A50;
    --good:#1B6A50; --good-bg:#E3F1EA; --bad:#B2402D; --bad-bg:#F9E8E4;
    --focus:#1B6A50; --radius:10px;
    --serif:"Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans:"Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; }
  .app{ max-width:700px; margin:0 auto; padding:20px 18px 56px; }
  header.top{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 20px; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:22px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand svg{ width:34px; height:34px; flex:none; }
  .brand h1{ font-family:var(--serif); font-weight:500; font-size:1.35rem; line-height:1.1; margin:0; letter-spacing:-.01em; font-variation-settings:"SOFT" 40, "opsz" 36; }
  .brand small{ display:block; font-family:var(--sans); font-size:.8rem; color:var(--mute); font-weight:400; margin-top:3px; }
  .tabs{ display:flex; gap:2px; }
  .tabs button{ font:inherit; font-weight:500; background:none; border:0; color:var(--mute); padding:8px 10px; border-radius:8px; cursor:pointer; }
  .tabs button[aria-selected="true"]{ color:var(--ink); background:var(--soft); }
  h2{ font-family:var(--serif); font-weight:500; font-size:1.5rem; letter-spacing:-.01em; margin:26px 0 8px; font-variation-settings:"SOFT" 40; }
  h3{ font-size:1rem; font-weight:600; margin:26px 0 8px; }
  p{ margin:0 0 10px; }
  .lede{ font-size:1.05rem; color:var(--ink); margin-bottom:14px; max-width:60ch; }
  button{ font:inherit; }
  .primary, .ghost, .danger{ border-radius:var(--radius); padding:10px 18px; font-weight:600; cursor:pointer; border:1.5px solid transparent; }
  .primary{ background:var(--b5); color:#fff; border-color:var(--b5); }
  .primary:disabled{ opacity:.45; cursor:default; }
  .primary.big{ font-size:1.05rem; padding:13px 22px; }
  .ghost{ background:var(--card); color:var(--ink); border-color:var(--line); }
  .danger{ background:var(--card); color:var(--bad); border-color:var(--bad); }
  .chip{ border:1px solid var(--line); background:var(--card); border-radius:999px; padding:4px 12px; margin-left:6px; cursor:pointer; color:var(--mute); }
  .chip.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .kbd{ font-size:.78rem; color:var(--mute); }

  /* stepped mastery bar */
  .boxbar{ display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--b0); margin:6px 0 14px; }
  .boxbar .seg{ display:block; min-width:2px; }
  .b0{ background:var(--b0); } .b1{ background:var(--b1); } .b2{ background:var(--b2); } .b3{ background:var(--b3); } .b4{ background:var(--b4); } .b5{ background:var(--b5); }
  .legend{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.82rem; color:var(--mute); margin-bottom:8px; }
  .legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

  /* home */
  .start{ display:flex; flex-wrap:wrap; align-items:center; gap:14px 22px; margin:8px 0 10px; }
  .size{ color:var(--mute); font-size:.9rem; }
  .topics{ display:flex; flex-direction:column; gap:8px; }
  .trow{ display:flex; align-items:center; gap:16px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; }
  .tinfo{ flex:1; min-width:0; }
  .tinfo .boxbar{ margin:8px 0 0; height:6px; }
  .tname{ font-weight:600; }
  .tcount{ font-weight:400; color:var(--mute); margin-left:8px; font-size:.9rem; }
  .tblurb{ color:var(--mute); font-size:.9rem; }
  .trow .ghost{ flex:none; padding:8px 14px; }
  .weak{ margin-top:16px; }

  /* drill */
  .round{ display:flex; justify-content:space-between; color:var(--mute); font-size:.9rem; margin-bottom:6px; }
  .rail{ display:flex; gap:3px; margin-bottom:16px; }
  .rail i{ flex:1; height:4px; border-radius:2px; background:var(--b0); }
  .rail i.ok{ background:var(--b4); } .rail i.bad{ background:var(--bad); } .rail i.cur{ background:var(--ink); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 22px 20px; }
  .tag{ font-size:.82rem; color:var(--mute); display:flex; flex-wrap:wrap; gap:6px 14px; margin-bottom:14px; }
  .tag span::before{ content:"· "; }
  .tag .note{ color:var(--b5); }
  .wrongline{ color:var(--mute); font-family:var(--serif); font-size:1.1rem; margin-bottom:4px; }
  .wrongline s{ color:var(--bad); text-decoration-thickness:2px; }
  .prompt{ font-family:var(--serif); font-size:1.5rem; line-height:1.55; font-variation-settings:"SOFT" 30, "opsz" 24; margin:0 0 6px; }
  .prompt.en{ font-style:italic; font-size:1.3rem; }
  .gap{ font:inherit; font-size:1em; color:var(--ink); background:var(--soft); border:0; border-bottom:2px solid var(--ink); border-radius:6px 6px 0 0; padding:0 .3em; margin:0 .1em; min-width:6ch; max-width:100%; vertical-align:baseline; }
  .freewrap{ margin:4px 0 8px; }
  .gap.free{ width:100%; font-size:1.25rem; padding:6px 10px; border-radius:8px; }
  .gap:focus{ outline:none; border-bottom-color:var(--b5); background:var(--b1); }
  .given{ display:inline-block; padding:0 .3em; border-bottom:2px solid; border-radius:6px 6px 0 0; }
  .given.ok{ color:var(--good); border-color:var(--good); background:var(--good-bg); }
  .given.bad{ color:var(--bad); border-color:var(--bad); background:var(--bad-bg); text-decoration:line-through; }
  .given-line{ font-size:1.25rem; }
  .hint{ color:var(--mute); font-size:.92rem; margin-bottom:12px; }
  .keys{ display:flex; align-items:center; gap:6px; margin:6px 0 14px; }
  .key{ border:1px solid var(--line); background:var(--card); border-radius:8px; width:38px; height:34px; font-family:var(--serif); font-size:1.05rem; cursor:pointer; }
  .keys .kbd{ margin-left:8px; }
  .actions{ display:flex; align-items:center; gap:14px; margin-top:12px; flex-wrap:wrap; }
  .options{ display:flex; flex-direction:column; gap:8px; margin:12px 0 4px; }
  .opt{ display:flex; align-items:center; gap:12px; text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius); padding:10px 12px; cursor:pointer; font-size:1.02rem; color:var(--ink); }
  .opt b, .tile b{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:6px; background:var(--soft); color:var(--mute); font-size:.78rem; font-weight:600; flex:none; }
  .opt.right{ border-color:var(--good); background:var(--good-bg); }
  .opt.wrong{ border-color:var(--bad); background:var(--bad-bg); }
  .opt:disabled{ cursor:default; opacity:.9; }
  .chosen{ min-height:52px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px; border:1.5px dashed var(--line); border-radius:var(--radius); margin:12px 0 10px; }
  .chosen .ph{ color:var(--mute); font-size:.9rem; }
  .pool{ display:flex; flex-wrap:wrap; gap:8px; }
  .tile{ display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--line); background:var(--card); border-radius:8px; padding:6px 10px 6px 6px; font-family:var(--serif); font-size:1.1rem; cursor:pointer; color:var(--ink); }
  .tile.picked{ background:var(--b1); border-color:var(--b3); padding:6px 10px; }
  .tile:disabled{ cursor:default; }
  .fb{ margin-top:18px; padding:14px 16px; border-radius:var(--radius); border-left:4px solid; }
  .fb.ok{ background:var(--good-bg); border-color:var(--good); }
  .fb.bad{ background:var(--bad-bg); border-color:var(--bad); }
  .verdict{ font-family:var(--serif); font-size:1.1rem; font-weight:500; margin-bottom:6px; }
  .fb.ok .verdict{ color:var(--good); } .fb.bad .verdict{ color:var(--bad); }
  .ans{ font-size:1.05rem; }
  .ans strong{ font-family:var(--serif); font-size:1.15rem; font-weight:600; }
  .ans s{ color:var(--bad); }
  .alt{ color:var(--mute); font-size:.9rem; }
  .gapno{ color:var(--mute); font-size:.85rem; }
  .expl{ margin:8px 0 6px; }
  .sched{ color:var(--mute); font-size:.9rem; }
  .missed{ list-style:none; padding:0; margin:0; }
  .missed li{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 16px; padding:8px 0; border-bottom:1px solid var(--line); }
  .missed .mq{ color:var(--mute); }

  /* progress */
  .grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:14px 0; }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; }
  .stat b{ display:block; font-family:var(--serif); font-size:1.5rem; font-weight:500; }
  .stat span{ color:var(--mute); font-size:.85rem; }
  .forecast{ display:flex; gap:8px; align-items:flex-end; height:100px; }
  .fday{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; font-size:.8rem; color:var(--mute); }
  .fday i{ display:block; width:100%; background:var(--b3); border-radius:4px 4px 0 0; }
  .fday b{ color:var(--ink); }

  /* data */
  .io{ width:100%; font:inherit; font-size:.85rem; border:1px solid var(--line); border-radius:var(--radius); padding:10px; margin-top:14px; resize:vertical; }
  .filebtn{ display:inline-block; }
  .filebtn input{ position:absolute; width:1px; height:1px; opacity:0; }
  .msg{ color:var(--b5); margin-top:8px; }

  /* rules */
  .rules table{ border-collapse:collapse; width:100%; margin:6px 0 14px; font-size:.95rem; }
  .rules th, .rules td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .rules th{ font-weight:600; color:var(--mute); font-size:.85rem; }
  .rules p{ max-width:66ch; }
  .rules table.lex td{ font-family:var(--serif); font-size:1rem; }

  @media (max-width:520px){
    .app{ padding:14px 14px 48px; }
    .prompt{ font-size:1.3rem; }
    .card{ padding:18px 16px; }
    .grid{ grid-template-columns:repeat(2, 1fr); }
    .trow{ flex-direction:column; align-items:stretch; }
    .trow .ghost{ align-self:flex-start; }
  }
  @media (prefers-reduced-motion: no-preference){
    .opt, .tile, .primary, .ghost{ transition: background-color .12s, border-color .12s; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="22" width="8" height="10" rx="2" fill="#B0D9C0"/><rect x="13" y="13" width="8" height="19" rx="2" fill="#48A07E"/><rect x="24" y="3" width="8" height="29" rx="2" fill="#1B6A50"/></svg>
      <h1>Komparativ &amp; Superlativ<small>schnell · schneller · am schnellsten</small></h1>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="drill" aria-selected="true">Drill</button>
      <button role="tab" data-tab="rules" aria-selected="false">Rules</button>
      <button role="tab" data-tab="progress" aria-selected="false">Progress</button>
      <button role="tab" data-tab="data" aria-selected="false">Data</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<script>
/* ============================ bank ==============================
   Every adjective form below was checked against Duden. Items are
   generated from LEX where the answer is a bare form, and written by
   hand where context decides. IDs are stable slugs: changing an id
   would orphan its saved progress.
*/

// [positive, English, Komparativ, Superlativ stem, flags]
// flags: um = umlaut, noum = short a/o/u but NO umlaut (trap), est = -est,
// exc = groß exception, isch = unstressed -isch takes -st, irr = irregular,
// vow = ends in a vowel or -h (früh, neu, schlau): -est is usual, -st also accepted,
// edrop = -el/-uer/-auer drops e, keep = -er/-en keeps e, e = ends in -e,
// vow = stressed vowel ending, -est or -st both fine, core = in the must-know table,
// salt = accepted alternative superlative stem, kalt = accepted alternative comparative,
// dual = Duden allows both the umlaut and the plain form (kept out of the umlaut quiz)
const LEX = [
  ["alt","old","älter","ältest",{um:1,est:1,core:1}],
  ["jung","young","jünger","jüngst",{um:1,core:1}],
  ["groß","big","größer","größt",{um:1,exc:1,core:1}],
  ["klein","small","kleiner","kleinst",{core:1}],
  ["gut","good","besser","best",{irr:1,core:1}],
  ["schlecht","bad","schlechter","schlechtest",{est:1,core:1}],
  ["viel","much / many","mehr","meist",{irr:1,core:1}],
  ["wenig","little / few","weniger","wenigst",{core:1}],
  ["gern","gladly","lieber","liebst",{irr:1,core:1}],
  ["hoch","high","höher","höchst",{um:1,irr:1,core:1}],
  ["nah","near","näher","nächst",{um:1,irr:1,core:1}],
  ["teuer","expensive","teurer","teuerst",{edrop:1,core:1}],
  ["billig","cheap","billiger","billigst",{core:1}],
  ["dunkel","dark","dunkler","dunkelst",{edrop:1,noum:1,core:1}],
  ["kurz","short","kürzer","kürzest",{um:1,est:1,core:1}],
  ["schnell","fast","schneller","schnellst",{core:1}],
  ["langsam","slow","langsamer","langsamst",{noum:1,core:1}],
  ["warm","warm","wärmer","wärmst",{um:1,core:1}],
  ["kalt","cold","kälter","kältest",{um:1,est:1,core:1}],
  ["heiß","hot","heißer","heißest",{est:1,core:1}],
  ["stark","strong","stärker","stärkst",{um:1,core:1}],
  ["schön","beautiful","schöner","schönst",{core:1}],
  ["laut","loud","lauter","lautest",{noum:1,est:1,core:1}],
  ["gesund","healthy","gesünder","gesündest",{um:1,est:1,core:1,dual:1,kalt:"gesunder",salt:"gesundest"}],
  ["klug","clever","klüger","klügst",{um:1,core:1}],
  ["wichtig","important","wichtiger","wichtigst",{core:1}],
  ["interessant","interesting","interessanter","interessantest",{noum:1,est:1,core:1}],
  ["oft","often","öfter","häufigst",{um:1,irr:1,core:1,salt:"öftest"}],
  ["lang","long","länger","längst",{um:1}],
  ["arm","poor","ärmer","ärmst",{um:1}],
  ["hart","hard","härter","härtest",{um:1,est:1}],
  ["krank","ill","kränker","kränkst",{um:1}],
  ["dumm","stupid","dümmer","dümmst",{um:1}],
  ["schwach","weak","schwächer","schwächst",{um:1}],
  ["scharf","spicy / sharp","schärfer","schärfst",{um:1}],
  ["grob","coarse / rough","gröber","gröbst",{um:1}],
  ["schwarz","black","schwärzer","schwärzest",{um:1,est:1}],
  ["klar","clear","klarer","klarst",{noum:1}],
  ["voll","full","voller","vollst",{noum:1}],
  ["rund","round","runder","rundest",{noum:1,est:1}],
  ["bunt","colourful","bunter","buntest",{noum:1,est:1}],
  ["schlank","slim","schlanker","schlankst",{noum:1}],
  ["flach","flat","flacher","flachst",{noum:1}],
  ["froh","glad","froher",null,{noum:1}],
  ["toll","great","toller","tollst",{noum:1}],
  ["stolz","proud","stolzer","stolzest",{noum:1,est:1}],
  ["falsch","wrong","falscher","falschest",{noum:1,est:1}],
  ["zart","tender","zarter","zartest",{noum:1,est:1}],
  ["knapp","tight / scarce","knapper","knappst",{noum:1}],
  ["schlau","smart","schlauer","schlauest",{noum:1,est:1,vow:1,salt:"schlaust"}],
  ["faul","lazy","fauler","faulst",{noum:1}],
  ["sauer","sour","saurer","sauerst",{noum:1,edrop:1}],
  ["stumm","mute / silent","stummer","stummst",{noum:1}],
  ["wach","awake","wacher","wachst",{noum:1}],
  ["blond","blond","blonder","blondest",{noum:1,est:1}],
  ["satt","full (after eating)","satter","sattest",{noum:1,est:1}],
  ["sanft","gentle","sanfter","sanftest",{noum:1,est:1}],
  ["langweilig","boring","langweiliger","langweiligst",{}],
  ["leise","quiet","leiser","leisest",{e:1,est:1}],
  ["müde","tired","müder","müdest",{e:1,est:1}],
  ["böse","angry / evil","böser","bösest",{e:1,est:1}],
  ["nett","nice","netter","nettest",{est:1}],
  ["breit","wide","breiter","breitest",{est:1}],
  ["weit","far","weiter","weitest",{est:1}],
  ["früh","early","früher","frühest",{vow:1,salt:"frühst"}],
  ["spät","late","später","spätest",{est:1}],
  ["leicht","easy / light","leichter","leichtest",{est:1}],
  ["schwer","heavy / difficult","schwerer","schwerst",{}],
  ["neu","new","neuer","neuest",{vow:1,salt:"neust"}],
  ["reich","rich","reicher","reichst",{}],
  ["glücklich","happy","glücklicher","glücklichst",{}],
  ["fleißig","hard-working","fleißiger","fleißigst",{}],
  ["ruhig","calm","ruhiger","ruhigst",{}],
  ["sicher","safe","sicherer","sicherst",{keep:1}],
  ["lecker","tasty","leckerer","leckerst",{keep:1}],
  ["sauber","clean","sauberer","sauberst",{keep:1}],
  ["bitter","bitter","bitterer","bitterst",{keep:1}],
  ["trocken","dry","trockener","trockenst",{keep:1}],
  ["edel","noble","edler","edelst",{edrop:1}],
  ["tief","deep","tiefer","tiefst",{}],
  ["freundlich","friendly","freundlicher","freundlichst",{}],
  ["modern","modern","moderner","modernst",{}],
  ["bekannt","well-known","bekannter","bekanntest",{est:1}],
  ["beliebt","popular","beliebter","beliebtest",{est:1}],
  ["berühmt","famous","berühmter","berühmtest",{est:1}],
  ["süß","sweet","süßer","süßest",{est:1}],
  ["frech","cheeky","frecher","frechst",{}],
  ["weich","soft","weicher","weichst",{}],
  ["frisch","fresh","frischer","frischest",{est:1}],
  ["hübsch","pretty","hübscher","hübschest",{est:1}],
  ["praktisch","practical","praktischer","praktischst",{isch:1}],
  ["typisch","typical","typischer","typischst",{isch:1}],
  ["wild","wild","wilder","wildest",{est:1}],
  ["fest","firm","fester","festest",{est:1}],
  ["hell","bright","heller","hellst",{}],
  ["dick","thick / fat","dicker","dickst",{}],
  ["dünn","thin","dünner","dünnst",{}],
  ["lustig","funny","lustiger","lustigst",{}],
  ["traurig","sad","trauriger","traurigst",{}],
  ["eng","narrow / tight","enger","engst",{}],
  ["gefährlich","dangerous","gefährlicher","gefährlichst",{}],
  ["nervös","nervous","nervöser","nervösest",{est:1}],
  ["einfach","simple","einfacher","einfachst",{}],
  ["schwierig","difficult","schwieriger","schwierigst",{}],
  ["günstig","inexpensive","günstiger","günstigst",{}],
  ["niedrig","low","niedriger","niedrigst",{}],
  ["schmutzig","dirty","schmutziger","schmutzigst",{}],
  ["kaputt","broken","kaputter","kaputtest",{est:1}],
  ["fix","quick","fixer","fixest",{est:1}],
];
const LX = {};
LEX.forEach(e => LX[e[0]] = {p:e[0], en:e[1], k:e[2], s:e[3], f:e[4]});

const TOPICS = {
  "komp":    {name:"Komparativ forms",       blurb:"-er, umlaut, teurer / dunkler, besser / mehr / lieber"},
  "sup":     {name:"Superlativ forms",       blurb:"am -sten, -est after d t s ß z sch x, am größten"},

const BANK = [];

function push(item){
  if(IDS.has(item.id)) throw new Error("duplicate id " + item.id);

// type-in. answers: array of gaps; each gap: [canonical, ...alternates]
function T(topic, id, prompt, answers, expl, x){

}

function M(topic, id, prompt, options, answer, expl, x){

const UM = {ä:"a", ö:"o", ü:"u"};
const deUmlaut = s => s.replace(/[äöü]/g, c => UM[c]);
const addUmlaut = s => s.replace(/[aou]/, c => ({a:"ä",o:"ö",u:"ü"})[c]);

function kompExpl(L){
  const f = L.f;
  if(f.irr) return L.p + " is irregular: " + L.k + ".";
  const parts = [];
  if(f.um) parts.push("short adjective with a/o/u → umlaut");
  if(f.noum) parts.push("keeps its vowel, no umlaut");
  if(f.edrop) parts.push("drops the e of its ending (not " + L.p + "er)");
  if(f.keep) parts.push("keeps its e — only -el and vowel + -er (teuer, sauer) drop it");
  if(f.e) parts.push("already ends in -e, so only -r is added");
  if(!parts.length) return "Regular: " + L.p + " + -er = " + L.k + (L.p === "wenig" ? "." : ". German never says mehr " + L.p + ".");
  return L.p + ": " + parts.join("; ") + " → " + L.k + (f.dual ? " (Duden also allows " + f.kalt + ", but the umlaut form is standard and what the exam expects)" : "") + ".";
}
function supExpl(L){
  const f = L.f, full = "am " + L.s + "en";
  const ending = /sch$/.test(L.p) ? "sch" : L.p.slice(-1);
  if(f.exc) return "groß is the one exception: am größten, not am größesten.";
  if(f.irr) return L.p + " is irregular: " + full + ".";
  if(f.isch) return "Unstressed -isch takes only -st: " + full + " (not " + L.p + "esten).";
  if(f.e) return L.p + " drops its final -e; the stem ends in " + L.s.charAt(L.s.length-4) + ", so -est: " + full + ".";
  if(f.est) return L.p + " ends in " + ending + ", so -est is added: " + full + (f.dual ? " (am " + f.salt + "en is a rarer variant)" : "") + ".";
  if(f.vow) return L.p + " ends in a vowel sound, so -est is usual: " + full + " (am " + f.salt + "en is also accepted).";
  if(f.edrop) return "The e stays in the superlative: " + full + " (only the comparative drops it).";
  if(f.um) return L.p + " takes an umlaut and plain -st: " + full + ".";
  return "Regular: " + L.p + " + -st: " + full + ".";
}

Object.values(LX).forEach(L => {

  if(!L.s || f.irr || f.e || f.vow) return;   // -e and vowel endings make the choice moot or optional
  if(!(f.est || f.exc || f.isch || f.core || f.keep || f.edrop)) return;
  const right = "am " + L.s + "en";
  const wrong = f.est ? "am " + L.s.replace(/est$/, "st") + "en"
              : f.exc ? "am " + L.s.replace(/t$/, "est") + "en"
              : "am " + L.s.replace(/st$/, "est") + "en";
  if(wrong === right) throw new Error("bad est distractor " + L.p);
  M("est", "est." + L.p, "Superlativ of " + L.p + " (" + L.en + ")?", [right, wrong], 0, supExpl(L));

const RULES_HTML = "<h2>The three forms</h2>\n<table>\n<tr><th>Positiv</th><th>Komparativ</th><th>Superlativ</th></tr>\n<tr><td>schnell</td><td>schnell<b>er</b></td><td>am schnell<b>sten</b> · der schnell<b>ste</b></td></tr>\n<tr><td>Tom ist schnell.</td><td>Tom ist schneller <b>als</b> Max.</td><td>Tom ist am schnellsten. · Tom ist der schnellste Spieler.</td></tr>\n</table>\n\n<h2>Komparativ</h2>\n<p>Adjective + <b>-er</b>: klein → kleiner, schön → schöner, interessant → interessanter. German never uses <em>mehr</em> + adjective. ✗ mehr interessant → ✓ interessanter.</p>\n<p><b>Umlaut</b> for most short adjectives with a, o, u: alt → älter, lang → länger, warm → wärmer, kalt → kälter, stark → stärker, arm → ärmer, hart → härter, krank → kränker, nah → näher, groß → größer, hoch → höher, oft → öfter, jung → jünger, kurz → kürzer, klug → klüger, gesund → gesünder (Duden also allows gesunder), dumm → dümmer.</p>\n<p><b>No umlaut</b>: laut, klar, froh, voll, rund, bunt, schlank, flach, langsam, toll, stolz, falsch, dunkel, sauer — and every longer adjective (interessant, langweilig …).</p>\n<p><b>Spelling</b>: -el and vowel + -er drop the e: dunkel → dunkler, edel → edler, teuer → teurer, sauer → saurer. Consonant + -er / -en keep it: sicher → sicherer, lecker → leckerer, trocken → trockener. Adjectives ending in -e add only -r: leise → leiser, müde → müder.</p>\n<table>\n<tr><th>Positiv</th><th>Komparativ</th><th>Superlativ</th></tr>\n<tr><td>gut</td><td>besser</td><td>am besten</td></tr>\n<tr><td>viel</td><td>mehr</td><td>am meisten</td></tr>\n<tr><td>gern</td><td>lieber</td><td>am liebsten</td></tr>\n<tr><td>hoch</td><td>höher</td><td>am höchsten</td></tr>\n<tr><td>nah</td><td>näher</td><td>am nächsten</td></tr>\n<tr><td>groß</td><td>größer</td><td>am größten</td></tr>\n<tr><td>oft</td><td>öfter</td><td>am häufigsten</td></tr>\n</table>\n<p><b>als</b> after a Komparativ, <b>wie</b> after so / genauso / ebenso / doppelt so + Positiv: Berlin ist größer <b>als</b> Hamburg. · Berlin ist nicht so warm <b>wie</b> Rom. · Er ist genauso alt <b>wie</b> ich. Also: anders <b>als</b>.</p>\n<p><b>viel / noch / etwas / ein bisschen</b> + Komparativ: viel größer, noch kälter, etwas langsamer.</p>\n\n<h2>Superlativ</h2>\n<p><b>am + -sten</b> after a verb when no noun follows: Im Juli ist es am wärmsten. · Sie läuft am schnellsten. · Was magst du am meisten?</p>\n<p><b>der / die / das + -ste</b> before a noun or used as a noun: das schnellste Auto · Sie ist die Beste. After <em>sein</em> both work: Er ist am schnellsten = Er ist der Schnellste. Never <em>am</em> before a noun: ✗ die am besten Idee → ✓ die beste Idee.</p>\n<p><b>-est</b> after d, t, s, ß, z, sch, x: am ältesten, am lautesten, am heißesten, am kürzesten, am hübschesten, am interessantesten, am nervösesten. Also after -e adjectives once the e is dropped: leise → am leisesten, müde → am müdesten. Exceptions: groß → am größten; unstressed -isch takes only -st: praktisch → am praktischsten.</p>\n<p><b>Naming the group</b>: die Beste <b>von</b> allen · die größte Stadt <b>in</b> Deutschland · der Jüngste <b>unter</b> uns.</p>\n\n<h2>Before a noun: adjective endings</h2>\n<p>Komparativ and Superlativ take the normal adjective endings after -er / -st.</p>\n<table>\n<tr><th></th><th>der / die / das</th><th>ein / kein / mein</th></tr>\n<tr><td>Nom. m</td><td>der älter<b>e</b> / ältest<b>e</b> Bruder</td><td>ein älter<b>er</b> / mein ältest<b>er</b> Bruder</td></tr>\n<tr><td>Nom. f</td><td>die älter<b>e</b> / ältest<b>e</b> Schwester</td><td>eine älter<b>e</b> / meine ältest<b>e</b> Schwester</td></tr>\n<tr><td>Nom. n</td><td>das älter<b>e</b> / ältest<b>e</b> Kind</td><td>ein älter<b>es</b> / mein ältest<b>es</b> Kind</td></tr>\n<tr><td>Akk. m</td><td>den älter<b>en</b> / ältest<b>en</b> Bruder</td><td>einen älter<b>en</b> / meinen ältest<b>en</b> Bruder</td></tr>\n<tr><td>Akk. f / n</td><td colspan=\"2\">= Nominativ</td></tr>\n<tr><td>Dat. (all)</td><td>dem / der älter<b>en</b> / ältest<b>en</b> …</td><td>einem / einer älter<b>en</b> / meinem ältest<b>en</b> …</td></tr>\n<tr><td>Plural Nom. / Akk.</td><td>die älter<b>en</b> / ältest<b>en</b> Kinder</td><td>meine älter<b>en</b> / ältest<b>en</b> Kinder</td></tr>\n</table>\n<p>Ich suche eine <b>billigere</b> Wohnung. · Wir nehmen den <b>kürzeren</b> Weg. · Ich spiele mit meinem <b>jüngeren</b> Bruder. · Das ist der <b>beste</b> Spieler. · Ich nehme den <b>billigsten</b> Flug. · Sie wohnt im <b>höchsten</b> Haus der Straße.</p>\n<p><b>mehr / weniger</b> before a noun take no ending: mehr Zeit, weniger Geld. Used as a noun, the superlative is capitalised: die Beste, der Jüngste, das Wichtigste.</p>\n\n<h2>Patterns for the exam</h2>\n<p><b>lieber / am liebsten</b>: Ich trinke lieber Tee als Kaffee. · Am liebsten spiele ich Fußball.</p>\n<p><b>immer + Komparativ</b> (more and more): Die Mieten werden immer teurer. · Mein Deutsch wird immer besser.</p>\n<p><b>je … desto / umso</b>: Je mehr ich übe, <b>desto</b> besser wird mein Deutsch. · Je früher du kommst, <b>umso</b> besser. Word order: <em>je</em> + Komparativ … verb at the end | <em>desto</em> + Komparativ + verb + subject.</p>\n\n<h2>Common mistakes</h2>\n<table>\n<tr><th>✗</th><th>✓</th><th>Why</th></tr>\n<tr><td>mehr schnell</td><td>schneller</td><td>no mehr + adjective</td></tr>\n<tr><td>größer wie ich</td><td>größer als ich</td><td>Komparativ + als</td></tr>\n<tr><td>so gut als ich</td><td>so gut wie ich</td><td>so … wie</td></tr>\n<tr><td>guter / am gutesten</td><td>besser / am besten</td><td>irregular</td></tr>\n<tr><td>am größesten</td><td>am größten</td><td>groß is the exception</td></tr>\n<tr><td>die am besten Idee</td><td>die beste Idee</td><td>no am before a noun</td></tr>\n<tr><td>mehre Zeit</td><td>mehr Zeit</td><td>mehr / weniger take no ending</td></tr>\n<tr><td>teuerer</td><td>teurer</td><td>vowel + -er drops the e</td></tr>\n<tr><td>Je mehr ich lerne, desto ich verstehe besser.</td><td>…, desto besser verstehe ich.</td><td>desto + Komparativ + verb</td></tr>\n</table>\n\n<h2>Must-know adjectives</h2>\n<table class=\"lex\">\n<tr><th>Positiv</th><th>Komparativ</th><th>Superlativ</th></tr>\n<tr><td>alt</td><td>älter</td><td>am ältesten</td></tr>\n<tr><td>jung</td><td>jünger</td><td>am jüngsten</td></tr>\n<tr><td>groß</td><td>größer</td><td>am größten</td></tr>\n<tr><td>klein</td><td>kleiner</td><td>am kleinsten</td></tr>\n<tr><td>gut</td><td>besser</td><td>am besten</td></tr>\n<tr><td>schlecht</td><td>schlechter</td><td>am schlechtesten</td></tr>\n<tr><td>viel</td><td>mehr</td><td>am meisten</td></tr>\n<tr><td>wenig</td><td>weniger</td><td>am wenigsten</td></tr>\n<tr><td>gern</td><td>lieber</td><td>am liebsten</td></tr>\n<tr><td>hoch</td><td>höher</td><td>am höchsten</td></tr>\n<tr><td>nah</td><td>näher</td><td>am nächsten</td></tr>\n<tr><td>teuer</td><td>teurer</td><td>am teuersten</td></tr>\n<tr><td>billig</td><td>billiger</td><td>am billigsten</td></tr>\n<tr><td>dunkel</td><td>dunkler</td><td>am dunkelsten</td></tr>\n<tr><td>kurz</td><td>kürzer</td><td>am kürzesten</td></tr>\n<tr><td>schnell</td><td>schneller</td><td>am schnellsten</td></tr>\n<tr><td>langsam</td><td>langsamer</td><td>am langsamsten</td></tr>\n<tr><td>warm</td><td>wärmer</td><td>am wärmsten</td></tr>\n<tr><td>kalt</td><td>kälter</td><td>am kältesten</td></tr>\n<tr><td>heiß</td><td>heißer</td><td>am heißesten</td></tr>\n<tr><td>stark</td><td>stärker</td><td>am stärksten</td></tr>\n<tr><td>schön</td><td>schöner</td><td>am schönsten</td></tr>\n<tr><td>laut</td><td>lauter</td><td>am lautesten</td></tr>\n<tr><td>gesund</td><td>gesünder</td><td>am gesündesten</td></tr>\n<tr><td>klug</td><td>klüger</td><td>am klügsten</td></tr>\n<tr><td>wichtig</td><td>wichtiger</td><td>am wichtigsten</td></tr>\n<tr><td>interessant</td><td>interessanter</td><td>am interessantesten</td></tr>\n<tr><td>oft</td><td>öfter</td><td>am häufigsten</td></tr>\n</table>\n";
/* ============================ storage ============================ */
const KEY = "komparativ.v1";
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
let PERSISTS = true;
try{ localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe"); }
catch(e){ PERSISTS = false; }

/* ============================ model ============================== */
const DAY = 86400000;
// Leitner boxes. 0 = new or lapsed, 5 = mastered. A box is only left when
// the item is due, so five correct answers must be spread over ≥ 11 days.
const IVL = [0, 10*60000, 1*DAY, 3*DAY, 7*DAY, 21*DAY];
const MASTER_BOX = 5;
// A wrong answer drops an item three boxes: 5 → 2, 4 → 1, 3 or below → 0.
// So a slip on a mastered item costs three more spaced successes over ≥ 10 days
// (box 2 → 3 now, → 4 after 3 days, → 5 after 7 more).
const LAPSE_DROP = 3;
let NOW = () => Date.now();
const setNow = f => { NOW = f; };

let S = load();
function blank(){
  return {v:1, items:{}, stats:{answered:0, correct:0, sessions:0, days:{}, lastDay:null, streak:0, best:0}, prefs:{size:20}};
}
function load(){
  try{
    const raw = store.get(KEY);
    if(!raw) return blank();
    const p = JSON.parse(raw);
    if(!p || p.v !== 1) return blank();
    const b = blank();
    p.items = p.items || {};
    p.stats = Object.assign(b.stats, p.stats || {});
    p.stats.days = p.stats.days || {};
    p.prefs = Object.assign(b.prefs, p.prefs || {});
    return p;
  }catch(e){ return blank(); }
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 120);
}
function saveNow(){ clearTimeout(saveTimer); saveTimer = null; store.set(KEY, JSON.stringify(S)); }

function rec(id){
  if(!S.items[id]) S.items[id] = {b:0, due:0, s:0, c:0, w:0, lap:0, seen:0, last:0};
  return S.items[id];
}
const boxOf = id => (S.items[id] ? S.items[id].b : 0);
const seen = id => !!(S.items[id] && S.items[id].seen > 0);
const isMastered = id => boxOf(id) >= MASTER_BOX;
const isDue = id => { const r = S.items[id]; return !r || r.seen === 0 || r.due <= NOW(); };
const dueAt = id => (S.items[id] && S.items[id].seen > 0 ? S.items[id].due : NOW());

function dayKey(t){
  const d = new Date(t);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function touchDay(ok){
  const now = NOW(), today = dayKey(now), yday = dayKey(now - DAY);
  const st = S.stats;
  const d = st.days[today] || (st.days[today] = {a:0, c:0});
  d.a++; if(ok) d.c++;
  if(st.lastDay !== today){
    st.streak = (st.lastDay === yday) ? st.streak + 1 : 1;
    st.lastDay = today;
  }
  if(st.streak > (st.best || 0)) st.best = st.streak;
  // keep the day log bounded
  const keys = Object.keys(st.days).sort();
  while(keys.length > 120) delete st.days[keys.shift()];
}
// grade an answer. promotable = the item was due, so a correct answer moves it up a box
function grade(id, ok, promotable){
  const r = rec(id), now = NOW();
  r.seen++; r.last = now;
  S.stats.answered++;
  if(ok){
    r.c++; r.s++; S.stats.correct++;
    if(promotable){
      if(r.b < MASTER_BOX) r.b++;
      r.due = now + IVL[r.b];
    }
  }else{
    r.w++; r.s = 0;
    if(r.b > 0) r.lap++;
    r.b = Math.max(0, r.b - LAPSE_DROP); r.due = now;
  }
  touchDay(ok);
  save();
  return r;
}

function counts(topics){
  const pool = topics ? BANK.filter(q => topics.includes(q.topic)) : BANK;
  const c = {n:pool.length, mastered:0, seen:0, due:0, fresh:0, boxes:[0,0,0,0,0,0]};
  pool.forEach(q => {
    const b = boxOf(q.id);
    c.boxes[b]++;
    if(b >= MASTER_BOX) c.mastered++;
    if(seen(q.id)){ c.seen++; if(isDue(q.id)) c.due++; } else c.fresh++;
  });
  return c;
}
function weakPool(topics){
  const pool = topics ? BANK.filter(q => topics.includes(q.topic)) : BANK;
  return pool.filter(q => S.items[q.id] && S.items[q.id].w > 0 && !isMastered(q.id))
    .sort((a,b) => {
      const ra = S.items[a.id], rb = S.items[b.id];
      const sa = ra.lap*2 + ra.w/(ra.c+ra.w), sb = rb.lap*2 + rb.w/(rb.c+rb.w);
      return sb - sa;
    });
}
function shuffle(arr, rnd){
  const a = arr.slice(); rnd = rnd || Math.random;
  for(let i = a.length-1; i > 0; i--){ const j = Math.floor(rnd()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function seeded(str){
  let h = 2166136261;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h += 0x6D2B79F5; let t = Math.imul(h ^ (h >>> 15), 1 | h); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const freshOrder = (a,b) => (a.ord - b.ord) || (TOPIC_ORDER.indexOf(a.topic) - TOPIC_ORDER.indexOf(b.topic));

// mode: "srs" (everything due, then new), "topic", "weak"
function buildQueue(mode, topics, n){
  n = n || S.prefs.size || 20;
  const pool = BANK.filter(q => topics.includes(q.topic));
  let q = [];
  if(mode === "weak"){
    weakPool(topics).slice(0, n).forEach(it => q.push({q:it, promotable:isDue(it.id), retry:false}));
    return shuffle(q);
  }
  const due = shuffle(pool.filter(it => seen(it.id) && isDue(it.id)));
  due.slice(0, n).forEach(it => q.push({q:it, promotable:true, retry:false}));
  if(q.length < n){
    const fresh = pool.filter(it => !seen(it.id)).sort(freshOrder);
    fresh.slice(0, n - q.length).forEach(it => q.push({q:it, promotable:true, retry:false}));
  }
  if(q.length === 0){
    // nothing is scheduled: a practice round of the soonest-due items, not promotable
    const early = pool.filter(it => seen(it.id) && !isDue(it.id)).sort((a,b) => dueAt(a.id) - dueAt(b.id));
    early.slice(0, n).forEach(it => q.push({q:it, promotable:false, retry:false}));
  }
  return q;
}

/* ============================ checking =========================== */
const SHORT = {"a:":"ä","o:":"ö","u:":"ü","A:":"Ä","O:":"Ö","U:":"Ü","s:":"ß"};
const expandShortcuts = s => s.replace(/[aouAOUs]:/g, m => SHORT[m] || m);
function norm(s, q){
  let t = String(s == null ? "" : s).normalize("NFC")
    .replace(/[\u2018\u2019\u02BC]/g, "'").replace(/\u00A0/g, " ")
    .replace(/\s+/g, " ").trim();
  if(q && (q.loose || q.type === "build")){
    t = t.replace(/[.,!?;:„“”"'«»]/g, "").replace(/\s+/g, " ").trim();
  }else{
    t = t.replace(/[.!?]+$/, "").trim();
  }
  if(!(q && q.cs)) t = t.toLowerCase();
  return t;
}
function check(q, input){
  if(q.type === "type"){
    const arr = Array.isArray(input) ? input : [input];
    const gaps = q.answers.map((acc, i) => acc.some(a => norm(a, q) === norm(arr[i], q)));
    return {ok: gaps.every(Boolean), gaps, canon: q.answers.map(a => a[0])};
  }
  if(q.type === "mc"){
    return {ok: input === q.answer, canon: [q.options[q.answer]]};
  }
  if(q.type === "build"){
    const s = (Array.isArray(input) ? input.join(" ") : String(input || ""));
    const ok = [q.sentence].concat(q.alts).some(a => norm(a, q) === norm(s, q));
    return {ok, canon: [q.sentence]};
  }
  throw new Error("unknown type " + q.type);
}
function tilesFor(q){
  const tiles = q.sentence.split(" ");
  const rnd = seeded(q.id);
  let sh = shuffle(tiles, rnd);
  // the starting order must not already be an accepted sentence
  for(let i = 0; i < 20 && check(q, sh).ok; i++) sh = shuffle(tiles, rnd);
  if(check(q, sh).ok) sh = sh.slice(1).concat(sh.slice(0, 1));
  return sh;
}
function optionOrder(q){
  const idx = q.options.map((_, i) => i);
  return q.type === "mc" && q.topic === "rule" ? idx : shuffle(idx, seeded(q.id));
}

/* ============================ session ============================ */
let SESSION = null;
function startRound(mode, topics){
  topics = topics || TOPIC_ORDER;
  const queue = buildQueue(mode, topics, S.prefs.size);
  if(!queue.length) return null;
  S.stats.sessions++; save();
  SESSION = {mode, topics, queue, i:0, results:[], answered:null, input:null, finished:false, startedAt:NOW()};
  return SESSION;
}
function current(){ return SESSION && !SESSION.finished ? SESSION.queue[SESSION.i] : null; }
function answerCurrent(input){
  const e = current(); if(!e || SESSION.answered) return null;
  const res = check(e.q, input);
  const before = boxOf(e.q.id);
  const promotable = e.promotable && !e.retry;
  const r = grade(e.q.id, res.ok, promotable);
  const result = {id:e.q.id, ok:res.ok, retry:e.retry, promoted: res.ok && promotable, from:before, to:r.b, due:r.due};
  SESSION.results.push(result);
  if(!res.ok && !e.retry) SESSION.queue.push({q:e.q, promotable:false, retry:true});
  SESSION.answered = Object.assign({res}, result);
  SESSION.input = input;
  return SESSION.answered;
}
function advance(){
  if(!SESSION || !SESSION.answered) return;
  SESSION.answered = null; SESSION.input = null;
  SESSION.i++;
  if(SESSION.i >= SESSION.queue.length) SESSION.finished = true;
}
function endSession(){ SESSION = null; }

function importJSON(text){
  const p = JSON.parse(text);

  S = p; S.prefs = Object.assign(blank().prefs, S.prefs || {}); S.stats = Object.assign(blank().stats, S.stats || {});

/* ============================ validation ========================= */
function validateBank(){
  const issues = [], ids = new Set();
  BANK.forEach(q => {
    const where = q.id;
    if(!q.id) issues.push("missing id");
    if(ids.has(q.id)) issues.push("duplicate id " + where); ids.add(q.id);
    if(!TOPICS[q.topic]) issues.push("unknown topic " + where);
    if(!q.expl) issues.push("no explanation " + where);
    if(q.type === "type"){
      const gaps = (q.prompt.match(/___/g) || []).length;
      if(gaps !== q.answers.length && !(gaps === 0 && q.answers.length === 1)) issues.push("gap count " + where);
      q.answers.forEach(a => { if(!a.length || a.some(s => !s.trim())) issues.push("empty answer " + where); });
    }else if(q.type === "mc"){
      if(!Array.isArray(q.options) || q.options.length < 2) issues.push("options " + where);
      if(new Set(q.options.map(o => o.toLowerCase())).size !== q.options.length) issues.push("duplicate options " + where);
      if(!(q.answer >= 0 && q.answer < q.options.length)) issues.push("answer index " + where);
    }else if(q.type === "build"){
      if(q.sentence.split(" ").length < 3) issues.push("too few tiles " + where);
      const sortKey = s => norm(s, q).split(" ").sort().join(" ");
      q.alts.forEach(a => { if(sortKey(a) !== sortKey(q.sentence)) issues.push("alt uses different words " + where); });
    }else issues.push("type " + where);
  });
  return issues;
}

/* ============================ ui helpers ======================== */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v == null || v === false) continue;
    if(k === "class") el.className = v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if(k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if(c == null || c === false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
}
function fmtDue(t){
  const d = t - NOW();
  if(d <= 0) return "now";
  if(d < 3600000) return Math.max(1, Math.round(d/60000)) + " min";
  if(d < DAY) return Math.round(d/3600000) + " h";
  const days = Math.round(d/DAY);
  return days + (days === 1 ? " day" : " days");
}
function pct(a, b){ return b ? Math.round(100*a/b) : 0; }
function boxBar(c){
  const bar = h("div", {class:"boxbar", role:"img", "aria-label": c.mastered + " of " + c.n + " mastered"});
  for(let b = 5; b >= 0; b--){
    if(!c.boxes[b]) continue;
    bar.append(h("span", {class:"seg b" + b, style:"flex:" + c.boxes[b]}));
  }
  return bar;
}

function promptEl(q, ans){
  const p = h("p", {class:"prompt" + (q.en ? " en" : "")});
  if(q.type === "type"){
    const parts = q.prompt.split("___");
    parts.forEach((txt, i) => {
      p.append(txt);
      if(i < parts.length - 1 && ans){
        const given = (SESSION.input[i] || "").trim();
        p.append(h("span", {class:"given " + (ans.res.gaps[i] ? "ok" : "bad")}, given || "—"));
      }else if(i < parts.length - 1){
        const inp = h("input", {type:"text", class:"gap", autocomplete:"off", autocapitalize:"off", spellcheck:"false", "aria-label":"answer " + (i+1), "data-gap":i,
          oninput: ev => onShortcut(ev.target),
          onkeydown: ev => { if(ev.key === "Enter"){ ev.preventDefault(); ev.stopPropagation(); submitType(); } }});
        const longest = Math.max(...q.answers[i].map(a => a.length));
        inp.style.width = Math.min(26, Math.max(7, longest + 2)) + "ch";
        p.append(inp);
      }
    });
  }else p.append(q.prompt);
  return p;
}
function freeInput(q){
  const inp = h("input", {type:"text", class:"gap free", autocomplete:"off", autocapitalize:"off", spellcheck:"false", "aria-label":"your German sentence", "data-gap":0, placeholder:"Auf Deutsch …",
    oninput: ev => onShortcut(ev.target),
    onkeydown: ev => { if(ev.key === "Enter"){ ev.preventDefault(); ev.stopPropagation(); submitType(); } }});
  return h("div", {class:"freewrap"}, inp);
}
function onShortcut(el){
  const v = el.value, nv = expandShortcuts(v);
  if(nv !== v){ const pos = el.selectionStart; el.value = nv; try{ el.setSelectionRange(pos-1, pos-1); }catch(e){} }
}
function insertChar(ch){
  const el = document.activeElement;
  const inputs = [...view.querySelectorAll("input.gap")];
  const target = inputs.includes(el) ? el : inputs[0];
  if(!target) return;
  const a = target.selectionStart || 0, b = target.selectionEnd || 0;
  target.value = target.value.slice(0, a) + ch + target.value.slice(b);
  target.focus(); try{ target.setSelectionRange(a+1, a+1); }catch(e){}
}
function submitType(){
  const inputs = [...view.querySelectorAll("input.gap")];
  if(!inputs.length || SESSION.answered) return;
  const vals = inputs.map(i => i.value);
  if(vals.every(v => !v.trim())) { inputs[0].focus(); return; }
  answerCurrent(vals); render();
}
let BUILD = null; // {chosen:[indices], tiles:[...]} for the current build item

function renderQuestion(){
  const e = current(), q = e.q;
  const wrap = h("section", {class:"drill"});

  });

  const card = h("article", {class:"card"});
  const b = SESSION.answered ? SESSION.answered.from : boxOf(q.id);

    if(ans) card.append(h("p", {class:"prompt given-line"}, h("span", {class:"given " + (ans.ok ? "ok" : "bad")}, (SESSION.input[0] || "").trim() || "—")));
    else card.append(freeInput(q));
  }
  if(q.hint && !q.wrong) card.append(h("p", {class:"hint"}, q.hint));

  if(q.type === "type" && !ans){
    card.append(h("div", {class:"keys"}, ...["ä","ö","ü","ß"].map(ch => h("button", {class:"key", type:"button", tabindex:"-1", onclick:() => insertChar(ch)}, ch)),

      h("button", {class:"primary", disabled: BUILD.chosen.length !== BUILD.tiles.length, onclick:submitBuild}, "Check"),

  if(ans){

        if(matched && matched !== acc[0]) line.append(" — your ", h("em", null, matched), " is also correct");
        else if(!ans.res.gaps[i] && given[i] && given[i].trim()) line.append(" — you wrote ", h("s", null, given[i].trim()));
        if(acc.length > 1 && (!matched || matched === acc[0])) line.append(h("span", {class:"alt"}, " also: " + acc.slice(1).join(", ")));
        fb.append(line);
      });
    }else if(q.type === "mc"){

    }else{
      fb.append(h("div", {class:"ans"}, h("strong", null, q.sentence)));

    fb.append(h("p", {class:"expl"}, q.expl));

  wrap.append(card);
  view.append(wrap);

  }

  sec.append(ta, h("div", {class:"actions"}, imp), msg);

  const reset = h("button", {class:"danger", onclick:() => {
    if(!UI.resetArmed){ UI.resetArmed = true; reset.textContent = "Tap again to erase everything"; setTimeout(() => { UI.resetArmed = false; if(reset.isConnected) reset.textContent = "Reset all progress"; }, 4000); return; }
    UI.resetArmed = false; resetAll(); render();
  }}, "Reset all progress");
  sec.append(h("h3", null, "Start over"), h("div", {class:"actions"}, reset));

  sec.append(h("h3", null, "How scheduling works"),
    h("p", null, "Every item starts in box 0. A correct answer moves it up one box, but only when it was due: 10 minutes, then 1, 3, 7 and 21 days. So the fastest route to box 5 is five spaced correct answers over eleven days. A wrong answer drops the item three boxes (a mastered item falls to box 2, so it has to be proved three more times over at least ten days) and it reappears at the end of the round. Rounds show due items first, then new ones; when nothing is scheduled you can still practise, but early answers don't move items up."));
  view.append(sec);
}

function renderRules(){
  const sec = h("section", {class:"rules"});
  sec.innerHTML = RULES_HTML;
  view.append(sec);
}

/* ============================ keyboard =========================== */
function onKey(ev){
  if(ev.defaultPrevented || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if(UI.tab !== "drill" || !SESSION || SESSION.finished) return;
  const e = current(); if(!e) return;
  const inInput = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  if(SESSION.answered){
    // the Next button holds focus after an answer; let its native click handle Enter so it can't advance twice
    if(ev.key === "Enter" && !(document.activeElement && document.activeElement.tagName === "BUTTON")){ ev.preventDefault(); advance(); render(); }
    return;
  }
  if(e.q.type === "mc"){
    const n = parseInt(ev.key, 10);
    if(n >= 1 && n <= e.q.options.length){ ev.preventDefault(); const order = optionOrder(e.q); answerCurrent(order[n-1]); render(); }
  }else if(e.q.type === "build" && BUILD){
    const remaining = BUILD.tiles.map((t, i) => i).filter(i => !BUILD.chosen.includes(i));
    const n = parseInt(ev.key, 10);
    if(n >= 1 && n <= remaining.length){ ev.preventDefault(); BUILD.chosen.push(remaining[n-1]); render(); }
    else if(ev.key === "Backspace" && !inInput){ ev.preventDefault(); BUILD.chosen.pop(); render(); }
    else if(ev.key === "Enter"){ ev.preventDefault(); submitBuild(); }
  }else if(e.q.type === "type" && ev.key === "Enter" && !inInput){ ev.preventDefault(); submitType(); }
}

/* ============================ boot ============================== */
function boot(){
  view = document.getElementById("view");
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { UI.tab = b.dataset.tab; render(); }));
  document.addEventListener("keydown", onKey);
  window.addEventListener("beforeunload", saveNow);
  document.addEventListener("visibilitychange", () => { if(document.hidden) saveNow(); });
  render();
}
boot();

window.KS = {
  BANK, TOPICS, TOPIC_ORDER, BY_TOPIC, LEX, IVL, MASTER_BOX, KEY,
  get S(){ return S; }, get SESSION(){ return SESSION; }, get BUILD(){ return BUILD; }, UI,
  setNow, load, save, saveNow, grade, rec, boxOf, seen, isDue, isMastered, dueAt, counts, weakPool,
  buildQueue, startRound, current, answerCurrent, advance, endSession,
  check, norm, expandShortcuts, tilesFor, optionOrder, validateBank,
  exportJSON, importJSON, resetAll, render, submitType, submitBuild,
  reload(){ S = load(); SESSION = null; render(); }
};
