<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wortschatz · German A1 A2 B1 Flashcards</title>
<style>
  :root{
    --paper:#f5efe3; --card:#fffdf6; --ink:#211d17; --ink-soft:#6b6357;
    --line:#d8cfbd; --line-soft:#e7dfd0;
    --der:#2456a6; --die:#b03060; --das:#2e7d4f;
    --accent:#b4451f; --accent-ink:#fff;
    --ok:#2e6b3f; --ok-bg:#e4efe2; --bad:#a8332e; --bad-bg:#f6e3e0;
    --amber:#c98a1b; --gray:#cfc6b4;
    --radius:14px;
    --shadow:0 1px 0 rgba(33,29,23,.06), 0 6px 18px -8px rgba(33,29,23,.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.45;
    min-height:100vh; padding-bottom:40px;
  }
  .serif{font-family:Charter,Georgia,Cambria,"Times New Roman",serif;}

  header.app{
    max-width:680px; margin:0 auto; padding:18px 18px 6px;
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  }
  header.app h1{
    font-family:Charter,Georgia,serif; font-weight:700; letter-spacing:-.01em;
    font-size:26px; margin:0;
  }
  header.app h1 .tilde{color:var(--accent);}
  header.app .sub{font-size:12.5px; color:var(--ink-soft); white-space:nowrap;}

  nav.tabs{
    max-width:680px; margin:4px auto 0; padding:0 18px;
    display:flex; gap:18px; border-bottom:1.5px solid var(--line);
  }
  nav.tabs button{
    appearance:none; background:none; border:none; cursor:pointer;
    font:inherit; font-size:15px; font-weight:600; color:var(--ink-soft);
    padding:10px 2px 9px; margin-bottom:-1.5px; border-bottom:2.5px solid transparent;
  }
  nav.tabs button.on{color:var(--ink); border-bottom-color:var(--accent);}

  main{max-width:680px; margin:0 auto; padding:16px 18px 0;}

  /* ---------- controls ---------- */
  .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    appearance:none; border:1.5px solid var(--line); background:var(--card);
    color:var(--ink-soft); font:inherit; font-size:13.5px; font-weight:600;
    padding:7px 13px; border-radius:999px; cursor:pointer;
  }
  .chip.on{border-color:var(--ink); color:var(--ink); background:#fff;}
  .lbl{font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); margin:14px 0 6px;}
  .lbl:first-child{margin-top:2px;}

  /* ---------- stats ---------- */
  .stats{background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; margin-top:16px;}
  .nums{display:flex; gap:18px; flex-wrap:wrap; margin-bottom:10px;}
  .n b{display:block; font-size:21px; line-height:1.1; font-family:Charter,Georgia,serif;}
  .n span{font-size:12px; color:var(--ink-soft);}
  .n.mast b{color:var(--ok);} .n.learn b{color:var(--amber);} .n.due b{color:var(--accent);}
  .bar{height:8px; border-radius:99px; background:var(--gray); overflow:hidden; display:flex;}
  .bar i{display:block; height:100%;}
  .bar .m{background:var(--ok);} .bar .l{background:var(--amber);}

  .start{
    margin-top:16px; width:100%;
    appearance:none; border:none; cursor:pointer;
    background:var(--accent); color:var(--accent-ink);
    font:inherit; font-size:17px; font-weight:700;
    padding:15px; border-radius:var(--radius); box-shadow:var(--shadow);
  }
  .start:active{transform:translateY(1px);}
  .start[disabled]{background:var(--gray); color:#8a8170; cursor:default;}
  .hint{font-size:13px; color:var(--ink-soft); margin-top:10px; text-align:center;}

  /* ---------- study ---------- */
  .study-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .study-top .back{appearance:none; background:none; border:none; cursor:pointer; font:inherit; color:var(--ink-soft); font-weight:600; padding:6px 8px 6px 0;}
  .study-top .count{font-size:13.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .sbar{height:5px; border-radius:99px; background:var(--gray); overflow:hidden; margin-bottom:18px;}
  .sbar i{display:block; height:100%; background:var(--accent); transition:width .25s;}

  .card3d{perspective:1200px;}
  .fcard{
    position:relative; width:100%; min-height:340px; cursor:pointer;
    transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.7,.3,1);
  }
  .fcard.flip{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--card); border:1px solid var(--line-soft); border-radius:18px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; overflow-y:auto;
    padding:30px 22px 16px; text-align:center;
  }
  .face .ctr{margin:auto; width:100%; display:flex; flex-direction:column; align-items:center;}
  .face.back{transform:rotateY(180deg);}
  .face .tag{position:absolute; top:12px; left:14px; font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--ink-soft);}
  .face .lvltag{position:absolute; top:12px; right:14px; font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--ink-soft); border:1px solid var(--line); border-radius:6px; padding:2px 7px; background:var(--paper);}
  .word{font-family:Charter,Georgia,serif; font-size:36px; line-height:1.15; font-weight:700; letter-spacing:-.01em; overflow-wrap:anywhere;}
  .word .art{font-weight:400;}
  .art.der{color:var(--der);} .art.die{color:var(--die);} .art.das{color:var(--das);}
  .plural{margin-top:8px; font-size:15px; color:var(--ink-soft);}
  .forms{margin-top:6px; font-size:14.5px; color:var(--ink-soft); font-style:italic; max-width:48ch;}
  .trans{font-size:24px; font-weight:600; line-height:1.3; max-width:30ch;}
  .ex{margin-top:18px; padding-top:14px; border-top:1px dashed var(--line); max-width:50ch;}
  .ex .de{font-size:15.5px; font-style:italic;}
  .ex .en{font-size:13.5px; color:var(--ink-soft); margin-top:3px;}
  .taphint{margin-top:16px; font-size:12px; color:var(--ink-soft); opacity:.8;}

  .grade{display:flex; gap:10px; margin-top:16px;}
  .grade button{
    flex:1; appearance:none; cursor:pointer; font:inherit; font-weight:700; font-size:16px;
    padding:15px 8px; border-radius:var(--radius); border:1.5px solid transparent; box-shadow:var(--shadow);
  }
  .grade .no{background:var(--bad-bg); color:var(--bad); border-color:#e3c2bd;}
  .grade .yes{background:var(--ok-bg); color:var(--ok); border-color:#c2d8bf;}
  .grade button small{display:block; font-weight:500; font-size:11.5px; opacity:.75;}
  .reveal{
    width:100%; margin-top:16px; appearance:none; cursor:pointer; font:inherit; font-weight:700; font-size:16px;
    padding:15px 8px; border-radius:var(--radius); border:1.5px solid var(--line); background:var(--card); color:var(--ink); box-shadow:var(--shadow);
  }

  .done{background:var(--card); border:1px solid var(--line-soft); border-radius:18px; box-shadow:var(--shadow); padding:34px 22px; text-align:center;}
  .done h2{font-family:Charter,Georgia,serif; margin:0 0 6px; font-size:26px;}
  .done p{color:var(--ink-soft); margin:4px 0;}
  .done .nums{display:flex; justify-content:center; gap:26px; margin:18px 0 6px;}
  .done .nums b{display:block; font-size:26px; font-family:Charter,Georgia,serif;}
  .done .nums .ok b{color:var(--ok);} .done .nums .bad b{color:var(--bad);}

  /* ---------- browse ---------- */
  .search{
    width:100%; font:inherit; font-size:16px; padding:11px 14px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--card); color:var(--ink); outline:none;
  }
  .search:focus{border-color:var(--ink);}
  .wlist{margin-top:12px; background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
  .wrow{display:flex; gap:10px; align-items:baseline; padding:11px 14px; border-bottom:1px solid var(--line-soft);}
  .wrow:last-child{border-bottom:none;}
  .wrow .dot{width:8px; height:8px; border-radius:99px; background:var(--gray); flex:none; align-self:center;}
  .wrow .dot.l{background:var(--amber);} .wrow .dot.m{background:var(--ok);}
  .wrow .de{font-family:Charter,Georgia,serif; font-weight:700; font-size:16.5px;}
  .wrow .de .art{font-weight:400;}
  .wrow .pl{color:var(--ink-soft); font-size:13px; font-family:Charter,Georgia,serif;}
  .wrow .en{margin-left:auto; text-align:right; color:var(--ink-soft); font-size:14px; max-width:46%;}
  .wrow .lv{flex:none; font-size:10.5px; font-weight:700; color:var(--ink-soft); border:1px solid var(--line); border-radius:5px; padding:1px 5px; align-self:center;}
  .more{width:100%; appearance:none; border:none; background:none; cursor:pointer; font:inherit; font-weight:700; color:var(--accent); padding:13px;}
  .count-line{font-size:13px; color:var(--ink-soft); margin-top:10px;}

  /* ---------- stats tab ---------- */
  .lvlrow{margin-top:13px;}
  .lvlrow:first-of-type{margin-top:2px;}
  .lvlrow .top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;}
  .lvlrow .name{font-weight:700; font-size:14px;}
  .lvlrow .cts{font-size:12px; color:var(--ink-soft);}
  .lvlrow .cts b{color:var(--ok); font-weight:700;} .lvlrow .cts i{font-style:normal; color:var(--amber); font-weight:700;}
  .chart{display:flex; align-items:stretch; gap:4px; height:110px; margin-top:10px;}
  .chart .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:3px; min-width:0;}
  .chart .cv{font-size:9.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; line-height:1;}
  .chart .fill{width:100%; border-radius:4px 4px 0 0; background:var(--accent); min-height:2px;}
  .chart .fill.g{background:var(--ok);} .chart .fill.a{background:var(--amber);}
  .chart .fill.n{background:var(--gray);}
  .chart .cl{font-size:9.5px; color:var(--ink-soft); line-height:1; white-space:nowrap;}
  .hardrow{display:flex; justify-content:space-between; gap:10px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:14.5px;}
  .hardrow:last-child{border-bottom:none;}
  .hardrow .hw{font-family:Charter,Georgia,serif; font-weight:700; white-space:nowrap;}
  .hardrow .hw .art{font-weight:400;}
  .hardrow .he{color:var(--ink-soft); font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hardrow .hm{color:var(--bad); font-weight:700; font-size:13px; white-space:nowrap;}
  .emptyhint{font-size:13.5px; color:var(--ink-soft);}
  .heat{display:flex; gap:3px; margin-top:8px;}
  .hcol{display:flex; flex-direction:column; gap:3px; flex:1;}
  .hc{display:block; width:100%; aspect-ratio:1/1; border-radius:3px; background:#e8dfcb;}
  .hc.h1{background:#b9d3b0;} .hc.h2{background:#7fb277;} .hc.h3{background:#2e6b3f;}
  .hc.hf{background:transparent; border:1px dashed var(--line-soft);}
  .actsum{font-size:12px; color:var(--ink-soft); margin-top:10px; text-align:center;}

  /* ---------- data tab ---------- */
  .panel{background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-top:14px;}
  .panel h3{margin:0 0 8px; font-size:15.5px;}
  .panel p{font-size:13.5px; color:var(--ink-soft); margin:0 0 10px;}
  .panel textarea{
    width:100%; min-height:110px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px;
    border:1.5px solid var(--line); border-radius:10px; padding:10px; background:#fffefb; color:var(--ink); resize:vertical;
  }
  .btn{
    appearance:none; cursor:pointer; font:inherit; font-weight:700; font-size:14px;
    padding:10px 16px; border-radius:11px; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  }
  .btn.warn{color:var(--bad); border-color:#e3c2bd; background:var(--bad-bg);}
  .btn + .btn{margin-left:8px;}
  .msg{font-size:13px; margin-top:8px; min-height:18px;}
  .msg.ok{color:var(--ok);} .msg.err{color:var(--bad);}
  .storage-note{font-size:12.5px; color:var(--ink-soft); margin-top:14px; text-align:center;}
  .footnote{max-width:680px; margin:26px auto 0; padding:0 18px; font-size:12px; color:var(--ink-soft); text-align:center;}

  /* ---------- sentences tab ---------- */
  nav.tabs{gap:14px; overflow-x:auto; scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{white-space:nowrap;}
  .sent-intro{font-size:14px; color:var(--ink-soft); margin:2px 0 12px; line-height:1.5;}
  .sent-meta{font-size:12.5px; color:var(--ink-soft); margin-top:10px;}
  .sent-legend{font-size:12.5px; color:var(--ink-soft); margin-top:22px; line-height:1.5; text-align:center;}
  .scard{
    position:relative; background:var(--card); border:1px solid var(--line-soft); border-radius:18px; box-shadow:var(--shadow);
    padding:44px 22px 20px;
  }
  .scard-top{position:absolute; top:12px; left:14px; right:14px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .scard-top .tag{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--ink-soft);}
  .scard-top .lvltag{font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--ink-soft); border:1px solid var(--line); border-radius:6px; padding:2px 7px; background:var(--paper); white-space:nowrap;}
  .sent-en{font-family:Charter,Georgia,serif; font-size:21px; line-height:1.35; font-weight:600; letter-spacing:-.005em;}
  .sent-de{margin-top:16px; font-size:17.5px; line-height:1.7; color:var(--ink);}
  .gap{
    display:inline-block; border-bottom:2px solid var(--accent); min-height:1.2em; min-width:6ch; line-height:1.2; margin:0 2px;
    text-align:center; vertical-align:baseline; padding:0 4px; color:var(--ink-soft);
  }
  .gap i{font-size:13px; font-style:italic; color:var(--accent);}
  mark.sent-ans{background:var(--ok-bg); color:var(--ok); font-weight:700; border-radius:4px; padding:0 3px;}
  .sent-row{display:flex; gap:8px; margin-top:16px;}
  .sent-in{
    flex:1; min-width:0; font:inherit; font-size:17px; padding:11px 13px; border-radius:12px;
    border:1.5px solid var(--line); background:#fffefb; color:var(--ink); outline:none;
  }
  .sent-in:focus{border-color:var(--ink);}
  .sent-in.shake{animation:shake .35s; border-color:var(--bad);}
  @keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)}}
  .sent-check{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); padding:10px 18px;}
  .sent-check[disabled]{background:var(--gray); border-color:var(--gray); color:#8a8170; cursor:default;}
  .sent-tools{display:flex; align-items:center; gap:12px; margin-top:10px; min-height:20px;}
  .linkbtn{appearance:none; background:none; border:none; cursor:pointer; font:inherit; font-size:13px; font-weight:600; color:var(--accent); padding:2px 0;}
  .sent-hint{font-size:13px; color:var(--ink-soft);}
  .sent-fb{margin-top:18px; border-radius:12px; padding:12px 14px; border:1.5px solid transparent;}
  .sent-fb.good{background:var(--ok-bg); border-color:#c2d8bf; color:var(--ok);}
  .sent-fb.bad{background:var(--bad-bg); border-color:#e3c2bd; color:var(--bad);}
  .sent-fb.syn{background:#f7efdc; border-color:#e6d3a3; color:#7a5a12;}
  .sent-fb.syn .sent-in{border-color:#e6d3a3;}
  .sent-fb .fbh{font-weight:700; font-size:15px;}
  .sent-full{margin-top:6px; font-size:16px; color:var(--ink); line-height:1.5;}
  .sent-full b{font-size:19px; font-family:Charter,Georgia,serif;}
  .sent-typed{margin-top:4px; font-size:13px; color:var(--ink-soft);}
  .retype-lbl{margin-top:10px; font-size:13px; font-weight:600;}
  .sent-fb .sent-in{width:100%; margin-top:6px; border-color:#e3c2bd;}
  .sent-fb .sent-in.good{border-color:#c2d8bf; background:var(--ok-bg); color:var(--ok);}
  .sent-lemma{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); color:var(--ink); font-size:14px; display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline;}
  .sent-lemma .lw{font-family:Charter,Georgia,serif; font-weight:700; font-size:16px;}
  .sent-lemma .lw .art{font-weight:400;}
  .sent-lemma .pl{color:var(--ink-soft); font-weight:400; font-size:13px;}
  .sent-lemma .lf{font-style:italic; color:var(--ink-soft); font-size:13px;}
  .sent-lemma .le{color:var(--ink-soft);}
  .sent-next{margin-top:14px;}
  .build-ans{
    margin-top:16px; min-height:52px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    border:1.5px dashed var(--line); border-radius:12px; padding:8px; background:var(--paper);
  }
  .build-ans.off{border-style:solid; border-color:var(--line-soft);}
  .build-ans .ph{font-size:13px; color:var(--ink-soft); padding:4px 6px;}
  .build-pool{margin-top:12px; display:flex; flex-wrap:wrap; gap:6px;}
  .chip.w{font-size:16px; font-weight:600; color:var(--ink); background:var(--card); padding:8px 12px; border-radius:10px; font-family:Charter,Georgia,serif;}
  @media (prefers-reduced-motion: reduce){ .sent-in.shake{animation:none;} }
</style>
</head>

</nav>
<main id="main"></main>

      const initial = i < 0 || /[.!?:–—-]/.test(de[i]);
      let j = m.index + m[0].length;
      const tail = de.slice(j).match(/^\s*[^\sA-Za-zÀ-ÖØ-öø-ÿ0-9]*/)[0].trim();
      toks.push({ t: m[0], s: m.index, e: j, initial, endClause: /[.!?,;:]/.test(tail) || /^\s*$/.test(de.slice(j)) });
    }
    return toks;
  }
  function capOK(e, tok){
    const up = isUpper(tok.t[0]);
    if (e.noun) return up;
    return !up || tok.initial;
  }

  /* ---------- matching ---------- */
  function lightForms(WORDS, verb, cache){
    if (cache[verb]) return cache[verb];
    let set = new Set([verb]);
    for (const r of WORDS){ if (r[0] === verb && looksVerb(r)){ set = verbForms(r, verb).plain; break; } }
    return (cache[verb] = set);
  }
  function matchPhrase(WORDS, toks, phrase, cache){
    // phrase: array of tokens, "…" = gap marker. Content tokens must appear in order;
    // light verbs (sein, haben, ...) may appear anywhere. Returns content token indices or null.
    const parts = phrase.filter(p => p !== "…");
    let pos = 0, spans = [], start = -1;
    for (const p of parts){
      if (LIGHT.has(p)){
        const forms = lightForms(WORDS, p, cache);
        if (!toks.some(t => forms.has(t.t.toLowerCase()))) return null;
        continue;
      }
      let found = -1;
      for (let ti = pos; ti < toks.length; ti++){ if (toks[ti].t.toLowerCase() === p.toLowerCase()){ found = ti; break; } }
      if (found < 0) return null;
      if (start < 0) start = found;
      if (found - start > 9) return null;
      spans.push(found);
      pos = found + 1;
    }
    return spans.length ? spans : null;
  }
  function findParticle(toks, ti, particle, used){
    if (toks[ti].endClause) return -1;
    for (let j = ti + 1; j < toks.length; j++){
      if (toks[j].t.toLowerCase() === particle && toks[j].endClause && !(used && used.has(j))) return j;
      if (toks[j].endClause) return -1;
    }
    return -1;
  }

  // Builds the bank. sentences: [[de, en], ...]. owners: Map(de -> [wi])
  function build(WORDS, SUPP){
    const { entries, index } = analyze(WORDS);
    const sents = [];
    const byDe = new Map();
    const pushSent = (de, en, owner) => {
      let s = byDe.get(de);
      if (!s){ s = { id: sents.length, de, en, owners: [], toks: tokenize(de) }; sents.push(s); byDe.set(de, s); }
      if (owner != null) s.owners.push(owner);
      if (!s.en && en) s.en = en;
    };
    for (let wi = 0; wi < WORDS.length; wi++){ const r = WORDS[wi]; if (r[6]) pushSent(r[6].trim(), (r[7] || "").trim(), wi); }
    const byLemma = new Map();
    for (let wi = 0; wi < WORDS.length; wi++) byLemma.set(WORDS[wi][0], wi);
    for (const row of (SUPP || [])){
      const de = row[0].trim(), en = (row[1] || "").trim();
      if (row[2] && row[2].length){ for (const t of row[2]){ const wi = byLemma.get(t.replace(/^(der|die|das) /, "")); if (wi != null) pushSent(de, en, wi); else pushSent(de, en, null); } }
      else pushSent(de, en, null);
    }

    const items = entries.map(() => []);
    const cache = {};
    for (const s of sents){
      const toks = s.toks;
      const used = new Set();            // token indices already consumed by an owner/phrase
      const ownerSet = new Set(s.owners);
      const add = (e, spanIdx, extra) => {
        if (spanIdx.some(i => used.has(i))) return;
        spanIdx.forEach(i => used.add(i));
        const spans = spanIdx.map(i => [toks[i].s, toks[i].e]);
        const ans = spanIdx.map(i => toks[i].t).join(" ");
        const it = { sid: s.id, spans, ans, wi: e.wi };
        if (e.noun && spanIdx.length === 1){
          const i = spanIdx[0];
          if (i > 0){
            const prev = toks[i-1];
            if (ARTS.has(prev.t.toLowerCase()) && /^\s*$/.test(s.de.slice(prev.e, toks[i].s))){ it.art = [prev.s, prev.e]; it.artAns = prev.t + " " + toks[i].t; }
          }
        }
        if (extra) Object.assign(it, extra);
        items[e.wi].push(it);
      };
      // 1) owners first: phrases and exact forms (verbs/others before nouns), then stem fallback
      const owners = s.owners.map(wi => entries[wi]).sort((a, b) => (a.noun ? 1 : 0) - (b.noun ? 1 : 0));
      const pending = [];
      for (const e of owners){
        let done = false;
        for (const ph of e.phrases){ const sp = matchPhrase(WORDS, toks, ph, cache); if (sp && !sp.some(i => used.has(i))){ add(e, sp); done = true; break; } }
        if (done) continue;
        for (let ti = 0; ti < toks.length && !done; ti++){
          if (used.has(ti)) continue;
          const tok = toks[ti]; const low = tok.t.toLowerCase();
          const hits = (index.get(low) || []).filter(h => h.e === e && capOK(e, tok));
          for (const h of hits){
            if (h.sep){
              const pj = findParticle(toks, ti, h.sep.particle, used);
              if (pj >= 0){ add(e, [ti, pj]); done = true; break; }
            } else { add(e, [ti]); done = true; break; }
          }
        }
        if (!done) pending.push(e);
      }
      for (const e of pending){
        // stem fallback (own example only): prefix match, else compound containing the stem
        let best = -1, bestLen = 0, mode = 0;
        for (let ti = 0; ti < toks.length; ti++){
          if (used.has(ti) || !capOK(e, toks[ti])) continue;
          const ft = fold(toks[ti].t);
          for (const st of e.stem){
            const fs = fold(st);
            if (fs.length >= 3 && ft.startsWith(fs) && ft.length - fs.length <= 4 && (mode < 1 || fs.length > bestLen)){ best = ti; bestLen = fs.length; mode = 1; }
            else if (mode === 0 && fs.length >= 3 && ft.length >= 6 && ft.indexOf(fs) >= 0 && ft.length > fs.length + 2 && fs.length > bestLen){ best = ti; bestLen = fs.length; }
          }
        }
        if (best >= 0) add(e, [best], { comp: mode === 0 });
      }
      // 2) cross matches — a token is claimed only when exactly one headword can produce it
      for (let ti = 0; ti < toks.length; ti++){
        if (used.has(ti)) continue;
        const tok = toks[ti]; const low = tok.t.toLowerCase();
        const hitsAll = (index.get(low) || []).filter(h => capOK(h.e, tok));
        if (!hitsAll.length) continue;
        const viableSep = [];
        for (const h of hitsAll){
          if (!h.sep) continue;
          const pj = findParticle(toks, ti, h.sep.particle, used);
          if (pj >= 0 && !viableSep.some(v => v.h.e === h.e)) viableSep.push({ h, pj });
        }
        if (viableSep.length === 1){
          const v = viableSep[0];
          if (v.h.e.cross && !ownerSet.has(v.h.e.wi)) add(v.h.e, [ti, v.pj]);
          continue;
        }
        if (viableSep.length > 1) continue;
        const plain = hitsAll.filter(h => !h.sep);
        const distinct = new Set(plain.map(h => h.e.wi));
        if (distinct.size !== 1) continue;
        const e = plain[0].e;
        if (!e.cross || ownerSet.has(e.wi)) continue;
        add(e, [ti]);
      }
    }
    return { sents, items, entries, index };
  }

  /* ---------- grading ---------- */
  function normAns(s){ return s.replace(/[’'`´]/g, "").replace(/[^A-Za-zÄÖÜäöüß\- ]+/g, " ").replace(/\s+/g, " ").trim(); }
  function translit(s){ return s.replace(/ae/g, "ä").replace(/oe/g, "ö").replace(/ue/g, "ü").replace(/Ae/g, "Ä").replace(/Oe/g, "Ö").replace(/Ue/g, "Ü"); }
  // expected: e.g. "Kühlschrank" or "stehe auf" or "den Kühlschrank"; noun: bool; article: string|null (article token if not part of expected)
  function grade(input, expected, opts){
    opts = opts || {};
    const exp = normAns(expected).toLowerCase().split(" ");
    let got = normAns(input);
    if (!got) return { ok: false, why: "empty" };
    let gl = got.toLowerCase().split(" ");
    if (opts.article && gl.length === exp.length + 1 && gl[0] === opts.article.toLowerCase()) gl = gl.slice(1);
    const same = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
    if (same(gl, exp)){
      const notes = [];
      if (opts.noun && got.split(" ").some((w, i) => w.toLowerCase() === exp[exp.length-1] && !isUpper(w[0]))) notes.push("cap");
      return { ok: true, notes };
    }
    const gt = translit(gl.join(" ")).split(" ");
    if (same(gt, exp)) return { ok: true, notes: ["umlaut"] };
    const ss = x => x.replace(/ß/g, "ss");
    if (same(gl.map(ss), exp.map(ss)) && exp.some(x => x.indexOf("ß") >= 0)) return { ok: true, notes: ["sharp-s"] };
    const close = fold(gl.join(" ")) === fold(exp.join(" "));
    return { ok: false, why: close ? "spelling" : "wrong" };
  }

  /* A wrong answer that is a valid form of *another* headword with an overlapping English gloss,
     inflected the same way as the expected answer, is a synonym that the English sentence could not
     rule out (seltsam/merkwürdig, Werbung/Reklame). Returns that entry's word index, else -1. */
  const GLOSS_STOP = new Set("the a an to of in on at for with and or be is are sth sb someone something oneself one ones not from into out off up down have has do".split(" "));
  function glossWords(g){ return new Set(g.toLowerCase().replace(/\(.*?\)/g, " ").split(/[^a-z]+/).filter(w => w.length >= 3 && !GLOSS_STOP.has(w))); }
  function synonymOf(bank, WORDS, typed, targetWi, expected){
    let got = normAns(typed); if (!got) return -1;
    let gl = got.toLowerCase().split(" ");
    const exp = normAns(expected).toLowerCase().split(" ");
    if (gl.length === 2 && exp.length === 1 && ARTS.has(gl[0])) gl = gl.slice(1);      // optional article typed
    if (gl.length !== exp.length) return -1;
    const gt = gl.join(" "), et = exp[exp.length - 1];
    const target = bank.entries[targetWi], tr = WORDS[targetWi];
    const tg = glossWords(tr[4]);
    const suffixOf = (form, e) => { for (const a of lemmaAlts(e.r[0])){ const b = a.text.toLowerCase(); if (form.startsWith(b)) return form.slice(b.length); } return null; };
    const isPl = (form, e) => plurals(lemmaAlts(e.r[0])[0].text, e.r[2]).some(pl => pl.toLowerCase() === form);
    const hits = bank.index.get(gt) || [];
    for (const h of hits){
      const e = h.e; if (e.wi === targetWi || h.sep) continue;
      const r = e.r;
      const g = glossWords(r[4]);
      let overlap = false; for (const w of tg) if (g.has(w)) overlap = true;
      if (!overlap) continue;
      if (e.noun !== target.noun) continue;
      if (e.noun){ if (isPl(gt, e) !== isPl(et, target)) continue; }
      else if (!e.verb && !target.verb){                 // adjectives/adverbs: same declension ending
        const s1 = suffixOf(gt, e), s2 = suffixOf(et, target);
        if (s1 == null || s2 == null || s1 !== s2) continue;
      }
      return e.wi;
    }
    return -1;
  }

  return { build, analyze, tokenize, grade, synonymOf, lemmaAlts, plurals, verbForms, adjForms, looksVerb, fold, umlaut, ARTS };
})();

"use strict";
/* ============ data model ============
   WORDS: array of [w, art, plural, forms, en, level(1|2|3), exDE, exEN]
   progress key: w + "|" + art
   prog record: {b: box 1..5, d: due ms, n: seen, w: wrong}
*/
const DAY = 86400000;
const INTERVALS = {1: DAY, 2: 3*DAY, 3: 7*DAY, 4: 16*DAY, 5: 35*DAY};
const WRONG_DELAY = 10*60*1000;
const LV = {1:"A1", 2:"A2", 3:"B1"};

const keyOf = r => r[0] + "|" + r[1];

/* ============ storage adapter ============ */
function makeStore(KEY){
  let mode = "memory";
  let mem = null;
  async function detect(){
    try{
      if (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function"){
        mode = "claude"; return;
      }
    }catch(e){}
    try{
      localStorage.setItem("__wt","1"); localStorage.removeItem("__wt");
      mode = "local";
    }catch(e){ mode = "memory"; }
  }
  async function load(){
    if (mode === "claude"){
      try{ const r = await window.storage.get(KEY); return r && r.value ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    if (mode === "local"){
      try{ const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }
      catch(e){ return null; }
    }
    return mem;
  }
  async function save(data){
    if (mode === "claude"){
      try{ await window.storage.set(KEY, JSON.stringify(data)); }catch(e){}
      return;
    }
    if (mode === "local"){
      try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
      return;
    }
    mem = data;
  }
  async function wipe(){
    if (mode === "claude"){ try{ await window.storage.delete(KEY); }catch(e){} return; }
    if (mode === "local"){ try{ localStorage.removeItem(KEY); }catch(e){} return; }
    mem = null;
  }
  return { detect, load, save, wipe, modeName: () => mode };
}
const Store = makeStore("telc-vocab-v1");

/* ============ app state ============ */
let S = {
  prog: {},                                   // key -> {b,d,n,w}
  days: {},                                   // 'YYYY-MM-DD' -> {r: reviews, ok: correct}
  set: { lvl: "all", dir: "de", newN: 20 }    // settings
};
let saveTimer = null;
function persist(immediate){
  if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  const doSave = () => Store.save({ v: 1, prog: S.prog, set: S.set, days: S.days || {} });
  if (immediate) doSave();
  else saveTimer = setTimeout(doSave, 1500);
}

/* ============ helpers ============ */
const $ = sel => document.querySelector(sel);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === "class") n.className = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  for (const kid of kids){
    if (kid == null) continue;
    n.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return n;
}
function fold(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ß/g, "ss");
}
function inLevel(r, lvl){ return lvl === "all" || r[5] === lvl; }
function statusOf(r){
  const p = S.prog[keyOf(r)];
  if (!p) return "new";
  return p.b >= 5 ? "mastered" : "learning";
}
function levelStats(lvl){
  let neu = 0, learn = 0, mast = 0, due = 0;
  const now = Date.now();
  for (const r of WORDS){
    if (!inLevel(r, lvl)) continue;
    const p = S.prog[keyOf(r)];
    if (!p) neu++;
    else if (p.b >= 5){ mast++; if (p.d <= now) due++; }
    else { learn++; if (p.d <= now) due++; }
  }
  return { neu, learn, mast, due, total: neu + learn + mast };
}
function artSpan(r, cls){
  if (!r[1]) return null;
  return el("span", {class: (cls||"art") + " art " + r[1]}, r[1] + " ");
}

/* ============ tabs ============ */
let tab = "study";
let session = null;
const tabs = { study: "#tab-study", sent: "#tab-sent", browse: "#tab-browse", stats: "#tab-stats", data: "#tab-data" };
function setTab(t){
  tab = t;
  for (const k in tabs) $(tabs[k]).classList.toggle("on", k === t);
  render();
}

/* ============ study home ============ */
function chipRow(opts, cur, onPick){
  const c = el("div", {class:"chips"});
  for (const o of opts){
    c.appendChild(el("button", {
      class: "chip" + (o.v === cur ? " on" : ""),
      onclick: () => onPick(o.v)
    }, o.t));
  }
  return c;
}

function renderHome(root){
  const st = levelStats(S.set.lvl);

  root.appendChild(el("div", {class:"lbl"}, "Level"));
  root.appendChild(chipRow(
    [{v:"all",t:"All"},{v:1,t:"A1"},{v:2,t:"A2"},{v:3,t:"B1"}],
    S.set.lvl, v => { S.set.lvl = v; persist(); render(); }
  ));

  root.appendChild(el("div", {class:"lbl"}, "Direction"));
  root.appendChild(chipRow(
    [{v:"de",t:"DE → EN"},{v:"en",t:"EN → DE"}],
    S.set.dir, v => { S.set.dir = v; persist(); render(); }
  ));

  root.appendChild(el("div", {class:"lbl"}, "New cards per session"));
  root.appendChild(chipRow(
    [{v:10,t:"10"},{v:20,t:"20"},{v:50,t:"50"},{v:-1,t:"All"}],
    S.set.newN, v => { S.set.newN = v; persist(); render(); }
  ));

  const pct = st.total ? (st.mast / st.total * 100) : 0;
  const pctL = st.total ? (st.learn / st.total * 100) : 0;
  const stats = el("div", {class:"stats"},
    el("div", {class:"nums"},
      el("div", {class:"n due"},   el("b", null, String(st.due)),   el("span", null, "due now")),
      el("div", {class:"n"},       el("b", null, String(st.neu)),   el("span", null, "new")),
      el("div", {class:"n learn"}, el("b", null, String(st.learn)), el("span", null, "learning")),
      el("div", {class:"n mast"},  el("b", null, String(st.mast)),  el("span", null, "mastered"))
    ),
    el("div", {class:"bar"},
      el("i", {class:"m", style:"width:" + pct + "%"}),
      el("i", {class:"l", style:"width:" + pctL + "%"})
    )
  );
  root.appendChild(stats);

  const newAvail = Math.min(st.neu, S.set.newN === -1 ? st.neu : S.set.newN);
  const total = st.due + newAvail;
  const btn = el("button", {class:"start", onclick: startSession},
    total ? "Start session · " + total + " card" + (total === 1 ? "" : "s") : "All caught up");
  if (!total) btn.disabled = true;
  root.appendChild(btn);
  root.appendChild(el("div", {class:"hint"},
    total ? (st.due + " due review" + (st.due===1?"":"s") + " + " + newAvail + " new") :
    "No cards due in " + (S.set.lvl === "all" ? "any level" : LV[S.set.lvl]) + " right now. Come back later or switch level."));
}

/* ============ session ============ */
function startSession(){
  const now = Date.now();
  const due = [], fresh = [];
  for (const r of WORDS){
    if (!inLevel(r, S.set.lvl)) continue;
    const p = S.prog[keyOf(r)];
    if (!p) fresh.push(r);
    else if (p.d <= now) due.push(r);
  }
  due.sort((a,b) => S.prog[keyOf(a)].d - S.prog[keyOf(b)].d);
  const lim = S.set.newN === -1 ? fresh.length : S.set.newN;
  const queue = due.concat(fresh.slice(0, lim));
  if (!queue.length) return;
  session = { queue, i: 0, flipped: false, ok: 0, bad: 0, done: false, total: queue.length };
  render();
}

function grade(correct){
  const r = session.queue[session.i];
  const k = keyOf(r);
  let p = S.prog[k];
  const firstSeen = !p;
  if (!p) p = S.prog[k] = { b: 0, d: 0, n: 0, w: 0 };
  p.n++;
  if (!S.days) S.days = {};
  const dk = dayKey(Date.now());
  const dd = S.days[dk] || (S.days[dk] = { r: 0, ok: 0 });
  dd.r++;
  if (correct) dd.ok++;
  if (firstSeen) dd.nw = (dd.nw || 0) + 1;
  if (correct){
    const wasBelow = p.b < 5;
    p.b = Math.min(p.b + 1, 5);
    if (wasBelow && p.b === 5) dd.m = (dd.m || 0) + 1;
    p.d = Date.now() + INTERVALS[p.b];
    session.ok++;
  } else {
    p.b = 0;
    p.d = Date.now() + WRONG_DELAY;
    p.w++;
    session.bad++;
    const pos = Math.min(session.i + 5, session.queue.length);
    session.queue.splice(pos, 0, r);
    session.total++;
  }
  persist();
  session.i++;
  session.flipped = false;
  if (session.i >= session.queue.length){
    session.done = true;
    persist(true);
  }
  render();
}

function renderCardFaces(r){
  const de = el("div", null,
    el("div", {class:"word"}, artSpan(r), r[0]),
    r[2] ? el("div", {class:"plural"}, "Pl.: " + r[2]) : null,
    r[3] ? el("div", {class:"forms"}, r[3]) : null
  );
  const enSide = el("div", null,
    el("div", {class:"trans"}, r[4]),
    r[6] ? el("div", {class:"ex"},
      el("div", {class:"de"}, r[6]),
      r[7] ? el("div", {class:"en"}, r[7]) : null
    ) : null
  );
  const deBack = el("div", null,
    el("div", {class:"word"}, artSpan(r), r[0]),
    r[2] ? el("div", {class:"plural"}, "Pl.: " + r[2]) : null,
    r[3] ? el("div", {class:"forms"}, r[3]) : null,
    r[6] ? el("div", {class:"ex"},
      el("div", {class:"de"}, r[6]),
      r[7] ? el("div", {class:"en"}, r[7]) : null
    ) : null
  );
  return S.set.dir === "de" ? { front: de, back: enSide, fTag: "German", bTag: "English" }
                            : { front: el("div", null, el("div", {class:"trans"}, r[4])), back: deBack, fTag: "English", bTag: "German" };
}

function renderStudy(root){
  if (!session || session.done && !session.queue.length){ renderHome(root); return; }
  if (session.done){
    root.appendChild(el("div", {class:"done"},
      el("h2", null, "Session finished"),
      el("p", null, session.total + " cards reviewed"),
      el("div", {class:"nums"},
        el("div", {class:"ok"},  el("b", null, String(session.ok)),  "knew it"),
        el("div", {class:"bad"}, el("b", null, String(session.bad)), "missed")
      ),
      el("button", {class:"start", onclick: () => { session = null; startSession(); if (!session) render(); }}, "Next session"),
      el("button", {class:"reveal", onclick: () => { session = null; render(); }}, "Back to overview")
    ));
    return;
  }
  const r = session.queue[session.i];
  const faces = renderCardFaces(r);
  const pct = session.i / session.queue.length * 100;

  root.appendChild(el("div", {class:"study-top"},
    el("button", {class:"back", onclick: () => { session = null; persist(true); render(); }}, "‹ End"),
    el("span", {class:"count"}, (session.i + 1) + " / " + session.queue.length)
  ));
  root.appendChild(el("div", {class:"sbar"}, el("i", {style:"width:" + pct + "%"})));

  const card = el("div", {class:"fcard" + (session.flipped ? " flip" : ""), onclick: toggleFlip},
    el("div", {class:"face front"},

/* ============ stats ============ */
function dayKey(t){
  const d = new Date(t);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function streak(){
  const days = S.days || {};
  let n = 0;
  const t = new Date();
  if (!days[dayKey(t.getTime())]) t.setDate(t.getDate() - 1);
  while (days[dayKey(t.getTime())]){ n++; t.setDate(t.getDate() - 1); }
  return n;
}
function accStat(n, w){ return n ? Math.round((n - w) / n * 100) + "%" : "\u2014"; }
function nextDay(k){
  const parts = k.split("-").map(Number);
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  dt.setDate(dt.getDate() + 1);
  return dayKey(dt.getTime());
}
function longestStreak(){
  const days = S.days || {};
  const ks = Object.keys(days).sort();
  let best = 0, cur = 0, prev = null;
  for (const k of ks){
    cur = (prev && nextDay(prev) === k) ? cur + 1 : 1;
    prev = k;
    if (cur > best) best = cur;
  }
  return best;
}
function heatmap(){
  const wrap = el("div", {class:"heat"});
  const days = S.days || {};
  const today = new Date(); today.setHours(23,59,59,0);

      const v = days[k] ? days[k].r : 0;

  return wrap;
}
function statBlock(val, label, cls){

    el("b", null, String(val)), el("span", null, label));

function chart(cols, fillCls){

}

/* ============ sentence practice · state ============
   Completely separate from the flashcard progress: own storage key, own
   Leitner boxes, own day log. A word enters the pool once Study has it in
   box 5 (or box 3+ if the wider pool is chosen) and a sentence exists for it.
   prog record: {b: box 0..5, d: due ms, n: answers, w: wrong, ok: {itemId: correct count}, last: itemId}
*/
const SStore = makeStore("telc-vocab-sent-v1");
let SS = { prog: {}, days: {}, set: { lvl: "all", mode: "recall", pool: "mast", newN: 10 } };
let ssaveTimer = null;
function spersist(immediate){
  if (ssaveTimer){ clearTimeout(ssaveTimer); ssaveTimer = null; }
  const doSave = () => SStore.save({ v: 1, prog: SS.prog, set: SS.set, days: SS.days || {} });
  if (immediate) doSave(); else ssaveTimer = setTimeout(doSave, 1500);
}
let BANK = null;
function bank(){ if (!BANK) BANK = Sent.build(WORDS, SUPP); return BANK; }
const FLUENT_CTX = 3;
function shash(str){ let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
// id = hash of sentence text + gap offset: stays valid when sentences are added to or removed from the bank
const itemId = it => shash(bank().sents[it.sid].de) + ":" + it.spans[0][0];
function migrateSentIds(){   // records written by the first version used "sentenceIndex:offset"
  let touched = false;
  for (const k in SS.prog){
    const p = SS.prog[k];
    const conv = id => { const m = /^(\d+):(\d+)$/.exec(id); if (!m) return id; const s = bank().sents[+m[1]]; return s ? shash(s.de) + ":" + m[2] : null; };
    if (p.ok && Object.keys(p.ok).some(id => /^\d+:\d+$/.test(id))){
      const ok = {}; for (const id in p.ok){ const nid = conv(id); if (nid) ok[nid] = p.ok[id]; }
      p.ok = ok; touched = true;
    }
    if (p.last && /^\d+:\d+$/.test(p.last)){ p.last = conv(p.last); touched = true; }
  }
  if (touched) spersist(true);
}

function sentEligible(r){
  const p = S.prog[keyOf(r)];
  if (!p) return false;
  return SS.set.pool === "mast" ? p.b >= 5 : p.b >= 3;
}
function distinctOk(p){ return p && p.ok ? Object.keys(p.ok).length : 0; }
function isFluent(wi, p){
  if (!p || p.b < 5) return false;
  const n = bank().items[wi].length;
  return distinctOk(p) >= Math.min(FLUENT_CTX, n);
}
function sentPool(){
  const B = bank();
  const pool = [], noSent = [];
  for (let wi = 0; wi < WORDS.length; wi++){
    const r = WORDS[wi];
    if (!inLevel(r, SS.set.lvl) || !sentEligible(r)) continue;
    if (B.items[wi].length) pool.push(wi); else noSent.push(wi);
  }
  return { pool, noSent };
}
function sentStats(){
  const { pool, noSent } = sentPool();
  const now = Date.now();
  let neu = 0, prac = 0, flu = 0, due = 0;
  for (const wi of pool){
    const p = SS.prog[keyOf(WORDS[wi])];
    if (!p){ neu++; continue; }
    if (p.d <= now) due++;
    if (isFluent(wi, p)) flu++; else prac++;
  }
  let items = 0; for (const wi of pool) items += bank().items[wi].length;
  return { neu, prac, flu, due, total: pool.length, noSent: noSent.length, items, pool };
}

/* ---------- picking exercises ---------- */
function pickItem(wi, excludeId){
  const items = bank().items[wi];
  const p = SS.prog[keyOf(WORDS[wi])];
  let cands = items;
  if (items.length > 1){
    const avoid = new Set([excludeId, p && p.last].filter(Boolean));
    const rest = items.filter(it => !avoid.has(itemId(it)));
    if (rest.length) cands = rest;
  }
  let best = [], bestScore = Infinity;
  for (const it of cands){
    const sc = p && p.ok ? (p.ok[itemId(it)] || 0) : 0;
    if (sc < bestScore){ bestScore = sc; best = [it]; } else if (sc === bestScore) best.push(it);
  }
  return best[Math.floor(Math.random() * best.length)];
}
function buildChunks(s){ return s.de.split(/\s+/).filter(Boolean); }
function buildable(s){ const n = buildChunks(s).length; return n >= 3 && n <= 14; }
function chooseKind(it, idx){
  const mode = SS.set.mode;
  if (mode === "recall") return "recall";
  const ok = buildable(bank().sents[it.sid]);
  if (mode === "build") return ok ? "build" : "recall";
  return ok && idx % 3 === 2 ? "build" : "recall";
}
function stageOf(wi, it){
  const p = SS.prog[keyOf(WORDS[wi])];
  const b = p ? p.b : 0;
  if (b <= 1) return 1;                    // gap + meaning hint
  if (b <= 3 || !it.art) return 2;         // gap, English sentence only
  return 3;                                 // article pulled into the gap
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeEntry(wi, idx, excludeId){
  const it = pickItem(wi, excludeId);
  const kind = chooseKind(it, idx);
  const e = { wi, it, kind, stage: stageOf(wi, it), ctxN: Math.min(bank().items[wi].length, distinctOk(SS.prog[keyOf(WORDS[wi])]) + 1) };
  if (kind === "build"){
    const chunks = buildChunks(bank().sents[it.sid]);
    let pool = shuffle(chunks.slice());
    if (chunks.length > 1 && pool.every((c, i) => c === chunks[i])) pool = chunks.slice(1).concat(chunks[0]);
    e.pool = pool; e.built = [];
  }
  return e;
}

/* ---------- session ---------- */
let ssession = null;
function startSent(){
  const st = sentStats();
  const now = Date.now();
  const due = [], fresh = [];
  for (const wi of st.pool){
    const p = SS.prog[keyOf(WORDS[wi])];
    if (!p) fresh.push(wi); else if (p.d <= now) due.push(wi);
  }
  due.sort((a, b) => SS.prog[keyOf(WORDS[a])].d - SS.prog[keyOf(WORDS[b])].d);
  const lim = SS.set.newN === -1 ? fresh.length : SS.set.newN;
  const wis = due.concat(fresh.slice(0, lim));
  if (!wis.length) return;
  const queue = wis.map((wi, i) => makeEntry(wi, i));
  ssession = { queue, i: 0, phase: "ask", ok: 0, bad: 0, done: false, total: queue.length, hintUsed: false, result: null, retyped: false };
  render();
}
function curEntry(){ return ssession.queue[ssession.i]; }
function expectedFor(e){ return e.stage === 3 && e.it.art ? e.it.artAns : e.it.ans; }

function sentRecord(e, res){
  // outcome: ok (box up) · hinted / synonym (box unchanged, back in 10 min, re-queued) · wrong (box reset, re-queued)
  const outcome = res.ok ? (ssession.hintUsed ? "hinted" : "ok") : (res.why === "synonym" ? "synonym" : "wrong");
  const r = WORDS[e.wi], k = keyOf(r);
  let p = SS.prog[k];
  if (!p) p = SS.prog[k] = { b: 0, d: 0, n: 0, w: 0, ok: {}, last: null };
  if (!p.ok) p.ok = {};
  p.n++;
  const id = itemId(e.it);
  p.last = id;
  if (!SS.days) SS.days = {};
  const dk = dayKey(Date.now());
  const dd = SS.days[dk] || (SS.days[dk] = { r: 0, ok: 0 });
  dd.r++;
  if (outcome === "ok"){
    dd.ok++;
    p.b = Math.min(p.b + 1, 5);
    p.d = Date.now() + INTERVALS[p.b];
    p.ok[id] = (p.ok[id] || 0) + 1;
    ssession.ok++;
  } else if (outcome === "wrong"){
    p.b = 0;
    p.d = Date.now() + WRONG_DELAY;
    p.w++;
    ssession.bad++;
  } else {
    p.d = Date.now() + WRONG_DELAY;                       // hinted / synonym: prove it later without help
  }
  if (outcome !== "ok"){
    const pos = Math.min(ssession.i + 5, ssession.queue.length);
    ssession.queue.splice(pos, 0, makeEntry(e.wi, pos, id));
    ssession.total++;
  }
  spersist();
}
function sentCheck(){
  const e = curEntry();
  if (e.kind === "build"){
    if (e.pool.length) return;
    const target = buildChunks(bank().sents[e.it.sid]);
    const ok = e.built.length === target.length && e.built.every((c, i) => c === target[i]);
    ssession.result = { ok, notes: [] };
  } else {
    const inp = $("#sent-in");
    const val = inp ? inp.value : "";
    if (!val.trim()) return;
    const s = bank().sents[e.it.sid];
    const article = e.stage !== 3 && e.it.art ? s.de.slice(e.it.art[0], e.it.art[1]) : null;
    ssession.result = Sent.grade(val, expectedFor(e), { noun: WORDS[e.wi][1] !== "", article });
    ssession.result.typed = val;
    if (!ssession.result.ok && ssession.result.why === "wrong"){
      const alt = Sent.synonymOf(bank(), WORDS, val, e.wi, expectedFor(e));
      if (alt >= 0){ ssession.result.why = "synonym"; ssession.result.alt = alt; }
    }
  }
  ssession.phase = "fb";
  ssession.retyped = ssession.result.ok || e.kind === "build";   // recall errors must be retyped before Next
  sentRecord(e, ssession.result);
  render();
}
function sentNext(){
  if (!ssession || ssession.phase !== "fb" || !ssession.retyped) return;
  ssession.i++;
  ssession.phase = "ask"; ssession.result = null; ssession.hintUsed = false; ssession.retyped = false;
  if (ssession.i >= ssession.queue.length){ ssession.done = true; spersist(true); }
  render();
}
function sentHint(){
  const e = curEntry();
  ssession.hintUsed = true;
  const exp = expectedFor(e);
  const inp = $("#sent-in");
  if (inp){
    const first = exp.split(" ").map(w => w[0]).join(" ");
    if (!inp.value.trim()) inp.value = exp.split(" ")[0][0];
    inp.focus();
    const h = $("#sent-hint-txt");
    if (h) h.textContent = "Starts with: " + first + (exp.indexOf(" ") > 0 ? "  (" + exp.split(" ").length + " words)" : "");
  }
}

/* ---------- rendering: home ---------- */
function renderSentHome(root){
  const st = sentStats();
  root.appendChild(el("p", {class:"sent-intro"},
    "Words you’ve mastered in Study come back here inside real sentences. You get the English sentence and the German one with a gap — type the missing German word yourself. Progress is tracked separately from the flashcards."));

  root.appendChild(el("div", {class:"lbl"}, "Level"));
  root.appendChild(chipRow([{v:"all",t:"All"},{v:1,t:"A1"},{v:2,t:"A2"},{v:3,t:"B1"}],
    SS.set.lvl, v => { SS.set.lvl = v; spersist(); render(); }));
  root.appendChild(el("div", {class:"lbl"}, "Words"));
  root.appendChild(chipRow([{v:"mast",t:"Mastered only"},{v:"learn",t:"Also box 3+"}],
    SS.set.pool, v => { SS.set.pool = v; spersist(); render(); }));
  root.appendChild(el("div", {class:"lbl"}, "Exercise"));
  root.appendChild(chipRow([{v:"recall",t:"Recall"},{v:"build",t:"Build"},{v:"mixed",t:"Mixed"}],
    SS.set.mode, v => { SS.set.mode = v; spersist(); render(); }));
  root.appendChild(el("div", {class:"lbl"}, "New words per session"));
  root.appendChild(chipRow([{v:5,t:"5"},{v:10,t:"10"},{v:20,t:"20"},{v:-1,t:"All"}],
    SS.set.newN, v => { SS.set.newN = v; spersist(); render(); }));

  const pf = st.total ? st.flu / st.total * 100 : 0, pp = st.total ? st.prac / st.total * 100 : 0;
  root.appendChild(el("div", {class:"stats"},
    el("div", {class:"nums"},
      el("div", {class:"n due"},   el("b", null, String(st.due)),  el("span", null, "due now")),
      el("div", {class:"n"},       el("b", null, String(st.neu)),  el("span", null, "new")),
      el("div", {class:"n learn"}, el("b", null, String(st.prac)), el("span", null, "practising")),
      el("div", {class:"n mast"},  el("b", null, String(st.flu)),  el("span", null, "fluent"))
    ),
    el("div", {class:"bar"}, el("i", {class:"m", style:"width:" + pf + "%"}), el("i", {class:"l", style:"width:" + pp + "%"})),
    el("div", {class:"sent-meta"},
      st.total + " word" + (st.total === 1 ? "" : "s") + " in the pool · " + st.items + " sentence exercise" + (st.items === 1 ? "" : "s") +
      (st.noSent ? " · " + st.noSent + " mastered word" + (st.noSent === 1 ? " has" : "s have") + " no sentence yet" : ""))
  ));

  const newAvail = Math.min(st.neu, SS.set.newN === -1 ? st.neu : SS.set.newN);
  const total = st.due + newAvail;
  const btn = el("button", {class:"start", onclick: startSent},
    total ? "Start session · " + total + " word" + (total === 1 ? "" : "s") : (st.total ? "All caught up" : "Nothing to practise yet"));
  if (!total) btn.disabled = true;
  root.appendChild(btn);
  let hint;
  if (!st.total) hint = SS.set.pool === "mast"
    ? "No mastered words with sentences in this level yet. Master words in Study first, or switch to “Also box 3+”."
    : "No words at box 3 or above in this level yet. Keep going in Study.";
  else if (!total) hint = "Nothing due right now. Come back later or switch level.";
  else hint = st.due + " due review" + (st.due === 1 ? "" : "s") + " + " + newAvail + " new";
  root.appendChild(el("div", {class:"hint"}, hint));
  root.appendChild(el("div", {class:"sent-legend"},
    "A word counts as fluent once it reaches box 5 here and you’ve produced it correctly in at least " + FLUENT_CTX + " different sentences (or every sentence available for it). " +
    "Difficulty rises with the box: first a meaning hint, then only the English sentence, then for nouns the article or determiner too. " +
    "A synonym that also fits the sentence counts neither right nor wrong — the word simply comes back later."));
}

/* ---------- rendering: exercise ---------- */
function renderGapped(e, reveal){
  const s = bank().sents[e.it.sid];
  const de = s.de;
  const spans = e.it.spans.slice();
  if (e.stage === 3 && e.it.art) spans[0] = [e.it.art[0], spans[0][1]];
  spans.sort((a, b) => a[0] - b[0]);
  const wrap = el("div", {class:"sent-de"});
  let pos = 0;
  for (let i = 0; i < spans.length; i++){
    const [a, b] = spans[i];
    if (a > pos) wrap.appendChild(document.createTextNode(de.slice(pos, a)));
    if (reveal) wrap.appendChild(el("mark", {class:"sent-ans"}, de.slice(a, b)));
    else {
      const gap = el("span", {class:"gap"});
      if (i === 0 && e.stage === 1) gap.appendChild(el("i", null, glossOf(WORDS[e.wi])));
      wrap.appendChild(gap);
    }
    pos = b;
  }
  if (pos < de.length) wrap.appendChild(document.createTextNode(de.slice(pos)));
  return wrap;
}
function glossOf(r){ return r[4].split(/;|\s\/\s/)[0].replace(/\(.*?\)/g, "").trim(); }
function lemmaLine(r){
  return el("div", {class:"sent-lemma"},
    el("span", {class:"lw"}, artSpan(r), r[0], r[2] ? el("span", {class:"pl"}, ", " + r[2]) : null),
    r[3] ? el("span", {class:"lf"}, r[3]) : null,
    el("span", {class:"le"}, r[4]));
}

function renderSent(root){
  if (!ssession || (ssession.done && !ssession.queue.length)){ renderSentHome(root); return; }
  if (ssession.done){
    root.appendChild(el("div", {class:"done"},
      el("h2", null, "Session finished"),
      el("p", null, ssession.total + " sentence" + (ssession.total === 1 ? "" : "s")),
      el("div", {class:"nums"},
        el("div", {class:"ok"},  el("b", null, String(ssession.ok)),  "produced"),
        el("div", {class:"bad"}, el("b", null, String(ssession.bad)), "missed")),
      el("button", {class:"start", onclick: () => { ssession = null; startSent(); if (!ssession) render(); }}, "Next session"),
      el("button", {class:"reveal", onclick: () => { ssession = null; render(); }}, "Back to overview")));
    return;
  }
  const e = curEntry();
  const r = WORDS[e.wi];
  const s = bank().sents[e.it.sid];
  const p = SS.prog[keyOf(r)];
  const nItems = bank().items[e.wi].length;
  const pct = ssession.i / ssession.queue.length * 100;

  root.appendChild(el("div", {class:"study-top"},
    el("button", {class:"back", onclick: () => { ssession = null; spersist(true); render(); }}, "‹ End"),
    el("span", {class:"count"}, (ssession.i + 1) + " / " + ssession.queue.length)));
  root.appendChild(el("div", {class:"sbar"}, el("i", {style:"width:" + pct + "%"})));

  const card = el("div", {class:"scard"});
  const kindTxt = e.kind === "build" ? "Build" : (e.stage === 1 ? "Recall · hint" : e.stage === 2 ? "Recall" : "Recall · article");
  card.appendChild(el("div", {class:"scard-top"},
    el("span", {class:"tag"}, kindTxt + " · " + e.ctxN + "/" + nItems),
    el("span", {class:"lvltag"}, LV[r[5]] + " · box " + (p ? p.b : 0))));
  card.appendChild(el("div", {class:"sent-en"}, s.en || "(no translation)"));

  const fb = ssession.phase === "fb";
  if (e.kind === "recall"){
    card.appendChild(renderGapped(e, fb));
    if (!fb){
      const inp = el("input", {id:"sent-in", class:"sent-in", type:"text", lang:"de", placeholder: e.stage === 3 ? "article/determiner + noun" : "German word",
        autocapitalize:"off", autocorrect:"off", autocomplete:"off", spellcheck:"false", enterkeyhint:"go",
        onkeydown: ev => { if (ev.key === "Enter"){ ev.preventDefault(); sentCheck(); } }});
      card.appendChild(el("div", {class:"sent-row"}, inp, el("button", {class:"btn sent-check", onclick: sentCheck}, "Check")));
      card.appendChild(el("div", {class:"sent-tools"},
        el("button", {class:"linkbtn", onclick: sentHint}, "First letter"),
        el("span", {id:"sent-hint-txt", class:"sent-hint"})));
    }
  } else {
    // build mode
    const ans = el("div", {class:"build-ans" + (fb ? " off" : "")});
    if (!e.built.length && !fb) ans.appendChild(el("span", {class:"ph"}, "Tap the words in order"));
    e.built.forEach((c, i) => ans.appendChild(el("button", {class:"chip w", onclick: () => { if (fb) return; e.built.splice(i, 1); e.pool.push(c); render(); }}, c)));
    card.appendChild(ans);
    if (!fb){
      const pool = el("div", {class:"build-pool"});
      e.pool.forEach((c, i) => pool.appendChild(el("button", {class:"chip w", onclick: () => { e.pool.splice(i, 1); e.built.push(c); render(); }}, c)));
      card.appendChild(pool);
      const chk = el("button", {class:"btn sent-check", onclick: sentCheck}, "Check");
      if (e.pool.length) chk.disabled = true;
      card.appendChild(el("div", {class:"sent-row"},
        el("button", {class:"btn", onclick: () => { e.pool = e.pool.concat(e.built); e.built = []; render(); }}, "Clear"), chk));
    }
  }

  if (fb){
    const res = ssession.result;
    const box = el("div", {class:"sent-fb " + (res.ok ? "good" : res.why === "synonym" ? "syn" : "bad")});
    if (res.ok){
      let msg = "Richtig!";
      if (ssession.hintUsed) msg = "Right — but with a hint, so it comes back later.";
      else if (res.notes.includes("cap")) msg = "Right. Remember: nouns are capitalised — " + expectedFor(e);
      else if (res.notes.includes("umlaut")) msg = "Right. Written with umlaut: " + expectedFor(e);
      else if (res.notes.includes("sharp-s")) msg = "Right. Written with ß: " + expectedFor(e);
      box.appendChild(el("div", {class:"fbh"}, msg));
      if (e.kind === "build") box.appendChild(el("div", {class:"sent-full"}, s.de));
    } else {
      const exp = e.kind === "build" ? s.de : expectedFor(e);
      box.appendChild(el("div", {class:"fbh"},
        res.why === "spelling" ? "Almost — check the spelling." :
        res.why === "synonym" ? "“" + res.typed.trim() + "” fits too — this sentence practises:" : "Not quite."));
      box.appendChild(el("div", {class:"sent-full"}, e.kind === "build" ? exp : null, e.kind === "build" ? null : el("b", null, exp)));
      if (res.typed) box.appendChild(el("div", {class:"sent-typed"}, "You wrote: " + res.typed));
      if (e.kind === "recall"){
        const lbl = el("div", {class:"retype-lbl"}, ssession.retyped ? "Correct — go on." : "Type the correct answer once to continue");
        box.appendChild(lbl);
        if (!ssession.retyped){
          // validated live on every keystroke (mobile keyboards don't reliably send Enter); Enter then advances
          const markOk = inp => {
            ssession.retyped = true;
            inp.classList.add("good"); lbl.textContent = "Correct — go on.";
            const nb = $(".sent-next"); if (nb) nb.disabled = false;
          };
          const rt = el("input", {id:"sent-rt", class:"sent-in", type:"text", lang:"de", placeholder: exp,
            autocapitalize:"off", autocorrect:"off", autocomplete:"off", spellcheck:"false", enterkeyhint:"go",
            oninput: ev => { if (!ssession.retyped && Sent.grade(ev.target.value, exp, {}).ok) markOk(ev.target); },
            onkeydown: ev => { if (ev.key !== "Enter") return; ev.preventDefault();
              if (ssession.retyped || Sent.grade(ev.target.value, exp, {}).ok){ if (!ssession.retyped) markOk(ev.target); sentNext(); }
              else { ev.target.classList.add("shake"); setTimeout(() => ev.target.classList.remove("shake"), 400); } }});
          box.appendChild(rt);
        }
      }
    }
    box.appendChild(lemmaLine(r));
    card.appendChild(box);
    const nb = el("button", {class:"start sent-next", onclick: sentNext}, ssession.i + 1 >= ssession.queue.length ? "Finish" : "Next");
    if (!ssession.retyped) nb.disabled = true;
    card.appendChild(nb);
  }
  root.appendChild(card);
  // focus synchronously (we are still inside the tap/click handler, which is what iOS needs to open the keyboard)
  const focusEl = fb ? (ssession.retyped ? $(".sent-next") : $("#sent-rt")) : $("#sent-in");
  if (focusEl) focusEl.focus();
}

/* ---------- stats panel for the Stats tab ---------- */
function sentStatsPanel(){
  let n = 0, w = 0, recs = 0, flu = 0, ctxTotal = 0;
  for (let wi = 0; wi < WORDS.length; wi++){
    const p = SS.prog[keyOf(WORDS[wi])];
    if (!p) continue;
    recs++; n += p.n || 0; w += p.w || 0; ctxTotal += distinctOk(p);
    if (isFluent(wi, p)) flu++;
  }
  const panel = el("div", {class:"panel"}, el("h3", null, "Sentence practice"));
  if (!recs){ panel.appendChild(el("div", {class:"emptyhint"}, "No sentence sessions yet. Master words in Study, then use them in the Sentences tab.")); return panel; }
  panel.appendChild(el("div", {class:"nums", style:"margin-bottom:0"},
    statBlock(recs, "words practised"),
    statBlock(flu, "fluent", "mast"),
    statBlock(ctxTotal, "sentences produced"),
    statBlock(accStat(n, w), "accuracy", "due")));
  return panel;
}

let sbooted = false;
/* ============ render root ============ */
function render(){
  const root = $("#main");
  root.innerHTML = "";
  if (tab === "study") renderStudy(root);
  else if (tab === "sent") renderSent(root);
  else if (tab === "browse") renderBrowse(root);
  else if (tab === "stats") renderStats(root);
  else renderData(root);
}

/* ============ keyboard ============ */
document.addEventListener("keydown", e => {
  if (tab === "sent"){
    if (!ssession || ssession.done || ssession.phase !== "fb") return;
    if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT")) return;
    if (e.key === "Enter"){ e.preventDefault(); sentNext(); }
    return;
  }
  if (tab !== "study" || !session || session.done) return;
  if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT")) return;
  if (e.code === "Space" || e.key === "Enter"){ e.preventDefault(); toggleFlip(); }
  else if (session.flipped && (e.key === "1" || e.key === "ArrowLeft")) grade(false);
  else if (session.flipped && (e.key === "2" || e.key === "ArrowRight")) grade(true);
});

/* ============ boot ============ */
(async function(){
  await Store.detect();
  await SStore.detect();
  const saved = await Store.load();
  const ssaved = await SStore.load();
  if (ssaved && ssaved.prog){ SS.prog = ssaved.prog; if (ssaved.set) SS.set = Object.assign(SS.set, ssaved.set); if (ssaved.days) SS.days = ssaved.days; migrateSentIds(); }
  sbooted = true;
  document.addEventListener("visibilitychange", () => { if (!document.hidden || !sbooted) return; if (saveTimer) persist(true); if (ssaveTimer) spersist(true); });   // flush pending debounced saves only
  if (saved && saved.prog){ S.prog = saved.prog; if (saved.set) S.set = Object.assign(S.set, saved.set); if (saved.days) S.days = saved.days; }
  $("#tab-study").addEventListener("click", () => { setTab("study"); });
  $("#tab-sent").addEventListener("click", () => { setTab("sent"); });
  $("#tab-browse").addEventListener("click", () => { setTab("browse"); });
  $("#tab-stats").addEventListener("click", () => { setTab("stats"); });
  $("#tab-data").addEventListener("click", () => { setTab("data"); });
  $("#foot").textContent = "Vocabulary compiled from the official Goethe/ÖSD/telc certificate word lists (A1 · A2 · B1).";
  render();
})();
