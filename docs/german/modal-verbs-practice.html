<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>German Modal Verbs — Drill to Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#14181c; --desk2:#1c2229; --desk3:#252d36;
  --card:#f1ede4; --card2:#e6e0d3; --ink:#1a1d21; --ink2:#5b6068;
  --signal:#d9a21b; --good:#3e7d58; --bad:#b0453c;
  --line:#c3bbaa; --chrome:#8d97a3;
  --ui:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--desk); color:#dfe4ea; font-family:var(--ui);
  -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.5;
  display:flex; flex-direction:column; min-height:100dvh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ---------- top bar ---------- */
.bar{
  display:flex;align-items:center;gap:18px;padding:12px 20px;
  border-bottom:1px solid #262e37;background:var(--desk);
  position:sticky;top:0;z-index:20;flex-wrap:wrap;
}
.brand{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--signal);white-space:nowrap}
.brand span{color:var(--chrome)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--chrome);padding:6px 11px;border-radius:var(--r)}
.tab[aria-selected="true"]{color:var(--desk);background:var(--signal);font-weight:600}
.tab:hover:not([aria-selected="true"]){color:#dfe4ea;background:var(--desk2)}

/* ---------- mastery meter ---------- */
.meter{display:flex;height:3px;background:#242c35}
.meter i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.meterlab{display:flex;justify-content:space-between;align-items:baseline;
  padding:8px 20px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--chrome)}
.meterlab b{color:#dfe4ea;font-weight:600}

/* ---------- layout ---------- */
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:22px 20px 64px;display:flex;flex-direction:column}
#view-drill{flex:1;display:flex;flex-direction:column;justify-content:center}
#view-drill.hide{display:none}
.hide{display:none !important}

/* ---------- the card ---------- */
.card{
  background:var(--card);color:var(--ink);border-radius:var(--r);
  padding:26px 26px 22px;box-shadow:0 1px 0 #fff6 inset,0 18px 40px -22px #000c,0 2px 0 #0006;
  background-image:radial-gradient(#00000006 1px,transparent 1px);background-size:3px 3px;
  animation:rise .28s cubic-bezier(.2,.7,.3,1);
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.meter i{transition:none}}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:#8a8578;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:20px}
.chead .tagname{color:var(--ink);font-weight:600}
.q{font-family:var(--serif);font-size:23px;line-height:1.45;letter-spacing:-.005em}
.blank{display:inline-block;width:4.2ch;border-bottom:2px solid #a9a294;margin:0 .16em;vertical-align:0}
.hintline{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:10px;letter-spacing:.04em}
.lead{font-family:var(--serif);font-size:19px;color:var(--ink2);margin-bottom:6px}

/* ---------- SIGNATURE: the ruled answer line ---------- */
.rule{position:relative;margin:18px 0 6px;min-height:48px;display:flex;align-items:flex-end}
.rule::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line)}
.rule.ok::after{background:var(--good)}
.rule.no::after{background:var(--bad)}
input.ans{
  width:100%;background:transparent;border:none;font-family:var(--serif);
  font-size:26px;color:var(--ink);padding:2px 2px 8px;outline:none;
}
input.ans::placeholder{color:#a9a294}
.rule.ok input.ans{color:var(--good)}
.rule.no input.ans{color:var(--bad)}

/* ---------- keys / actions ---------- */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}
.umlaut{display:flex;gap:5px}
.umlaut button{font-family:var(--serif);font-size:16px;width:34px;height:32px;
  border:1px solid var(--line);border-radius:var(--r);color:var(--ink2);background:#0000000a}
.umlaut button:hover{background:var(--ink);color:var(--card);border-color:var(--ink)}
.spacer{flex:1}
.btn{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:600;padding:10px 18px;border-radius:var(--r);background:var(--ink);color:var(--card)}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{background:#0000000d;color:var(--ink)}
.btn.mini{padding:7px 12px;font-size:10.5px}

/* ---------- MCQ ---------- */
.opts{margin-top:20px;border-top:1px solid var(--line)}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  padding:13px 6px;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:17.5px;line-height:1.4}
.opt:hover{background:#0000000a}
.opt .k{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink2);
  border:1px solid var(--line);border-radius:var(--r);padding:2px 6px;margin-top:3px;flex:none}
.opt.pick{background:#0000000f}
.opt.ok{background:#3e7d5820}.opt.ok .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.no{background:#b0453c1a}.opt.no .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}

/* ---------- token builder ---------- */
.built{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;padding-bottom:8px;width:100%;min-height:42px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chip{font-family:var(--serif);font-size:17px;padding:6px 11px;border:1px solid var(--line);
  border-radius:var(--r);background:#fffffc;box-shadow:0 1px 0 #0000000f}
.chip:hover{border-color:var(--ink);background:#fff}
.chip .n{font-family:var(--mono);font-size:9px;color:var(--ink2);margin-right:6px;vertical-align:1px}
.built .chip .n{display:none}
.chip.used{opacity:.22;pointer-events:none}
.built .chip{background:var(--ink);color:var(--card);border-color:var(--ink)}
.poolhint{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink2);margin-top:18px}

/* ---------- verdict ---------- */
.verdict{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.vtag{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.vtag.ok{color:var(--good)}.vtag.no{color:var(--bad)}
.model{font-family:var(--serif);font-size:20px;margin:8px 0 10px;color:var(--ink)}
.why{font-size:14.5px;line-height:1.6;color:#4a4f56}
.why b{color:var(--ink)}

/* ---------- panels (tables / stats) ---------- */
.panel{background:var(--desk2);border:1px solid #2b333d;border-radius:var(--r);padding:20px;margin-bottom:16px}
.ptitle{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--signal);margin-bottom:4px;font-weight:600}
.psub{font-size:13.5px;color:var(--chrome);margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #2b333d;white-space:nowrap}
th{color:var(--signal);font-weight:600;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase}
td.p{color:var(--chrome)}
.scroll{overflow-x:auto;margin:0 -4px}
.note{font-size:13.5px;line-height:1.65;color:#b8c0ca;margin-top:14px}
.note b{color:#fff}
.note code{font-family:var(--mono);font-size:12.5px;color:var(--signal)}

/* ---------- stats ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:#2b333d;
  border:1px solid #2b333d;border-radius:var(--r);overflow:hidden}
.stat{background:var(--desk2);padding:14px 16px}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;color:#fff;line-height:1.1}
.stat span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--chrome)}
.trow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #262e37}
.trow:last-child{border:none}
.tname{width:104px;flex:none;font-family:var(--mono);font-size:11.5px;color:#dfe4ea}
.tbar{flex:1;height:6px;background:#2b333d;border-radius:99px;overflow:hidden;display:flex}
.tbar i{display:block;height:100%}
.tnum{font-family:var(--mono);font-size:11px;color:var(--chrome);width:70px;text-align:right;flex:none}

/* ---------- mode chooser ---------- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:18px}
.mode{background:var(--desk2);border:1px solid #2b333d;border-radius:var(--r);padding:14px 15px;text-align:left}
.mode:hover{border-color:var(--signal);background:var(--desk3)}
.mode b{display:block;font-size:14.5px;font-weight:600;margin-bottom:3px}
.mode span{font-size:12.5px;color:var(--chrome);line-height:1.45}
.mode.on{border-color:var(--signal);background:var(--desk3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{font-family:var(--mono);font-size:11px;padding:6px 10px;border:1px solid #2b333d;
  border-radius:var(--r);color:var(--chrome)}
.tchip:hover{border-color:var(--signal);color:#fff}
.tchip.on{background:var(--signal);color:var(--desk);border-color:var(--signal);font-weight:600}
.tchip em{font-style:normal;opacity:.65}

.legend{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--chrome);display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.warn{background:#3a2d16;border:1px solid #5a4520;color:#f0d99a;font-size:13px;
  padding:11px 14px;border-radius:var(--r);margin-bottom:16px;line-height:1.5}
.done{text-align:center;padding:40px 10px}
.done h2{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--signal);margin-bottom:14px}
.done p{font-family:var(--serif);font-size:22px;color:#fff;margin-bottom:8px}
.done small{color:var(--chrome);font-size:13.5px;display:block;margin-bottom:22px;line-height:1.6}
.foot{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:#5c6672;text-align:center;padding:8px 20px 26px}

@media(max-width:560px){
  main{padding:16px 12px 48px}
  #view-drill{display:block}
  .brand span{display:none}
  .meterlab span:last-child{display:none}
  .chead{font-size:9.5px;letter-spacing:.09em}
  .card{padding:20px 18px 18px}
  .q{font-size:20px}
  input.ans{font-size:22px}
  .tname{width:82px}
  .bar{padding:10px 12px;gap:10px}
  .meterlab{padding:8px 12px 0}
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">Modal verbs <span>· German B1</span></div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-drill"  aria-selected="true"  onclick="go('drill')">Practice</button>
    <button class="tab" role="tab" id="tab-tables" aria-selected="false" onclick="go('tables')">Tables</button>
    <button class="tab" role="tab" id="tab-stats"  aria-selected="false" onclick="go('stats')">Progress</button>
  </nav>
</header>
<div class="meter" id="meter"></div>
<div class="meterlab" id="meterlab"></div>
<main>
  <section id="view-drill"></section>
  <section id="view-tables" class="hide"></section>
  <section id="view-stats" class="hide"></section>
</main>
<div class="foot" id="foot"></div>
<script>
/* ============================================================
   MODALVERBEN — question bank
   Part 1: master tables, generated conjugation drills, meaning
   ============================================================ */

const PERSONS = ['ich', 'du', 'er/sie/es', 'wir', 'ihr', 'sie/Sie'];

const VERBS = {
  duerfen:  { inf: 'dürfen', gloss: 'to be allowed to',
    pres: ['darf', 'darfst', 'darf', 'dürfen', 'dürft', 'dürfen'],
    prat: ['durfte', 'durftest', 'durfte', 'durften', 'durftet', 'durften'],
    pp: 'gedurft' },
  koennen:  { inf: 'können', gloss: 'to be able to',
    pres: ['kann', 'kannst', 'kann', 'können', 'könnt', 'können'],
    prat: ['konnte', 'konntest', 'konnte', 'konnten', 'konntet', 'konnten'],
    pp: 'gekonnt' },
  moegen:   { inf: 'mögen', gloss: 'to like',
    pres: ['mag', 'magst', 'mag', 'mögen', 'mögt', 'mögen'],
    prat: ['mochte', 'mochtest', 'mochte', 'mochten', 'mochtet', 'mochten'],
    pp: 'gemocht' },
  muessen:  { inf: 'müssen', gloss: 'to have to',
    pres: ['muss', 'musst', 'muss', 'müssen', 'müsst', 'müssen'],
    prat: ['musste', 'musstest', 'musste', 'mussten', 'musstet', 'mussten'],
    pp: 'gemusst' },
  sollen:   { inf: 'sollen', gloss: 'to be supposed to',
    pres: ['soll', 'sollst', 'soll', 'sollen', 'sollt', 'sollen'],
    prat: ['sollte', 'solltest', 'sollte', 'sollten', 'solltet', 'sollten'],
    pp: 'gesollt' },
  wollen:   { inf: 'wollen', gloss: 'to want to',
    pres: ['will', 'willst', 'will', 'wollen', 'wollt', 'wollen'],
    prat: ['wollte', 'wolltest', 'wollte', 'wollten', 'wolltet', 'wollten'],
    pp: 'gewollt' },
  moechten: { inf: 'möchten', gloss: 'would like',
    pres: ['möchte', 'möchtest', 'möchte', 'möchten', 'möchtet', 'möchten'],
    prat: null, pp: null }
};

const VERB_ORDER = ['duerfen', 'koennen', 'moegen', 'muessen', 'sollen', 'wollen', 'moechten'];

/* ---------- generated: present tense (7 verbs x 6 persons = 42) ---------- */
function genPresent() {
  const out = [];
  VERB_ORDER.forEach(key => {
    const v = VERBS[key];
    PERSONS.forEach((p, i) => {
      out.push({
        id: `pres-${key}-${i}`,
        topic: 'forms-pres',
        type: 'cloze',
        q: `${p} ___`,
        tag: v.inf,
        a: [v.pres[i]],
        why: presWhy(key, i, v)
      });
    });
  });
  return out;
}

function presWhy(key, i, v) {
  const base = `${PERSONS[i]} ${v.pres[i]} — full present: ` +
    PERSONS.map((p, j) => `${p} ${v.pres[j]}`).join(' · ');
  let note = '';
  if (i === 0 || i === 2) {
    note = key === 'moechten'
      ? ' möchten is the odd one out: ich/er-sie-es end in -e, like a normal Konjunktiv II.'
      : ' ich and er/sie/es take NO ending — that bare stem is the signature of a modal verb.';
  } else if (i === 3 || i === 5) {
    note = ' wir and sie/Sie are always identical to the infinitive.';
  } else if (i === 4) {
    note = key === 'moechten'
      ? ' möchten runs on Konjunktiv II endings attached to the stem möcht-: -e, -est, -e, -en, -et, -en. ihr möchtet is the only form ending in -t.'
      : ' ihr keeps the plural stem and adds -t.';
  } else if (i === 1) {
    note = key === 'moechten'
      ? ' du möchtest — the stem möcht- plus the Konjunktiv II ending -est.'
      : key === 'muessen'
        ? ' du takes -st, but the stem already ends in -ss, so the ending drops its own s: muss + st → musst.'
        : ' du keeps the singular stem and adds -st.';
  }
  return base + '.' + note;
}

/* ---------- generated: Präteritum (6 verbs x 6 persons = 36) ---------- */
function genPrat() {
  const out = [];
  VERB_ORDER.filter(k => VERBS[k].prat).forEach(key => {
    const v = VERBS[key];
    PERSONS.forEach((p, i) => {
      out.push({
        id: `prat-${key}-${i}`,
        topic: 'forms-prat',
        type: 'cloze',
        q: `${p} ___`,
        tag: `${v.inf} · Präteritum`,
        a: [v.prat[i]],
        why: `${PERSONS[i]} ${v.prat[i]} — full Präteritum: ` +
          PERSONS.map((p2, j) => `${p2} ${v.prat[j]}`).join(' · ') +
          (key === 'sollen' || key === 'wollen'
            ? `. ${v.inf} never had an umlaut to lose — it is simply weak: ${v.prat[0].replace(/te$/, '')}- plus the ending`
            : key === 'moegen'
              ? '. The stem loses the umlaut and swaps g → ch: mögen → moch-'
              : `. The stem loses the umlaut: ${v.inf} → ${v.prat[0].replace(/te$/, '')}-`) +
          '. The endings are the regular weak set: -te, -test, -te, -ten, -tet, -ten.'
      });
    });
  });
  return out;
}

/* ---------- generated: Partizip II (6) ---------- */
function genPP() {
  return VERB_ORDER.filter(k => VERBS[k].pp).map(key => {
    const v = VERBS[key];
    return {
      id: `pp-${key}`,
      topic: 'perfekt',
      type: 'cloze',
      q: `Partizip II of <b>${v.inf}</b>: ___`,
      tag: 'Partizip II',
      a: [v.pp],
      why: `${v.pp}. You only need a real participle when the modal has NO second verb: „Das habe ich nicht ${VERBS.wollen.pp}.“ With a second verb you get the double infinitive instead (habe … ${v.inf}).` +
        (key === 'sollen' || key === 'duerfen' ? ` In practice ${v.pp} is rare — know it, but do not expect to use it often.` : '')
    };
  });
}

/* ---------- meaning: which modal fits? ---------- */
const MEANING = [
  ['Hier ___ man nicht rauchen — das ist verboten.', 'darf', 'Prohibition = nicht dürfen. „Man darf nicht“ is the standard way to say something is forbidden.'],
  ['Ich ___ schwimmen; ich habe es als Kind gelernt.', 'kann', 'können = ability you have acquired.'],
  ['Ich ___ keinen Kaffee — ich trinke seit Jahren nur Tee.', 'mag', 'A standing preference → mögen, with a direct object and no second verb. „Ich möchte keinen Kaffee“ would mean you are turning one down right now.'],
  ['Ich ___ morgen arbeiten, auch wenn ich keine Lust habe.', 'muss', 'müssen = necessity/compulsion, no way around it.'],
  ['Der Arzt hat es mir geraten: Ich ___ mehr Sport machen.', 'soll', 'Advice passed on from someone else → sollen. müssen would claim it is unavoidable, which advice never is.'],
  ['Ich ___ dieses Jahr die B1-Prüfung machen. Das ist mein Ziel.', 'will', 'wollen = your own will and intention. It is not rude here; „mein Ziel“ makes the intention explicit.', ['möchte'], 'möchte is correct too and sounds softer. With „Das ist mein Ziel“, wollen states the commitment more plainly.'],
  ['___ Sie einen Kaffee oder einen Tee? (polite, in a café)', 'Möchten', 'möchten = the polite „would like“. „Wollen Sie…?“ would sound blunt in a café.'],
  ['Kinder unter 16 ___ diesen Film nicht sehen.', 'dürfen', 'An age limit is permission withheld → nicht dürfen.'],
  ['Meine Mutter sagt, ich ___ dich anrufen.', 'soll', 'Reported instruction from another person → sollen.'],
  ['Wir ___ heute nicht kommen — wir haben leider keine Zeit.', 'können', 'No time = no possibility → können.'],
  ['___ ich das Fenster aufmachen? (you are asking permission)', 'Darf', 'Asking for permission → dürfen. In casual speech „Kann ich…?“ is heard just as often, but dürfen is the verb that actually means „be allowed to“.'],
  ['Er ___ klassische Musik sehr.', 'mag', 'mögen + direct object, no infinitive.'],
  ['Sie ___ Ärztin werden; sie studiert schon Medizin.', 'will', 'Her own plan and intention → wollen.', ['möchte'], 'möchte is also right and a shade softer. Since she is already studying medicine, wollen matches the settled decision.'],
  ['In der Bibliothek ___ man leise sein — sonst wird man rausgeworfen.', 'muss', 'A rule with a real consequence → müssen. Without the consequence, „soll“ would fit just as well.'],
  ['___ Sie mir bitte helfen?', 'Können', 'Standard polite request for help → können.'],
  ['Das Baby ___ noch nicht laufen.', 'kann', 'Physical ability → können.'],
  ['Ich ___ bitte die Rechnung. (in a restaurant)', 'möchte', 'möchten = polite wish; the most common way to order or ask in a restaurant.'],
  ['Ich habe kein Geld dabei. Ich ___ nicht bezahlen.', 'kann', 'No means = no possibility → können.'],
  ['Wir ___ am Samstag grillen. Das haben wir schon geplant.', 'wollen', 'A plan you made yourself → wollen.'],
  ['___ du Fußball?', 'Magst', 'No second verb, direct object → mögen.'],
  ['Alle Passagiere ___ ihren Ausweis zeigen — das ist Pflicht.', 'müssen', '„Pflicht“ (duty) → müssen.'],
  ['Was ___ ich mitbringen? (I am asking what is expected of me.)', 'soll', 'You are asking what someone else expects of you → sollen.'],
  ['Er ___ sehr gut Deutsch; er lebt seit zehn Jahren hier.', 'kann', 'können can stand alone with a language: „Ich kann Deutsch“ = I know German.'],

  { id: 'negation',   label: 'Negation',    desc: 'nicht m\u00fcssen vs. nicht d\u00fcrfen' },
  { id: 'rules',      label: 'Rules',       desc: 'State the rule, not just the answer' },
  { id: 'translate',  label: 'EN \u2192 DE', desc: 'Produce the sentence yourself' },
  { id: 'mixed',      label: 'Mixed',       desc: 'Everything at once, exam style' },
  { id: 'extra',      label: 'Extras',      desc: 'B1 uses beyond the notes' }
];
/* ============================================================
   Engine: storage · scheduling · views
   ============================================================ */

const KEY = 'modalverben.v1';
const DAY = 86400000;
const INTERVALS = [0, 0, 1, 3, 7, 16, 35];   // days, indexed by box
const MASTER_BOX = 5;                         // box 5+ counts as mastered
const NEW_PER_SESSION = 15;

/* ---------- storage, with an in-memory fallback ---------- */
let persistent = true;
let mem = null;
const store = {
  read() {
    try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }
    catch (e) { persistent = false; return mem; }
  },
  write(o) {
    try { localStorage.setItem(KEY, JSON.stringify(o)); }
    catch (e) { persistent = false; mem = o; }
  }
};

let S = store.read() || { v: 1, items: {}, days: [], started: Date.now() };
if (!S.items) S = { v: 1, items: {}, days: [], started: Date.now() };
const save = () => store.write(S);
const st = id => S.items[id] || (S.items[id] = { b: 0, due: 0, s: 0, c: 0, w: 0, l: 0, t: 0 });
const today = () => new Date().toISOString().slice(0, 10);

function markDay() {
  const d = today();
  if (!S.days.includes(d)) { S.days.push(d); S.days = S.days.slice(-400); save(); }
}

/* ---------- answer checking ---------- */
const tidy = s => String(s)
  .replace(/[„“”"'’]/g, '').replace(/\s+/g, ' ').replace(/[.!?]+$/, '').trim().toLowerCase();
const fold = s => s.replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
function matchList(list, input) {
  const u = tidy(input);
  if (!u || !list) return false;
  return list.some(ans => {
    const a = tidy(ans);
    return u === a || fold(u) === fold(a);
  });
}
// `a` holds the answer the item is teaching; `alt` holds answers that are also
// correct German but make a different point. Both count as right.
function accepts(item, input) { return matchList(item.a, input) || matchList(item.alt, input); }
function viaAlt(item, input) { return !!item.alt && !matchList(item.a, input) && matchList(item.alt, input); }

/* ---------- scheduling ---------- */
function grade(item, right, hinted) {
  const s = st(item.id);
  s.t = Date.now(); s.pb = s.b;
  if (right) {
    s.c++; s.s++;
    if (!hinted) s.b = Math.min(INTERVALS.length - 1, s.b + 1);
    s.due = Date.now() + INTERVALS[s.b] * DAY;
  } else {
    s.w++; s.s = 0; s.l++;
    s.b = Math.max(0, s.b - 2);
    s.due = Date.now();
  }
  save();
  return s;
}
const isDue = i => { const s = S.items[i.id]; return s && s.t && s.due <= Date.now(); };
const isNew = i => !S.items[i.id] || !S.items[i.id].t;
const mastered = i => (S.items[i.id]?.b || 0) >= MASTER_BOX;
const inProgress = i => { const b = S.items[i.id]?.b || 0; return !isNew(i) && b < MASTER_BOX; };

/* ---------- session ---------- */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
let ses = null;

function startSession(mode, topic) {
  let pool = topic ? BANK.filter(i => i.topic === topic) : BANK.slice();
  let q;
  if (mode === 'review') {
    const due = shuffle(pool.filter(isDue));
    const fresh = shuffle(pool.filter(isNew)).slice(0, NEW_PER_SESSION);
    q = shuffle(due.concat(fresh));
    if (!q.length) q = shuffle(pool.filter(i => !mastered(i))).slice(0, 20);
  } else if (mode === 'topic') {
    const un = shuffle(pool.filter(i => !mastered(i)));
    q = un.length ? un.slice(0, 25) : shuffle(pool).slice(0, 25);
  } else if (mode === 'weak') {
    q = pool.filter(i => { const s = S.items[i.id]; return s && (s.l > 0 || (s.w > 0 && s.c / (s.c + s.w) < .75)); })
      .sort((a, b) => (S.items[b.id].l - S.items[a.id].l) || (S.items[b.id].w - S.items[a.id].w))
      .slice(0, 25);
    if (!q.length) q = shuffle(pool.filter(i => !mastered(i))).slice(0, 15);
  } else { // exam
    q = shuffle(pool).slice(0, 30);
  }
  if (!q.length) q = shuffle(pool).slice(0, 20);
  ses = { mode, topic, q, i: 0, done: 0, right: 0, asked: 0, log: [], state: 'ask', hinted: false, viaAlt: false, pick: null, built: null, poolOrder: null };
  markDay();
  renderDrill();
}

function nextItem() {
  if (!ses || ses.i >= ses.q.length) return null;
  return ses.q[ses.i];
}
function advance(right, item) {
  ses.asked++;
  if (right) ses.right++;
  const s = S.items[item.id];
  const requeue = ses.mode !== 'exam' && (!right || INTERVALS[s.b] === 0);
  ses.q.splice(ses.i, 1);
  if (requeue) {
    const gap = right ? 7 : 4;
    const at = Math.min(ses.q.length, ses.i + gap + (Math.random() * 3 | 0));
    ses.q.splice(at, 0, item);
  }
  ses.state = 'ask'; ses.hinted = false; ses.viaAlt = false; ses.pick = null; ses.built = null; ses.poolOrder = null;
  renderDrill();
}

/* ---------- rendering: drill ---------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const el = id => document.getElementById(id);

function renderDrill() {
  const v = el('view-drill');
  if (!ses) { v.innerHTML = homeHTML(); renderMeter(); return; }
  const item = nextItem();
  if (!item) { v.innerHTML = doneHTML(); renderMeter(); return; }

  const s = st(item.id);
  const boxLab = ['new', 'box 1', 'box 2', 'box 3', 'box 4', 'mastered', 'mastered'][s.b];
  const topic = TOPICS.find(t => t.id === item.topic);
  let body = '';

  if (item.type === 'cloze') {
    const q = item.q.replace('___', '<span class="blank"></span>');
    body = `<div class="q"${item.topic === 'translate' ? '' : ' lang="de"'}>${q}</div>` +
      (item.tag ? `<div class="hintline">${item.tag}</div>` : '') +
      `<div class="rule" id="rule"><input class="ans" id="inp" autocomplete="off" autocapitalize="off"
         autocorrect="off" spellcheck="false"></div>
       <div class="row" id="entry">
         <div class="umlaut">${['ä', 'ö', 'ü', 'ß'].map(c => `<button onclick="ins('${c}')" tabindex="-1">${c}</button>`).join('')}</div>
         <button class="btn ghost mini" onclick="hint()" id="hintbtn">Hint</button>
         <div class="spacer"></div>
         <button class="btn" onclick="check()">Check</button>
       </div>`;
  }

  if (item.type === 'mcq') {
    if (!ses.poolOrder) ses.poolOrder = shuffle(item.choices);
    body = `<div class="q">${item.q}</div>
      <div class="opts">${ses.poolOrder.map((c, k) =>
        `<button class="opt" id="opt${k}" onclick="pick(${k})">
           <span class="k">${k + 1}</span><span>${c}</span></button>`).join('')}</div>`;
  }

  if (item.type === 'order') {
    if (!ses.poolOrder) { ses.poolOrder = shuffle(item.tokens); ses.built = []; }
    const used = ses.built.slice();
    body = (item.lead ? `<div class="lead" lang="de">${item.lead}</div>` : '') +
      `<div class="hintline" style="margin-top:0">${item.tag} — build the sentence</div>
       <div class="rule" id="rule"><div class="built" id="built">${ses.built.map((t, k) =>
        `<button class="chip" lang="de" onclick="unbuild(${k})">${t}</button>`).join('') ||
        '<span style="color:#a9a294;font-family:var(--serif);font-size:20px">…</span>'}</div></div>
       <div class="poolhint">Blocks — tap, or press a number key</div>
       <div class="pool">${ses.poolOrder.map((t, k) => {
          const idx = used.indexOf(t); if (idx > -1) used.splice(idx, 1);
          const isUsed = idx > -1;
          return `<button class="chip${isUsed ? ' used' : ''}" lang="de" onclick="build(${k})"><span class="n">${k + 1}</span>${t}</button>`;
        }).join('')}</div>
       <div class="row" id="entry">
         <button class="btn ghost mini" onclick="clearBuilt()">Clear</button>
         <div class="spacer"></div>
         <button class="btn" onclick="check()">Check</button>
       </div>`;
  }

  v.innerHTML = `
    ${persistent ? '' : '<div class="warn">This browser is blocking local storage, so progress will only last for this session. Download the file and open it directly and everything will be saved.</div>'}
    <div class="card">
      <div class="chead">
        <span class="tagname">${topic.label}</span>
        <span>${ses.asked} done · ${ses.q.length} left · ${boxLab}</span>
      </div>
      ${body}
      <div id="verdict"></div>
    </div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost mini" style="border-color:#2b333d;color:var(--chrome)" onclick="ses=null;renderDrill()">← Change mode</button>
      <span style="font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#5c6672">
        ${ses.asked} answered · ${ses.asked ? Math.round(ses.right / ses.asked * 100) : 0}% correct</span>
    </div>`;
  const inp = el('inp'); if (inp) inp.focus();
  renderMeter();
}

/* ---------- interactions ---------- */
function ins(c) {
  const i = el('inp'); if (!i) return;
  const p = i.selectionStart ?? i.value.length;
  i.value = i.value.slice(0, p) + c + i.value.slice(i.selectionEnd ?? p);
  i.focus(); i.setSelectionRange(p + 1, p + 1);
}
function hint() {
  const item = nextItem(); if (!item || ses.state !== 'ask') return;
  ses.hinted = true;
  const b = el('hintbtn');
  if (item.type === 'cloze') {
    const a = item.a[0];
    b.textContent = a.length > 12 ? a.split(' ').slice(0, 2).join(' ') + ' …' : a[0] + '…';
  }
  b.disabled = true; b.style.opacity = .6;
}
function pick(k) {
  if (ses.state !== 'ask') return;
  ses.pick = k;
  document.querySelectorAll('.opt').forEach(o => o.classList.remove('pick'));
  el('opt' + k).classList.add('pick');
  check();
}
function build(k) {
  if (ses.state !== 'ask') return;
  const t = ses.poolOrder[k];
  const item = nextItem();
  const avail = ses.poolOrder.filter((x, j) => x === t).length;
  if (ses.built.filter(x => x === t).length >= avail) return;
  ses.built.push(t); renderDrill();
}
function unbuild(k) { if (ses.state !== 'ask') return; ses.built.splice(k, 1); renderDrill(); }
function clearBuilt() { if (ses.state !== 'ask') return; ses.built = []; renderDrill(); }

function check() {
  const item = nextItem(); if (!item) return;
  if (ses.state === 'shown') { advance(ses.lastRight, item); return; }
  let right = false, given = '';
  if (item.type === 'cloze') { given = el('inp').value; if (!given.trim()) return; right = accepts(item, given); ses.viaAlt = viaAlt(item, given); }
  if (item.type === 'mcq') { if (ses.pick === null) return; given = ses.poolOrder[ses.pick]; right = given === item.a[0]; }
  if (item.type === 'order') {
    if (!ses.built.length) return;
    given = ses.built.join(' ');
    right = item.orders.some(o => o.length === ses.built.length && o.every((t, k) => t === ses.built[k]));
  }
  grade(item, right, ses.hinted);
  if (item.type !== 'cloze') ses.viaAlt = false;
  ses.state = 'shown'; ses.lastRight = right;
  showVerdict(item, right, given);
}

function showVerdict(item, right, given) {
  const rule = el('rule');
  if (rule) rule.classList.add(right ? 'ok' : 'no');
  const entry = document.getElementById('entry'); if (entry) entry.style.display = 'none';
  if (item.type === 'cloze') { const i = el('inp'); i.blur(); i.readOnly = true; }
  if (item.type === 'mcq') {
    document.querySelectorAll('.opt').forEach((o, k) => {
      o.disabled = true;
      if (ses.poolOrder[k] === item.a[0]) o.classList.add('ok');
      else if (k === ses.pick) o.classList.add('no');
    });
  }
  const model = item.type === 'order' ? item.model
    : item.type === 'mcq' ? item.a[0]
      : (item.free ? item.a[0] : item.q.replace('___', '<b>' + item.a[0] + '</b>'));
  if (!model) return;
  const answers = item.a || [];
  const alts = (answers.length > 1 && item.type !== 'mcq')
    ? `<div class="hintline" style="margin-top:2px">Also accepted: ${answers.slice(1).join(' · ')}</div>`
    : (item.type === 'order' && item.orders.length > 1
      ? `<div class="hintline" style="margin-top:2px">Also correct: ${item.orders.slice(1).map(o => (item.lead ? item.lead + ' ' : '') + o.join(' ') + (item.end || '.')).join(' · ')}</div>` : '');
  const override = (!right && (item.free || answers.length > 1))
    ? `<button class="btn ghost mini" style="margin-top:12px" onclick="override()">That was right</button>` : '';
  el('verdict').innerHTML = `<div class="verdict">
      <div class="vtag ${right ? 'ok' : 'no'}">${right ? (ses.hinted ? 'Correct — but with a hint, so it does not count' : (ses.viaAlt ? 'Also correct' : 'Correct')) : 'Not yet'}</div>
      ${ses.viaAlt && item.altWhy ? `<div class="why" style="margin-bottom:10px"><b>Your answer works too.</b> ${item.altWhy}</div>` : ''}
      <div class="model"${item.type === 'mcq' ? '' : ' lang="de"'}>${model}</div>${alts}
      <div class="why">${item.why}</div>${override}
      <div class="row"><div class="spacer"></div><button class="btn" onclick="check()" id="nextbtn">Next →</button></div>
    </div>`;
  const nb = el('nextbtn'); if (nb) nb.focus();
}
function override() {
  const item = nextItem(); const s = st(item.id);
  s.w--; s.l--; s.c++; s.s++; s.b = Math.min(INTERVALS.length - 1, (s.pb ?? s.b) + 1);
  s.due = Date.now() + INTERVALS[s.b] * DAY; save();
  ses.lastRight = true; ses.right++;
  advance(true, item);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (!ses || el('view-drill').classList.contains('hide')) return;
  const item = nextItem(); if (!item) return;
  if (e.key === 'Enter') { e.preventDefault(); check(); return; }
  if (ses.state !== 'ask') return;
  if (item.type === 'mcq' && /^[1-9]$/.test(e.key)) {
    const k = +e.key - 1; if (k < ses.poolOrder.length) { e.preventDefault(); pick(k); }
  }
  if (item.type === 'order') {
    if (/^[1-9]$/.test(e.key)) { const k = +e.key - 1; if (k < ses.poolOrder.length) { e.preventDefault(); build(k); } }
    if (e.key === 'Backspace') { e.preventDefault(); ses.built.pop(); renderDrill(); }
  }
});

/* ---------- home / mode chooser ---------- */
let selTopic = null;
function homeHTML() {
  const due = BANK.filter(isDue).length;
  const fresh = BANK.filter(isNew).length;
  const weak = BANK.filter(i => { const s = S.items[i.id]; return s && (s.l > 0 || (s.w > 0 && s.c / (s.c + s.w) < .75)); }).length;
  return `
  ${persistent ? '' : '<div class="warn">This browser is blocking local storage, so progress will only last for this session. Download the file and open it directly and everything will be saved.</div>'}
  <div class="modes">
    <button class="mode" onclick="startSession('review')"><b>Review</b>
      <span>${due} due · ${fresh} new. The default — come back to it daily.</span></button>
    <button class="mode" onclick="startSession('weak')"><b>Weak spots</b>
      <span>${weak} questions you have already tripped on.</span></button>
    <button class="mode" onclick="startSession('exam')"><b>Mock test</b>
      <span>30 mixed questions. No hints, no second chances.</span></button>
  </div>
  <div class="panel">
    <div class="ptitle">Drill one topic</div>
    <div class="psub">25 questions from a single area, unmastered ones first.</div>
    <div class="chips">${TOPICS.map(t => {
      const items = BANK.filter(i => i.topic === t.id);
      const m = items.filter(mastered).length;
      return `<button class="tchip" onclick="startSession('topic','${t.id}')">${t.label} <em>${m}/${items.length}</em></button>`;
    }).join('')}</div>
  </div>`;
}
function doneHTML() {
  const pct = ses.asked ? Math.round(ses.right / ses.asked * 100) : 0;
  const nextDue = BANK.map(i => S.items[i.id]?.due || 0).filter(d => d > Date.now()).sort((a, b) => a - b)[0];
  const when = nextDue ? Math.max(1, Math.round((nextDue - Date.now()) / DAY)) : null;
  return `<div class="done">
    <h2>Round finished</h2>
    <p>${ses.right} of ${ses.asked} correct · ${pct}%</p>
    <small>${ses.mode === 'exam' ? 'Mock test complete.' : 'Everything from this round is scheduled.'}
      ${when ? `Next review in ${when} ${when === 1 ? 'day' : 'days'}.` : ''}</small>
    <button class="btn" onclick="ses=null;renderDrill()">New round</button>
  </div>`;
}

/* ---------- meter ---------- */
function renderMeter() {
  const n = BANK.length;
  const g = BANK.filter(mastered).length;
  const p = BANK.filter(inProgress).length;
  el('meter').innerHTML =
    `<i style="width:${g / n * 100}%;background:var(--good)"></i>` +
    `<i style="width:${p / n * 100}%;background:var(--signal)"></i>`;
  el('meterlab').innerHTML =
    `<span><b>${Math.round(g / n * 100)}%</b> mastered</span>` +
    `<span>${g} mastered · ${p} in progress · ${n - g - p} untouched · ${n} total</span>`;
  el('foot').textContent = `${BANK.length} questions · ${S.days.length} study day${S.days.length === 1 ? '' : 's'} · ${persistent ? 'saved in this browser' : 'this session only'}`;
}

/* ---------- tables view ---------- */
function tableFor(kind) {
  const verbs = VERB_ORDER.filter(k => VERBS[k][kind]);
  return `<div class="scroll" lang="de"><table><thead><tr><th></th>${verbs.map(k => `<th>${VERBS[k].inf}</th>`).join('')}</tr></thead>
    <tbody>${PERSONS.map((p, i) => `<tr><td class="p">${p}</td>${verbs.map(k => `<td>${VERBS[k][kind][i]}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`;
}
function renderTables() {
  el('view-tables').innerHTML = `
  <div class="panel">
    <div class="ptitle">Core meaning</div>
    <div class="psub">What each modal actually says.</div>
    <div class="scroll"><table><thead><tr><th>Verb</th><th>Meaning</th><th>Example</th></tr></thead><tbody>
      <tr><td>dürfen</td><td class="p">permission / prohibition</td><td class="p">Hier darf man nicht rauchen.</td></tr>
      <tr><td>können</td><td class="p">ability, possibility</td><td class="p">Ich kann schwimmen.</td></tr>
      <tr><td>mögen</td><td class="p">liking (no infinitive)</td><td class="p">Ich mag keinen Kaffee.</td></tr>
      <tr><td>müssen</td><td class="p">necessity, compulsion</td><td class="p">Ich muss morgen arbeiten.</td></tr>
      <tr><td>sollen</td><td class="p">external instruction</td><td class="p">Du sollst den Arzt anrufen.</td></tr>
      <tr><td>wollen</td><td class="p">own will, intention</td><td class="p">Ich will Deutsch lernen.</td></tr>
      <tr><td>möchten</td><td class="p">polite wish</td><td class="p">Ich möchte einen Kaffee.</td></tr>
    </tbody></table></div>
  </div>
  <div class="panel"><div class="ptitle">Präsens</div>
    <div class="psub">ich and er/sie/es take no ending; wir and sie/Sie equal the infinitive.</div>
    ${tableFor('pres')}</div>
  <div class="panel"><div class="ptitle">Präteritum</div>
    <div class="psub">The normal past. Umlaut disappears; mögen also swaps g → ch. möchten borrows wollte.</div>
    ${tableFor('prat')}</div>
  <div class="panel"><div class="ptitle">Word order</div>
    <div class="psub">Where the modal sits and where the infinitive lands.</div>
    <div class="scroll"><table><thead><tr><th>Sentence type</th><th>Pattern</th><th>Example</th></tr></thead><tbody>
      <tr><td>Statement</td><td class="p">modal 2nd … infinitive last</td><td class="p">Ich muss heute länger arbeiten.</td></tr>
      <tr><td>Yes/no question</td><td class="p">modal first</td><td class="p">Kannst du mir helfen?</td></tr>
      <tr><td>W-question</td><td class="p">W-word + modal</td><td class="p">Wann willst du kommen?</td></tr>
      <tr><td>Subordinate clause</td><td class="p">infinitive + modal, at the end</td><td class="p">…, weil ich arbeiten muss.</td></tr>
      <tr><td>Passive</td><td class="p">modal 2nd … Partizip II + werden</td><td class="p">Das Formular muss ausgefüllt werden.</td></tr>
    </tbody></table></div>
  </div>
  <div class="panel"><div class="ptitle">Perfekt</div>
    <div class="psub">Two shapes, and the choice depends only on whether a second verb is present.</div>
    <div class="note">
      <b>With a second verb → double infinitive.</b> The modal appears as an infinitive, never as a participle:
      <code>Ich habe gestern länger arbeiten müssen.</code><br><br>
      <b>Without a second verb → the real participle:</b>
      <code>${VERB_ORDER.filter(k => VERBS[k].pp).map(k => VERBS[k].pp).join(' · ')}</code> —
      <code>Das habe ich nicht gewollt.</code><br><br>
      <b>In a subordinate clause</b> native speakers reach for the Präteritum: <code>…, weil ich arbeiten musste.</code>
    </div>
  </div>
  <div class="panel"><div class="ptitle">Negation — the classic trap</div>
    <div class="psub">The one distinction that changes the meaning completely.</div>
    <div class="scroll"><table><thead><tr><th>German</th><th>Meaning</th><th>Watch out</th></tr></thead><tbody>
      <tr><td>Du musst nicht kommen.</td><td class="p">You don't have to come.</td><td style="color:var(--signal)">NOT “must not”</td></tr>
      <tr><td>Du darfst nicht kommen.</td><td class="p">You must not come.</td><td style="color:var(--signal)">prohibition</td></tr>
      <tr><td>Ich kann nicht kommen.</td><td class="p">I can't come.</td><td class="p">neutral</td></tr>
    </tbody></table></div>
  </div>`;
}

/* ---------- stats view ---------- */
function renderStats() {
  const n = BANK.length;
  const g = BANK.filter(mastered).length;
  const p = BANK.filter(inProgress).length;
  const answered = Object.values(S.items).reduce((a, s) => a + s.c + s.w, 0);
  const rightN = Object.values(S.items).reduce((a, s) => a + s.c, 0);
  const acc = answered ? Math.round(rightN / answered * 100) : 0;
  const dueNow = BANK.filter(isDue).length;

  const rows = TOPICS.map(t => {
    const items = BANK.filter(i => i.topic === t.id);
    const m = items.filter(mastered).length, ip = items.filter(inProgress).length;
    return `<div class="trow"><div class="tname">${t.label}</div>
      <div class="tbar"><i style="width:${m / items.length * 100}%;background:var(--good)"></i>
        <i style="width:${ip / items.length * 100}%;background:var(--signal)"></i></div>
      <div class="tnum">${m}/${items.length}</div></div>`;
  }).join('');

  const boxes = [0, 1, 2, 3, 4, 5, 6].map(b => BANK.filter(i => (S.items[i.id]?.b || 0) === b && !isNew(i)).length);
  const maxB = Math.max(1, ...boxes);

  const worst = BANK.map(i => ({ i, s: S.items[i.id] })).filter(x => x.s && x.s.w > 0)
    .sort((a, b) => b.s.w - a.s.w).slice(0, 8);

  el('view-stats').innerHTML = `
  <div class="grid" style="margin-bottom:16px">
    <div class="stat"><b>${Math.round(g / n * 100)}%</b><span>mastered</span></div>
    <div class="stat"><b>${acc}%</b><span>accuracy</span></div>
    <div class="stat"><b>${answered}</b><span>answers</span></div>
    <div class="stat"><b>${S.days.length}</b><span>study days</span></div>
    <div class="stat"><b>${dueNow}</b><span>due now</span></div>
  </div>
  <div class="panel">
    <div class="ptitle">By topic</div>
    <div class="psub">Green = mastered (box 5 and up). Amber = in progress.</div>
    ${rows}
    <div class="legend"><span><i style="background:var(--good)"></i>mastered</span>
      <span><i style="background:var(--signal)"></i>in progress</span>
      <span><i style="background:#2b333d"></i>untouched</span></div>
  </div>
  <div class="panel">
    <div class="ptitle">Leitner boxes</div>
    <div class="psub">A question moves up one box for every correct answer. Gaps: now · now · 1 · 3 · 7 · 16 · 35 days. From box 5 it counts as mastered.</div>
    <div class="scroll"><table><thead><tr>${boxes.map((_, b) => `<th>Box ${b}</th>`).join('')}</tr></thead>
      <tbody><tr>${boxes.map(v => `<td>${v}</td>`).join('')}</tr>
      <tr>${boxes.map(v => `<td><span style="display:inline-block;height:6px;border-radius:2px;background:var(--signal);width:${v / maxB * 46 + 2}px"></span></td>`).join('')}</tr>
      </tbody></table></div>
  </div>
  ${worst.length ? `<div class="panel"><div class="ptitle">Most-missed questions</div>
    <div class="psub">The ones that have cost you the most.</div>
    <div class="scroll"><table><thead><tr><th>Question</th><th>Answer</th><th>Missed</th></tr></thead><tbody>
    ${worst.map(x => `<tr><td class="p" style="white-space:normal;max-width:340px">${x.i.q.replace(/<[^>]+>/g, '').slice(0, 78)}</td>
      <td>${(x.i.type === 'order' ? x.i.model : x.i.a[0]).slice(0, 40)}</td><td>${x.s.w}×</td></tr>`).join('')}
    </tbody></table></div></div>` : ''}
  <div class="panel">
    <div class="ptitle">Back up progress</div>
    <div class="psub">${persistent ? 'Everything lives in this browser\u2019s localStorage.' : 'Storage is blocked here \u2014 download the file and open it directly.'}</div>
    <div class="row" style="margin:0">
      <button class="btn ghost mini" style="border-color:#2b333d;color:var(--chrome)" onclick="exportJSON()">Export</button>
      <button class="btn ghost mini" style="border-color:#2b333d;color:var(--chrome)" onclick="el('imp').click()">Import</button>
      <input type="file" id="imp" accept="application/json" class="hide" onchange="importJSON(this)">
      <div class="spacer"></div>
      <button class="btn ghost mini" style="border-color:#4a2b28;color:#b0453c" onclick="reset()">Reset</button>
    </div>
  </div>`;
}

function exportJSON() {
  const b = new Blob([JSON.stringify(S)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'modal-verbs-progress.json'; a.click();
}
function importJSON(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const o = JSON.parse(r.result); if (o && o.items) { S = o; save(); go('stats'); renderMeter(); } }
    catch (e) { alert('That file could not be read.'); }
  };
  r.readAsText(f);
}
function reset() {
  if (!confirm('This deletes all progress. Continue?')) return;
  S = { v: 1, items: {}, days: [], started: Date.now() }; save(); ses = null;
  renderStats(); renderMeter(); renderDrill();
}

/* ---------- nav ---------- */
function go(v) {
  ['drill', 'tables', 'stats'].forEach(x => {
    el('view-' + x).classList.toggle('hide', x !== v);
    el('tab-' + x).setAttribute('aria-selected', String(x === v));
  });
  if (v === 'tables') renderTables();
  if (v === 'stats') renderStats();
}

renderDrill();
renderMeter();

</script>
</body>
</html>
