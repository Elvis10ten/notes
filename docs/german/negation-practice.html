<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Negation — Practice</title>
<style>
  :root {
    --paper: #f2f4f7;
    --surface: #ffffff;
    --ink: #16202e;
    --muted: #5b6675;
    --line: #d5dae2;
    --line-strong: #aab2bf;
    --mark: #ffe45c;
    --mark-ink: #3a3000;
    --ok: #1f7a4d;
    --ok-bg: #e6f3ec;
    --bad: #b3261e;
    --bad-bg: #fbe9e7;
    --ahead: #7a5a1f;
    --ahead-bg: #fff3d6;
    --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151a21;
      --surface: #1d232c;
      --ink: #eef1f5;
      --muted: #9aa5b4;
      --line: #313a47;
      --line-strong: #4a5563;
      --mark: #ffd83a;
      --mark-ink: #2a2200;
      --ok: #5fcf8f;
      --ok-bg: #163425;
      --bad: #ff7b70;
      --bad-bg: #3d1a17;
      --ahead: #f0c060;
      --ahead-bg: #3a2e12;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .wrap { max-width: 660px; margin: 0 auto; padding: 20px 16px 48px; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header.top h1 { font-family: var(--serif); font-weight: 400; font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  header.top h1 em { font-style: italic; background: var(--mark); color: var(--mark-ink); padding: 0 6px; }
  .status { color: var(--muted); font-size: 14px; }

  .boxbar { display: flex; height: 8px; margin: 12px 0 4px; border-radius: 4px; overflow: hidden; background: var(--line); }
  .boxbar span { display: block; height: 100%; }
  .boxbar .b0 { background: var(--line-strong); }
  .boxbar .b1 { background: #c9b7ff; }
  .boxbar .b2 { background: #9dcbff; }
  .boxbar .b3 { background: #7fdcc6; }
  .boxbar .b4 { background: #b7e08a; }
  .boxbar .b5 { background: var(--ok); }
  .boxlegend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .boxlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }

  nav.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); margin: 18px 0 20px; }
  nav.tabs button {
    background: none; border: 0; padding: 8px 0 10px; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 15px;
  }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .meta .box { white-space: nowrap; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: var(--ahead-bg); color: var(--ahead); }
  .instruction { margin: 14px 0 6px; color: var(--muted); font-size: 14px; }
  .sentence {
    font-family: var(--serif); font-size: 26px; line-height: 1.45; margin: 0 0 18px;
    word-wrap: break-word;
  }
  .sentence .blank { display: inline-block; min-width: 3ch; border-bottom: 2px solid var(--ink); margin: 0 2px; }
  .sentence .cue { font-family: var(--sans); font-size: 14px; color: var(--muted); display: block; margin-top: 4px; }

  /* choose */
  .options { display: grid; gap: 8px; }
  .options button {
    text-align: left; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius);
    padding: 10px 12px; font-family: var(--serif); font-size: 19px; line-height: 1.35; display: flex; gap: 10px; align-items: baseline;
  }
  .options button .key { font-family: var(--sans); font-size: 12px; color: var(--muted); min-width: 14px; }
  .options button:hover { border-color: var(--ink); }
  .options button.picked-ok { border-color: var(--ok); background: var(--ok-bg); }
  .options button.picked-bad { border-color: var(--bad); background: var(--bad-bg); }
  .options button.reveal-ok { border-color: var(--ok); }
  .options button[disabled] { cursor: default; }

  /* type */
  .typeform { display: flex; gap: 8px; flex-wrap: wrap; }
  .typeform input {
    flex: 1 1 200px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius);
    background: var(--surface); font-family: var(--serif); font-size: 20px;
  }
  .typeform input.ok { border-color: var(--ok); background: var(--ok-bg); }
  .typeform input.bad { border-color: var(--bad); background: var(--bad-bg); }

  /* place */
  .gaps { font-family: var(--serif); font-size: 26px; line-height: 2; margin: 0 0 12px; }
  .gaps .w { display: inline; }
  .gaps .gap {
    display: inline-block; vertical-align: baseline; width: 26px; height: 26px; margin: 0 3px;
    border: 1.5px dashed var(--line-strong); border-radius: 50%; background: none; padding: 0;
    font-family: var(--sans); font-size: 11px; color: var(--muted); line-height: 1;
    transform: translateY(-4px);
  }
  .gaps .gap:hover { border-style: solid; border-color: var(--ink); color: var(--ink); }
  .gaps .gap.chosen-ok, .gaps .gap.reveal-ok { border: 0; width: auto; height: auto; border-radius: 3px; transform: none; font-family: var(--serif); font-size: 26px; padding: 0 6px; background: var(--mark); color: var(--mark-ink); }
  .gaps .gap.chosen-bad { border: 1.5px solid var(--bad); color: var(--bad); }
  .gaps .gap.reveal-ok { outline: 2px solid var(--ok); }
  .gaps .gap[disabled] { cursor: default; }
  .gaps .gap[disabled]:not(.chosen-ok):not(.reveal-ok):not(.chosen-bad) { opacity: 0.3; width: 8px; height: 8px; font-size: 0; border-style: solid; margin: 0 5px; transform: translateY(-8px); }

  /* feedback */
  .feedback { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  .verdict { font-weight: 600; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  .solution { font-family: var(--serif); font-size: 22px; margin: 6px 0 8px; }
  .solution mark { background: var(--mark); color: var(--mark-ink); padding: 0 4px; border-radius: 3px; }
  .explain { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
  .move { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .move.up { color: var(--ok); }
  .move.down { color: var(--bad); }
  .move.hold { color: var(--ahead); }

  .btn {
    background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: var(--radius);
    padding: 10px 16px; font-size: 15px;
  }
  .btn.secondary { background: transparent; color: var(--ink); }
  .btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
  .btn.small { padding: 6px 10px; font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 10px; }

  .session { margin-top: 14px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  /* progress */
  table.concepts { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.concepts th, table.concepts td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.concepts th { color: var(--muted); font-weight: 500; font-size: 13px; }
  table.concepts td.num { text-align: right; white-space: nowrap; }
  table.concepts .mini { display: flex; height: 6px; width: 90px; border-radius: 3px; overflow: hidden; background: var(--line); }
  table.concepts .mini span { display: block; height: 100%; }
  table.concepts button.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .summary div { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .summary b { display: block; font-size: 22px; font-weight: 500; font-family: var(--serif); }
  .summary span { font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); }

  /* rules */
  .rules h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin: 22px 0 8px; }
  .rules h2:first-child { margin-top: 0; }
  .rules table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 14px; }
  .rules th, .rules td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .rules th { color: var(--muted); font-weight: 500; }
  .rules td.de, .rules .de { font-family: var(--serif); font-size: 16px; }
  .rules b { background: var(--mark); color: var(--mark-ink); padding: 0 3px; border-radius: 2px; font-weight: 500; }
  .rules ul { padding-left: 20px; margin: 6px 0 12px; }
  .rules li { margin: 4px 0; }
  .rules p { margin: 6px 0 12px; }

  @media (max-width: 480px) {
    .wrap { padding: 14px 12px 40px; }
    .card { padding: 16px 14px; }
    .sentence, .gaps { font-size: 22px; }
    .options button { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Negation: <em>nicht</em> or <em>kein</em></h1>
    <div class="status" id="status"></div>
  </header>
  <div class="boxbar" id="boxbar" aria-hidden="true"></div>
  <div class="boxlegend" id="boxlegend" aria-hidden="true"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="drill" aria-selected="true">Drill</button>
    <button role="tab" data-tab="progress" aria-selected="false">Progress</button>
    <button role="tab" data-tab="rules" aria-selected="false">Rules</button>
  </nav>
  <main id="app"></main>
</div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Concepts (map 1:1 to the sections of the notes)
// ---------------------------------------------------------------------------
const CONCEPTS = [
  { id: 'kein-indef',        group: 'kein or nicht?', label: 'kein replaces ein / eine / einen' },
  { id: 'kein-plural',       group: 'kein or nicht?', label: 'kein for zero-article plurals' },
  { id: 'kein-mass',         group: 'kein or nicht?', label: 'kein for mass and abstract nouns' },
  { id: 'kein-profession',   group: 'kein or nicht?', label: 'kein for profession, nationality, religion' },
  { id: 'kein-form',         group: 'kein or nicht?', label: 'the right form of kein (gender and case)' },
  { id: 'nicht-definite',    group: 'kein or nicht?', label: 'nicht with der- / dies- / mein- determiners' },
  { id: 'nicht-name-pronoun',group: 'kein or nicht?', label: 'nicht with names and pronouns' },
  { id: 'nicht-collocation', group: 'kein or nicht?', label: 'verb + bare noun (Klavier spielen) vs languages' },
  { id: 'place-separable',   group: 'Where does nicht go?', label: 'before a separable prefix' },
  { id: 'place-infinitive',  group: 'Where does nicht go?', label: 'before an infinitive' },
  { id: 'place-participle',  group: 'Where does nicht go?', label: 'before a past participle' },
  { id: 'place-pred-adj',    group: 'Where does nicht go?', label: 'before a predicate adjective' },
  { id: 'place-pred-noun',   group: 'Where does nicht go?', label: 'before a predicate noun' },
  { id: 'place-prep',        group: 'Where does nicht go?', label: 'before a verb-bound preposition' },
  { id: 'place-direction',   group: 'Where does nicht go?', label: 'before a direction / place complement' },
  { id: 'place-subclause',   group: 'Where does nicht go?', label: 'before the final verb of a subordinate clause' },
  { id: 'place-after',       group: 'Where does nicht go?', label: 'after pronouns, definite objects, definite time' },
  { id: 'place-tekamolo',    group: 'Where does nicht go?', label: 'Temporal → Kausal → nicht → Modal → Lokal' },
  { id: 'place-free-place',  group: 'Where does nicht go?', label: 'free place adjunct before nicht' },
  { id: 'partial',           group: 'Partial negation', label: 'nicht directly before the contrasted word (… sondern)' },
  { id: 'nicht-ein',         group: 'Partial negation', label: 'nicht ein = emphasis or explicit contrast' },
  { id: 'family-nichts-niemand', group: 'The wider family', label: 'nichts / niemand' },
  { id: 'family-keiner',     group: 'The wider family', label: 'keiner / keine / keins as a pronoun' },
  { id: 'family-nie-nirgendwo', group: 'The wider family', label: 'nie / niemals / nirgendwo / nirgends' },
  { id: 'family-noch',       group: 'The wider family', label: 'noch nicht / noch kein' },
  { id: 'family-mehr',       group: 'The wider family', label: 'nicht mehr / kein … mehr' },
  { id: 'family-gar',        group: 'The wider family', label: 'gar nicht / gar kein / nicht einmal' },
  { id: 'family-weder',      group: 'The wider family', label: 'weder … noch' },
];

// ---------------------------------------------------------------------------
// Shared explanations
// ---------------------------------------------------------------------------
const EX = {
  indef: 'The positive sentence has ein / eine / einen, so the negation is the matching form of kein (kein = nicht + ein). Nicht ein only exists for emphasis ("not a single").',
  plural: 'A bare plural noun has a "zero article", and a zero article is negated with kein: keine Kinder. Nicht cannot stand in front of a bare plural.',
  mass: 'A zero-article mass or abstract noun (Kaffee, Zeit, Lust, Geld …) is negated with kein in the noun\'s gender and case. Nicht cannot stand in front of a bare noun.',
  profession: 'Profession, nationality and religion stand without an article, so they are negated with kein. Nicht only appears in an explicit contrast: nicht Ingenieur, sondern Architekt.',
  profContrast: 'In an explicit contrast (… sondern …) nicht goes directly in front of the word being contrasted. Kein is the plain negation; nicht … sondern is the contrastive one.',
  definite: 'A definite, demonstrative or possessive determiner (der / dies- / mein-) stays, and the sentence is negated with nicht, which comes after the definite object. A kein sentence would say something else: "I don\'t know any man".',
  name: 'Names and pronouns cannot take kein. Use nicht, and put it after the name / pronoun (nicht goes as far right as possible).',
  colloc: 'Klavier spielen, Auto fahren, Fußball spielen … are fixed verb + bare-noun collocations: the noun is part of the verb, so the whole thing is negated with nicht directly in front of the noun. (Colloquially you will hear kein here too; the standard form is nicht.)',
  language: 'Languages behave like mass nouns, not like collocations: Ich spreche kein Deutsch.',
  form: 'Kein declines exactly like ein / mein: kein (m/n nom, n acc), keine (f nom/acc, plural nom/acc), keinen (m acc, plural dat), keinem (m/n dat), keiner (f dat / gen).',
  separable: 'Nicht goes as far right as possible, but a separable prefix is the last word of the clause, so nicht stands directly in front of it.',
  infinitive: 'With a modal verb the infinitive closes the clause; nicht stands directly in front of it.',
  participle: 'In the Perfekt the past participle closes the clause; nicht stands directly in front of it.',
  predAdj: 'A predicate adjective after sein / werden / bleiben belongs to the verb, so nicht stands directly in front of it.',
  predNoun: 'A predicate noun after sein / werden / bleiben belongs to the verb, so nicht stands directly in front of it (nicht mein Bruder, nicht Arzt sondern Lehrer).',
  prep: 'A verb-bound prepositional object (warten auf, denken an, sich interessieren für …) belongs to the verb, so nicht stands in front of the preposition.',
  direction: 'A direction or obligatory place complement (nach Berlin, ins Kino, in Hamburg wohnen) belongs to the verb, so nicht stands in front of it.',
  subclause: 'In a subordinate clause the conjugated verb goes to the end. Nicht stands in front of that final verb (or in front of a participle / infinitive / complement that belongs to it).',
  afterPron: 'Nicht comes after pronouns. With nothing else that belongs to the verb, nicht ends the sentence.',
  afterDef: 'Nicht comes after a definite object. With nothing else that belongs to the verb, nicht ends the sentence.',
  afterTime: 'Nicht comes after a definite time expression. With nothing else that belongs to the verb, nicht ends the sentence.',
  tekamolo: 'Ordering shortcut: Temporal → Kausal → nicht → Modal → Lokal. Nicht comes after time and reason, but before manner and place.',
  freePlace: 'A free (non-directional, not verb-bound) place adjunct — in Berlin, im Park, hier, dort — comes before nicht, like time expressions.',
  partial: 'To negate one word rather than the whole sentence, put nicht directly in front of that word and complete the contrast with sondern.',
  nichtEin: 'Nicht ein is not the normal negation of ein. It only appears for emphasis ("not a single") or in an explicit contrast (nicht ein …, sondern …).',
  plainKein: 'Without emphasis or contrast, ein is negated with kein. Nicht ein would sound like "not a single".',
};

// ---------------------------------------------------------------------------
// Item constructors
// ---------------------------------------------------------------------------
// choose: pick the correctly negated sentence. options[0] is always the correct one (shuffled at display time).
function ch(id, concept, positive, correct, distractors, explanation, meta, instruction) {
  return { id, concept, type: 'choose', instruction: instruction || 'Negate the sentence.', positive,
           options: [correct].concat(distractors), answer: 0, explanation, meta: meta || null };
}
// type: fill the blank. answers = every accepted string.
function ty(id, concept, sentence, answers, cue, explanation, meta) {
  return { id, concept, type: 'type', sentence, answers, cue, explanation, meta: meta || null };
}
// place: click the gap where nicht belongs. answer = gap index (0 = before first word, words.length = at the end).
function pl(id, concept, words, answer, solution, explanation, instruction) {
  return { id, concept, type: 'place', instruction: instruction || 'Where does nicht go? (negate the whole sentence)', words, answer, solution, explanation };
}

const BANK = [];
function add() { for (const it of arguments) BANK.push(it); }

// ---------------------------------------------------------------------------
// kein replaces ein / eine / einen
// ---------------------------------------------------------------------------
add(
  ch('k01','kein-indef','Ich habe ein Auto.','Ich habe kein Auto.',['Ich habe nicht ein Auto.','Ich habe keinen Auto.'],EX.indef,{g:'n',c:'acc'}),
  ch('k02','kein-indef','Sie hat einen Hund.','Sie hat keinen Hund.',['Sie hat kein Hund.','Sie hat einen Hund nicht.'],EX.indef,{g:'m',c:'acc'}),
  ch('k03','kein-indef','Wir haben eine Katze.','Wir haben keine Katze.',['Wir haben kein Katze.','Wir haben nicht eine Katze.'],EX.indef,{g:'f',c:'acc'}),
  ch('k04','kein-indef','Er kauft einen Tisch.','Er kauft keinen Tisch.',['Er kauft kein Tisch.','Er kauft einen Tisch nicht.'],EX.indef,{g:'m',c:'acc'}),
  ch('k05','kein-indef','Ich brauche eine Pause.','Ich brauche keine Pause.',['Ich brauche keinen Pause.','Ich brauche nicht eine Pause.'],EX.indef,{g:'f',c:'acc'}),
  ch('k06','kein-indef','Das ist ein Problem.','Das ist kein Problem.',['Das ist nicht ein Problem.','Das ist keinen Problem.'],EX.indef,{g:'n',c:'nom'}),
  ch('k07','kein-indef','Sie ist eine gute Ärztin.','Sie ist keine gute Ärztin.',['Sie ist nicht eine gute Ärztin.','Sie ist kein gute Ärztin.'],EX.indef,{g:'f',c:'nom'}),
  ch('k08','kein-indef','Ich habe einen Bruder.','Ich habe keinen Bruder.',['Ich habe kein Bruder.','Ich habe nicht einen Bruder.'],EX.indef,{g:'m',c:'acc'}),
  ch('k09','kein-indef','Er schreibt einen Brief.','Er schreibt keinen Brief.',['Er schreibt keine Brief.','Er schreibt einen Brief nicht.'],EX.indef,{g:'m',c:'acc'}),
  ch('k10','kein-indef','Wir suchen eine Wohnung.','Wir suchen keine Wohnung.',['Wir suchen nicht eine Wohnung.','Wir suchen keinen Wohnung.'],EX.indef,{g:'f',c:'acc'}),
  ch('k11','kein-indef','Ich habe einen Termin.','Ich habe keinen Termin.',['Ich habe kein Termin.','Ich habe einen Termin nicht.'],EX.indef,{g:'m',c:'acc'}),
  ch('k12','kein-indef','Das ist eine gute Idee.','Das ist keine gute Idee.',['Das ist nicht eine gute Idee.','Das ist kein gute Idee.'],EX.indef,{g:'f',c:'nom'}),
  ch('k13','kein-indef','Er hat ein Fahrrad.','Er hat kein Fahrrad.',['Er hat keinen Fahrrad.','Er hat ein Fahrrad nicht.'],EX.indef,{g:'n',c:'acc'}),
  ch('k14','kein-indef','Ich möchte ein Eis.','Ich möchte kein Eis.',['Ich möchte nicht ein Eis.','Ich möchte keinen Eis.'],EX.indef,{g:'n',c:'acc'}),
  ch('k15','kein-indef','Wir haben einen Garten.','Wir haben keinen Garten.',['Wir haben kein Garten.','Wir haben nicht einen Garten.'],EX.indef,{g:'m',c:'acc'}),
  ch('k16','kein-indef','Sie hat einen Freund.','Sie hat keinen Freund.',['Sie hat keine Freund.','Sie hat nicht einen Freund.'],EX.indef,{g:'m',c:'acc'}),
  ch('k17','kein-indef','Ich habe eine Frage.','Ich habe keine Frage.',['Ich habe kein Frage.','Ich habe eine Frage nicht.'],EX.indef,{g:'f',c:'acc'}),
  ch('k18','kein-indef','Das ist ein Fehler.','Das ist kein Fehler.',['Das ist keinen Fehler.','Das ist nicht ein Fehler.'],EX.indef,{g:'m',c:'nom'}),
  ch('k19','kein-indef','Er nimmt ein Taxi.','Er nimmt kein Taxi.',['Er nimmt keinen Taxi.','Er nimmt ein Taxi nicht.'],EX.indef,{g:'n',c:'acc'}),
  ch('k20','kein-indef','Er hilft einem Kind.','Er hilft keinem Kind.',['Er hilft kein Kind.','Er hilft einem Kind nicht.'],EX.indef,{g:'n',c:'dat'}),
  ch('k21','kein-indef','Ich spreche mit einem Kollegen.','Ich spreche mit keinem Kollegen.',['Ich spreche mit keiner Kollegen.','Ich spreche mit kein Kollegen.'],EX.indef,{g:'m',c:'dat'}),
  ch('k22','kein-indef','Er antwortet einer Kundin.','Er antwortet keiner Kundin.',['Er antwortet keine Kundin.','Er antwortet einer Kundin nicht.'],EX.indef,{g:'f',c:'dat'}),
  ch('k23','kein-indef','Ich habe ein Zimmer reserviert.','Ich habe kein Zimmer reserviert.',['Ich habe nicht ein Zimmer reserviert.','Ich habe ein Zimmer nicht reserviert.'],EX.indef,{g:'n',c:'acc'}),
  ch('k24','kein-indef','Wir haben einen Tisch reserviert.','Wir haben keinen Tisch reserviert.',['Wir haben kein Tisch reserviert.','Wir haben einen Tisch nicht reserviert.'],EX.indef,{g:'m',c:'acc'}),
);

// ---------------------------------------------------------------------------
// kein for zero-article plurals

// ---------------------------------------------------------------------------
// Engine
// ---------------------------------------------------------------------------
const STORAGE_KEY = 'negation-drill:v1';
const BOX_MAX = 5;                                   // box 5 = mastered
const INTERVALS_MIN = [0, 10, 60, 24 * 60, 3 * 24 * 60, 7 * 24 * 60]; // wait before an item in box n is due again
const RECENT_WINDOW = 5;                             // never repeat one of the last 5 items
const BOX_LABELS = ['new / relearning', '10 min', '1 hour', '1 day', '3 days', 'mastered (7-day check)'];

const CONCEPT_BY_ID = {};
CONCEPTS.forEach(c => { CONCEPT_BY_ID[c.id] = c; });
const BANK_INDEX = {};
BANK.forEach((it, i) => { BANK_INDEX[it.id] = i; });

const Core = {
  rng: Math.random,
  now: () => Date.now(),

  normalize(s) {
    return String(s == null ? '' : s)
      .toLowerCase()
      .replace(/ß/g, 'ss').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
      .replace(/[.!?…]+$/g, '')
      .replace(/[.,;:!?…]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  },

  isCorrect(item, response) {
    if (item.type === 'choose') return response === item.options[item.answer];
    if (item.type === 'place') return Number(response) === item.answer;
    if (item.type === 'type') {
      const r = Core.normalize(response);
      return r.length > 0 && item.answers.some(a => Core.normalize(a) === r);
    }
    return false;
  },

  insertNicht(words, idx) {
    const w = words.slice();
    if (idx === 0) {
      w[0] = w[0].charAt(0).toLowerCase() + w[0].slice(1);
      w.unshift('Nicht');
    } else {
      w.splice(idx, 0, 'nicht');
    }
    return w.join(' ') + '.';
  },

  solutionText(item) {
    if (item.type === 'choose') return item.options[item.answer];
    if (item.type === 'place') return item.solution;
    return item.sentence.replace('___', item.answers[0]);
  },

  newProgress() {
    return { version: 1, items: {}, recent: [], lastConcept: null, stats: { answered: 0, correct: 0 }, history: [] };
  },

  itemState(p, id) {
    return p.items[id] || { box: 0, due: 0, seen: 0, correct: 0, wrong: 0, lapses: 0, last: 0 };
  },

  isMastered(s) { return s.box >= BOX_MAX; },

  applyAnswer(p, item, ok, now, ahead) {
    const s = Object.assign({}, Core.itemState(p, item.id));
    const before = Object.assign({}, s);
    s.seen += 1; s.last = now;
    if (ok) {
      s.correct += 1;
      if (!ahead) {
        s.box = Math.min(BOX_MAX, s.box + 1);
        s.due = now + INTERVALS_MIN[s.box] * 60000;
      }
    } else {
      s.wrong += 1;
      if (s.box > 0) s.lapses += 1;
      s.box = 0;
      s.due = now;
    }
    p.items[item.id] = s;
    p.recent = (p.recent || []).concat(item.id).slice(-RECENT_WINDOW);
    p.lastConcept = item.concept;
    p.stats.answered += 1;
    if (ok) p.stats.correct += 1;
    p.history.push([now, item.id, ok ? 1 : 0]);
    if (p.history.length > 3000) p.history.splice(0, p.history.length - 3000);
    return { before, after: Object.assign({}, s) };
  },

  // Priority: due reviews (box >= 1, oldest due first) → relearning (box 0, longest ago first) → new items
  // (concepts with the fewest introduced items first, then bank order). If nothing is due: "ahead" mode,
  // where correct answers do not advance the box, so spacing cannot be short-circuited.
  pickNext(p, now, opts) {
    opts = opts || {};
    const pool = opts.concept ? BANK.filter(it => it.concept === opts.concept) : BANK;
    if (!pool.length) return null;
    const recent = new Set((p.recent || []).slice(-RECENT_WINDOW));
    const introduced = {};
    for (const it of BANK) {
      if (Core.itemState(p, it.id).seen > 0) introduced[it.concept] = (introduced[it.concept] || 0) + 1;
    }
    const dueReview = [], relearn = [], fresh = [];
    pool.forEach(it => {
      const s = Core.itemState(p, it.id);
      if (s.seen === 0) fresh.push({ it, s });
      else if (s.due <= now) (s.box === 0 ? relearn : dueReview).push({ it, s });
    });
    dueReview.sort((a, b) => a.s.due - b.s.due || BANK_INDEX[a.it.id] - BANK_INDEX[b.it.id]);
    relearn.sort((a, b) => a.s.last - b.s.last || BANK_INDEX[a.it.id] - BANK_INDEX[b.it.id]);
    fresh.sort((a, b) => (introduced[a.it.concept] || 0) - (introduced[b.it.concept] || 0) || BANK_INDEX[a.it.id] - BANK_INDEX[b.it.id]);
    // strict bucket priority; concept variety is only applied inside the winning bucket
    let cands = null, ahead = false;
    for (const bucket of [dueReview, relearn, fresh]) {
      const c = bucket.map(x => x.it).filter(it => !recent.has(it.id));
      if (c.length) { cands = c; break; }
    }
    if (!cands) {
      ahead = true;
      cands = pool.map(it => ({ it, s: Core.itemState(p, it.id) }))
        .sort((a, b) => a.s.due - b.s.due || a.s.box - b.s.box || BANK_INDEX[a.it.id] - BANK_INDEX[b.it.id])
        .map(x => x.it).filter(it => !recent.has(it.id));
      if (!cands.length) cands = pool.slice();
    }
    const win = cands.slice(0, 6);
    const item = win.find(it => it.concept !== p.lastConcept) || win[0];
    return { item, ahead };
  },

  summary(p, now) {
    const byBox = [0, 0, 0, 0, 0, 0];
    const byConcept = {};
    CONCEPTS.forEach(c => { byConcept[c.id] = { total: 0, mastered: 0, due: 0, seen: 0, correct: 0, answered: 0, boxes: [0, 0, 0, 0, 0, 0] }; });
    let mastered = 0, due = 0, unseen = 0;
    for (const it of BANK) {
      const s = Core.itemState(p, it.id);
      const c = byConcept[it.concept];
      byBox[s.box] += 1; c.total += 1; c.boxes[s.box] += 1;
      if (Core.isMastered(s)) { mastered += 1; c.mastered += 1; }
      if (s.seen === 0) unseen += 1;
      else if (s.due <= now) { due += 1; c.due += 1; }
      if (s.seen > 0) c.seen += 1;
      c.correct += s.correct; c.answered += s.correct + s.wrong;
    }
    return { total: BANK.length, mastered, due, unseen, byBox, byConcept, answered: p.stats.answered, correct: p.stats.correct };
  },

  load(storage) {
    try {
      const raw = storage.getItem(STORAGE_KEY);
      if (!raw) return Core.newProgress();
      const p = JSON.parse(raw);
      if (!p || p.version !== 1 || typeof p.items !== 'object') return Core.newProgress();
      p.recent = p.recent || []; p.stats = p.stats || { answered: 0, correct: 0 }; p.history = p.history || [];
      return p;
    } catch (e) { return Core.newProgress(); }
  },
  save(storage, p) {
    try { storage.setItem(STORAGE_KEY, JSON.stringify(p)); return true; } catch (e) { return false; }
  },
};

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const NEG_WORD = /\b(nicht|kein\w*|nichts|niemand\w*|niemals|nie|nirgendwo|nirgends|weder|noch|mehr|gar|überhaupt|einmal|mal)\b/gi;
function highlight(sentence) {
  return esc(sentence).replace(NEG_WORD, m => '<mark>' + m + '</mark>');
}
function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function memoryStorage() { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; }

const UI = {
  storage: null,
  progress: null,
  tab: 'drill',
  focusConcept: null,
  session: { answered: 0, correct: 0, goal: 20, done: false },
  current: null,        // { item, ahead, options (shuffled, choose only) }
  answered: null,       // { ok, response, move }

  init() {
    if (UI.progress) return; // already initialised (test harness may call init explicitly)
    let s = null;
    try { s = window.localStorage; s.getItem(STORAGE_KEY); } catch (e) { s = memoryStorage(); }
    UI.storage = s;
    UI.progress = Core.load(s);
    document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => UI.showTab(b.dataset.tab)));
    document.addEventListener('keydown', UI.onKey);
    UI.nextQuestion();
    UI.render();
  },

  showTab(t) { UI.tab = t; UI.render(); },

  nextQuestion() {
    const pick = Core.pickNext(UI.progress, Core.now(), { concept: UI.focusConcept });
    if (!pick) { UI.current = null; UI.answered = null; return; }
    const cur = { item: pick.item, ahead: pick.ahead };
    if (pick.item.type === 'choose') cur.options = shuffle(pick.item.options, Core.rng);
    UI.current = cur;
    UI.answered = null;
  },

  submit(response) {
    if (!UI.current || UI.answered) return;
    const it = UI.current.item;
    const ok = Core.isCorrect(it, response);
    const move = Core.applyAnswer(UI.progress, it, ok, Core.now(), UI.current.ahead);
    Core.save(UI.storage, UI.progress);
    UI.session.answered += 1; if (ok) UI.session.correct += 1;
    if (window.deutschHome) deutschHome.answer(ok);
    UI.answered = { ok, response, move };
    UI.render();
  },

  next() {
    if (!UI.answered) return;
    if (UI.session.answered >= UI.session.goal && !UI.session.done) { UI.session.done = true; UI.render(); return; }
    UI.nextQuestion();
    UI.render();
  },

  continueSession() {
    UI.session = { answered: 0, correct: 0, goal: 20, done: false };
    UI.nextQuestion();
    UI.render();
  },

  setFocus(conceptId) {
    UI.focusConcept = conceptId;
    UI.session = { answered: 0, correct: 0, goal: 20, done: false };
    UI.tab = 'drill';
    UI.nextQuestion();
    UI.render();
  },

  reset() {
    if (typeof window.confirm === 'function' && !window.confirm('Delete all saved progress for this drill? This cannot be undone.')) return;
    UI.progress = Core.newProgress();
    Core.save(UI.storage, UI.progress);
    UI.session = { answered: 0, correct: 0, goal: 20, done: false };
    UI.focusConcept = null;
    UI.nextQuestion();
    UI.render();
  },

  exportProgress() {
    const blob = new Blob([JSON.stringify(UI.progress)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'negation-drill-progress.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },

  importProgress(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const p = JSON.parse(reader.result);
        if (!p || p.version !== 1 || typeof p.items !== 'object') throw new Error('bad');
        UI.progress = p; p.recent = p.recent || []; p.stats = p.stats || { answered: 0, correct: 0 }; p.history = p.history || [];
        Core.save(UI.storage, UI.progress);
        UI.nextQuestion(); UI.render();
      } catch (e) { window.alert('That file is not a progress export from this drill.'); }
    };
    reader.readAsText(file);
  },

  onKey(e) {
    if (UI.tab !== 'drill' || !UI.current) return;
    const tag = (e.target && e.target.tagName) || '';
    if (UI.answered) {
      // a focused button handles Enter / Space itself via click
      if ((e.key === 'Enter' || e.key === ' ') && tag !== 'BUTTON' && tag !== 'INPUT') { e.preventDefault(); UI.next(); }
      return;
    }
    if (tag === 'INPUT') return;
    const it = UI.current.item;
    if (it.type === 'choose' && /^[1-9]$/.test(e.key)) {
      const i = Number(e.key) - 1;
      if (i < UI.current.options.length) { e.preventDefault(); UI.submit(UI.current.options[i]); }
    } else if (it.type === 'place' && /^[0-9]$/.test(e.key)) {
      const n = e.key === '0' ? 10 : Number(e.key);
      if (n - 1 <= it.words.length) { e.preventDefault(); UI.submit(n - 1); }
    }
  },

  // ---- rendering ----
  render() {
    UI.renderHeader();
    document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === UI.tab ? 'true' : 'false'));
    const app = document.getElementById('app');
    if (UI.tab === 'drill') app.innerHTML = UI.renderDrill();
    else if (UI.tab === 'progress') app.innerHTML = UI.renderProgress();
    else app.innerHTML = UI.renderRules();
    UI.bind(app);
  },

  renderHeader() {
    const sm = Core.summary(UI.progress, Core.now());
    document.getElementById('status').textContent = sm.mastered + ' of ' + sm.total + ' mastered · ' + sm.due + ' due · ' + sm.unseen + ' new';
    const bar = document.getElementById('boxbar');
    bar.innerHTML = sm.byBox.map((n, i) => '<span class="b' + i + '" style="width:' + (100 * n / sm.total) + '%"></span>').join('');
    document.getElementById('boxlegend').innerHTML = BOX_LABELS.map((l, i) =>
      '<span><i class="b' + i + '" style="background:' + UI.boxColor(i) + '"></i>' + esc(l) + ' (' + sm.byBox[i] + ')</span>').join('');
  },
  boxColor(i) { return ['var(--line-strong)', '#c9b7ff', '#9dcbff', '#7fdcc6', '#b7e08a', 'var(--ok)'][i]; },

  renderDrill() {
    if (!UI.current) return '<div class="card empty">No questions in this selection.</div>';
    if (UI.session.done) {
      const pct = Math.round(100 * UI.session.correct / Math.max(1, UI.session.answered));
      return '<div class="card"><p class="verdict">Session done: ' + UI.session.correct + ' of ' + UI.session.answered + ' correct (' + pct + '%).</p>' +
        '<p class="explain">Progress is saved. Items you missed are back in box 0 and will come up again soon; correct answers move up one box and wait for their interval.</p>' +
        '<div class="row"><button class="btn" data-act="continue">Keep going</button><button class="btn secondary" data-act="tab-progress">See progress</button></div></div>';
    }
    const it = UI.current.item;
    const st = Core.itemState(UI.progress, it.id);
    const concept = CONCEPT_BY_ID[it.concept];
    const a = UI.answered;
    let h = '<div class="card">';
    h += '<div class="meta"><span>' + esc(concept.group) + ': ' + esc(concept.label) + '</span><span class="box">Box ' + st.box + '/' + BOX_MAX +
      (UI.current.ahead ? ' <span class="badge">practising ahead</span>' : '') + '</span></div>';

    if (it.type === 'choose') {
      h += '<p class="instruction">' + esc(it.instruction) + '</p>';
      h += '<p class="sentence">' + esc(it.positive) + '</p>';
      h += '<div class="options">';
      UI.current.options.forEach((opt, i) => {
        let cls = '';
        if (a) {
          if (opt === a.response) cls = a.ok ? 'picked-ok' : 'picked-bad';
          else if (opt === it.options[it.answer]) cls = 'reveal-ok';
        }
        h += '<button class="' + cls + '" data-opt="' + i + '"' + (a ? ' disabled' : '') + '><span class="key">' + (i + 1) + '</span><span>' + esc(opt) + '</span></button>';
      });
      h += '</div>';
      if (!a) h += '<p class="hint">Keys 1–' + UI.current.options.length + ' choose an answer.</p>';
    } else if (it.type === 'type') {
      h += '<p class="instruction">Fill the blank.</p>';
      h += '<p class="sentence">' + esc(it.sentence).replace('___', '<span class="blank"></span>') + '<span class="cue">' + esc(it.cue) + '</span></p>';
      const cls = a ? (a.ok ? 'ok' : 'bad') : '';
      h += '<div class="typeform"><input id="answer" class="' + cls + '" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ' +
        (a ? 'disabled value="' + esc(a.response) + '"' : 'placeholder="type the missing word(s)"') + '>' +
        (a ? '' : '<button class="btn" data-act="check">Check</button>') + '</div>';
      if (!a) h += '<p class="hint">Enter checks the answer. Capitalisation, ß/ss and ä/ae etc. are not counted as mistakes.</p>';
    } else {
      h += '<p class="instruction">' + esc(it.instruction) + '</p>';
      h += '<p class="gaps">';
      for (let g = 0; g <= it.words.length; g++) {
        let cls = '', label = String(g + 1);
        if (a) {
          if (g === a.response) { cls = a.ok ? 'chosen-ok' : 'chosen-bad'; if (a.ok) label = 'nicht'; }
          else if (g === it.answer) { cls = 'reveal-ok'; label = 'nicht'; }
        }
        h += '<button class="gap ' + cls + '" data-gap="' + g + '"' + (a ? ' disabled' : '') + ' aria-label="gap ' + (g + 1) + '">' + label + '</button>';
        if (g < it.words.length) h += '<span class="w">' + esc(it.words[g]) + '</span>';
      }
      h += '<span class="w">.</span></p>';
      if (!a) h += '<p class="hint">Click the gap, or press its number (0 = gap 10).</p>';
    }

    if (a) {
      const sol = Core.solutionText(it);
      h += '<div class="feedback"><p class="verdict ' + (a.ok ? 'ok' : 'bad') + '">' + (a.ok ? 'Correct.' : 'Not quite.') + '</p>';
      h += '<p class="solution">' + (it.type === 'type' ? esc(it.sentence).replace('___', '<mark>' + esc(it.answers[0]) + '</mark>') : highlight(sol)) + '</p>';
      if (it.type === 'type' && it.answers.length > 1) h += '<p class="explain">Also accepted: ' + esc(it.answers.slice(1).join(', ')) + '</p>';
      h += '<p class="explain">' + esc(it.explanation) + '</p>';
      h += '<p class="move ' + UI.moveClass(a.move) + '">' + esc(UI.moveText(a.move, UI.current.ahead)) + '</p>';
      h += '<div class="row"><button class="btn" data-act="next">Next</button><span class="hint">Enter</span></div></div>';
    }
    h += '</div>';
    h += '<div class="session"><span>Question ' + Math.min(UI.session.answered + (a ? 0 : 1), UI.session.goal) + ' of ' + UI.session.goal +
      ' · ' + UI.session.correct + ' correct</span>' +
      (UI.focusConcept ? '<span>Focus: ' + esc(CONCEPT_BY_ID[UI.focusConcept].label) + ' · <button class="link" data-act="unfocus" style="background:none;border:0;padding:0;text-decoration:underline;color:inherit">drill everything</button></span>' : '') + '</div>';
    return h;
  },

  moveClass(m) { if (m.after.box > m.before.box) return 'up'; if (m.after.box < m.before.box) return 'down'; return 'hold'; },
  moveText(m, ahead) {
    if (m.after.box > m.before.box) {
      return 'Box ' + m.before.box + ' → ' + m.after.box + (m.after.box === BOX_MAX ? ' — mastered. Weekly check from now on.' : ' — comes back in ' + BOX_LABELS[m.after.box] + '.');
    }
    if (m.after.box < m.before.box) return 'Box ' + m.before.box + ' → 0 — back to the start; it will come up again soon.';
    if (ahead && m.after.correct > m.before.correct) return 'Practising ahead: stays in box ' + m.after.box + ' until its interval has passed.';
    return 'Stays in box ' + m.after.box + '.';
  },

  renderProgress() {
    const now = Core.now();
    const sm = Core.summary(UI.progress, now);
    const acc = sm.answered ? Math.round(100 * sm.correct / sm.answered) : 0;
    let h = '<div class="card">';
    h += '<div class="summary">' +
      '<div><b>' + sm.mastered + ' / ' + sm.total + '</b><span>mastered</span></div>' +
      '<div><b>' + sm.due + '</b><span>due now</span></div>' +
      '<div><b>' + sm.unseen + '</b><span>not seen yet</span></div>' +
      '<div><b>' + acc + '%</b><span>accuracy (' + sm.answered + ' answers)</span></div></div>';
    h += '<table class="concepts"><thead><tr><th>Concept</th><th>Boxes</th><th class="num">Mastered</th><th class="num">Accuracy</th><th></th></tr></thead><tbody>';
    let lastGroup = null;
    for (const c of CONCEPTS) {
      const s = sm.byConcept[c.id];
      if (c.group !== lastGroup) { h += '<tr><td colspan="5" style="color:var(--muted);padding-top:14px">' + esc(c.group) + '</td></tr>'; lastGroup = c.group; }
      const accC = s.answered ? Math.round(100 * s.correct / s.answered) + '%' : '–';
      h += '<tr><td>' + esc(c.label) + '</td><td><div class="mini">' + s.boxes.map((n, i) => '<span style="width:' + (100 * n / s.total) + '%;background:' + UI.boxColor(i) + '"></span>').join('') + '</div></td>' +
        '<td class="num">' + s.mastered + ' / ' + s.total + '</td><td class="num">' + accC + '</td>' +
        '<td><button class="link" data-focus="' + c.id + '">drill</button></td></tr>';
    }
    h += '</tbody></table>';
    h += '<div class="row" style="margin-top:18px"><button class="btn secondary small" data-act="export">Export progress</button>' +
      '<label class="btn secondary small" style="display:inline-block">Import<input type="file" accept="application/json" id="importfile" style="display:none"></label>' +
      '<span class="spacer"></span><button class="btn danger small" data-act="reset">Reset progress</button></div>';
    h += '<p class="hint">Mastery = box 5: five correct answers in a row, spaced 10 min → 1 h → 1 day → 3 days apart. One mistake sends the item back to box 0. Mastered items get a check every 7 days.</p>';
    h += '</div>';
    return h;
  },

  renderRules() {
    return '<div class="card rules">' + RULES_HTML + '</div>';
  },

  bind(app) {
    app.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => UI.submit(UI.current.options[Number(b.dataset.opt)])));
    app.querySelectorAll('[data-gap]').forEach(b => b.addEventListener('click', () => UI.submit(Number(b.dataset.gap))));
    const input = app.querySelector('#answer');
    if (input) {
      if (!UI.answered) setTimeout(() => input.focus(), 0);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (!UI.answered) UI.submit(input.value); } });
    }
    app.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
      const act = b.dataset.act;
      if (act === 'check') UI.submit(app.querySelector('#answer').value);
      else if (act === 'next') UI.next();
      else if (act === 'continue') UI.continueSession();
      else if (act === 'tab-progress') UI.showTab('progress');
      else if (act === 'unfocus') UI.setFocus(null);
      else if (act === 'reset') UI.reset();
      else if (act === 'export') UI.exportProgress();
    }));
    app.querySelectorAll('[data-focus]').forEach(b => b.addEventListener('click', () => UI.setFocus(b.dataset.focus)));
    const imp = app.querySelector('#importfile');
    if (imp) imp.addEventListener('change', () => { if (imp.files && imp.files[0]) UI.importProgress(imp.files[0]); });
    const nextBtn = app.querySelector('[data-act="next"]');
    if (nextBtn) setTimeout(() => nextBtn.focus(), 0);
  },
};

// ---------------------------------------------------------------------------
// Rules (from the notes)
// ---------------------------------------------------------------------------
const RULES_HTML = `
<h2>kein or nicht?</h2>
<table><thead><tr><th>In front of a noun with …</th><th>Use</th><th>Example</th></tr></thead><tbody>
<tr><td>ein / eine / einen</td><td>kein</td><td class="de">Ich habe ein Auto. → Ich habe <b>kein</b> Auto.</td></tr>
<tr><td>nothing (plural)</td><td>kein</td><td class="de">Ich habe Geschwister. → Ich habe <b>keine</b> Geschwister.</td></tr>
<tr><td>nothing (mass / abstract noun)</td><td>kein</td><td class="de">Ich trinke Kaffee. → Ich trinke <b>keinen</b> Kaffee.</td></tr>
<tr><td>a definite / specific determiner (der-, dies-, mein-)</td><td>nicht</td><td class="de">Ich kenne den Mann <b>nicht</b>.<br>Ich finde meinen Schlüssel <b>nicht</b>.<br>Ich nehme diesen Zug <b>nicht</b>.</td></tr>
<tr><td>a name or pronoun</td><td>nicht</td><td class="de">Ich kenne Berlin <b>nicht</b>. / Ich sehe ihn <b>nicht</b>.</td></tr>
<tr><td>not negating a noun</td><td>nicht</td><td class="de">Ich komme <b>nicht</b>.</td></tr>
</tbody></table>

<h2>1. The zero-article cases</h2>
<p>The article is dropped in these situations, which take <b>kein</b> — except fixed verb + noun collocations.</p>
<table><thead><tr><th>Type</th><th>Positive</th><th>Negative</th></tr></thead><tbody>
<tr><td>Plural</td><td class="de">Ich habe Kinder.</td><td class="de">Ich habe <b>keine</b> Kinder.</td></tr>
<tr><td>Mass noun</td><td class="de">Wir haben Milch.</td><td class="de">Wir haben <b>keine</b> Milch.</td></tr>
<tr><td>Abstract noun</td><td class="de">Ich habe Zeit / Lust / Ahnung / Angst.</td><td class="de">Ich habe <b>keine</b> Zeit / Lust / Ahnung / Angst.</td></tr>
<tr><td>Profession, nationality, religion</td><td class="de">Er ist Ingenieur.</td><td class="de">Er ist <b>kein</b> Ingenieur. (nicht only in contrast: nicht Ingenieur, <b>sondern</b> Architekt)</td></tr>
<tr><td>Verb + bare noun collocation</td><td class="de">Ich spiele Klavier. / Ich fahre Auto.</td><td class="de">Ich spiele <b>nicht</b> Klavier. / Ich fahre <b>nicht</b> Auto. (but languages: Ich spreche <b>kein</b> Deutsch.)</td></tr>
</tbody></table>

<h2>2. Where does nicht go?</h2>
<p>nicht goes as far right as possible, but <em>before</em>:</p>
<table><tbody>
<tr><td>Separable prefix</td><td class="de">Ich rufe dich <b>nicht</b> an.</td></tr>
<tr><td>Infinitive</td><td class="de">Ich kann heute <b>nicht</b> kommen.</td></tr>
<tr><td>Past participle</td><td class="de">Ich habe das Buch <b>nicht</b> gelesen.</td></tr>
<tr><td>Predicate adjective (sein / werden / bleiben)</td><td class="de">Der Kaffee ist <b>nicht</b> heiß.</td></tr>
<tr><td>Predicate noun</td><td class="de">Er wird <b>nicht</b> Arzt, sondern Lehrer. (plain: Er wird <b>kein</b> Arzt.)</td></tr>
<tr><td>Verb-bound preposition</td><td class="de">Er wartet <b>nicht</b> auf mich.</td></tr>
<tr><td>Direction / place complement</td><td class="de">Ich fahre <b>nicht</b> nach Berlin.</td></tr>
<tr><td>Final verb in a subordinate clause</td><td class="de">…, weil ich ihn <b>nicht</b> kenne.</td></tr>
</tbody></table>
<p>nicht always comes <em>after</em>:</p>
<ul>
<li>Pronouns: <span class="de">Ich gebe es ihm <b>nicht</b>.</span></li>
<li>Definite objects: <span class="de">Ich mag den Film <b>nicht</b>.</span></li>
<li>Definite time expressions: <span class="de">Ich arbeite heute <b>nicht</b>.</span></li>
</ul>
<p>Ordering shortcut: Temporal → Kausal → <b>nicht</b> → Modal → Lokal.</p>
<ul>
<li><span class="de">Ich gehe heute <b>nicht</b> ins Kino.</span></li>
<li><span class="de">Ich bin gestern <b>nicht</b> mit dem Rad gefahren.</span></li>
<li><span class="de">Ich komme wegen der Arbeit <b>nicht</b>.</span></li>
<li>But a free (non-directional) place adjunct comes <em>before</em> nicht: <span class="de">Ich habe ihn in Berlin <b>nicht</b> getroffen.</span></li>
</ul>

<h2>3. Partial negation</h2>
<p>To contradict one specific word rather than the whole sentence, put nicht <em>directly in front of that word</em>. Usually completed with sondern.</p>
<ul>
<li><span class="de">Ich fahre <b>nicht</b> heute nach Berlin, sondern morgen.</span> (not today)</li>
<li><span class="de">Ich fahre heute <b>nicht</b> nach Berlin.</span> (not going at all)</li>
<li><span class="de"><b>Nicht</b> ich habe das gesagt, sondern er.</span></li>
<li><span class="de">Er hat <b>nicht</b> das Auto gekauft, sondern das Fahrrad.</span></li>
</ul>

<h2>4. The overlap zone: nicht ein</h2>
<p><b>nicht ein</b> exists, but only for emphasis ("not a single") or explicit contrast.</p>
<ul>
<li><span class="de">Ich habe <b>nicht ein</b> Wort verstanden.</span> (not one single word)</li>
<li><span class="de">Das ist <b>nicht ein</b> Problem, sondern zehn.</span></li>
</ul>

<h2>5. The wider negation family</h2>
<table><thead><tr><th>Word</th><th>Meaning</th><th>Example</th></tr></thead><tbody>
<tr><td>nichts</td><td>nothing</td><td class="de">Ich habe <b>nichts</b> gesagt.</td></tr>
<tr><td>niemand</td><td>nobody</td><td class="de"><b>Niemand</b> war da.</td></tr>
<tr><td>keiner / keine / keins</td><td>none (pronoun)</td><td class="de">Ich habe <b>keins</b>.</td></tr>
<tr><td>nie / niemals</td><td>never</td><td class="de">Ich war <b>nie</b> in Italien.</td></tr>
<tr><td>nirgendwo / nirgends</td><td>nowhere</td><td class="de">Ich finde ihn <b>nirgendwo</b>.</td></tr>
<tr><td>noch nicht</td><td>not yet</td><td class="de">Er ist <b>noch nicht</b> da.</td></tr>
<tr><td>noch kein</td><td>not yet a / any</td><td class="de">Ich habe <b>noch kein</b> Ticket.</td></tr>
<tr><td>nicht mehr</td><td>no longer</td><td class="de">Ich rauche <b>nicht mehr</b>.</td></tr>
<tr><td>kein … mehr</td><td>no more</td><td class="de">Ich habe <b>kein</b> Geld <b>mehr</b>.</td></tr>
<tr><td>gar / überhaupt nicht</td><td>not at all</td><td class="de">Das gefällt mir <b>gar nicht</b>.</td></tr>
<tr><td>gar kein</td><td>none at all</td><td class="de">Ich habe <b>gar keine</b> Zeit.</td></tr>
<tr><td>nicht einmal</td><td>not even</td><td class="de">Er hat <b>nicht einmal</b> angerufen.</td></tr>
<tr><td>weder … noch</td><td>neither … nor</td><td class="de"><b>Weder</b> Tee <b>noch</b> Kaffee.</td></tr>
</tbody></table>
`;

window.NegationDrill = { BANK, CONCEPTS, Core, UI, STORAGE_KEY, BOX_MAX, INTERVALS_MIN, RECENT_WINDOW, highlight, esc };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', UI.init);
else UI.init();
