<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Prepositions — Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Präpositionen drill — styles */
:root {
  --bg: #F5F7FA; --surface: #FFFFFF; --ink: #1B1F27; --muted: #5C6370; --faint: #8A919E; --line: #D9DEE6; --line-strong: #B9C1CC;
  --akk: #D9480F; --dat: #2457D6; --gen: #0E7C7B; --two: #7E3AF2;
  --ok: #1E8449; --ok-bg: #E7F5EC; --bad: #B4234B; --bad-bg: #FBE9EE; --warn-bg: #FFF4D6; --warn: #7A5A00;
  --serif: 'Literata', Georgia, 'Times New Roman', serif;
  --sans: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
#app { max-width: 640px; margin: 0 auto; padding: 20px 20px 64px; }
a { color: var(--dat); }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; line-height: 1.2; margin: 0; }
h1 { font-size: 30px; letter-spacing: -0.01em; }
h2 { font-size: 22px; margin: 28px 0 10px; }
h3 { font-size: 17px; margin: 18px 0 6px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.de { font-family: var(--serif); }

/* top bar */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.top h1 { font-size: 22px; }
.top h1 span { color: var(--faint); font-weight: 400; }
.nav { display: flex; gap: 4px; }
.nav button { background: none; border: 0; padding: 6px 10px; border-radius: 6px; color: var(--muted); font-size: 14px; }
.nav button:hover { background: #E9EDF3; color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 600; background: #E9EDF3; }

/* notices */
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 0 0 14px; }
.notice.error { background: var(--bad-bg); color: var(--bad); }
.notice.ok { background: var(--ok-bg); color: var(--ok); }

/* hero */
.hero { margin: 8px 0 22px; }
.hero svg { width: 100%; height: auto; display: block; }
.hero .legend { display: flex; gap: 18px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.hero .legend b { font-weight: 600; }
.dat-t { color: var(--dat); } .akk-t { color: var(--akk); } .gen-t { color: var(--gen); } .two-t { color: var(--two); }

/* mastery bar */
.mbar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: #E3E7EE; margin: 6px 0; }
.mbar span { display: block; height: 100%; }
.mbar .b0 { background: #E3E7EE; } .mbar .b1 { background: #C9D2E3; } .mbar .b2 { background: #A9B9D6; } .mbar .b3 { background: #7F98C6; } .mbar .b4 { background: #4F73B8; } .mbar .b5 { background: var(--ok); }
.mbar.small { height: 8px; border-radius: 4px; margin: 4px 0 0; }
.stat-row { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); }
.stat-row b { color: var(--ink); font-weight: 600; }

/* controls */
.controls { display: grid; grid-template-columns: 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 16px 0; }
.ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl label { font-size: 13px; color: var(--muted); min-width: 56px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 6px 12px; font-size: 14px; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.btn { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 14px; font-size: 14px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #000; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.link { border: 0; background: none; color: var(--dat); padding: 4px 6px; }
.btn:disabled { opacity: .45; cursor: default; }
.mode-help { font-size: 13px; color: var(--muted); }

/* concept list */
.concepts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.concept { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.concept .name { font-family: var(--serif); font-size: 17px; }
.concept .blurb { font-size: 13px; color: var(--muted); grid-column: 1 / -1; }
.concept .counts { font-size: 13px; color: var(--muted); }
.concept .mbar { grid-column: 1 / -1; }
.concept .focus { justify-self: end; }

/* session */
.sess-top { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.sess-top .pos { font-variant-numeric: tabular-nums; }
.pbar { height: 4px; background: #E3E7EE; border-radius: 2px; overflow: hidden; margin-bottom: 22px; }
.pbar span { display: block; height: 100%; background: var(--ink); transition: width .2s; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 22px 18px; }
.card .instr { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.card .instr .tag { display: inline-block; font-size: 11px; letter-spacing: .02em; color: var(--faint); margin-left: 6px; }
.card .gloss { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
.prompt { font-family: var(--serif); font-size: 24px; line-height: 1.55; margin: 6px 0 16px; word-wrap: break-word; }
.prompt .blank { display: inline-block; min-width: 3ch; border-bottom: 2px solid var(--line-strong); height: 1em; vertical-align: -0.1em; margin: 0 2px; }
.prompt .blank.filled { border-bottom-color: var(--ink); }
.fill { font: inherit; color: var(--ink); background: #F5F7FA; border: 0; border-bottom: 2px solid var(--ink); border-radius: 4px 4px 0 0; padding: 0 6px; margin: 0 2px; min-width: 3ch; outline: none; text-align: center; line-height: 1.3; }
.fill:focus { background: #EEF3FF; border-bottom-color: var(--dat); }
.fill.bad { background: var(--bad-bg); border-bottom-color: var(--bad); color: var(--bad); }
.fill.good { background: var(--ok-bg); border-bottom-color: var(--ok); color: var(--ok); }
.fill.wide { text-align: left; width: 100%; max-width: 100%; margin: 6px 0 0; display: block; font-size: 22px; padding: 4px 8px; }
.prompt .arrow { color: var(--faint); margin: 0 .3em; }
.choices { list-style: none; padding: 0; margin: 4px 0 12px; display: grid; gap: 8px; }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 12px; font-family: var(--serif); font-size: 18px; }
.choice:hover { border-color: var(--ink); }
.choice .key { font-family: var(--sans); font-size: 12px; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.choice[aria-pressed="true"] { border-color: var(--ink); background: #F0F3F8; }
.choice.good { border-color: var(--ok); background: var(--ok-bg); }
.choice.bad { border-color: var(--bad); background: var(--bad-bg); }
.choice:disabled { cursor: default; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.actions .spacer { flex: 1; }
.kbd { font-size: 12px; color: var(--faint); }
.kbd kbd { font-family: var(--sans); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }
.feedback { border-radius: 8px; padding: 12px 14px; margin: 14px 0 0; font-size: 15px; }
.feedback.good { background: var(--ok-bg); color: #145A32; }
.feedback.bad { background: var(--bad-bg); color: #7A1633; }
.feedback .verdict { font-weight: 600; }
.feedback .answer { font-family: var(--serif); font-size: 20px; margin: 4px 0; }
.feedback .answer .alt { font-size: 15px; color: var(--muted); font-family: var(--sans); }
.feedback .explain { color: var(--ink); margin-top: 6px; }
.feedback .box { font-size: 13px; color: var(--muted); margin-top: 6px; }
.feedback .box .up { color: var(--ok); } .feedback .box .down { color: var(--bad); }

/* summary */
.big { font-family: var(--serif); font-size: 40px; line-height: 1.1; margin: 8px 0 2px; }
.missed { list-style: none; padding: 0; margin: 8px 0 0; border-top: 1px solid var(--line); }
.missed li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.missed .p { font-family: var(--serif); font-size: 17px; }
.missed .a { font-size: 14px; color: var(--muted); }
.missed .a b { color: var(--ok); font-family: var(--serif); font-weight: 500; }

/* progress */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 8px 0 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile .v { font-family: var(--serif); font-size: 24px; }
.tile .k { font-size: 12px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; }
.boxes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 8px 0 14px; }
.boxes .col { text-align: center; font-size: 12px; color: var(--muted); }
.boxes .bar { height: 60px; display: flex; align-items: flex-end; margin-bottom: 4px; }
.boxes .bar span { display: block; width: 100%; background: #A9B9D6; border-radius: 3px 3px 0 0; min-height: 2px; }
.boxes .col:last-child .bar span { background: var(--ok); }
.boxes .n { color: var(--ink); font-weight: 600; }
.io { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; align-items: center; }
textarea.io-text { width: 100%; min-height: 80px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; }

/* rules */
.rules h2 { margin-top: 30px; }
.rules table td:first-child { font-family: var(--serif); font-size: 16px; white-space: nowrap; }
.rules .grp { margin: 8px 0 12px; }
.rules .grp b { font-family: var(--serif); font-weight: 500; font-size: 17px; }
.rules .list { font-family: var(--serif); font-size: 17px; }
.rules .en { color: var(--muted); font-size: 13px; }
.rules ul { padding-left: 18px; margin: 4px 0 10px; }
.rules li { margin: 2px 0; }
.pill { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; color: #fff; vertical-align: middle; margin-left: 4px; }
.pill.A { background: var(--akk); } .pill.D { background: var(--dat); } .pill.G { background: var(--gen); } .pill.W { background: var(--two); }

@media (max-width: 480px) {
  #app { padding: 14px 14px 56px; }
  .prompt { font-size: 21px; }
  .top h1 { font-size: 19px; }
}

</style>
</head>
<body>
<div id="app"></div>
<script id="data">
/* Präpositionen drill — data bank.
   Everything German here is hand-written from the notes "German 16: Prepositions & Verbs with Fixed Prepositions".
   Object specs: { det, g, n, nomN?, adj?, nomAdj?, pron? }
     det  : 'der' (definite) or an ein-word base ('ein','kein','mein','dein','sein','ihr','unser','euer','Ihr')
     g    : 'm' | 'f' | 'n' | 'p'
     n    : noun as it appears in the sentence (may be dative-plural / genitive / weak form)
     nomN : nominative noun form when it differs from n
     adj  : adjective as it appears in the sentence (not drilled)
     pron : personal pronoun in nominative ('ich','du','er','sie','es','wir','ihr','sie-pl','Sie')
*/
(function (root) {
'use strict';

const CASE_NAME = { A: 'Akkusativ', D: 'Dativ', G: 'Genitiv', W: 'Akkusativ or Dativ' };

// ---------- 1. Prepositions by case ----------
const PREPS = [
  { p: 'durch', c: 'A', en: 'through' },
  { p: 'für', c: 'A', en: 'for' },
  { p: 'gegen', c: 'A', en: 'against; around (time)' },
  { p: 'ohne', c: 'A', en: 'without' },
  { p: 'um', c: 'A', en: 'around; at (clock time)' },
  { p: 'bis', c: 'A', en: 'until' },
  { p: 'entlang', c: 'A', en: 'along (after the noun)' },
  { p: 'aus', c: 'D', en: 'from, out of' },
  { p: 'bei', c: 'D', en: 'at (a person / company), near' },
  { p: 'mit', c: 'D', en: 'with; by (transport)' },
  { p: 'nach', c: 'D', en: 'to (places); after' },
  { p: 'seit', c: 'D', en: 'since, for (still ongoing)' },
  { p: 'von', c: 'D', en: 'from, of' },
  { p: 'zu', c: 'D', en: 'to (people / places)' },
  { p: 'ab', c: 'D', en: 'from ... on' },
  { p: 'gegenüber', c: 'D', en: 'opposite' },
  { p: 'wegen', c: 'G', en: 'because of' },
  { p: 'während', c: 'G', en: 'during' },
  { p: 'trotz', c: 'G', en: 'despite' },
  { p: 'statt', c: 'G', en: 'instead of' },
  { p: 'anstatt', c: 'G', en: 'instead of' },
  { p: 'an', c: 'W', en: 'at, on (vertical surface)' },
  { p: 'auf', c: 'W', en: 'on (top of)' },
  { p: 'hinter', c: 'W', en: 'behind' },
  { p: 'in', c: 'W', en: 'in, into' },
  { p: 'neben', c: 'W', en: 'next to' },
  { p: 'über', c: 'W', en: 'above, over' },
  { p: 'unter', c: 'W', en: 'under' },
  { p: 'vor', c: 'W', en: 'in front of; before' },
  { p: 'zwischen', c: 'W', en: 'between' },
];

// Article drills: [prep, det, gender, noun in sentence, nominative noun (if different), adj (optional)]
const CASE_PHRASES = [
  ['durch', 'der', 'm', 'Park'], ['durch', 'der', 'f', 'Stadt'], ['durch', 'der', 'n', 'Fenster'],
  ['für', 'mein', 'm', 'Bruder'], ['für', 'der', 'p', 'Kinder'], ['für', 'ein', 'n', 'Geschenk'],
  ['gegen', 'der', 'f', 'Wand'], ['gegen', 'der', 'm', 'Baum'], ['gegen', 'der', 'n', 'Gesetz'],
  ['ohne', 'ein', 'm', 'Schirm'], ['ohne', 'mein', 'f', 'Brille'], ['ohne', 'der', 'p', 'Kinder'],
  ['um', 'der', 'f', 'Ecke'], ['um', 'der', 'm', 'See'], ['um', 'der', 'n', 'Haus'],
  ['entlang', 'der', 'f', 'Straße'], ['entlang', 'der', 'm', 'Fluss'],
  ['aus', 'der', 'f', 'Schweiz'], ['aus', 'der', 'n', 'Haus'], ['aus', 'der', 'm', 'Garten'],
  ['bei', 'mein', 'm', 'Bruder'], ['bei', 'der', 'f', 'Arbeit'], ['bei', 'der', 'p', 'Nachbarn'],
  ['mit', 'der', 'n', 'Auto'], ['mit', 'mein', 'f', 'Freundin'], ['mit', 'der', 'p', 'Kindern', 'Kinder'],
  ['nach', 'der', 'f', 'Arbeit'], ['nach', 'der', 'n', 'Essen'], ['nach', 'der', 'm', 'Unterricht'],
  ['seit', 'ein', 'n', 'Jahr'], ['seit', 'ein', 'f', 'Woche'], ['seit', 'der', 'm', 'Sommer'],
  ['von', 'mein', 'f', 'Mutter'], ['von', 'der', 'm', 'Chef'], ['von', 'der', 'p', 'Eltern'],
  ['zu', 'der', 'm', 'Arzt'], ['zu', 'der', 'f', 'Arbeit'], ['zu', 'mein', 'p', 'Eltern'],
  ['ab', 'der', 'm', 'Januar', null, '1.', '1.'], ['ab', 'der', 'n', 'Wochenende'], ['ab', 'der', 'm', 'Monat', null, 'nächsten', 'nächste'],
  ['gegenüber', 'der', 'm', 'Bahnhof'], ['gegenüber', 'der', 'f', 'Kirche'], ['gegenüber', 'mein', 'f', 'Wohnung'],
  ['wegen', 'der', 'n', 'Wetters', 'Wetter'], ['wegen', 'der', 'f', 'Arbeit'], ['wegen', 'der', 'm', 'Regens', 'Regen'],
  ['während', 'der', 'n', 'Essens', 'Essen'], ['während', 'der', 'f', 'Woche'], ['während', 'der', 'm', 'Unterrichts', 'Unterricht'],
  ['trotz', 'der', 'm', 'Regens', 'Regen'], ['trotz', 'der', 'f', 'Kälte'], ['trotz', 'der', 'n', 'Wetters', 'Wetter'],
  ['statt', 'ein', 'n', 'Buches', 'Buch'], ['statt', 'ein', 'f', 'Antwort'], ['statt', 'ein', 'm', 'Briefes', 'Brief'],
];

// Pronoun drills: [prep, pronoun]
const CASE_PRONOUNS = [
  ['ohne', 'ich'], ['für', 'du'], ['gegen', 'er'], ['um', 'sie-pl'], ['durch', 'wir'], ['ohne', 'ihr'], ['für', 'Sie'],
  ['mit', 'du'], ['von', 'ich'], ['bei', 'er'], ['zu', 'wir'], ['nach', 'sie'], ['gegenüber', 'Sie'], ['mit', 'ihr'], ['zu', 'sie'], ['bei', 'sie-pl'], ['von', 'er'],
];

// ---------- 1.4 Two-way prepositions ----------
// { p, det, g, n, nD? (dative form if different), pos, mov, pv?: [correct, distractor], mv?: [correct, distractor] }
const WECHSEL = [
  { p: 'in', det: 'der', g: 'f', n: 'Ecke', pos: 'Die Lampe steht in der Ecke.', mov: 'Ich stelle die Lampe in die Ecke.', pv: ['steht', 'stellt'], mv: ['stelle', 'stehe'] },
  { p: 'auf', det: 'der', g: 'm', n: 'Tisch', pos: 'Der Schlüssel liegt auf dem Tisch.', mov: 'Ich lege den Schlüssel auf den Tisch.', pv: ['liegt', 'legt'], mv: ['lege', 'liege'] },
  { p: 'auf', det: 'der', g: 'n', n: 'Sofa', pos: 'Er sitzt auf dem Sofa.', mov: 'Er setzt sich auf das Sofa.', pv: ['sitzt', 'setzt'], mv: ['setzt', 'sitzt'] },
  { p: 'an', det: 'der', g: 'f', n: 'Wand', pos: 'Das Bild hängt an der Wand.', mov: 'Ich hänge das Bild an die Wand.' },
  { p: 'in', det: 'der', g: 'm', n: 'Umschlag', pos: 'Der Brief steckt im Umschlag.', mov: 'Ich stecke den Brief in den Umschlag.' },
  { p: 'in', det: 'der', g: 'n', n: 'Regal', pos: 'Die Bücher stehen im Regal.', mov: 'Ich stelle die Bücher ins Regal.', pv: ['stehen', 'stellen'], mv: ['stelle', 'stehe'] },
  { p: 'in', det: 'der', g: 'm', n: 'Schrank', pos: 'Die Jacke hängt im Schrank.', mov: 'Ich hänge die Jacke in den Schrank.' },
  { p: 'in', det: 'der', g: 'f', n: 'Schublade', pos: 'Das Handy liegt in der Schublade.', mov: 'Ich lege das Handy in die Schublade.', pv: ['liegt', 'legt'], mv: ['lege', 'liege'] },
  { p: 'unter', det: 'der', g: 'n', n: 'Bett', pos: 'Die Katze schläft unter dem Bett.', mov: 'Die Katze kriecht unter das Bett.' },
  { p: 'vor', det: 'der', g: 'n', n: 'Sofa', pos: 'Der Teppich liegt vor dem Sofa.', mov: 'Ich lege den Teppich vor das Sofa.', pv: ['liegt', 'legt'], mv: ['lege', 'liege'] },
  { p: 'hinter', det: 'der', g: 'n', n: 'Haus', pos: 'Das Auto steht hinter dem Haus.', mov: 'Er fährt das Auto hinter das Haus.', pv: ['steht', 'stellt'] },
  { p: 'über', det: 'der', g: 'm', n: 'Tisch', pos: 'Die Lampe hängt über dem Tisch.', mov: 'Ich hänge die Lampe über den Tisch.' },
  { p: 'neben', det: 'der', g: 'n', n: 'Fenster', pos: 'Der Stuhl steht neben dem Fenster.', mov: 'Ich stelle den Stuhl neben das Fenster.', pv: ['steht', 'stellt'], mv: ['stelle', 'stehe'] },
  { p: 'zwischen', det: 'der', g: 'p', n: 'Eltern', pos: 'Das Kind sitzt zwischen den Eltern.', mov: 'Das Kind setzt sich zwischen die Eltern.', pv: ['sitzt', 'setzt'], mv: ['setzt', 'sitzt'] },
  { p: 'in', det: 'der', g: 'n', n: 'Kino', pos: 'Wir sind im Kino.', mov: 'Wir gehen ins Kino.' },
  { p: 'in', det: 'der', g: 'n', n: 'Büro', pos: 'Sie arbeitet im Büro.', mov: 'Sie geht ins Büro.' },
  { p: 'in', det: 'der', g: 'm', n: 'Garten', pos: 'Die Kinder spielen im Garten.', mov: 'Ich schicke die Kinder in den Garten.' },
  { p: 'in', det: 'der', g: 'f', n: 'Küche', pos: 'Ich bin in der Küche.', mov: 'Ich gehe in die Küche.' },

function o(det, g, n, extra) { return Object.assign({ det: det, g: g, n: n }, extra || {}); }
function pr(pron) { return { pron: pron }; }
function bare(n, adj) { return { det: null, g: null, n: n, adj: adj || null }; }

// ---------- answer checking ----------

// ---------- Leitner scheduler ----------
const MIN = 60 * 1000, HOUR = 60 * MIN, DAY = 24 * HOUR;

// ---------- state ----------

    write: function (s) { mem = s; if (!ok) return; try { root.localStorage.setItem(C.STORAGE_KEY, s); } catch (e) { ok = false; } },

let state = load();

const app = { view: 'home', mode: 'practice', concept: null, session: null, phase: 'ask', picked: null, last: null, notice: null, ioMsg: null, confirmReset: false, showExport: false, clock: null };
function now() { return app.clock ? app.clock() : Date.now(); }

// ---------- helpers ----------
function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pct(a, b) { return b ? Math.round(100 * a / b) + '%' : '–'; }
function el() { return doc.getElementById('app'); }
function qs(sel) { return el().querySelector(sel); }
function qsa(sel) { return Array.prototype.slice.call(el().querySelectorAll(sel)); }
function conceptName(id) { return C.CONCEPT_BY_ID[id] ? C.CONCEPT_BY_ID[id].name : id; }
function modeName(m) { return m === 'exam' ? 'Exam' : m === 'weak' ? 'Weak spots' : 'Practice'; }
function isFill(ans) { return ans.indexOf('→') < 0; } // choice options like 'Wo? → Dativ' are labels, not text for the blank
function fillBlanks(prompt, answer) {
  // render the prompt with the answer written into its blanks (for summaries)
  const parts = prompt.split('___');
  if (parts.length === 1) return h(prompt);

  const toks = answer.split(' ');
  const perBlank = parts.length - 1 === toks.length ? toks : [answer];
  let out = '';
  for (let i = 0; i < parts.length; i++) { out += h(parts[i]); if (i < parts.length - 1) out += '<b>' + h(perBlank[i] != null ? perBlank[i] : '') + '</b>'; }

}

function streak(days, t) {
  let n = 0; const d = new Date(t); d.setHours(12, 0, 0, 0);
  if (!days[C.dayKey(d.getTime())]) d.setDate(d.getDate() - 1); // a streak may still be alive if today has no session yet
  while (days[C.dayKey(d.getTime())]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// ---------- hero: the nine two-way prepositions around a box ----------

// ---------- session flow ----------
function startSession(mode, concept) {
  mode = mode || app.mode; concept = concept === undefined ? app.concept : concept;
  const n = mode === 'exam' ? EXAM_LENGTH : state.length;
  const s = C.buildSession(ITEMS, state.items, mode, n, now(), null, concept);
  if (s.note) { app.notice = s.note; app.view = 'home'; render(); return false; }
  if (!s.queue.length) { app.notice = 'Nothing to practise here yet.'; app.view = 'home'; render(); return false; }
  app.notice = null;
  app.session = { queue: s.queue, pos: 0, mode: mode, concept: concept || null, answered: 0, correct: 0, missed: [], counted: false, changes: { up: 0, mastered: 0, reset: 0, early: 0 }, startedAt: now(), counts: s.counts || null };
  app.view = 'session'; app.phase = 'ask'; app.picked = null; app.last = null;
  render();
  return true;
}
function currentItem() { const s = app.session; return s && s.queue[s.pos]; }
function readInput() {
  const inputs = qsa('input.fill');
  return inputs.map(function (i) { return i.value.trim(); }).join(' ').trim();
}
function submit(inputOverride) {
  const it = currentItem(); if (!it || app.phase !== 'ask') return;
  let res;
  if (it.kind === 'choice') {
    if (app.picked == null) return;
    res = C.check(it, app.picked, state.strict);
    res.input = it.options[app.picked];
  } else {
    const input = inputOverride != null ? inputOverride : readInput();
    res = C.check(it, input, state.strict);
    res.input = input;
    if (res.empty) { const f = qs('input.fill'); if (f) f.focus(); return; }
  }
  gradeAnswer(it, res, false);
}
function reveal() {
  const it = currentItem(); if (!it || app.phase !== 'ask' || app.session.mode === 'exam') return;
  gradeAnswer(it, { ok: false, canonical: it.answers[0], input: it.kind === 'choice' ? null : readInput() }, true);
}
function gradeAnswer(it, res, revealed) {
  const s = app.session; const t = now();
  const g = C.grade(state.items[it.id], res.ok, t); state.items[it.id] = g.st;
  const dk = C.dayKey(t); const day = state.days[dk] || (state.days[dk] = { ok: 0, miss: 0 }); if (res.ok) day.ok++; else day.miss++;
  if (!s.counted) { s.counted = true; state.sessions++; }
  s.answered++;
  if (res.ok) s.correct++; else {
    if (s.missed.indexOf(it.id) < 0) s.missed.push(it.id);
    if (s.mode !== 'exam') C.requeue(s.queue, s.pos, it);
  }
  s.changes[g.change === 'keep' ? 'up' : g.change]++;
  if (window.deutschHome) deutschHome.answer(res.ok);
  app.last = { ok: res.ok, canonical: res.canonical, umlaut: !!res.umlaut, input: res.input, revealed: revealed, change: g.change, box: g.st.box, due: g.st.due - t };
  app.phase = 'feedback';
  save(); render();
}
function next() {
  const s = app.session; if (!s || app.phase !== 'feedback') return;
  s.pos++; app.picked = null; app.last = null;
  if (s.pos >= s.queue.length) { app.view = 'summary'; app.phase = 'done'; }
  else app.phase = 'ask';
  render();
}
function endSession() {
  const s = app.session; if (!s) return;
  if (!s.answered) { app.session = null; app.view = 'home'; }
  else { app.view = 'summary'; app.phase = 'done'; }
  render();
}
function setView(v) { app.view = v; app.ioMsg = null; app.confirmReset = false; app.showExport = false; render(); }

// ---------- keyboard ----------
doc.addEventListener('keydown', function (e) {
  if (app.view !== 'session') return;
  const it = currentItem(); if (!it) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'BUTTON' || tag === 'A') return; // buttons handle Enter / Space themselves (Reveal / Next / End)
  if (e.key === 'Enter') {
    e.preventDefault();
    if (app.phase === 'feedback') { next(); return; }
    if (e.shiftKey) { reveal(); return; }
    if (it.kind === 'type') {
      const inputs = qsa('input.fill');
      if (inputs.length > 1) { // two blanks: Enter in a filled first blank jumps to an empty second one
        const idx = inputs.indexOf(e.target);
        const empty = inputs.findIndex(function (i) { return !i.value.trim(); });
        if (empty >= 0 && empty !== idx && inputs[idx] && inputs[idx].value.trim()) { inputs[empty].focus(); return; }
      }
      submit(); return;
    }
    if (it.kind === 'choice' && app.picked != null) submit();
    return;
  }
  if (e.key === 'Escape') { e.preventDefault(); endSession(); return; }
  if (app.phase !== 'ask' || tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (it.kind === 'choice' && /^[1-9]$/.test(e.key)) { const n = +e.key - 1; if (n < it.options.length) { e.preventDefault(); app.picked = n; submit(); } }
});

// ---------- click delegation ----------
function bindClicks() {
  el().addEventListener('click', function (e) {
    const b = e.target.closest ? e.target.closest('[data-act]') : null; if (!b) return;
    const act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
    if (act === 'view') setView(v);
    else if (act === 'mode') { app.mode = v; app.notice = null; render(); }
    else if (act === 'len') { state.length = +v; save(); render(); }
    else if (act === 'start') startSession(app.mode, null);
    else if (act === 'focus') startSession('practice', v);
    else if (act === 'again') startSession(app.session ? app.session.mode : app.mode, app.session ? app.session.concept : null);
    else if (act === 'pick') { app.picked = +v; submit(); }
    else if (act === 'check') submit();
    else if (act === 'reveal') reveal();
    else if (act === 'next') next();
    else if (act === 'end') endSession();
    else if (act === 'strict') { state.strict = !state.strict; save(); render(); }
    else if (act === 'export') { app.showExport = !app.showExport; app.ioMsg = null; render(); }
    else if (act === 'download') download();
    else if (act === 'import') importState();
    else if (act === 'reset') { app.confirmReset = true; render(); }
    else if (act === 'reset-yes') { state = C.emptyState(); store.clear(); save(); app.confirmReset = false; app.ioMsg = 'Progress reset.'; render(); }
    else if (act === 'reset-no') { app.confirmReset = false; render(); }
    else if (act === 'dismiss') { app.notice = null; render(); }
  });
}
function download() {
  try {
    const blob = new root.Blob([JSON.stringify(state)], { type: 'application/json' });
    const a = doc.createElement('a'); a.href = root.URL.createObjectURL(blob); a.download = 'praepositionen-progress.json'; doc.body.appendChild(a); a.click(); doc.body.removeChild(a);
  } catch (e) { app.ioMsg = 'Download is not available here — copy the text instead.'; render(); }
}
function importState() {
  const ta = qs('#import-text'); if (!ta) return;
  try {
    const parsed = C.validateState(JSON.parse(ta.value));
    // keep only ids that exist in this build
    Object.keys(parsed.items).forEach(function (k) { if (!BY_ID[k]) delete parsed.items[k]; });
    state = parsed; save();
    app.ioMsg = 'Imported ' + Object.keys(state.items).length + ' questions with history.'; render();
  } catch (e) { app.ioMsg = 'That is not a progress export from this app.'; render(); }
}

// ---------- rendering ----------
function render() {
  const a = el(); if (!a) return;
  if (app.view === 'home') a.innerHTML = renderHome();
  else if (app.view === 'session') a.innerHTML = renderSession();
  else if (app.view === 'summary') a.innerHTML = renderSummary();
  else if (app.view === 'progress') a.innerHTML = renderProgress();
  else if (app.view === 'rules') a.innerHTML = renderRules();
  afterRender();
}
function afterRender() {
  if (app.view === 'session' && app.phase === 'ask') { const f = qs('input.fill'); if (f) f.focus(); }
  if (app.view === 'session' && app.phase === 'feedback') { const n = qs('[data-act="next"]'); if (n) n.focus(); }
  if (root.scrollTo && app.view !== 'session') try { root.scrollTo(0, 0); } catch (e) {}
}
function top(active) {
  const nav = [['home', 'Home'], ['rules', 'Rules'], ['progress', 'Progress']].map(function (n) {
    return '<button data-act="view" data-v="' + n[0] + '"' + (active === n[0] ? ' aria-current="page"' : '') + '>' + n[1] + '</button>';
  }).join('');
  return '<div class="top"><h1>Präpositionen <span>· drill</span></h1><div class="nav">' + nav + '</div></div>' +
    (store.ok ? '' : '<div class="notice">Your browser blocked local storage, so progress will not survive a reload. Open this file directly in a normal browser tab to save progress.</div>');
}
function mbar(boxes, total, small) {
  return '<div class="mbar' + (small ? ' small' : '') + '">' + boxes.map(function (n, i) { return '<span class="b' + i + '" style="width:' + (total ? 100 * n / total : 0) + '%"></span>'; }).join('') + '</div>';
}

function renderHome() {
  const t = now(); const sum = C.summarize(ITEMS, state.items, t); const fc = C.forecast(ITEMS, state.items, t);
  let out = top('home');
  if (app.notice) out += '<div class="notice">' + h(app.notice) + ' <button class="btn link" data-act="dismiss">OK</button></div>';
  out += '<div class="hero">' + HERO + '</div>';
  out += '<div class="stat-row"><span><b>' + sum.mastered + '</b> of ' + sum.total + ' mastered</span><span><b>' + fc.now + '</b> due now</span><span><b>' + sum.fresh + '</b> not seen yet</span>' + (state.sessions ? '<span><b>' + streak(state.days, t) + '</b> day streak</span>' : '') + '</div>';
  out += mbar(sum.boxes, sum.total);
  out += '<div class="small faint">Boxes 0 → 5, left to right. Green = mastered (five correct answers over at least four days).</div>';
  const help = { practice: 'Due questions first, then new ones. Wrong answers come back in the same session.', weak: 'The questions you have missed most often.', exam: EXAM_LENGTH + ' questions across all concepts, no reveal, no retries.' };
  out += '<div class="controls">' +
    '<div class="ctl"><label>Mode</label><div class="seg">' + ['practice', 'weak', 'exam'].map(function (m) { return '<button data-act="mode" data-v="' + m + '" aria-pressed="' + (app.mode === m) + '">' + modeName(m) + '</button>'; }).join('') + '</div><span class="mode-help">' + help[app.mode] + '</span></div>' +
    '<div class="ctl"><label>Length</label><div class="seg">' + [10, 20, 40].map(function (n) { return '<button data-act="len" data-v="' + n + '" aria-pressed="' + (state.length === n && app.mode !== 'exam') + '"' + (app.mode === 'exam' ? ' disabled' : '') + '>' + n + '</button>'; }).join('') + '</div>' + (app.mode === 'exam' ? '<span class="mode-help">exam = ' + EXAM_LENGTH + '</span>' : '') + '</div>' +
    '<div class="ctl"><button class="btn primary" data-act="start">Start ' + modeName(app.mode).toLowerCase() + '</button><span class="kbd">Enter checks · 1–9 picks · Shift+Enter reveals · Esc ends</span></div>' +
    '</div>';
  out += '<h2>Concepts</h2><ul class="concepts">' + C.CONCEPTS.map(function (c) {
    const pc = sum.perConcept[c.id];
    return '<li class="concept"><span class="name">' + h(c.name) + '</span><button class="btn focus" data-act="focus" data-v="' + c.id + '">Focus</button>' +
      '<span class="blurb">' + h(c.blurb) + '</span>' + mbar(pc.boxes, pc.total, true) +
      '<span class="counts">' + pc.mastered + ' / ' + pc.total + ' mastered · ' + pc.due + ' due · ' + (pc.total - pc.seen) + ' new</span></li>';
  }).join('') + '</ul>';
  return out;
}

function renderPrompt(it) {
  const parts = it.prompt.split('___');
  const fb = app.phase === 'feedback', last = app.last;
  if (it.kind === 'choice') {
    return '<div class="prompt" lang="de">' + parts.map(function (p, i) {
      if (i === parts.length - 1) return h(p);
      return h(p) + (fb && isFill(last.canonical) ? '<b>' + h(last.canonical) + '</b>' : '<span class="blank' + (fb ? ' filled' : '') + '"></span>');
    }).join('') + '</div>';
  }
  const w = blankWidth(it);
  const disabled = fb ? ' disabled' : '';
  if (it.blanks === 0) {
    const cls = fb ? (last.ok ? ' good' : ' bad') : '';
    const val = fb ? (last.ok ? last.canonical : (last.revealed && !last.input ? last.canonical : last.input || '')) : '';
    return '<div class="prompt" lang="' + (it.kindLabel === 'recall' && /^[a-z]/.test(it.prompt) && !/→/.test(it.prompt) ? 'en' : 'de') + '">' + h(it.prompt) + '</div>' +
      '<input class="fill wide' + cls + '" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="de" aria-label="answer" value="' + h(val) + '"' + disabled + '>';
  }
  // inline inputs in the blanks
  let vals = [];
  if (fb) {
    if (last.ok) { const toks = last.canonical.split(' '); vals = it.blanks === toks.length ? toks : [last.canonical]; }
    else { const toks = (last.input || '').split(' ').filter(Boolean); vals = it.blanks === 2 && toks.length === 2 ? toks : [last.input || '']; if (last.revealed && !last.input) { const ct = last.canonical.split(' '); vals = it.blanks === ct.length ? ct : [last.canonical]; } }
  }

  return '<div class="prompt" lang="de">' + parts.map(function (p, i) {
    if (i === parts.length - 1) return h(p);
    const idx = k++;
    return h(p) + '<input class="fill' + cls + '" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="de" aria-label="blank ' + (idx + 1) + '" style="width:' + w + '" value="' + h(vals[idx] || '') + '"' + disabled + '>';
  }).join('') + '</div>';
}
function renderSession() {
  const s = app.session, it = currentItem();
  const fb = app.phase === 'feedback', last = app.last;
  let out = top(null);
  out += '<div class="sess-top"><span class="pos">' + (s.pos + 1) + ' / ' + s.queue.length + '</span><span>' + h(s.concept ? conceptName(s.concept) : modeName(s.mode)) + (s.concept ? ' · focus' : '') + '</span><button class="btn link" data-act="end">End (Esc)</button></div>';
  out += '<div class="pbar"><span style="width:' + (100 * s.pos / s.queue.length) + '%"></span></div>';
  out += '<div class="card">';
  out += '<div class="instr">' + h(it.instruction) + '<span class="tag">' + h(C.CONCEPT_BY_ID[it.concept].short) + '</span></div>';
  if (it.gloss) out += '<div class="gloss">' + h(it.gloss) + '</div>';
  out += renderPrompt(it);
  if (it.kind === 'choice') {
    out += '<ul class="choices">' + it.options.map(function (o, i) {
      let cls = '';
      if (fb) { if (i === it.correct) cls = ' good'; else if (last.input === o && !last.ok) cls = ' bad'; }
      return '<li><button class="choice' + cls + '" data-act="pick" data-v="' + i + '" aria-pressed="' + (app.picked === i) + '"' + (fb ? ' disabled' : '') + '><span class="key">' + (i + 1) + '</span><span>' + h(o) + '</span></button></li>';
    }).join('') + '</ul>';

    if (s.mode !== 'exam') out += '<button class="btn" data-act="reveal">Reveal</button>';
    out += '<span class="spacer"></span><span class="kbd"><kbd>Enter</kbd> check' + (s.mode !== 'exam' ? ' · <kbd>Shift</kbd>+<kbd>Enter</kbd> reveal' : '') + '</span>';
  } else {
    out += '<button class="btn primary" data-act="next">' + (s.pos + 1 >= s.queue.length ? 'Finish' : 'Next') + '</button><span class="spacer"></span><span class="kbd"><kbd>Enter</kbd> continues</span>';

function renderFeedback(it, last, s) {
  let out = '<div class="feedback ' + (last.ok ? 'good' : 'bad') + '">';
  out += '<div class="verdict">' + (last.ok ? 'Richtig.' : last.revealed ? 'Revealed — counts as a miss.' : last.umlaut ? 'Not quite — spelling. Umlauts count in strict mode.' : 'Not quite.') + '</div>';
  if (!last.ok || last.umlaut || (last.input && C.norm(last.input, true) !== C.norm(last.canonical, true))) {
    const alts = it.kind === 'type' ? it.answers.slice(1) : [];
    out += '<div class="answer" lang="de">' + h(last.canonical) + (alts.length ? ' <span class="alt">also: ' + h(alts.join(' / ')) + '</span>' : '') + '</div>';
  }
  if (it.explain) out += '<div class="explain">' + h(it.explain) + '</div>';
  let box;
  if (last.change === 'reset') box = '<span class="down">Back to box 0.</span> ' + (s.mode === 'exam' ? 'It is due again now.' : 'It comes back later in this session.');
  else if (last.change === 'mastered') box = '<span class="up">Mastered — box 5.</span> Comes back in ' + C.fmtInterval(last.due) + ' to make sure it sticks.';
  else if (last.change === 'keep') box = '<span class="up">Still mastered.</span> Next check in ' + C.fmtInterval(last.due) + '.';
  else if (last.change === 'early') box = 'Correct, but it was not due yet — box ' + last.box + ' unchanged.';
  else box = '<span class="up">Box ' + (last.box - 1) + ' → ' + last.box + '.</span> Due again in ' + C.fmtInterval(last.due) + '.';
  out += '<div class="box">' + box + '</div></div>';
  return out;
}

function renderSummary() {
  const s = app.session; let out = top(null);
  const acc = pct(s.correct, s.answered);
  out += '<h2 style="margin-top:4px">' + h(modeName(s.mode)) + (s.concept ? ' · ' + h(conceptName(s.concept)) : '') + '</h2>';
  out += '<div class="big">' + s.correct + ' / ' + s.answered + '</div><p class="muted">' + acc + ' correct' + (s.pos < s.queue.length ? ' · ended early' : '') + '</p>';
  const ch = s.changes;
  out += '<div class="stat-row"><span><b>' + ch.up + '</b> moved up</span><span><b>' + ch.mastered + '</b> newly mastered</span><span><b>' + ch.reset + '</b> reset to box 0</span>' + (ch.early ? '<span><b>' + ch.early + '</b> not due yet</span>' : '') + '</div>';
  if (s.missed.length) {
    out += '<h3>Missed this session</h3><ul class="missed">' + s.missed.map(function (id) {
      const it = BY_ID[id]; const ans = it.answers[0];
      return '<li><div class="p" lang="de">' + fillBlanks(it.prompt, ans) + '</div><div class="a">' + (it.blanks ? '' : '<b>' + h(ans) + '</b> · ') + h(it.explain || '') + '</div></li>';
    }).join('') + '</ul>';
  } else out += '<p class="muted">Nothing missed. ' + (s.mode === 'exam' ? 'Clean sheet.' : 'Keep going until every box is green.') + '</p>';
  out += '<div class="actions" style="margin-top:18px"><button class="btn primary" data-act="again">Another ' + h(modeName(s.mode).toLowerCase()) + (s.concept ? ' (focus)' : '') + '</button><button class="btn" data-act="view" data-v="home">Home</button><button class="btn" data-act="view" data-v="progress">Progress</button></div>';
  return out;
}

function renderProgress() {
  const t = now(); const sum = C.summarize(ITEMS, state.items, t); const fc = C.forecast(ITEMS, state.items, t);
  let out = top('progress');
  out += '<h2 style="margin-top:0">Progress</h2>';
  out += '<div class="grid2">' + [
    [sum.mastered + ' / ' + sum.total, 'mastered'], [pct(sum.ok, sum.ok + sum.miss), 'accuracy, all time'], [sum.seen, 'questions seen'], [state.sessions, 'sessions'], [Object.keys(state.days).length, 'active days'], [streak(state.days, t), 'day streak'],
  ].map(function (x) { return '<div class="tile"><div class="v">' + h(x[0]) + '</div><div class="k">' + h(x[1]) + '</div></div>'; }).join('') + '</div>';
  out += '<h3>Boxes</h3><div class="boxes">' + sum.boxes.map(function (n, i) {
    const mx = Math.max.apply(null, sum.boxes) || 1;
    return '<div class="col"><div class="bar"><span style="height:' + Math.max(2, 100 * n / mx) + '%"></span></div><div class="n">' + n + '</div>' + (i === 5 ? 'mastered' : 'box ' + i) + '</div>';
  }).join('') + '</div>';
  out += '<h3>Coming up</h3><div class="stat-row"><span><b>' + fc.now + '</b> due now</span><span><b>' + fc.today + '</b> later today</span><span><b>' + fc.tomorrow + '</b> tomorrow</span><span><b>' + fc.week + '</b> rest of the week</span></div>';
  out += '<h3>By concept</h3><table><tr><th>Concept</th><th class="num">Mastered</th><th class="num">Due</th><th class="num">Accuracy</th></tr>' + C.CONCEPTS.map(function (c) {
    const pc = sum.perConcept[c.id];
    return '<tr><td>' + h(c.name) + mbar(pc.boxes, pc.total, true) + '</td><td class="num">' + pc.mastered + ' / ' + pc.total + '</td><td class="num">' + pc.due + '</td><td class="num">' + pct(pc.ok, pc.ok + pc.miss) + '</td></tr>';
  }).join('') + '</table>';
  const hard = ITEMS.filter(function (i) { const s = state.items[i.id]; return s && s.miss >= 1; }).map(function (i) { const s = state.items[i.id]; return { it: i, s: s, rate: s.miss / s.seen }; })
    .sort(function (a, b) { return (b.s.miss - a.s.miss) || (b.rate - a.rate); }).slice(0, 10);
  if (hard.length) {
    out += '<h3>Hardest questions</h3><ul class="missed">' + hard.map(function (x) {
      return '<li><div class="p" lang="de">' + fillBlanks(x.it.prompt, x.it.answers[0]) + '</div><div class="a">' + (x.it.blanks ? '' : '<b>' + h(x.it.answers[0]) + '</b> · ') + 'missed ' + x.s.miss + ' of ' + x.s.seen + ' · box ' + x.s.box + '</div></li>';
    }).join('') + '</ul>';
  }
  out += '<h3>Settings</h3><label class="toggle"><input type="checkbox" data-act="strict"' + (state.strict ? ' checked' : '') + '> Strict spelling: ü ≠ ue, ß ≠ ss</label>';
  out += '<h3>Backup</h3>';
  if (app.ioMsg) out += '<div class="notice ok">' + h(app.ioMsg) + '</div>';
  out += '<div class="io"><button class="btn" data-act="export">' + (app.showExport ? 'Hide export' : 'Export as text') + '</button><button class="btn" data-act="download">Download JSON</button></div>';
  if (app.showExport) out += '<textarea class="io-text" id="export-text" readonly>' + h(JSON.stringify(state)) + '</textarea>';
  out += '<p class="small muted" style="margin-top:8px">Import: paste an export below.</p><textarea class="io-text" id="import-text" placeholder="paste here"></textarea><div class="io"><button class="btn" data-act="import">Import</button></div>';
  out += '<h3>Reset</h3>';
  if (app.confirmReset) out += '<div class="notice error">Really delete all progress? This cannot be undone.</div><div class="io"><button class="btn danger" data-act="reset-yes">Yes, delete everything</button><button class="btn" data-act="reset-no">Cancel</button></div>';
  else out += '<div class="io"><button class="btn danger" data-act="reset">Reset all progress</button></div>';
  return out;
}

// ---------- rules (reference, generated from the data bank) ----------
function pill(c) { return '<span class="pill ' + c + '">' + (c === 'W' ? 'A / D' : c) + '</span>'; }
function renderRules() {
  let out = top('rules') + '<div class="rules">';
  out += '<h2 style="margin-top:0">1 · Prepositions by case</h2>';
  ['A', 'D', 'G', 'W'].forEach(function (c) {
    const list = D.PREPS.filter(function (p) { return p.c === c; });
    out += '<div class="grp"><b>' + (c === 'W' ? 'Two-way (Wechselpräpositionen)' : 'Always ' + D.CASE_NAME[c]) + '</b>' + pill(c) + '<div class="list">' + list.map(function (p) { return h(p.p) + ' <span class="en">' + h(p.en) + '</span>'; }).join(' · ') + '</div></div>';
  });
  out += '<p>Two-way: <b class="dat-t">Wo? (position) → Dativ</b>, <b class="akk-t">Wohin? (movement to) → Akkusativ</b>. Position verbs stehen · liegen · sitzen · hängen · stecken (Dativ) vs movement verbs stellen · legen · setzen · hängen · stecken (Akkusativ). Time expressions with an, in, vor, zwischen always take Dativ: am Montag, im Mai, vor einer Woche.</p>';
  out += '<h2>2 · Contractions</h2><table>' + D.CONTRACTIONS.map(function (c) { return '<tr><td>' + h(c[0]) + ' → ' + h(c[1]) + '</td><td class="en">' + (c[2] ? 'standard' : 'mainly spoken') + '</td></tr>'; }).join('') + '</table><p class="en">No contraction for an der, in der, auf dem, bei der, von der, zu den …</p>';
  out += '<h2>3 · Time</h2><table>' + [
    ['um', 'clock time', 'um 8 Uhr'], ['am', 'day, part of day, date, weekend', 'am Montag, am Morgen, am 3. Mai'], ['im', 'month, season, year with Jahr', 'im Mai, im Sommer, im Jahr 2020'], ['in + Dativ', 'in the future (from now)', 'in zwei Wochen'],
    ['seit + Dativ', 'since / for — still going on (present tense)', 'seit 2020, seit drei Jahren'], ['vor + Dativ', 'ago', 'vor zwei Tagen'], ['nach + Dativ', 'after', 'nach dem Essen'], ['ab + Dativ', 'from … on (start)', 'ab morgen, ab dem 1. Mai'],
    ['bis (+ Akk.)', 'until', 'bis Freitag, bis 17 Uhr'], ['von … bis', 'from … to', 'von 9 bis 17 Uhr, von Montag bis Freitag'], ['während + Genitiv', 'during', 'während des Unterrichts'], ['für + Akkusativ', 'for (planned duration)', 'für zwei Wochen'],
    ['zwischen + Dativ', 'between', 'zwischen 8 und 9 Uhr'], ['gegen + Akkusativ', 'around (approximately)', 'gegen 8 Uhr'], ['zu / an', 'holidays', 'zu Weihnachten, an Ostern'],
  ].map(function (r) { return '<tr><td>' + h(r[0]) + '</td><td class="en">' + h(r[1]) + '</td><td>' + h(r[2]) + '</td></tr>'; }).join('') + '</table>';
  out += '<h2>4 · Place</h2><table>' + [
    ['Wohin?', 'nach', 'cities, countries without article, home', 'nach Berlin, nach Hause'], ['', 'in + Akk.', 'countries with article, buildings you enter', 'in die Schweiz, ins Kino'], ['', 'zu + Dat.', 'people, shops, events', 'zum Arzt, zur Party'], ['', 'auf + Akk.', 'public buildings, islands, open places', 'auf die Post, auf eine Insel'], ['', 'an + Akk.', 'water, borders', 'ans Meer, an die Grenze'],
    ['Wo?', 'in + Dat.', 'inside', 'in der Schule'], ['', 'bei + Dat.', 'at a person / company', 'bei Anna, bei Siemens'], ['', 'auf + Dat.', 'public buildings, islands', 'auf der Post, auf der Insel'], ['', 'an + Dat.', 'water, edges', 'am Meer, am Fenster'], ['', 'zu Hause', 'at home', 'Ich bin zu Hause.'],
    ['Woher?', 'aus + Dat.', 'from inside / origin', 'aus der Schule, aus Nigeria'], ['', 'von + Dat.', 'from a person / place you were at', 'von Anna, vom Arzt'],
  ].map(function (r) { return '<tr><td>' + h(r[0]) + '</td><td>' + h(r[1]) + '</td><td class="en">' + h(r[2]) + '</td><td>' + h(r[3]) + '</td></tr>'; }).join('') + '</table><p class="en">Round trip: in / nach → back with aus; zu / bei / auf / an → back with von.</p>';
  out += '<h2>5 · Verbs with fixed prepositions</h2>';
  const groups = {}; D.VERBS.forEach(function (v) { const k = v.v.split(' ').pop() + ' + ' + v.c; (groups[k] = groups[k] || []).push(v); });
  Object.keys(groups).sort().forEach(function (k) {
    const p = k.split(' + ')[0], c = k.split(' + ')[1];
    out += '<div class="grp"><b>' + h(p) + '</b>' + pill(c) + '<ul>' + groups[k].map(function (v) { return '<li lang="de">' + h(v.v) + ' <span class="en">' + h(v.en) + '</span></li>'; }).join('') + '</ul></div>';
  });
  out += '<h3>Two prepositions</h3><ul>' + D.VERBS_TWO.map(function (r) { return '<li>' + h(r[2]) + ' <span class="en">' + h(r[3]) + '</span></li>'; }).filter(function (x, i, a) { return a.indexOf(x) === i; }).join('') + '</ul>';
  out += '<h3>Easily confused</h3><ul>' + [
    'sich freuen auf (future) / sich freuen über (now or past)', 'denken an (remember) / nachdenken über (reflect) / halten von (have an opinion of)', 'sprechen mit (the partner) / sprechen über (the topic)',
    'sich bewerben um (the job) / sich bewerben bei (the company)', 'sich interessieren für / interessiert sein an', 'warten auf (never "warten für")', 'Angst haben vor (never "Angst haben von")',
  ].map(function (s) { return '<li>' + h(s) + '</li>'; }).join('') + '</ul>';
  out += '<h2>6 · Adjectives and nouns</h2>';
  ['A', 'D'].forEach(function (c) {
    out += '<div class="grp"><b>Adjectives + ' + D.CASE_NAME[c] + '</b>' + pill(c) + '<div class="list">' + D.ADJS.filter(function (a) { return a.c === c; }).map(function (a) { return h(a.v) + ' <span class="en">' + h(a.en) + '</span>'; }).join(' · ') + '</div></div>';
  });
  out += '<div class="grp"><b>Nouns</b><div class="list">' + D.NOUNS.map(function (a) { return h(a.v) + pill(a.c) + ' <span class="en">' + h(a.en) + '</span>'; }).join(' · ') + '</div></div>';
  out += '<h2>7 · da- and wo-words</h2><p>Things and ideas: <b>da(r)- + preposition</b> in statements, <b>wo(r)- + preposition</b> in questions; dar- / wor- before a vowel. People: preposition + pronoun (an ihn, mit ihr) and preposition + wen / wem. A da-word also points forward to a dass-clause or infinitive: <span lang="de">Ich freue mich darauf, dass du kommst.</span></p>';
  out += '<table>' + D.DA_PREPS.map(function (p) { return '<tr><td>' + h(p) + '</td><td>' + h(C.daWord(p)) + '</td><td>' + h(C.woWord(p)) + '</td></tr>'; }).join('') + '</table>';
  out += '</div>';
  return out;
}

// ---------- boot ----------
bindClicks();
render();
root.PraepApp = { app: app, items: ITEMS, byId: BY_ID, render: render, getState: function () { return state; }, setState: function (s) { state = s; save(); }, startSession: startSession, submit: submit, reveal: reveal, next: next, endSession: endSession, setView: setView, currentItem: currentItem, store: store, HERO: HERO, EXAM_LENGTH: EXAM_LENGTH };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
