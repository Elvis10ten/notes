  if (!TTS.ok) { toast('This browser cannot read text aloud. Use “Practise without sound”.'); return; }
  sess.played[p] = true; persistProg();
  const b = $(`#play-${p}`), s = $(`#stop-${p}`), st = $(`#ps-${p}`);
  if (b) b.hidden = true; if (s) s.hidden = false;

    if (!st) return;

      if (p === 'h2') st.textContent = e.m === '1' ? 'First listening …' : 'Second listening …';
      else { st.textContent = `Text ${e.m + 1} of ${n} · Nummer ${P[p].start + e.m}`; const el = $(`#rf-${p}-${e.m}`); if (el) { el.classList.add('now'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }
    } else if (e.type === 'pause') st.textContent = `${e.label} · ${e.left}s`;
    else if (e.type === 'end') {

      const nx = sess.parts[sess.parts.indexOf(p) + 1];

/* ---------- routing ---------- */
let stack = [{ v: 'home' }];
const route = () => stack[stack.length - 1];
function go(r) { stack.push(r); render(); window.scrollTo(0, 0); }
function back() { stopAudio(); if (stack.length > 1) stack.pop(); render(); window.scrollTo(0, 0); }
function tab(v) { stopAudio(); stack = [{ v }]; render(); window.scrollTo(0, 0); }

/* ---------- sessions: objective parts ---------- */
let sess = null;
function startSession(tid, parts, mode) {
  stopAudio();
  const key = `${tid}:${parts.join('+')}:${mode}`;
  const pr = S.prog[key];
  sess = { tid, parts, mode, key, ans: {}, el: 0, done: false, played: {}, res: null, warn: 0, readMode: {} };
  parts.forEach(p => (sess.ans[p] = {}));
  if (pr && pr.ans) {
    parts.forEach(p => Object.assign(sess.ans[p], pr.ans[p] || {}));
    sess.el = pr.el || 0;
    if (mode === 'e') sess.played = Object.assign({}, pr.played || {}); /* exam rule: a played recording stays played after a reload */
    sess.resumed = Object.values(sess.ans).some(o => Object.keys(o).length) || Object.keys(sess.played).length > 0;
  }
  sess.t0 = Date.now() - sess.el * 1000; /* wall clock, so background tabs can't slow the exam timer */
  sess.limit = mode === 'e' ? (parts[0][0] === 'h' ? null : 90 * 60) : (parts.reduce((a, p) => a + (P[p].min || 0), 0) * 60 || null);
  go({ v: 'sess' });
}
function persistProg() { if (sess && !sess.done) { S.prog[sess.key] = { ans: sess.ans, el: sess.el, played: sess.played }; save(); sess.sv = sess.el; } }
function setAns(p, i, v) {

  if (v) sess.ans[p][i] = v; else delete sess.ans[p][i];

}

function grade() {
  const t = T(sess.tid); sess.res = {};
  for (const p of sess.parts) {
    const per = P[p].max / P[p].n; let s = 0; const items = [];
    for (let i = 0; i < P[p].n; i++) {
      const v = sess.ans[p][i] || null, k = keyOf(t, p, i), ok = v === k;
      if (ok) s += per;

      if (ok) delete S.mis[mk]; else S.mis[mk] = { t: Date.now(), n: ((S.mis[mk] && S.mis[mk].n) || 0) + 1, y: v };

}

/* ---------- painting (targeted updates) ---------- */
function slotInner(t, p, i) {
  const v = sess.ans[p][i];
  return `<span class="no">${P[p].start + i}</span><span class="bub${v ? ' on' : ''}">${v || '?'}</span><span class="lbl">${v ? esc(optText(t, p, i, v)) : 'Choose answer'}</span>`;
}
function gapInner(t, p, i) {
  const v = sess.ans[p][i];
  return `<span class="gno">${P[p].start + i}</span><span class="gw">${v ? esc(word(t, p, i, v)) : '…'}</span>`;
}
function paintSlot(p, i) {
  const t = T(sess.tid);
  $$(`[data-slot="${p}|${i}"]`).forEach(el => { el.innerHTML = el.dataset.kind === 'gap' ? gapInner(t, p, i) : slotInner(t, p, i); el.classList.toggle('filled', !!sess.ans[p][i]); });
}
function paintRow(p, i) {
  const v = sess.ans[p][i];
  $$(`[data-bub^="${p}|${i}|"]`).forEach(b => { const on = b.dataset.bub.split('|')[2] === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}

}

function paintTimer() {
  const el = $('#timer'); if (!el) return;
  let el2 = 0, lim = null, run = true;
  const r = route();
  if (r.v === 'sess' && sess) { el2 = sess.el; lim = sess.limit; run = !sess.done; }
  else if (r.v === 'write' && wr) { el2 = wr.el; lim = 30 * 60; run = !wr.done; }
  else if (r.v === 'speak' && spk) { el2 = spk.el; lim = P[spk.pid].min * 60; run = spk.running; }
  if (lim) { const rem = lim - el2; el.textContent = rem >= 0 ? mmss(rem) : '+' + mmss(rem); el.className = 'timer' + (rem < 0 ? ' over' : rem < 300 ? ' low' : '') + (run ? '' : ' paused'); }

  const r = route();

  } else if (r.v === 'write' && wr && !wr.done) {

    if (wr.el - (wr.sv || 0) >= 5) saveDraft();

  } else if (r.v === 'speak' && spk && spk.running) { spk.el++; paintTimer(); }

/* ---------- view: shared bits ---------- */

}
function meter(v, max, opts = {}) {

}

function passCard(name, o, max, need) {

  return `<div class="pass"><div class="pass-h"><span>${name}</span>${st}</div><div class="pass-n">${v == null ? '<span class="muted">no data yet</span>' : `<b>${fmt(v)}</b><span>/ ${max}</span>`}${o && o.partial ? '<em>estimate</em>' : ''}</div>${meter(v, max)}<div class="pass-f">pass: ${need} points</div></div>`;
}

<section class="card"><div class="card-h"><h3>Exam date</h3></div><div class="field"><label for="set-date">Your telc B1 exam</label><input type="date" id="set-date" value="${esc(S.set.date)}"></div></section>
<section class="card"><div class="card-h"><h3>Listening voices</h3></div>
${!TTS.ok ? '<p class="warnbox">This browser has no speech output. The listening parts can still be done with the transcript.</p>' : !vs.length ? '<p class="warnbox">No German voice found yet. On a phone, check that a German voice is installed in the system speech settings. Desktop Chrome and Edge usually include one.</p>' : ''}
<div class="field"><label for="set-va">Voice A (presenter, announcements)</label><select id="set-va">${opt(S.set.va)}</select></div>
<div class="field"><label for="set-vb">Voice B (guest, voicemails)</label><select id="set-vb">${opt(S.set.vb)}</select></div>
<div class="field"><label for="set-rate">Speed: <b id="ratev">${(+S.set.rate).toFixed(2)}×</b></label><input type="range" id="set-rate" min="0.75" max="1.1" step="0.05" value="${S.set.rate}"><span class="fine">Exam speed is about 0.95–1.0. Start slower if you need to.</span></div>
<div class="row tight"><button class="btn ghost" data-act="testvoice">▶︎ Test voices</button></div></section>
<section class="card"><div class="card-h"><h3>Backup</h3></div><p class="muted">Progress lives in this browser only. Copy it to move it to another device.</p><div class="row tight"><button class="btn ghost" data-act="export">Copy progress</button></div><div class="field"><label for="imp">Paste a copied backup</label><textarea id="imp" rows="3" placeholder='{"att":…}'></textarea></div><div class="row tight"><button class="btn ghost" data-act="import">Restore backup</button></div></section>
<section class="card"><div class="card-h"><h3>Reset</h3></div><p class="muted">Deletes all scores, mistakes and drafts.</p><div class="row tight" id="resetrow"><button class="btn danger" data-act="reset1">Reset all progress</button></div></section>`;
}

/* ---------- render ---------- */
function render() {
  closeSheet();
  const r = route(); document.body.dataset.view = r.v;
  const views = { home: vHome, tests: vTests, test: vTest, sess: vSession, write: vWrite, speak: vSpeak, mist: vMist, tips: vTips, settings: vSettings };
  $('#view').innerHTML = (views[r.v] || vHome)();
  const tabv = ['home', 'tests', 'mist', 'tips'].includes(r.v) ? r.v : r.v === 'test' ? 'tests' : null;
  $$('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.v === tabv));
  const mc = Object.keys(S.mis).length; const badge = $('#mbadge'); if (badge) { badge.textContent = mc; badge.hidden = !mc; }
  paintTimer();
}
let tt;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => (el.hidden = true), 3200); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const ch = e.target.closest('[data-choose]');
  if (ch) { const [p, i, v] = ch.dataset.choose.split('|'); setAns(p, +i, v); closeSheet(); return; }
  const pk = e.target.closest('[data-pick]');
  if (pk) { const [p, i] = pk.dataset.pick.split('|'); openPicker(p, +i); return; }
  const bb = e.target.closest('[data-bub]');
  if (bb) { const [p, i, v] = bb.dataset.bub.split('|'); setAns(p, +i, sess.ans[p][+i] === v ? null : v); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const d = a.dataset;
  switch (d.act) {
    case 'tab': tab(d.v); break;
    case 'back': back(); break;
    case 'settings': go({ v: 'settings' }); break;
    case 'test': go({ v: 'test', t: d.t }); break;
    case 'open': openPart(d.t, d.p); break;
    case 'exam': if (d.b === 'ls') startSession(d.t, ['l1', 'l2', 'l3', 's1', 's2'], 'e'); else if (d.b === 'h') startSession(d.t, ['h1', 'h2', 'h3'], 'e'); else openWrite(d.t, 'A', 'e'); break;
    case 'closesheet': closeSheet(); break;
    case 'submit': submit(false); break;
    case 'force': submit(true); break;
    case 'dismiss': sess.warn = 0; paintSubmit(); break;
    case 'retry': { const s = sess; startSession(s.tid, s.parts, s.mode); stack.splice(stack.length - 2, 1); break; }
    case 'restart': sess.parts.forEach(p => (sess.ans[p] = {})); sess.el = 0; sess.sv = 0; sess.t0 = Date.now(); sess.played = {}; sess.resumed = false; delete S.prog[sess.key]; save(); render(); break;
    case 'jump': { const el = $('#part-' + d.p); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'jumpq': { const el = $(`#gq-${d.p}-${d.i}`); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } break; }
    case 'play': startPlayer(d.p); break;
    case 'stop': stopAudio(); break;
    case 'readmode': sess.readMode[d.p] = true; render(); break;
    case 'sayone': { const t = T(sess.tid), it = (d.p === 'h1' ? t.h1 : t.h3)[+d.i]; playSeq(null, [{ say: it.a, v: it.v || 'A' }], () => {}); break; }
    case 'sayall': { const t = T(sess.tid); playSeq(null, t.h2.d.map(([v, x]) => ({ say: x, v })), () => {}); break; }
    case 'mfilter': route().f = d.f; render(); break;
    case 'mdone': delete S.mis[d.k]; save(); render(); break;
    case 'wtask': {
      if (!wr.done) saveDraft();
      wr.task = d.task; wr.done = false; wr.rub = newRub();
      /* practice: each task keeps its own time; exam: the 30 minutes keep running across tasks */
      if (wr.mode !== 'e') { wr.el = (S.drafts[dkey(wr.tid, wr.task, wr.mode)] || {}).el || 0; wr.t0 = Date.now() - wr.el * 1000; }
      wr.sv = wr.el; render(); break;
    }
    case 'wdone': finishWrite(); break;
    case 'wedit': wr.done = false; wr.t0 = Date.now() - wr.el * 1000; render(); break;
    case 'rub': wr.rub[d.k] = d.v; markLv(a); updWScore(); break;
    case 'wsave': { const sc = wScore(wr.rub); if (sc != null) { addAtt(wr.tid, 'w', sc, 45, wr.mode, { task: wr.task }); toast(`Saved: ${sc} / 45 points`); } break; }
    case 'wnew': delete S.drafts[dkey(wr.tid, wr.task, wr.mode)]; save(); wr.done = false; wr.el = 0; wr.sv = 0; wr.t0 = Date.now(); wr.rub = newRub(); render(); break;
    case 'spktimer': spk.running = !spk.running; render(); break;
    case 'spkreset': spk.running = false; spk.el = 0; render(); break;
    case 'q1': { const t = T(spk.tid); const pool = Q1.concat(t.m.extra); spk.qi = (spk.qi + 1 + Math.floor(Math.random() * (pool.length - 1))) % pool.length; spk.cur = pool[spk.qi]; render(); sayLine(spk.cur, 'B'); break; }
    case 'q2': { const q = T(spk.tid).m.t2.q; spk.qi = (spk.qi + 1) % q.length; spk.cur = q[spk.qi]; render(); sayLine(spk.cur, 'B'); break; }
    case 'sum': { const m = T(spk.tid).m.t2; sayLine(spk.role === 'A' ? m.sumB : m.sumA, 'B'); if (!TTS.ok) { spk.showSum = true; render(); } break; }
    case 'showsum': spk.showSum = !spk.showSum; render(); break;
    case 'role': spk.role = d.r; spk.cur = ''; spk.qi = -1; spk.showSum = false; stopAudio(); render(); break;
    case 'p3': { const ls = T(spk.tid).m.t3.partner; if (spk.pi < ls.length - 1) { spk.pi++; spk.cur = ls[spk.pi]; render(); sayLine(spk.cur, 'B'); } break; }
    case 'p3reset': spk.pi = -1; spk.cur = ''; stopAudio(); render(); break;
    case 'sayagain': { const t = T(spk.tid); const line = spk.pid === 'm3' ? t.m.t3.partner[spk.pi] : spk.cur; if (line) sayLine(line, 'B'); break; }
    case 'srub': spk.rub[d.k] = d.v; markLv(a); updSScore(); break;
    case 'ssave': { const sc = spkScore(); if (sc != null) { addAtt(spk.tid, spk.pid, sc, P[spk.pid].max, 'p'); toast(`Saved: ${sc} / ${P[spk.pid].max} points`); } break; }
    case 'testvoice': stopAudio(); if (TTS.ok) { const tok = ++AU.tok; speakText('Hallo, ich bin Stimme A. Ich lese die Nachrichten.', 'A', () => speakText('Und ich bin Stimme B. Ich bin der Gast im Interview.', 'B', () => {}, tok), tok); } else toast('No speech output in this browser.'); break;
    case 'export': { const txt = JSON.stringify(S); const done = () => toast('Progress copied. Paste it into a note or message.'); try { navigator.clipboard.writeText(txt).then(done, () => { $('#imp').value = txt; $('#imp').select(); toast('Copy blocked – the backup is selected in the box below.'); }); } catch (err) { $('#imp').value = txt; $('#imp').select(); toast('Copy blocked – the backup is selected in the box below.'); } break; }
    case 'import': { try { const o = JSON.parse($('#imp').value); if (!o || typeof o !== 'object' || !o.att) throw 0; S = Object.assign(DEF(), o); S.set = Object.assign(DEF().set, o.set || {}); save(); toast('Backup restored.'); render(); } catch (err) { toast('That does not look like a backup from this app.'); } break; }
    case 'reset1': $('#resetrow').innerHTML = '<span class="muted">This cannot be undone.</span><button class="btn danger" data-act="reset2">Yes, delete everything</button><button class="btn ghost" data-act="reset0">Cancel</button>'; break;
    case 'reset0': render(); break;
    case 'reset2': S = DEF(); save(); toast('All progress deleted.'); tab('home'); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'w-text') { $('#wstats').innerHTML = wStats(el.value); clearTimeout(el._t); el._t = setTimeout(saveDraft, 600); }
  if (el.id === 'set-rate') { S.set.rate = +el.value; $('#ratev').textContent = (+el.value).toFixed(2) + '×'; save(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.lp !== undefined) { wr.rub.lp[+el.dataset.lp] = el.checked; updWScore(); }
  if (el.dataset.bonus) { wr.rub[el.dataset.bonus] = el.checked; updWScore(); }
  if (el.id === 'set-date') { S.set.date = el.value; save(); toast('Exam date saved.'); }
  if (el.id === 'set-va') { S.set.va = el.value; save(); }
  if (el.id === 'set-vb') { S.set.vb = el.value; save(); }
});
function updWScore() { const sc = wScore(wr.rub); const b = $('#wscore'); if (b) { b.className = 'wscore ' + (sc == null ? 'none' : cls(sc / 45)); b.innerHTML = wScoreHtml(sc); } const s = $('#wsave'); if (s) s.disabled = sc == null; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
window.addEventListener('pagehide', () => { if (sess && !sess.done) persistProg(); if (wr && !wr.done && $('#w-text')) saveDraft(); });

try { render(); }
catch (err) { document.getElementById('view').innerHTML = '<div class="empty"><h3>Something went wrong while loading</h3><p>' + esc(err && err.message) + '</p></div>'; }
</script>

</body></html>
