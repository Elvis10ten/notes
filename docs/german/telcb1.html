<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>telc B1 Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=IBM+Plex+Mono:wght@500;600&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: an exam booklet (serif reading texts on white sheets) laid over an answer sheet (S30): petrol "dropout ink" ovals, pencil-filled when chosen. Single 760px column, bottom tab bar. */
:root{
  --paper:#F2F5F5; --sheet:#FFFFFF; --ink:#16201F; --muted:#586664; --line:#D1DCDB; --line2:#E5ECEB;
  --drop:#0B6E85; --drop-ink:#FFFFFF; --drop-soft:#E0EFF2; --pencil:#1C2625;
  --ok:#2C7A44; --ok-soft:#E2F1E6; --bad:#B23A2B; --bad-soft:#F7E3DF; --mid:#9A6510; --mid-soft:#F6EDDA;
  --note:#FFF5CF; --note-ink:#3A3216; --scrim:rgba(8,20,22,.45);
  --f-ui:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1414; --sheet:#162020; --ink:#E2EBEA; --muted:#93A3A1; --line:#2A3837; --line2:#1E2a29;
  --drop:#5DBFD5; --drop-ink:#05222A; --drop-soft:#123039; --pencil:#E2EBEA;
  --ok:#5FC47F; --ok-soft:#153022; --bad:#F2806E; --bad-soft:#381D19; --mid:#E3AE4E; --mid-soft:#33290F;
  --note:#2D2814; --note-ink:#F2E7BC; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1414; --sheet:#162020; --ink:#E2EBEA; --muted:#93A3A1; --line:#2A3837; --line2:#1E2a29;
  --drop:#5DBFD5; --drop-ink:#05222A; --drop-soft:#123039; --pencil:#E2EBEA;
  --ok:#5FC47F; --ok-soft:#153022; --bad:#F2806E; --bad-soft:#381D19; --mid:#E3AE4E; --mid-soft:#33290F;
  --note:#2D2814; --note-ink:#F2E7BC; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2.5px solid var(--drop);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,h5{margin:0;text-wrap:balance}
p{margin:0}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body[data-view="sess"] #app,body[data-view="write"] #app,body[data-view="speak"] #app{padding-block-end:40px}
.muted{color:var(--muted)}
.fine{font-size:.8rem;color:var(--muted);margin-top:10px}
.center{text-align:center}

/* app bar + tabs */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{font:600 .78rem var(--f-num);color:var(--drop);border:1.5px solid var(--drop);border-radius:999px;padding:2px 9px;letter-spacing:.04em}
.brand-t{font-weight:800;font-size:1.12rem;letter-spacing:-.015em}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--sheet);font-size:1.15rem;flex:none}
.iconbtn svg{width:20px;height:20px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--sheet);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;max-width:180px;display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:10px;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
.tabbar svg{width:22px;height:22px}
.tabbar button.on{color:var(--drop)}
.tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--paper);font:600 .66rem/18px var(--f-num)}
body[data-view="sess"] .tabbar,body[data-view="write"] .tabbar,body[data-view="speak"] .tabbar{display:none}
body[data-view="sess"] .appbar,body[data-view="write"] .appbar,body[data-view="speak"] .appbar,body[data-view="test"] .appbar,body[data-view="settings"] .appbar{display:none}

/* sticky session bar */
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;background:var(--paper);border-bottom:1px solid var(--line)}
.sbar-t{min-width:0;display:grid}
.sbar-t b{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar-t span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font:600 1rem var(--f-num);font-variant-numeric:tabular-nums;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);min-width:4.4em;text-align:center}
.timer.low{color:var(--mid);border-color:var(--mid)}
.timer.over{color:var(--bad);border-color:var(--bad)}
.timer.paused{opacity:.55}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;font-size:.95rem;line-height:1.2;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.btn.wide{width:100%;margin-top:10px}
.btn:disabled{opacity:.4}
.link{color:var(--drop);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;padding:2px 0;text-align:left}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.row.tight{margin-top:10px}

/* ovals: the answer-sheet bubble */
.bub{display:inline-grid;place-items:center;flex:none;min-width:2.2em;height:1.5em;padding:0 .4em;border:1.5px solid var(--drop);border-radius:999px;font:600 .78rem/1 var(--f-num);color:var(--drop);background:var(--sheet);text-transform:lowercase}
.bub.sm{min-width:1.9em;height:1.35em;font-size:.72rem}
.bub.on,.on>.bub{background:var(--pencil);border-color:var(--pencil);color:var(--paper)}
.no{font:600 .8rem var(--f-num);color:var(--muted);min-width:1.7em;flex:none;font-variant-numeric:tabular-nums}

/* chips, pills, meters */
.chip{display:inline-block;font:600 .76rem var(--f-num);padding:3px 9px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.good,.pill.good{background:var(--ok-soft);color:var(--ok)}
.chip.mid,.pill.mid{background:var(--mid-soft);color:var(--mid)}
.chip.low,.pill.low{background:var(--bad-soft);color:var(--bad)}
.chip.none{color:var(--muted);border:1px dashed var(--line)}
.pill{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em}
.meter{position:relative;height:8px;border-radius:99px;background:var(--line2);margin-top:10px}
.meter.sm{height:6px;margin-top:0}
.meter-fill{height:100%;border-radius:99px;background:var(--muted);transition:width .4s}
.meter-fill.good{background:var(--ok)}.meter-fill.mid{background:var(--mid)}.meter-fill.low{background:var(--bad)}
.meter-mark{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);opacity:.55;border-radius:2px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,2fr);gap:14px;align-items:stretch;margin-top:6px}
.hero-l{display:flex;flex-direction:column;justify-content:center;gap:4px}
.big{font-weight:800;font-size:4.4rem;line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.hero-s{font-size:.82rem;color:var(--muted)}
.hero-r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pass{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;min-width:0}
.pass-h{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:.78rem;font-weight:700;flex-wrap:wrap}
.pass-n{margin-top:8px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.pass-n b{font:600 1.7rem var(--f-num);letter-spacing:-.03em}
.pass-n em{font-style:normal;font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 6px}
.pass-f{font-size:.72rem;color:var(--muted);margin-top:8px}
.next{margin-top:14px;background:var(--drop);color:var(--drop-ink);border-radius:18px;padding:16px 18px}
.next .eyebrow{color:var(--drop-ink);opacity:.75}
.next-b{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:6px}
.next h3{font-size:1.2rem;font-weight:800}
.next p{font-size:.88rem;opacity:.9;margin-top:2px}
.next .btn{background:var(--drop-ink);color:var(--drop);border-color:var(--drop-ink);flex:none}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.card.slim .next-b{margin-top:0}
.card.slim h3{font-size:1rem}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.card-h h3{font-size:1.02rem;font-weight:700}
.card-h .muted{font-size:.78rem}
.subs{display:grid}
.subrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) 4.8em;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)}
.subrow:first-child{border-top:0}
.sub-l{display:grid;min-width:0}
.sub-l b{font-size:.92rem}
.sub-l span{font-size:.74rem;color:var(--muted)}
.sub-r{text-align:right;font:500 .82rem var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.sub-r b{font-weight:600}
.sub-r .muted{font:500 .72rem var(--f-ui)}
.gridwrap{overflow-x:auto}
.grid{width:100%;border-collapse:separate;border-spacing:4px}
.grid th{font-size:.74rem;font-weight:700;color:var(--muted);text-align:center;padding:2px}
.grid tbody th{text-align:left;white-space:nowrap}
.gp{font-weight:600;color:var(--ink);font-size:.8rem}
.cell{width:100%;min-width:52px;height:34px;border-radius:9px;font:600 .82rem var(--f-num);font-variant-numeric:tabular-nums}
.cell.good{background:var(--ok-soft);color:var(--ok)}
.cell.mid{background:var(--mid-soft);color:var(--mid)}
.cell.low{background:var(--bad-soft);color:var(--bad)}
.cell.none{border:1px dashed var(--line);color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.low{background:var(--bad)}.legend i.mid{background:var(--mid)}.legend i.good{background:var(--ok)}

/* tests */
.pagehead{margin-top:6px}
.pagehead h1{font-weight:800;font-size:1.9rem;letter-spacing:-.025em}
.pagehead p{color:var(--muted);margin-top:6px;max-width:60ch}
.tcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.tnum{width:46px;height:34px;display:grid;place-items:center;border:1.5px solid var(--drop);border-radius:999px;font:600 1rem var(--f-num);color:var(--drop)}
.tbody h3{font-size:1.1rem;font-weight:800}
.tbody p{font-size:.85rem;color:var(--muted)}
.tprog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:.76rem;color:var(--muted);flex-wrap:wrap}
.tprog-bar{flex:1;min-width:80px;height:5px;border-radius:99px;background:var(--line2);overflow:hidden}
.tprog-bar i{display:block;height:100%;background:var(--drop)}
.chev{font-size:1.4rem;color:var(--muted);line-height:1}
.sims{display:grid;gap:8px}
.sim{display:grid;gap:2px;text-align:left;padding:12px 14px;border:1.5px solid var(--drop);border-radius:12px;background:var(--drop-soft)}
.sim b{font-size:.95rem}
.sim span{font-size:.8rem;color:var(--muted)}
.wtotal{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-top:12px;padding:12px 14px;border-radius:12px;font-size:.85rem}
.wtotal b{font:600 1.2rem var(--f-num)}
.wtotal em{font-style:normal;font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.wtotal.good{background:var(--ok-soft)}.wtotal.mid{background:var(--mid-soft)}.wtotal.low{background:var(--bad-soft)}
.plist2{display:grid}
.prow{display:grid;grid-template-columns:4.4em minmax(0,1fr) auto auto;gap:10px;align-items:center;text-align:left;padding:12px 2px;border-top:1px solid var(--line2)}
.prow:first-child{border-top:0}
.prange{font:500 .74rem var(--f-num);color:var(--muted)}
.pname{display:grid;min-width:0}
.pname b{font-size:.93rem}
.pname span{font-size:.76rem;color:var(--muted)}

/* exam parts */
.part{margin-top:22px}
.phead .kicker{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--drop)}
.phead h2{font-weight:800;font-size:1.4rem;letter-spacing:-.02em;margin-top:2px}
.pmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);margin-top:6px;align-items:center}
.instr{font-weight:600;margin-top:12px;max-width:65ch}
.hint{font-size:.85rem;color:var(--muted);font-style:italic;margin-top:12px}
.notice{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--drop-soft);font-size:.86rem}
.ref{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.ref-h{display:block;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ads-h{margin-top:22px}
.hl{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.hl li{display:flex;gap:10px;align-items:baseline;font-family:var(--f-read);font-size:.95rem;line-height:1.35}
.txt{margin-top:12px}
.txt-b,.article,.letter,.quote{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-family:var(--f-read);font-size:1.02rem;line-height:1.65}
.txt-b p+p,.article p+p,.letter p+p,.quote p+p{margin-top:.8em}
.txt-no{font:600 .78rem var(--f-num);color:var(--drop);margin-bottom:6px}
.src{font-size:.8rem;font-style:italic;color:var(--muted);margin-top:8px}
.article{margin-top:12px}
.article h3{font-weight:700;font-size:1.35rem;line-height:1.25}
.article .dek{font-style:italic;color:var(--muted);margin:4px 0 12px}
.ans{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:center;width:100%;margin-top:8px;padding:10px 12px;border:1.5px dashed var(--drop);border-radius:12px;background:var(--drop-soft);text-align:left}
.ans.filled{border-style:solid}
.ans .lbl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.ans:not(.filled) .lbl{color:var(--drop);font-weight:600}
.ans.ok{border:1.5px solid var(--ok);background:var(--ok-soft)}
.ans.bad{border:1.5px solid var(--bad);background:var(--bad-soft)}
.mcq{margin-top:18px}
.mcq-s{display:flex;gap:8px;font-weight:600}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);font-family:var(--f-read);font-size:.98rem;line-height:1.4;transition:border-color .15s}
.opt .bub{margin-top:1px}
.opt.on{border-color:var(--pencil)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts.inline{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:0}
.opt.sm{padding:8px;font-size:.92rem;align-items:center;gap:7px;min-width:0;overflow-wrap:anywhere}
.sits{display:grid;gap:10px;margin-top:12px}
.sit{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sit p{display:flex;gap:8px;font-family:var(--f-read);line-height:1.45}
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ad{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--sheet)}
.ad:nth-child(3n+2){border-style:dashed}
.ad:nth-child(3n){border-width:2px}
.ad h5{font-weight:800;font-size:.95rem;margin:8px 0 3px;letter-spacing:-.01em}
.ad p{font-family:var(--f-read);font-size:.88rem;line-height:1.45}
.letter{margin-top:12px;line-height:1.95}
.letter-h{font:700 .72rem var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;line-height:1.4}
.gap{display:inline-flex;align-items:baseline;gap:5px;padding:0 9px;margin:0 2px;border-bottom:2px solid var(--drop);background:var(--drop-soft);border-radius:6px 6px 0 0;font:inherit;line-height:1.5;min-width:4.6em}
.gap .gno{font:600 .66rem var(--f-num);color:var(--drop)}
.gap .gw{font-weight:600}
.gap.ok{border-bottom-color:var(--ok);background:var(--ok-soft)}
.gap.bad{border-bottom-color:var(--bad);background:var(--bad-soft)}
.gqs{margin-top:12px;display:grid}
.gq{padding:9px 0;border-top:1px solid var(--line2);border-radius:8px}
.gq-r{display:grid;grid-template-columns:2.3em minmax(0,1fr);align-items:center}
.gq.flash{animation:flash 1.2s}
@keyframes flash{0%,40%{background:var(--drop-soft)}100%{background:transparent}}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.bw{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:99px;font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;transition:opacity .2s}
.bw.used{opacity:.38;text-decoration:line-through}
.strip{display:grid;gap:4px;margin-top:12px}
.player{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:10;display:grid;gap:6px;margin-top:12px;padding:12px 14px;background:var(--sheet);border:1.5px solid var(--drop);border-radius:14px}
.player-r{display:flex;gap:8px;flex-wrap:wrap}
.player .play{background:var(--drop);border-color:var(--drop);color:var(--drop-ink)}
.pstat{font:500 .8rem var(--f-num);color:var(--muted)}
.rf{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);transition:border-color .2s,box-shadow .2s}
.rf.now{border-color:var(--drop);box-shadow:0 0 0 3px var(--drop-soft)}
.rf-s{display:flex;gap:8px;font-family:var(--f-read);line-height:1.45}
.rfb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rfo{justify-content:center;align-items:center;font-family:var(--f-ui);font-weight:600;font-size:.92rem}

headlines:[
`Bibliothek bleibt wegen Umbau geschlossen`,
`Schülerinnen gewinnen mit Müll-Roboter`,
`Werkzeug leihen statt kaufen`,
`Brot wird immer teurer`,
`Bürger kümmern sich um junge Bäume`,

texts:[
{src:`aus einer Lokalzeitung`, t:`In der Stadtbibliothek Neustadt kann man seit Montag nicht nur Bücher und Filme ausleihen. In einem neuen Raum im Erdgeschoss stehen jetzt Bohrmaschinen, Nähmaschinen, Zelte und sogar ein Beamer. Wer einen Bibliotheksausweis hat, darf die Geräte bis zu zwei Wochen kostenlos mitnehmen. „Viele Menschen brauchen eine Bohrmaschine nur zweimal im Jahr. Warum soll dann jeder eine kaufen?“, fragt Bibliotheksleiterin Petra Kolb. Die Idee kommt gut an: Schon am ersten Tag waren fast alle Geräte ausgeliehen.`},
{src:`aus einer Stadtteilzeitung`, t:`Jeden Samstagvormittag steht Herbert Lange, 71, vor seiner Garage und repariert Fahrräder. Kinder und Jugendliche aus der Nachbarschaft bringen ihre kaputten Räder, und der frühere Mechaniker zeigt ihnen, wie man einen Reifen flickt oder die Bremsen einstellt. Geld nimmt er dafür nicht. „Die Kinder sollen lernen, dass man nicht alles gleich wegwerfen muss“, sagt er. Ersatzteile bekommt er von einem Fahrradgeschäft in der Nähe geschenkt.`},
{src:`aus einer Tageszeitung`, t:`Um 18 Uhr liegt in vielen Bäckereien noch viel Brot im Regal. Früher landete es oft im Müll. Die Bäckerei Hofmann macht es jetzt anders: Kurz vor Ladenschluss stellt sie die übrigen Backwaren in eine App. Kunden können dort eine Überraschungstüte für drei Euro reservieren und sie bis 19 Uhr abholen. „Wir werfen jetzt fast nichts mehr weg, und die Kunden freuen sich über den günstigen Preis“, erzählt die Chefin.`},
{src:`aus einem Gemeindeblatt`, t:`Die Gemeinde möchte in den nächsten fünf Jahren 2.000 neue Bäume pflanzen. Dafür sucht sie Hilfe von den Bürgerinnen und Bürgern. Wer möchte, kann eine Patenschaft für einen Baum übernehmen. Die Paten gießen ihren Baum im Sommer, wenn es lange nicht geregnet hat, und melden der Gemeinde, wenn er krank aussieht. Als Dankeschön bekommt jeder Pate ein kleines Schild mit seinem Namen am Baum.`},
{src:`aus einer Schülerzeitung`, t:`Fünf Schülerinnen einer Gesamtschule haben beim Landeswettbewerb „Jugend forscht“ den ersten Preis gewonnen. Sie haben einen kleinen Roboter gebaut, der Plastikmüll am Strand erkennt und einsammelt. Ein ganzes Jahr haben die Mädchen nach dem Unterricht an ihrer Idee gearbeitet. Im Mai fahren sie nun zum Bundeswettbewerb nach Berlin. Ihr Lehrer ist stolz: „Die fünf haben nie aufgegeben, auch wenn etwas nicht funktioniert hat.“`}],

l2:{
title:`Vier Tage arbeiten – drei Tage frei`,
sub:`Ein Handwerksbetrieb probiert ein neues Arbeitsmodell aus`,
text:`Freitagmorgen, acht Uhr: In der Werkstatt der Schreinerei Albrecht ist es still. Keine Maschine läuft, niemand sägt oder schleift Holz. Seit einem Jahr arbeiten die zwölf Angestellten des Betriebs nur noch von Montag bis Donnerstag. Der Freitag ist für alle frei – bei gleichem Lohn.

Die Idee hatte Firmenchef Jonas Albrecht, 38, der den Betrieb vor vier Jahren von seinem Vater übernommen hat. „Wir haben lange keine Auszubildenden gefunden, und zwei erfahrene Kollegen wollten kündigen, weil sie mehr Zeit für ihre Familien brauchten“, erzählt er. „Ich musste etwas ändern.“ Zuerst war er selbst skeptisch. Er hatte Angst, dass die Kunden länger auf ihre Möbel warten müssen.

Damit das nicht passiert, arbeitet das Team von Montag bis Donnerstag jeweils neun statt acht Stunden. Außerdem gibt es weniger Besprechungen: Das Team trifft sich nicht mehr jeden Tag, sondern nur noch einmal pro Woche, am Montagmorgen. „Früher haben wir viel Zeit mit Gesprächen verloren, die nicht nötig waren“, sagt Albrecht. Kunden, die am Freitag anrufen, hören eine Ansage und werden am Montag zurückgerufen. Bei Notfällen, zum Beispiel wenn eine Tür nach einem Einbruch repariert werden muss, hat immer ein Mitarbeiter Bereitschaft. Dafür bekommt er einen zusätzlichen freien Tag.

Nach einem Jahr ist die Bilanz positiv. Die Kunden warten nicht länger als früher, und die Zahl der Krankheitstage ist deutlich gesunken. Und noch etwas hat sich geändert: Im Herbst haben zwei junge Leute eine Ausbildung in der Schreinerei begonnen. „Beide haben mir gesagt, dass sie sich wegen der Vier-Tage-Woche bei uns beworben haben“, freut sich der Chef.

Nicht alle finden das neue Modell perfekt. Der Geselle Timo Brandt, 45, sagt: „Die langen Tage sind manchmal anstrengend, besonders im Sommer, wenn es in der Werkstatt heiß ist.“ Trotzdem möchte auch er nicht zurück zur Fünf-Tage-Woche. „Am Freitag gehe ich mit meinem Sohn zum Schwimmen. Das ist mir viel wert.“

Ob das Modell auch für größere Firmen funktioniert, weiß Albrecht nicht. „Für uns ist es jedenfalls die richtige Entscheidung“, sagt er.`,
q:[
{s:`Jonas Albrecht hat die Vier-Tage-Woche eingeführt, weil`, o:[`die Kunden mehr Flexibilität wollten.`,`sein Betrieb Probleme hatte, Personal zu finden und zu halten.`,`sein Vater ihm das empfohlen hatte.`], k:1, why:`Paragraph 2: no apprentices found and two experienced colleagues wanted to quit.`},
{s:`Damit die Kunden nicht länger warten müssen,`, o:[`arbeiten die Angestellten an vier Tagen länger.`,`haben die Angestellten weniger Urlaub.`,`arbeitet der Chef auch am Freitag.`], k:0, why:`Paragraph 3: nine instead of eight hours from Monday to Thursday.`},
{s:`Wer am Freitag anruft,`, o:[`erreicht immer einen Mitarbeiter.`,`bekommt in dringenden Fällen trotzdem Hilfe.`,`muss eine zusätzliche Gebühr bezahlen.`], k:1, why:`Normally there is a callback on Monday, but for emergencies one employee is on call (Bereitschaft).`},
{s:`Timo Brandt`, o:[`möchte wieder fünf Tage pro Woche arbeiten.`,`findet die langen Arbeitstage manchmal schwer.`,`geht am Freitag mit Kollegen schwimmen.`], k:1, why:`"Die langen Tage sind manchmal anstrengend." He does not want to go back (a), and he swims with his son (c).`},
{s:`Nach einem Jahr`, o:[`sind die Mitarbeiter seltener krank.`,`hat der Betrieb mehr Kunden als früher.`,`hat Albrecht zwei neue Gesellen eingestellt.`], k:0, why:`Fewer sick days. Trap (c): the two new people are apprentices (Auszubildende), not Gesellen.`}]
},

s1:{
head:`E-Mail an eine Freundin`,
text:`Liebe Sandra,

endlich habe ich Zeit, dir zu schreiben! Seit zwei Wochen wohne ich jetzt in meiner neuen Wohnung in Leipzig. Sie ist zwar kleiner [1] meine alte, aber sie hat einen schönen Balkon. Ich sitze jeden Abend draußen und lese, [2] das Wetter gut ist.

Der Umzug war ziemlich anstrengend. Zum Glück haben mir zwei Kollegen geholfen, die Möbel in den dritten Stock zu [3]. Einen Aufzug gibt es leider nicht! Die Nachbarn sind sehr nett. Die Frau, [4] neben mir wohnt, hat mir am ersten Tag einen Kuchen gebracht. Ich habe mich sehr [5] gefreut.

Nur mit der Heizung habe ich ein Problem: Sie wird nicht richtig warm. Ich habe den Vermieter schon angerufen, aber er hat sich noch nicht [6] gemeldet. Hoffentlich kommt bald ein Handwerker, [7] es wird ja langsam kalt.

Hast du Lust, mich im November zu besuchen? Du kannst gern bei mir übernachten, [8] ich jetzt ein Gästesofa habe. Sag mir bitte bald, [9] Wochenende dir am besten passt. Ich freue mich schon [10] dich!

Liebe Grüße
deine Elena`,
items:[
{o:[`als`,`wie`,`dann`], k:0, why:`Comparative + als: kleiner als.`},
{o:[`wenn`,`wann`,`ob`], k:0, why:`Repeated condition ("whenever") → wenn. wann is a question word.`},
{o:[`tragen`,`getragen`,`trägt`], k:0, why:`zu + infinitive: zu tragen.`},
{o:[`die`,`der`,`denen`], k:0, why:`Relative pronoun for die Frau, nominative → die.`},
{o:[`darauf`,`darüber`,`dafür`], k:1, why:`sich freuen über = happy about something that happened (the cake).`},
{o:[`bei mir`,`mich`,`mir`], k:0, why:`sich bei jemandem melden = to get in touch with someone.`},
{o:[`deshalb`,`denn`,`weil`], k:1, why:`The verb comes 2nd after the gap (es wird) → denn. weil sends the verb to the end.`},
{o:[`weil`,`denn`,`deshalb`], k:0, why:`The verb is at the end (habe) → weil.`},
{o:[`welches`,`welchem`,`welcher`], k:0, why:`das Wochenende, nominative neuter → welches.`},
{o:[`auf`,`über`,`an`], k:0, why:`sich freuen auf = looking forward to something in the future.`}]
},

s2:{
head:`Anfrage an die Volkshochschule`,
words:[`an`,`bis`,`dass`,`denn`,`deshalb`,`die`,`für`,`Gruß`,`Grüßen`,`ob`,`obwohl`,`seit`,`weil`,`wo`,`würde`],
text:`Sehr geehrte Damen und Herren,

in Ihrem Programmheft habe ich gelesen, [1] Sie im Januar einen Abendkurs „Deutsch für den Beruf B1“ anbieten. Ich interessiere mich sehr [2] diesen Kurs und hätte noch einige Fragen.

Ich arbeite [3] drei Jahren als Krankenpfleger in einem Krankenhaus. Leider habe ich Schichtdienst, [4] kann ich nicht jede Woche am selben Tag kommen. Ist es möglich, [5] einem anderen Kurs teilzunehmen, wenn ich einen Termin verpasse?

Außerdem möchte ich wissen, [6] der Kurs mit einer Prüfung endet. Ich brauche nämlich ein Zertifikat für meinen Arbeitgeber.

Könnten Sie mir bitte auch mitteilen, wie viel der Kurs kostet und [7] wann ich mich anmelden muss? Gibt es eine Ermäßigung für Personen, [8] wenig verdienen?

Ich [9] mich über eine baldige Antwort freuen.

Mit freundlichen [10]
Ahmed Karimi`,
key:[`dass`,`für`,`seit`,`deshalb`,`an`,`ob`,`bis`,`die`,`würde`,`Grüßen`],
why:[
`gelesen, dass … + verb at the end.`,
`sich interessieren für + Akkusativ.`,
`A period that continues until now → seit.`,
`Consequence with inversion: deshalb kann ich.`,
`teilnehmen an + Dativ.`,
`Indirect yes/no question → ob.`,
`bis wann = by when.`,
`Relative pronoun, plural: Personen, die …`,
`Polite form: Ich würde mich freuen.`,
`Fixed closing: Mit freundlichen Grüßen.`]
},

h1:[
{a:`Und nun zum Verkehr: Auf der Autobahn zwischen Kassel und Göttingen gibt es nach einem Unfall einen Stau von zwölf Kilometern. Die Polizei bittet alle Autofahrer, die Strecke zu umfahren. Wer nach Norden will, sollte über die Bundesstraße drei fahren. Die Aufräumarbeiten dauern voraussichtlich bis zum frühen Nachmittag.`, s:`Wegen eines Unfalls sollen Autofahrer eine andere Strecke nehmen.`, k:true, why:`"Die Polizei bittet alle Autofahrer, die Strecke zu umfahren."`},
{a:`Das Wetter für morgen: Am Vormittag bleibt es in ganz Bayern trocken, oft scheint sogar die Sonne. Ab dem Nachmittag ziehen von Westen Wolken auf, und am Abend kann es Gewitter geben. Die Temperaturen steigen auf bis zu sechsundzwanzig Grad. Am Wochenende wird es deutlich kühler.`, s:`Morgen regnet es den ganzen Tag.`, k:false, why:`The morning is dry and sunny; storms are possible only in the evening.`},
{a:`Gute Nachricht für alle Schwimmer: Das Hallenbad am Stadtpark öffnet nach der Renovierung schon am kommenden Montag, zwei Wochen früher als geplant. In den ersten sieben Tagen ist der Eintritt für alle Besucher frei. Danach gelten die neuen Preise: Erwachsene zahlen fünf Euro, Kinder drei Euro.`, s:`In der ersten Woche kostet das Schwimmbad nichts.`, k:true, why:`"In den ersten sieben Tagen ist der Eintritt frei."`},
{a:`Das Stadtfest am Wochenende findet trotz der Bauarbeiten in der Innenstadt statt. Die große Bühne steht in diesem Jahr allerdings nicht auf dem Marktplatz, sondern am Flussufer. Das Programm beginnt am Samstag um vierzehn Uhr mit einem Kinderkonzert. Die Veranstalter empfehlen, mit Bus und Bahn zu kommen, weil es kaum Parkplätze gibt.`, s:`Die Bühne steht wie jedes Jahr auf dem Marktplatz.`, k:false, why:`"nicht auf dem Marktplatz, sondern am Flussufer".`},
{a:`Eine Information für alle Mieterinnen und Mieter der Wohnungsgesellschaft WoBau: Ab dem ersten Dezember ist das Servicebüro in der Gartenstraße nur noch am Vormittag geöffnet, von acht bis zwölf Uhr. Am Nachmittag erreichen Sie uns telefonisch. Reparaturen können Sie außerdem rund um die Uhr online melden.`, s:`Reparaturen kann man auch im Internet melden.`, k:true, why:`"Reparaturen können Sie rund um die Uhr online melden."`}],

h2:{
intro:`Sie hören ein Interview im Radio mit Lena Hoffmann. Sie hat ein Reparatur-Café gegründet.`,
d:[
[`A`,`Herzlich willkommen bei „Treffpunkt Stadt“. Bei mir im Studio ist heute Lena Hoffmann. Sie hat vor drei Jahren ein Reparatur-Café gegründet. Frau Hoffmann, was ist denn ein Reparatur-Café genau?`],
[`B`,`Hallo! Also, ein Reparatur-Café ist ein Treffpunkt, wo Leute ihre kaputten Sachen hinbringen können, zum Beispiel einen Toaster, eine Lampe oder eine Hose mit einem Loch. Ehrenamtliche Helferinnen und Helfer reparieren die Sachen dann zusammen mit den Besitzern. Das Wichtige ist: Man repariert gemeinsam. Die Besucher sollen nicht nur warten, sondern mitmachen und etwas lernen.`],
[`A`,`Und wie sind Sie auf die Idee gekommen?`],
[`B`,`Das war eigentlich Zufall. Meine Kaffeemaschine war kaputt, und im Geschäft hat man mir gesagt, eine Reparatur lohnt sich nicht, ich soll lieber eine neue kaufen. Das hat mich geärgert. Ein Nachbar, der früher Elektriker war, hat sie dann in zwanzig Minuten repariert. Da habe ich gedacht: So etwas brauchen viel mehr Leute.`],
[`A`,`Wo findet das Café statt?`],
[`B`,`Am Anfang waren wir im Gemeindesaal einer Kirche, aber der Raum war bald zu klein. Seit letztem Jahr treffen wir uns im Stadtteilzentrum Nord, jeden ersten Samstag im Monat von vierzehn bis siebzehn Uhr.`],
[`A`,`Was kostet eine Reparatur bei Ihnen?`],
[`B`,`Nichts. Die Reparatur ist kostenlos. Wenn wir Ersatzteile brauchen, müssen die Besucher die natürlich bezahlen. Und wir haben eine Spendenkasse. Viele geben ein paar Euro, damit wir Werkzeug kaufen können.`],
[`A`,`Wer sind denn Ihre Helfer?`],
[`B`,`Das sind ganz unterschiedliche Leute. Viele sind Rentner, die früher Handwerker waren. Aber wir haben auch Studenten, die sich mit Computern und Handys auskennen. Und eine Schneiderin, die Kleidung repariert. Insgesamt sind wir ungefähr fünfzehn Personen.`],
[`A`,`Klappt denn jede Reparatur?`],
[`B`,`Leider nicht. Ich würde sagen, etwa zwei Drittel der Sachen können wir reparieren. Bei manchen Geräten ist das Problem, dass man sie gar nicht öffnen kann, ohne sie kaputt zu machen. Das ärgert mich immer sehr.`],
[`A`,`Was war das Ungewöhnlichste, das jemand mitgebracht hat?`],
[`B`,`Ein älterer Herr kam einmal mit einer Spieluhr aus dem Jahr neunzehnhundertzwanzig. Die hatte seiner Großmutter gehört. Wir haben drei Monate lang daran gearbeitet, aber am Ende hat sie wieder gespielt. Der Mann hatte Tränen in den Augen.`],
[`A`,`Das ist ja eine schöne Geschichte. Gibt es Pläne für die Zukunft?`],
[`B`,`Ja, wir möchten gern einmal im Monat in Schulen gehen und Kindern zeigen, wie man einfache Dinge selbst repariert. Dafür suchen wir aber noch mehr Helfer.`],
[`A`,`Frau Hoffmann, vielen Dank für das Gespräch.`]],
items:[
{s:`Im Reparatur-Café reparieren Helfer die Sachen, während die Besitzer warten.`, k:false, why:`They repair together: visitors should take part, not just wait.`},
{s:`Ein Geschäft wollte Lenas Kaffeemaschine nicht reparieren.`, k:true, why:`The shop said a repair wasn't worth it and she should buy a new one.`},
{s:`Lenas Nachbar hat die Kaffeemaschine schnell repariert.`, k:true, why:`"in zwanzig Minuten repariert".`},
{s:`Das Reparatur-Café findet heute noch in einer Kirche statt.`, k:false, why:`That was only at the beginning. Now: Stadtteilzentrum Nord.`},
{s:`Das Café ist jeden Samstag geöffnet.`, k:false, why:`Only on the first Saturday of the month.`},
{s:`Ersatzteile müssen die Besucher selbst bezahlen.`, k:true, why:`"Ersatzteile müssen die Besucher natürlich bezahlen."`},
{s:`Alle Helfer sind ehemalige Handwerker.`, k:false, why:`Many are retired tradespeople, but there are also students and a tailor.`},
{s:`Ungefähr die Hälfte der Sachen kann man nicht reparieren.`, k:false, why:`About two thirds can be repaired, so one third cannot.`},
{s:`Die Reparatur der Spieluhr hat lange gedauert.`, k:true, why:`They worked on it for three months.`},
{s:`Das Reparatur-Café möchte in Zukunft auch Kindern etwas beibringen.`, k:true, why:`They plan to visit schools and show children how to repair things.`}]
},

h3:[
{a:`Achtung am Gleis fünf: Der Regionalexpress nach Aachen, planmäßige Abfahrt sechzehn Uhr zwölf, fährt heute von Gleis acht ab. Bitte beachten Sie den Gleiswechsel. Der Zug hat etwa zehn Minuten Verspätung.`, s:`Der Zug nach Aachen fährt heute von einem anderen Gleis ab.`, k:true, why:`Platform change: from platform 5 to platform 8.`, v:`A`},
{a:`Guten Tag, hier ist die Praxis Doktor Weber. Wir rufen wegen Ihres Termins am Donnerstag an. Leider ist Frau Doktor Weber an diesem Tag krank. Wir können Ihnen einen neuen Termin am Freitag um neun Uhr oder am Montag um fünfzehn Uhr anbieten. Bitte rufen Sie uns zurück, damit wir den Termin eintragen können.`, s:`Der Patient soll am Donnerstag in die Praxis kommen.`, k:false, why:`The Thursday appointment is cancelled; Friday or Monday are offered.`, v:`B`},
{a:`Liebe Kundinnen und Kunden, nur noch heute: Alle Äpfel aus der Region kosten in unserer Obstabteilung nur ein Euro neunundvierzig pro Kilo. Und an der Käsetheke bekommen Sie bis achtzehn Uhr zu jedem Stück Käse ein frisches Baguette gratis dazu.`, s:`Das Angebot für Äpfel gilt die ganze Woche.`, k:false, why:`"nur noch heute" – only today.`, v:`A`},
{a:`Hallo Tobias, hier ist Mira. Du, wegen heute Abend: Das Kino ist leider ausverkauft. Wollen wir stattdessen essen gehen? Ich habe einen Tisch beim Italiener am Bahnhof reserviert, um halb acht. Sag mir bitte kurz Bescheid, ob das für dich passt. Tschüss!`, s:`Mira möchte mit Tobias ins Restaurant gehen.`, k:true, why:`She reserved a table at the Italian restaurant instead of the cinema.`, v:`B`},
{a:`Herzlich willkommen im Naturkundemuseum. Bitte beachten Sie: Wegen Umbauarbeiten ist der zweite Stock heute geschlossen. Die Ausstellung über Dinosaurier finden Sie deshalb vorübergehend im Erdgeschoss. Das Museumscafé im ersten Stock ist wie immer bis siebzehn Uhr geöffnet.`, s:`Die Dinosaurier-Ausstellung ist heute im zweiten Stock.`, k:false, why:`The 2nd floor is closed; the dinosaurs are on the ground floor today.`, v:`A`}],

Wie geht es dir eigentlich? Was machst du so?

Viele Grüße
Marco`,

model:`Köln, 14.01.2026

Lieber Marco,

vielen Dank für deine E-Mail! Ich freue mich sehr, dass du einen neuen Job gefunden hast und bald in meiner Stadt wohnst. Herzlichen Glückwunsch!

Du hast nach Tipps für die Wohnungssuche gefragt. Am schönsten finde ich Ehrenfeld, weil es dort viele Cafés und kleine Geschäfte gibt. Leider sind die Wohnungen dort ziemlich teuer. Eine Zweizimmerwohnung kostet ungefähr 900 Euro warm. Günstiger ist es in Kalk. Außerdem bist du von dort mit der Straßenbahn schnell im Zentrum.

Wenn du zur Besichtigung kommst, können wir uns gern treffen. Wie wäre es mit Samstagnachmittag in einem Café am Dom? Danach zeige ich dir die Altstadt.

Bei mir gibt es auch Neues: Seit Dezember mache ich abends einen Deutschkurs, und im März möchte ich die B1-Prüfung machen. Drück mir die Daumen!

Ich freue mich auf dich.

Viele Grüße
Ana`},

model:`Augsburg, 20.02.2026

Sehr geehrte Frau Ritter,

in der Zeitung habe ich Ihre Anzeige für den Lauftreff gelesen. Ich interessiere mich sehr dafür und möchte gern mitmachen.

In meiner Heimat habe ich früher Volleyball gespielt, aber seit meinem Umzug nach Deutschland mache ich leider kaum noch Sport. Ich bin also wirklich Anfängerin und kann im Moment nur etwa zwanzig Minuten am Stück laufen.

Ich hätte noch einige Fragen: Um wie viel Uhr beginnt das Training am Dienstag? Ich arbeite bis 17 Uhr. Außerdem möchte ich wissen, wie viel der Lauftreff kostet. Muss ich Mitglied im Verein werden?

Könnte ich vielleicht zuerst ein Probetraining machen? Dann kann ich sehen, ob die Gruppe zu mir passt.

Über eine baldige Antwort würde ich mich sehr freuen.

Mit freundlichen Grüßen
Lucía Fernández`}],

extra:[`Wie verbringen Sie gern Ihr Wochenende?`,`Was kochen Sie gern?`],
t2:{
topic:`Arbeiten im Homeoffice`,
a:{who:`Sabine, 34, Grafikerin`, t:`Seit zwei Jahren arbeite ich fast nur noch zu Hause. Ich spare jeden Tag eine Stunde Fahrzeit und kann mir die Arbeit selbst einteilen. Mittags koche ich frisch, statt in der Kantine zu essen. Manchmal fehlen mir aber die Gespräche mit den Kollegen. Deshalb fahre ich einmal pro Woche ins Büro.`},
b:{who:`Karim, 27, Bankkaufmann`, t:`Ich habe im Homeoffice schlechte Erfahrungen gemacht. Meine Wohnung ist klein, und ich hatte keinen richtigen Arbeitsplatz. Oft habe ich bis spät abends gearbeitet, weil Arbeit und Freizeit nicht mehr getrennt waren. Jetzt gehe ich wieder jeden Tag ins Büro und bin viel zufriedener.`},
sumA:`In meinem Text geht es um Sabine. Sie ist vierunddreißig und arbeitet als Grafikerin. Sie arbeitet seit zwei Jahren fast nur zu Hause und findet das gut. Sie spart viel Zeit, weil sie nicht fahren muss, und sie kann mittags selbst kochen. Nur der Kontakt zu den Kollegen fehlt ihr manchmal. Deshalb fährt sie einmal pro Woche ins Büro.`,
sumB:`In meinem Text geht es um Karim. Er ist siebenundzwanzig und arbeitet bei einer Bank. Er hat im Homeoffice schlechte Erfahrungen gemacht. Seine Wohnung war zu klein, und er hatte keinen richtigen Schreibtisch. Außerdem hat er oft bis spät abends gearbeitet. Jetzt geht er wieder jeden Tag ins Büro und ist zufriedener.`,
q:[`Hast du selbst schon einmal von zu Hause gearbeitet?`,`Wie ist das in deinem Heimatland? Arbeiten dort viele Leute im Homeoffice?`,`Für welche Berufe ist Homeoffice nicht möglich?`,`Was ist für dich wichtiger: Zeit sparen oder Kontakt mit Kollegen?`,`Würdest du lieber zu Hause oder im Büro arbeiten? Warum?`]},

l1:{
headlines:[
`Bahn streicht Verbindungen nach Süden`,
`Jung und Alt unter einem Dach`,
`Pakete abholen beim Bäcker`,
`Im Schlaf nach Italien`,
`Hotel sucht dringend Köche`,

texts:[
{src:`aus einer Reisezeitschrift`, t:`Seit Dezember fährt wieder ein Nachtzug von München nach Rom. Die Fahrt dauert etwa vierzehn Stunden. Reisende können zwischen Sitzplätzen, Liegewagen und Schlafabteilen mit eigener Dusche wählen. Die Bahn hofft, dass so mehr Menschen auf das Flugzeug verzichten. Schon in den ersten Wochen waren viele Züge am Wochenende ausgebucht. Wer günstig reisen möchte, sollte deshalb früh buchen.`},
{src:`aus einer Regionalzeitung`, t:`Im Hotel „Seeblick“ arbeiten zurzeit fast nur junge Leute. Sechzehn Auszubildende führen hier zwei Wochen lang das ganze Hotel – von der Rezeption bis zur Küche. Die erfahrenen Mitarbeiter halten sich im Hintergrund und helfen nur, wenn es Probleme gibt. „Die Gäste merken meistens gar nicht, dass Azubis alles organisieren“, sagt Hotelchefin Maria Fink. Für die jungen Leute ist das Projekt eine gute Vorbereitung auf die Abschlussprüfung.`},
{src:`aus einer Tageszeitung`, t:`Viele Menschen kennen das Problem: Das Paket kommt, aber niemand ist zu Hause. In Kiel gibt es deshalb jetzt in zwanzig Bäckereien und Kiosken kleine Schränke, in denen Pakete abgegeben werden. Die Kunden bekommen eine Nachricht aufs Handy und können ihr Paket abholen, wann sie wollen – auch am Sonntag. Die Paketdienste sparen so viele Fahrten.`},
{src:`aus einem Hochschulmagazin`, t:`Eine Wohnung gegen Hilfe: Ein Projekt in Göttingen bringt Studierende und ältere Menschen zusammen. Die Studierenden bekommen ein Zimmer und zahlen nur die Nebenkosten. Dafür helfen sie ihren Vermietern im Alltag, zum Beispiel beim Einkaufen oder im Garten. Pro Quadratmeter Wohnfläche arbeiten sie etwa eine Stunde im Monat. Pflege gehört aber nicht zu den Aufgaben.`},
{src:`aus einer Stadtteilzeitung`, t:`Einmal im Monat verwandelt sich die Turnhalle der Grundschule in einen großen Kleiderschrank. Beim Kleidertausch können alle bis zu zehn gut erhaltene Kleidungsstücke mitbringen und dafür andere mitnehmen. Geld spielt dabei keine Rolle. Was am Ende übrig bleibt, bekommt eine Hilfsorganisation. Die Organisatorinnen wollen zeigen, dass Mode nicht immer neu sein muss.`}],
key:[`d`,`h`,`c`,`b`,`f`],
why:[
`A night train to Rome – you sleep on the way to Italy. Trap: (a) – connections are added, not cut.`,
`Apprentices run the whole hotel for two weeks. Trap: (e) – nobody is looking for cooks.`,
`Parcels are left in lockers in bakeries and kiosks. Trap: (i) – prices are not mentioned.`,
`Students live with older people and help them. Trap: (g) – the text is not about a shortage of rooms.`,
`People swap clothes instead of buying new ones. Trap: (j) – the gym hall is only the location.`]
},

l2:{
title:`Ein Jahr ohne eigenes Auto`,
sub:`Eine Familie aus Leipzig hat es ausprobiert`,
text:`Als im letzten Winter das Auto von Familie Becker kaputtging, stand die Familie vor einer Entscheidung: reparieren lassen, ein neues kaufen – oder ganz ohne Auto leben? „Die Reparatur hätte 2.500 Euro gekostet“, erzählt Sandra Becker, 41. „Da haben wir gesagt: Wir probieren es ein Jahr ohne.“

Für die Familie aus Leipzig war das eine große Umstellung. Sandra Becker arbeitet als Krankenschwester, ihr Mann Thomas ist Lehrer, die Kinder Jonas und Mila sind zehn und dreizehn Jahre alt. Früher hat Thomas die Kinder jeden Morgen mit dem Auto zur Schule gebracht. Heute fahren beide allein mit dem Fahrrad, im Winter mit der Straßenbahn. „Am Anfang haben sich die Kinder beschwert“, sagt Thomas Becker. „Inzwischen finden sie es gut, dass sie selbstständiger sind.“

Am schwierigsten war der Wocheneinkauf. Die Familie hat sich deshalb einen Fahrradanhänger gekauft. Große Einkäufe, zum Beispiel Getränkekisten, lassen sie sich manchmal vom Supermarkt nach Hause liefern. Für Ausflüge und Besuche bei den Großeltern auf dem Land leihen sie sich ein Auto bei einem Carsharing-Anbieter. „Das brauchen wir etwa zweimal im Monat“, sagt Sandra Becker.

Und die Kosten? Die Familie hat genau gerechnet. Für das alte Auto haben sie jeden Monat etwa 350 Euro bezahlt – für Benzin, Versicherung, Steuern und Reparaturen. Heute geben sie für Carsharing, Monatskarten und Fahrradreparaturen rund 180 Euro aus. „Das Geld sparen wir jetzt für den nächsten Urlaub“, sagt Thomas Becker.

Ganz ohne Probleme ist das Leben ohne Auto aber nicht. Als Sandra Becker im Sommer nach einer Nachtschicht um sechs Uhr morgens nach Hause wollte, fuhr wegen Bauarbeiten keine Straßenbahn. „Da habe ich eine Stunde auf den Ersatzbus gewartet“, erinnert sie sich. Sie wünscht sich, dass Busse und Bahnen auch nachts öfter fahren.

Das Jahr ist jetzt vorbei. Ein neues Auto wollen die Beckers trotzdem nicht kaufen. „Wir haben gemerkt, dass wir viel weniger brauchen, als wir gedacht haben“, sagt Thomas Becker.`,
q:[
{s:`Familie Becker lebt ohne Auto, weil`, o:[`sie aus Umweltgründen kein Auto mehr wollte.`,`die Reparatur des alten Autos sehr teuer gewesen wäre.`,`sie in die Innenstadt umgezogen ist.`], k:1, why:`"Die Reparatur hätte 2.500 Euro gekostet." The environment is never given as the reason.`},
{s:`Die Kinder`, o:[`kommen heute ohne die Eltern zur Schule.`,`wollten von Anfang an ohne Auto leben.`,`werden von der Mutter mit der Straßenbahn gebracht.`], k:0, why:`"Heute fahren beide allein mit dem Fahrrad." At first they complained (b ✗).`},
{s:`Für große Einkäufe`, o:[`leiht die Familie ein Carsharing-Auto.`,`nutzt die Familie manchmal einen Lieferservice.`,`helfen die Großeltern.`], k:1, why:`Drinks crates are sometimes delivered by the supermarket. Carsharing is for trips and visits (a ✗).`},
{s:`Ohne Auto`, o:[`gibt die Familie fast die Hälfte weniger für Mobilität aus.`,`kann die Familie keinen Urlaub mehr machen.`,`sind die Kosten etwa gleich geblieben.`], k:0, why:`350 € before, about 180 € now – roughly half. The savings go into the next holiday (b ✗).`},
{s:`Sandra Becker`, o:[`hatte einmal nach der Arbeit ein Problem, weil keine Bahn fuhr.`,`möchte bald wieder ein eigenes Auto.`,`arbeitet nur nachts.`], k:0, why:`After a night shift no tram was running and she waited an hour for the replacement bus.`}]
},

s1:{
head:`Brief an die Gastfamilie`,
text:`Liebe Familie Schneider,

schon ein Jahr ist es her, [1] ich bei Ihnen in Freiburg gewohnt habe. Ich denke oft an die schöne Zeit zurück. Vielen Dank noch einmal, dass Sie mich so herzlich [2] haben!

Inzwischen bin ich wieder in Spanien und studiere Medizin. Das Studium ist sehr interessant, [3] ich muss viel lernen. Deutsch spreche ich leider nicht mehr so oft wie früher. Deshalb nehme ich jetzt [4] einem Tandem teil. Meine Tandempartnerin heißt Julia und kommt aus Köln. Wir treffen [5] jeden Dienstag in einem Café.

Ich habe eine gute Nachricht: Im Sommer mache ich ein Praktikum in einem Krankenhaus in Stuttgart. Wenn es Ihnen passt, [6] ich Sie gern an einem Wochenende besuchen. Ich möchte auch Lukas wiedersehen. Spielt er immer noch so gern Fußball? Bitte grüßen Sie ihn von [7]!

Ich habe Ihnen ein kleines Paket geschickt. Darin ist ein Kochbuch mit spanischen Rezepten, [8] Sie hoffentlich gut gebrauchen können. Frau Schneider, Sie haben doch immer gesagt, dass Sie unbedingt einmal eine echte Paella kochen [9].

Ich würde mich sehr freuen, [10] Sie mir bald schreiben.

Herzliche Grüße
Ihre Carmen`,
items:[
{o:[`dass`,`ob`,`wenn`], k:0, why:`Fixed pattern: Es ist ein Jahr her, dass …`},
{o:[`aufgenommen`,`aufnehmen`,`aufgenommt`], k:0, why:`Perfekt: haben + Partizip II → aufgenommen (irregular).`},
{o:[`aber`,`oder`,`sondern`], k:0, why:`Contrast → aber. sondern only follows a negation.`},
{o:[`an`,`bei`,`zu`], k:0, why:`teilnehmen an + Dativ.`},
{o:[`uns`,`sich`,`euch`], k:0, why:`Reflexive pronoun for wir → uns.`},
{o:[`würde`,`wäre`,`hätte`], k:0, why:`Polite wish: würde … besuchen (würde + infinitive).`},
{o:[`mir`,`mich`,`mein`], k:0, why:`von + Dativ → von mir.`},
{o:[`das`,`dem`,`den`], k:0, why:`das Kochbuch is the object (Akkusativ, neuter) → das.`},
{o:[`möchten`,`möchte`,`möchtest`], k:0, why:`Formal Sie takes the plural verb form → möchten.`},
{o:[`wenn`,`ob`,`als`], k:0, why:`Condition → wenn: Ich würde mich freuen, wenn …`}]
},

s2:{
head:`Beschwerde an einen Online-Shop`,
words:[`als`,`außerdem`,`bei`,`bis`,`dass`,`denn`,`falls`,`freue`,`freuen`,`ob`,`so`,`über`,`wann`,`weil`,`wo`],
text:`Sehr geehrte Damen und Herren,

am 3. März habe ich in Ihrem Online-Shop einen Schreibtisch bestellt. Auf Ihrer Internetseite stand, [1] die Lieferung innerhalb von fünf Werktagen kommt. Leider habe ich [2] heute, also nach drei Wochen, noch nichts bekommen.

Ich habe schon zweimal bei Ihrer Hotline angerufen, aber niemand konnte mir sagen, [3] genau mein Schreibtisch ist. [4] habe ich Ihnen eine E-Mail geschrieben, aber keine Antwort bekommen. Das finde ich sehr ärgerlich, [5] ich arbeite von zu Hause und brauche den Schreibtisch dringend.

Ich bitte Sie deshalb, mir den Schreibtisch bis spätestens Freitag zu liefern. [6] das nicht möglich ist, möchte ich die Bestellung stornieren und mein Geld zurückbekommen. Den Betrag von 189 Euro habe ich bereits [7] der Bestellung überwiesen.

Bitte informieren Sie mich [8] schnell wie möglich [9] den Stand meiner Bestellung. Meine Bestellnummer ist 4471-22.

Ich [10] mich auf Ihre Antwort.

Mit freundlichen Grüßen
Marta Kowalczyk`,
key:[`dass`,`bis`,`wo`,`außerdem`,`denn`,`falls`,`bei`,`so`,`über`,`freue`],
why:[
`stand, dass … + verb at the end.`,
`bis heute = until today.`,
`Where is it? → wo (verb at the end: ist).`,
`Adds a point, with inversion: Außerdem habe ich …`,
`Verb in 2nd position after the gap (ich arbeite) → denn.`,
`Condition: falls = if (in case).`,
`bei der Bestellung = when ordering.`,
`so … wie möglich.`,
`informieren über + Akkusativ.`,
`ich + present tense → freue (freuen is the infinitive).`]
},

h1:[
{a:`Und jetzt die Verkehrsmeldungen. Die S-Bahn-Linie fünf fährt wegen Bauarbeiten an diesem Wochenende, von Freitagabend bis Montagmorgen, nur zwischen Ostkreuz und Strausberg. Zwischen Ostkreuz und Westkreuz fahren Ersatzbusse. Fahrgäste sollten etwa zwanzig Minuten mehr Zeit einplanen.`, s:`Am Wochenende fahren auf einem Teil der Strecke Busse statt Züge.`, k:true, why:`Between Ostkreuz and Westkreuz replacement buses run until Monday morning.`},
{a:`Nachrichten aus der Region: Der Tierpark unserer Stadt hat seit gestern ein Elefantenbaby. Mutter und Kind sind gesund. Besucher können das Baby aber erst in etwa zwei Wochen sehen. Bis dahin bleiben die beiden im Stall, damit sie sich in Ruhe kennenlernen können.`, s:`Besucher können das Elefantenbaby ab heute sehen.`, k:false, why:`Only in about two weeks.`},
{a:`Gute Nachricht für Pendler: Ab dem nächsten Monat fährt der Bus einunddreißig zwischen dem Gewerbegebiet und dem Hauptbahnhof auch am Abend. Bisher war um neunzehn Uhr Schluss, jetzt fährt der letzte Bus erst um dreiundzwanzig Uhr. Am Wochenende bleibt der Fahrplan wie bisher.`, s:`Der Bus einunddreißig fährt in Zukunft auch am Wochenende länger.`, k:false, why:`Later buses on weekdays only; the weekend timetable stays the same.`},
{a:`Das Wetter: Heute Nacht wird es in ganz Norddeutschland frostig, mit Temperaturen bis minus fünf Grad. Autofahrer müssen am Morgen mit Glätte rechnen. Tagsüber bleibt es trocken und sonnig, bei Höchstwerten um drei Grad.`, s:`Morgen früh können die Straßen glatt sein.`, k:true, why:`"Autofahrer müssen am Morgen mit Glätte rechnen."`},
{a:`Die Stadtbibliothek bietet ab sofort einen neuen Service an: Wer ein Buch ausleihen möchte, das gerade nicht da ist, kann es online reservieren. Sobald das Buch zurück ist, bekommt man eine E-Mail. Die Reservierung kostet einen Euro.`, s:`Die Reservierung von Büchern ist kostenlos.`, k:false, why:`It costs one euro.`}],

h2:{
intro:`Sie hören ein Gespräch im Radio mit Julia Krämer. Sie macht eine Ausbildung.`,
d:[
[`A`,`Willkommen zu unserer Sendung „Wege in den Beruf“. Heute ist Julia Krämer bei uns. Sie ist fünfundzwanzig Jahre alt und macht gerade eine Ausbildung zur Mechatronikerin. Frau Krämer, Sie haben vorher studiert, richtig?`],
[`B`,`Ja, genau. Nach dem Abitur habe ich Betriebswirtschaft studiert, also BWL. Das haben meine Eltern mir empfohlen, weil man damit angeblich überall einen Job findet. Ich war drei Jahre an der Uni, aber ich war nie richtig glücklich.`],
[`A`,`Was hat Ihnen nicht gefallen?`],
[`B`,`Ich saß den ganzen Tag in Vorlesungen oder in der Bibliothek. Alles war sehr theoretisch. Ich habe gemerkt, dass ich lieber mit den Händen arbeite und am Ende des Tages sehen möchte, was ich gemacht habe.`],
[`A`,`Und dann haben Sie das Studium abgebrochen?`],
[`B`,`Nicht sofort. Ich hatte große Angst, was meine Eltern sagen. Ich habe dann zuerst ein Praktikum in einer Autowerkstatt gemacht, in den Semesterferien, sechs Wochen lang. Das hat mir so viel Spaß gemacht, dass ich danach sicher war.`],
[`A`,`Wie haben Ihre Eltern reagiert?`],
[`B`,`Mein Vater war am Anfang enttäuscht. Meine Mutter hat mich aber sofort unterstützt. Heute sind beide stolz auf mich. Mein Vater fragt mich jetzt sogar, wenn sein Auto ein Problem hat.`],
[`A`,`Wo machen Sie Ihre Ausbildung?`],
[`B`,`Bei einer Firma in Ulm, die Maschinen für die Lebensmittelindustrie baut. Die Ausbildung dauert normalerweise dreieinhalb Jahre. Weil ich Abitur habe, kann ich sie aber um ein halbes Jahr verkürzen.`],
[`A`,`Sind Sie die einzige Frau in Ihrem Ausbildungsjahr?`],
[`B`,`Nein, wir sind zwei Frauen und neun Männer. Das ist kein Problem. Die Kollegen sind sehr hilfsbereit. Manchmal muss ich aber schon zeigen, dass ich genauso gut bin.`],
[`A`,`Hat Ihnen das Studium heute noch etwas genützt?`],
[`B`,`Ja, auf jeden Fall. In der Berufsschule habe ich in Wirtschaft keine Probleme. Und ich verstehe besser, wie eine Firma funktioniert. Die drei Jahre waren also nicht verloren.`],
[`A`,`Was möchten Sie nach der Ausbildung machen?`],
[`B`,`Ich möchte erst einmal ein paar Jahre arbeiten und Erfahrung sammeln. Später kann ich mir vorstellen, den Meister zu machen. Vielleicht bilde ich dann selbst junge Leute aus.`],
[`A`,`Was würden Sie jungen Leuten raten, die nicht wissen, ob ihr Studium das Richtige ist?`],
[`B`,`Sie sollten Praktika machen und ausprobieren, was ihnen Spaß macht. Und keine Angst haben, einen Weg zu ändern. Es ist nie zu spät.`],
[`A`,`Vielen Dank, Frau Krämer, und weiterhin viel Erfolg!`]],
items:[
{s:`Julia hat BWL studiert, weil ihre Eltern ihr das geraten haben.`, k:true, why:`"Das haben meine Eltern mir empfohlen."`},
{s:`Julia hat das Studium nach einem Jahr abgebrochen.`, k:false, why:`She was at university for three years.`},
{s:`Vor ihrer Entscheidung hat Julia in einer Werkstatt gearbeitet.`, k:true, why:`A six-week internship in a car workshop.`},
{s:`Julias Mutter war gegen die Ausbildung.`, k:false, why:`Her father was disappointed; her mother supported her straight away.`},
{s:`Julia macht ihre Ausbildung in einer Autowerkstatt.`, k:false, why:`At a company that builds machines for the food industry.`},
{s:`Julias Ausbildung dauert kürzer als normal.`, k:true, why:`Because of her Abitur she can shorten it by half a year.`},
{s:`In Julias Ausbildungsjahr gibt es mehr Männer als Frauen.`, k:true, why:`Two women and nine men.`},
{s:`Julia findet, dass die Zeit an der Uni verlorene Zeit war.`, k:false, why:`"Die drei Jahre waren also nicht verloren."`},
{s:`Julia möchte direkt nach der Ausbildung den Meister machen.`, k:false, why:`First she wants to work for a few years.`},
{s:`Julia rät jungen Leuten, Praktika zu machen.`, k:true, why:`"Sie sollten Praktika machen."`}]
},

h3:[
{a:`Passagiere des Fluges achtzehn achtunddreißig nach Barcelona: Der Flug hat heute rund fünfundvierzig Minuten Verspätung. Das Boarding beginnt deshalb erst um elf Uhr zwanzig am Gate B vierzehn. Wir bitten um Ihr Verständnis.`, s:`Das Boarding für den Flug nach Barcelona beginnt später.`, k:true, why:`45 minutes' delay, boarding only at 11:20.`, v:`A`},
{a:`Guten Tag, Frau Novak, hier spricht Herr Kraus von der Hausverwaltung. Wegen der Heizung in Ihrer Wohnung: Der Techniker kommt am Mittwoch zwischen acht und zwölf Uhr. Wenn Sie an diesem Tag nicht zu Hause sind, können Sie den Schlüssel auch bei Ihrer Nachbarin, Frau Lehmann, abgeben. Bitte rufen Sie mich kurz zurück.`, s:`Frau Novak muss am Mittwoch unbedingt zu Hause sein.`, k:false, why:`She can leave the key with her neighbour instead.`, v:`B`},
{a:`Liebe Kundinnen und Kunden, unser Kaufhaus schließt in fünfzehn Minuten. Bitte gehen Sie mit Ihren Einkäufen zu den Kassen im Erdgeschoss. Die Kassen in den oberen Etagen sind bereits geschlossen. Wir wünschen Ihnen einen schönen Abend.`, s:`Man kann jetzt nur noch im Erdgeschoss bezahlen.`, k:true, why:`The tills upstairs are already closed.`, v:`A`},
{a:`Sie möchten Konzertkarten gewinnen? Dann rufen Sie jetzt an! Die Nummer ist null achthundert, dreiunddreißig, vierundvierzig, fünfundfünfzig. Der zehnte Anrufer gewinnt zwei Karten für das Konzert am Samstag in der Stadthalle. Der Anruf ist kostenlos.`, s:`Der erste Anrufer gewinnt die Karten.`, k:false, why:`The tenth caller wins.`, v:`B`},
{a:`Hallo, hier ist die Sprachschule Lingua. Wir möchten Sie informieren, dass Ihr Kurs B1 morgen nicht im Raum vier, sondern im Raum zwölf im zweiten Stock stattfindet. Die Uhrzeit bleibt gleich: achtzehn Uhr. Bis morgen!`, s:`Der Kurs beginnt morgen zu einer anderen Zeit.`, k:false, why:`Only the room changes; the time stays 18:00.`, v:`A`}],

w:[
{id:`A`, label:`Aufgabe A · informell`, reg:`du`,
intro:`Ihre Freundin Sofia hat Ihnen geschrieben.`,

ich habe tolle Neuigkeiten: Paul und ich heiraten! Die Hochzeit ist am 14. Juni in Salzburg, und wir würden uns riesig freuen, wenn du kommst. Wir feiern in einem kleinen Hotel am See. Kannst du mir bis Ende April Bescheid sagen?

Und hast du vielleicht eine Idee, was wir am Sonntag nach der Hochzeit mit unseren Gästen machen könnten?

Liebe Grüße
Sofia`,

model:`Hamburg, 02.04.2026

Liebe Sofia,

vielen Dank für deine Nachricht! Herzlichen Glückwunsch, ich freue mich so für euch beide!

Leider muss ich dir absagen. Am 14. Juni habe ich meine Abschlussprüfung, und die kann ich nicht verschieben. Es tut mir wirklich leid, denn ich wäre so gern dabei gewesen.

Für den Sonntag habe ich eine Idee: Ihr könntet mit allen Gästen eine Schifffahrt auf dem See machen. Danach könnt ihr zusammen in einem Gasthaus Mittag essen. Das ist entspannt, und nach der langen Party müssen die Gäste nicht viel laufen.

Ich möchte euch aber unbedingt bald sehen. Wie wäre es, wenn ich euch im August in Salzburg besuche? Dann zeigt ihr mir die Hochzeitsfotos, und ich bringe euer Geschenk mit.

Ich wünsche euch ein wunderschönes Fest!

Liebe Grüße
Tomasz`},

Sehr geehrter Herr Kraus,

ich wohne in der Wohnung 3 links in der Lindenstraße 4 und schreibe Ihnen, weil meine Heizung nicht richtig funktioniert. Die Heizkörper im Wohnzimmer und im Kinderzimmer werden nur lauwarm.

Das Problem gibt es seit einer Woche. Ich habe Sie schon am Montag angerufen und das Problem gemeldet, aber bisher ist leider niemand gekommen.

In der Wohnung sind es jetzt abends nur noch 16 Grad. Meine Tochter ist zwei Jahre alt und hat sich schon erkältet. Außerdem arbeite ich zweimal pro Woche von zu Hause, und das ist bei dieser Kälte kaum möglich.

Deshalb bitte ich Sie, so schnell wie möglich einen Techniker zu schicken, damit das Problem gelöst wird. Am Donnerstag und Freitag bin ich den ganzen Tag zu Hause, dann kann der Techniker jederzeit kommen.

Vielen Dank für Ihre Hilfe.

Mit freundlichen Grüßen
Ivana Petrović`}],

a:{who:`Lisa, 29, Studentin`, t:`Ich kaufe fast alles im Internet – Kleidung, Bücher, sogar Lebensmittel. Das spart viel Zeit, und ich kann Preise vergleichen. Wenn mir etwas nicht gefällt, schicke ich es einfach zurück. In der Stadt finde ich es oft zu voll und zu stressig.`},
b:{who:`Herr Yilmaz, 58, Elektriker`, t:`Ich gehe lieber in richtige Geschäfte. Ich möchte die Sachen anfassen und anprobieren, bevor ich sie kaufe. Außerdem bekomme ich im Geschäft eine gute Beratung. Und wenn alle nur noch online kaufen, gibt es bald keine Läden mehr in unserer Stadt.`},
sumA:`In meinem Text geht es um Lisa. Sie ist neunundzwanzig und studiert. Lisa kauft fast alles online, sogar Lebensmittel. Sie meint, dass sie so Zeit spart und die Preise besser vergleichen kann. Wenn ihr etwas nicht gefällt, schickt sie es zurück. Einkaufen in der Stadt findet sie stressig.`,
sumB:`In meinem Text geht es um Herrn Yilmaz. Er ist achtundfünfzig und Elektriker. Er kauft lieber in normalen Geschäften, weil er die Sachen vorher anfassen und anprobieren möchte. Er findet auch die Beratung im Geschäft wichtig. Und er hat Angst, dass es bald keine Läden mehr in der Stadt gibt.`,

texts:[
{src:`aus einer Wirtschaftszeitung`, t:`In einem Bürogebäude in Stuttgart ist der Aufzug seit Januar nur noch für Menschen mit Gepäck, Kinderwagen oder einer Gehbehinderung da. Alle anderen Mitarbeiter sollen die Treppe nehmen. Die Firma möchte so etwas für die Gesundheit ihrer Angestellten tun. Auf jeder Etage hängt ein Schild, das zeigt, wie viele Kalorien man beim Treppensteigen verbraucht. Nach anfänglicher Kritik sind inzwischen die meisten zufrieden.`},
{src:`aus einer Elternzeitschrift`, t:`Wie schmeckt eigentlich ein Radieschen? In einer Grundschule in Erfurt wissen das jetzt alle Kinder. Seit diesem Schuljahr haben die Klassen einen eigenen Schulgarten. Die Kinder pflanzen Gemüse, gießen es und ernten es im Sommer. Einmal pro Woche kochen sie dann zusammen mit einer Köchin ein Mittagessen aus ihrem eigenen Gemüse.`},
{src:`aus einer Lokalzeitung`, t:`In der Stadtbücherei hören seit Kurzem auch Hunde zu. Jeden Donnerstag kommen drei speziell ausgebildete Hunde mit ihren Besitzerinnen. Kinder, die Probleme beim Lesen haben, lesen den Tieren laut vor. „Ein Hund lacht nicht, wenn man einen Fehler macht“, erklärt die Leiterin. Viele Kinder trauen sich so mehr und lesen mit der Zeit besser.`},
{src:`aus einem Stadtmagazin`, t:`Viele Menschen möchten sich ehrenamtlich engagieren, wissen aber nicht, wo. Eine neue App aus Hannover soll helfen. Vereine und soziale Einrichtungen können dort Aufgaben anbieten – zum Beispiel Hausaufgabenhilfe oder Einkaufen für ältere Menschen. Wer helfen möchte, sieht sofort, welche Aufgaben es in der Nähe gibt und wie viel Zeit man dafür braucht.`},
{src:`aus einer Gesundheitszeitschrift`, t:`Bei einem Softwareunternehmen in Dortmund dürfen die Mitarbeiter nach dem Mittagessen zwanzig Minuten schlafen. Dafür gibt es einen ruhigen Raum mit bequemen Liegen. Die Chefin hat das Angebot nach Gesprächen mit einer Ärztin eingeführt. Ein kurzer Schlaf am Mittag macht konzentrierter und hilft, Fehler zu vermeiden, sagt sie. Inzwischen nutzt jeder dritte Mitarbeiter den Ruheraum regelmäßig.`}],

l2:{
title:`Eine Stunde, die viel bewegt`,
sub:`Lesepatinnen und Lesepaten helfen an einer Grundschule`,
text:`Jeden Dienstagmorgen um halb neun betritt Gerda Wolff, 69, die Bibliothek der Astrid-Lindgren-Grundschule. Dort wartet schon Emre, acht Jahre alt, mit einem Buch über Piraten. Eine Stunde lang lesen die beiden zusammen: Emre liest vor, Gerda Wolff hört zu, hilft bei schwierigen Wörtern und stellt Fragen zur Geschichte. Gerda Wolff ist eine von 23 Lesepatinnen und Lesepaten an der Schule.

Die Idee stammt von der Schulleiterin Karin Seidel. „Viele unserer Kinder lesen zu Hause kaum“, erklärt sie. „Manche Eltern haben wenig Zeit, andere sprechen selbst nicht gut Deutsch. Im Unterricht können die Lehrerinnen nicht mit jedem Kind einzeln lesen. Dafür fehlt einfach die Zeit.“ Vor fünf Jahren hat sie deshalb in der Lokalzeitung einen Aufruf gestartet. Damals meldeten sich acht Freiwillige.

Heute kommen die Lesepaten aus ganz unterschiedlichen Bereichen. Viele sind im Ruhestand, wie Gerda Wolff, die früher als Buchhändlerin gearbeitet hat. Es gibt aber auch Studierende und Berufstätige, die ihre Arbeitszeit flexibel einteilen können. Bevor sie anfangen, besuchen alle einen kostenlosen Kurs bei der Volkshochschule. Dort lernen sie zum Beispiel, wie man Kinder motiviert und welche Bücher für welches Alter passen.

Lehrer müssen die Paten nicht sein. „Es geht nicht darum, Grammatik zu erklären“, sagt Karin Seidel. „Die Kinder sollen erleben, dass Lesen Spaß macht und dass sich ein Erwachsener nur für sie Zeit nimmt.“ Die Lehrerinnen entscheiden, welche Kinder eine Patin oder einen Paten bekommen. Meistens bleiben die Paare ein ganzes Schuljahr zusammen.

Der Erfolg ist deutlich: Bei einem Lesetest am Ende des Schuljahres hatten sich die meisten Kinder mit Lesepaten stärker verbessert als die anderen Kinder. Und auch für die Paten ist das Projekt ein Gewinn. „Wenn Emre mir stolz erzählt, dass er zu Hause allein ein Buch zu Ende gelesen hat, dann ist das für mich der schönste Moment der Woche“, sagt Gerda Wolff.

Die Schule sucht übrigens weiter Unterstützung. Besonders Männer sind willkommen: Bisher gibt es nur vier Lesepaten.`,
q:[
{s:`Gerda Wolff`, o:[`war früher Lehrerin an der Grundschule.`,`liest einmal pro Woche mit einem Schüler.`,`hat das Projekt an der Schule gegründet.`], k:1, why:`Every Tuesday she reads with Emre. She was a bookseller (a ✗); the idea came from the head teacher (c ✗).`},
{s:`Die Schulleiterin hat das Projekt begonnen, weil`, o:[`die Lehrerinnen im Unterricht zu wenig Zeit für einzelne Kinder haben.`,`sich die Eltern über die Schule beschwert hatten.`,`die Schule keine Bibliothek hatte.`], k:0, why:`"Im Unterricht können die Lehrerinnen nicht mit jedem Kind einzeln lesen."`},
{s:`Die Lesepaten`, o:[`brauchen eine pädagogische Ausbildung.`,`werden vor dem Start auf ihre Aufgabe vorbereitet.`,`sind alle schon in Rente.`], k:1, why:`They all take a free course at the Volkshochschule first. Many, not all, are retired (c ✗).`},
{s:`Welche Kinder einen Lesepaten bekommen,`, o:[`entscheiden die Eltern.`,`entscheiden die Paten selbst.`,`entscheiden die Lehrerinnen.`], k:2, why:`"Die Lehrerinnen entscheiden, welche Kinder eine Patin oder einen Paten bekommen."`},
{s:`Im Text steht, dass`, o:[`die Schule vor allem neue Lesepatinnen sucht.`,`Kinder mit Lesepaten beim Lesetest meistens größere Fortschritte gemacht haben.`,`die Paare jede Woche wechseln.`], k:1, why:`Most children with a mentor improved more. The school especially wants men (a ✗); pairs stay together all year (c ✗).`}]
},

s1:{
head:`E-Mail an einen Freund`,
text:`Hallo Jonas,

wie geht es dir? Bei mir ist in den letzten Wochen viel passiert: Ich habe eine neue Stelle! Seit dem 1. September arbeite ich [1] Elektronikerin bei einer Firma in Bremen. Die Arbeit gefällt mir sehr gut, [2] ich muss jeden Tag sehr früh aufstehen. Die Firma liegt nämlich am anderen Ende der Stadt, und ich brauche fast eine Stunde, [3] ich dort bin.

Meine Kolleginnen und Kollegen sind sehr nett. Am ersten Tag hat mir mein Chef alles gezeigt und mich allen [4] vorgestellt. Mit einer Kollegin, [5] Sohn in die gleiche Schule wie meine Tochter geht, fahre ich manchmal zusammen.

Am Wochenende hatte ich endlich Zeit, meine Wohnung [6] renovieren. Ich habe das Wohnzimmer gelb gestrichen. Es sieht jetzt viel [7] aus als vorher!

Was machst du eigentlich in den Herbstferien? [8] du Lust hast, kannst du gern nach Bremen kommen. Ich würde dir die Stadt zeigen, und wir könnten zusammen ans Meer fahren. Ich würde [9] wirklich freuen!

Schreib mir bald, ich warte auf [10] Antwort!

Viele Grüße
Nadia`,
items:[
{o:[`als`,`wie`,`für`], k:0, why:`als + job: als Elektronikerin arbeiten.`},
{o:[`aber`,`denn`,`weil`], k:0, why:`Contrast (I like it, but …) → aber.`},
{o:[`bis`,`bevor`,`seit`], k:0, why:`bis = until: it takes an hour until I'm there.`},
{o:[`Mitarbeitern`,`Mitarbeiter`,`Mitarbeiterin`], k:0, why:`allen + Dativ plural → -n: allen Mitarbeitern.`},
{o:[`deren`,`dessen`,`die`], k:0, why:`Relative genitive for a woman (die Kollegin) → deren Sohn.`},
{o:[`zu`,`um`,`für`], k:0, why:`Zeit haben, etwas zu tun → zu + infinitive.`},
{o:[`schöner`,`schön`,`am schönsten`], k:0, why:`Comparative before als: schöner als.`},
{o:[`Wenn`,`Ob`,`Dass`], k:0, why:`Condition → Wenn du Lust hast, …`},
{o:[`mich`,`mir`,`dich`], k:0, why:`sich freuen is reflexive with Akkusativ: ich freue mich.`},
{o:[`deine`,`deiner`,`dein`], k:0, why:`warten auf + Akkusativ, die Antwort (feminine) → deine.`}]
},

s2:{
head:`Anfrage zu einer Wohnungsanzeige`,
words:[`am`,`als`,`an`,`auf`,`bis`,`dass`,`einen`,`falls`,`für`,`im`,`meine`,`ob`,`und`,`wann`,`weil`],
text:`Sehr geehrte Frau Berger,

mit großem Interesse habe ich Ihre Anzeige [1] Internet gelesen. Ich suche zurzeit eine Zweizimmerwohnung in der Nähe des Stadtzentrums, [2] Ihre Wohnung würde sehr gut zu mir passen.

Kurz zu meiner Person: Ich bin 31 Jahre alt und arbeite [3] Informatiker bei einer Versicherung. Ich bin Nichtraucher und habe keine Haustiere. Meine jetzige Wohnung ist leider zu klein, [4] ich seit Kurzem oft im Homeoffice arbeite.

Bevor ich mich entscheide, hätte ich noch ein paar Fragen. Gibt es in der Wohnung eine Einbauküche, oder muss ich [5] eigene Küche mitbringen? Außerdem möchte ich wissen, [6] die Nebenkosten im Mietpreis enthalten sind. Ab [7] ist die Wohnung frei?

Ich würde mir die Wohnung gern ansehen. [8] Mittwoch und Freitag habe ich nach 16 Uhr Zeit. Natürlich kann ich Ihnen auch eine Gehaltsbescheinigung zeigen, [9] Sie das wünschen.

Ich freue mich [10] Ihre Antwort.

Mit freundlichen Grüßen
David Chen`,
key:[`im`,`und`,`als`,`weil`,`meine`,`ob`,`wann`,`am`,`falls`,`auf`],
why:[
`im Internet (in + dem).`,
`Two main clauses joined → und.`,
`als + job: als Informatiker arbeiten.`,
`Reason with the verb at the end (arbeite) → weil.`,
`die Küche (feminine, Akkusativ) → meine eigene Küche. "einen" has the wrong gender.`,
`Indirect yes/no question → ob.`,
`Ab wann? = from when?`,
`Days of the week: am Mittwoch (an + dem).`,
`Condition: falls = if.`,
`sich freuen auf + something in the future.`]
},

h1:[
{a:`Unser Gesundheitstipp der Woche: Viele Menschen trinken im Winter zu wenig. Ärzte empfehlen, auch bei kaltem Wetter mindestens anderthalb Liter am Tag zu trinken – am besten Wasser oder ungesüßten Tee. Wer zu wenig trinkt, bekommt schneller Kopfschmerzen und kann sich schlechter konzentrieren.`, s:`Im Winter braucht man nicht so viel zu trinken.`, k:false, why:`Doctors recommend at least 1.5 litres a day in winter too.`},
{a:`Die Stadt sucht Freiwillige für den großen Frühjahrsputz am Flussufer. Am Samstag, dem zweiundzwanzigsten März, treffen sich alle Helfer um zehn Uhr am Fischtor. Handschuhe und Müllsäcke bekommen sie vor Ort. Nach der Arbeit gibt es für alle ein kostenloses Mittagessen.`, s:`Die Helfer müssen Handschuhe selbst mitbringen.`, k:false, why:`Gloves and bags are handed out on site (vor Ort).`},
{a:`Die Verbraucherzentrale warnt vor falschen Anrufen: Zurzeit melden sich Betrüger am Telefon und sagen, sie arbeiten für eine Bank. Sie fragen nach Passwörtern oder Kontonummern. Die Verbraucherzentrale betont: Echte Banken fragen am Telefon nie nach solchen Daten. Legen Sie in diesem Fall einfach auf.`, s:`Man soll am Telefon keine Passwörter nennen.`, k:true, why:`Real banks never ask for this on the phone – just hang up.`},
{a:`Das Wetter: Morgen bleibt es im Süden Deutschlands sonnig und warm, mit bis zu achtundzwanzig Grad. Im Norden dagegen regnet es den ganzen Tag, und es wird nicht wärmer als siebzehn Grad. Am Sonntag wird es dann überall freundlicher.`, s:`Im Norden wird es morgen nass.`, k:true, why:`"Im Norden regnet es den ganzen Tag."`},
{a:`Gute Nachrichten für Familien: Ab dem kommenden Schuljahr kostet das Mittagessen an allen Grundschulen unserer Stadt nur noch einen Euro. Bisher mussten die Eltern drei Euro fünfzig bezahlen. Die Stadt möchte so erreichen, dass mehr Kinder in der Schule warm essen.`, s:`Das Schulessen wird billiger.`, k:true, why:`From 3.50 € down to 1 €.`}],

h2:{
intro:`Sie hören ein Gespräch im Radio mit Markus Brenner. Er ist aus der Großstadt aufs Land gezogen.`,
d:[
[`A`,`Hallo und willkommen bei „Leben heute“. Immer mehr Menschen ziehen aus der Großstadt aufs Land. Einer von ihnen ist Markus Brenner. Er hat zwanzig Jahre in München gelebt und wohnt seit eineinhalb Jahren in einem kleinen Dorf in Niederbayern. Herr Brenner, warum haben Sie die Stadt verlassen?`],
[`B`,`Na ja, es gab mehrere Gründe. Unsere Wohnung in München war viel zu klein, als unser zweites Kind kam. Eine größere Wohnung konnten wir uns dort aber nicht leisten. Die Mieten sind einfach unglaublich hoch. Hier auf dem Land haben wir ein altes Haus mit Garten gekauft – für weniger Geld, als eine Dreizimmerwohnung in München kostet.`],
[`A`,`Und Ihre Arbeit? Sie arbeiten doch noch in München, oder?`],
[`B`,`Ja, ich bin Softwareentwickler, und meine Firma ist in München. Aber ich arbeite vier Tage pro Woche von zu Hause. Nur am Montag fahre ich ins Büro. Mit dem Zug brauche ich ungefähr zwei Stunden. Das ist lang, aber einmal pro Woche geht das.`],
[`A`,`Wie haben die Leute im Dorf Sie aufgenommen?`],
[`B`,`Am Anfang waren sie ein bisschen vorsichtig. Hier kennt jeder jeden, und wir waren eben die Neuen aus der Stadt. Aber dann bin ich in die freiwillige Feuerwehr eingetreten, und meine Frau singt im Kirchenchor. Seitdem gehören wir richtig dazu. In München habe ich nicht einmal meine Nachbarn gekannt.`],
[`A`,`Was vermissen Sie aus der Stadt?`],
[`B`,`Ehrlich gesagt: das Kino und gute Restaurants. Hier gibt es nur ein Gasthaus, und das hat am Montag und Dienstag geschlossen. Und manchmal fehlen mir auch meine alten Freunde. Die besuchen uns zwar, aber nicht so oft, wie ich es mir wünsche.`],
[`A`,`Und wie ist es für die Kinder?`],
[`B`,`Für die Kinder ist es ideal. Sie können draußen spielen, ohne dass wir Angst wegen des Verkehrs haben müssen. Unsere Tochter geht hier in den Kindergarten. Der ist klein, nur zwei Gruppen, aber sehr gut. Später fährt sie mit dem Schulbus in die Grundschule im Nachbarort.`],
[`A`,`Gibt es auch Nachteile?`],
[`B`,`Ja, natürlich. Ohne Auto geht hier fast nichts. Der Bus fährt nur dreimal am Tag. Deshalb haben wir jetzt zwei Autos, obwohl wir in München gar keins hatten. Und der nächste Supermarkt ist acht Kilometer entfernt. Man muss den Einkauf also gut planen.`],
[`A`,`Würden Sie es wieder tun?`],
[`B`,`Auf jeden Fall. Wir sind hier viel entspannter. Aber ich sage auch ehrlich: Das Leben auf dem Land ist nicht für jeden etwas. Man sollte vorher eine Zeit lang zur Probe dort wohnen, zum Beispiel im Urlaub.`],
[`A`,`Herr Brenner, vielen Dank für das Gespräch.`]],

/* ---------- speech (listening) ---------- */
const TTS = { ok: typeof window !== 'undefined' && 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window, voices: [] };
function loadVoices() {
  if (!TTS.ok) return;

}
if (TTS.ok) {
  loadVoices();
  try { speechSynthesis.addEventListener('voiceschanged', () => { loadVoices(); if (route().v === 'settings') render(); }); } catch (e) {}
}
function voiceFor(v) {
  const vs = TTS.voices;
  const a = vs.find(x => x.name === S.set.va) || vs.find(x => /de[-_]DE/i.test(x.lang)) || vs[0] || null;
  const b = vs.find(x => x.name === S.set.vb) || vs.find(x => x !== a && /de[-_]DE/i.test(x.lang)) || vs.find(x => x !== a) || a;
  const same = !a || a === b;

}
const AU = { tok: 0, timers: [], p: null };
function stopAudio() {
  AU.tok++;

  try { if (TTS.ok) speechSynthesis.cancel(); } catch (e) {}
  const p = AU.p; AU.p = null;
  if (p) playerIdle(p);
}
function speakText(text, v, done, tok) {
  const parts = (String(text).match(/[^.!?]+[.!?]*[“"»]*\s*/g) || [text]).map(s => s.trim()).filter(Boolean);
  const vo = voiceFor(v); let k = 0;
  const step = () => {
    if (tok !== AU.tok) return;
    if (k >= parts.length) { done(); return; }
    const u = new SpeechSynthesisUtterance(parts[k++]);
    u.lang = 'de-DE'; if (vo.voice) u.voice = vo.voice; u.rate = +S.set.rate || 0.95; u.pitch = vo.pitch;
    let fin = false; const t0 = Date.now();
    const end = () => { if (fin) return; fin = true; clearInterval(w); step(); };
    u.onend = end; u.onerror = end; AU.u = u;
    const w = setInterval(() => {
      if (tok !== AU.tok) { clearInterval(w); return; }
      if (Date.now() - t0 > 1500 && !speechSynthesis.speaking && !speechSynthesis.pending) end();
    }, 300);
    AU.timers.push(w);

}
function playSeq(p, q, ev) {
  stopAudio();

  const tok = ++AU.tok; AU.p = p; let i = 0;
  try { speechSynthesis.resume(); } catch (e) {}
  const next = () => {
    if (tok !== AU.tok) return;
    if (i >= q.length) { AU.p = null; ev({ type: 'end' }); return; }
    const it = q[i++];
    if (it.mark !== undefined) { ev({ type: 'mark', m: it.mark }); next(); return; }
    if (it.pause) {
      let left = Math.round(it.pause / 1000);
      if (it.label) ev({ type: 'pause', label: it.label, left });
      const iv = setInterval(() => {
        if (tok !== AU.tok) { clearInterval(iv); return; }
        left--; if (it.label && left > 0) ev({ type: 'pause', label: it.label, left });
        if (left <= 0) { clearInterval(iv); next(); }
      }, 1000);
      AU.timers.push(iv); return;
    }

  };

}
function seqFor(t, p, exam) {
  const q = []; const say = (x, v) => q.push({ say: x, v: v || 'A' }); const pause = (ms, label) => q.push({ pause: ms, label }); const mark = m => q.push({ mark: m });
  if (p === 'h1') {
    say('Hörverstehen, Teil 1. Sie hören jetzt fünf kurze Texte. Sie hören jeden Text nur einmal.');
    pause(exam ? 30000 : 4000, 'Reading time');
    t.h1.forEach((it, i) => { mark(i); say(`Nummer ${41 + i}.`); pause(700); say(it.a, it.v); pause(6000, 'Mark your answer'); });
  } else if (p === 'h2') {
    say('Hörverstehen, Teil 2. ' + t.h2.intro + ' Sie hören das Gespräch zweimal.');
    pause(exam ? 60000 : 5000, 'Reading time');
    mark('1'); t.h2.d.forEach(([v, x]) => say(x, v));
    pause(6000, 'Check your answers');
    say('Sie hören das Gespräch noch einmal.');
    mark('2'); t.h2.d.forEach(([v, x]) => say(x, v)); pause(4000, 'Last check');
  } else if (p === 'h3') {
    say('Hörverstehen, Teil 3. Sie hören fünf kurze Texte. Sie hören jeden Text zweimal.');
    pause(exam ? 20000 : 4000, 'Reading time');
    t.h3.forEach((it, i) => { mark(i); say(`Nummer ${56 + i}.`); pause(700); say(it.a, it.v); pause(2500); say(it.a, it.v); pause(6000, 'Mark your answer'); });
  }

}
const RULE = { h1: 'Each text plays once – like the exam.', h2: 'The conversation plays twice – like the exam.', h3: 'Each text plays twice – like the exam.' };
function playerIdle(p) {
  const b = $(`#play-${p}`), s = $(`#stop-${p}`), st = $(`#ps-${p}`);
  if (s) s.hidden = true;
  if (b) { b.hidden = false; const lock = sess && sess.mode === 'e' && sess.played[p] && !sess.done; b.disabled = !!lock; b.textContent = lock ? 'Already played' : '▶︎ Play recording'; }
  if (st && !(sess && sess.played[p])) st.textContent = RULE[p] || '';

}
function startPlayer(p) {
  const t = T(sess.tid);
