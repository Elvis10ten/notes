<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>B1 Sprechtraining</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: an exam answer-sheet. Task sheets look like telc Aufgabenblätter, self-scoring uses the M10 oval grid, notes sit on a stamped sheet. */
:root{
  --paper:#ffffff; --sheet:#ffffff; --ink:#1f2328; --muted:#6b7079; --line:#e2e4e8; --line2:#f2f3f5;
  --accent:#1f2328; --accent-ink:#ffffff; --accent-soft:#f2f3f5; --stamp:#6b7079;
  --good:#2f6b4c; --good-soft:#eef3f0; --warn:#6b7079; --warn-soft:#f5f5f3; --bad:#9a3a3a; --bad-soft:#f8efef;
  --der:#1f2328; --die:#1f2328; --das:#1f2328;
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.18rem;font-weight:750}
h4{font-size:1rem;font-weight:700;margin-top:1rem}
p{margin:.5rem 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sheet);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;min-width:0}
.brand h1{font-size:1.1rem;font-weight:700}
.brand .lvl{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;letter-spacing:.06em}
.brand .meta{margin-left:auto;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);display:flex;gap:12px;align-items:center}
.meter{width:70px;height:6px;background:var(--line2);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.meter>i{display:block;height:100%;background:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-family:var(--f-display);font-weight:650;font-size:.95rem;padding:8px 10px 10px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px;display:flex;flex-direction:column;gap:22px}
section.block{display:flex;flex-direction:column;gap:12px;min-width:0}
.lead{color:var(--muted);max-width:65ch}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* surfaces */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);min-width:0;position:relative}
.sheet-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);color:var(--muted);padding:8px 14px;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.sheet-b{padding:14px}
.sheet-f{display:none;border-top:1px dashed var(--line);padding:6px 14px;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.quote{font-size:1.05rem;border-left:3px solid var(--line);padding-left:12px;margin:.6rem 0}
.who{font-family:var(--f-display);font-weight:700;font-stretch:88%}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:700;font-size:.93rem;line-height:1.2;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 9px;font-size:.82rem;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.play{width:30px;height:30px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--sheet);cursor:pointer;display:inline-grid;place-items:center;color:var(--muted);padding:0}
.play:hover{border-color:var(--accent)}
.play svg{width:12px;height:12px}

/* lines with translation */
.lines{display:flex;flex-direction:column;gap:2px}
.ln{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px solid var(--line2);min-width:0}
.ln:last-child{border-bottom:0}
.ln .tx{flex:1;min-width:0}
.ln .de{font-weight:400}
.ln .en{color:var(--muted);font-size:.9rem;font-style:italic}
.hide-en .en{display:none}
.hide-de .de{filter:blur(6px);cursor:pointer}
.hide-de .de.reveal{filter:none}
.spk{font-family:var(--f-mono);font-size:.72rem;font-weight:600;min-width:24px;padding-top:4px;color:var(--muted)}


/* day plan */
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.days button{flex:1 0 64px;border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 6px;cursor:pointer;text-align:center}
.days button b{display:block;font-family:var(--f-display);font-size:1.15rem}
.days button span{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.days button.cur{border-color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.days button[aria-pressed="true"] span{color:var(--paper);opacity:.8}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line2)}
.task:last-child{border-bottom:0}
.task .min{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.chk{width:24px;height:24px;border:1.5px solid var(--muted);border-radius:50%;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;margin-top:2px}
.chk[aria-checked="true"]{background:var(--good);border-color:var(--good);color:#fff}
.chk svg{width:14px;height:14px}
.tt{font-weight:700}
.how{color:var(--muted);font-size:.92rem}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}

/* timeline */
.tl{display:flex;height:46px;border:1px solid var(--line);border-radius:4px;overflow:hidden;font-family:var(--f-mono);font-size:.72rem}
.tl>div{display:flex;flex-direction:column;justify-content:center;padding:0 6px;border-right:1px solid var(--line);min-width:0;overflow:hidden}
.tl>div:last-child{border-right:0}
.tl b{font-size:.8rem;white-space:nowrap}
.tl .prep{background:var(--line2)}

table.tbl{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:.74rem;font-weight:600;background:var(--line2)}
.scroll{overflow-x:auto;max-width:100%}
.ex{background:var(--line2);border-radius:6px;padding:8px 12px;font-size:.98rem}

/* M10 oval grid */
.m10{width:100%;border-collapse:collapse;font-size:.9rem}
.m10 td,.m10 th{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:left}
.m10 th{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:600}
.ovals{display:flex;gap:6px}
.oval{width:34px;height:22px;border:1px solid var(--muted);border-radius:50%;background:transparent;font-family:var(--f-mono);font-size:.72rem;font-weight:600;cursor:pointer;padding:0;display:grid;place-items:center}
.oval[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.total{font-family:var(--f-display);font-weight:700;font-size:2.6rem;font-variant-numeric:tabular-nums;line-height:1}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.74rem;font-weight:600;border-radius:999px;padding:2px 9px}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}

/* timer */
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--sheet)}
.timer .clock{font-family:var(--f-mono);font-weight:600;font-size:2rem;font-variant-numeric:tabular-nums;min-width:5ch}
.timer .lab{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.timer .bar{flex:1 1 120px;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent);transition:width .5s linear}
.timer.low .clock{color:var(--stamp)}
.timer.end .clock{color:var(--bad)}

/* notes on stamped sheet */
.stamped{position:relative}
.stamped textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);padding:12px 14px 12px 14px;line-height:1.7;resize:vertical;}
.stamp{display:none;position:absolute;top:-10px;right:10px;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--stamp);border:2px solid var(--stamp);border-radius:50%;width:84px;height:84px;display:grid;place-items:center;text-align:center;transform:rotate(-12deg);opacity:.8;pointer-events:none;line-height:1.25;background:var(--sheet)}

/* forms */
label.f{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted);min-width:0}
label.f input,label.f textarea,select{border:1.5px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--sheet);color:var(--ink);width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.toggle{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-weight:700;font-size:.85rem}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* lists of topics */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.tcard{border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tcard:hover{border-color:var(--ink)}
.tcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tcard b{font-family:var(--f-display);font-size:1rem}
.tcard span{font-size:.8rem;color:var(--muted)}
.tcard .done{font-family:var(--f-mono);font-size:.7rem;color:var(--good)}

/* flashcards */
.fc{border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px;cursor:pointer;gap:6px;user-select:none}
.fc .w{font-family:var(--f-display);font-size:1.9rem;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.fc .art{font-family:var(--f-mono);font-size:1rem;font-weight:600}
.g-der,.g-die,.g-das{color:var(--ink);font-weight:700}
.fc .pl{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.fc .mean{font-size:1.2rem;font-weight:700}
.fc .exs{color:var(--muted);font-style:italic}
.vlist .ln{align-items:center}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;padding:4px}
.msg{max-width:88%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--line2);border:1px solid var(--line)}
.msg.ai{align-self:flex-start;background:var(--sheet);border:1px solid var(--line)}
.msg.sys{align-self:center;font-size:.8rem;color:var(--muted);background:transparent;font-family:var(--f-mono)}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-width:0;min-height:62px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sheet);resize:vertical}
.mic[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb{display:flex;flex-direction:column;gap:10px}
.corr{border-left:3px solid var(--warn);padding-left:10px}
.corr .o{text-decoration:line-through;color:var(--bad)}
.corr .c{color:var(--good);font-weight:700}

details.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
details.acc>summary{cursor:pointer;padding:12px 14px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;list-style:none;display:flex;gap:10px;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);color:var(--muted)}
details.acc[open]>summary::after{content:"–"}
details.acc>.in{padding:0 14px 14px}

.quiz .q{padding:10px 0;border-bottom:1px solid var(--line2)}
.quiz .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.quiz .opt{border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left}
.quiz .opt.ok{border-color:var(--good);background:var(--good-soft)}
.quiz .opt.no{border-color:var(--bad);background:var(--bad-soft)}
.quiz .why{font-size:.88rem;color:var(--muted);margin-top:4px}

.note{border:1px solid var(--line);border-left:3px solid var(--line);background:var(--sheet);border-radius:6px;padding:10px 12px;font-size:.94rem}
.note.warn{border-left-color:var(--warn)}
.note.stamp-note{border-left-color:var(--stamp)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-weight:600;width:26px;height:26px;border:1px solid var(--line);color:var(--muted);border-radius:50%;display:grid;place-items:center;font-size:.8rem}
.hint{font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:.9rem;z-index:20}
.wizard{display:flex;gap:4px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.72rem}
.wizard span{padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.wizard span.on{border-color:var(--ink);color:var(--ink);font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){ h2{font-size:1.4rem} .fc .w{font-size:1.7rem} .brand .meta .hide-s{display:none} .brand .lvl{display:none} .brand h1{font-size:1.1rem} .meter{width:44px} }
</style>
<header class="top"><div class="top-in"><div class="brand"><h1>B1 Sprechtraining</h1><span class="lvl">telc · Zertifikat Deutsch</span><div class="meta" id="hdr-meta"></div></div><nav class="tabs" id="tabs" aria-label="Sections"></nav></div></header>
<main id="main"></main>
<script>
/* ================= CONTENT DATA ================= */

const PLAN = [
  { day: 1, title: "Fundament & Teil 1", goal: "Know the exam inside out and have a fluent 2-minute self-introduction plus 10 questions you can ask.", items: [
    { id: "d1a", min: 10, view: "pruefung", t: "Read “Die Prüfung”", how: "Format, timing, the 4 marking criteria and the pass mark (45 of 75). Use the points calculator once." },
    { id: "d1b", min: 20, view: "grammatik", anchor: "g-perfekt", t: "Grammar: Perfekt", how: "Read the lesson aloud, then do the Perfekt quiz until you score 8/10 or more." },
    { id: "d1c", min: 15, view: "redemittel", anchor: "teil1", t: "Phrases for Teil 1", how: "Play each phrase, repeat it out loud twice. Then switch on “Hide German” and recall each one from the English." },
    { id: "d1d", min: 30, view: "teil1", anchor: "steckbrief", t: "Build your own Teil 1 script", how: "Fill in your profile, read the generated text aloud 3 times, then say it 3 times WITHOUT looking. Use the 3-minute timer." },
    { id: "d1e", min: 15, view: "teil1", anchor: "fragen", t: "Teil 1: asking questions", how: "Say every question aloud in both du and Sie form. Answer each examiner extra question aloud in 3–4 sentences." },
    { id: "d1f", min: 15, view: "woerter", t: "Words: “Ich & meine Welt” + “Wohnen”", how: "Flashcards. Say the article out loud every time (der/die/das)." },
    { id: "d1g", min: 15, view: "aussprache", t: "Pronunciation: ü, ö, ch, r", how: "Play, repeat, record yourself on your phone if you can and compare." }
  ]},
  { day: 2, title: "Teil 2 · Über ein Thema sprechen", goal: "Report a sheet in 3 sentences, give an opinion with a reason and a personal experience, and ask your partner something.", items: [
    { id: "d2a", min: 10, view: "teil1", anchor: "ueben1", t: "Warm-up: Teil 1 in 3 minutes", how: "Run the timer and speak your intro + 3 questions without notes." },
    { id: "d2b", min: 15, view: "grammatik", anchor: "g-satzbau", t: "Grammar: weil / dass / deshalb", how: "Word order is where most points are lost. Lesson + quiz." },
    { id: "d2c", min: 15, view: "redemittel", anchor: "teil2", t: "Phrases for Teil 2", how: "Reporting, opinion, agreeing, disagreeing, experiences. Hide German and recall." },
    { id: "d2d", min: 15, view: "teil2", anchor: "modell2", t: "Study the model conversation", how: "Listen once, read the English, then shadow it: speak along with the audio, line by line." },
    { id: "d2e", min: 45, view: "teil2", anchor: "themen", t: "Practise 4 topics", how: "For each topic: 4 min notes → report your sheet aloud (1 min) → opinion + experience aloud (2 min) → use the partner (AI or cards) for the discussion." },
    { id: "d2f", min: 20, view: "woerter", t: "Words: “Meinung & Diskussion” + “Arbeit”", how: "Flashcards until every card in both decks has been seen once." }
  ]},
  { day: 3, title: "Teil 3 · Gemeinsam etwas planen", goal: "Make suggestions, react to your partner, divide tasks and close with a summary, every time.", items: [
    { id: "d3a", min: 10, view: "teil2", anchor: "themen", t: "Warm-up: one new Teil 2 topic", how: "Pick a topic you haven't done. Timed, out loud." },
    { id: "d3b", min: 15, view: "grammatik", anchor: "g-planen", t: "Grammar: könnten / würde / time words", how: "The polite forms and am / um / im that you need for planning. Lesson + quiz." },
    { id: "d3c", min: 15, view: "redemittel", anchor: "teil3", t: "Phrases for Teil 3", how: "Suggest, agree, refuse + alternative, divide tasks, summarise." },
    { id: "d3d", min: 15, view: "teil3", anchor: "modell3", t: "Study the model planning conversation", how: "Listen, read, shadow. Notice the pattern: suggest → react → decide → who does it." },
    { id: "d3e", min: 45, view: "teil3", anchor: "aufgaben", t: "Practise 4 planning tasks", how: "Use the AI partner, or play both roles out loud with the partner cards. 6 minutes each, always end with a summary." },
    { id: "d3f", min: 20, view: "woerter", t: "Words: “Planen & Feiern” + “Freizeit & Reisen”", how: "Flashcards, out loud with article." }

 { id: "stadtland", title: "Wohnen in der Stadt oder auf dem Land", en: "City or countryside",

   b: { name: "Andreas Hoffmann", age: 44, job: "Koch", g: "m", q: "Vor drei Jahren sind wir mit unseren Kindern aufs Land gezogen. Die Mieten sind günstiger, die Luft ist besser, und die Kinder können im Garten spielen. Die Stadt ist mir zu laut und zu hektisch.", e: "Three years ago we moved to the countryside with our children. Rents are cheaper, the air is better and the children can play in the garden. The city is too loud and hectic for me." },
   ra: "Auf meinem Blatt geht es um das Wohnen in der Stadt. Kerstin Fischer ist 31 und Grafikerin. Sie wohnt im Zentrum und möchte nie aufs Land ziehen, weil sie dort alles direkt vor der Tür hat. Sie braucht auch kein Auto.",
   rb: "Andreas Hoffmann ist 44 und Koch. Er ist mit seiner Familie aufs Land gezogen, weil die Mieten dort günstiger sind und die Luft besser ist. Er findet die Stadt zu laut und zu hektisch.",
   op: "Ich wohne in Berlin, und mir gefällt das Leben in der Stadt. Ich brauche kein Auto, und es gibt viele Möglichkeiten. Aber die Mieten in Berlin sind wirklich sehr hoch. Ich habe lange eine Wohnung gesucht. Vielleicht ziehe ich später, mit Familie, auch an den Stadtrand. Wo möchtest du lieber wohnen?",
   ope: "I live in Berlin and I like city life. I don't need a car and there are lots of options. But rents in Berlin are really very high. I searched for a flat for a long time. Maybe later, with a family, I'll also move to the outskirts. Where would you rather live?",
   v: [["mitten in der Stadt", "right in the city"], ["aufs Land ziehen", "to move to the countryside"], ["die Miete", "rent"], ["günstig", "cheap, affordable"], ["hektisch", "hectic"], ["der Stadtrand", "outskirts"]] },
 { id: "haustiere", title: "Haustiere", en: "Pets",
   a: { name: "Nina Schulz", age: 27, job: "Verkäuferin", g: "f", q: "Ich habe einen Hund und kann mir ein Leben ohne ihn nicht vorstellen. Er ist mein bester Freund. Weil ich jeden Tag mit ihm spazieren gehe, bewege ich mich mehr und lerne andere Hundebesitzer kennen.", e: "I have a dog and can't imagine life without him. He's my best friend. Because I walk him every day, I move more and meet other dog owners." },
   b: { name: "Thomas Meyer", age: 50, job: "Architekt", g: "m", q: "Ich finde, ein Haustier in einer kleinen Stadtwohnung ist keine gute Idee. Tiere brauchen Platz und viel Zeit. Und wer kümmert sich um das Tier, wenn man in den Urlaub fährt? Außerdem kostet ein Tier viel Geld.", e: "I think a pet in a small city flat isn't a good idea. Animals need space and lots of time. And who looks after the animal when you go on holiday? Also, an animal costs a lot of money." },
   ra: "Auf meinem Blatt geht es um Haustiere. Nina Schulz ist 27 und Verkäuferin. Sie hat einen Hund und sagt, dass er ihr bester Freund ist. Weil sie jeden Tag mit ihm spazieren geht, bewegt sie sich mehr.",
   rb: "Thomas Meyer ist 50 und Architekt. Er meint, dass ein Haustier in einer kleinen Stadtwohnung keine gute Idee ist. Tiere brauchen Platz und Zeit, und sie kosten viel Geld. Er fragt auch, wer sich im Urlaub um das Tier kümmert.",
   op: "Ich habe kein Haustier, weil ich viel arbeite und manchmal reise. Ich finde Hunde schön, aber ein Hund braucht viel Zeit. In Nigeria hatte meine Familie Hühner im Garten – das war anders als ein Haustier in Deutschland! Hast du ein Haustier?",
   ope: "I don't have a pet because I work a lot and sometimes travel. I like dogs, but a dog needs a lot of time. In Nigeria my family had chickens in the garden – that was different from a pet in Germany! Do you have a pet?",
   v: [["das Haustier", "pet"], ["sich vorstellen", "to imagine"], ["sich bewegen", "to move, exercise"], ["sich kümmern um", "to take care of"], ["der Platz", "space, room"], ["kosten", "to cost"]] },
 { id: "fernsehen", title: "Fernsehen oder Streaming", en: "TV or streaming",
   a: { name: "Monika Richter", age: 58, job: "Sekretärin", g: "f", q: "Ich sehe jeden Abend fern, besonders Nachrichten und Dokumentationen. Fernsehen ist für mich Entspannung nach der Arbeit, und ich lerne viel über die Welt.", e: "I watch TV every evening, especially the news and documentaries. TV is relaxation after work for me, and I learn a lot about the world." },
   b: { name: "Jonas Klein", age: 23, job: "Auszubildender", g: "m", q: "Ich habe gar keinen Fernseher mehr. Filme und Serien schaue ich online, wann ich will. Ich muss nicht warten, bis etwas läuft, und ich sehe keine Werbung.", e: "I don't have a TV any more. I watch films and series online whenever I want. I don't have to wait until something is on, and I don't see adverts." },
   ra: "Auf meinem Blatt geht es um das Fernsehen. Monika Richter ist 58 und Sekretärin. Sie sieht jeden Abend fern, besonders Nachrichten. Für sie ist das Entspannung, und sie lernt viel über die Welt.",
   rb: "Jonas Klein ist 23 und macht eine Ausbildung. Er hat keinen Fernseher mehr und schaut Filme und Serien online. Er findet gut, dass er nicht warten muss und keine Werbung sieht.",
   op: "Ich bin wie Jonas: Ich habe keinen Fernseher. Ich schaue Serien online, und ich schaue sie oft auf Deutsch mit Untertiteln, weil ich so Deutsch lernen kann. Aber Nachrichten im Fernsehen finde ich auch wichtig. Was siehst du gern?",
   ope: "I'm like Jonas: I don't have a TV. I watch series online, often in German with subtitles, because that helps me learn German. But I also find TV news important. What do you like watching?",
   v: [["fernsehen (sieht fern)", "to watch TV"], ["die Nachrichten", "the news"], ["die Entspannung", "relaxation"], ["die Werbung", "advertising"], ["die Untertitel (Pl.)", "subtitles"], ["laufen (im Fernsehen)", "to be on (TV)"]] },
 { id: "vegetarisch", title: "Vegetarisch essen", en: "Eating vegetarian",
   a: { name: "Lea Wagner", age: 24, job: "Studentin", g: "f", q: "Seit drei Jahren esse ich kein Fleisch mehr. Das ist gesünder und besser für die Umwelt. Außerdem finde ich es nicht richtig, wie die Tiere leben müssen. Vegetarisch kochen ist auch gar nicht schwer.", e: "I haven't eaten meat for three years. It's healthier and better for the environment. I also don't think it's right how the animals have to live. Vegetarian cooking isn't hard at all." },
   b: { name: "Klaus Zimmermann", age: 47, job: "Busfahrer", g: "m", q: "Für mich gehört Fleisch zu einem guten Essen dazu. Ich esse nicht jeden Tag Fleisch, aber am Sonntag gibt es bei uns immer einen Braten. Jeder soll selbst entscheiden, was er isst.", e: "For me meat is part of a good meal. I don't eat meat every day, but on Sundays we always have a roast. Everyone should decide for themselves what they eat." },
   ra: "Auf meinem Blatt geht es um vegetarisches Essen. Lea Wagner ist 24 und Studentin. Sie isst seit drei Jahren kein Fleisch, weil das gesünder und besser für die Umwelt ist. Sie sagt, dass vegetarisch kochen nicht schwer ist.",
   rb: "Klaus Zimmermann ist 47 und Busfahrer. Für ihn gehört Fleisch zu einem guten Essen. Er isst nicht jeden Tag Fleisch, aber am Sonntag gibt es bei ihm immer einen Braten. Er meint, jeder soll selbst entscheiden.",
   op: "Ich esse gern Fleisch, besonders Hähnchen. Aber ich esse nicht jeden Tag Fleisch. In Nigeria kochen wir viel mit Bohnen und Gemüse. Ich finde, Klaus hat recht: Jeder soll selbst entscheiden. Bist du Vegetarier?",
   ope: "I like eating meat, especially chicken. But I don't eat meat every day. In Nigeria we cook a lot with beans and vegetables. I think Klaus is right: everyone should decide for themselves. Are you a vegetarian?",
   v: [["das Fleisch", "meat"], ["die Umwelt", "environment"], ["gesund / gesünder", "healthy / healthier"], ["der Braten", "roast"], ["der Vegetarier", "vegetarian (person)"], ["entscheiden", "to decide"]] },
 { id: "sportverein", title: "Sport im Verein oder allein", en: "Sport in a club or alone",
   a: { name: "Sabine Koch", age: 36, job: "Physiotherapeutin", g: "f", q: "Ich spiele seit zehn Jahren Volleyball in einem Verein. In der Mannschaft macht Sport viel mehr Spaß, und man hat feste Termine. Ohne die Gruppe würde ich bestimmt oft zu Hause bleiben.", e: "I've played volleyball in a club for ten years. Sport is much more fun in a team, and you have fixed times. Without the group I'd definitely often stay at home." },
   b: { name: "Markus Schröder", age: 39, job: "Programmierer", g: "m", q: "Ich jogge am liebsten allein, früh am Morgen, wenn es noch ruhig ist. Ich bin flexibel und muss mich nicht nach anderen richten. Ein Verein ist mir zu teuer und zu zeitaufwendig.", e: "I like jogging alone best, early in the morning when it's still quiet. I'm flexible and don't have to adapt to others. A club is too expensive and too time-consuming for me." },
   ra: "Auf meinem Blatt geht es um Sport. Sabine Koch ist 36 und Physiotherapeutin. Sie spielt seit zehn Jahren Volleyball in einem Verein. Sie meint, dass Sport in einer Mannschaft mehr Spaß macht und man feste Termine hat.",
   rb: "Markus Schröder ist 39 und Programmierer. Er joggt lieber allein am Morgen, weil er flexibel sein möchte. Er findet einen Verein zu teuer und zu zeitaufwendig.",
   op: "Ich jogge auch lieber allein, weil ich unregelmäßig arbeite. Aber in Nigeria habe ich jedes Wochenende mit Freunden Fußball gespielt, und das hat mehr Spaß gemacht. Vielleicht suche ich in Berlin eine Fußballgruppe – dann lerne ich auch mehr Deutsch! Treibst du Sport?",
   ope: "I also prefer jogging alone because my working hours are irregular. But in Nigeria I played football with friends every weekend, and that was more fun. Maybe I'll look for a football group in Berlin – then I'll also learn more German! Do you do sport?",
   v: [["der Verein", "club"], ["die Mannschaft", "team"], ["feste Termine", "fixed appointments/times"], ["sich richten nach", "to adapt to"], ["zeitaufwendig", "time-consuming"], ["Sport treiben", "to do sport"]] },
 { id: "ehrenamt", title: "Ehrenamt", en: "Volunteering",
   a: { name: "Petra Lange", age: 55, job: "Bankangestellte", g: "f", q: "Ich helfe jeden Samstag bei der Tafel und verteile Lebensmittel an arme Menschen. Ich finde, jeder sollte sich ein bisschen für andere engagieren. Es macht mich glücklich, wenn ich helfen kann.", e: "Every Saturday I help at the food bank and hand out food to poor people. I think everyone should do a little for others. It makes me happy when I can help." },
   b: { name: "Daniel Krause", age: 33, job: "Elektriker", g: "m", q: "Ich arbeite oft 50 Stunden pro Woche und habe zwei kleine Kinder. Für ein Ehrenamt habe ich einfach keine Zeit. Man hilft auch, wenn man seine Steuern zahlt und für seine Familie da ist.", e: "I often work 50 hours a week and have two small children. I simply have no time for volunteering. You also help when you pay your taxes and are there for your family." },
   ra: "Auf meinem Blatt geht es um das Ehrenamt. Petra Lange ist 55 und arbeitet in einer Bank. Sie hilft jeden Samstag bei der Tafel. Sie meint, dass jeder sich ein bisschen für andere engagieren sollte.",
   rb: "Daniel Krause ist 33 und Elektriker. Er arbeitet sehr viel und hat zwei kleine Kinder. Deshalb hat er keine Zeit für ein Ehrenamt. Er sagt, dass man auch hilft, wenn man Steuern zahlt.",
   op: "Ich finde ein Ehrenamt sehr gut, aber ich verstehe auch Daniel. Ich habe einmal bei einem Programmierkurs für Kinder geholfen. Das hat mir viel Spaß gemacht. Vielleicht kann man auch nur ein paar Stunden im Monat helfen. Hast du schon einmal ehrenamtlich gearbeitet?",
   ope: "I think volunteering is very good, but I also understand Daniel. I once helped at a coding course for children. I really enjoyed it. Maybe you can also help just a few hours a month. Have you ever volunteered?",
   v: [["das Ehrenamt", "volunteer work"], ["die Tafel", "food bank"], ["verteilen", "to hand out"], ["sich engagieren", "to get involved"], ["die Steuern (Pl.)", "taxes"], ["ehrenamtlich", "voluntary, unpaid"]] },
 { id: "ausziehen", title: "Mit 18 ausziehen?", en: "Moving out at 18?",
   a: { name: "Sarah Hartmann", age: 20, job: "Auszubildende", g: "f", q: "Mit 18 bin ich ausgezogen und wohne jetzt in einer WG. Ich muss selbst kochen, putzen und mit Geld umgehen. So bin ich viel selbstständiger geworden.", e: "I moved out at 18 and now live in a shared flat. I have to cook, clean and manage money myself. That way I've become much more independent." },
   b: { name: "Lukas Werner", age: 25, job: "Student", g: "m", q: "Ich wohne noch bei meinen Eltern. Die Mieten in der Stadt sind sehr hoch, und so kann ich Geld sparen. Ich verstehe mich gut mit meiner Familie – warum sollte ich ausziehen?", e: "I still live with my parents. Rents in the city are very high and this way I can save money. I get on well with my family – why should I move out?" },
   ra: "Auf meinem Blatt geht es um das Thema Ausziehen. Sarah Hartmann ist 20 und macht eine Ausbildung. Sie ist mit 18 ausgezogen und wohnt in einer WG. Sie sagt, dass sie dadurch selbstständiger geworden ist.",
   rb: "Lukas Werner ist 25 und Student. Er wohnt noch bei seinen Eltern, weil die Mieten sehr hoch sind und er Geld sparen kann. Er versteht sich gut mit seiner Familie.",
   op: "In Nigeria wohnen viele junge Leute lange bei den Eltern, bis sie heiraten. Das ist ganz normal. Ich bin für das Studium ausgezogen und habe viel gelernt. Ich finde, beide Wege sind okay. Wann bist du ausgezogen?",
   ope: "In Nigeria many young people live with their parents for a long time, until they marry. That's completely normal. I moved out for my studies and learned a lot. I think both ways are okay. When did you move out?",
   v: [["ausziehen (ist ausgezogen)", "to move out"], ["die WG (Wohngemeinschaft)", "shared flat"], ["mit Geld umgehen", "to manage money"], ["selbstständig", "independent"], ["sich verstehen mit", "to get on with"], ["sparen", "to save"]] },
 { id: "geld", title: "Geld sparen oder ausgeben", en: "Saving or spending money",
   a: { name: "Birgit Schäfer", age: 42, job: "Steuerberaterin", g: "f", q: "Ich spare jeden Monat einen Teil von meinem Gehalt. Man weiß nie, was passiert – vielleicht geht das Auto kaputt oder man wird krank. Mit Ersparnissen fühle ich mich sicher.", e: "I save part of my salary every month. You never know what will happen – maybe the car breaks down or you get ill. With savings I feel safe." },
   b: { name: "Felix Jung", age: 28, job: "Kellner", g: "m", q: "Ich lebe heute, nicht morgen. Wenn ich Geld habe, gebe ich es für Reisen, Konzerte und gutes Essen aus. Erlebnisse sind mir wichtiger als ein volles Bankkonto.", e: "I live for today, not tomorrow. When I have money I spend it on travel, concerts and good food. Experiences are more important to me than a full bank account." },
   ra: "Auf meinem Blatt geht es um Geld. Birgit Schäfer ist 42 und Steuerberaterin. Sie spart jeden Monat, weil man nie weiß, was passiert. Mit Ersparnissen fühlt sie sich sicher.",
   rb: "Felix Jung ist 28 und Kellner. Er gibt sein Geld lieber für Reisen, Konzerte und gutes Essen aus. Er sagt, dass Erlebnisse für ihn wichtiger sind als ein volles Bankkonto.",
   op: "Ich finde, man braucht beides. Ich spare jeden Monat ein bisschen, weil ich eine eigene Firma habe und das Einkommen nicht immer gleich ist. Aber einmal im Jahr mache ich eine schöne Reise. Sparst du lieber oder gibst du lieber Geld aus?",
   ope: "I think you need both. I save a little every month because I have my own company and the income isn't always the same. But once a year I take a nice trip. Do you prefer saving or spending?",
   v: [["sparen", "to save"], ["ausgeben (hat ausgegeben)", "to spend"], ["das Gehalt", "salary"], ["die Ersparnisse (Pl.)", "savings"], ["das Erlebnis", "experience (event)"], ["das Bankkonto", "bank account"]] },
 { id: "auto", title: "Auto oder öffentliche Verkehrsmittel", en: "Car or public transport",
   a: { name: "Stefan Bauer", age: 46, job: "Handwerker", g: "m", q: "Ohne Auto kann ich nicht leben. Ich muss jeden Tag zu verschiedenen Kunden fahren und viel Werkzeug transportieren. Mit dem Bus wäre das unmöglich.", e: "I can't live without a car. Every day I have to drive to different customers and transport lots of tools. By bus that would be impossible." },
   b: { name: "Anna Vogel", age: 30, job: "Ärztin", g: "f", q: "Ich habe mein Auto vor zwei Jahren verkauft. In der Stadt fahre ich mit dem Fahrrad oder mit der U-Bahn. Das ist billiger, gesünder und besser für die Umwelt. Einen Parkplatz muss ich auch nicht mehr suchen.", e: "I sold my car two years ago. In the city I go by bike or underground. It's cheaper, healthier and better for the environment. I don't have to look for a parking space any more either." },
   ra: "Auf meinem Blatt geht es um das Auto. Stefan Bauer ist 46 und Handwerker. Er sagt, dass er ohne Auto nicht leben kann, weil er jeden Tag zu Kunden fährt und viel Werkzeug transportiert.",
   rb: "Anna Vogel ist 30 und Ärztin. Sie hat ihr Auto verkauft und fährt jetzt mit dem Fahrrad oder mit der U-Bahn. Sie findet das billiger, gesünder und besser für die Umwelt.",
   op: "In Berlin brauche ich kein Auto. Ich fahre mit der S-Bahn und mit der Tram, und das funktioniert meistens gut. In Port Harcourt war das ganz anders: Dort braucht man fast immer ein Auto, weil es wenig Busse gibt. Wie fährst du zur Arbeit?",
   ope: "In Berlin I don't need a car. I take the S-Bahn and the tram, and that mostly works well. In Port Harcourt it was completely different: there you almost always need a car because there are few buses. How do you get to work?",
   v: [["die öffentlichen Verkehrsmittel", "public transport"], ["das Werkzeug", "tools"], ["der Kunde", "customer"], ["der Parkplatz", "parking space"], ["unmöglich", "impossible"], ["verkaufen", "to sell"]] },
 { id: "sprachen", title: "Sprachen lernen", en: "Learning languages",
   a: { name: "Christian Lorenz", age: 35, job: "Kaufmann", g: "m", q: "Eine Sprache lernt man am besten im Land selbst. Ich habe ein halbes Jahr in Spanien gewohnt und jeden Tag mit den Leuten gesprochen. Nach sechs Monaten konnte ich mich gut unterhalten.", e: "You learn a language best in the country itself. I lived in Spain for six months and spoke with people every day. After six months I could hold a good conversation." },
   b: { name: "Melanie Roth", age: 40, job: "Sachbearbeiterin", g: "f", q: "Ich lerne Englisch in einem Kurs an der Volkshochschule. Dort lerne ich die Grammatik richtig und kann Fragen stellen. Nur im Alltag zu lernen ist chaotisch – man macht immer wieder dieselben Fehler.", e: "I'm learning English in a course at the adult education centre. There I learn grammar properly and can ask questions. Learning only in everyday life is chaotic – you keep making the same mistakes." },
   ra: "Auf meinem Blatt geht es um das Sprachenlernen. Christian Lorenz ist 35 und Kaufmann. Er meint, dass man eine Sprache am besten im Land lernt. Er hat ein halbes Jahr in Spanien gewohnt und konnte danach gut Spanisch sprechen.",
   rb: "Melanie Roth ist 40 und Sachbearbeiterin. Sie lernt Englisch in einem Kurs, weil sie dort die Grammatik richtig lernt und Fragen stellen kann. Sie findet, dass man im Alltag immer wieder dieselben Fehler macht.",
   op: "Ich habe beides gemacht. Zuerst habe ich einen Kurs besucht, weil die Grammatik für mich sehr schwer war. Aber am meisten lerne ich, wenn ich mit Nachbarn oder Kollegen spreche. Ich glaube, die Kombination ist am besten. Wie lernst du Deutsch?",
   ope: "I've done both. First I took a course, because grammar was very hard for me. But I learn the most when I talk to neighbours or colleagues. I think the combination is best. How do you learn German?",
   v: [["sich unterhalten", "to have a conversation"], ["die Volkshochschule (VHS)", "adult education centre"], ["Fragen stellen", "to ask questions"], ["der Alltag", "everyday life"], ["der Fehler", "mistake"], ["die Kombination", "combination"]] },
 { id: "socialmedia", title: "Soziale Medien", en: "Social media",
   a: { name: "Lisa Maier", age: 22, job: "Studentin", g: "f", q: "Ich bin jeden Tag auf Instagram und anderen Plattformen. So bleibe ich mit meinen Freunden auf der ganzen Welt in Kontakt und bekomme schnell Informationen.", e: "I'm on Instagram and other platforms every day. That way I stay in touch with my friends all over the world and get information quickly." },
   b: { name: "Robert Frank", age: 49, job: "Lehrer", g: "m", q: "Ich habe keine Social-Media-Konten. Viele Menschen verbringen zu viel Zeit damit und vergleichen sich ständig mit anderen. Außerdem weiß man nie, was mit seinen Daten passiert.", e: "I don't have any social media accounts. Many people spend too much time on them and constantly compare themselves with others. Also, you never know what happens to your data." },
   ra: "Auf meinem Blatt geht es um soziale Medien. Lisa Maier ist 22 und Studentin. Sie ist jeden Tag auf Instagram, weil sie so mit Freunden auf der ganzen Welt in Kontakt bleibt.",
   rb: "Robert Frank ist 49 und Lehrer. Er hat keine Social-Media-Konten. Er meint, dass viele Menschen zu viel Zeit damit verbringen. Außerdem weiß man nicht, was mit den Daten passiert.",
   op: "Für mich sind soziale Medien wichtig, weil meine Familie in Nigeria wohnt. So sehe ich Fotos und bleibe in Kontakt. Aber ich habe auch gemerkt, dass ich manchmal zu lange am Handy bin. Deshalb lege ich das Handy abends weg. Wie viel Zeit verbringst du am Handy?",
   ope: "Social media is important to me because my family lives in Nigeria. That way I see photos and stay in touch. But I've also noticed that I'm sometimes on my phone too long. That's why I put my phone away in the evening. How much time do you spend on your phone?",
   v: [["in Kontakt bleiben", "to stay in touch"], ["das Konto", "account"], ["verbringen", "to spend (time)"], ["sich vergleichen", "to compare oneself"], ["die Daten (Pl.)", "data"], ["ständig", "constantly"]] },
 { id: "hausarbeit", title: "Hausarbeit teilen", en: "Sharing housework",
   a: { name: "Claudia Berger", age: 37, job: "Verkäuferin", g: "f", q: "Bei uns zu Hause macht jeder etwas: Mein Mann kocht, ich putze, und die Kinder räumen ihre Zimmer auf. Wenn beide arbeiten, müssen auch beide im Haushalt helfen.", e: "At our home everyone does something: my husband cooks, I clean and the children tidy their rooms. If both work, both must help with the housework." },
   b: { name: "Jürgen Kaiser", age: 60, job: "Rentner", g: "m", q: "Früher hat bei uns meine Frau den Haushalt gemacht, und ich habe gearbeitet. Das hat gut funktioniert. Ich finde, jedes Paar soll selbst entscheiden, wie es die Arbeit aufteilt.", e: "In the past my wife did the housework and I worked. That worked well. I think every couple should decide for itself how to divide the work." },
   ra: "Auf meinem Blatt geht es um die Hausarbeit. Claudia Berger ist 37 und Verkäuferin. Bei ihr zu Hause macht jeder etwas. Sie meint, dass beide im Haushalt helfen müssen, wenn beide arbeiten.",
   rb: "Jürgen Kaiser ist 60 und Rentner. Früher hat seine Frau den Haushalt gemacht und er hat gearbeitet. Er sagt, dass jedes Paar selbst entscheiden soll, wie es die Arbeit aufteilt.",
   op: "Ich wohne allein, also mache ich alles selbst: kochen, putzen, Wäsche waschen. Ich koche gern, aber putzen mag ich nicht so. Ich finde, Claudia hat recht: Wenn beide arbeiten, sollen beide helfen. Wie ist das bei dir zu Hause?",
   ope: "I live alone, so I do everything myself: cooking, cleaning, laundry. I like cooking but I don't really like cleaning. I think Claudia is right: if both work, both should help. How is it at your home?",
   v: [["der Haushalt", "household, housework"], ["putzen", "to clean"], ["aufräumen", "to tidy up"], ["Wäsche waschen", "to do the laundry"], ["aufteilen", "to divide up"], ["das Paar", "couple"]] }
];

const GRAMMAR = [
 { id: "g-perfekt", title: "Perfekt · talking about the past", why: "Teil 1 and Teil 2 both ask about your experiences. In spoken German you use the Perfekt for almost everything in the past. Only sein, haben and modal verbs are usually used in the simple past: war, hatte, konnte, musste, wollte.",
   html: `<p><b>Form:</b> <i>haben</i> or <i>sein</i> in position 2 + participle at the <b>end</b>.</p>
   <p class="ex">Ich <b>habe</b> gestern meine Mutter <b>angerufen</b>.<br>Letztes Jahr <b>bin</b> ich nach Berlin <b>gezogen</b>.</p>
   <h4>sein or haben?</h4>
   <p>Use <b>sein</b> for movement from A to B (fahren, gehen, kommen, fliegen, reisen, umziehen), change of state (aufwachsen, aufstehen, werden, einschlafen) and the specials <b>sein, bleiben, passieren</b>. Everything else: <b>haben</b>.</p>
   <h4>Building the participle</h4>
   <table class="tbl"><tr><th>Type</th><th>Pattern</th><th>Example</th></tr>
   <tr><td>regular</td><td>ge- … -t</td><td>machen → gemacht, wohnen → gewohnt</td></tr>
   <tr><td>irregular</td><td>ge- … -en (vowel may change)</td><td>sprechen → gesprochen, finden → gefunden</td></tr>
   <tr><td>separable</td><td>prefix + ge + …</td><td>anfangen → an<b>ge</b>fangen, einkaufen → ein<b>ge</b>kauft</td></tr>
   <tr><td>be-, ver-, er-, ent-, ge-</td><td>no ge-</td><td>besuchen → besucht, verstehen → verstanden</td></tr>
   <tr><td>-ieren</td><td>no ge-, ends in -t</td><td>studieren → studiert, passieren → passiert</td></tr></table>
   <p><b>Survival trick:</b> if you forget a participle, use a verb you know: <i>Ich war im Kino</i> instead of <i>Ich bin ins Kino gegangen</i>. Both are correct.</p>` },
 { id: "g-satzbau", title: "Word order · weil, dass, deshalb", why: "Word order is checked under Formale Richtigkeit and it's the easiest mistake to fix. Three rules cover almost everything you'll say.",
   html: `<h4>Rule 1 · The verb is always in position 2</h4>
   <p class="ex">Ich <b>gehe</b> am Wochenende ins Kino.<br>Am Wochenende <b>gehe</b> ich ins Kino.<br>Meiner Meinung nach <b>ist</b> das zu teuer.</p>
   <p>If you start with time, place or an opinion phrase, the subject moves <b>behind</b> the verb.</p>
   <h4>Rule 2 · weil, dass, wenn, ob, obwohl, als → verb at the END</h4>
   <p class="ex">Ich lerne Deutsch, weil ich hier <b>arbeite</b>.<br>Ich finde, dass Homeoffice praktisch <b>ist</b>.<br>Als ich in Nigeria <b>gewohnt habe</b>, …<br>Wenn das Wetter schön <b>ist</b>, <b>machen</b> wir eine Radtour.</p>
   <p>When the sentence <i>starts</i> with a wenn/als-clause, the main verb comes right after the comma.</p>
   <h4>Rule 3 · deshalb, trotzdem, dann, außerdem → verb comes next</h4>
   <p class="ex">Ich bin müde, deshalb <b>bleibe</b> ich zu Hause.<br>Es regnet. Trotzdem <b>gehen</b> wir spazieren.</p>
   <h4>Safe connectors: und, aber, oder, denn → normal order</h4>
   <p class="ex">Ich bleibe zu Hause, denn ich <b>bin</b> müde.</p>
   <p><b>Tip:</b> if <i>weil</i> keeps breaking your sentence, say <i>denn</i>. The word order stays normal and it's just as good.</p>` },
 { id: "g-planen", title: "Polite suggestions & time words (Teil 3)", why: "Teil 3 is suggestions and dates. A few fixed patterns make you sound like B1 straight away.",
   html: `<h4>Suggestions with könnte / würde / sollte</h4>
   <table class="tbl"><tr><th></th><th>können → könnte</th><th>werden → würde</th></tr>
   <tr><td>ich</td><td>könnte</td><td>würde</td></tr><tr><td>du</td><td>könntest</td><td>würdest</td></tr><tr><td>wir</td><td>könnten</td><td>würden</td></tr></table>
   <p class="ex">Wir <b>könnten</b> im Park <b>feiern</b>.<br>Ich <b>würde</b> lieber am Sonntag <b>fahren</b>.<br><b>Könntest</b> du den Kuchen <b>mitbringen</b>?<br>Wie <b>wäre</b> es mit einem Picknick?</p>
   <p>Infinitive goes to the <b>end</b>, as with all modal verbs.</p>
   <h4>Time words</h4>
   <table class="tbl"><tr><th>Word</th><th>Used with</th><th>Example</th></tr>
   <tr><td>um</td><td>clock time</td><td>um 19 Uhr</td></tr>
   <tr><td>am</td><td>days, dates, parts of day</td><td>am Samstag, am 5. Juni, am Abend</td></tr>
   <tr><td>im</td><td>months, seasons</td><td>im Juli, im Sommer</td></tr>
   <tr><td>von … bis</td><td>a period</td><td>von 15 bis 22 Uhr</td></tr>
   <tr><td>nächste / letzte Woche</td><td>no preposition</td><td>nächsten Samstag</td></tr></table>
   <h4>Sharing tasks</h4>
   <p class="ex">Ich kümmere mich um <b>die</b> Getränke. (um + Akkusativ)<br>Wer übernimmt <b>das</b> Essen?<br>Ich bringe <b>einen</b> Kuchen mit.</p>` },
 { id: "g-faelle", title: "Cases survival kit", why: "You don't need perfect cases to pass. The marking for accuracy gives a B (3/6 points) for errors that don't block understanding. Get the most frequent ones right and move on.",
   html: `<table class="tbl"><tr><th></th><th>der</th><th>die</th><th>das</th><th>Plural</th></tr>
   <tr><td>Nominativ (subject)</td><td>der / ein</td><td>die / eine</td><td>das / ein</td><td>die</td></tr>
   <tr><td>Akkusativ (object, für, ohne, um, durch)</td><td><b>den / einen</b></td><td>die / eine</td><td>das / ein</td><td>die</td></tr>
   <tr><td>Dativ (mit, bei, nach, seit, von, zu, aus)</td><td><b>dem / einem</b></td><td><b>der / einer</b></td><td><b>dem / einem</b></td><td><b>den + -n</b></td></tr></table>
   <p>Only the masculine changes in the Akkusativ. Learn the Dativ prepositions as a song: <b>aus, bei, mit, nach, seit, von, zu</b>.</p>
   <p class="ex">Ich fahre <b>mit der</b> U-Bahn. · Ich wohne <b>seit drei Jahren</b> hier. · Ich wohne <b>bei meinem</b> Bruder.<br>Das Geschenk ist <b>für unsere</b> Lehrerin. · Ich habe <b>einen</b> Bruder.</p>
   <h4>in / an / auf: where vs. where to</h4>
   <p class="ex">Wo? → Dativ: Die Party ist <b>im</b> (in dem) Garten.<br>Wohin? → Akkusativ: Wir gehen <b>in den</b> Park.</p>
   <h4>Pronouns you'll use constantly</h4>
   <p class="ex">mir / dir (Dativ): Kannst du <b>mir</b> helfen? · Das gefällt <b>mir</b>. · Wie geht es <b>dir</b>?<br>mich / dich (Akkusativ): Ich freue <b>mich</b>. · Ich rufe <b>dich</b> an.</p>
   <p>Verbs with Dativ: <b>helfen, gefallen, gehören, danken, schmecken, passen</b>.</p>` },
 { id: "g-genus", title: "Gender (der / die / das) shortcuts", why: "You can predict the article for a big part of the vocabulary from the ending.",
   html: `<table class="tbl"><tr><th><span class="g-die">die</span></th><th><span class="g-das">das</span></th><th><span class="g-der">der</span></th></tr>
   <tr><td>-ung, -heit, -keit, -schaft, -ion, -tät, -ie, most nouns in -e</td><td>-chen, -lein, -ment, -um, -o, infinitives used as nouns (das Essen)</td><td>days, months, seasons, -er for people/tools, -ismus, -ling</td></tr>
   <tr><td>die Wohnung, die Freiheit, die Information</td><td>das Mädchen, das Zentrum, das Büro</td><td>der Montag, der Juli, der Lehrer</td></tr></table>
   <p><b>Compound nouns take the gender of the LAST part:</b> das Haus + die Tür = <b>die</b> Haustür.</p>
   <p><b>In the exam:</b> if you don't know the gender, don't stop. Say the word and keep going. A gender mistake rarely blocks understanding. Stopping does cost you fluency points.</p>` }
];

const pad = n => String(n).padStart(2, "0");
const dayKey = (d = new Date()) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function defaults() {

}
let S = defaults();
try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved && typeof saved === "object") S = Object.assign(defaults(), saved); } catch (e) {}

function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ---------- capabilities ---------- */
const CAP = { ready: false, sample: null, tts: null, dict: null, ttsOff: false };
const capWaiters = [];
function whenCaps(fn) { if (CAP.ready) fn(); else capWaiters.push(fn); }
(async () => {
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const r = await Promise.all(["sample", "tts", "dictation"].map(n => window.claude.use(n).catch(() => null)));
      CAP.sample = r[0]; CAP.tts = r[1]; CAP.dict = r[2];
    }
  } catch (e) {}
  CAP.ready = true;
  if (CAP.dict) setupDictation();
  capWaiters.splice(0).forEach(f => { try { f(); } catch (e) {} });
})();

/* ---------- speech out ---------- */
const VOICE = { A: "rounded", B: "airy", P: "glassy", X: "buttery" };
function stopSpeech() { try { CAP.tts && CAP.tts.stop().catch(() => {}); } catch (e) {} try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} }
function sayLines(lines) { // lines: [{text, who}]
  if (CAP.ttsOff) { toast("Reading aloud is switched off for this page in its permissions."); return; }
  if (CAP.tts) {
    const arr = lines.slice(0, 100).map(l => ({ text: l.text.slice(0, 1990), voice: VOICE[l.who] || "buttery", language: "de" }));
    CAP.tts.speak(arr, { rate: S.rate, language: "de" }).catch(e => {
      if (e && e.code === "not_granted") { CAP.ttsOff = true; toast("Reading aloud is switched off for this page."); }
      else if (e && e.code === "no_gesture") toast("Tap play again.");
      else if (e && e.code === "busy") toast("Finish dictating first.");
      else if (e && e.code === "rate_limited") toast("Audio limit reached for now. Try again in a minute.");
    });
    return;
  }
  if ("speechSynthesis" in window) {
    try {
      speechSynthesis.cancel();
      const voices = speechSynthesis.getVoices().filter(v => (v.lang || "").toLowerCase().startsWith("de"));
      lines.forEach((l, i) => {
        const u = new SpeechSynthesisUtterance(l.text); u.lang = "de-DE"; u.rate = S.rate;
        if (voices.length) u.voice = voices[(l.who === "B" ? 1 : l.who === "P" ? 2 : 0) % voices.length];
        speechSynthesis.speak(u);
      });
    } catch (e) { toast("Audio isn't available on this device."); }
  } else toast("Audio isn't available on this device.");
}
const say = (text, who) => sayLines([{ text, who: who || "X" }]);

/* ---------- dictation (speech in) ---------- */
let dictTarget = null, dictPartialEl = null;
function setupDictation() {
  CAP.dict.onFinal(({ text }) => { if (!dictTarget) return; const v = dictTarget.value; dictTarget.value = v ? v + text : text.replace(/^\s+/, ""); dictTarget.dispatchEvent(new Event("input")); });
  CAP.dict.onPartial(({ text }) => { if (dictPartialEl) dictPartialEl.textContent = text ? "… " + text : ""; });
  CAP.dict.onState(({ state, reason }) => {
    $$(".mic").forEach(b => b.setAttribute("aria-pressed", state === "idle" ? "false" : "true"));
    if (state === "idle") { if (dictPartialEl) dictPartialEl.textContent = ""; if (reason === "not_granted") { CAP.dict = null; $$(".mic").forEach(b => b.hidden = true); } }
  });
}
function micButton(textarea, partialEl) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "btn mic"; b.innerHTML = ICON_MIC + " Sprechen"; b.setAttribute("aria-pressed", "false"); b.title = "Dictate in German";
  b.hidden = !CAP.dict;
  whenCaps(() => { b.hidden = !CAP.dict; });
  b.onclick = () => {
    if (!CAP.dict) return;
    if (CAP.dict.active()) { CAP.dict.stop().catch(() => {}); return; }
    dictTarget = textarea; dictPartialEl = partialEl;
    CAP.dict.start({ language: "de" }).catch(e => {
      if (e && e.code === "not_granted") { toast("Microphone not allowed. Type instead."); b.hidden = true; }
      else if (e && e.code === "unavailable") CAP.dict.start().catch(() => toast("Dictation isn't available here."));
      else if (e && e.code !== "stopped" && e.code !== "dismissed") toast("Dictation didn't start. Try again.");
    });
  };
  return b;
}

/* ---------- timers ---------- */
let timers = [];
let audioCtx;
function beep() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(t => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; g.gain.value = .12; o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .15); }); } catch (e) {} }
let wakeLock = null;
function timerEl(label, secs, opts = {}) {
  const el = document.createElement("div"); el.className = "timer";
  el.innerHTML = `<div><div class="lab">${esc(label)}</div><div class="clock">${pad(Math.floor(secs / 60))}:${pad(secs % 60)}</div></div><div class="bar"><i style="width:0%"></i></div><div class="row"><button class="btn sm pri" data-a="go">Start</button><button class="btn sm" data-a="reset">Reset</button></div>`;
  let left = secs * 1000, endAt = 0, running = false, iv = null;
  const clock = $(".clock", el), bar = $(".bar i", el), go = $('[data-a="go"]', el);
  const draw = () => { const s = Math.max(0, Math.ceil(left / 1000)); clock.textContent = pad(Math.floor(s / 60)) + ":" + pad(s % 60); bar.style.width = (100 - (left / (secs * 1000)) * 100) + "%"; el.classList.toggle("low", s <= 60 && s > 0); el.classList.toggle("end", s === 0); };
  const tick = () => { left = endAt - Date.now(); if (left <= 0) { left = 0; stop(); beep(); toast(label + ": time is up"); opts.onEnd && opts.onEnd(); } draw(); };
  const stop = () => { running = false; clearInterval(iv); go.textContent = left > 0 ? "Weiter" : "Start"; };
  go.onclick = () => {
    if (running) { left = endAt - Date.now(); stop(); go.textContent = "Weiter"; return; }
    if (left <= 0) left = secs * 1000;
    endAt = Date.now() + left; running = true; iv = setInterval(tick, 250); go.textContent = "Pause";
    try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => wakeLock = w).catch(() => {}); } catch (e) {}
    opts.onStart && opts.onStart();
  };

/* ---------- AI partner ---------- */
const REQS = {
  1: "introduce yourself with several details (origin, where/how you live, family, where you learned German, job, languages), ask the partner questions, react to the partner's answers, answer the examiner's extra question.",
  2: "report the opinion on your own sheet (who, age, job, the opinion and the reason), give your own opinion with a reason, tell a personal experience (past tense), react to the partner, ask the partner questions.",
  3: "make suggestions, react to the partner's suggestions (agree or disagree with reasons, offer alternatives), cover the points on the list, divide the tasks (who does what), summarise the agreement at the end."
};
function aiRules(mode, ctx) {
  const common = "Keep every turn to 1–3 short sentences of simple, natural spoken German at B1 level. Use 'du'. Never correct the learner's mistakes, never use English, never use lists or formatting, never mention that you are an AI. Reply with your next spoken turn only.";
  if (mode === 1) return "Role-play: you are Anna, 32, a fellow candidate in the telc Deutsch B1 oral exam, part 1 'Einander kennenlernen'. You are from Valencia in Spain, live in Berlin-Neukölln in a flat with your husband, have no children, work as a nurse in a hospital, learned German at the Volkshochschule for two years, speak Spanish, English and German. The other candidate is the learner. Answer their questions about you briefly and ask them about the points on the task sheet (Name, Herkunft, Wohnen, Familie, wo Deutsch gelernt, Beruf, Sprachen), one question at a time, reacting naturally to what they say ('Ach, interessant!'). After about 8 of your turns, switch to being the examiner for one turn: start that turn with 'Prüferin:' and ask, using 'Sie', how they spend their weekend or what hobbies they have. " + common;
  if (mode === 2) { const t = ctx; return `Role-play: telc Deutsch B1 oral exam, part 2 'Über ein Thema sprechen', topic "${t.title}". You are candidate B. Your task sheet shows this opinion from a magazine: ${t.b.name}, ${t.b.age}, ${t.b.job}: "${t.b.q}" The learner (candidate A) has a sheet with a different opinion. Flow: the learner speaks first and reports their sheet. Then you report YOUR sheet in 2–3 simple sentences in indirect speech (for example 'Auf meinem Blatt steht die Meinung von …. ${t.b.g === "f" ? "Sie" : "Er"} meint, dass …') and ask for the learner's opinion. After that, discuss: give your own opinion (you may partly agree with both sides), tell a short invented personal experience in the Perfekt, and ask one follow-up question in every turn (Warum? Wie ist das in deinem Heimatland? Hast du damit Erfahrungen?). If the learner is unclear, ask 'Was meinst du mit …?'. ` + common; }
  const t = ctx;
  return `Role-play: telc Deutsch B1 oral exam, part 3 'Gemeinsam etwas planen'. You are candidate B. Situation: ${t.s} Points on the list: ${t.p.map(p => p[0]).join(", ")} and anything else that's sensible. The learner starts. React to each suggestion: accept some, but politely reject at least one with a reason and suggest an alternative ('Das ist vielleicht zu teuer. Wie wäre es mit …?'). Make your own suggestions too, offer to take on some tasks and ask the learner to take on others ('Kannst du … übernehmen?'). Move to points that haven't been covered. When all points are covered, ask the learner to summarise ('Kannst du noch einmal alles zusammenfassen?'), then agree and close. ` + common;
}
function feedbackPrompt(part, transcript) {
  return `You are a licensed telc examiner for telc Deutsch B1 (Zertifikat Deutsch), oral exam part ${part}. Below is a transcript of a practice conversation. The learner's lines were typed or dictated, so ignore punctuation, capitalisation and spelling; judge only the spoken language (grammar, words, word order). Assess ONLY the lines marked KANDIDAT.
Use the official telc criteria and be realistic for B1 (not strict like C1):
- ausdruck (Ausdrucksfähigkeit): vocabulary, expressing things appropriately, achieving what they wanted to say.
- aufgabe (Aufgabenbewältigung): participation, discourse strategies (asking back, reacting, helping, rephrasing), fluency (judge from length and connectedness of turns).
- formal (Formale Richtigkeit): syntax and morphology. A = no or isolated errors; B = errors that do not impair understanding; C = errors at central points that seriously impair understanding; D = so many errors that communication fails.
A = fully appropriate, B = appropriate on the whole, C = barely acceptable, D = not sufficient.
What the learner must do in this part: ${REQS[part]}
Reply with ONLY a JSON object of this shape:
{"ausdruck":"A|B|C|D","aufgabe":"A|B|C|D","formal":"A|B|C|D","summary_en":"2-3 sentences","did_well":["short point"],"missing":["task requirements the learner did not do yet"],"corrections":[{"original":"the learner's words","corrected":"correct German","why_en":"short reason"}],"better_de":"an improved B1 version of the learner's longest turn","better_en":"English translation of better_de","tip_en":"one concrete thing to do next time"}

TRANSCRIPT:
${transcript}`;
}
function errCopy(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled" || c === "capability_removed") return "The AI partner isn't allowed in this view. Use the partner cards instead.";
  if (c === "rate_limited") return "Too many requests right now. Wait a minute and try again.";
  if (c === "session_expired") return "Please sign in to Claude again.";
  if (c === "invalid_json") return "The feedback came back in the wrong format. Tap again.";
  if (c === "cancelled") return "";
  return "Something went wrong. Try again.";
}
function aiChat(mode, ctx, opts = {}) {
  const el = document.createElement("div"); el.className = "panel";
  el.innerHTML = `<div class="row"><b>KI-Gesprächspartner</b><span class="pill warn">AI</span></div><p class="hint">Say your answer OUT LOUD first. Then dictate it${CAP.dict ? "" : " (or type it; on a phone you can use the keyboard's microphone set to German)"} and send. At the end, tap “Feedback” for a telc-style rating.</p><div data-a="body"><p class="hint">Checking whether the AI partner is available…</p></div>`;
  const body = $('[data-a="body"]', el);

    if (!CAP.sample) { body.innerHTML = `<div class="note warn">The AI partner isn't available in this view. Everything else works. Use the Partner-Karten, or open this page in Claude on a computer to use it.</div>`; return; }
    let turns = [], ctl = null, busy = false;
    body.innerHTML = `<div class="chat" data-a="chat"></div><div class="hint" data-a="partial"></div><div class="compose"><textarea id="ai-in-${mode}-${Math.random().toString(36).slice(2, 7)}" placeholder="${mode === 3 ? "z. B. Wir sollen eine Party planen. Ich schlage vor, dass …" : mode === 2 ? "z. B. Auf meinem Blatt geht es um …" : "z. B. Hallo, ich heiße …"}"></textarea></div><div class="row" data-a="btns" style="margin-top:8px"><button class="btn pri" data-a="send">Senden</button><button class="btn" data-a="fb">Feedback</button><button class="btn" data-a="reset">Neu starten</button><button class="btn" data-a="stop" hidden>Stop</button></div><div data-a="fbout"></div>`;
    const chat = $('[data-a="chat"]', body), ta = $("textarea", body), partial = $('[data-a="partial"]', body);
    const btns = $('[data-a="btns"]', body), stopB = $('[data-a="stop"]', body), fbout = $('[data-a="fbout"]', body);
    btns.insertBefore(micButton(ta, partial), btns.firstChild);
    const add = (cls, text) => { const m = document.createElement("div"); m.className = "msg " + cls; m.textContent = text; chat.appendChild(m); chat.scrollTop = chat.scrollHeight; return m; };
    add("sys", mode === 3 ? "You start. Make the first suggestion." : mode === 2 ? "You start. Report what is on your sheet." : "You start. Greet your partner and introduce yourself.");
    const setBusy = b => { busy = b; $('[data-a="send"]', body).disabled = b; $('[data-a="fb"]', body).disabled = b; stopB.hidden = !b; };
    stopB.onclick = () => ctl && ctl.abort();
    $('[data-a="send"]', body).onclick = async () => {
      const v = ta.value.trim(); if (!v || busy) return;
      if (CAP.dict && CAP.dict.active()) await CAP.dict.stop().catch(() => {});
      const vv = ta.value.trim() || v;
      turns.push({ role: "user", content: vv }); add("me", vv); ta.value = "";
      const bubble = add("ai", "…"); setBusy(true); ctl = new AbortController();
      try {
        const { text } = await CAP.sample([{ role: "user", content: aiRules(mode, ctx) + "\n\nThe learner now says:" }, ...turns], { cache: false, modelTier: "quick", signal: ctl.signal, onText: ({ text }) => { bubble.textContent = text; chat.scrollTop = chat.scrollHeight; } });
        bubble.textContent = text; turns.push({ role: "assistant", content: text });
        say(text.replace(/^Prüferin:\s*/, ""), "B");
      } catch (e) {
        if (e && e.text) { bubble.textContent = e.text; turns.push({ role: "assistant", content: e.text }); }
        else { bubble.remove(); turns.pop(); }
        const m = errCopy(e); if (m) add("sys", m);
      } finally { setBusy(false); }
    };
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $('[data-a="send"]', body).click(); });
    $('[data-a="reset"]', body).onclick = () => { if (ctl) ctl.abort(); turns = []; chat.innerHTML = ""; fbout.innerHTML = ""; add("sys", "New conversation. You start."); };
    $('[data-a="fb"]', body).onclick = async () => {
      if (!turns.some(t => t.role === "user")) { toast("Say something first."); return; }
      const tr = turns.map(t => (t.role === "user" ? "KANDIDAT: " : "PARTNER: ") + t.content).join("\n");

      } catch (e) { fbout.innerHTML = `<div class="note warn">${esc(errCopy(e) || "Stopped.")}</div>`; }
      finally { setBusy(false); }
    };
  });
  return el;
}
function feedbackHTML(r, part) {
  const lv = x => ["A", "B", "C", "D"].includes(x) ? x : "B";

  const max = part === 1 ? 15 : 30;
  const crit = CRITERIA.slice(0, 3).map(c => `<tr><td><b>${c.de}</b><br><span class="hint">${c.en}</span></td><td><div class="ovals">${["A", "B", "C", "D"].map(x => `<span class="oval" aria-pressed="${lv(r[c.key]) === x}">${x}</span>`).join("")}</div></td><td class="hint">${pts(c.key)} P.</td></tr>`).join("");
  const list = (a) => (Array.isArray(a) && a.length) ? "<ul>" + a.map(x => `<li>${esc(x)}</li>`).join("") + "</ul>" : "";
  const corr = Array.isArray(r.corrections) && r.corrections.length ? r.corrections.map(c => `<div class="corr"><div class="o">${esc(c.original)}</div><div class="c">${esc(c.corrected)} ${playBtn(c.corrected || "")}</div><div class="hint">${esc(c.why_en)}</div></div>`).join("") : `<p class="hint">No important corrections.</p>`;
  return `<div class="fb" style="margin-top:12px"><h3>Feedback (Teil ${part})</h3><div class="scroll"><table class="m10">${crit}<tr><td><b>Aussprache</b><br><span class="hint">can't be judged from text: counted as B</span></td><td></td><td class="hint">${POINTS[part].aussprache[1]} P.</td></tr></table></div>
  <div class="row"><span class="total" style="font-size:2rem">≈ ${sum}</span><span class="hint">of ${max} points for this part (pass line: ${part === 1 ? 9 : 18})</span></div>
  <p>${esc(r.summary_en)}</p>${r.did_well && r.did_well.length ? `<h4>Good</h4>${list(r.did_well)}` : ""}${r.missing && r.missing.length ? `<h4>Still missing</h4>${list(r.missing)}` : ""}
  <h4>Corrections</h4>${corr}
  ${r.better_de ? `<h4>Better version</h4><div class="lines">${lineHTML(r.better_de, r.better_en)}</div>` : ""}
  ${r.tip_en ? `<div class="note">${esc(r.tip_en)}</div>` : ""}</div>`;
}

/* ---------- self-score grid ---------- */
function gridEl(parts, scores, onChange) {
  const el = document.createElement("div");
  const draw = () => {
    let total = 0, rows = "";
    parts.forEach(p => {
      rows += `<tr><th colspan="3">Teil ${p} · max ${p === 1 ? 15 : 30}</th></tr>`;
      CRITERIA.forEach(c => {
        const sel = scores[p] && scores[p][c.key];
        const idx = ["A", "B", "C", "D"].indexOf(sel);
        if (idx >= 0) total += POINTS[p][c.key][idx];
        rows += `<tr><td><b>${c.de}</b><br><span class="hint">${c.en}${idx >= 0 ? " · " + c.levels[idx] : ""}</span></td><td><div class="ovals">${["A", "B", "C", "D"].map((x, i) => `<button type="button" class="oval" data-p="${p}" data-k="${c.key}" data-v="${x}" aria-pressed="${sel === x}" title="${esc(c.levels[i])} (${POINTS[p][c.key][i]} P.)">${x}</button>`).join("")}</div></td><td class="hint" style="white-space:nowrap">${idx >= 0 ? POINTS[p][c.key][idx] : "–"} / ${POINTS[p][c.key][0]}</td></tr>`;
      });
    });
    const max = parts.reduce((a, p) => a + (p === 1 ? 15 : 30), 0);
    const need = Math.ceil(max * 0.6);
    const complete = parts.every(p => CRITERIA.every(c => scores[p] && scores[p][c.key]));
    el.innerHTML = `<div class="scroll"><table class="m10">${rows}</table></div><div class="row" style="margin-top:10px"><span class="total">${total}</span><span class="hint">/ ${max} points · pass from ${need}</span>${complete ? (total >= need ? `<span class="pill good">bestanden</span>` : `<span class="pill bad">nicht bestanden</span>`) : `<span class="pill warn">fill every row</span>`}</div>`;
    $$(".oval", el).forEach(b => b.onclick = () => { const p = b.dataset.p; scores[p] = scores[p] || {}; scores[p][b.dataset.k] = b.dataset.v; draw(); onChange && onChange(total); });
    el.dataset.total = total;
  };
  draw();
  return el;
}

function t1Script() {
  const P = k => (S.profile[k] ?? T1_FIELDS.find(f => f.k === k).def).trim();
  const L = [];
  L.push([`Hallo, ich heiße ${P("name")}. Ich komme aus ${P("land")}, aus ${P("stadt")}.`, `Hello, my name is ${P("name")}. I come from ${P("land")}, from ${P("stadt")}.`]);
  L.push([`${P("stadt")} liegt ${P("lage")}.`, `${P("stadt")} is located (${P("lage")}).`]);
  L.push([`Ich wohne seit ${P("seit")} in Deutschland.`, `I have been living in Germany for ${P("seit")}. (seit + present tense)`]);
  L.push([`Jetzt wohne ich ${P("wohnort")}. Ich habe ${P("wohnung")}.`, `Now I live (${P("wohnort")}). I have (${P("wohnung")}).`]);
  if (/^j/i.test(P("umzug"))) L.push([`Ich bin vor Kurzem umgezogen, und die neue Wohnung gefällt mir sehr gut.`, `I moved recently and I like the new flat very much.`]);
  L.push([P("familie"), `(your family sentence)`]);
  L.push([`Ich bin ${P("beruf")} von Beruf. ${P("beruf2")}`, `I'm a (${P("beruf")}) by profession. + your sentence about your work`]);
  L.push([`Deutsch lerne ich ${P("deutsch")}.`, `I've been learning German (${P("deutsch")}).`]);
  L.push([`Ich spreche ${P("sprachen")}.`, `I speak ${P("sprachen")}.`]);
  L.push([`${P("hobby").replace(/\.$/, "")}.`, `(your hobbies)`]);
  L.push([`Am Wochenende ${P("wochenende").replace(/\.$/, "")}.`, `At the weekend I … (verb comes right after “Am Wochenende”)`]);
  L.push([`Und jetzt du: Woher kommst du?`, `And now you: where are you from?`]);
  return L;
}

    d.innerHTML = `<summary><span>${esc(g.title)}</span>${best !== null ? `<span class="pill ${best >= 8 ? "good" : "warn"}">${best}/10</span>` : ""}</summary><div class="in"><div class="note">${esc(g.why)}</div>${g.html}<h4>Quiz</h4><div class="quiz" data-q="${g.id}"></div></div>`;

      qwrap.innerHTML = qs.map((q, i) => `<div class="q" data-i="${i}"><div>${i + 1}. ${esc(q[0])}</div><div class="opts">${q[1].map((o, j) => `<button type="button" class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div><div class="why" hidden>${esc(q[3])}</div></div>`).join("") + `<div class="row" style="margin-top:10px"><b data-a="score"></b><button class="btn sm" data-a="again">Neu starten</button></div>`;

/* ================= SHELL ================= */
function updateHeader() {
  const m = Math.round(S.minutes[dayKey()] || 0);
  const el = $("#hdr-meta"); if (!el) return;
  el.innerHTML = `<span class="hide-s">Tag ${currentDay()}/5</span><span title="Practice minutes today">${m}/120 min <span class="meter"><i style="width:${Math.min(100, m / 120 * 100)}%"></i></span></span><button type="button" class="btn sm ${S.hideEN ? "" : "on"}" id="entoggle" title="Show or hide English translations">EN</button>`;
  $("#entoggle").onclick = () => { S.hideEN = !S.hideEN; save(); document.body.classList.toggle("hide-en", S.hideEN); updateHeader(); };
}
function viewName() { const h = (location.hash || "").replace(/^#/, ""); return VIEWS.some(v => v[0] === h) ? h : "heute"; }
function render(anchor) {
  clearTimers();
  const v = viewName();
  $$("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + v ? "page" : "false"));
  const cur = $("nav.tabs a[aria-current='page']"); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
  const main = $("#main"); main.innerHTML = "";
  V[v](main);
  if (anchor) { const id = v === "redemittel" ? "rm-" + anchor : anchor; const el = document.getElementById(id); if (el) { if (el.tagName === "DETAILS") el.open = true; setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 60); } }
  updateHeader();
}
function go(view, anchor) { if (viewName() === view) render(anchor); else { pendingAnchor = anchor; location.hash = view; } }
let pendingAnchor = null;
window.addEventListener("hashchange", () => { const a = pendingAnchor; pendingAnchor = null; render(a); if (!a) window.scrollTo(0, 0); });

document.addEventListener("click", e => {
  const p = e.target.closest("[data-say]"); if (p) { e.preventDefault(); e.stopPropagation(); say(p.dataset.say, p.dataset.who); return; }
  const all = e.target.closest("[data-sayall]"); if (all) { try { sayLines(JSON.parse(all.dataset.sayall)); } catch (x) {} return; }
  if (e.target.closest("[data-stop]")) { stopSpeech(); return; }
  const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go, g.dataset.anchor || null); return; }
  const de = e.target.closest(".hide-de .de"); if (de) de.classList.toggle("reveal");
});

/* practice-minute tracking: counts while you're actively using the page */
let lastAct = Date.now();
["click", "keydown", "input", "touchstart", "scroll"].forEach(ev => document.addEventListener(ev, () => lastAct = Date.now(), { passive: true, capture: true }));
setInterval(() => {
  const speaking = timers.length && $$(".timer .btn.pri").some(b => b.textContent === "Pause");
  if (document.visibilityState === "visible" && (Date.now() - lastAct < 120000 || speaking)) { const k = dayKey(); S.minutes[k] = (S.minutes[k] || 0) + 0.25; save(); updateHeader(); }
}, 15000);

document.getElementById("tabs").innerHTML = VIEWS.map(v => `<a href="#${v[0]}">${v[1]}</a>`).join("");
document.body.classList.toggle("hide-en", S.hideEN);
render();
</script>
