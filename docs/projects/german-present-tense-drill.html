<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Präsens — German present tense drill</title>
<style>
:root{
  --bg:#0E1116; --panel:#161A21; --panel2:#1D222B; --line:#2A313C; --line2:#39424F;
  --fg:#E8ECF1; --dim:#9AA6B4; --dim2:#6E7A88;
  --ok:#57C596; --no:#E4695E; --gold:#D9B26A; --cool:#7BA1E8;
  --mono:ui-monospace,"SF Mono",'JetBrains Mono',Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--sans);
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding:0 0 env(safe-area-inset-bottom);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px;border-radius:4px}

.wrap{max-width:1000px;margin:0 auto;padding:0 16px 80px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;padding:18px 0 10px;flex-wrap:wrap}
.mark{font-family:var(--mono);font-weight:700;font-size:19px;letter-spacing:-.02em}
.mark span{color:var(--dim2);font-weight:400}
.ring{width:38px;height:38px;flex:0 0 38px}
.ring text{font-family:var(--mono);font-size:11px;fill:var(--fg)}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:999px;font-size:13px;color:var(--dim);
     border:1px solid transparent;transition:none}
.tab[aria-selected="true"]{color:var(--fg);background:var(--panel2);border-color:var(--line)}
.tab:hover{color:var(--fg)}

/* ---------- generic ---------- */
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--dim)}
.mono{font-family:var(--mono)}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
hr{border:none;border-top:1px solid var(--line);margin:18px 0}

/* ---------- drill layout ---------- */
.stage{display:grid;grid-template-columns:1fr 232px;gap:16px;align-items:start}
@media(max-width:820px){.stage{grid-template-columns:1fr}}

.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
       padding:22px;min-height:300px;display:flex;flex-direction:column}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:18px}
.qbody{flex:1}
.lemma{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.gloss{color:var(--dim);font-size:14px;margin-top:2px}
.ask{font-size:15px;color:var(--dim);margin:16px 0 6px}
.chip{display:inline-block;font-family:var(--mono);font-size:14px;padding:3px 9px;
      border:1px solid var(--line2);border-radius:999px;color:var(--fg);background:var(--panel2)}
.sent{font-family:var(--mono);font-size:19px;line-height:1.7;margin:14px 0 4px}
.gap{display:inline-block;min-width:96px;border-bottom:2px solid var(--line2);text-align:center;color:var(--dim2)}
.strike{color:var(--no);text-decoration:line-through 1.5px}

input[type=text]{
  width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;
  padding:12px 14px;font-family:var(--mono);font-size:19px;outline:none;
}
input[type=text]:focus{border-color:var(--cool)}
input[type=text].ok{border-color:var(--ok)}
input[type=text].no{border-color:var(--no)}

.keys{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.key{font-family:var(--mono);font-size:15px;padding:5px 12px;border:1px solid var(--line);
     border-radius:7px;background:var(--panel2);color:var(--dim)}
.key:hover{color:var(--fg);border-color:var(--line2)}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:8px;
     background:var(--panel2);display:flex;gap:11px;align-items:flex-start;font-size:15px}
.opt:hover{border-color:var(--line2)}
.opt .n{font-family:var(--mono);color:var(--dim2);font-size:13px;padding-top:2px}
.opt.sel{border-color:var(--cool)}
.opt.right{border-color:var(--ok);background:rgba(87,197,150,.09)}
.opt.wrong{border-color:var(--no);background:rgba(228,105,94,.09)}

.pgrid{display:grid;grid-template-columns:88px 1fr;gap:8px 12px;align-items:center;margin-top:6px}
.pgrid label{font-family:var(--mono);font-size:14px;color:var(--dim)}
.pgrid input{font-size:16px;padding:8px 11px}

.persons{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.pbtn{font-family:var(--mono);font-size:14px;padding:7px 13px;border:1px solid var(--line);
      border-radius:8px;background:var(--panel2);color:var(--dim)}
.pbtn.sel{border-color:var(--cool);color:var(--fg);background:rgba(123,161,232,.12)}
.pbtn.right{border-color:var(--ok);color:var(--fg)}
.pbtn.wrong{border-color:var(--no);color:var(--fg)}

.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:8px;background:var(--fg);color:#0E1116;font-weight:600;font-size:15px}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--fg);font-weight:500}
.btn.ghost:hover{border-color:var(--fg)}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--dim2)}

.fb{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.verdict{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.02em}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.answer{font-family:var(--mono);font-size:22px;margin:6px 0 2px}
.diag{font-size:14px;color:var(--fg);margin-top:8px}
.rule{font-size:14px;color:var(--dim);margin-top:6px}
.rule b{color:var(--fg);font-weight:600}
.tagline{font-size:12px;color:var(--dim2);margin-top:10px}

/* ---------- the ladder (signature) ---------- */
.ladder{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
        padding:14px;position:sticky;top:14px}
.ladder .eyebrow{margin-bottom:10px;display:block}
.rung{display:grid;grid-template-columns:66px 1fr;gap:8px;align-items:baseline;
      padding:6px 8px;border-radius:6px;border-left:2px solid transparent}
.rung .p{font-size:12px;color:var(--dim2);font-family:var(--mono)}
.rung .v{font-family:var(--mono);font-size:15px;color:var(--dim2);word-break:break-word}
.rung.on{border-left-color:var(--cool);background:var(--panel2)}
.rung.on .p{color:var(--cool)}
.rung.rev .v{color:var(--fg)}
.rung.rev.on .v{color:var(--cool)}
.rung.diff .v{color:var(--gold)}
.ladder .foot{font-size:11px;color:var(--dim2);margin-top:10px;border-top:1px solid var(--line);padding-top:9px}

/* ---------- progress bar ---------- */
.strip{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:12px;color:var(--dim2)}
.bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cool)}

/* ---------- progress tab ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.stat .n{font-family:var(--mono);font-size:25px;font-weight:700;line-height:1.1}
.stat .l{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2);margin-top:5px}

.grow{display:grid;grid-template-columns:1fr 168px 66px;gap:12px;align-items:center;
      padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.grow:last-child{border-bottom:none}
.grow .nm{display:flex;flex-direction:column;gap:1px}
.grow .sub{font-size:11.5px;color:var(--dim2)}
.mb{height:7px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.mb i{display:block;height:100%}
.mb .m{background:var(--gold)} .mb .l{background:var(--cool)} .mb .s{background:var(--line2)}
.pct{font-family:var(--mono);font-size:14px;text-align:right;color:var(--dim)}

.legend{display:flex;gap:14px;font-size:11.5px;color:var(--dim2);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.weak{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.weak span{font-family:var(--mono);font-size:13px;padding:4px 9px;border:1px solid var(--line);
           border-radius:6px;color:var(--dim)}

.togs{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.tog{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--dim2)}
.tog.on{border-color:var(--line2);color:var(--fg);background:var(--panel2)}

.sel-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--dim)}
.sel-inline select{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
                   padding:6px 9px;color:var(--fg);font-size:14px}

/* ---------- focus / exam menus ---------- */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;text-align:left}
.mcard:hover{border-color:var(--line2)}
.mcard .t{font-size:15px;font-weight:600;margin-bottom:3px}
.mcard .d{font-size:12.5px;color:var(--dim2);line-height:1.45}
.mcard .m{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:9px}

/* ---------- notes ---------- */
.notes{font-size:15px}
.notes h3{font-size:15px;margin:22px 0 8px;font-weight:600}
.notes h3:first-child{margin-top:0}
.notes p{color:var(--dim);margin:8px 0}
.notes table{border-collapse:collapse;width:100%;margin:10px 0;font-family:var(--mono);font-size:13.5px}
.notes th,.notes td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.notes th{color:var(--dim2);font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.notes b{color:var(--gold);font-weight:600}
.notes code{font-family:var(--mono);background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:13px}
.notes ul{color:var(--dim);padding-left:20px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--panel2);
       border:1px solid var(--line2);border-radius:8px;padding:9px 16px;font-size:14px;z-index:9}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
}
</style>
</head>

/* ============================================================ storage ==== */
const Store = (function(){
  let mode = 'memory', mem = {};
  try { localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); mode='local'; }
  catch(e){ if (typeof window !== 'undefined' && window.storage) mode = 'api'; }
  return {
    mode,
    label: mode==='local' ? 'saved in this browser' :
           mode==='api'   ? 'saved to app storage' : 'this session only — download the file to keep progress',
    async get(k){
      if(mode==='local'){ const s=localStorage.getItem(k); return s?JSON.parse(s):null; }
      if(mode==='api'){ try{ const r=await window.storage.get(k); return r?JSON.parse(r.value):null; }catch(e){ return null; } }
      return mem[k]||null;
    },
    async set(k,v){
      const s=JSON.stringify(v);
      if(mode==='local'){ try{ localStorage.setItem(k,s); }catch(e){} return; }
      if(mode==='api'){ try{ await window.storage.set(k,s); }catch(e){} return; }
      mem[k]=v;
    }
  };
})();

/* ============================================================ items ===== */
function buildItems(){
  const out=[];
  DATA.verbs.forEach((v,vi)=>{
    for(let p=0;p<6;p++){
      const fmts=['c'];
      if(v.tail) fmts.push('g');
      if(v.err[p]!==undefined) fmts.push('f');
      out.push({id:'v|'+v.inf+'|'+p, t:'v', grp:v.grp, vi, p, fmts});
    }
    out.push({id:'r|'+v.inf, t:'r', grp:v.grp, vi});
    out.push({id:'p|'+v.inf, t:'p', grp:v.grp, vi});
    const map={};
    v.forms.forEach((f,i)=>{ (map[f]=map[f]||[]).push(i); });
    Object.keys(map).forEach(f=>{
      const set=map[f];
      if(set.length>=2 && !(set.length===2 && set[0]===3 && set[1]===5))
        out.push({id:'w|'+v.inf+'|'+f, t:'w', grp:v.grp, vi, form:f, set});
    });
  });
  DATA.concepts.forEach((c,ci)=>out.push({id:'x|'+c.id, t:'x', grp:'concept', ci}));
  return out;
}
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function inScope(it){
  if(!P.settings.types[it.t]) return false;
  if(it.grp==='concept') return !!P.settings.groups.concept;
  if(!P.settings.groups[it.grp]) return false;
  if(P.settings.coreOnly && it.vi!==undefined && !DATA.verbs[it.vi].core) return false;
  return true;
}
/* a form is one piece of knowledge; the way it is asked rotates each showing */
function fmtOf(it){
  if(it.t!=='v') return it.t;
  const s=P.st[it.id];
  return it.fmts[(s?s.n:0) % it.fmts.length];
}

/* ============================================================ grading == */
function norm(s){
  return (s||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[.!?,;:]+$/,'');
}
function normWord(s){ return norm(s).replace(/[^\p{L}\u00df-]/gu,''); }
function deUml(s){ return s.replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss'); }

function accepted(it){
  const v=DATA.verbs[it.vi];
  if(it.t==='v') return [v.forms[it.p]].concat(v.alt[it.p]||[]);
  if(it.t==='x'){ const c=DATA.concepts[it.ci]; return c.kind==='type'? c.opts : null; }
  return null;
}
function target(it){
  const v=DATA.verbs[it.vi];
  if(it.t==='v') return v.forms[it.p];
  return null;
}
function checkWord(given, list){
  const phrase = list.some(a=>a.indexOf(' ')>=0);
  const f = phrase ? norm : normWord;
  const g = f(given);
  return list.some(a=>f(a)===g);
}
function isAlt(it,given){
  const v=DATA.verbs[it.vi], list=v.alt[it.p]||[];
  return list.some(a=>normWord(a)===normWord(given));
}

/* fine-grained diagnosis — the point of a rigorous drill */
function diagnose(it, given){
  const v=DATA.verbs[it.vi], want=target(it), g=normWord(given), w=normWord(want);
  if(!g) return 'Nothing entered.';
  const stripE = x => deUml(x).replace(/e/g,'');
  const other = v.forms.map((f,i)=>({f:normWord(f),i})).filter(o=>o.f===g && o.i!==it.p);
  if(other.length){
    let m='That is the '+other.map(o=>PERSONS[o.i]).join(' / ')+'-form of '+v.inf+'.';
    if(deUml(g)===deUml(w)) m+=' The stem vowel changes in du and er/sie/es only — everywhere else the stem stays put.';
    return m;
  }
  if(deUml(g)===deUml(w))
    return 'Right letters, wrong diacritics. The umlaut and the ß are part of the form, not decoration.';
  if(w.length===g.length+1 && stripE(w)===stripE(g))
    return 'An -e- is missing: this stem takes a linking -e- before the ending.';
  if(g.length===w.length+1 && stripE(g)===stripE(w))
    return 'One -e- too many: this stem does not take a linking -e-.';
  if(g===w.replace(/t$/,'st') || g===w+'s')
    return 'After -s, -ß, -z, -x and -tz the du-form takes only -t, never -st.';
  if(v.err[it.p]!==undefined && normWord(v.err[it.p])===g)
    return 'That is what you get by adding the plain ending and ignoring the rule for this stem.';
  if(g.startsWith(v.stem) && !w.startsWith(v.stem))
    return 'The stem vowel has to change for this person: ' + v.stem + '- → ' + w + '.';
  if(!g.startsWith(v.stem.slice(0,2)))
    return 'That is not a form of ' + v.inf + '.';
  return 'Ending mismatch. Rebuild it from the stem ' + v.stem + '-.';
}

/* ============================================================ SRS ====== */
function stOf(id){ return P.st[id]; }
function grade(it, ok){
  const now=Date.now();
  let s=P.st[it.id] || {b:0,due:0,n:0,c:0,k:0,l:0};
  s.n++;
  if(ok){ s.c++; s.k++; s.b=Math.min(6,s.b+1); s.due=now+BOX_MS[s.b]; }
  else  { s.k=0; s.l++; s.b = s.b<=2 ? 0 : s.b-2; s.due=now+6e4; }
  s.last=now;
  P.st[it.id]=s;
  const d=dayKey(now);
  P.hist[d]=P.hist[d]||[0,0]; P.hist[d][0]++; if(ok)P.hist[d][1]++;
  if(P.lastDay!==d){
    const y=dayKey(now-864e5);
    P.streak = (P.lastDay===y)? (P.streak||0)+1 : 1;
    P.lastDay=d;
  }
  save();
  return s;
}
function dayKey(t){ const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function dueCount(){ const now=Date.now(); return ITEMS.filter(i=>inScope(i)&&P.st[i.id]&&P.st[i.id].due<=now).length; }
function scopeItems(){ return ITEMS.filter(inScope); }
function masteryPct(){
  const s=scopeItems(); if(!s.length) return 0;
  return Math.round(100*s.filter(i=>P.st[i.id]&&P.st[i.id].b>=MASTER).length/s.length);
}

function buildQueue(n, filter, opts){
  opts=opts||{};
  const now=Date.now();
  const pool=scopeItems().filter(filter||(()=>true));
  const seen=pool.filter(i=>P.st[i.id]);
  const due=seen.filter(i=>P.st[i.id].due<=now).sort((a,b)=>P.st[a.id].due-P.st[b.id].due);
  const q=due.slice(0,n);
  const perVerb={};
  q.forEach(i=>{ if(i.vi!==undefined) perVerb[i.vi]=(perVerb[i.vi]||0)+1; });
  const newMax = opts.newMax!==undefined ? opts.newMax : P.settings.newMax;
  if(q.length<n && newMax>0){
    const fresh=pool.filter(i=>!P.st[i.id]);
    fresh.sort((a,b)=>(a.vi===undefined?999:a.vi)-(b.vi===undefined?999:b.vi) || a.id.localeCompare(b.id));
    let added=0;
    for(const i of fresh){
      if(q.length>=n || added>=newMax) break;
      const k=i.vi===undefined?'x':i.vi;
      if((perVerb[k]||0)>=3) continue;
      perVerb[k]=(perVerb[k]||0)+1; q.push(i); added++;
    }
  }
  if(q.length<n){
    const rest=seen.filter(i=>q.indexOf(i)<0)
      .sort((a,b)=>P.st[a.id].b-P.st[b.id].b || P.st[a.id].due-P.st[b.id].due);
    q.push(...rest.slice(0,n-q.length));
  }
  return shuffle(q, now);
}
function shuffle(a, seed){
  const r=a.slice(); let s=(seed||1)>>>0;
  for(let i=r.length-1;i>0;i--){ s=(Math.imul(s,1103515245)+12345)>>>0; const j=s%(i+1); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}

/* ============================================================ persist == */
let saveT=null;
function save(){
  dirty=true;
  clearTimeout(saveT);
  saveT=setTimeout(()=>{ Store.set(KEY,P); dirty=false; }, 900);
}
async function load(){
  const raw=await Store.get(KEY);
  if(raw){
    P.st = raw.st||{};
    P.hist = raw.hist||{};
    P.streak = raw.streak||0;
    P.lastDay = raw.lastDay||null;
    if(raw.settings){
      P.settings.len = raw.settings.len||20;
      P.settings.newMax = raw.settings.newMax!==undefined?raw.settings.newMax:8;
      if(raw.settings.coreOnly!==undefined) P.settings.coreOnly=raw.settings.coreOnly;
      TYPES.forEach(t=>{ if(raw.settings.types && raw.settings.types[t.k]!==undefined) P.settings.types[t.k]=raw.settings.types[t.k]; });
      Object.keys(P.settings.groups).forEach(k=>{ if(raw.settings.groups && raw.settings.groups[k]!==undefined) P.settings.groups[k]=raw.settings.groups[k]; });
    }
  }
}

/* ============================================================ session == */
function startSession(queue, title, exam){
  if(!queue.length){ toast('Nothing in scope — enable more types or rules in Progress.'); return; }
  session={ q:queue, i:0, title:title, exam:!!exam, right:0, done:0, log:[], answered:false, sel:null, picked:[] };
  render();
  setTimeout(focusInput,30);
}
function focusInput(){ const el=$('#ans')||document.querySelector('.pgrid input'); if(el) el.focus(); }

function renderRun(v){
  const s=session;
  if(s.i>=s.q.length) return renderResult(v);
  const it=s.q[s.i];
  s.fmt=fmtOf(it);
  v.innerHTML =
    '<div class="stage">'+
      '<div><div class="qcard" id="qcard">'+questionHTML(it,s.fmt)+'</div>'+
        '<div class="strip"><span class="mono">'+(s.i+1)+' / '+s.q.length+'</span>'+
        '<span class="bar"><i style="width:'+Math.round(100*s.i/s.q.length)+'%"></i></span>'+
        '<span>'+esc(s.title)+(s.exam?' · no feedback until the end':'')+'</span>'+
        '<button class="tab" id="quit">End</button></div>'+
      '</div>'+
      ladderHTML(it,false)+
    '</div>';
  $('#quit').onclick=()=>{ session=null; document.onkeydown=null; render(); };
  wireQuestion(it);
  setTimeout(focusInput,20);
}

function questionHTML(it, fmt){
  const v=DATA.verbs[it.vi];
  const head=(lemma,gloss)=>'<div class="qhead"><div><div class="lemma">'+esc(lemma)+'</div>'+
      (gloss?'<div class="gloss">'+esc(gloss)+'</div>':'')+'</div>'+
      '<span class="eyebrow">'+esc(typeName(fmt))+'</span></div>';

  if(fmt==='c'){
    return head(v.inf, v.en)+
      '<div class="qbody"><div class="ask">Write the '+PERSONS[it.p]+'-form.</div>'+
      inputHTML()+'</div>'+actionsHTML();
  }
  if(fmt==='g'){
    const subj=subjectFor(it);
    return head(v.inf, v.en)+
      '<div class="qbody"><div class="ask">Complete the sentence.</div>'+
      '<div class="sent">'+esc(subj)+' <span class="gap">?</span> '+esc(v.tail)+'.</div>'+
      inputHTML()+'</div>'+actionsHTML();
  }
  if(fmt==='f'){
    const subj=subjectFor(it), bad=v.err[it.p];

      ? esc(subj)+' <span class="strike">'+esc(bad)+'</span> '+esc(v.tail)+'.'
      : esc(subj)+' <span class="strike">'+esc(bad)+'</span>.';
    return head(v.inf, v.en)+
      '<div class="qbody"><div class="ask">This form is wrong. Write the correct one.</div>'+
      '<div class="sent">'+sent+'</div>'+inputHTML()+'</div>'+actionsHTML();
  }
  if(fmt==='w'){
    return head(it.form, 'a form of '+v.inf)+
      '<div class="qbody"><div class="ask">Which persons can this form belong to? Pick every one that fits.</div>'+
      '<div class="persons">'+PERSONS.map((p,i)=>'<button class="pbtn" data-p="'+i+'">'+p+'</button>').join('')+'</div></div>'+
      actionsHTML();

  if(fmt==='r'){

    return head(v.inf, v.en)+
      '<div class="qbody"><div class="ask">Which rule decides its du- and er/sie/es-forms?</div>'+
      '<div class="opts">'+opts.map((o,i)=>'<button class="opt" data-o="'+i+'"><span class="n">'+(i+1)+'</span><span>'+esc(o.text)+'</span></button>').join('')+
      '</div></div>'+actionsHTML();
  }
  if(fmt==='p'){
    return head(v.inf, v.en)+
      '<div class="qbody"><div class="ask">Write the complete paradigm.</div>'+
      '<div class="pgrid">'+PERSONS.map((p,i)=>
        '<label for="pf'+i+'">'+p+'</label><input type="text" id="pf'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false">').join('')+
      '</div>'+keysHTML()+'</div>'+actionsHTML();
  }
  if(fmt==='x'){
    const c=DATA.concepts[it.ci];
    if(c.kind==='mc'){

      return '<div class="qhead"><div><div class="lemma" style="font-size:19px;font-family:var(--sans);font-weight:600">'+esc(c.q)+'</div></div>'+
        '<span class="eyebrow">Concept</span></div>'+
        '<div class="qbody"><div class="opts">'+opts.map((o,i)=>'<button class="opt" data-o="'+i+'"><span class="n">'+(i+1)+'</span><span>'+esc(o.text)+'</span></button>').join('')+'</div></div>'+
        actionsHTML();
    }
    return '<div class="qhead"><div><div class="lemma" style="font-size:19px;font-family:var(--sans);font-weight:600">'+esc(c.q)+'</div></div>'+
      '<span class="eyebrow">Concept</span></div>'+
      '<div class="qbody">'+inputHTML()+'</div>'+actionsHTML();
  }
  return '';
}
function typeName(f){ return FMTNAME[f]||''; }
function inputHTML(){
  return '<input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type the form">'+keysHTML();
}
function keysHTML(){

/* For lassen, essen, lesen, wachsen, wissen … the sibilant rule genuinely also
   governs the du-form, so it must never be offered as a "wrong" answer. */
function sibilantAlsoApplies(v){
  const du=v.forms[1];
  const bare = du.endsWith('st') ? du.slice(0,-2) : (du.endsWith('t') ? du.slice(0,-1) : du);
  return /[s\u00dfzx]$/.test(bare);
}
function ruleOptions(it){
  const v=DATA.verbs[it.vi];
  const pool=DATA.groups.filter(g=>g.key!==v.grp &&
    !(g.key==='sibilant' && sibilantAlsoApplies(v)));
  const h=hash(it.id);
  const picks=[]; const used={};
  for(let i=0;i<3;i++){ let j=(h>>>(i*3))%pool.length; while(used[j]) j=(j+1)%pool.length; used[j]=1; picks.push(pool[j]); }
  const all=[{text:GROUP[v.grp].name+' — '+GROUP[v.grp].rule, ok:true}]
    .concat(picks.map(g=>({text:g.name+' — '+g.rule, ok:false})));
  return shuffle(all,h);
}
function conceptOptions(it){
  const c=DATA.concepts[it.ci];
  const h=hash(it.id);
  return shuffle(c.opts.map((t,i)=>({text:t, ok:i===c.ans})), h);
}

function wireQuestion(it){
  const s=session;
  s.answered=false; s.sel=null; s.picked=[];
  const card=$('#qcard');
  card.querySelectorAll('.key').forEach(b=>b.onclick=()=>{
    const el=document.activeElement && document.activeElement.tagName==='INPUT' ? document.activeElement : ($('#ans')||card.querySelector('.pgrid input'));
    if(!el) return;
    const p=el.selectionStart||el.value.length;
    el.value=el.value.slice(0,p)+b.dataset.k+el.value.slice(el.selectionEnd||p);
    el.focus(); el.setSelectionRange(p+1,p+1);
  });
  card.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>{
    if(s.answered) return;
    b.classList.toggle('sel');
    const i=+b.dataset.p, k=s.picked.indexOf(i);
    if(k<0) s.picked.push(i); else s.picked.splice(k,1);
  });
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(s.answered) return;
    card.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); s.sel=+b.dataset.o;
  });
  $('#check').onclick=()=>submit(it);
  $('#skip').onclick=()=>{ if(!s.answered) submit(it,true); else next(); };
  card.querySelectorAll('input[type=text]').forEach((el,i,all)=>{
    el.onkeydown=e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        if(s.answered) next();
        else if(it.t==='p' && i<all.length-1) all[i+1].focus();
        else submit(it);
      }
    };
  });
  document.onkeydown=e=>{
    if(!session) return;
    if((s.fmt==='r'||(s.fmt==='x'&&DATA.concepts[it.ci].kind==='mc')) && !s.answered && /^[1-4]$/.test(e.key)){
      const b=card.querySelector('.opt[data-o="'+(+e.key-1)+'"]'); if(b) b.click();
    }
    if(e.key==='Enter' && s.answered){ e.preventDefault(); next(); }
  };
}

function submit(it, skipped){
  const s=session; if(s.answered) return;
  const card=$('#qcard');
  const fmt=s.fmt;
  let ok=false, given='';
  if(fmt==='c'||fmt==='g'||fmt==='f'||(fmt==='x'&&DATA.concepts[it.ci].kind==='type')){
    given=$('#ans').value;
    ok = !skipped && checkWord(given, accepted(it));
  } else if(fmt==='w'){
    const want=it.set.slice().sort().join(',');
    ok = !skipped && s.picked.slice().sort().join(',')===want;
  } else if(fmt==='r'||fmt==='x'){
    const opts = fmt==='r'? ruleOptions(it) : conceptOptions(it);
    ok = !skipped && s.sel!==null && opts[s.sel].ok;
  } else if(fmt==='p'){
    const v=DATA.verbs[it.vi];
    ok=true;
    for(let i=0;i<6;i++){
      const el=card.querySelector('#pf'+i);
      const good=checkWord(el.value, [v.forms[i]].concat(v.alt[i]||[]));
      el.classList.add(good?'ok':'no');
      el.disabled=true;
      if(!good){ ok=false; if(!el.value.trim()) el.value=''; }
    }
    if(skipped) ok=false;
  }
  s.answered=true; s.done++; if(ok) s.right++;
  grade(it, ok);
  s.log.push({it, ok, given});
  if(s.exam){ next(); return; }
  showFeedback(it, ok, given, skipped);
}

function showFeedback(it, ok, given, skipped){
  const card=$('#qcard'), s=session;
  const v=DATA.verbs[it.vi], fmt=s.fmt;
  let html='<div class="fb"><div class="verdict '+(ok?'ok':'no')+'">'+(ok?'Correct':(skipped?'Skipped':'Not right'))+'</div>';

  if(fmt==='c'||fmt==='g'||fmt==='f'||(fmt==='x'&&DATA.concepts[it.ci].kind==='type')){
    const el=$('#ans'); el.classList.add(ok?'ok':'no'); el.disabled=true;
    const c0 = fmt==='x' ? DATA.concepts[it.ci] : null;
    const want = c0 ? (c0.disp || c0.opts[0]) : v.forms[it.p];
    html+='<div class="answer">'+esc(want)+'</div>';
    if(ok && fmt!=='x' && isAlt(it,given))
      html+='<div class="diag">Accepted, but <b>'+esc(v.forms[it.p])+'</b> is the form to use in the exam.</div>';
    if(!ok && !skipped) html+='<div class="diag">'+esc(fmt==='x'?'Compare your wording with the answer above.':diagnose(it,given))+'</div>';
    if(fmt==='x') html+='<div class="rule">'+esc(DATA.concepts[it.ci].why)+'</div>';
  }
  if(fmt==='w'){
    card.querySelectorAll('.pbtn').forEach(b=>{
      const i=+b.dataset.p, should=it.set.indexOf(i)>=0, picked=s.picked.indexOf(i)>=0;
      b.classList.remove('sel');
      if(should) b.classList.add('right');
      else if(picked) b.classList.add('wrong');
    });
    html+='<div class="answer">'+esc(it.form)+' = '+it.set.map(i=>PERSONS[i]).join(' · ')+'</div>';
  }
  if(fmt==='r'||(fmt==='x'&&DATA.concepts[it.ci].kind==='mc')){
    const opts = fmt==='r'? ruleOptions(it) : conceptOptions(it);
    card.querySelectorAll('.opt').forEach((b,i)=>{
      b.classList.remove('sel');
      if(opts[i].ok) b.classList.add('right');
      else if(s.sel===i) b.classList.add('wrong');
    });
    if(fmt==='x') html+='<div class="rule">'+esc(DATA.concepts[it.ci].why)+'</div>';
  }
  if(fmt==='p'){
    html+='<div class="answer" style="font-size:16px">'+v.forms.map((f,i)=>esc(f)).join(' · ')+'</div>';
  }
  if(it.vi!==undefined && it.p!==undefined)
    html+='<div class="rule"><b>Why:</b> '+esc(v.why[it.p])+'</div>';
  else if(it.vi!==undefined)
    html+='<div class="rule"><b>Rule:</b> '+esc(GROUP[v.grp].name+' — '+GROUP[v.grp].rule)+'</div>';

  const stt=P.st[it.id];
  html+='<div class="tagline">Box '+stt.b+' of 6 · next review '+dueLabel(stt.due)+
        (stt.n>1? ' · '+stt.c+'/'+stt.n+' correct so far':'')+'</div>';
  html+='</div>';
  $('#fb').innerHTML=html;
  const st=$('#skip');
  const willRequeue = !ok;
  st.textContent = (!willRequeue && s.i+1>=s.q.length) ? 'Finish' : 'Next';
  st.className='btn';
  $('#check').disabled=true; $('#check').className='btn ghost';
  st.focus();
  // reveal the paradigm on the ladder
  const lad=document.querySelector('.ladder');
  if(lad && it.vi!==undefined) lad.outerHTML=ladderHTML(it,true);
}
function dueLabel(t){
  const d=t-Date.now();
  if(d<9e4) return 'in a minute';
  if(d<36e5) return 'in '+Math.round(d/6e4)+' min';
  if(d<864e5) return 'in '+Math.round(d/36e5)+' h';
  return 'in '+Math.round(d/864e5)+' days';
}
function next(){
  const s=session;
  const last=s.log[s.log.length-1];
  if(last && !last.ok && !s.exam) s.q.push(last.it);   // re-queue misses inside the session
  s.i++;
  document.onkeydown=null;
  render();
}

function ladderHTML(it, reveal){
  if(it.vi===undefined){
    return '<aside class="ladder"><span class="eyebrow">Reminder</span>'+
      '<div class="rung"><span class="p">endings</span><span class="v">-e -st -t</span></div>'+
      '<div class="rung"><span class="p"></span><span class="v">-en -t -en</span></div>'+
      '<div class="foot">One present tense only. Use gerade / jetzt / im Moment for “right now”.</div></aside>';
  }
  const v=DATA.verbs[it.vi];
  const rows=PERSONS.map((p,i)=>{
    const on = it.p===i;
    const diff = reveal && (i===1||i===2) && v.forms[i]!==(v.stem+(i===1?'st':'t'));
    const val = reveal ? v.forms[i] : (on?'?':'·');
    return '<div class="rung'+(on?' on':'')+(reveal?' rev':'')+(diff?' diff':'')+'">'+
      '<span class="p">'+p+'</span><span class="v">'+esc(val)+'</span></div>';
  }).join('');
  return '<aside class="ladder"><span class="eyebrow">'+esc(v.inf)+'</span>'+rows+
    '<div class="foot">'+esc(GROUP[v.grp].name)+'</div></aside>';
}

/* ============================================================ result === */
function renderResult(v){
  const s=session, pct=s.done?Math.round(100*s.right/s.done):0;
  if(s.exam && pct>(P.best||0)){ P.best=pct; save(); }
  const wrong=s.log.filter(x=>!x.ok);
  v.innerHTML=
  '<div class="card">'+
    '<span class="eyebrow">'+esc(s.title)+' complete</span>'+
    '<div class="stats" style="margin-top:14px">'+
      stat(pct+'%','accuracy')+stat(s.right,'correct')+stat(s.done-s.right,'missed')+stat(masteryPct()+'%','overall mastery')+
    '</div>'+
    (wrong.length? '<h2>Worth another look</h2><div style="margin-bottom:6px">'+
      wrong.map(x=>{
        const vb=DATA.verbs[x.it.vi];
        if(!vb) return '<div class="grow" style="grid-template-columns:1fr"><div class="nm">'+esc(DATA.concepts[x.it.ci].q)+'</div></div>';
        const want = x.it.p!==undefined? vb.forms[x.it.p] : vb.forms.join(' · ');
        return '<div class="grow" style="grid-template-columns:150px 1fr">'+
          '<div class="nm"><span class="mono">'+esc(vb.inf)+'</span><span class="sub">'+esc(x.it.p!==undefined?PERSONS[x.it.p]:'paradigm')+'</span></div>'+
          '<div class="nm"><span class="mono" style="color:var(--gold)">'+esc(want)+'</span>'+
          (x.it.p!==undefined?'<span class="sub">'+esc(vb.why[x.it.p])+'</span>':'')+'</div></div>';
      }).join('')+'</div>' : '<p class="muted">Clean run.</p>')+
    '<div class="actions">'+
      (wrong.length?'<button class="btn" id="again">Redo the missed items</button>':'')+
      '<button class="btn '+(wrong.length?'ghost':'')+'" id="more">New session</button>'+
      '<button class="btn ghost" id="done">Back</button>'+
    '</div>'+
  '</div>';
  if($('#again')) $('#again').onclick=()=>startSession(wrong.map(x=>x.it),'Repair round');
  $('#more').onclick=()=>startSession(buildQueue(P.settings.len),'Mixed session');
  $('#done').onclick=()=>{ session=null; tab='drill'; render(); };
}

/* ============================================================ progress = */
function renderProg(v){
  const scope=scopeItems();
  const box=n=>scope.filter(i=>P.st[i.id]&&P.st[i.id].b===n).length;
  const seen=scope.filter(i=>P.st[i.id]).length;
  const mastered=scope.filter(i=>P.st[i.id]&&P.st[i.id].b>=MASTER).length;
  let tot=0,cor=0; Object.keys(P.hist).forEach(d=>{tot+=P.hist[d][0];cor+=P.hist[d][1];});
  const today=P.hist[dayKey(Date.now())]||[0,0];

  const groupRows = DATA.groups.concat([{key:'concept',name:'Concepts',rule:'§0 and rule logic'}]).map(g=>{
    const its=scope.filter(i=>i.grp===g.key);
    const m=its.filter(i=>P.st[i.id]&&P.st[i.id].b>=MASTER).length;
    const l=its.filter(i=>P.st[i.id]&&P.st[i.id].b<MASTER).length;
    const n=its.length||1;
    return '<div class="grow"><div class="nm"><span>'+esc(g.name)+'</span><span class="sub">'+esc(g.rule)+'</span></div>'+
      '<div class="mb"><i class="m" style="width:'+(100*m/n)+'%"></i><i class="l" style="width:'+(100*l/n)+'%"></i></div>'+
      '<div class="pct">'+Math.round(100*m/n)+'%</div></div>';
  }).join('');

  const weak = scope.filter(i=>P.st[i.id]&&P.st[i.id].l>0)
    .sort((a,b)=>(P.st[b.id].l-P.st[a.id].l)||(P.st[a.id].b-P.st[b.id].b)).slice(0,18);

  const days=[]; for(let k=13;k>=0;k--){ const d=dayKey(Date.now()-k*864e5); days.push([d,(P.hist[d]||[0,0])[0]]); }
  const mx=Math.max(1,...days.map(d=>d[1]));

  v.innerHTML=
  '<div class="stats">'+
    stat(masteryPct()+'%','mastered')+stat(seen,'items met')+stat(scope.length,'items in scope')+
    stat(tot?Math.round(100*cor/tot)+'%':'—','lifetime accuracy')+stat(today[0],'answered today')+stat(P.streak||0,'day streak')+
  '</div>'+

  '<div class="card" style="margin-bottom:14px"><h2>Mastery by rule</h2>'+groupRows+
    '<div class="legend"><span><i style="background:var(--gold)"></i>mastered (box '+MASTER+'+)</span>'+
    '<span><i style="background:var(--cool)"></i>in progress</span><span><i style="background:var(--line)"></i>not met yet</span></div>'+
  '</div>'+

  '<div class="card" style="margin-bottom:14px"><h2>Review pipeline</h2>'+
    '<div class="stats" style="margin:0">'+[0,1,2,3,4,5,6].map(n=>stat(box(n),'box '+n)).join('')+'</div>'+
    '<p class="hint" style="margin-top:10px">Box 0 → 3 min, 1 → 25 min, 2 → 1 day, 3 → 3 days, 4 → 8 days, 5 → 21 days. A wrong answer drops an item two boxes.</p>'+
  '</div>'+

  '<div class="card" style="margin-bottom:14px"><h2>Last 14 days</h2>'+
    '<div style="display:flex;gap:4px;align-items:flex-end;height:56px">'+
      days.map(d=>'<div title="'+d[0]+': '+d[1]+'" style="flex:1;background:'+(d[1]?'var(--cool)':'var(--line)')+
        ';height:'+Math.max(3,Math.round(52*d[1]/mx))+'px;border-radius:2px"></div>').join('')+
    '</div>'+
  '</div>'+

  (weak.length? '<div class="card" style="margin-bottom:14px"><h2>Most-missed items</h2>'+
    '<div class="weak">'+weak.map(i=>{
      const vb=DATA.verbs[i.vi];
      const lbl = vb ? (vb.inf+(i.p!==undefined?' · '+PERSONS[i.p]:'')) : 'concept';
      return '<span>'+esc(lbl)+' <b style="color:var(--no)">'+P.st[i.id].l+'</b></span>';
    }).join('')+'</div>'+
    '<div class="actions"><button class="btn" id="drillWeak">Drill these now</button></div></div>' : '')+

  '<div class="card" style="margin-bottom:14px"><h2>Scope</h2>'+
    '<p class="hint" style="margin:0 0 8px">Mastery is measured over whatever is switched on here.</p>'+
    '<div class="eyebrow" style="margin-top:12px">Exercise types</div>'+
    '<div class="togs">'+TYPES.map(t=>'<button class="tog'+(P.settings.types[t.k]?' on':'')+'" data-ty="'+t.k+'">'+t.name+'</button>').join('')+'</div>'+
    '<div class="eyebrow" style="margin-top:16px">Verbs</div>'+
    '<div class="togs"><button class="tog'+(P.settings.coreOnly?' on':'')+'" id="togCore">'+
      (P.settings.coreOnly?'Core 81 verbs':'All 133 verbs')+'</button></div>'+
    '<p class="hint" style="margin:8px 0 0">The core set already covers every rule and every irregular verb. '+
    'Switch it off to add 52 more verbs of the same patterns.</p>'+
    '<div class="eyebrow" style="margin-top:16px">Rules</div>'+
    '<div class="togs">'+DATA.groups.map(g=>'<button class="tog'+(P.settings.groups[g.key]?' on':'')+'" data-gr="'+g.key+'">'+esc(g.name)+'</button>').join('')+
      '<button class="tog'+(P.settings.groups.concept?' on':'')+'" data-gr="concept">Concepts</button></div>'+
  '</div>'+

  '<div class="card"><h2>Your data</h2>'+
    '<p class="hint" style="margin:0 0 10px">Progress '+Store.label+'. Export a backup before clearing your browser.</p>'+
    '<div class="actions"><button class="btn ghost" id="exp">Export progress</button>'+
    '<button class="btn ghost" id="imp">Import progress</button>'+
    '<button class="btn ghost" id="reset" style="border-color:var(--no);color:var(--no)">Reset everything</button></div>'+
    '<input type="file" id="file" accept="application/json" hidden>'+
  '</div>';

  v.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ty;
    if(P.settings.types[k] && TYPES.filter(t=>P.settings.types[t.k]).length===1){ toast('Keep at least one type on.'); return; }
    P.settings.types[k]=!P.settings.types[k]; save(); render();
  });
  v.querySelectorAll('[data-gr]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.gr;
    const on=Object.keys(P.settings.groups).filter(x=>P.settings.groups[x]);
    if(P.settings.groups[k] && on.length===1){ toast('Keep at least one rule on.'); return; }
    P.settings.groups[k]=!P.settings.groups[k]; save(); render();
  });
  $('#togCore').onclick=()=>{ P.settings.coreOnly=!P.settings.coreOnly; save(); render(); };
  if($('#drillWeak')) $('#drillWeak').onclick=()=>startSession(shuffle(weak,Date.now()),'Weak spots');
  $('#exp').onclick=()=>{
    const blob=new Blob([JSON.stringify(P)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='praesens-progress-'+dayKey(Date.now())+'.json'; a.click();
    URL.revokeObjectURL(a.href);
  };
  $('#imp').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const d=JSON.parse(r.result);
        if(!d.st) throw 0;
        P.st=d.st; P.hist=d.hist||{}; P.streak=d.streak||0; P.lastDay=d.lastDay||null; P.best=d.best||0;
        if(d.settings) P.settings=Object.assign(P.settings,d.settings);
        save(); render(); toast('Progress restored.');
      }catch(err){ toast('That file does not look like a progress export.'); } };
    r.readAsText(f);
  };
  $('#reset').onclick=()=>{
    if(!confirm('Delete all progress? This cannot be undone.')) return;
    P.st={}; P.hist={}; P.streak=0; P.lastDay=null; P.best=0; save(); render(); toast('Progress cleared.');
  };
}

/* ============================================================ notes ==== */
function renderNotes(v){
  v.innerHTML='<div class="card notes">'+NOTES_HTML+'</div>';
}
const NOTES_HTML = `
<h3>§0 · There is no continuous form</h3>
<p>One present tense covers both English presents. <code>Ich esse</code> = “I eat” <i>and</i> “I am eating”.
To stress “right now”, add an adverb: <b>gerade</b>, <b>jetzt</b>, <b>im Moment</b>, <b>zurzeit</b>.</p>
<p class="mono">Ich esse <b>jetzt</b>. · Sie arbeitet <b>gerade</b>. · Wir wohnen <b>zurzeit</b> in Berlin.</p>

<h3>§1 · Regular endings</h3>
<p>Drop <code>-en</code> from the infinitive, add the ending. <b>machen</b> → stem <b>mach-</b>.</p>
<table><tr><th>Person</th><th>Ending</th><th>Form</th></tr>
<tr><td>ich</td><td>-e</td><td>mach<b>e</b></td></tr>
<tr><td>du</td><td>-st</td><td>mach<b>st</b></td></tr>
<tr><td>er/sie/es</td><td>-t</td><td>mach<b>t</b></td></tr>
<tr><td>wir</td><td>-en</td><td>mach<b>en</b></td></tr>
<tr><td>ihr</td><td>-t</td><td>mach<b>t</b></td></tr>
<tr><td>sie/Sie</td><td>-en</td><td>mach<b>en</b></td></tr></table>

<h3>§2.1 · Linking -e-</h3>
<p>Stem ends in <code>-d</code>, <code>-t</code>, or a consonant (but <b>not</b> l, r or h) + <code>-m</code>/<code>-n</code>
→ insert <code>-e-</code>, otherwise it is unpronounceable.</p>
<table><tr><th></th><th>arbeiten</th><th>finden</th><th>rechnen</th></tr>
<tr><td>du</td><td>arbeit<b>e</b>st</td><td>find<b>e</b>st</td><td>rechn<b>e</b>st</td></tr>
<tr><td>er/sie/es</td><td>arbeit<b>e</b>t</td><td>find<b>e</b>t</td><td>rechn<b>e</b>t</td></tr>
<tr><td>ihr</td><td>arbeit<b>e</b>t</td><td>find<b>e</b>t</td><td>rechn<b>e</b>t</td></tr></table>
<p>Applies to regular stems only. Where a strong verb changes its vowel (du/er only) it takes
<code>-st</code>/<code>-t</code> directly: du h<b>ä</b>ltst, du br<b>ä</b>tst, du l<b>ä</b>dst.</p>
<p>Excluded: lernen → du lernst · wohnen → du wohnst · filmen → du filmst · kommen → du kommst.</p>

<h3>§2.2 · Sibilant stems</h3>
<p>Stem in <code>-s</code>, <code>-ß</code>, <code>-z</code>, <code>-x</code>, <code>-tz</code>
→ the du-ending collapses to <code>-t</code>, so <b>du = er/sie/es</b>.</p>
<table><tr><th>reisen</th><th>heißen</th><th>tanzen</th><th>sitzen</th></tr>
<tr><td>du reis<b>t</b></td><td>du heiß<b>t</b></td><td>du tanz<b>t</b></td><td>du sitz<b>t</b></td></tr></table>

<h3>§2.3 · Infinitives in -eln / -ern</h3>
<p>The stem keeps its <code>-e-</code> everywhere except the ich-form, and wir/sie take just
<code>-n</code> (the infinitive already ends in -n).</p>
<ul><li><code>-eln</code> → <b>drop</b> the -e-: sammeln → ich samm<b>le</b></li>
<li><code>-ern</code> → <b>keep</b> the -e-: ändern → ich änd<b>ere</b></li></ul>
<table><tr><th></th><th>sammeln</th><th>ändern</th></tr>
<tr><td>ich</td><td>sammle</td><td>ändere</td></tr>
<tr><td>du</td><td>sammelst</td><td>änderst</td></tr>
<tr><td>er/sie/es</td><td>sammelt</td><td>ändert</td></tr>
<tr><td>wir</td><td>sammeln</td><td>ändern</td></tr>
<tr><td>ihr</td><td>sammelt</td><td>ändert</td></tr>
<tr><td>sie/Sie</td><td>sammeln</td><td>ändern</td></tr></table>
<p>Same pattern: lächeln, klingeln, wechseln, handeln (-eln); wandern, feiern, verbessern, erinnern (-ern).
The imperative follows the ich-form: <i>Sammle!</i> but <i>Ändere!</i></p>

<h3>§3 · Stem-changing verbs</h3>
<p>A large group of strong verbs changes its stem vowel — but <b>only in du and er/sie/es</b>. Everything else is regular.</p>
<table><tr><th>Change</th><th>Infinitive</th><th>du</th><th>er/sie/es</th></tr>
<tr><td>a → ä</td><td>fahren, schlafen, tragen, fallen, halten, waschen, laden, braten, raten…</td><td>fährst, schläfst, trägst, fällst, hältst, wäschst, lädst, brätst, rätst</td><td>fährt, schläft, trägt, fällt, hält, wäscht, lädt, brät, rät</td></tr>
<tr><td>au → äu</td><td>laufen</td><td>läufst</td><td>läuft</td></tr>
<tr><td>e → i</td><td>sprechen, helfen, essen, geben, treffen, werfen, brechen, messen, gelten…</td><td>sprichst, hilfst, isst, gibst, triffst, wirfst, brichst, misst, giltst</td><td>spricht, hilft, isst, gibt, trifft, wirft, bricht, misst, gilt</td></tr>
<tr><td>e → ie</td><td>sehen, lesen, empfehlen, stehlen</td><td>siehst, liest, empfiehlst, stiehlst</td><td>sieht, liest, empfiehlt, stiehlt</td></tr></table>
<p>Traps that do <b>not</b> change: kaufen, brauchen, glauben, fragen, sagen, machen, lachen, malen,
gehen, stehen, denken, kennen, leben, legen, rufen.</p>

<h3>§4 · Irregular within the irregular</h3>
<ul>
<li><b>nehmen</b> → du <b>nimmst</b>, er <b>nimmt</b></li>
<li><b>treten</b> → du <b>trittst</b>, er <b>tritt</b> — but ihr <b>tretet</b></li>
<li><b>halten</b> → er <b>hält</b>, no extra -e- despite the -t stem</li>
<li><b>wissen</b> → ich <b>weiß</b>, du <b>weißt</b>, er <b>weiß</b>, wir wissen, ihr wisst, sie wissen</li>
</ul>

<h3>§5 · sein, haben, werden</h3>
<table><tr><th></th><th>sein</th><th>haben</th><th>werden</th></tr>
<tr><td>ich</td><td>bin</td><td>habe</td><td>werde</td></tr>
<tr><td>du</td><td>bist</td><td>hast</td><td>wirst</td></tr>
<tr><td>er/sie/es</td><td>ist</td><td>hat</td><td>wird</td></tr>
<tr><td>wir</td><td>sind</td><td>haben</td><td>werden</td></tr>
<tr><td>ihr</td><td>seid</td><td>habt</td><td>werdet</td></tr>
<tr><td>sie/Sie</td><td>sind</td><td>haben</td><td>werden</td></tr></table>
`;

/* ============================================================ boot ===== */
(async function(){
  ITEMS=buildItems(); ITEMS.forEach(i=>BYID[i.id]=i);
  await load();
  render();
})();
</script>
