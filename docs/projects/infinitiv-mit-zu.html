statt?"},{"id":"conn009","t":"umzu","k":"cloze","q":"Wir gehen ins Fitnessstudio, ___ fit zu bleiben.","a":"um","why":"<b>um … zu</b> = purpose (in order to). The connector opens the group, zu + Infinitiv closes it.","tag":"um, ohne or (an)statt?"},{"id":"conn010","t":"umzu","k":"cloze","q":"Er redet, ___ nachzudenken.","a":"ohne","why":"<b>ohne … zu</b> = without doing something. The connector opens the group, zu + Infinitiv closes it.","tag":"um, ohne or (an)statt?"},{"id":"conn011","t":"umzu","k":"cloze","q":"Sie kauft Blumen, ___ ihrer Mutter eine Freude zu machen.","a":"um","why":"<b>um … zu</b> = purpose (in order to). The connector opens the group, zu + Infinitiv closes it.","tag":"um, ohne or (an)statt?"},{"id":"conn012","t":"umzu","k":"cloze","q":"___ mit dem Auto zu fahren, nehme ich das Fahrrad. (instead of)","a":"Statt","why":"<b>(an)statt … zu</b> = instead of doing something. statt and anstatt are interchangeable.","tag":"um, ohne or (an)statt?","alt":["Anstatt"]},{"id":"conn013","t":"umzu","k":"cloze","q":"Ich brauche eine Brille, ___ besser zu sehen.","a":"um","why":"<b>um … zu</b> = purpose (in order to). The connector opens the group, zu + Infinitiv closes it.","tag":"um, ohne or (an)statt?"},{"id":"conn014","t":"umzu","k":"cloze","q":"Er hat den Text übersetzt, ___ ein Wörterbuch zu benutzen.","a":"ohne","why":"<b>ohne … zu</b> = without doing something. The connector opens the group, zu + Infinitiv closes it.","tag":"um, ohne or (an)statt?"},{"id":"conn015","t":"umzu","k":"cloze","q":"Sie hilft mir, ___ etwas dafür zu verlangen.","a":"ohne","why":"<b>ohne … zu</b> = without doing something. The connector opens the group, zu + Infinitiv closes it.","tag":"um, ohne or (an)statt?"},{"id":"conn016","t":"umzu","k":"cloze","q":"Ich rufe an, ___ einen Termin zu vereinbaren.","a":"um","why":"<b>um … zu</b> = purpose (in order to). The connector opens the group, zu + Infinitiv closes it.","tag":"um, ohne or (an)statt?"},{"id":"conn017","t":"umzu","k":"cloze","q":"Er bleibt zu Hause, ___ mit uns ins Kino zu gehen. (instead of)","a":"statt","why":"<b>(an)statt … zu</b> = instead of doing something. statt and anstatt are interchangeable.","tag":"um, ohne or (an)statt?","alt":["anstatt"]},{"id":"conn018","t":"umzu","k":"cloze","q":"Sie geht joggen, ___ den Kopf frei zu bekommen.","a":"um","why":"<b>um … zu</b> = purpose (in order to). The connector opens the group, zu + Infinitiv closes it.","tag":"um, ohne or (an)statt?"},{"id":"conn019","t":"umzu","k":"cloze","q":"Er hat das Auto gekauft, ___ es vorher zu testen.","a":"ohne","why":"<b>ohne … zu</b> = without doing something. The connector opens the group, zu + Infinitiv closes it.","tag":"um, ohne or (an)statt?"},{"id":"conn020","t":"umzu","k":"cloze","q":"Wir fahren mit dem Zug, ___ Zeit zu sparen.","a":"um","why":"<b>um … zu</b> = purpose (in order to). The connector opens the group, zu + Infinitiv closes it.","tag":"um, ohne or (an)statt?"},{"id":"conn021","t":"umzu","k":"cloze","q":"___ zu jammern, solltest du etwas ändern. (instead of)","a":"Statt","why":"<b>(an)statt … zu</b> = instead of doing something. statt and anstatt are interchangeable.","tag":"um, ohne or (an)statt?","alt":["Anstatt"]},{"id":"umd001","t":"umzu","k":"cloze","q":"Ich lerne Deutsch, ___ in Deutschland zu arbeiten.","a":"um","why":"No subject and no conjugated verb in the group, only <b>zu + Infinitiv</b> at the end → <b>um … zu</b>. The subject is the same as in the main clause.","tag":"um or damit?"},{"id":"umd002","t":"umzu","k":"cloze","q":"Ich lerne Deutsch, ___ ich in Deutschland arbeiten kann.","a":"damit","why":"The clause has its own subject and a conjugated verb at the end → it is a <b>damit</b> clause. um … zu is impossible here because the subjects differ.","tag":"um or damit?"},{"id":"umd003","t":"umzu","k":"cloze","q":"Sie schickt mir das Foto, ___ ich es sehen kann.","a":"damit","why":"The clause has its own subject and a conjugated verb at the end → it is a <b>damit</b> clause. um … zu is impossible here because the subjects differ.","tag":"um or damit?"},{"id":"umd004","t":"umzu","k":"cloze","q":"Er kauft ein Ticket, ___ nach Wien zu fahren.","a":"um","why":"No subject and no conjugated verb in the group, only <b>zu + Infinitiv</b> at the end → <b>um … zu</b>. The subject is the same as in the main clause.","tag":"um or damit?"},{"id":"umd005","t":"umzu","k":"cloze","q":"Wir schreiben eine Liste, ___ wir nichts vergessen.","a":"damit","why":"The clause has its own subject and a conjugated verb at the end → it is a <b>damit</b> clause. um … zu is impossible here because the subjects differ.","tag":"um or damit?"},{"id":"umd006","t":"umzu","k":"cloze","q":"Ich mache Sport, ___ gesund zu bleiben.","a":"um","why":"No subject and no conjugated verb in the group, only <b>zu + Infinitiv</b> at the end → <b>um … zu</b>. The subject is the same as in the main clause.","tag":"um or damit?"},{"id":"umd007","t":"umzu","k":"cloze","q":"Er spricht langsam, ___ die Kinder ihn verstehen.","a":"damit","why":"The clause has its own subject and a conjugated verb at the end → it is a <b>damit</b> clause. um … zu is impossible here because the subjects differ.","tag":"um or damit?"},{"id":"umd008","t":"umzu","k":"cloze","q":"Sie steht früh auf, ___ den Zug nicht zu verpassen.","a":"um","why":"No subject and no conjugated verb in the group, only <b>zu + Infinitiv</b> at the end → <b>um … zu</b>. The subject is the same as in the main clause.","tag":"um or damit?"},{"id":"umd009","t":"umzu","k":"cloze","q":"Ich gebe dir mein Handy, ___ du deine Mutter anrufen kannst.","a":"damit","why":"The clause has its own subject and a conjugated verb at the end → it is a <b>damit</b> clause. um … zu is impossible here because the subjects differ.","tag":"um or damit?"},{"id":"umd010","t":"umzu","k":"cloze","q":"Er geht in die Bibliothek, ___ in Ruhe zu lernen.","a":"um","why":"No subject and no conjugated verb in the group, only <b>zu + Infinitiv</b> at the end → <b>um … zu</b>. The subject is the same as in the main clause.","tag":"um or damit?"},{"id":"umd011","t":"umzu","k":"cloze","q":"Sie macht das Fenster zu, ___ es nicht kalt wird.","a":"damit","why":"The clause has its own subject and a conjugated verb at the end → it is a <b>damit</b> clause. um … zu is impossible here because the subjects differ.","tag":"um or damit?"},{"id":"umd012","t":"umzu","k":"cloze","q":"Ich rufe dich an, ___ dir etwas zu erzählen.","a":"um","why":"No subject and no conjugated verb in the group, only <b>zu + Infinitiv</b> at the end → <b>um … zu</b>. The subject is the same as in the main clause.","tag":"um or damit?"},{"id":"comb001","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Ich spare Geld. Ich will ein Auto kaufen.</span>","c":["Ich spare Geld, um ein Auto zu kaufen.","Ich spare Geld, damit ein Auto zu kaufen.","Ich spare Geld, um ich ein Auto kaufe."],"a":0,"why":"Same subject (ich / ich) → <b>um … zu</b>. damit needs a full clause with its own verb; um needs zu + Infinitiv and no subject.","tag":"um … zu or damit?"},{"id":"comb002","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Sie lernt viel. Sie will die Prüfung bestehen.</span>","c":["Sie lernt viel, damit die Prüfung zu bestehen.","Sie lernt viel, um die Prüfung zu bestehen.","Sie lernt viel, um sie die Prüfung besteht."],"a":1,"why":"Same subject (sie / sie) → <b>um … zu</b> with zu + Infinitiv at the end.","tag":"um … zu or damit?"},{"id":"comb003","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Ich gebe dir Geld. Du kaufst dir ein Eis.</span>","c":["Ich gebe dir Geld, um dir ein Eis zu kaufen.","Ich gebe dir Geld, damit du dir ein Eis kaufst.","Ich gebe dir Geld, um du dir ein Eis kaufst."],"a":1,"why":"Different subjects (ich / du) → only <b>damit</b> works. <i>um dir ein Eis zu kaufen</i> is grammatical but would mean that I buy it for you; <i>um du …</i> is impossible.","tag":"um … zu or damit?"},{"id":"comb004","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Ich erkläre es langsam. Du sollst es verstehen.</span>","c":["Ich erkläre es langsam, damit du es verstehst.","Ich erkläre es langsam, um du es zu verstehen.","Ich erkläre es langsam, um es zu verstehen."],"a":0,"why":"Different subjects (ich / du) → <b>damit</b>. <i>um es zu verstehen</i> would mean that I want to understand it.","tag":"um … zu or damit?"},{"id":"comb005","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Sie schließt das Fenster. Das Baby soll nicht frieren.</span>","c":["Sie schließt das Fenster, um das Baby nicht zu frieren.","Sie schließt das Fenster, damit das Baby nicht zu frieren.","Sie schließt das Fenster, damit das Baby nicht friert."],"a":2,"why":"Different subjects (sie / das Baby) → <b>damit</b> + conjugated verb at the end (friert). <i>um das Baby nicht zu frieren</i> is impossible: frieren takes no object, and the um-group would make <i>sie</i> the one freezing.","tag":"um … zu or damit?"},{"id":"comb006","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Ich rufe dich an. Ich will dir etwas erzählen.</span>","c":["Ich rufe dich an, um dir etwas zu erzählen.","Ich rufe dich an, damit dir etwas zu erzählen.","Ich rufe dich an, um ich dir etwas erzähle."],"a":0,"why":"Same subject (ich / ich) → <b>um … zu</b>.","tag":"um … zu or damit?"},{"id":"comb007","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Mama liest vor. Die Kinder sollen einschlafen.</span>","c":["Mama liest vor, um die Kinder einzuschlafen.","Mama liest vor, damit die Kinder einschlafen.","Mama liest vor, um einzuschlafen."],"a":1,"why":"Different subjects (Mama / die Kinder) → <b>damit</b>. <i>um einzuschlafen</i> would mean Mama falls asleep, and <i>um die Kinder einzuschlafen</i> is impossible: einschlafen takes no object.","tag":"um … zu or damit?"},{"id":"comb008","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Wir fahren früh los. Wir wollen den Stau vermeiden.</span>","c":["Wir fahren früh los, damit den Stau zu vermeiden.","Wir fahren früh los, um den Stau zu vermeiden.","Wir fahren früh los, um wir den Stau vermeiden."],"a":1,"why":"Same subject (wir / wir) → <b>um … zu</b>.","tag":"um … zu or damit?"},{"id":"comb009","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Er spricht laut. Alle sollen ihn hören.</span>","c":["Er spricht laut, um alle ihn zu hören.","Er spricht laut, damit alle ihn hören.","Er spricht laut, um ihn zu hören."],"a":1,"why":"Different subjects (er / alle) → <b>damit</b>. <i>um alle ihn zu hören</i> smuggles a subject into the um-group, which is impossible; <i>um ihn zu hören</i> would mean he hears himself.","tag":"um … zu or damit?"},{"id":"comb010","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Ich kaufe Blumen. Meine Freundin soll sich freuen.</span>","c":["Ich kaufe Blumen, um meine Freundin sich zu freuen.","Ich kaufe Blumen, um mich zu freuen.","Ich kaufe Blumen, damit meine Freundin sich freut."],"a":2,"why":"Different subjects (ich / meine Freundin) → <b>damit</b>. <i>um mich zu freuen</i> changes the meaning (I would be the one pleased), and <i>um meine Freundin sich zu freuen</i> smuggles a subject into the um-group, which is impossible.","tag":"um … zu or damit?"},{"id":"comb011","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Ich gehe zum Arzt. Ich will mich untersuchen lassen.</span>","c":["Ich gehe zum Arzt, um mich untersuchen zu lassen.","Ich gehe zum Arzt, um mich zu untersuchen lassen.","Ich gehe zum Arzt, damit mich untersuchen zu lassen."],"a":0,"why":"Same subject → <b>um … zu</b>. With two infinitives, zu goes before the <b>last</b> one: untersuchen <b>zu lassen</b>.","tag":"um … zu or damit?"},{"id":"comb012","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Sie macht das Licht aus. Sie will Strom sparen.</span>","c":["Sie macht das Licht aus, damit Strom zu sparen.","Sie macht das Licht aus, um Strom zu sparen.","Sie macht das Licht aus, um sie Strom spart."],"a":1,"why":"Same subject (sie / sie) → <b>um … zu</b>.","tag":"um … zu or damit?"},{"id":"comb013","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Ich schreibe dir die Adresse auf. Du sollst sie nicht vergessen.</span>","c":["Ich schreibe dir die Adresse auf, um sie nicht zu vergessen.","Ich schreibe dir die Adresse auf, damit du sie nicht vergisst.","Ich schreibe dir die Adresse auf, damit du sie nicht zu vergessen."],"a":1,"why":"Different subjects (ich / du) → <b>damit</b>. <i>um sie nicht zu vergessen</i> would mean that I forget.","tag":"um … zu or damit?"},{"id":"comb014","t":"umzu","k":"mc","q":"Combine into one sentence:<br><span class=\"pair\">Er lernt Deutsch. Er will in Deutschland arbeiten.</span>","c":["Er lernt Deutsch, damit er in Deutschland arbeiten.","Er lernt Deutsch, um in Deutschland arbeiten.","Er lernt Deutsch, um in Deutschland zu arbeiten."],"a":2,"why":"Same subject → <b>um … zu</b>; the group must end in zu + Infinitiv (zu arbeiten). <i>damit er in Deutschland arbeiten kann</i> would also be correct — but <i>damit er … arbeiten</i> is impossible without a conjugated verb.","tag":"um … zu or damit?"},{"id":"order001","t":"order","k":"order","q":"Build the sentence.","tok":["ich","versuche","jeden Tag","Deutsch","zu lernen"],"a":"Ich versuche, jeden Tag Deutsch zu lernen.","why":"Main clause first, then the infinitive group; <b>zu lernen</b> is the very last thing.","tag":"Word order","alt":["Ich versuche, Deutsch jeden Tag zu lernen.","Jeden Tag versuche ich, Deutsch zu lernen.","Deutsch versuche ich jeden Tag zu lernen."]},{"id":"order002","t":"order","k":"order","q":"Build the sentence.","tok":["es","macht","Spaß","mit dir","zu reden"],"a":"Es macht Spaß, mit dir zu reden.","why":"Es + Spaß machen announces the group; <b>zu reden</b> closes it.","tag":"Word order"},{"id":"order003","t":"order","k":"order","q":"Build the sentence.","tok":["wir","haben","vor","im Sommer","nach Wien","zu fahren"],"a":"Wir haben vor, im Sommer nach Wien zu fahren.","why":"vorhaben is separable: <i>haben … vor</i>. Time before place inside the group, <b>zu fahren</b> last.","tag":"Word order","alt":["Im Sommer haben wir vor, nach Wien zu fahren.","Wir haben im Sommer vor, nach Wien zu fahren.","Wir haben vor, nach Wien im Sommer zu fahren."]},{"id":"order004","t":"order","k":"order","q":"Build the sentence.","tok":["ich","habe","keine Zeit","dich","zu besuchen"],"a":"Ich habe keine Zeit, dich zu besuchen.","why":"Noun trigger Zeit; the object <i>dich</i> belongs to the group, <b>zu besuchen</b> last.","tag":"Word order"},{"id":"order005","t":"order","k":"order","q":"Build the sentence.","tok":["ich","habe","vergessen","dich","anzurufen"],"a":"Ich habe vergessen, dich anzurufen.","why":"The Perfekt of the trigger stays in the main clause; the separable verb becomes one word: <b>anzurufen</b>.","tag":"Word order"},{"id":"order006","t":"order","k":"order","q":"Build the sentence.","tok":["sie","empfiehlt","mir","mehr","zu lesen"],"a":"Sie empfiehlt mir, mehr zu lesen.","why":"The dative person (mir) stays in the main clause; <b>zu lesen</b> closes the group.","tag":"Word order","alt":["Mir empfiehlt sie, mehr zu lesen."]},{"id":"order007","t":"order","k":"order","q":"Build the sentence.","tok":["hast","du","Lust","ins Kino","zu gehen"],"a":"Hast du Lust, ins Kino zu gehen?","why":"Yes/no question: verb first. Lust haben announces the group; <b>zu gehen</b> last.","tag":"Word order"},{"id":"order008","t":"order","k":"order","q":"Build the sentence.","tok":["es","ist","wichtig","jeden Tag","zu üben"],"a":"Es ist wichtig, jeden Tag zu üben.","why":"Es ist + Adjektiv, comma, then the group ending in <b>zu üben</b>.","tag":"Word order"},{"id":"order009","t":"order","k":"order","q":"Build the sentence.","tok":["es","ist","verboten","hier","zu rauchen"],"a":"Es ist verboten, hier zu rauchen.","why":"Es ist + Adjektiv, comma, then the group ending in <b>zu rauchen</b>.","tag":"Word order"},{"id":"order010","t":"order","k":"order","q":"Build the sentence.","tok":["ich","freue","mich","darauf","dich","zu sehen"],"a":"Ich freue mich darauf, dich zu sehen.","why":"The da-word <b>darauf</b> ends the main clause and points forward; <b>zu sehen</b> closes the group.","tag":"Word order"},{"id":"order011","t":"order","k":"order","q":"Build the sentence.","tok":["er","hat","Angst","davor","allein","zu bleiben"],"a":"Er hat Angst davor, allein zu bleiben.","why":"Angst haben vor → <b>davor</b> at the end of the main clause; <b>zu bleiben</b> last.","tag":"Word order","alt":["Er hat davor Angst, allein zu bleiben."]},{"id":"order012","t":"order","k":"order","q":"Build the sentence.","tok":["denk","daran","das Fenster","zuzumachen"],"a":"Denk daran, das Fenster zuzumachen!","why":"Imperative first, da-word, comma, then the group. zumachen is separable: <b>zuzumachen</b>.","tag":"Word order"},{"id":"order013","t":"order","k":"order","q":"Build the sentence.","tok":["hör","damit","auf","so laut","zu sein"],"a":"Hör damit auf, so laut zu sein!","why":"aufhören is separable: <i>Hör … auf</i>; the da-word <b>damit</b> sits between them.","tag":"Word order"},{"id":"order014","t":"order","k":"order","q":"Build the sentence.","tok":["er","scheint","krank","zu sein"],"a":"Er scheint krank zu sein.","why":"scheinen behaves like a modal: no comma, <b>zu sein</b> at the end.","tag":"Word order"},{"id":"order015","t":"order","k":"order","q":"Build the sentence.","tok":["du","brauchst","heute","nicht","zu kommen"],"a":"Du brauchst heute nicht zu kommen.","why":"brauchen + nicht + zu: no comma, <i>nicht</i> right before <b>zu kommen</b>.","tag":"Word order","alt":["Heute brauchst du nicht zu kommen."]},{"id":"order016","t":"order","k":"order","q":"Build the sentence.","tok":["du","brauchst","nur","anzurufen"],"a":"Du brauchst nur anzurufen.","why":"brauchen + nur + zu: no comma; anrufen is separable → <b>anzurufen</b>.","tag":"Word order"},{"id":"order017","t":"order","k":"order","q":"Build the sentence.","tok":["ich","lerne","Deutsch","um","in Wien","zu studieren"],"a":"Ich lerne Deutsch, um in Wien zu studieren.","why":"<b>um</b> opens the group, <b>zu studieren</b> closes it. The um-group can also come first — then the main verb follows immediately.","tag":"Word order","alt":["Um in Wien zu studieren, lerne ich Deutsch."]},{"id":"order018","t":"order","k":"order","q":"Build the sentence.","tok":["er","ging","weg","ohne","sich","zu verabschieden"],"a":"Er ging weg, ohne sich zu verabschieden.","why":"<b>ohne</b> opens the group, <b>zu verabschieden</b> closes it; the reflexive <i>sich</i> stays inside the group.","tag":"Word order","alt":["Ohne sich zu verabschieden, ging er weg."]},{"id":"order019","t":"order","k":"order","q":"Build the sentence.","tok":["statt","zu arbeiten","spielt","er","Computerspiele"],"a":"Statt zu arbeiten, spielt er Computerspiele.","why":"When the statt-group comes first, the main clause continues with the verb: <i>…, spielt er …</i>","tag":"Word order","alt":["Er spielt Computerspiele, statt zu arbeiten."]},{"id":"order020","t":"order","k":"order","q":"Build the sentence.","tok":["ich","spare","Geld","um","ein Auto","zu kaufen"],"a":"Ich spare Geld, um ein Auto zu kaufen.","why":"<b>um</b> opens, <b>zu kaufen</b> closes; the object <i>ein Auto</i> sits between them.","tag":"Word order","alt":["Um ein Auto zu kaufen, spare ich Geld."]},{"id":"order021","t":"order","k":"order","q":"Build the sentence.","tok":["ich","gebe","dir","Geld","damit","du","ein Eis","kaufst"],"a":"Ich gebe dir Geld, damit du ein Eis kaufst.","why":"damit is a subordinating conjunction: its own subject (du) and the conjugated verb <b>kaufst</b> at the end — no zu.","tag":"Word order","alt":["Damit du ein Eis kaufst, gebe ich dir Geld."]},{"id":"order022","t":"order","k":"order","q":"Build the sentence.","tok":["ich","gehe","heute","schwimmen"],"a":"Ich gehe heute schwimmen.","why":"Verb of movement + bare infinitive: <b>schwimmen</b> at the end, no zu, no comma.","tag":"Word order","alt":["Heute gehe ich schwimmen."]},{"id":"order023","t":"order","k":"order","q":"Build the sentence.","tok":["ich","höre","sie","singen"],"a":"Ich höre sie singen.","why":"Verb of perception + bare infinitive: <b>singen</b> at the end, no zu.","tag":"Word order"},{"id":"order024","t":"order","k":"order","q":"Build the sentence.","tok":["ich","lasse","mein Auto","reparieren"],"a":"Ich lasse mein Auto reparieren.","why":"lassen + bare infinitive: <b>reparieren</b> at the end, no zu.","tag":"Word order","alt":["Mein Auto lasse ich reparieren."]},{"id":"order025","t":"order","k":"order","q":"Build the sentence.","tok":["ich","helfe","dir","den schweren Koffer","zu tragen"],"a":"Ich helfe dir, den schweren Koffer zu tragen.","why":"helfen with a longer group: comma and <b>zu tragen</b> at the end.","tag":"Word order"},{"id":"order026","t":"order","k":"order","q":"Build the sentence.","tok":["es","ist","Zeit","nach Hause","zu gehen"],"a":"Es ist Zeit, nach Hause zu gehen.","why":"Zeit sein announces the group; <b>zu gehen</b> last.","tag":"Word order"},{"id":"order027","t":"order","k":"order","q":"Build the sentence.","tok":["ich","habe","vor","nächstes Jahr","zu heiraten"],"a":"Ich habe vor, nächstes Jahr zu heiraten.","why":"vorhaben is separable: <i>habe … vor</i>; the group ends in <b>zu heiraten</b>.","tag":"Word order","alt":["Nächstes Jahr habe ich vor, zu heiraten.","Ich habe nächstes Jahr vor, zu heiraten."]},{"id":"order028","t":"order","k":"order","q":"Build the sentence.","tok":["er","hat","versprochen","mich","abzuholen"],"a":"Er hat versprochen, mich abzuholen.","why":"Perfekt trigger in the main clause; abholen is separable → <b>abzuholen</b>.","tag":"Word order"},{"id":"order029","t":"order","k":"order","q":"Build the sentence.","tok":["es","gelingt","mir","nicht","früh","aufzustehen"],"a":"Es gelingt mir nicht, früh aufzustehen.","why":"es gelingt mir + nicht in the main clause; aufstehen is separable → <b>aufzustehen</b>.","tag":"Word order","alt":["Mir gelingt es nicht, früh aufzustehen."]},{"id":"order030","t":"order","k":"order","q":"Build the sentence.","tok":["sie","hat","beschlossen","weniger","zu arbeiten"],"a":"Sie hat beschlossen, weniger zu arbeiten.","why":"Perfekt trigger; <b>zu arbeiten</b> closes the group.","tag":"Word order"},{"id":"order031","t":"order","k":"order","q":"Build the sentence.","tok":["vergiss","nicht","die Tür","abzuschließen"],"a":"Vergiss nicht, die Tür abzuschließen!","why":"Imperative + nicht in the main clause; abschließen is separable → <b>abzuschließen</b>.","tag":"Word order"},{"id":"order032","t":"order","k":"order","q":"Build the sentence.","tok":["er","hat","keine Lust","heute","zu kochen"],"a":"Er hat keine Lust, heute zu kochen.","why":"Noun trigger Lust; <b>zu kochen</b> last.","tag":"Word order","alt":["Heute hat er keine Lust, zu kochen.","Er hat heute keine Lust, zu kochen."]},{"id":"order033","t":"order","k":"order","q":"Build the sentence.","tok":["sie","geht","nach Hause","ohne","ein Wort","zu sagen"],"a":"Sie geht nach Hause, ohne ein Wort zu sagen.","why":"<b>ohne</b> opens, <b>zu sagen</b> closes; the ohne-group can also come first.","tag":"Word order","alt":["Ohne ein Wort zu sagen, geht sie nach Hause."]},{"id":"order034","t":"order","k":"order","q":"Build the sentence.","tok":["ich","bitte","dich","pünktlich","zu kommen"],"a":"Ich bitte dich, pünktlich zu kommen.","why":"bitten + accusative person in the main clause; <b>zu kommen</b> closes the group.","tag":"Word order"},{"id":"order035","t":"order","k":"order","q":"Build the sentence.","tok":["es","ist","nicht leicht","eine Wohnung","zu finden"],"a":"Es ist nicht leicht, eine Wohnung zu finden.","why":"Es ist + Adjektiv; the object <i>eine Wohnung</i> belongs to the group, <b>zu finden</b> last.","tag":"Word order"},{"id":"order036","t":"order","k":"order","q":"Build the sentence.","tok":["wir","freuen","uns","darauf","euch","zu besuchen"],"a":"Wir freuen uns darauf, euch zu besuchen.","why":"sich freuen auf → <b>darauf</b> at the end of the main clause; <b>zu besuchen</b> last.","tag":"Word order"},{"id":"order037","t":"order","k":"order","q":"Build the sentence.","tok":["anstatt","fernzusehen","könntest","du","ein Buch","lesen"],"a":"Anstatt fernzusehen, könntest du ein Buch lesen.","why":"anstatt-group first, then the main clause with the verb first; the modal <i>könntest</i> takes a bare infinitive (lesen).","tag":"Word order","alt":["Du könntest ein Buch lesen, anstatt fernzusehen."]},{"id":"order038","t":"order","k":"order","q":"Build the sentence.","tok":["ich","nehme","ein Taxi","um","pünktlich","zu sein"],"a":"Ich nehme ein Taxi, um pünktlich zu sein.","why":"<b>um</b> opens, <b>zu sein</b> closes.","tag":"Word order","alt":["Um pünktlich zu sein, nehme ich ein Taxi."]},{"id":"order039","t":"order","k":"order","q":"Build the sentence.","tok":["er","bleibt","lieber","sitzen"],"a":"Er bleibt lieber sitzen.","why":"bleiben + bare infinitive: <b>sitzen</b> at the end, no zu.","tag":"Word order","alt":["Lieber bleibt er sitzen."]},{"id":"order040","t":"order","k":"order","q":"Build the sentence.","tok":["sie","lernt","ihre Zeit","besser","einzuteilen"],"a":"Sie lernt, ihre Zeit besser einzuteilen.","why":"lernen with a longer group: zu inside the separable verb → <b>einzuteilen</b>, at the very end.","tag":"Word order"},{"id":"spec001","t":"special","k":"cloze","q":"Er ist wahrscheinlich krank. → Er scheint krank ___ (sein).","a":"zu sein","why":"<b>scheinen + zu + Infinitiv</b> = seems to. Like a modal it takes no comma; zu + Infinitiv sits at the very end.","tag":"scheinen · brauchen"},{"id":"spec002","t":"special","k":"cloze","q":"Das Kind schläft wahrscheinlich. → Das Kind scheint ___ (schlafen).","a":"zu schlafen","why":"<b>scheinen + zu + Infinitiv</b> = seems to. Like a modal it takes no comma; zu + Infinitiv sits at the very end.","tag":"scheinen · brauchen"},{"id":"spec003","t":"special","k":"cloze","q":"Der Zug hat wahrscheinlich Verspätung. → Der Zug scheint Verspätung ___ (haben).","a":"zu haben","why":"<b>scheinen + zu + Infinitiv</b> = seems to. Like a modal it takes no comma; zu + Infinitiv sits at the very end.","tag":"scheinen · brauchen"},{"id":"spec004","t":"special","k":"cloze","q":"Er versteht das wohl nicht. → Er scheint das nicht ___ (verstehen).","a":"zu verstehen","why":"<b>scheinen + zu + Infinitiv</b> = seems to. Like a modal it takes no comma; zu + Infinitiv sits at the very end.","tag":"scheinen · brauchen"},{"id":"spec005","t":"special","k":"cloze","q":"Sie kommt anscheinend nicht. → Sie scheint nicht ___ (kommen).","a":"zu kommen","why":"<b>scheinen + zu + Infinitiv</b> = seems to. Like a modal it takes no comma; zu + Infinitiv sits at the very end.","tag":"scheinen · brauchen"},{"id":"spec006","t":"special","k":"cloze","q":"Das Gerät funktioniert wohl nicht. → Das Gerät scheint nicht ___ (funktionieren).","a":"zu funktionieren","why":"<b>scheinen + zu + Infinitiv</b> = seems to. Like a modal it takes no comma; zu + Infinitiv sits at the very end.","tag":"scheinen · brauchen"},{"id":"spec007","t":"special","k":"cloze","q":"Der Laden macht anscheinend früh zu. → Der Laden scheint früh ___ (zumachen).","a":"zuzumachen","why":"<b>scheinen + zu + Infinitiv</b> = seems to. Like a modal it takes no comma; zu + Infinitiv sits at the very end.","tag":"scheinen · brauchen"},{"id":"spec008","t":"special","k":"cloze","q":"Er hat anscheinend viel Geld. → Er scheint viel Geld ___ (haben).","a":"zu haben","why":"<b>scheinen + zu + Infinitiv</b> = seems to. Like a modal it takes no comma; zu + Infinitiv sits at the very end.","tag":"scheinen · brauchen"},{"id":"spec009","t":"special","k":"cloze","q":"Du musst heute nicht kommen. → Du brauchst heute nicht ___ (kommen).","a":"zu kommen","why":"<b>nicht müssen = nicht brauchen … zu</b>; <b>nur müssen = nur brauchen … zu</b>. brauchen follows the normal zu rules (zu slips inside a separable verb) and takes no comma.","tag":"scheinen · brauchen"},{"id":"spec010","t":"special","k":"cloze","q":"Sie muss nur anrufen. → Sie braucht nur ___ (anrufen).","a":"anzurufen","why":"<b>nicht müssen = nicht brauchen … zu</b>; <b>nur müssen = nur brauchen … zu</b>. brauchen follows the normal zu rules (zu slips inside a separable verb) and takes no comma.","tag":"scheinen · brauchen"},{"id":"spec011","t":"special","k":"cloze","q":"Ihr müsst nicht warten. → Ihr braucht nicht ___ (warten).","a":"zu warten","why":"<b>nicht müssen = nicht brauchen … zu</b>; <b>nur müssen = nur brauchen … zu</b>. brauchen follows the normal zu rules (zu slips inside a separable verb) and takes no comma.","tag":"scheinen · brauchen"},{"id":"spec012","t":"special","k":"cloze","q":"Du musst das nicht bezahlen. → Du brauchst das nicht ___ (bezahlen).","a":"zu bezahlen","why":"<b>nicht müssen = nicht brauchen … zu</b>; <b>nur müssen = nur brauchen … zu</b>. brauchen follows the normal zu rules (zu slips inside a separable verb) and takes no comma.","tag":"scheinen · brauchen"},{"id":"spec013","t":"special","k":"cloze","q":"Wir müssen nur die Tür aufmachen. → Wir brauchen nur die Tür ___ (aufmachen).","a":"aufzumachen","why":"<b>nicht müssen = nicht brauchen … zu</b>; <b>nur müssen = nur brauchen … zu</b>. brauchen follows the normal zu rules (zu slips inside a separable verb) and takes no comma.","tag":"scheinen · brauchen"},{"id":"spec014","t":"special","k":"cloze","q":"Er muss keine Angst haben. → Er braucht keine Angst ___ (haben).","a":"zu haben","why":"<b>nicht müssen = nicht brauchen … zu</b>; <b>nur müssen = nur brauchen … zu</b>. brauchen follows the normal zu rules (zu slips inside a separable verb) and takes no comma.","tag":"scheinen · brauchen"},{"id":"spec015","t":"special","k":"cloze","q":"Du musst nicht mitkommen. → Du brauchst nicht ___ (mitkommen).","a":"mitzukommen","why":"<b>nicht müssen = nicht brauchen … zu</b>; <b>nur müssen = nur brauchen … zu</b>. brauchen follows the normal zu rules (zu slips inside a separable verb) and takes no comma.","tag":"scheinen · brauchen"},{"id":"spec016","t":"special","k":"cloze","q":"Sie muss nur ein Formular ausfüllen. → Sie braucht nur ein Formular ___ (ausfüllen).","a":"auszufüllen","why":"<b>nicht müssen = nicht brauchen … zu</b>; <b>nur müssen = nur brauchen … zu</b>. brauchen follows the normal zu rules (zu slips inside a separable verb) and takes no comma.","tag":"scheinen · brauchen"},{"id":"spec017","t":"special","k":"cloze","q":"Du musst nicht kommen. → Du ___ (brauchen) nicht zu kommen.","a":"brauchst","why":"brauchen is conjugated like a regular verb: ich brauche, du brauchst, er braucht, wir brauchen, ihr braucht, sie brauchen.","tag":"scheinen · brauchen"},{"id":"spec018","t":"special","k":"cloze","q":"Er muss nur anrufen. → Er ___ (brauchen) nur anzurufen.","a":"braucht","why":"brauchen is conjugated like a regular verb: ich brauche, du brauchst, er braucht, wir brauchen, ihr braucht, sie brauchen.","tag":"scheinen · brauchen"},{"id":"spec019","t":"special","k":"cloze","q":"Ihr müsst nicht warten. → Ihr ___ (brauchen) nicht zu warten.","a":"braucht","why":"brauchen is conjugated like a regular verb: ich brauche, du brauchst, er braucht, wir brauchen, ihr braucht, sie brauchen.","tag":"scheinen · brauchen"},{"id":"spec020","t":"special","k":"cloze","q":"Wir müssen das nicht bezahlen. → Wir ___ (brauchen) das nicht zu bezahlen.","a":"brauchen","why":"brauchen is conjugated like a regular verb: ich brauche, du brauchst, er braucht, wir brauchen, ihr braucht, sie brauchen.","tag":"scheinen · brauchen"},{"id":"specmc001","t":"special","k":"mc","q":"Which sentence is correct?","c":["Du brauchst nicht zu kommen.","Du brauchst zu kommen.","Du brauchst nicht kommen zu."],"a":0,"why":"brauchen + zu only works with a negation or restriction: <b>nicht / nur / kein</b>. Without one, use müssen: <i>Du musst kommen.</i>","tag":"scheinen · brauchen"},{"id":"specmc002","t":"special","k":"mc","q":"<i>Er scheint krank zu sein.</i> — What does it mean?","c":["He seems to be ill.","He is shining because he is ill.","He has to be ill."],"a":0,"why":"<b>scheinen + zu + Infinitiv</b> = to seem to. (scheinen without zu = to shine.)","tag":"scheinen · brauchen"},{"id":"specmc003","t":"special","k":"mc","q":"Which sentence is correct?","c":["Er scheint, krank zu sein.","Er scheint krank zu sein."],"a":1,"why":"<b>scheinen</b> behaves like a modal: never a comma before zu + Infinitiv.","tag":"scheinen · brauchen"},{"id":"specmc004","t":"special","k":"mc","q":"<i>Du brauchst nicht zu kommen.</i> = ?","c":["Du musst nicht kommen.","Du darfst nicht kommen.","Du sollst nicht kommen."],"a":0,"why":"<b>nicht brauchen … zu = nicht müssen</b> (no necessity). It is <i>not</i> a prohibition — that would be <i>nicht dürfen</i>.","tag":"scheinen · brauchen"},{"id":"specmc005","t":"special","k":"mc","q":"<i>Du brauchst nur anzurufen.</i> = ?","c":["Du musst nur anrufen.","Du darfst nur anrufen.","Du willst nur anrufen."],"a":0,"why":"<b>nur brauchen … zu = nur müssen</b>: all you have to do is call.","tag":"scheinen · brauchen"},{"id":"specmc006","t":"special","k":"mc","q":"<i>Sie scheint zu schlafen.</i> = ?","c":["Sie schläft wahrscheinlich.","Sie will schlafen.","Sie muss schlafen."],"a":0,"why":"<b>scheinen + zu</b> expresses an assumption: she is probably asleep.","tag":"scheinen · brauchen"},{"id":"specmc007","t":"special","k":"mc","q":"Which sentence is correct?","c":["Du brauchst nicht anrufen zu.","Du brauchst nicht zu anrufen.","Du brauchst nicht anzurufen."],"a":2,"why":"brauchen keeps the normal zu rules: anrufen is separable → <b>anzurufen</b>.","tag":"scheinen · brauchen"},{"id":"specmc008","t":"special","k":"mc","q":"Which sentence is correct?","c":["Das scheint nicht zu funktionieren.","Das scheint nicht funktionieren.","Das scheint nicht, zu funktionieren."],"a":0,"why":"scheinen needs zu (unlike a real modal) but no comma (like a modal).","tag":"scheinen · brauchen"},{"id":"subj001","t":"subject","k":"mc","q":"<span class=\"de\">Ich verspreche dir, zu kommen.</span><br>Who does the action in the infinitive group?","c":["ich","du","wir"],"a":0,"why":"With <b>versprechen</b> the promiser does the action: <i>ich</i> come.","tag":"Who does it?"},{"id":"subj002","t":"subject","k":"mc","q":"<span class=\"de\">Ich bitte dich, zu kommen.</span><br>Who does the action in the infinitive group?","c":["ich","du","wir"],"a":1,"why":"With <b>bitten</b> the person asked does the action: <i>du</i> come.","tag":"Who does it?"},{"id":"subj003","t":"subject","k":"mc","q":"<span class=\"de\">Sie erlaubt ihm, zu gehen.</span><br>Who does the action in the infinitive group?","c":["sie (she)","er","wir"],"a":1,"why":"With <b>erlauben</b> the person allowed (dative: ihm) does the action.","tag":"Who does it?"},{"id":"subj004","t":"subject","k":"mc","q":"<span class=\"de\">Er empfiehlt mir, mehr zu lesen.</span><br>Who does the action in the infinitive group?","c":["er","ich","sie (they)"],"a":1,"why":"With <b>empfehlen</b> the person advised (dative: mir) does the action.","tag":"Who does it?"},{"id":"subj005","t":"subject","k":"mc","q":"<span class=\"de\">Wir hoffen, euch bald zu sehen.</span><br>Who does the action in the infinitive group?","c":["wir","ihr","sie (they)"],"a":0,"why":"With <b>hoffen</b> the subject of the main clause does the action.","tag":"Who does it?"},{"id":"subj006","t":"subject","k":"mc","q":"<span class=\"de\">Der Arzt rät ihr, weniger zu arbeiten.</span><br>Who does the action in the infinitive group?","c":["er","sie (she)","wir"],"a":1,"why":"With <b>raten</b> the person advised (dative: ihr) does the action.","tag":"Who does it?"},{"id":"subj007","t":"subject","k":"mc","q":"<span class=\"de\">Ich habe vergessen, dich anzurufen.</span><br>Who does the action in the infinitive group?","c":["ich","du","er"],"a":0,"why":"With <b>vergessen</b> the subject of the main clause does the action; <i>dich</i> is only the object.","tag":"Who does it?"},{"id":"subj008","t":"subject","k":"mc","q":"<span class=\"de\">Er hat uns versprochen, pünktlich zu sein.</span><br>Who does the action in the infinitive group?","c":["er","wir","ihr"],"a":0,"why":"With <b>versprechen</b> the promiser does the action.","tag":"Who does it?"},{"id":"subj009","t":"subject","k":"mc","q":"<span class=\"de\">Sie bittet uns, leise zu sein.</span><br>Who does the action in the infinitive group?","c":["sie (she)","wir","ihr"],"a":1,"why":"With <b>bitten</b> the people asked (accusative: uns) do the action.","tag":"Who does it?"},{"id":"subj010","t":"subject","k":"mc","q":"<span class=\"de\">Meine Eltern verbieten mir, spät nach Hause zu kommen.</span><br>Who does the action in the infinitive group?","c":["sie (they)","ich","wir"],"a":1,"why":"With <b>verbieten</b> the person forbidden (dative: mir) does the action.","tag":"Who does it?"},{"id":"subj011","t":"subject","k":"mc","q":"<span class=\"de\">Der Lehrer verbietet den Schülern, im Unterricht zu essen.</span><br>Who does the action in the infinitive group?","c":["er","sie (they)","wir"],"a":1,"why":"With <b>verbieten</b> the people forbidden (dative: den Schülern) do the action.","tag":"Who does it?"},{"id":"subj012","t":"subject","k":"mc","q":"<span class=\"de\">Ich habe vor, morgen früh aufzustehen.</span><br>Who does the action in the infinitive group?","c":["ich","du","er"],"a":0,"why":"With <b>vorhaben</b> the subject of the main clause does the action.","tag":"Who does it?"},{"id":"subj013","t":"subject","k":"mc","q":"<span class=\"de\">Er bringt ihr bei, Klavier zu spielen.</span><br>Who does the action in the infinitive group?","c":["er","sie (she)","ihr"],"a":1,"why":"With <b>beibringen</b> the learner (dative: ihr) does the action.","tag":"Who does it?"},{"id":"subj014","t":"subject","k":"mc","q":"<span class=\"de\">Du hast versprochen, das Zimmer aufzuräumen.</span><br>Who does the action in the infinitive group?","c":["ich","du","ihr"],"a":1,"why":"With <b>versprechen</b> the promiser does the action.","tag":"Who does it?"},{"id":"subj015","t":"subject","k":"mc","q":"<span class=\"de\">Sie empfiehlt uns, früh zu kommen.</span><br>Who does the action in the infinitive group?","c":["sie (she)","wir","ihr"],"a":1,"why":"With <b>empfehlen</b> the people advised (dative: uns) do the action.","tag":"Who does it?"},{"id":"subj016","t":"subject","k":"mc","q":"<span class=\"de\">Ich erlaube meinem Sohn, länger aufzubleiben.</span><br>Who does the action in the infinitive group?","c":["ich","er","wir"],"a":1,"why":"With <b>erlauben</b> the person allowed (dative: meinem Sohn) does the action.","tag":"Who does it?"},{"id":"subj017","t":"subject","k":"mc","q":"<span class=\"de\">Ihr habt beschlossen, umzuziehen.</span><br>Who does the action in the infinitive group?","c":["wir","ihr","sie (they)"],"a":1,"why":"With <b>beschließen</b> the subject of the main clause does the action.","tag":"Who does it?"},{"id":"subj018","t":"subject","k":"mc","q":"<span class=\"de\">Er hat mich gebeten, ihm zu helfen.</span><br>Who does the action in the infinitive group?","c":["er","ich","wir"],"a":1,"why":"With <b>bitten</b> the person asked (accusative: mich) does the action.","tag":"Who does it?"},{"id":"subj019","t":"subject","k":"mc","q":"<span class=\"de\">Wir raten euch, das Ticket online zu kaufen.</span><br>Who does the action in the infinitive group?","c":["wir","ihr","sie (they)"],"a":1,"why":"With <b>raten</b> the people advised (dative: euch) do the action.","tag":"Who does it?"},{"id":"subj020","t":"subject","k":"mc","q":"<span class=\"de\">Es gelingt ihr, die Prüfung zu bestehen.</span><br>Who does the action in the infinitive group?","c":["es","sie (she)","wir"],"a":1,"why":"With <b>es gelingt + Dativ</b> the dative person (ihr) does the action.","tag":"Who does it?"},{"id":"subj021","t":"subject","k":"mc","q":"<span class=\"de\">Sie hat Lust, ins Kino zu gehen.</span><br>Who does the action in the infinitive group?","c":["sie (she)","wir","ihr"],"a":0,"why":"With <b>Lust haben</b> the subject of the main clause does the action.","tag":"Who does it?"},{"id":"subj022","t":"subject","k":"mc","q":"<span class=\"de\">Er hat ihnen erlaubt, hier zu parken.</span><br>Who does the action in the infinitive group?","c":["er","sie (they)","wir"],"a":1,"why":"With <b>erlauben</b> the people allowed (dative: ihnen) do the action.","tag":"Who does it?"},{"id":"subj023","t":"subject","k":"mc","q":"<span class=\"de\">Ich rate dir, zum Arzt zu gehen.</span><br>Who does the action in the infinitive group?","c":["ich","du","er"],"a":1,"why":"With <b>raten</b> the person advised (dative: dir) does the action.","tag":"Who does it?"},{"id":"subj024","t":"subject","k":"mc","q":"<span class=\"de\">Sie verspricht ihren Eltern, mehr zu lernen.</span><br>Who does the action in the infinitive group?","c":["sie (she)","sie (they)","wir"],"a":0,"why":"With <b>versprechen</b> the promiser does the action — not the parents.","tag":"Who does it?"},{"id":"spot001","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich habe vergessen, dich zu anrufen.","Ich habe vergessen, dich anzurufen."],"a":1,"why":"anrufen is separable: zu goes inside → <b>anzurufen</b>.","tag":"Spot the correct sentence"},{"id":"spot002","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Es ist wichtig, zu jeden Tag üben.","Es ist wichtig, jeden Tag zu üben."],"a":1,"why":"zu + Infinitiv must stand at the very <b>end</b> of the group.","tag":"Spot the correct sentence"},{"id":"spot003","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich gehe heute zu schwimmen.","Ich gehe heute schwimmen."],"a":1,"why":"After a verb of movement (gehen) the infinitive is bare — no zu.","tag":"Spot the correct sentence"},{"id":"spot004","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich muss zu arbeiten.","Ich muss arbeiten."],"a":1,"why":"Modal verbs take a bare infinitive — never zu.","tag":"Spot the correct sentence"},{"id":"spot005","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Sie scheint, müde zu sein.","Sie scheint müde zu sein."],"a":1,"why":"scheinen takes zu but never a comma.","tag":"Spot the correct sentence"},{"id":"spot006","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich freue mich darauf, dich zu sehen.","Ich freue mich darauf, zu sehen dich."],"a":0,"why":"zu + Infinitiv is always the last element; the object comes before it.","tag":"Spot the correct sentence"},{"id":"spot007","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich lerne Deutsch, um in Wien zu studieren.","Ich lerne Deutsch, um zu studieren in Wien."],"a":0,"why":"In an um-group the place goes before zu + Infinitiv; <b>zu studieren</b> is last.","tag":"Spot the correct sentence"},{"id":"spot008","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich gebe dir Geld, um du ein Eis kaufst.","Ich gebe dir Geld, damit du ein Eis kaufst."],"a":1,"why":"Different subjects (ich / du) → damit + conjugated verb. um … zu cannot carry its own subject.","tag":"Spot the correct sentence"},{"id":"spot009","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich höre sie zu singen.","Ich höre sie singen."],"a":1,"why":"After a verb of perception (hören) the infinitive is bare — no zu.","tag":"Spot the correct sentence"},{"id":"spot010","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich lasse mein Auto zu reparieren.","Ich lasse mein Auto reparieren."],"a":1,"why":"After lassen the infinitive is bare — no zu.","tag":"Spot the correct sentence"},{"id":"spot011","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Er bleibt zu sitzen.","Er bleibt sitzen."],"a":1,"why":"After bleiben the infinitive is bare — no zu.","tag":"Spot the correct sentence"},{"id":"spot012","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Es macht Spaß, zu Deutsch lernen.","Es macht Spaß, Deutsch zu lernen."],"a":1,"why":"zu attaches to the verb, not to the object: <b>Deutsch zu lernen</b>.","tag":"Spot the correct sentence"},{"id":"spot013","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich habe keine Zeit, zu besuchen dich.","Ich habe keine Zeit, dich zu besuchen."],"a":1,"why":"The object comes first, zu + Infinitiv closes the group.","tag":"Spot the correct sentence"},{"id":"spot014","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich werde morgen zu arbeiten.","Ich werde morgen arbeiten."],"a":1,"why":"Futur with werden takes a bare infinitive — no zu.","tag":"Spot the correct sentence"},{"id":"spot015","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich versuche, jeden Tag Deutsch lernen.","Ich versuche, jeden Tag Deutsch zu lernen."],"a":1,"why":"versuchen is a normal trigger: the second verb needs <b>zu</b>.","tag":"Spot the correct sentence"},{"id":"spot016","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Denk daran, das Fenster zu zumachen.","Denk daran, das Fenster zuzumachen."],"a":1,"why":"zumachen is separable: <b>zu</b> + zu + machen = zuzumachen, one word.","tag":"Spot the correct sentence"},{"id":"spot017","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Es ist verboten, hier rauchen.","Es ist verboten, hier zu rauchen."],"a":1,"why":"Es ist + Adjektiv triggers <b>zu</b> + Infinitiv.","tag":"Spot the correct sentence"},{"id":"spot018","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Er ging weg, ohne zu sich verabschieden.","Er ging weg, ohne sich zu verabschieden."],"a":1,"why":"The reflexive pronoun comes before zu; <b>zu verabschieden</b> is last.","tag":"Spot the correct sentence"},{"id":"spot019","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Statt zu arbeiten, spielt er Computerspiele.","Statt arbeiten, spielt er Computerspiele."],"a":0,"why":"(an)statt needs <b>zu</b> + Infinitiv.","tag":"Spot the correct sentence"},{"id":"spot020","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Du brauchst nicht zu kommen.","Du brauchst nicht kommen zu."],"a":0,"why":"zu stands directly before the infinitive: <b>zu kommen</b>.","tag":"Spot the correct sentence"},{"id":"spot021","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Hast du Lust, ins Kino mitzukommen?","Hast du Lust, ins Kino mit zu kommen?"],"a":0,"why":"mitkommen is separable → one word: <b>mitzukommen</b>.","tag":"Spot the correct sentence"},{"id":"spot022","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich hoffe, die Prüfung zu bestehen.","Ich hoffe, zu bestehen die Prüfung."],"a":0,"why":"The object comes first; zu + Infinitiv closes the group.","tag":"Spot the correct sentence"},{"id":"spot023","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Es ist schwer, diesen Text zu verstehen.","Es ist schwer, diesen Text verzustehen."],"a":0,"why":"ver- is inseparable: zu stays outside → <b>zu verstehen</b>.","tag":"Spot the correct sentence"},{"id":"spot024","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Vergiss nicht, den Vertrag zu unterschreiben.","Vergiss nicht, den Vertrag unterzuschreiben."],"a":0,"why":"unterschreiben is inseparable (unter<b>schrei</b>ben) → <b>zu unterschreiben</b>.","tag":"Spot the correct sentence"},{"id":"spot025","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Es ist nicht leicht, diesen Satz zu übersetzen.","Es ist nicht leicht, diesen Satz überzusetzen."],"a":0,"why":"übersetzen = to translate is inseparable → <b>zu übersetzen</b>. (überzusetzen would be to ferry across.)","tag":"Spot the correct sentence"},{"id":"spot026","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich habe keine Lust, so lange zu telefonieren.","Ich habe keine Lust, so lange telefonieren zu."],"a":0,"why":"-ieren verbs take zu in front, as a separate word, and zu + Infinitiv is last.","tag":"Spot the correct sentence"},{"id":"spot027","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich freue mich darauf, deine Familie kennenzulernen.","Ich freue mich darauf, deine Familie zu kennenlernen."],"a":0,"why":"kennenlernen is separable → <b>kennenzulernen</b>.","tag":"Spot the correct sentence"},{"id":"spot028","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Wir haben Lust, im Park spazieren zu gehen.","Wir haben Lust, im Park zu spazieren gehen."],"a":0,"why":"spazieren gehen is two words: zu goes before the actual verb → <b>spazieren zu gehen</b>.","tag":"Spot the correct sentence"},{"id":"spot029","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Er hat Angst davor, allein zu bleiben.","Er hat Angst dafür, allein zu bleiben."],"a":0,"why":"Angst haben <b>vor</b> → da<b>vor</b>.","tag":"Spot the correct sentence"},{"id":"spot030","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich interessiere mich dafür, Sprachen zu lernen.","Ich interessiere mich darauf, Sprachen zu lernen."],"a":0,"why":"sich interessieren <b>für</b> → da<b>für</b>.","tag":"Spot the correct sentence"},{"id":"spot031","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Sie lernt, ihre Zeit besser einzuteilen.","Sie lernt, ihre Zeit besser einteilen."],"a":0,"why":"lernen with a longer group takes zu: <b>einzuteilen</b>.","tag":"Spot the correct sentence"},{"id":"spot032","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich sehe ihn kommen.","Ich sehe ihn zu kommen."],"a":0,"why":"After sehen (perception) the infinitive is bare.","tag":"Spot the correct sentence"},{"id":"spot033","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich lerne Deutsch, damit ich in Deutschland arbeiten kann.","Ich lerne Deutsch, damit in Deutschland arbeiten zu können."],"a":0,"why":"damit needs a subject and a conjugated verb; zu + Infinitiv belongs to um … zu.","tag":"Spot the correct sentence"},{"id":"spot034","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Er nimmt ein Taxi, um pünktlich zu sein.","Er nimmt ein Taxi, um pünktlich sein."],"a":0,"why":"um needs <b>zu</b> + Infinitiv.","tag":"Spot the correct sentence"},{"id":"spot035","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich habe vor, im Sommer nach Wien zu fahren.","Ich habe vor, im Sommer zu fahren nach Wien."],"a":0,"why":"Nothing follows zu + Infinitiv; the place goes before it.","tag":"Spot the correct sentence"},{"id":"spot036","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Es ist Zeit, nach Hause zu gehen.","Es ist Zeit, zu nach Hause gehen."],"a":0,"why":"zu attaches directly to the verb: <b>zu gehen</b>.","tag":"Spot the correct sentence"},{"id":"spot037","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Es gelingt mir nicht, früh aufzustehen.","Es gelingt mir nicht, früh aufstehen."],"a":0,"why":"es gelingt mir is a normal trigger: zu inside the separable verb → <b>aufzustehen</b>.","tag":"Spot the correct sentence"},{"id":"spot038","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich helfe dir, den schweren Koffer zu tragen.","Ich helfe dir, den schweren Koffer zu tragen zu."],"a":0,"why":"One zu, directly before the infinitive, at the end of the group.","tag":"Spot the correct sentence"},{"id":"spot039","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Sie hat aufgehört, zu rauchen.","Sie hat aufgehört, rauchen."],"a":0,"why":"aufhören is a trigger: <b>zu rauchen</b>.","tag":"Spot the correct sentence"},{"id":"spot040","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Ich möchte ins Kino gehen.","Ich möchte ins Kino zu gehen."],"a":0,"why":"möchten is a modal: bare infinitive, no zu.","tag":"Spot the correct sentence"},{"id":"spot041","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Wir bereiten uns darauf vor, umzuziehen.","Wir bereiten uns darauf vor, zu umziehen."],"a":0,"why":"umziehen (to move house) is separable → <b>umzuziehen</b>.","tag":"Spot the correct sentence"},{"id":"spot042","t":"spot","k":"mc","q":"Which sentence is correct?","c":["Er ist gegangen, ohne zu bezahlen.","Er ist gegangen, ohne bezahlen."],"a":0,"why":"ohne needs <b>zu</b> + Infinitiv.","tag":"Spot the correct sentence"},{"id":"trans001","t":"trans","k":"cloze","q":"I have no time to visit you. (keine Zeit haben · besuchen)","a":"Ich habe keine Zeit, dich zu besuchen.","why":"Noun trigger <b>Zeit haben</b> → comma + zu + Infinitiv at the end.","tag":"Translate","long":true,"alt":["Ich habe keine Zeit, euch zu besuchen.","Ich habe keine Zeit, Sie zu besuchen."]},{"id":"trans002","t":"trans","k":"cloze","q":"It is important to practise every day. (wichtig · jeden Tag üben)","a":"Es ist wichtig, jeden Tag zu üben.","why":"<b>Es ist + Adjektiv</b> → comma + zu + Infinitiv at the end.","tag":"Translate","long":true},{"id":"trans003","t":"trans","k":"cloze","q":"I am looking forward to seeing you. (sich freuen auf · sehen)","a":"Ich freue mich darauf, dich zu sehen.","why":"sich freuen <b>auf</b> → <b>darauf</b> points forward; zu + Infinitiv closes the group.","tag":"Translate","long":true,"alt":["Ich freue mich darauf, euch zu sehen.","Ich freue mich darauf, Sie zu sehen.","Ich freue mich, dich zu sehen.","Ich freue mich, euch zu sehen.","Ich freue mich, Sie zu sehen."],"altWhy":"Also fine — but with <i>sich freuen auf</i> the da-word <b>darauf</b> is the exam-safe version."},{"id":"trans004","t":"trans","k":"cloze","q":"He forgot to call me. (vergessen · anrufen)","a":"Er hat vergessen, mich anzurufen.","why":"vergessen is a trigger; anrufen is separable → <b>anzurufen</b>.","tag":"Translate","long":true,"alt":["Er vergaß, mich anzurufen."]},{"id":"trans005","t":"trans","k":"cloze","q":"Do you feel like going to the cinema? (Lust haben · ins Kino gehen)","a":"Hast du Lust, ins Kino zu gehen?","why":"Noun trigger <b>Lust haben</b> → comma + zu + Infinitiv.","tag":"Translate","long":true,"alt":["Habt ihr Lust, ins Kino zu gehen?","Haben Sie Lust, ins Kino zu gehen?"]},{"id":"trans006","t":"trans","k":"cloze","q":"I am learning German in order to study in Vienna. (um … zu · in Wien studieren)","a":"Ich lerne Deutsch, um in Wien zu studieren.","why":"Purpose with the same subject → <b>um … zu</b>.","tag":"Translate","long":true,"alt":["Um in Wien zu studieren, lerne ich Deutsch."]},{"id":"trans007","t":"trans","k":"cloze","q":"He left without saying goodbye. (weggehen · sich verabschieden)","a":"Er ging weg, ohne sich zu verabschieden.","why":"<b>ohne … zu</b>; the reflexive pronoun sits inside the group before zu.","tag":"Translate","long":true,"alt":["Er ist weggegangen, ohne sich zu verabschieden."]},{"id":"trans008","t":"trans","k":"cloze","q":"Instead of working, he plays computer games. (statt · Computerspiele spielen)","a":"Statt zu arbeiten, spielt er Computerspiele.","why":"<b>(an)statt … zu</b>. If the group comes first, the main clause starts with the verb.","tag":"Translate","long":true,"alt":["Anstatt zu arbeiten, spielt er Computerspiele.","Er spielt Computerspiele, statt zu arbeiten.","Er spielt Computerspiele, anstatt zu arbeiten."]},{"id":"trans009","t":"trans","k":"cloze","q":"You do not need to come today. (brauchen · heute)","a":"Du brauchst heute nicht zu kommen.","why":"<b>nicht brauchen … zu</b> = nicht müssen. No comma.","tag":"Translate","long":true,"alt":["Heute brauchst du nicht zu kommen.","Ihr braucht heute nicht zu kommen.","Sie brauchen heute nicht zu kommen.","Heute braucht ihr nicht zu kommen.","Heute brauchen Sie nicht zu kommen."]},{"id":"trans010","t":"trans","k":"cloze","q":"He seems to be ill. (scheinen · krank)","a":"Er scheint krank zu sein.","why":"<b>scheinen + zu + Infinitiv</b>, no comma.","tag":"Translate","long":true},{"id":"trans011","t":"trans","k":"cloze","q":"I am going swimming today. (schwimmen gehen · heute)","a":"Ich gehe heute schwimmen.","why":"Verb of movement + bare infinitive — no zu.","tag":"Translate","long":true,"alt":["Heute gehe ich schwimmen."]},{"id":"trans012","t":"trans","k":"cloze","q":"I hear her singing. (hören · singen)","a":"Ich höre sie singen.","why":"Verb of perception + bare infinitive — no zu.","tag":"Translate","long":true},{"id":"trans013","t":"trans","k":"cloze","q":"I am having my car repaired. (lassen · reparieren)","a":"Ich lasse mein Auto reparieren.","why":"<b>lassen</b> + bare infinitive — no zu.","tag":"Translate","long":true},{"id":"trans014","t":"trans","k":"cloze","q":"It is time to go home. (Zeit sein · nach Hause gehen)","a":"Es ist Zeit, nach Hause zu gehen.","why":"Noun trigger <b>Zeit sein</b> → comma + zu + Infinitiv.","tag":"Translate","long":true},{"id":"trans015","t":"trans","k":"cloze","q":"She recommends that I read more. (empfehlen · mehr lesen)","a":"Sie empfiehlt mir, mehr zu lesen.","why":"<b>empfehlen + Dativ</b>; the dative person does the reading.","tag":"Translate","long":true},{"id":"trans016","t":"trans","k":"cloze","q":"We plan to go to Vienna in summer. (vorhaben · im Sommer · nach Wien fahren)","a":"Wir haben vor, im Sommer nach Wien zu fahren.","why":"<b>vorhaben</b> separates: haben … vor. Time before place, zu fahren last.","tag":"Translate","long":true,"alt":["Im Sommer haben wir vor, nach Wien zu fahren.","Wir haben vor, nach Wien im Sommer zu fahren."]},{"id":"trans017","t":"trans","k":"cloze","q":"Remember to close the window! (denken an · das Fenster zumachen)","a":"Denk daran, das Fenster zuzumachen!","why":"denken <b>an</b> → <b>daran</b>; zumachen is separable → <b>zuzumachen</b>.","tag":"Translate","long":true,"alt":["Denkt daran, das Fenster zuzumachen!","Denken Sie daran, das Fenster zuzumachen!"]},{"id":"trans018","t":"trans","k":"cloze","q":"Stop being so loud! (aufhören mit · so laut sein)","a":"Hör damit auf, so laut zu sein!","why":"aufhören <b>mit</b> → <b>damit</b> sits between Hör and auf.","tag":"Translate","long":true,"alt":["Hört damit auf, so laut zu sein!","Hören Sie damit auf, so laut zu sein!","Hör auf, so laut zu sein!","Hört auf, so laut zu sein!","Hören Sie auf, so laut zu sein!"],"altWhy":"Also correct — <i>damit</i> can be dropped after aufhören."},{"id":"trans019","t":"trans","k":"cloze","q":"It is forbidden to smoke here. (verboten · hier rauchen)","a":"Es ist verboten, hier zu rauchen.","why":"<b>Es ist + Adjektiv</b> → comma + zu + Infinitiv.","tag":"Translate","long":true},{"id":"trans020","t":"trans","k":"cloze","q":"I am trying to learn German every day. (versuchen · jeden Tag)","a":"Ich versuche, jeden Tag Deutsch zu lernen.","why":"<b>versuchen</b> is a trigger; zu lernen closes the group.","tag":"Translate","long":true,"alt":["Ich versuche, Deutsch jeden Tag zu lernen."]},{"id":"trans021","t":"trans","k":"cloze","q":"He is afraid of staying alone. (Angst haben vor · allein bleiben)","a":"Er hat Angst davor, allein zu bleiben.","why":"Angst haben <b>vor</b> → <b>davor</b>; zu bleiben last.","tag":"Translate","long":true,"alt":["Er hat Angst, allein zu bleiben.","Er hat Angst davor, alleine zu bleiben.","Er hat Angst, alleine zu bleiben."],"altWhy":"Also correct — <i>davor</i> is optional after Angst haben, but the exam-safe version keeps it."},{"id":"trans022","t":"trans","k":"cloze","q":"You only need to call. (brauchen · nur · anrufen)","a":"Du brauchst nur anzurufen.","why":"<b>nur brauchen … zu</b> = nur müssen; anrufen is separable → <b>anzurufen</b>.","tag":"Translate","long":true,"alt":["Ihr braucht nur anzurufen.","Sie brauchen nur anzurufen."]},{"id":"trans023","t":"trans","k":"cloze","q":"I give you money so that you can buy an ice cream. (damit · ein Eis kaufen können)","a":"Ich gebe dir Geld, damit du ein Eis kaufen kannst.","why":"Different subjects (ich / du) → <b>damit</b> with its own subject and the conjugated verb at the end.","tag":"Translate","long":true,"alt":["Ich gebe dir Geld, damit du dir ein Eis kaufen kannst.","Ich gebe euch Geld, damit ihr ein Eis kaufen könnt.","Ich gebe euch Geld, damit ihr euch ein Eis kaufen könnt."]},{"id":"trans024","t":"trans","k":"cloze","q":"It is fun to talk to you. (Spaß machen · mit dir reden)","a":"Es macht Spaß, mit dir zu reden.","why":"Noun trigger <b>Spaß machen</b>, announced by es.","tag":"Translate","long":true,"alt":["Es macht Spaß, mit euch zu reden.","Es macht Spaß, mit Ihnen zu reden."]},{"id":"trans025","t":"trans","k":"cloze","q":"She has decided to work less. (beschließen · weniger arbeiten)","a":"Sie hat beschlossen, weniger zu arbeiten.","why":"<b>beschließen</b> is a trigger: Perfekt in the main clause, zu arbeiten at the end.","tag":"Translate","long":true,"alt":["Sie hat sich entschieden, weniger zu arbeiten.","Sie beschloss, weniger zu arbeiten."]},{"id":"trans026","t":"trans","k":"cloze","q":"I promise to help you. (versprechen · helfen)","a":"Ich verspreche, dir zu helfen.","why":"<b>versprechen</b> is a trigger; the person helped is the object of helfen (dative).","tag":"Translate","long":true,"alt":["Ich verspreche, euch zu helfen.","Ich verspreche, Ihnen zu helfen."]},{"id":"trans027","t":"trans","k":"cloze","q":"He promised to pick me up. (versprechen · abholen)","a":"Er hat versprochen, mich abzuholen.","why":"abholen is separable → <b>abzuholen</b>.","tag":"Translate","long":true,"alt":["Er versprach, mich abzuholen."]},{"id":"trans028","t":"trans","k":"cloze","q":"It is hard to understand this text. (schwer · diesen Text verstehen)","a":"Es ist schwer, diesen Text zu verstehen.","why":"<b>Es ist + Adjektiv</b>; ver- is inseparable → <b>zu verstehen</b>.","tag":"Translate","long":true,"alt":["Es ist schwierig, diesen Text zu verstehen."]},{"id":"trans029","t":"trans","k":"cloze","q":"Do not forget to lock the door! (vergessen · die Tür abschließen)","a":"Vergiss nicht, die Tür abzuschließen!","why":"abschließen is separable → <b>abzuschließen</b>.","tag":"Translate","long":true,"alt":["Vergesst nicht, die Tür abzuschließen!","Vergessen Sie nicht, die Tür abzuschließen!"]},{"id":"trans030","t":"trans","k":"cloze","q":"I help you carry the heavy suitcase. (helfen · den schweren Koffer tragen)","a":"Ich helfe dir, den schweren Koffer zu tragen.","why":"helfen with a longer group → comma + <b>zu tragen</b>.","tag":"Translate","long":true,"alt":["Ich helfe dir den schweren Koffer tragen.","Ich helfe euch, den schweren Koffer zu tragen.","Ich helfe Ihnen, den schweren Koffer zu tragen."],"altWhy":"Also possible — but with a longer group, zu + comma is the safer choice."},{"id":"trans031","t":"trans","k":"cloze","q":"I take a taxi in order to be on time. (Taxi nehmen · pünktlich sein)","a":"Ich nehme ein Taxi, um pünktlich zu sein.","why":"Purpose, same subject → <b>um … zu</b>.","tag":"Translate","long":true,"alt":["Um pünktlich zu sein, nehme ich ein Taxi."]},{"id":"trans032","t":"trans","k":"cloze","q":"I am learning to swim. (lernen · schwimmen)","a":"Ich lerne schwimmen.","why":"lernen with a short group → bare infinitive.","tag":"Translate","long":true,"alt":["Ich lerne zu schwimmen."],"altWhy":"Not wrong, but with a short group German normally drops zu: <i>Ich lerne schwimmen.</i>"},{"id":"trans033","t":"trans","k":"cloze","q":"It is possible to take part online. (möglich · online teilnehmen)","a":"Es ist möglich, online teilzunehmen.","why":"teilnehmen is separable → <b>teilzunehmen</b>.","tag":"Translate","long":true},{"id":"trans034","t":"trans","k":"cloze","q":"I have problems understanding this. (Probleme haben · das verstehen)","a":"Ich habe Probleme, das zu verstehen.","why":"Noun trigger <b>Probleme haben</b> → comma + zu + Infinitiv.","tag":"Translate","long":true},{"id":"trans035","t":"trans","k":"cloze","q":"He claims to know everything. (behaupten · alles wissen)","a":"Er behauptet, alles zu wissen.","why":"<b>behaupten</b> is a trigger; zu wissen closes the group.","tag":"Translate","long":true},{"id":"trans036","t":"trans","k":"cloze","q":"She is afraid of losing her job. (Angst haben · ihren Job verlieren)","a":"Sie hat Angst, ihren Job zu verlieren.","why":"Noun trigger <b>Angst haben</b>; ver- is inseparable → <b>zu verlieren</b>.","tag":"Translate","long":true,"alt":["Sie hat Angst davor, ihren Job zu verlieren."]},{"id":"trans037","t":"trans","k":"cloze","q":"I hope to pass the exam. (hoffen · die Prüfung bestehen)","a":"Ich hoffe, die Prüfung zu bestehen.","why":"<b>hoffen</b> is a trigger; be- is inseparable → <b>zu bestehen</b>.","tag":"Translate","long":true},{"id":"trans038","t":"trans","k":"cloze","q":"It is not easy to find a flat in Berlin. (nicht leicht · in Berlin eine Wohnung finden)","a":"Es ist nicht leicht, in Berlin eine Wohnung zu finden.","why":"<b>Es ist + Adjektiv</b>; zu finden closes the group.","tag":"Translate","long":true,"alt":["Es ist nicht leicht, eine Wohnung in Berlin zu finden.","Es ist nicht einfach, in Berlin eine Wohnung zu finden.","Es ist nicht einfach, eine Wohnung in Berlin zu finden."]},{"id":"trans039","t":"trans","k":"cloze","q":"We are looking forward to visiting you soon. (sich freuen auf · bald besuchen)","a":"Wir freuen uns darauf, euch bald zu besuchen.","why":"sich freuen <b>auf</b> → <b>darauf</b>; zu besuchen last.","tag":"Translate","long":true,"alt":["Wir freuen uns darauf, dich bald zu besuchen.","Wir freuen uns darauf, Sie bald zu besuchen.","Wir freuen uns, euch bald zu besuchen.","Wir freuen uns, dich bald zu besuchen.","Wir freuen uns, Sie bald zu besuchen."],"altWhy":"Also fine — but with <i>sich freuen auf</i> the da-word <b>darauf</b> is the exam-safe version."},{"id":"trans040","t":"trans","k":"cloze","q":"He stays seated. (bleiben · sitzen)","a":"Er bleibt sitzen.","why":"<b>bleiben</b> + bare infinitive — no zu.","tag":"Translate","long":true},{"id":"trans041","t":"trans","k":"cloze","q":"I forgot to pay the bill. (vergessen · die Rechnung bezahlen)","a":"Ich habe vergessen, die Rechnung zu bezahlen.","why":"be- is inseparable → <b>zu bezahlen</b>.","tag":"Translate","long":true,"alt":["Ich vergaß, die Rechnung zu bezahlen."]},{"id":"trans042","t":"trans","k":"cloze","q":"She is trying to stop smoking. (versuchen · aufhören · rauchen)","a":"Sie versucht, mit dem Rauchen aufzuhören.","why":"aufhören is separable → <b>aufzuhören</b>; <i>mit dem Rauchen</i> is the idiomatic object.","tag":"Translate","long":true,"alt":["Sie versucht, aufzuhören zu rauchen.","Sie versucht aufzuhören zu rauchen."]},{"id":"exam001","t":"exam","k":"mc","q":"Ich habe keine Lust, heute ___.","c":["einzukaufen","zu einkaufen","einkaufen zu","ein zu kaufen"],"a":0,"why":"einkaufen is separable → one word with zu inside: <b>einzukaufen</b>.","tag":"Sprachbausteine"},{"id":"exam002","t":"exam","k":"mc","q":"Es ist wichtig, pünktlich ___.","c":["anzukommen","zu ankommen","ankommen","an zu kommen"],"a":0,"why":"ankommen is separable → <b>anzukommen</b>; Es ist + Adjektiv requires zu.","tag":"Sprachbausteine"},{"id":"exam003","t":"exam","k":"mc","q":"Ich versuche, weniger ___.","c":["zu arbeiten","arbeiten","zu arbeit","arbeiten zu"],"a":0,"why":"versuchen triggers <b>zu + Infinitiv</b>, and zu comes directly before the verb.","tag":"Sprachbausteine"},{"id":"exam004","t":"exam","k":"mc","q":"Er ging weg, ___ sich zu verabschieden.","c":["ohne","um","statt","damit"],"a":0,"why":"without saying goodbye → <b>ohne … zu</b>.","tag":"Sprachbausteine"},{"id":"exam005","t":"exam","k":"mc","q":"Ich lerne Deutsch, ___ ich in Deutschland arbeiten kann.","c":["damit","um","ohne","dass"],"a":0,"why":"The clause has its own subject and a conjugated verb (kann) → <b>damit</b>.","tag":"Sprachbausteine"},{"id":"exam006","t":"exam","k":"mc","q":"Sie geht jeden Morgen ___.","c":["joggen","zu joggen","joggen zu","gejoggt"],"a":0,"why":"gehen (movement) + bare infinitive.","tag":"Sprachbausteine"},{"id":"exam007","t":"exam","k":"mc","q":"Ich freue mich ___, dich zu sehen.","c":["darauf","dafür","davon","darüber"],"a":0,"why":"sich freuen <b>auf</b> → <b>darauf</b>.","tag":"Sprachbausteine"},{"id":"exam008","t":"exam","k":"mc","q":"Er scheint müde ___.","c":["zu sein","sein","zu ist","ist"],"a":0,"why":"scheinen + <b>zu + Infinitiv</b>.","tag":"Sprachbausteine"},{"id":"exam009","t":"exam","k":"mc","q":"Du brauchst nicht ___.","c":["zu kommen","kommen zu","gekommen","kommst"],"a":0,"why":"nicht brauchen + <b>zu + Infinitiv</b>.","tag":"Sprachbausteine"},{"id":"exam010","t":"exam","k":"mc","q":"Wir haben vor, im Sommer ___.","c":["zu verreisen","verzureisen","verreisen","zu verreist"],"a":0,"why":"ver- is inseparable → <b>zu verreisen</b>.","tag":"Sprachbausteine"},{"id":"exam011","t":"exam","k":"mc","q":"Ich höre die Kinder ___.","c":["spielen","zu spielen","spielten","gespielt"],"a":0,"why":"hören (perception) + bare infinitive.","tag":"Sprachbausteine"},{"id":"exam012","t":"exam","k":"mc","q":"Es macht Spaß, mit dir ___.","c":["zu reden","reden","redest","geredet"],"a":0,"why":"Spaß machen triggers <b>zu + Infinitiv</b>.","tag":"Sprachbausteine"},{"id":"exam013","t":"exam","k":"mc","q":"Er hat vergessen, die Rechnung ___.","c":["zu bezahlen","bezuzahlen","bezahlen","bezahlt"],"a":0,"why":"be- is inseparable → <b>zu bezahlen</b>.","tag":"Sprachbausteine"},{"id":"exam014","t":"exam","k":"mc","q":"Vergiss nicht, dich für den Kurs ___.","c":["anzumelden","zu anmelden","anmelden","angemeldet"],"a":0,"why":"anmelden is separable → <b>anzumelden</b>.","tag":"Sprachbausteine"},{"id":"exam015","t":"exam","k":"mc","q":"Ich lasse mir die Haare ___.","c":["schneiden","zu schneiden","geschnitten","schneide"],"a":0,"why":"lassen + bare infinitive.","tag":"Sprachbausteine"},{"id":"exam016","t":"exam","k":"mc","q":"___ zu lernen, sieht er fern.","c":["Statt","Ohne","Um","Damit"],"a":0,"why":"instead of studying → <b>(an)statt … zu</b>.","tag":"Sprachbausteine"},{"id":"exam017","t":"exam","k":"mc","q":"Es ist nicht leicht, diesen Satz ___.","c":["zu übersetzen","überzusetzen","übersetzen","zu übersetzt"],"a":0,"why":"übersetzen (translate) is inseparable → <b>zu übersetzen</b>.","tag":"Sprachbausteine"},{"id":"exam018","t":"exam","k":"mc","q":"Sie hat Angst ___, allein zu bleiben.","c":["davor","dafür","darauf","damit"],"a":0,"why":"Angst haben <b>vor</b> → <b>davor</b>.","tag":"Sprachbausteine"},{"id":"exam019","t":"exam","k":"mc","q":"Hör ___ auf, so laut zu sein!","c":["damit","davon","darauf","dazu"],"a":0,"why":"aufhören <b>mit</b> → <b>damit</b>.","tag":"Sprachbausteine"},{"id":"exam020","t":"exam","k":"mc","q":"Ich nehme ein Taxi, ___ pünktlich zu sein.","c":["um","damit","ohne","statt"],"a":0,"why":"Purpose with zu + Infinitiv → <b>um … zu</b>.","tag":"Sprachbausteine"},{"id":"exam021","t":"exam","k":"mc","q":"Denk ___, das Licht auszumachen!","c":["daran","darauf","davon","dafür"],"a":0,"why":"denken <b>an</b> → <b>daran</b>.","tag":"Sprachbausteine"},{"id":"exam022","t":"exam","k":"mc","q":"Er bleibt lieber zu Hause ___.","c":["sitzen","zu sitzen","gesessen","sitzt"],"a":0,"why":"bleiben + bare infinitive.","tag":"Sprachbausteine"},{"id":"exam023","t":"exam","k":"mc","q":"Ich habe keine Zeit, dich ___.","c":["zu besuchen","besuchen","bezusuchen","besucht"],"a":0,"why":"Zeit haben triggers zu; be- is inseparable → <b>zu besuchen</b>.","tag":"Sprachbausteine"},{"id":"exam024","t":"exam","k":"mc","q":"Es ist verboten, hier ___.","c":["zu parken","parken","geparkt","parkst"],"a":0,"why":"Es ist + Adjektiv → <b>zu + Infinitiv</b>.","tag":"Sprachbausteine"},{"id":"exam025","t":"exam","k":"mc","q":"Sie empfiehlt mir, jeden Tag ___.","c":["zu üben","üben","geübt","übe"],"a":0,"why":"empfehlen triggers <b>zu + Infinitiv</b>.","tag":"Sprachbausteine"},{"id":"exam026","t":"exam","k":"mc","q":"Ich werde dich morgen ___.","c":["anrufen","anzurufen","zu anrufen","angerufen"],"a":0,"why":"Futur with werden → bare infinitive.","tag":"Sprachbausteine"},{"id":"exam027","t":"exam","k":"mc","q":"Es ist Zeit, mit der Arbeit ___.","c":["anzufangen","zu anfangen","anfangen","an zu fangen"],"a":0,"why":"anfangen is separable → <b>anzufangen</b>.","tag":"Sprachbausteine"},{"id":"exam028","t":"exam","k":"mc","q":"Du brauchst nur ___.","c":["anzurufen","zu anrufen","anrufen","angerufen"],"a":0,"why":"nur brauchen + zu; anrufen is separable → <b>anzurufen</b>.","tag":"Sprachbausteine"},{"id":"exam029","t":"exam","k":"mc","q":"Wir bleiben noch ein bisschen ___.","c":["stehen","zu stehen","gestanden","stehe"],"a":0,"why":"bleiben + bare infinitive.","tag":"Sprachbausteine"},{"id":"exam030","t":"exam","k":"mc","q":"Er geht nach Hause, ___ ein Wort zu sagen.","c":["ohne","um","statt","damit"],"a":0,"why":"without saying a word → <b>ohne … zu</b>.","tag":"Sprachbausteine"},{"id":"exam031","t":"exam","k":"mc","q":"Ich interessiere mich ___, Sprachen zu lernen.","c":["dafür","darauf","damit","davon"],"a":0,"why":"sich interessieren <b>für</b> → <b>dafür</b>.","tag":"Sprachbausteine"},{"id":"exam032","t":"exam","k":"mc","q":"Er hat beschlossen, nach Berlin ___.","c":["zurückzukommen","zu zurückkommen","zurückkommen","zurück zu kommen"],"a":0,"why":"zurückkommen is separable → <b>zurückzukommen</b>.","tag":"Sprachbausteine"},{"id":"exam033","t":"exam","k":"mc","q":"Ich habe vor, den Führerschein ___.","c":["zu machen","machen","gemacht","mache"],"a":0,"why":"vorhaben triggers <b>zu + Infinitiv</b>.","tag":"Sprachbausteine"},{"id":"exam034","t":"exam","k":"mc","q":"Kommst du heute Abend mit ___?","c":["essen","zu essen","gegessen","isst"],"a":0,"why":"mitkommen (movement) + bare infinitive.","tag":"Sprachbausteine"},{"id":"exam035","t":"exam","k":"mc","q":"Ich muss heute lange ___.","c":["arbeiten","zu arbeiten","gearbeitet","arbeite"],"a":0,"why":"Modal verb → bare infinitive.","tag":"Sprachbausteine"},{"id":"exam036","t":"exam","k":"mc","q":"Sie schickt mir das Foto, ___ ich es sehen kann.","c":["damit","um","dass","ohne"],"a":0,"why":"Own subject + conjugated verb → <b>damit</b>.","tag":"Sprachbausteine"},{"id":"exam037","t":"exam","k":"mc","q":"Ich hoffe, dich bald ___.","c":["wiederzusehen","zu wiedersehen","wiedersehen","wiedergesehen"],"a":0,"why":"wiedersehen is separable → <b>wiederzusehen</b>.","tag":"Sprachbausteine"},{"id":"exam038","t":"exam","k":"mc","q":"Es lohnt sich, das Museum ___.","c":["zu besuchen","besuchen","besucht","zu besucht"],"a":0,"why":"es lohnt sich triggers zu; be- is inseparable → <b>zu besuchen</b>.","tag":"Sprachbausteine"},{"id":"exam039","t":"exam","k":"mc","q":"Er lehrt die Kinder ___.","c":["lesen","lesen zu","gelesen","liest"],"a":0,"why":"lehren with a short group → bare infinitive (<i>zu lesen</i> would also pass, but never <i>lesen zu</i> or a participle).","tag":"Sprachbausteine"},{"id":"exam040","t":"exam","k":"mc","q":"Ich helfe dir, das Fahrrad ___.","c":["zu reparieren","zu repariert","repariert","reparierst"],"a":0,"why":"After the comma the group needs zu + Infinitiv; -ieren verbs keep zu as a separate word → <b>zu reparieren</b>.","tag":"Sprachbausteine"},{"id":"exam041","t":"exam","k":"mc","q":"Er spricht langsam, ___ die Kinder ihn verstehen.","c":["damit","um","ohne","statt"],"a":0,"why":"Own subject (die Kinder) + conjugated verb → <b>damit</b>.","tag":"Sprachbausteine"},{"id":"exam042","t":"exam","k":"mc","q":"Sie hat mich ___ überredet, mitzukommen.","c":["dazu","darum","dafür","davon"],"a":0,"why":"überreden <b>zu</b> → <b>dazu</b>.","tag":"Sprachbausteine"},{"id":"exam043","t":"exam","k":"mc","q":"Ich habe Probleme, das ___.","c":["zu verstehen","verstehen","verzustehen","verstanden"],"a":0,"why":"Probleme haben triggers zu; ver- is inseparable → <b>zu verstehen</b>.","tag":"Sprachbausteine"},{"id":"exam044","t":"exam","k":"mc","q":"Wir fahren morgen ___.","c":["einkaufen","einzukaufen","zu einkaufen","eingekauft"],"a":0,"why":"fahren (movement) + bare infinitive.","tag":"Sprachbausteine"}];
const TOPICS = [{"id": "place", "name": "Where zu goes", "desc": "Form the zu-infinitive: separable, inseparable, -ieren, plain."}, {"id": "nozu", "name": "zu or no zu?", "desc": "Modals, werden, movement, perception, lassen, bleiben, helfen / lernen."}, {"id": "comma", "name": "The comma", "desc": "When it is required, optional, or impossible."}, {"id": "trigger", "name": "What triggers zu", "desc": "Verbs, noun + haben / machen / sein, es ist + Adjektiv."}, {"id": "da", "name": "da-words", "desc": "darauf, davor, daran, damit … pointing forward to the group."}, {"id": "umzu", "name": "um … zu / ohne / statt", "desc": "The three connectors, and um … zu versus damit."}, {"id": "order", "name": "Word order", "desc": "Build the sentence with zu + Infinitiv at the end."}, {"id": "special", "name": "scheinen & brauchen", "desc": "Two verbs that take zu but behave like modals."}, {"id": "subject", "name": "Who does it?", "desc": "The infinitive group borrows its subject from the main clause."}, {"id": "spot", "name": "Spot the correct sentence", "desc": "Two versions — only one is right."}, {"id": "trans", "name": "English → German", "desc": "Produce the whole sentence."}, {"id": "exam", "name": "Sprachbausteine", "desc": "Exam-style gap fill with four options."}];
