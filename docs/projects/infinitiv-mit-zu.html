<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F7FA">
<title>Infinitiv mit zu — drill to mastery</title>
<style>
:root{
  --paper:#F5F7FA; --panel:#FFFFFF; --ink:#16213A; --muted:#66718A; --line:#D7DDE6; --line2:#EDF0F4;
  --accent:#0F3F8C; --accent-ink:#FFFFFF; --accent-soft:#E4ECF9;
  --ok:#1C7A4A; --ok-soft:#E3F3EA; --bad:#B4271F; --bad-soft:#FBE7E4; --hint:#9A6700; --hint-soft:#FFF4D6;
  --serif:"Charter","Iowan Old Style","Source Serif Pro","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px; --r-s:6px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 40px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--serif)}
.brand .zu{display:inline-block;background:var(--ink);color:#fff;font-weight:700;font-size:20px;line-height:1;padding:7px 9px 6px;border-radius:var(--r-s);letter-spacing:.02em}
.brand .name{font-size:18px}
.brand .name span{color:var(--muted);font-family:var(--sans);font-size:13px;margin-left:8px}
nav{display:flex;gap:2px}
nav button{padding:8px 12px;border-radius:var(--r-s);color:var(--muted);font-size:15px}
nav button.on{background:var(--ink);color:#fff}
@media (max-width:480px){.brand .name{display:none}nav button{padding:8px 10px;font-size:14px}}

/* generic */
.warn{margin:14px 0 0;padding:12px 14px;background:var(--hint-soft);border:1px solid #F1D48A;border-radius:var(--r);font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;margin-top:16px}
.ptitle{font-family:var(--serif);font-size:20px;margin:0 0 4px}
.psub{color:var(--muted);font-size:14px;margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-s);border:1px solid var(--line);background:#fff;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
small.k{color:var(--muted);font-size:13px}
.hidden{display:none!important}

/* home / modes */
.hero{padding:26px 0 8px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.hero p{color:var(--muted);margin:0;max-width:56ch}
.rail{margin:22px 0 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-family:var(--serif);font-size:18px}
.rail .r{display:grid;grid-template-columns:1fr auto 1.4fr;gap:0 12px;padding:9px 0;border-top:1px solid var(--line2);align-items:baseline}
.rail .r:first-child{border-top:0}
.rail .r .c{color:var(--muted);text-align:center}
.rail .r .g b{color:var(--accent);font-weight:700;border-bottom:2px solid var(--accent);padding-bottom:1px}
@media (max-width:480px){.rail{font-size:16px}.rail .r{grid-template-columns:1fr auto 1.35fr}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:88px;display:flex;flex-direction:column;gap:3px}
.mode:hover{border-color:var(--ink)}
.mode:disabled:hover{border-color:var(--line)}
.mode .t{font-family:var(--serif);font-size:19px}
.mode .d{color:var(--muted);font-size:14px}
.mode .n{margin-top:auto;padding-top:6px;font-size:13px;color:var(--accent)}
.topics{margin-top:22px}
.topics h2{font-family:var(--serif);font-weight:400;font-size:20px;margin:0 0 8px}
.tlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tp{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line);width:100%}
.tp:hover{background:var(--panel)}
.tp .t{font-size:16px}
.tp .d{color:var(--muted);font-size:13px;grid-column:1}
.tp .bar{grid-column:2;grid-row:1;align-self:end;width:96px;height:8px;background:var(--line2);border-radius:4px;overflow:hidden;display:flex}
.tp .bar i{display:block;height:100%}
.tp .bar .m{background:var(--ok)}
.tp .bar .l{background:var(--accent)}
.tp .cnt{grid-column:2;grid-row:2;font-size:12px;color:var(--muted);text-align:right}

/* drill card */
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0 6px;font-size:13px;color:var(--muted)}
.top button{color:var(--muted)}
.prog{height:4px;background:var(--line2);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px 18px;margin-top:14px}
.tag{font-size:13px;color:var(--muted);margin:0 0 10px}
.q{font-family:var(--serif);font-size:24px;line-height:1.4;margin:0 0 18px;letter-spacing:-.005em;overflow-wrap:anywhere}
.q .gap{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);height:1em;vertical-align:-.15em;margin:0 .1em}
.q .hint{color:var(--muted);font-size:.72em;font-family:var(--sans);white-space:nowrap}
.q .pair{display:block;margin-top:6px}
.q .de{display:block}
.q .ans{color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:1px}
.q .ans.bad{color:var(--bad);border-color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
@media (max-width:480px){.q{font-size:21px}}
.entry input{width:100%;font:20px/1.3 var(--serif);padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-s);background:#fff;color:var(--ink)}
.entry input:focus{border-color:var(--accent)}
.entry input.ok{border-color:var(--ok);background:var(--ok-soft)}
.entry input.bad{border-color:var(--bad);background:var(--bad-soft)}
.umlauts{display:flex;gap:6px;margin-top:8px}
.umlauts button{min-width:44px;height:38px;border:1px solid var(--line);border-radius:var(--r-s);background:#fff;font-family:var(--serif);font-size:18px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-s);background:#fff;font-size:16px;line-height:1.4}
.opt .k{width:24px;height:24px;border-radius:12px;border:1px solid var(--line);font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-top:1px}
.opt.de{font-family:var(--serif);font-size:18px}
.opt.sel{border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.built{min-height:56px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:var(--r-s);display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--serif);font-size:19px}
.built.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.built.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.built.flash{border-color:var(--bad)}
.built .ph{color:var(--muted);font-family:var(--sans);font-size:14px}
.poolhint{color:var(--muted);font-size:13px;margin:12px 0 6px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tokb{padding:8px 12px;border:1.5px solid var(--line);border-radius:var(--r-s);background:#fff;font-family:var(--serif);font-size:18px;display:inline-flex;gap:8px;align-items:center}
.tokb .k{font-family:var(--sans);font-size:11px;color:var(--muted)}
.tokb.used{opacity:.3;pointer-events:none}
.built .tokb{border-color:var(--ink)}
.actions{display:flex;gap:10px;margin-top:16px;align-items:center}
.fb{margin-top:16px;padding:14px 16px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--paper);font-size:15px;line-height:1.5}
.fb.ok{border-color:#BFE1CC;background:var(--ok-soft)}
.fb.bad{border-color:#F0C4BE;background:var(--bad-soft)}
.fb.hint{border-color:#F1D48A;background:var(--hint-soft)}
.fb .v{font-weight:600;margin-bottom:4px}
.fb .a{font-family:var(--serif);font-size:18px;margin:2px 0 8px}
.fb .alt{margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.08);color:var(--muted)}
.fb .box{margin-top:8px;font-size:13px;color:var(--muted)}

/* summary */
.sum{text-align:left}
.sum .big{font-family:var(--serif);font-size:44px;line-height:1;margin:6px 0 2px}
.sum .stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.sum .stats b{color:var(--ink);font-weight:600}
.exlist{border-top:1px solid var(--line);margin-top:10px}
.exrow{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.exrow .s{font-family:var(--serif);font-size:17px}
.exrow .y{color:var(--bad)}
.exrow .g{color:var(--ok)}
.exrow .w{color:var(--muted);font-size:14px;margin-top:2px}

/* progress */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:26px;font-weight:400}
.stat span{color:var(--muted);font-size:13px}
@media (max-width:480px){.stat{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:500;padding:6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 0;border-bottom:1px solid var(--line2);vertical-align:top}
td.de{font-family:var(--serif);font-size:15px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin:6px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* rules */
.rules h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:26px 0 8px}
.rules h3{font-size:15px;font-weight:600;margin:16px 0 6px}
.rules p{margin:0 0 8px}
.rules td.de,.rules th{padding-right:12px}
.rules .ex{font-family:var(--serif);font-size:16px}
.rules ul{margin:0 0 10px;padding-left:20px}
.rules li{margin:2px 0}
.rules .note{background:var(--accent-soft);border-radius:var(--r-s);padding:10px 12px;margin:8px 0 12px;font-size:14px}
footer{margin-top:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><span class="zu">zu</span><span class="name">Infinitiv mit zu<span>German B1</span></span></div>
  <nav>
    <button id="nav-home" onclick="go('home')" class="on">Practice</button>
    <button id="nav-rules" onclick="go('rules')">Rules</button>
    <button id="nav-stats" onclick="go('stats')">Progress</button>
  </nav>
</header>
<div id="storagewarn"></div>
<main id="view"></main>
<footer>Built from your notes on Infinitiv mit zu. Progress stays in this browser.</footer>
</div>

he trigger"},{"id":"trig009","t":"trigger","k":"cloze","q":"Es ist ___ (difficult), früh aufzustehen.","a":"schwer","why":"<b>Es ist + Adjektiv</b>: schwer or schwierig both work.","tag":"Complete the trigger","alt":["schwierig"]},{"id":"trig010","t":"trigger","k":"cloze","q":"Es ist ___ (easy), diese App zu benutzen.","a":"leicht","why":"<b>Es ist + Adjektiv</b>: leicht or einfach both work.","tag":"Complete the trigger","alt":["einfach"]},{"id":"trig011","t":"trigger","k":"cloze","q":"Es ist ___ (possible), online teilzunehmen.","a":"möglich","why":"<b>Es ist + Adjektiv</b> announces the infinitive group.","tag":"Complete the trigger"},{"id":"trig012","t":"trigger","k":"cloze","q":"Es ist ___ (necessary), einen Termin zu machen.","a":"nötig","why":"<b>Es ist + Adjektiv</b>: nötig or notwendig both work.","tag":"Complete the trigger","alt":["notwendig"]},{"id":"trig013","t":"trigger","k":"cloze","q":"Es ist ___ (allowed), hier zu parken.","a":"erlaubt","why":"<b>Es ist + Adjektiv</b> announces the infinitive group.","tag":"Complete the trigger"},{"id":"trig014","t":"trigger","k":"cloze","q":"Es ist ___ (boring), immer dasselbe zu tun.","a":"langweilig","why":"<b>Es ist + Adjektiv</b> announces the infinitive group.","tag":"Complete the trigger"},{"id":"trig015","t":"trigger","k":"cloze","q":"Es ist ___ (interesting), andere Kulturen kennenzulernen.","a":"interessant","why":"<b>Es ist + Adjektiv</b> announces the infinitive group.","tag":"Complete the trigger"},{"id":"trig016","t":"trigger","k":"cloze","q":"Ich habe die ___ (chance), in Berlin zu arbeiten.","a":"Chance","why":"<b>die Chance / Möglichkeit / Gelegenheit haben</b> are noun triggers.","tag":"Complete the trigger","alt":["Möglichkeit","Gelegenheit"]},{"id":"trig017","t":"trigger","k":"cloze","q":"Ich habe ___ (problems), diesen Text zu verstehen.","a":"Probleme","why":"<b>Probleme / Schwierigkeiten haben</b> are noun triggers.","tag":"Complete the trigger","alt":["Schwierigkeiten"]},{"id":"trig018","t":"trigger","k":"cloze","q":"Ich habe ___ (forgotten), dich anzurufen.","a":"vergessen","why":"<b>vergessen</b> belongs to the trying / managing group of trigger verbs.","tag":"Complete the trigger"},{"id":"trig019","t":"trigger","k":"cloze","q":"Sie ___ (recommends — empfehlen) mir, mehr zu lesen.","a":"empfiehlt","why":"<b>empfehlen</b> (influencing someone) triggers zu + Infinitiv; the person is in the dative.","tag":"Complete the trigger"},{"id":"trig020","t":"trigger","k":"cloze","q":"Er ___ (promises — versprechen), pünktlich zu kommen.","a":"verspricht","why":"<b>versprechen</b> (saying / promising) triggers zu + Infinitiv.","tag":"Complete the trigger"},{"id":"trig021","t":"trigger","k":"cloze","q":"Wir haben ___ (intend — vorhaben), nach Wien zu fahren.","a":"vor","why":"<b>vorhaben</b> is separable in the main clause: Wir haben <b>vor</b>, … zu fahren.","tag":"Complete the trigger"},{"id":"trig022","t":"trigger","k":"cloze","q":"Ich ___ (try — versuchen), jeden Tag Deutsch zu lernen.","a":"versuche","why":"<b>versuchen</b> (trying / managing) triggers zu + Infinitiv.","tag":"Complete the trigger"},{"id":"trig023","t":"trigger","k":"cloze","q":"Er hat ___ (stopped — aufhören), zu rauchen.","a":"aufgehört","why":"<b>aufhören</b> (beginning / ending) triggers zu + Infinitiv. Perfekt: hat aufgehört.","tag":"Complete the trigger"},{"id":"trig024","t":"trigger","k":"cloze","q":"Sie hat ___ (begun — anfangen), Yoga zu machen.","a":"angefangen","why":"<b>anfangen</b> (beginning / ending) triggers zu + Infinitiv. Perfekt: hat angefangen.","tag":"Complete the trigger"},{"id":"trig025","t":"trigger","k":"cloze","q":"Es ___ (succeeds — gelingen) mir nicht, das Rätsel zu lösen.","a":"gelingt","why":"<b>es gelingt mir</b> (managing) triggers zu + Infinitiv; the person is in the dative.","tag":"Complete the trigger"},{"id":"trig026","t":"trigger","k":"cloze","q":"Er ___ (refuses — sich weigern) sich, das Formular auszufüllen.","a":"weigert","why":"<b>sich weigern</b> (sayin
