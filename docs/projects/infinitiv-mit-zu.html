<script>
'use strict';
/*ENGINE-START*/
const INTERVALS = [0, 0, 1, 3, 7, 16, 35];   // days until next review, indexed by the box the item lands in
const MAX_BOX = 6, MASTER = 5, DROP = 2;
const NEW_PER_SESSION = 20, REVIEW_CAP = 40, TOPIC_CAP = 30, WEAK_CAP = 25, EXAM_N = 30;
const DAY = 86400000;

function fold(s) {
  return String(s == null ? '' : s).toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[.,!?;:…"„“”'’‘`()\[\]]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function grade(item, response) {
  // returns {ok, alt} — alt is the accepted-alternative note if one applied
  // match is the accepted form in canonical spelling (so a transliterated 'muede' is shown back as 'müde')
  if (item.k === 'mc') return { ok: response === item.a, alt: null, match: null };
  const r = fold(item.k === 'order' ? (response || []).join(' ') : response);
  if (!r) return { ok: false, alt: null, match: null };
  if (r === fold(item.a)) return { ok: true, alt: null, match: item.a };
  for (const a of item.alt || []) if (r === fold(a)) return { ok: true, alt: item.altWhy || null, match: a };
  return { ok: false, alt: null, match: null };
}
function blankState() { return { v: 1, items: {}, days: {} }; }
function st(state, id) { return state.items[id] || (state.items[id] = { b: 0, due: 0, n: 0, w: 0 }); }
function isMastered(s) { return !!s && s.b >= MASTER; }
function isDue(s, now) { return !!s && s.n > 0 && s.due <= now; }
function isNew(s) { return !s || s.n === 0; }
function applyResult(state, id, ok, opts, now) {
  // opts: {promote:true|false}  — hint / retry answers don't promote
  const s = st(state, id);
  s.n += 1; s.last = now;
  if (ok) {
    if (opts.promote) s.b = Math.min(MAX_BOX, s.b + 1);
    s.due = now + INTERVALS[s.b] * DAY;
  } else {
    s.w += 1; s.b = Math.max(0, s.b - DROP); s.due = now;
  }
  const d = new Date(now); const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const day = state.days[key] || (state.days[key] = { n: 0, ok: 0 });
  day.n += 1; if (ok) day.ok += 1;
  return s;
}
function shuffle(arr, rnd) { rnd = rnd || Math.random; const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildQueue(items, state, mode, now, rnd) {
  rnd = rnd || Math.random;
  const S = id => state.items[id];
  if (mode === 'review') {
    const due = items.filter(i => isDue(S(i.id), now)).sort((a, b) => (S(a.id).b - S(b.id).b) || (S(a.id).due - S(b.id).due));
    const fresh = shuffle(items.filter(i => isNew(S(i.id))), rnd).slice(0, NEW_PER_SESSION);
    return shuffle(due.slice(0, REVIEW_CAP), rnd).concat(fresh.slice(0, Math.max(0, REVIEW_CAP - Math.min(due.length, REVIEW_CAP)))).map(i => i.id);
  }
  if (mode === 'weak') {
    return items.filter(i => S(i.id) && S(i.id).w > 0 && !isMastered(S(i.id)))
      .sort((a, b) => (S(b.id).w - S(a.id).w) || (S(a.id).b - S(b.id).b)).slice(0, WEAK_CAP).map(i => i.id);
  }
  if (mode === 'exam') return shuffle(items, rnd).slice(0, EXAM_N).map(i => i.id);
  if (mode.startsWith('topic:')) {
    const t = mode.slice(6);
    const pool = items.filter(i => i.t === t);
    const rank = i => { const s = S(i.id); if (!s || s.n === 0) return 1; if (isMastered(s)) return 3; return s.due <= now ? 0 : 2; };
    const withKey = shuffle(pool, rnd).map(i => ({ i, r: rank(i), b: S(i.id) ? S(i.id).b : 0 }));
    withKey.sort((x, y) => (x.r - y.r) || (x.b - y.b));
    return withKey.slice(0, TOPIC_CAP).map(x => x.i.id);
  }
  return [];
}
function summary(items, state, now) {
  const out = { total: items.length, mastered: 0, learning: 0, fresh: 0, due: 0, byTopic: {} };
  for (const i of items) {
    const s = state.items[i.id];
    const t = out.byTopic[i.t] || (out.byTopic[i.t] = { total: 0, mastered: 0, learning: 0, fresh: 0, due: 0 });
    t.total++;
    if (isNew(s)) { out.fresh++; t.fresh++; }
    else if (isMastered(s)) { out.mastered++; t.mastered++; }
    else { out.learning++; t.learning++; }
    if (isDue(s, now)) { out.due++; t.due++; }
  }
  return out;
}
/*ENGINE-END*/

const KEY = 'zu-infinitiv:v1';
let persistent = true;
const mem = {};
function storageGet() { try { return localStorage.getItem(KEY); } catch (e) { persistent = false; return mem[KEY] || null; } }
function storageSet(v) { try { localStorage.setItem(KEY, v); const back = localStorage.getItem(KEY); if (back !== v) throw 0; } catch (e) { persistent = false; mem[KEY] = v; } }

// ------------------------------------------------------------ helpers

// ------------------------------------------------------------ session
let ses = null;
function startSession(mode) {
  const q = buildQueue(ITEMS, state, mode, now());
  if (!q.length) { renderHome(); return; }
  ses = { mode, q, total: q.length, asked: 0, ok: 0, wrong: 0, promoted: 0, mastered: 0, hinted: false, retry: {}, answered: false, sel: null, built: [], results: [], exam: mode === 'exam' };
  renderCard();
}
function current() { return byId[ses.q[0]]; }
function renderCard() {
  el('storagewarn').innerHTML = '';
  if (!ses.q.length) { renderSummary(); return; }
  const item = current();
  const s = state.items[item.id];
  const pct = 100 * ses.asked / (ses.asked + ses.q.length);
  const label = ses.mode === 'review' ? 'Review' : ses.mode === 'weak' ? 'Weak spots' : ses.mode === 'exam' ? 'Exam run' : topicName[ses.mode.slice(6)];
  let entry = '';
  if (item.k === 'cloze') {
    entry = `<div class="entry"><input id="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${item.long ? 'Whole sentence' : 'Your answer'}" aria-label="Your answer">
      <div class="umlauts">${['ä', 'ö', 'ü', 'ß'].map(c => `<button type="button" onclick="insertChar('${c}')" tabindex="-1">${c}</button>`).join('')}</div></div>`;
  } else if (item.k === 'mc') {
    const order = item.fixed ? item.c.map((_, i) => i) : shuffle(item.c.map((_, i) => i));
    ses.order = order;
    entry = `<div class="opts">${order.map((ci, n) => `<button class="opt${/[äöüß]|\b(zu|ich|er|sie|du|es|wir|ihr)\b/i.test(item.c[ci]) && item.t !== 'comma' && item.t !== 'subject' ? ' de' : ''}" data-ci="${ci}" onclick="pick(${ci})"><span class="k">${n + 1}</span><span>${esc(item.c[ci])}</span></button>`).join('')}</div>`;
  } else {
    ses.pool = shuffle(item.tok.map((t, i) => ({ t, i })));
    ses.built = [];
    entry = `<div class="built" id="built"><span class="ph">Tap the blocks in order — or press their number keys.</span></div>
      <div class="poolhint">Blocks</div><div class="pool" id="pool"></div>`;
  }
  el('view').innerHTML = `
  <div class="top"><span>${esc(label)} · ${ses.asked + 1} of ${ses.asked + ses.q.length}${ses.exam ? '' : ' · ' + boxLabel(s ? s.b : 0)}</span><button onclick="quitSession()">Quit</button></div>
  <div class="prog"><i style="width:${pct}%"></i></div>
  <div class="card">
    <p class="tag">${esc(item.tag)}</p>
    <p class="q" id="q">${renderPrompt(item)}</p>
    ${entry}
    <div class="actions" id="actions">
      ${ses.exam ? '' : '<button class="btn quiet" id="hintbtn" onclick="hint()">Hint</button>'}
      <span class="spacer"></span>
      ${item.k === 'order' ? '<button class="btn" onclick="undoTok()">Undo</button>' : ''}
      <button class="btn primary" id="checkbtn" onclick="check()">Check</button>
    </div>
    <div id="fb"></div>
  </div>`;
  ses.answered = false; ses.sel = null; ses.hinted = false;

}
function insertChar(c) {
  const i = el('inp'); if (!i) return;
  const a = i.selectionStart, b = i.selectionEnd;
  i.value = i.value.slice(0, a) + c + i.value.slice(b);
  i.setSelectionRange(a + 1, a + 1); i.focus();
}
function pick(ci) {

  ses.sel = ci;

}
function renderPool() {
  const item = current();
  el('pool').innerHTML = ses.pool.map((p, n) => `<button class="tokb${ses.built.includes(p.i) ? ' used' : ''}" onclick="addTok(${p.i})" data-i="${p.i}"><span class="k">${n + 1}</span>${esc(p.t)}</button>`).join('');
  const b = el('built');
  b.innerHTML = ses.built.length ? ses.built.map((i, n) => `<button class="tokb" onclick="removeTok(${n})">${esc(n === 0 ? item.tok[i][0].toUpperCase() + item.tok[i].slice(1) : item.tok[i])}</button>`).join('') : '<span class="ph">Tap the blocks in order — or press their number keys.</span>';

  el('fb').innerHTML = `<div class="fb hint"><div class="v">Hint — this one will not move up a box</div><div class="a">${esc(ans)}</div>${item.why}</div>`;
  el('hintbtn').disabled = true;
  if (item.k === 'cloze') el('inp').focus();
}
function responseOf(item) {

}
function check() {

  } else {
    el('built').classList.add(g.ok ? 'ok' : 'bad');

  else boxNote = 'Back to ' + boxLabel(s.b) + ' — it comes round again in a moment.';
  el('fb').innerHTML = `<div class="fb ${g.ok ? 'ok' : 'bad'}">
    <div class="v">${g.ok ? 'Correct' : 'Not quite'}</div>
    ${g.ok && !g.alt && item.k !== 'mc' ? '' : `<div class="a">${esc(ans)}</div>`}
    ${item.why}
    ${g.alt ? `<div class="alt">${g.alt}</div>` : ''}

}
function next() { renderCard(); }
function quitSession() { if (ses.asked && !confirm('Leave this round? Answered questions are already saved.')) return; ses = null; go('home'); }
function renderSummary() {
  const label = ses.mode === 'review' ? 'Review' : ses.mode === 'weak' ? 'Weak spots' : ses.mode === 'exam' ? 'Exam run' : topicName[ses.mode.slice(6)];
  const misses = ses.results.filter(r => !r.ok);
  const sm = summary(ITEMS, state, now());
  let list = '';
  if (ses.exam) {
    list = `<div class="exlist">${ses.results.map(r => {
      const it = byId[r.id]; const ans = it.k === 'mc' ? it.c[it.a] : it.a;
      const yours = it.k === 'mc' ? it.c[r.resp] : (it.k === 'order' ? r.resp.join(' ') : r.resp);
      return `<div class="exrow"><div class="s">${it.k === 'order' ? esc(ans) : renderPrompt(it, { text: ans })}</div>
        ${r.ok ? `<div class="g">✓ ${esc(yours)}</div>` : `<div class="y">✗ ${esc(yours)}</div><div class="g">✓ ${esc(ans)}</div>`}

  } else if (misses.length) {
    const seen = new Set();
    list = `<div class="psub" style="margin-top:14px">Missed this round</div><div class="exlist">${misses.filter(r => !seen.has(r.id) && seen.add(r.id)).map(r => {
      const it = byId[r.id]; const ans = it.k === 'mc' ? it.c[it.a] : it.a;
      return `<div class="exrow"><div class="s">${it.k === 'cloze' && !it.long ? renderPrompt(it, { text: ans }) : esc(ans)}</div><div class="w">${it.why}</div></div>`;

    <div class="stats"><span><b>${ses.ok}</b> correct</span><span><b>${ses.wrong}</b> wrong</span>${ses.exam ? '' : `<span><b>${ses.promoted}</b> moved up</span><span><b>${ses.mastered}</b> newly mastered</span>`}<span><b>${sm.mastered}/${sm.total}</b> mastered overall</span></div>
    <div class="row"><button class="btn primary" onclick="startSession('${ses.mode}')">Another round</button><button class="btn" onclick="go('home')">Back to practice</button></div>

}

// ------------------------------------------------------------ keyboard
document.addEventListener('keydown', e => {
  if (!ses || view !== 'home') return;
  const item = current(); if (!item) return;
  if (e.key === 'Enter') {
    // let a focused button (Hint, Undo, an option, a token) act as a button; everything else submits
    if (e.target && e.target.tagName === 'BUTTON' && e.target.id !== 'checkbtn') return;
    e.preventDefault(); check(); return;
  }
  const inInput = e.target && e.target.tagName === 'INPUT';
  if (inInput) return;
  if (ses.answered) return;
  if (item.k === 'mc' && /^[1-9]$/.test(e.key)) { const n = +e.key - 1; if (ses.order && n < ses.order.length) pick(ses.order[n]); }
  if (item.k === 'order') {
    if (/^[1-9]$/.test(e.key)) { const n = +e.key - 1; if (n < ses.pool.length) addTok(ses.pool[n].i); }
    if (e.key === 'Backspace') { e.preventDefault(); undoTok(); }
  }
});

    <div class="tlist">${TOPICS.map(tp => { const s = sm.byTopic[tp.id]; return `<button class="tp" onclick="startSession('topic:${tp.id}')"><span class="t">${esc(tp.name)}</span><span class="bar"><i class="m" style="width:${100 * s.mastered / s.total}%"></i><i class="l" style="width:${100 * s.learning / s.total}%"></i></span><span class="d">${s.mastered} mastered · ${s.learning} learning · ${s.fresh} new${s.due ? ' · ' + s.due + ' due' : ''}</span><span class="cnt">${s.total}</span></button>`; }).join('')}</div>
  </div>

    <table><tr><th>Box</th><th>Questions</th><th>Next gap</th></tr>${boxes.map((n, b) => `<tr><td>${b === 0 ? 'new / reset' : b}</td><td>${n}</td><td>${INTERVALS[b] ? INTERVALS[b] + ' d' : 'now'}${b >= MASTER ? ' · mastered' : ''}</td></tr>`).join('')}</table>
  </div>
  ${missed.length ? `<div class="panel"><div class="ptitle">Most-missed questions</div><div class="psub">The ones that have cost you the most.</div>
    <table><tr><th>Question</th><th>Answer</th><th>Missed</th></tr>${missed.map(x => `<tr><td class="de">${x.i.k === 'cloze' && !x.i.long ? renderPrompt(x.i) : esc(x.i.k === 'order' ? 'Word order' : x.i.q.replace(/<[^>]+>/g, ' '))}</td><td class="de">${esc(x.i.k === 'mc' ? x.i.c[x.i.a] : x.i.a)}</td><td>${x.s.w}</td></tr>`).join('')}</table></div>` : ''}
  <div class="panel">
    <div class="ptitle">Back up progress</div>
    <div class="psub">${persistent ? 'Everything lives in this browser\u2019s localStorage.' : 'Storage is blocked here \u2014 download the file and open it directly.'} Export a copy before switching devices or browsers.</div>
    <div class="row"><button class="btn" onclick="exportJSON()">Export</button><button class="btn" onclick="el('imp').click()">Import</button><input id="imp" type="file" accept="application/json" class="hidden" onchange="importJSON(this)"><span class="spacer"></span><button class="btn quiet" onclick="resetAll()">Reset</button></div>
  </div>`;
}

// ------------------------------------------------------------ rules (regenerated from the item data)
function renderRules() {

  const exs = (arr, n) => arr.slice(0, n).map(i => `<span class="ex">${esc(i.a)}</span>`).join(', ');
  const daPairs = {}; for (const i of ITEMS) if (i.t === 'da') { const m = i.why.match(/<b>(.+?) \+ (\w+)<\/b> → <b>(\w+)<\/b>/); if (m && !daPairs[m[1]]) daPairs[m[1]] = [m[2], m[3]]; }
  el('view').innerHTML = `<div class="rules">
  <h2>The shape</h2>
  <p>When a sentence has a second verb that is not a modal and not the Futur auxiliary, that verb usually appears as <b>zu + Infinitiv at the very end</b> of its clause.</p>
  <table><tr><th>Main clause</th><th></th><th>Infinitive group → ends with zu + Infinitiv</th></tr>
  <tr><td class="de">Ich versuche</td><td>,</td><td class="de">jeden Tag Deutsch <b>zu lernen</b>.</td></tr>
  <tr><td class="de">Es macht Spaß</td><td>,</td><td class="de">mit dir <b>zu reden</b>.</td></tr>
  <tr><td class="de">Wir haben vor</td><td>,</td><td class="de">im Sommer nach Wien <b>zu fahren</b>.</td></tr></table>
  <ul style="margin-top:10px"><li>The zu-infinitive is always last.</li><li>The group has no subject of its own — it borrows one from the main clause: <span class="ex">Ich verspreche dir, zu kommen</span> → <i>ich</i> come. <span class="ex">Ich bitte dich, zu kommen</span> → <i>du</i> come.</li></ul>

  <h2>Where zu goes</h2>
  <table><tr><th>Verb type</th><th>Rule</th><th>Examples from the drill</th></tr>
  <tr><td>Plain verb</td><td>separate word</td><td>${exs(cat.simple, 4)}</td></tr>
  <tr><td>Separable verb</td><td>one word, zu inside</td><td>${exs(cat.sep, 5)}</td></tr>
  <tr><td>Inseparable verb (be-, ge-, er-, ver-, ent-, emp-)</td><td>separate word</td><td>${exs(cat.insep, 4)}</td></tr>
  <tr><td>Verb in -ieren</td><td>separate word</td><td>${exs(cat.ieren, 4)}</td></tr>
  <tr><td>Two-word verb</td><td>zu between the words</td><td>${exs(cat.two, 4)}</td></tr></table>
  <div class="note">Traps: <b>wiederholen</b> (repeat), <b>übersetzen</b> (translate), <b>unterschreiben</b>, <b>sich überlegen</b> are inseparable → zu wiederholen, zu übersetzen, zu unterschreiben, zu überlegen. But <b>umziehen</b>, <b>wiedersehen</b>, <b>kennenlernen</b> are separable → umzuziehen, wiederzusehen, kennenzulernen.</div>

  <h2>When there is no zu</h2>
  <table><tr><th>Group</th><th>Verbs</th><th>Example</th></tr>
  <tr><td>Modal verbs</td><td>können, müssen, dürfen, sollen, wollen, möchten</td><td class="de">Ich muss <b>arbeiten</b>.</td></tr>
  <tr><td>Futur</td><td>werden</td><td class="de">Ich werde <b>arbeiten</b>.</td></tr>
  <tr><td>Movement</td><td>gehen, fahren, kommen</td><td class="de">Ich gehe <b>schwimmen</b>. Er kommt uns <b>besuchen</b>.</td></tr>
  <tr><td>Perception</td><td>sehen, hören, fühlen, spüren</td><td class="de">Ich höre sie <b>singen</b>. Ich sehe ihn <b>kommen</b>.</td></tr>
  <tr><td>lassen</td><td>lassen</td><td class="de">Ich lasse mein Auto <b>reparieren</b>.</td></tr>
  <tr><td>bleiben</td><td>bleiben</td><td class="de">Er bleibt <b>sitzen</b> / <b>stehen</b> / <b>liegen</b>.</td></tr></table>
  <h3>Both possible: helfen, lernen, lehren</h3>
  <ul><li>Short group → no zu: <span class="ex">Ich helfe dir tragen. Ich lerne schwimmen.</span></li>
  <li>Longer group → zu and a comma: <span class="ex">Ich helfe dir, den schweren Koffer zu tragen.</span></li></ul>

  <h2>What triggers zu + Infinitiv</h2>
  <h3>Verbs</h3>
  <table><tr><th>Meaning group</th><th>Verbs</th></tr>
  <tr><td>Beginning / ending</td><td>anfangen, beginnen, aufhören</td></tr>
  <tr><td>Trying / managing</td><td>versuchen, schaffen, gelingen (es gelingt mir), vergessen</td></tr>
  <tr><td>Planning / intending</td><td>vorhaben, planen, beabsichtigen, beschließen, sich entscheiden</td></tr>
  <tr><td>Hoping / fearing</td><td>hoffen, sich freuen, Angst haben, träumen</td></tr>
  <tr><td>Saying / promising</td><td>versprechen, vorschlagen, behaupten, sich weigern</td></tr>
  <tr><td>Influencing someone</td><td>bitten, empfehlen, raten, erlauben, verbieten, helfen</td></tr>
  <tr><td>Opinion</td><td>glauben, meinen</td></tr></table>
  <h3>Noun + haben / machen / sein</h3>
  <p>Lust haben · Zeit haben · Angst haben · (keine) Chance / Möglichkeit / Idee haben · Probleme haben · Spaß machen · Zeit sein</p>
  <p class="ex">Hast du <b>Lust</b>, ins Kino zu gehen? Es macht <b>Spaß</b>, Deutsch zu lernen. Es ist <b>Zeit</b>, nach Hause zu gehen.</p>
  <h3>Es ist + Adjektiv</h3>
  <p>wichtig · schwer / schwierig · leicht / einfach · schön · gut · gesund · verboten · erlaubt · möglich · nötig · interessant · langweilig</p>
  <p class="ex"><b>Es ist wichtig</b>, jeden Tag zu üben. <b>Es ist verboten</b>, hier zu rauchen.</p>
  <h3>Verbs with a fixed preposition → da-word</h3>
  <p>The da-word stands in the main clause and points forward to the infinitive group. Before a vowel it is <b>dar-</b> (darauf, daran, darüber, darum), otherwise <b>da-</b> (damit, davon, davor, dafür, dazu).</p>
  <table><tr><th>Verb</th><th>Preposition</th><th>da-word</th></tr>${Object.keys(daPairs).map(v => `<tr><td>${esc(v)}</td><td>${daPairs[v][0]}</td><td><b>${daPairs[v][1]}</b></td></tr>`).join('')}</table>
  <p class="ex" style="margin-top:8px">Ich freue mich <b>darauf</b>, dich zu sehen. Er hat Angst <b>davor</b>, allein zu bleiben. Denk <b>daran</b>, das Fenster zuzumachen! Hör <b>damit</b> auf, so laut zu sein!</p>
  <h3>Two special verbs: no comma, no extra words</h3>
  <table><tr><th>Verb</th><th>Meaning</th><th>Example</th></tr>
  <tr><td><b>scheinen</b> + zu</td><td>seems to</td><td class="de">Er <b>scheint</b> krank <b>zu sein</b>.</td></tr>
  <tr><td><b>brauchen</b> + nicht / nur / kein + zu</td><td>needn't / only has to</td><td class="de">Du <b>brauchst</b> heute nicht <b>zu kommen</b>. Du <b>brauchst</b> nur <b>anzurufen</b>.</td></tr></table>
  <div class="note">nicht brauchen … zu = nicht müssen (no necessity) — not nicht dürfen (prohibition).</div>

  <h2>The comma</h2>
  <p>The comma is <b>required</b> when the infinitive group</p>
  <ul><li>starts with <b>um / ohne / (an)statt / als / außer</b> → <span class="ex">Ich lerne, <b>um</b> die Prüfung zu bestehen.</span></li>
  <li>depends on a <b>noun</b> (Lust, Zeit, Angst, Chance …) → <span class="ex">Ich habe keine Zeit<b>,</b> dich zu besuchen.</span></li>
  <li>is announced by <b>es</b> or a <b>da-word</b> → <span class="ex">Ich freue mich darauf<b>,</b> dich zu sehen.</span></li></ul>
  <p>Otherwise it is <b>optional</b>: <span class="ex">Ich versuche(,) jeden Tag Deutsch zu lernen.</span> After scheinen / brauchen there is never a comma.</p>
  <div class="note">For the exam: always write the comma. It is never wrong.</div>

  <h2>um … zu / ohne … zu / (an)statt … zu</h2>
  <p>These replace a subordinate clause. The connector goes <b>first</b> in the group, zu + Infinitiv <b>last</b>. The subject of the group is the subject of the main clause.</p>
  <table><tr><th>Structure</th><th>Meaning</th><th>Example</th></tr>
  <tr><td>um … zu</td><td>purpose (in order to)</td><td class="de">Ich lerne Deutsch, <b>um</b> in Wien <b>zu studieren</b>.</td></tr>
  <tr><td>ohne … zu</td><td>without doing</td><td class="de">Er ging weg, <b>ohne</b> sich <b>zu verabschieden</b>.</td></tr>
  <tr><td>(an)statt … zu</td><td>instead of doing</td><td class="de"><b>Statt zu arbeiten</b>, spielt er Computerspiele.</td></tr></table>
  <h3>um … zu versus damit — the decisive test</h3>
  <table><tr><th>Subject</th><th>Use</th><th>Example</th></tr>
  <tr><td>same in both parts</td><td><b>um … zu</b> (or damit)</td><td class="de"><b>Ich</b> spare Geld, <b>um</b> ein Auto <b>zu kaufen</b>.</td></tr>
  <tr><td>different subjects</td><td><b>damit</b> only</td><td class="de"><b>Ich</b> gebe dir Geld, <b>damit du</b> ein Eis kaufst.</td></tr></table>
  <p>A damit-clause keeps its own subject and a conjugated verb at the end; an um-group has neither.</p>
  </div>`;
}
